<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">Smart Search indexing and query pipeline</title>
  <desc id="d">Content changes and the finder:index command feed Smart Search plugins, which hand items to the indexer; the indexer writes terms, taxonomy and content maps to the index tables; filters, module and menu item query those tables to show results.</desc>
  <style>
    text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2933}
    .b{fill:#eef3f8;stroke:#3b5b7a;stroke-width:1.5}
    .i{fill:#fff4dc;stroke:#a8741a;stroke-width:1.5}
    .o{fill:#e6f4ea;stroke:#2f7d4a;stroke-width:1.5}
    .h{font-weight:bold}
    .a{stroke:#3b5b7a;stroke-width:1.5;fill:none;marker-end:url(#m)}
    .s{font-size:11px;fill:#52606d}
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b7a"/></marker></defs>
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="20" y="26" class="h">Indexing (write path)</text>
  <rect class="b" x="20" y="40" width="150" height="56" rx="6"/><text x="95" y="63" text-anchor="middle">Save an article</text><text x="95" y="82" text-anchor="middle" class="s">onFinderAfterSave</text>
  <rect class="b" x="20" y="110" width="150" height="56" rx="6"/><text x="95" y="133" text-anchor="middle">finder:index (CLI)</text><text x="95" y="152" text-anchor="middle" class="s">cron or manual</text>
  <rect class="b" x="20" y="180" width="150" height="56" rx="6"/><text x="95" y="203" text-anchor="middle">Index button</text><text x="95" y="222" text-anchor="middle" class="s">administrator, AJAX batches</text>
  <rect class="i" x="250" y="90" width="150" height="90" rx="6"/><text x="325" y="118" text-anchor="middle" class="h">Finder plugins</text><text x="325" y="138" text-anchor="middle" class="s">content, categories, tags,</text><text x="325" y="153" text-anchor="middle" class="s">contacts, newsfeeds</text><text x="325" y="168" text-anchor="middle" class="s">Result + taxonomies</text>
  <rect class="i" x="480" y="90" width="120" height="90" rx="6"/><text x="540" y="122" text-anchor="middle" class="h">Indexer</text><text x="540" y="142" text-anchor="middle" class="s">tokenise, stem,</text><text x="540" y="157" text-anchor="middle" class="s">weight, store</text>
  <rect class="o" x="640" y="70" width="100" height="130" rx="6"/><text x="690" y="98" text-anchor="middle" class="h">Index tables</text><text x="690" y="120" text-anchor="middle" class="s">links, terms,</text><text x="690" y="135" text-anchor="middle" class="s">taxonomy,</text><text x="690" y="150" text-anchor="middle" class="s">content maps,</text><text x="690" y="165" text-anchor="middle" class="s">filters</text>
  <path class="a" d="M170 68 L210 68 L210 125 L250 125"/>
  <path class="a" d="M170 138 L250 138"/>
  <path class="a" d="M170 208 L210 208 L210 152 L250 152"/>
  <path class="a" d="M400 135 L480 135"/>
  <path class="a" d="M600 135 L640 135"/>
  <text x="20" y="276" class="h">Querying (read path)</text>
  <rect class="b" x="20" y="286" width="150" height="34" rx="6"/><text x="95" y="308" text-anchor="middle">Module or menu item</text>
  <rect class="b" x="250" y="286" width="150" height="34" rx="6"/><text x="325" y="308" text-anchor="middle">Query + filter</text>
  <rect class="b" x="480" y="286" width="120" height="34" rx="6"/><text x="540" y="308" text-anchor="middle">Ranked results</text>
  <path class="a" d="M170 303 L250 303"/><path class="a" d="M400 303 L480 303"/>
  <path d="M690 200 L690 255 L325 255 L325 286" stroke="#2f7d4a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#m)"/>
</svg>
