<title id="cves-ecosystem-t">CVEs per year, ecosystem and keyword search</title>
<desc id="cves-ecosystem-d">CVEs published per year in the NVD that mention WordPress (plugins and themes, by keyword), Drupal (vendor CPE), Joomla, TYPO3 (extensions) and Wagtail (by keyword), 2015 to 2026 year to date. CNAs that issue CVEs for WordPress plugins in bulk drive the WordPress keyword series. Keyword searches also match unrelated mentions.</desc>
