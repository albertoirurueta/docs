<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Prefill vs. decode on one request</title>
  <rect x="0" y="0" width="900" height="360" fill="#f8fafc"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Prefill vs. decode on one request</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#334155">one long compute-bound pass over the prompt, then one short memory-bound pass per output token</text>
  <line x1="60" y1="200" x2="860" y2="200" stroke="#334155" stroke-width="2"/>
  <polygon points="860,195 872,200 860,205" fill="#334155"/>
  <text x="866" y="224" text-anchor="end" font-size="12" fill="#334155">time</text>
  <text x="60" y="224" text-anchor="middle" font-size="12" fill="#334155">t0: request sent</text>
  <rect x="60" y="130" width="300" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="210" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Prefill</text>
  <text x="210" y="176" text-anchor="middle" font-size="12" fill="#1e3a8a">all n_in prompt tokens in one pass (compute-bound)</text>
  <rect x="366" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="397" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="428" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="459" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="490" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="521" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="552" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="583" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="614" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="645" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="676" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="707" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="738" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="769" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="800" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="831" y="150" width="26" height="40" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="610" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">Decode</text>
  <text x="610" y="120" text-anchor="middle" font-size="12" fill="#78350f">one token per pass, reading all active weights + KV cache (bandwidth-bound)</text>
  <line x1="366" y1="96" x2="366" y2="250" stroke="#0f172a" stroke-dasharray="5,4" stroke-width="1.5"/>
  <text x="372" y="92" font-size="12" fill="#0f172a">t1: first token</text>
  <line x1="60" y1="262" x2="366" y2="262" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="60" y1="256" x2="60" y2="268" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="366" y1="256" x2="366" y2="268" stroke="#1d4ed8" stroke-width="2"/>
  <text x="213" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">TTFT (grows with prompt length)</text>
  <line x1="397" y1="232" x2="428" y2="232" stroke="#b45309" stroke-width="2"/>
  <line x1="397" y1="226" x2="397" y2="238" stroke="#b45309" stroke-width="2"/>
  <line x1="428" y1="226" x2="428" y2="238" stroke="#b45309" stroke-width="2"/>
  <text x="434" y="246" font-size="13" font-weight="bold" fill="#78350f">TPOT (one step)</text>
  <line x1="60" y1="310" x2="857" y2="310" stroke="#475569" stroke-width="1.5"/>
  <line x1="60" y1="304" x2="60" y2="316" stroke="#475569" stroke-width="1.5"/>
  <line x1="857" y1="304" x2="857" y2="316" stroke="#475569" stroke-width="1.5"/>
  <text x="458" y="334" text-anchor="middle" font-size="13" fill="#0f172a">latency = TTFT + TPOT x (n_out - 1)</text>
</svg>
