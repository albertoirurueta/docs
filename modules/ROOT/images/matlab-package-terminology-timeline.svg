<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="pt-t pt-d">
  <title id="pt-t">How the words package and toolbox changed meaning</title>
  <desc id="pt-d">A timeline with four releases. Up to R2023b, a package is a plus-folder and a toolbox file is an mltbx file. In R2024a the plus-folder feature is renamed namespace. In R2024b the MATLAB Package Manager introduces packages that are installed with mpminstall. In R2026b the mltbx file becomes a package file and the word toolbox is left for MathWorks add-on products.</desc>
  <rect x="0" y="0" width="900" height="380" rx="12" fill="#f8fafc"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#0f172a">
    <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold">Package and toolbox: the terminology over time</text>
    <line x1="60" y1="75" x2="840" y2="75" stroke="#334155" stroke-width="3"/>
    <g font-size="14" font-weight="bold" text-anchor="middle">
      <circle cx="140" cy="75" r="8" fill="#64748b"/><text x="140" y="56">R2023b and before</text>
      <circle cx="350" cy="75" r="8" fill="#2563eb"/><text x="350" y="56">R2024a</text>
      <circle cx="560" cy="75" r="8" fill="#2563eb"/><text x="560" y="56">R2024b</text>
      <circle cx="770" cy="75" r="8" fill="#16a34a"/><text x="770" y="56">R2026b</text>
    </g>
    <text x="20" y="150" font-size="13" font-weight="bold">Word</text>
    <g font-size="13">
      <rect x="55" y="110" width="170" height="90" rx="8" fill="#ffffff" stroke="#64748b"/>
      <text x="140" y="134" text-anchor="middle" font-weight="bold">package</text>
      <text x="140" y="154" text-anchor="middle">a +folder grouping</text>
      <text x="140" y="172" text-anchor="middle">functions and classes</text>
      <text x="140" y="190" text-anchor="middle" font-style="italic">+heatflow</text>

      <rect x="265" y="110" width="170" height="90" rx="8" fill="#ffffff" stroke="#2563eb"/>
      <text x="350" y="134" text-anchor="middle" font-weight="bold">namespace</text>
      <text x="350" y="154" text-anchor="middle">same +folder feature,</text>
      <text x="350" y="172" text-anchor="middle">new name</text>
      <text x="350" y="190" text-anchor="middle" font-style="italic">heatflow.Plate</text>

      <rect x="475" y="110" width="170" height="90" rx="8" fill="#ffffff" stroke="#2563eb"/>
      <text x="560" y="134" text-anchor="middle" font-weight="bold">package (MPM)</text>
      <text x="560" y="154" text-anchor="middle">mpackage.json,</text>
      <text x="560" y="172" text-anchor="middle">mpminstall, mpmlist</text>
      <text x="560" y="190" text-anchor="middle" font-style="italic">repositories</text>

      <rect x="685" y="110" width="170" height="90" rx="8" fill="#ffffff" stroke="#16a34a"/>
      <text x="770" y="134" text-anchor="middle" font-weight="bold">package (also files)</text>
      <text x="770" y="154" text-anchor="middle">MPM packages include</text>
      <text x="770" y="172" text-anchor="middle">single-file packages</text>
      <text x="770" y="190" text-anchor="middle" font-style="italic">mpmupdate</text>
    </g>
    <text x="20" y="262" font-size="13" font-weight="bold">Word</text>
    <g font-size="13">
      <rect x="55" y="225" width="170" height="80" rx="8" fill="#ffffff" stroke="#64748b"/>
      <text x="140" y="249" text-anchor="middle" font-weight="bold">toolbox file</text>
      <text x="140" y="269" text-anchor="middle">.mltbx bundle of</text>
      <text x="140" y="287" text-anchor="middle">user code</text>

      <rect x="265" y="225" width="380" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
      <text x="455" y="249" text-anchor="middle" font-weight="bold">toolbox file</text>
      <text x="455" y="269" text-anchor="middle">unchanged: still a .mltbx file,</text>
      <text x="455" y="287" text-anchor="middle">installed by double-click or the Add-Ons tools</text>

      <rect x="685" y="225" width="170" height="80" rx="8" fill="#ffffff" stroke="#16a34a"/>
      <text x="770" y="249" text-anchor="middle" font-weight="bold">package file</text>
      <text x="770" y="269" text-anchor="middle">.mltbx, formerly the</text>
      <text x="770" y="287" text-anchor="middle">"toolbox file"</text>
    </g>
    <text x="450" y="342" text-anchor="middle" font-size="13">"Toolbox" still names MathWorks add-on products such as the Statistics and Machine Learning Toolbox.</text>
    <text x="450" y="362" text-anchor="middle" font-size="12" fill="#475569">Original schematic. Release numbers follow the section's package-and-toolbox table.</text>
  </g>
</svg>
