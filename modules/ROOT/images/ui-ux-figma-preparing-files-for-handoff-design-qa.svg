<svg viewBox="0 0 740 300" width="740" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="740" height="300" fill="#FFFFFF"/>
  <text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Design QA and deviations</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF">
    <rect x="20" y="60" width="200" height="130" rx="10"/><rect x="270" y="60" width="200" height="130" rx="10"/><rect x="520" y="60" width="200" height="130" rx="10"/>
  </g>
  <g fill="#4F46E5"><circle cx="31" cy="71" r="11"/><circle cx="281" cy="71" r="11"/><circle cx="531" cy="71" r="11" fill="#B45309"/></g>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="31" y="75">1</text><text x="281" y="75">2</text><text x="531" y="75">3</text></g>
  <g font-size="13" font-weight="bold" fill="#3730A3"><text x="48" y="92">Designer QA</text><text x="298" y="92">Developer build</text><text x="548" y="92" fill="#92400E">Side-by-side check</text></g>
  <g font-size="12" fill="#374151">
    <text x="34" y="116">Names, styles, variables</text><text x="34" y="134">States and breakpoints</text><text x="34" y="152">Contrast and focus notes</text><text x="34" y="170">Review in Dev Mode</text>
    <text x="284" y="116">Reads the ready section</text><text x="284" y="134">Uses Code Connect names</text><text x="284" y="152">Builds the component</text><text x="284" y="170">Asks in comments</text>
    <text x="534" y="116">Spacing, type, colour</text><text x="534" y="134">Pass: set Completed</text><text x="534" y="152">Fail: log the deviation</text><text x="534" y="170">Fix code or update design</text>
  </g>
  <g stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"><line x1="222" y1="125" x2="266" y2="125"/><line x1="472" y1="125" x2="516" y2="125"/></g>
  <path d="M620,192 C620,245 120,245 120,192" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="370" y="238" font-size="12" fill="#92400E" text-anchor="middle">deviation accepted: annotate it and update the design</text>
  <rect x="20" y="256" width="700" height="32" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="370" y="276" font-size="12" fill="#374151" text-anchor="middle">Deviation log row: screen, element, design value, shipped value, reason, decision, owner</text>
</svg>
