<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" width="1010" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">WooCommerce launch checklist</title>
  <desc id="d">Four groups of checks before going live: configuration, sales and tax, content and search, security and operations. Each group lists the checks and a command or screen that verifies them.</desc>
  <rect x="15" y="20" width="484" height="205" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="257.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">Configuration</text>
  <text x="257.0" y="68" text-anchor="middle" font-size="12.5">country, currency, units set</text>
  <text x="257.0" y="90" text-anchor="middle" font-size="12.5">pages: Shop, Cart, Checkout, My account</text>
  <text x="257.0" y="112" text-anchor="middle" font-size="12.5">permalinks not plain</text>
  <text x="257.0" y="134" text-anchor="middle" font-size="12.5">HTTPS on, site URL correct</text>
  <path d="M35 158 L479 158" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="257" y="180" text-anchor="middle" font-size="12" font-weight="bold">Verify with</text>
  <text x="257" y="200" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace">wp option get woocommerce_default_country</text>
  <text x="257" y="217" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace">wp post list --post_type=page</text>
  <rect x="513" y="20" width="484" height="205" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="755.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">Sales and tax</text>
  <text x="755.0" y="68" text-anchor="middle" font-size="12.5">tax rates and display set</text>
  <text x="755.0" y="90" text-anchor="middle" font-size="12.5">shipping zones cover every market</text>
  <text x="755.0" y="112" text-anchor="middle" font-size="12.5">a payment gateway live and tested</text>
  <text x="755.0" y="134" text-anchor="middle" font-size="12.5">test orders for each case</text>
  <path d="M533 158 L977 158" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="755" y="180" text-anchor="middle" font-size="12" font-weight="bold">Verify with</text>
  <text x="755" y="200" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace">wp wc tax list --user=&lt;admin&gt;</text>
  <text x="755" y="217" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace">wp wc shipping_zone list</text>
  <rect x="15" y="245" width="484" height="205" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="257.0" y="269" text-anchor="middle" font-size="14" font-weight="bold">Content and search</text>
  <text x="257.0" y="293" text-anchor="middle" font-size="12.5">products, categories, images</text>
  <text x="257.0" y="315" text-anchor="middle" font-size="12.5">policies pages published</text>
  <text x="257.0" y="337" text-anchor="middle" font-size="12.5">emails read and branded</text>
  <text x="257.0" y="359" text-anchor="middle" font-size="12.5">sitemap, canonical, indexable</text>
  <path d="M35 383 L479 383" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="257" y="405" text-anchor="middle" font-size="12" font-weight="bold">Verify with</text>
  <text x="257" y="425" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace">WooCommerce &gt; Status &gt; Tools</text>
  <text x="257" y="442" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace">view-source: robots meta</text>
  <rect x="513" y="245" width="484" height="205" rx="10" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="755.0" y="269" text-anchor="middle" font-size="14" font-weight="bold">Security and operations</text>
  <text x="755.0" y="293" text-anchor="middle" font-size="12.5">backups restore tested</text>
  <text x="755.0" y="315" text-anchor="middle" font-size="12.5">core, plugins, theme updated</text>
  <text x="755.0" y="337" text-anchor="middle" font-size="12.5">admin accounts use 2FA</text>
  <text x="755.0" y="359" text-anchor="middle" font-size="12.5">coming soon switched off</text>
  <path d="M533 383 L977 383" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="755" y="405" text-anchor="middle" font-size="12" font-weight="bold">Verify with</text>
  <text x="755" y="425" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace">wp plugin list --fields=name,update</text>
  <text x="755" y="442" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace">wp option get woocommerce_coming_soon</text>
</svg>
