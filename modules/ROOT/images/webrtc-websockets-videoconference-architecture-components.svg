<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Huddle architecture: browsers and native apps call an HTTPS API for login and join tokens, keep a WebSocket to the signalling server, send and receive media with the SFU over SRTP, and fall back to a TURN relay; the API uses PostgreSQL, the signalling server uses Redis and drives the SFU, and the SFU feeds a recorder that writes to object storage</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Huddle: the components of a videoconference</text>
  <text x="450" y="44" font-size="10.5" fill="#555555" text-anchor="middle">a control plane that decides who is in the room, a media plane that carries audio and video, and the state behind both</text>

  <rect x="285" y="62" width="260" height="196" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="297" y="78" font-size="10" font-weight="bold" fill="#555555">CONTROL PLANE</text>
  <rect x="285" y="268" width="260" height="206" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="297" y="284" font-size="10" font-weight="bold" fill="#555555">MEDIA PLANE</text>
  <rect x="605" y="62" width="275" height="196" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="617" y="78" font-size="10" font-weight="bold" fill="#555555">STATE</text>
  <rect x="605" y="268" width="275" height="206" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="617" y="284" font-size="10" font-weight="bold" fill="#555555">RECORDING</text>

  <line x1="230" y1="115" x2="230" y2="427" stroke="#1565c0" stroke-width="2"/>
  <line x1="190" y1="115" x2="230" y2="115" stroke="#1565c0" stroke-width="2"/>
  <line x1="190" y1="210" x2="230" y2="210" stroke="#1565c0" stroke-width="2"/>
  <line x1="190" y1="305" x2="230" y2="305" stroke="#1565c0" stroke-width="2"/>

  <line x1="230" y1="115" x2="300" y2="115" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="230" y1="215" x2="300" y2="215" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="230" y1="335" x2="300" y2="335" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="230" y1="427" x2="300" y2="427" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="530" y1="115" x2="620" y2="115" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="215" x2="620" y2="215" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="415" y1="145" x2="415" y2="175" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="415" y1="245" x2="415" y2="300" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="415" y1="400" x2="415" y2="370" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="530" y1="335" x2="620" y2="335" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="745" y1="370" x2="745" y2="400" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <circle cx="265" cy="103" r="8" fill="#ffffff" stroke="#37474f"/><text x="265" y="107" font-size="10" fill="#222222" text-anchor="middle">1</text>
  <circle cx="265" cy="203" r="8" fill="#ffffff" stroke="#37474f"/><text x="265" y="207" font-size="10" fill="#222222" text-anchor="middle">2</text>
  <circle cx="265" cy="323" r="8" fill="#ffffff" stroke="#37474f"/><text x="265" y="327" font-size="10" fill="#222222" text-anchor="middle">3</text>
  <circle cx="265" cy="415" r="8" fill="#ffffff" stroke="#37474f"/><text x="265" y="419" font-size="10" fill="#222222" text-anchor="middle">4</text>
  <text x="423" y="163" font-size="9.5" fill="#444444">token signed here, checked there</text>
  <text x="423" y="275" font-size="9.5" fill="#444444">creates rooms, routes transports</text>
  <text x="423" y="389" font-size="9.5" fill="#444444">relays to the SFU</text>
  <text x="753" y="389" font-size="9.5" fill="#444444">recordings</text>

  <rect x="20" y="80" width="170" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="105" y="104" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Desktop browser</text>
  <text x="105" y="121" font-size="10" fill="#0d3c75" text-anchor="middle">grid, speaker and</text>
  <text x="105" y="135" font-size="10" fill="#0d3c75" text-anchor="middle">screen share layouts</text>
  <rect x="20" y="175" width="170" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="105" y="199" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Phone browser</text>
  <text x="105" y="216" font-size="10" fill="#0d3c75" text-anchor="middle">at most four video tiles,</text>
  <text x="105" y="230" font-size="10" fill="#0d3c75" text-anchor="middle">always through the SFU</text>
  <rect x="20" y="270" width="170" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="105" y="294" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Native app</text>
  <text x="105" y="311" font-size="10" fill="#0d3c75" text-anchor="middle">iOS and Android SDK,</text>
  <text x="105" y="325" font-size="10" fill="#0d3c75" text-anchor="middle">background audio</text>

  <rect x="300" y="85" width="230" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="415" y="108" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">API and authentication</text>
  <text x="415" y="125" font-size="10" fill="#1b4d1f" text-anchor="middle">login, rooms, join token,</text>
  <text x="415" y="138" font-size="10" fill="#1b4d1f" text-anchor="middle">TURN credentials</text>
  <rect x="300" y="175" width="230" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="415" y="198" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">Signalling server</text>
  <text x="415" y="215" font-size="10" fill="#1b4d1f" text-anchor="middle">WebSocket: join, lobby, produce,</text>
  <text x="415" y="229" font-size="10" fill="#1b4d1f" text-anchor="middle">consume, chat, room events</text>

  <rect x="300" y="300" width="230" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="415" y="323" font-size="13" font-weight="bold" fill="#7a2e00" text-anchor="middle">SFU</text>
  <text x="415" y="340" font-size="10" fill="#7a2e00" text-anchor="middle">mediasoup or LiveKit: forwards</text>
  <text x="415" y="354" font-size="10" fill="#7a2e00" text-anchor="middle">simulcast layers, audio levels</text>
  <rect x="300" y="400" width="230" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="415" y="423" font-size="13" font-weight="bold" fill="#7a2e00" text-anchor="middle">TURN relay</text>
  <text x="415" y="440" font-size="10" fill="#7a2e00" text-anchor="middle">coturn or eturnal, ephemeral credentials</text>

  <rect x="620" y="85" width="245" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="742" y="108" font-size="13" font-weight="bold" fill="#3d0f57" text-anchor="middle">PostgreSQL</text>
  <text x="742" y="125" font-size="10" fill="#3d0f57" text-anchor="middle">users, scheduled rooms,</text>
  <text x="742" y="138" font-size="10" fill="#3d0f57" text-anchor="middle">recording metadata</text>
  <rect x="620" y="175" width="245" height="70" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="742" y="198" font-size="13" font-weight="bold" fill="#3d0f57" text-anchor="middle">Redis</text>
  <text x="742" y="215" font-size="10" fill="#3d0f57" text-anchor="middle">live room and participant state,</text>
  <text x="742" y="229" font-size="10" fill="#3d0f57" text-anchor="middle">which node owns which room</text>

  <rect x="620" y="300" width="245" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="742" y="323" font-size="13" font-weight="bold" fill="#7a2e00" text-anchor="middle">Recorder</text>
  <text x="742" y="340" font-size="10" fill="#7a2e00" text-anchor="middle">FFmpeg on plain RTP, or</text>
  <text x="742" y="354" font-size="10" fill="#7a2e00" text-anchor="middle">LiveKit egress</text>
  <rect x="620" y="400" width="245" height="55" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="742" y="423" font-size="13" font-weight="bold" fill="#3d0f57" text-anchor="middle">Object storage</text>
  <text x="742" y="440" font-size="10" fill="#3d0f57" text-anchor="middle">MP4 or WebM files, signed URLs</text>

  <text x="20" y="497" font-size="10.5" fill="#222222">1  HTTPS: login, room list, join token and TURN credentials</text>
  <text x="20" y="513" font-size="10.5" fill="#222222">2  WebSocket (WSS): join, lobby, produce and consume, chat, hand raise, room events</text>
  <text x="20" y="529" font-size="10.5" fill="#222222">3  WebRTC media: DTLS-SRTP over UDP, one upload per participant, simulcast layers chosen by the SFU</text>
  <text x="20" y="545" font-size="10.5" fill="#222222">4  TURN relay over UDP, TCP or TLS on port 443, used only when the direct path fails (dashed)</text>
</svg>
