<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="340" fill="#ffffff"/>
  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Metro pipeline</text>
  <text x="390" y="44" font-size="11" fill="#666666" text-anchor="middle">Resolver, transformer and serializer turn Places's entry file into one bundle plus a source map</text>

  <defs>
    <marker id="mp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Entry point -->
  <rect x="20" y="95" width="140" height="94" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="90" y="120" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Entry file</text>
  <text x="90" y="140" font-size="9.5" fill="#333333" text-anchor="middle">src/app/App.tsx</text>
  <text x="90" y="155" font-size="9.5" fill="#333333" text-anchor="middle">plus every import</text>
  <text x="90" y="170" font-size="9.5" fill="#333333" text-anchor="middle">reachable from it</text>

  <line x1="160" y1="142" x2="176" y2="142" stroke="#333333" stroke-width="1.4" marker-end="url(#mp-arrow)"/>

  <!-- Resolver -->
  <rect x="180" y="95" width="170" height="94" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="265" y="120" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Resolver</text>
  <text x="265" y="140" font-size="9.5" fill="#333333" text-anchor="middle">maps each import to a file</text>
  <text x="265" y="155" font-size="9.5" fill="#333333" text-anchor="middle">platform extensions,</text>
  <text x="265" y="170" font-size="9.5" fill="#333333" text-anchor="middle">nodeModulesPaths, aliases</text>

  <line x1="350" y1="142" x2="366" y2="142" stroke="#333333" stroke-width="1.4" marker-end="url(#mp-arrow)"/>

  <!-- Transformer -->
  <rect x="370" y="95" width="170" height="94" rx="8" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="455" y="120" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Transformer</text>
  <text x="455" y="140" font-size="9.5" fill="#333333" text-anchor="middle">runs Babel per module</text>
  <text x="455" y="155" font-size="9.5" fill="#333333" text-anchor="middle">JSX and TypeScript out,</text>
  <text x="455" y="170" font-size="9.5" fill="#333333" text-anchor="middle">cached on disk per file</text>

  <line x1="540" y1="142" x2="556" y2="142" stroke="#333333" stroke-width="1.4" marker-end="url(#mp-arrow)"/>

  <!-- Serializer -->
  <rect x="560" y="95" width="180" height="94" rx="8" fill="#fbecec" stroke="#aa3333" stroke-width="1.6"/>
  <text x="650" y="120" font-size="12" font-weight="bold" fill="#aa3333" text-anchor="middle">Serializer</text>
  <text x="650" y="140" font-size="9.5" fill="#333333" text-anchor="middle">orders the module graph</text>
  <text x="650" y="155" font-size="9.5" fill="#333333" text-anchor="middle">and writes the output</text>
  <text x="650" y="170" font-size="9.5" fill="#333333" text-anchor="middle">(bundle or HMR update)</text>

  <!-- Fan-out to the two outputs -->
  <line x1="650" y1="189" x2="650" y2="212" stroke="#333333" stroke-width="1.3"/>
  <line x1="480" y1="212" x2="650" y2="212" stroke="#333333" stroke-width="1.3"/>
  <line x1="480" y1="212" x2="480" y2="232" stroke="#333333" stroke-width="1.3" marker-end="url(#mp-arrow)"/>
  <line x1="685" y1="212" x2="685" y2="232" stroke="#333333" stroke-width="1.3" marker-end="url(#mp-arrow)"/>

  <rect x="390" y="234" width="180" height="62" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="480" y="256" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">JavaScript bundle</text>
  <text x="480" y="274" font-size="9.5" fill="#333333" text-anchor="middle">served by the dev server,</text>
  <text x="480" y="288" font-size="9.5" fill="#333333" text-anchor="middle">or compiled to Hermes bytecode</text>

  <rect x="600" y="234" width="170" height="62" rx="8" fill="#f3eef8" stroke="#5a3d86" stroke-width="1.5"/>
  <text x="685" y="256" font-size="11.5" font-weight="bold" fill="#5a3d86" text-anchor="middle">Source map</text>
  <text x="685" y="274" font-size="9.5" fill="#333333" text-anchor="middle">symbolicates stack traces</text>
  <text x="685" y="288" font-size="9.5" fill="#333333" text-anchor="middle">back to src/ positions</text>

  <!-- Cache note -->
  <rect x="20" y="234" width="340" height="62" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="190" y="256" font-size="11.5" font-weight="bold" fill="#555555" text-anchor="middle">Transform cache</text>
  <text x="190" y="274" font-size="9.5" fill="#555555" text-anchor="middle">Resolver and transformer results are cached on disk and keyed</text>
  <text x="190" y="288" font-size="9.5" fill="#555555" text-anchor="middle">by file contents and transform options; --reset-cache clears it.</text>

  <text x="390" y="322" font-size="10.5" fill="#666666" text-anchor="middle">The same three stages run for a one-off release bundle and for every incremental Fast Refresh update.</text>
</svg>
