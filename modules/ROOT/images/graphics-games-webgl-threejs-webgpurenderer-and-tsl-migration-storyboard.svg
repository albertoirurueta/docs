<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tsl-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Migrating the Bookshelf from WebGLRenderer to WebGPURenderer</text>
<rect x="16" y="56" width="138" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="32" cy="72" r="11" fill="#4F46E5"/>
<text x="32" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="85" y="102" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Import</text>
<rect x="60" y="116" width="50" height="62" rx="3" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<rect x="60" y="116" width="8" height="62" fill="#4F46E5"/>
<text x="85" y="196" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">import * as THREE</text>
<text x="85" y="210" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">from &#x27;three/webgpu&#x27;</text>
<line x1="154" y1="141" x2="166" y2="141" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-story)"/>
<rect x="164" y="56" width="138" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="180" cy="72" r="11" fill="#4F46E5"/>
<text x="180" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="233" y="102" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Initialise</text>
<rect x="208" y="116" width="50" height="62" rx="3" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<rect x="208" y="116" width="8" height="62" fill="#4F46E5"/>
<text x="233" y="196" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">await renderer.init()</text>
<text x="233" y="210" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">before render()</text>
<line x1="302" y1="141" x2="314" y2="141" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-story)"/>
<rect x="312" y="56" width="138" height="170" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="328" cy="72" r="11" fill="#B45309"/>
<text x="328" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="381" y="102" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Materials</text>
<rect x="356" y="116" width="50" height="62" rx="3" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<rect x="356" y="116" width="8" height="62" fill="#4F46E5"/>
<rect x="370" y="132" width="28" height="8" fill="#F59E0B"/>
<text x="381" y="196" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">ShaderMaterial becomes</text>
<text x="381" y="210" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">a node material + TSL</text>
<line x1="450" y1="141" x2="462" y2="141" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-story)"/>
<rect x="460" y="56" width="138" height="170" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="476" cy="72" r="11" fill="#B45309"/>
<text x="476" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="529" y="102" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Post-processing</text>
<rect x="504" y="116" width="50" height="62" rx="3" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<rect x="504" y="116" width="8" height="62" fill="#4F46E5"/>
<rect x="518" y="132" width="28" height="8" fill="#F59E0B"/>
<circle cx="529" cy="147" r="36" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3"/>
<text x="529" y="196" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">EffectComposer becomes</text>
<text x="529" y="210" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">RenderPipeline + bloom</text>
<line x1="598" y1="141" x2="610" y2="141" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-story)"/>
<rect x="608" y="56" width="138" height="170" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<circle cx="624" cy="72" r="11" fill="#4F46E5"/>
<text x="624" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="677" y="102" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Check backend</text>
<rect x="652" y="116" width="50" height="62" rx="3" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<rect x="652" y="116" width="8" height="62" fill="#4F46E5"/>
<rect x="666" y="132" width="28" height="8" fill="#F59E0B"/>
<circle cx="677" cy="147" r="36" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3"/>
<text x="677" y="196" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">log which backend ran;</text>
<text x="677" y="210" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">test forceWebGL: true</text>
<text x="380" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Each panel is a small commit: the scene keeps rendering after every step.</text>
<text x="380" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The shelf, books and animation clips from bookshelf.glb are not touched by the migration.</text>
</svg>
