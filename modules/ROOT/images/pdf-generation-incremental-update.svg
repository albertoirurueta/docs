<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="iu-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Incremental updates: new revisions are appended, earlier bytes never change</text>

  <!-- Revision 1 -->
  <rect x="30" y="50" width="250" height="300" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="155" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">Revision 1: original file</text>
  <rect x="44" y="84" width="222" height="26" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="155" y="101" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">%PDF-1.7</text>
  <rect x="44" y="118" width="222" height="74" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="155" y="140" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">1 0 obj Catalog</text>
  <text x="155" y="158" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">2 0 obj Pages ... 5 0 obj Font</text>
  <text x="155" y="176" text-anchor="middle" font-size="11" fill="#1f5fa6">body: objects 1 to 5</text>
  <rect x="44" y="200" width="222" height="40" rx="4" fill="#ffffff" stroke="#b36b00"/>
  <text x="155" y="217" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">xref 0 6</text>
  <text x="155" y="233" text-anchor="middle" font-size="11" fill="#7a4800">cross-reference section 1</text>
  <rect x="44" y="248" width="222" height="52" rx="4" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="155" y="266" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">trailer /Size 6 /Root 1 0 R</text>
  <text x="155" y="282" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">startxref 418</text>
  <text x="155" y="296" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">%%EOF</text>
  <text x="155" y="326" text-anchor="middle" font-size="11" fill="#1f5fa6">Signed bytes (ByteRange)</text>
  <text x="155" y="342" text-anchor="middle" font-size="11" fill="#1f5fa6">end here for a signature of revision 1</text>

  <!-- Revision 2 -->
  <rect x="340" y="50" width="250" height="300" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="465" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">Revision 2: appended</text>
  <rect x="354" y="84" width="222" height="74" rx="4" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="465" y="106" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">6 0 obj  Info  (new)</text>
  <text x="465" y="124" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">3 0 obj  Page  (replaced)</text>
  <text x="465" y="144" text-anchor="middle" font-size="11" fill="#2b7a2b">only new or changed objects</text>
  <rect x="354" y="166" width="222" height="40" rx="4" fill="#ffffff" stroke="#b36b00"/>
  <text x="465" y="183" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">xref 3 1 / 6 1</text>
  <text x="465" y="199" text-anchor="middle" font-size="11" fill="#7a4800">cross-reference section 2</text>
  <rect x="354" y="214" width="222" height="66" rx="4" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="465" y="232" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">trailer /Size 7 /Root 1 0 R</text>
  <text x="465" y="248" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">/Info 6 0 R /Prev 418</text>
  <text x="465" y="264" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">startxref 752  %%EOF</text>
  <text x="465" y="326" text-anchor="middle" font-size="11" fill="#2b7a2b">a reader starts here (last startxref)</text>
  <text x="465" y="342" text-anchor="middle" font-size="11" fill="#2b7a2b">and follows /Prev backwards</text>

  <!-- Revision 3 -->
  <rect x="650" y="50" width="220" height="300" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="760" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Revision 3: later change</text>
  <rect x="664" y="84" width="192" height="74" rx="4" fill="#ffffff" stroke="#7b3fb5"/>
  <text x="760" y="106" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">7 0 obj  form field</text>
  <text x="760" y="124" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">8 0 obj  signature</text>
  <text x="760" y="144" text-anchor="middle" font-size="11" fill="#4a1d75">filled form, signature, DSS</text>
  <rect x="664" y="166" width="192" height="40" rx="4" fill="#ffffff" stroke="#b36b00"/>
  <text x="760" y="183" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">xref 7 2</text>
  <text x="760" y="199" text-anchor="middle" font-size="11" fill="#7a4800">cross-reference section 3</text>
  <rect x="664" y="214" width="192" height="66" rx="4" fill="#ffffff" stroke="#7b3fb5"/>
  <text x="760" y="232" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">trailer /Prev 752</text>
  <text x="760" y="248" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">startxref ...  %%EOF</text>

  <!-- Prev arrows -->
  <path d="M650 252 C 620 400, 520 400, 470 352" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#iu-arrow)"/>
  <path d="M340 240 C 310 400, 200 400, 160 352" fill="none" stroke="#555" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#iu-arrow)"/>
  <text x="590" y="412" font-size="11" fill="#555">/Prev</text>
  <text x="280" y="412" font-size="11" fill="#555">/Prev</text>

  <text x="450" y="446" text-anchor="middle" font-size="12" fill="#333">Why it matters: a signature covers the bytes of the earlier revisions, so a viewer can tell which revisions came after signing.</text>
</svg>
