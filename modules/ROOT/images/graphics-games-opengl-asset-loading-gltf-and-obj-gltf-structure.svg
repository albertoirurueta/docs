<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-asset-loading-gltf-and-obj-gltf-structure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Structure of a glTF 2.0 file</text>
<rect x="20" y="56" width="130" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.0" y="78" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">scene</text>
<text x="85.0" y="96" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">lists root nodes</text>
<rect x="190" y="56" width="130" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="255.0" y="78" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">nodes</text>
<text x="255.0" y="96" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">transform, mesh, skin</text>
<rect x="360" y="56" width="130" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="425.0" y="78" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">meshes</text>
<text x="425.0" y="96" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">list of primitives</text>
<rect x="530" y="56" width="130" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="595.0" y="78" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">primitives</text>
<text x="595.0" y="96" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">mode, attributes, indices</text>
<rect x="530" y="150" width="130" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="595.0" y="172" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">accessors</text>
<text x="595.0" y="190" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">type, count, componentType</text>
<rect x="360" y="150" width="130" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="425.0" y="172" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">materials</text>
<text x="425.0" y="190" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">PBR metallic-roughness</text>
<rect x="360" y="244" width="130" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="425.0" y="266" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">textures</text>
<text x="425.0" y="284" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">sampler + image source</text>
<rect x="190" y="244" width="130" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="255.0" y="266" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">images</text>
<text x="255.0" y="284" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">uri or bufferView</text>
<rect x="530" y="244" width="130" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="595.0" y="266" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">bufferViews</text>
<text x="595.0" y="284" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">offset, length, stride</text>
<rect x="530" y="338" width="130" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="595.0" y="360" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">buffers</text>
<text x="595.0" y="378" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">bytes: .bin or GLB chunk</text>
<rect x="190" y="150" width="130" height="52" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="255.0" y="172" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">skins / animations</text>
<text x="255.0" y="190" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">joints, channels, samplers</text>
<line x1="150" y1="82" x2="190" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<line x1="320" y1="82" x2="360" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<line x1="490" y1="82" x2="530" y2="82" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<line x1="595" y1="108" x2="595" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<line x1="595" y1="202" x2="595" y2="244" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<line x1="595" y1="296" x2="595" y2="338" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<line x1="530" y1="100" x2="490" y2="150" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<line x1="425" y1="202" x2="425" y2="244" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<line x1="360" y1="270" x2="320" y2="270" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<line x1="255" y1="108" x2="255" y2="150" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ah-asset-loading-gltf-and-obj-gltf-structure)"/>
<rect x="20" y="330" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="95" y="352" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">Binary glb:</text>
<text x="95" y="366" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">12-byte header,</text>
<text x="95" y="380" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">JSON chunk,</text>
<text x="95" y="394" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">BIN chunk</text>
<rect x="190" y="338" width="320" height="72" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="350" y="356" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">Attributes: POSITION, NORMAL, TANGENT, TEXCOORD_0,</text>
<text x="350" y="371" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">COLOR_0, JOINTS_0, WEIGHTS_0; each names an accessor.</text>
<text x="350" y="386" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">Right-handed, +Y up, metres; UV origin top-left.</text>
</svg>
