<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">From the Legacy REST API to the dedicated extension</title>
  <desc id="d">A timeline of the WooCommerce Legacy REST API, the older wc-api endpoints. Release 8.3 added notices that webhooks with the legacy payload would stop working. Release 8.8.0 installed the Legacy REST API extension automatically on upgrade when it was needed, and 8.9.1 made that happen only once. Release 9.0.0, published on 2024-06-18, replaced the legacy code in core with a stub that answers every wc-api request with the error woocommerce_api_disabled, while the extension on WordPress.org restores the old behaviour. Release 10.9.0, published on 2026-06-23, removed the settings section, admin notices, automatic installation and nudges from core. The extension still works when installed manually but WooCommerce warns that it is not compatible with HPOS. The wc/v1, wc/v2 and wc/v3 routes of the WordPress REST API are unaffected.</desc>
  <rect x="0" y="0" width="980" height="440" rx="14" fill="#2b3a4a"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">The Legacy REST API (/wc-api/v3) leaves core</text>
  <path d="M40 160 H 940" stroke="#f2f5f8" stroke-width="2"/>
  <g fill="#f2f5f8" font-size="12">
    <circle cx="110" cy="160" r="9" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="110" y="130" text-anchor="middle" font-weight="bold" font-size="14">8.3</text>
    <text x="110" y="112" text-anchor="middle" font-size="11">2023-11-16</text>
    <text x="110" y="196" text-anchor="middle">notices: legacy</text>
    <text x="110" y="212" text-anchor="middle">payload webhooks</text>
    <text x="110" y="228" text-anchor="middle">will stop in 9.0</text>

    <circle cx="300" cy="160" r="9" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="300" y="130" text-anchor="middle" font-weight="bold" font-size="14">8.8.0</text>
    <text x="300" y="196" text-anchor="middle">extension installed</text>
    <text x="300" y="212" text-anchor="middle">automatically on</text>
    <text x="300" y="228" text-anchor="middle">upgrade when needed</text>

    <circle cx="470" cy="160" r="9" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="470" y="130" text-anchor="middle" font-weight="bold" font-size="14">8.9.1</text>
    <text x="470" y="196" text-anchor="middle">that installation</text>
    <text x="470" y="212" text-anchor="middle">happens only once</text>

    <circle cx="660" cy="160" r="11" fill="#f4b860" stroke="#f2f5f8"/>
    <text x="660" y="130" text-anchor="middle" font-weight="bold" font-size="14">9.0.0</text>
    <text x="660" y="112" text-anchor="middle" font-size="11">2024-06-18</text>
    <text x="660" y="196" text-anchor="middle">removed from core:</text>
    <text x="660" y="212" text-anchor="middle">stub answers</text>
    <text x="660" y="228" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">woocommerce_api_disabled</text>

    <circle cx="860" cy="160" r="9" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="860" y="130" text-anchor="middle" font-weight="bold" font-size="14">10.9.0</text>
    <text x="860" y="112" text-anchor="middle" font-size="11">2026-06-23</text>
    <text x="860" y="196" text-anchor="middle">settings, notices and</text>
    <text x="860" y="212" text-anchor="middle">auto-install removed</text>
    <text x="860" y="228" text-anchor="middle">from core</text>

    <rect x="40" y="290" width="440" height="120" rx="8" fill="#33485c" stroke="#f2f5f8"/>
    <text x="52" y="314" font-weight="bold" font-size="14">Gone from core (404 JSON error)</text>
    <text x="52" y="338" font-family="Menlo, Consolas, monospace" font-size="11">/wc-api/v1, /wc-api/v2, /wc-api/v3</text>
    <text x="52" y="360">webhooks whose API version is legacy_v3</text>
    <text x="52" y="378">WC()-&gt;legacy_rest_api_is_available() is false</text>
    <text x="52" y="396">unless the extension is active</text>

    <rect x="500" y="290" width="440" height="120" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="512" y="314" font-weight="bold" font-size="14">Unaffected</text>
    <text x="512" y="338" font-family="Menlo, Consolas, monospace" font-size="11">/wp-json/wc/v1, v2, v3 (WordPress REST API)</text>
    <text x="512" y="360">webhooks with wp_api_v1, v2 or v3 payloads</text>
    <text x="512" y="378">?wc-api=name callbacks used by payment gateways</text>
    <text x="512" y="396">(woocommerce_api_name hooks)</text>
  </g>
</svg>
