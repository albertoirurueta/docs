<text x="380" y="245" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">In bookshelf.glb hit.object is the book Mesh itself; in other assets it may be a child.</text>
<text x="380" y="267" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Traverse parents until a node whose name starts with Book_ is found.</text>
<text x="380" y="295" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Next: play the pull-out clip on that book (see the animation page).</text>
