<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vdu-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">What the Khronos validation layer can check</text>
<rect x="40" y="50" width="680" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="76.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Core validation (validate_core and friends)</text>
<text x="380.0" y="91.0" text-anchor="middle" font-size="11" fill="#3730A3">always on in a development build: parameters, object lifetimes, state, shaders (SPIR-V), threading</text>
<rect x="40" y="125" width="215" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="147.5" y="156.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Synchronization</text>
<text x="147.5" y="171.0" text-anchor="middle" font-size="11" fill="#92400E">race hazards between</text>
<text x="147.5" y="186.0" text-anchor="middle" font-size="11" fill="#92400E">commands and queues</text>
<text x="147.5" y="201.0" text-anchor="middle" font-size="11" fill="#92400E">validate_sync</text>
<rect x="272" y="125" width="215" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="379.5" y="156.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">GPU-assisted (GPU-AV)</text>
<text x="379.5" y="171.0" text-anchor="middle" font-size="11" fill="#065F46">instruments shaders</text>
<text x="379.5" y="186.0" text-anchor="middle" font-size="11" fill="#065F46">descriptors, addresses</text>
<text x="379.5" y="201.0" text-anchor="middle" font-size="11" fill="#065F46">gpuav_enable</text>
<rect x="505" y="125" width="215" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="612.5" y="156.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Debug Printf</text>
<text x="612.5" y="171.0" text-anchor="middle" font-size="11" fill="#3730A3">printf from shaders</text>
<text x="612.5" y="186.0" text-anchor="middle" font-size="11" fill="#3730A3">printf_enable</text>
<text x="612.5" y="201.0" text-anchor="middle" font-size="11" fill="#3730A3">to the callback</text>
<rect x="40" y="240" width="330" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="205.0" y="263.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Best practices</text>
<text x="205.0" y="278.5" text-anchor="middle" font-size="11" fill="#374151">valid but slow or questionable usage</text>
<text x="205.0" y="293.5" text-anchor="middle" font-size="11" fill="#374151">validate_best_practices (+ vendor)</text>
<rect x="390" y="240" width="330" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="555.0" y="263.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Legacy detection</text>
<text x="555.0" y="278.5" text-anchor="middle" font-size="11" fill="#374151">warns about superseded API use</text>
<text x="555.0" y="293.5" text-anchor="middle" font-size="11" fill="#374151">legacy_detection</text>
<text x="380" y="345" text-anchor="middle" font-size="12" fill="#374151">Run one expensive mode at a time: the Core preset, then Synchronization Only,</text>
<text x="380" y="365" text-anchor="middle" font-size="12" fill="#374151">then GPU-Assisted Validation, then Debug Printf Only, each as its own pass</text>
<text x="380" y="395" text-anchor="middle" font-size="11" fill="#6B7280">Layer settings use the keys of VK_LAYER_KHRONOS_validation</text>
</svg>
