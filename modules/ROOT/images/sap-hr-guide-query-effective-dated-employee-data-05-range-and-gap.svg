<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 276" width="1080" height="276" role="img" aria-labelledby="sap-hr-guide-query-effective-dated-employee-data-05-range-and-gap-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-hr-guide-query-effective-dated-employee-data-05-range-and-gap-title">Terminal with three curl commands: the range from 2026-06-01 to 2026-07-31 for Ana Torres returns both of her records, the one from 2024-03-01 to 2026-06-30 in subarea 0001 and the one from 2026-07-01 to 9999-12-31 in subarea 0002 (callout 10); asOfDate=2025-05-31 on the parking permits returns the permit A-1 (callout 11); asOfDate=2025-06-01 returns an empty value list, the gap after the permit (callout 12); the long answers wrap onto several lines</title>
<g><rect x="0" y="0" width="1080" height="276" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="244" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/people/OrganizationalAssignments?fromDate=2026-06-01&amp;toDate=2026-07-31&amp;$filt</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">er=Employee_PersonnelNumber%20eq%20%2700001234%27&amp;$select=BeginDate,EndDate,PersonnelSubarea&amp;$orderby=BeginDate'</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#OrganizationalAssignments&quot;,&quot;value&quot;:[{&quot;BeginDate&quot;:&quot;2024-03-01&quot;,&quot;EndDate&quot;:&quot;2026-06-30&quot;,&quot;Per</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">sonnelSubarea&quot;:&quot;0001&quot;,&quot;Employee_PersonnelNumber&quot;:&quot;00001234&quot;},{&quot;BeginDate&quot;:&quot;2026-07-01&quot;,&quot;EndDate&quot;:&quot;9999-12-31&quot;,&quot;Personn</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">elSubarea&quot;:&quot;0002&quot;,&quot;Employee_PersonnelNumber&quot;:&quot;00001234&quot;}]}</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/people/ParkingPermits?asOfDate=2025-05-31'</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#ParkingPermits&quot;,&quot;value&quot;:[{&quot;Employee_PersonnelNumber&quot;:&quot;00001234&quot;,&quot;BeginDate&quot;:&quot;2025-01-01&quot;,</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;EndDate&quot;:&quot;2025-05-31&quot;,&quot;Permit&quot;:&quot;A-1&quot;}]}</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/people/ParkingPermits?asOfDate=2025-06-01'</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#ParkingPermits&quot;,&quot;value&quot;:[]}</text>
<rect x="5" y="46" width="1042" height="107" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">10</text></g>
<rect x="5" y="151" width="1042" height="65" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="151" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="156" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">11</text></g>
<rect x="5" y="214" width="1042" height="44" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="214" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="219" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">12</text></g></g>
</svg>
