<svg viewBox="0 0 820 460" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="460" fill="#ffffff"/>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Site-to-site and point-to-site VPN topology</text>

  <!-- On-premises box -->
  <rect x="16" y="52" width="190" height="200" rx="8" fill="#fbe8cf" stroke="#c77c00" stroke-width="1.3"/>
  <text x="111" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4a00">On-premises network</text>
  <rect x="34" y="86" width="154" height="60" rx="5" fill="#ffffff" stroke="#c77c00" stroke-width="1"/>
  <text x="111" y="108" text-anchor="middle" font-size="10.5" fill="#5f6368">VPN device</text>
  <text x="111" y="122" text-anchor="middle" font-size="9.5" fill="#5f6368">(IPsec/IKE, BGP)</text>
  <text x="111" y="136" text-anchor="middle" font-size="9" fill="#7a4a00">Public IP: 203.0.113.10</text>
  <rect x="34" y="156" width="154" height="80" rx="5" fill="#ffffff" stroke="#c77c00" stroke-width="1"/>
  <text x="111" y="176" text-anchor="middle" font-size="10.5" fill="#5f6368">On-prem subnet</text>
  <text x="111" y="192" text-anchor="middle" font-size="9.5" fill="#5f6368">10.10.0.0/16</text>
  <text x="111" y="210" text-anchor="middle" font-size="9" fill="#5f6368">admin workstations,</text>
  <text x="111" y="222" text-anchor="middle" font-size="9" fill="#5f6368">branch servers</text>

  <!-- Local network gateway -->
  <rect x="234" y="96" width="164" height="70" rx="6" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.3"/>
  <text x="316" y="118" text-anchor="middle" font-size="10.5" font-weight="700" fill="#173d73">Local network gateway</text>
  <text x="316" y="134" text-anchor="middle" font-size="9" fill="#3c4043">lgw-onprem-bookshelf</text>
  <text x="316" y="148" text-anchor="middle" font-size="9" fill="#3c4043">represents 203.0.113.10</text>

  <!-- S2S connection line -->
  <line x1="206" y1="116" x2="234" y2="116" stroke="#2c5aa0" stroke-width="2"/>

  <!-- connection resource -->
  <rect x="234" y="182" width="164" height="70" rx="6" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.3"/>
  <text x="316" y="204" text-anchor="middle" font-size="10.5" font-weight="700" fill="#173d73">Connection (S2S)</text>
  <text x="316" y="220" text-anchor="middle" font-size="9" fill="#3c4043">cn-bookshelf-onprem</text>
  <text x="316" y="234" text-anchor="middle" font-size="9" fill="#3c4043">IPsec/IKEv2, shared key, BGP</text>

  <line x1="316" y1="166" x2="316" y2="182" stroke="#2c5aa0" stroke-width="2"/>

  <!-- Azure boundary -->
  <rect x="420" y="52" width="384" height="380" rx="10" fill="#eef7ee" stroke="#188038" stroke-width="1.5"/>
  <text x="436" y="74" font-size="12.5" font-weight="700" fill="#0d4c22">vnet-bookshelf (eastus2)</text>

  <!-- GatewaySubnet -->
  <rect x="436" y="86" width="352" height="130" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.2"/>
  <text x="450" y="106" font-size="11" font-weight="700" fill="#0d4c22">GatewaySubnet</text>
  <text x="450" y="120" font-size="9.5" fill="#5f6368">(dedicated, no NSG, no other resources --</text>
  <text x="450" y="132" font-size="9.5" fill="#5f6368">see xref virtual-networks.adoc)</text>

  <rect x="452" y="142" width="320" height="62" rx="6" fill="#d6eadf" stroke="#188038" stroke-width="1.2"/>
  <text x="612" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#0d4c22">vgw-bookshelf</text>
  <text x="612" y="176" text-anchor="middle" font-size="9.5" fill="#3c4043">VPN Gateway (route-based)</text>
  <text x="612" y="190" text-anchor="middle" font-size="9" fill="#3c4043">SKU: VpnGw2AZ, active-active, BGP</text>

  <!-- lines from connection / local gw to vgw-bookshelf -->
  <line x1="398" y1="217" x2="452" y2="173" stroke="#2c5aa0" stroke-width="2"/>
  <text x="404" y="206" font-size="9" fill="#173d73">IPsec tunnel</text>

  <!-- P2S client -->
  <rect x="612" y="16" width="176" height="0" opacity="0"/>
  <rect x="600" y="240" width="0" height="0" opacity="0"/>

  <!-- P2S box on the right, outside VNet -->
  <rect x="616" y="238" width="172" height="90" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.3"/>
  <text x="702" y="258" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a2170">Admin laptop (P2S)</text>
  <text x="702" y="274" text-anchor="middle" font-size="9" fill="#3c4043">Azure VPN Client</text>
  <text x="702" y="288" text-anchor="middle" font-size="9" fill="#3c4043">OpenVPN + Entra ID auth</text>
  <text x="702" y="302" text-anchor="middle" font-size="9" fill="#3c4043">client pool 172.16.201.0/24</text>

  <line x1="702" y1="238" x2="672" y2="204" stroke="#7b3fb5" stroke-width="2"/>
  <text x="672" y="228" font-size="9" fill="#4a2170" text-anchor="middle">TLS tunnel</text>

  <!-- Private resources -->
  <rect x="436" y="340" width="164" height="76" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.2"/>
  <text x="518" y="360" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d4c22">pg-bookshelf</text>
  <text x="518" y="376" text-anchor="middle" font-size="9" fill="#3c4043">PostgreSQL flexible server</text>
  <text x="518" y="390" text-anchor="middle" font-size="9" fill="#3c4043">private endpoint + private DNS</text>
  <text x="518" y="404" text-anchor="middle" font-size="8.5" fill="#5f6368">db.privatelink...postgres...</text>

  <rect x="622" y="340" width="164" height="76" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.2"/>
  <text x="704" y="360" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d4c22">kv-bookshelf</text>
  <text x="704" y="376" text-anchor="middle" font-size="9" fill="#3c4043">Key Vault</text>
  <text x="704" y="390" text-anchor="middle" font-size="9" fill="#3c4043">private endpoint + private DNS</text>
  <text x="704" y="404" text-anchor="middle" font-size="8.5" fill="#5f6368">privatelink.vaultcore.azure.net</text>

  <line x1="612" y1="204" x2="518" y2="340" stroke="#188038" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="612" y1="204" x2="704" y2="340" stroke="#188038" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="612" y="440" text-anchor="middle" font-size="9.5" fill="#3c4043">Both S2S and P2S traffic route through vgw-bookshelf into vnet-bookshelf's private address space;</text>
  <text x="612" y="452" text-anchor="middle" font-size="9.5" fill="#3c4043">private DNS zones resolve pg-bookshelf/kv-bookshelf to their private IPs for every path.</text>
</svg>
