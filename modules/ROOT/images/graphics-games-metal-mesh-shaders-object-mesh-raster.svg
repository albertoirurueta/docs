<svg viewBox="0 0 760 390" width="760" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-ms-pipe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="390" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Object, mesh and fragment stages</text>
<rect x="20" y="60" width="200" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="120.0" y="88.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Object function</text>
<text x="120.0" y="103.5" text-anchor="middle" font-size="11" fill="#92400E">Optional. One threadgroup per</text>
<text x="120.0" y="118.5" text-anchor="middle" font-size="11" fill="#92400E">group of meshlets: culls them,</text>
<text x="120.0" y="133.5" text-anchor="middle" font-size="11" fill="#92400E">picks a level of detail,</text>
<text x="120.0" y="148.5" text-anchor="middle" font-size="11" fill="#92400E">writes a payload</text>
<rect x="280" y="60" width="200" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="88.5" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Mesh function</text>
<text x="380.0" y="103.5" text-anchor="middle" font-size="11" fill="#3730A3">One threadgroup per meshlet:</text>
<text x="380.0" y="118.5" text-anchor="middle" font-size="11" fill="#3730A3">writes vertices, indices and</text>
<text x="380.0" y="133.5" text-anchor="middle" font-size="11" fill="#3730A3">the primitive count into</text>
<text x="380.0" y="148.5" text-anchor="middle" font-size="11" fill="#3730A3">a mesh object</text>
<rect x="540" y="60" width="200" height="110" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="96.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Rasteriser + fragment</text>
<text x="640.0" y="111.0" text-anchor="middle" font-size="11" fill="#065F46">Fixed-function rasteriser,</text>
<text x="640.0" y="126.0" text-anchor="middle" font-size="11" fill="#065F46">then the ordinary fragment</text>
<text x="640.0" y="141.0" text-anchor="middle" font-size="11" fill="#065F46">function runs per pixel</text>
<line x1="220" y1="115" x2="280" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ms-pipe)"/>
<line x1="480" y1="115" x2="540" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-ms-pipe)"/>
<text x="250" y="100" text-anchor="middle" font-size="11" fill="#92400E">payload</text>
<text x="510" y="100" text-anchor="middle" font-size="11" fill="#3730A3">primitives</text>
<rect x="20" y="200" width="330" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="185.0" y="231.0" text-anchor="middle" font-size="11" fill="#374151">No vertex fetch or index buffer binding:</text>
<text x="185.0" y="246.0" text-anchor="middle" font-size="11" fill="#374151">the mesh function reads any buffer.</text>
<rect x="390" y="200" width="350" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="565.0" y="231.0" text-anchor="middle" font-size="11" fill="#374151">Replaces the vertex function and</text>
<text x="565.0" y="246.0" text-anchor="middle" font-size="11" fill="#374151">primitive assembly with threadgroups.</text>
<rect x="20" y="290" width="720" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="318.5" text-anchor="middle" font-size="11" fill="#3730A3">Draw call: drawMeshThreadgroups(threadgroupsPerGrid:threadsPerObjectThreadgroup:threadsPerMeshThreadgroup:)</text>
<text x="380.0" y="333.5" text-anchor="middle" font-size="11" fill="#3730A3">Without an object function, threadgroupsPerGrid is the number of mesh threadgroups, so each one handles one meshlet.</text>
<text x="380.0" y="348.5" text-anchor="middle" font-size="11" fill="#3730A3">With an object function, it is the number of object threadgroups, and each one launches a mesh grid of its own.</text>
</svg>
