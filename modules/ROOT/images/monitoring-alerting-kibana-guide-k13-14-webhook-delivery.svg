<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 330" width="1080" height="330" role="img" aria-labelledby="t" font-family="Inter, system-ui, Helvetica, Arial, sans-serif">
<title id="t">A terminal showing the command curl -s localhost:8081 piped to jq (callout 36) and the last delivery of the webhook receiver: a JSON object with the rule Guide Bookshelf error logs, the alert query matched, the status Query matched, the value 234 and the conditions Number of matching documents is greater than 5</title>
<g><rect x="0" y="0" width="1080" height="330" fill="#F6F9FC" stroke="#CAD3E2" stroke-width="1"/><text x="16" y="24" font-family="Inter, system-ui, Helvetica, Arial, sans-serif" font-size="12" fill="#516381">Terminal</text><g><rect x="24" y="48" width="1032" height="190" rx="4" fill="#FFFFFF" stroke="#CAD3E2" stroke-width="1"/><text x="36" y="70" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#A5336D" xml:space="preserve">$ </text><text x="51.6" y="70" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#1D2A3E">curl -s localhost:8081 | jq '.[-1].body | fromjson'</text><text x="36" y="90" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#1D2A3E">{</text><text x="36" y="110" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#1D2A3E" xml:space="preserve">  &quot;rule&quot;: &quot;Guide Bookshelf error logs&quot;,</text><text x="36" y="130" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#1D2A3E" xml:space="preserve">  &quot;alert&quot;: &quot;query matched&quot;,</text><text x="36" y="150" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#1D2A3E" xml:space="preserve">  &quot;status&quot;: &quot;Query matched&quot;,</text><text x="36" y="170" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#1D2A3E" xml:space="preserve">  &quot;value&quot;: &quot;234&quot;,</text><text x="36" y="190" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#1D2A3E" xml:space="preserve">  &quot;conditions&quot;: &quot;Number of matching documents is greater than 5&quot;</text><text x="36" y="210" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="13" fill="#1D2A3E">}</text></g>
