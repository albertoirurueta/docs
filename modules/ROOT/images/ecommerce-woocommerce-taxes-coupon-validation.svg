<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Coupon validation and discount calculation</title>
  <desc id="d">A code entered in the cart goes through WC_Discounts: coupons enabled, the coupon exists, expiry, usage limit, usage limit per user, minimum and maximum spend, product, category, sale item and email restrictions, and finally the woocommerce_coupon_is_valid filter where the Coffee Club rule throws an error. A valid coupon is then applied by type: percent, fixed cart or fixed product, before tax, and tax is recalculated on the discounted prices.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <rect x="30" y="25" width="250" height="60" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="155.0" y="50.0" text-anchor="middle" font-weight="bold">Customer enters COFFEECLUB10</text>
  <text x="155.0" y="68.0" text-anchor="middle">cart block, checkout or Store API</text>
  <rect x="325" y="25" width="250" height="60" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="50.0" text-anchor="middle" font-weight="bold">Enable coupons?</text>
  <text x="450.0" y="68.0" text-anchor="middle">WooCommerce &gt; Settings &gt; General</text>
  <rect x="620" y="25" width="250" height="60" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="745.0" y="50.0" text-anchor="middle" font-weight="bold">Coupon exists?</text>
  <text x="745.0" y="68.0" text-anchor="middle">code lookup, lower case</text>
  <line x1="280" y1="55" x2="325" y2="55" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="575" y1="55" x2="620" y2="55" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="125" width="250" height="70" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="155.0" y="146.0" text-anchor="middle" font-weight="bold">Dates and limits</text>
  <text x="155.0" y="164.0" text-anchor="middle">expiry, usage limit,</text>
  <text x="155.0" y="182.0" text-anchor="middle">usage limit per user</text>
  <rect x="325" y="125" width="250" height="70" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="146.0" text-anchor="middle" font-weight="bold">Amounts</text>
  <text x="450.0" y="164.0" text-anchor="middle">minimum and maximum spend</text>
  <text x="450.0" y="182.0" text-anchor="middle">(subtotal of the cart)</text>
  <rect x="620" y="125" width="250" height="70" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="745.0" y="146.0" text-anchor="middle" font-weight="bold">Restrictions</text>
  <text x="745.0" y="164.0" text-anchor="middle">products, categories, brands,</text>
  <text x="745.0" y="182.0" text-anchor="middle">sale items, allowed emails</text>
  <line x1="745" y1="85" x2="155" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="280" y1="160" x2="325" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="575" y1="160" x2="620" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="150" y="235" width="600" height="70" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="265.0" text-anchor="middle" font-weight="bold">Filter woocommerce_coupon_is_valid( true, WC_Coupon, WC_Discounts )</text>
  <text x="450.0" y="283.0" text-anchor="middle">extension rules: throw an Exception with a message (the Coffee Club example uses code 109)</text>
  <line x1="745" y1="195" x2="600" y2="235" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="30" y="345" width="260" height="90" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="160.0" y="376.0" text-anchor="middle" font-weight="bold">percent</text>
  <text x="160.0" y="394.0" text-anchor="middle">10% of the price of each</text>
  <text x="160.0" y="412.0" text-anchor="middle">matching line (beans only)</text>
  <rect x="320" y="345" width="260" height="90" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="376.0" text-anchor="middle" font-weight="bold">fixed_cart</text>
  <text x="450.0" y="394.0" text-anchor="middle">amount shared across lines;</text>
  <text x="450.0" y="412.0" text-anchor="middle">not per item</text>
  <rect x="610" y="345" width="260" height="90" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="740.0" y="376.0" text-anchor="middle" font-weight="bold">fixed_product</text>
  <text x="740.0" y="394.0" text-anchor="middle">amount off each unit of the</text>
  <text x="740.0" y="412.0" text-anchor="middle">matching products</text>
  <line x1="450" y1="305" x2="160" y2="345" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="305" x2="450" y2="345" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="305" x2="740" y2="345" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="150" y="465" width="600" height="45" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="491.5" text-anchor="middle">Discount applied before tax; tax recalculated on the discounted price (19.80 -&gt; 17.82 + 1.78 tax = 19.60)</text>
  <line x1="450" y1="435" x2="450" y2="465" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
