<svg viewBox="0 0 760 370" width="760" height="370" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-interaction-picking-controls-controls-compared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="370" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Four controls, four jobs</text>
<rect x="20" y="55" width="170" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="79.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">OrbitControls</text>
<rect x="20" y="105" width="170" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="145.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Orbit, zoom, pan</text>
<text x="105.0" y="159.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">around a target</text>
<text x="105.0" y="173.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Moves the camera</text>
<text x="105.0" y="187.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Needs update() with</text>
<text x="105.0" y="201.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">damping / autoRotate</text>
<rect x="205" y="55" width="170" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="290.0" y="79.2" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">PointerLockControls</text>
<rect x="205" y="105" width="170" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="290.0" y="145.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">First-person look</text>
<text x="290.0" y="159.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pointer lock API</text>
<text x="290.0" y="173.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">lock() after a click</text>
<text x="290.0" y="187.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">moveForward and</text>
<text x="290.0" y="201.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">moveRight help</text>
<rect x="390" y="55" width="170" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="475.0" y="79.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">TransformControls</text>
<rect x="390" y="105" width="170" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="475.0" y="145.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Gizmo on one object</text>
<text x="475.0" y="159.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">translate/rotate/scale</text>
<text x="475.0" y="173.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Snaps and spaces</text>
<text x="475.0" y="187.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Add getHelper()</text>
<text x="475.0" y="201.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">to the scene</text>
<rect x="575" y="55" width="170" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="660.0" y="79.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">DragControls</text>
<rect x="575" y="105" width="170" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="660.0" y="145.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Drag objects with</text>
<text x="660.0" y="159.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the pointer</text>
<text x="660.0" y="173.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Events: dragstart,</text>
<text x="660.0" y="187.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">drag, dragend,</text>
<text x="660.0" y="201.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">hoveron, hoveroff</text>
<rect x="20" y="255" width="720" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="289.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">All four are addons: import { OrbitControls } from 'three/addons/controls/OrbitControls.js';</text>
<text x="380.0" y="303.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Camera controls and object controls fight for the same pointer events:</text>
<text x="380.0" y="317.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">disable the orbit while a gizmo drags, and keep the raycast picking on click, not on pointerdown.</text>
</svg>
