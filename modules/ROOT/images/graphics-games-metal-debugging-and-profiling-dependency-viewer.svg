<text x="295.0" y="186.7" text-anchor="middle" font-size="12" fill="#92400E">Particle compute</text>
<text x="295.0" y="201.7" text-anchor="middle" font-size="12" fill="#92400E">particle buffer</text>
<rect x="430" y="100" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
