<text x="585.0" y="262.9" text-anchor="middle" font-size="11" fill="#374151">An unused resource shows up as a pass-less</text>
<text x="585.0" y="276.9" text-anchor="middle" font-size="11" fill="#374151">node: delete it or stop encoding the work</text>
<rect x="20" y="300" width="720" height="30" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380.0" y="318.9" text-anchor="middle" font-size="11" fill="#374151">Modes: All, Synchronisation, Data Flow. Pin a resource to keep it visible when the graph is compacted.</text>
