<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">A G/L account becomes a cost element through its account type and its cost element category</title>
  <desc id="d">A G/L account of the chart of accounts has an account type. Accounts of type primary costs or revenue are posted directly by entering the account, and their cost element category is 01 primary costs or cost-reducing revenues, 03 or 04 accrual and deferral, 11 revenues, 12 sales deduction or 22 external settlement. Accounts of type secondary costs are filled by the system during allocation and settlement, and their category is 21 internal settlement, 31 results analysis, 41 overhead rates, 42 assessment, 43 internal activity allocation, 50 to 52 project-related incoming orders, 61 earned value or 66 reporting cost elements for profitability analysis. The category is stored for the controlling area, here EX00. The example accounts are illustrative: a rent account in category 01 and the account 940000 in category 42.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="300" y="16" width="480" height="70" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="36.5" text-anchor="middle" font-size="14" font-weight="bold">G/L account in the chart of accounts</text>
  <text x="540" y="55.5" text-anchor="middle" font-size="12">account type, then the cost element category</text>
  <text x="540" y="74.5" text-anchor="middle" font-size="12">kept for the controlling area, for example EX00</text>
  <line x1="420" y1="86" x2="270" y2="140" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="660" y1="86" x2="810" y2="140" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="140" width="500" height="64" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="270" y="157.5" text-anchor="middle" font-size="14" font-weight="bold">Primary costs or revenue</text>
  <text x="270" y="176.5" text-anchor="middle" font-size="12">posted directly: you name the account, in FI or MM</text>
  <text x="270" y="195.5" text-anchor="middle" font-size="12">needs a CO account assignment such as a cost center</text>
  <rect x="560" y="140" width="500" height="64" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="810" y="157.5" text-anchor="middle" font-size="14" font-weight="bold">Secondary costs</text>
  <text x="810" y="176.5" text-anchor="middle" font-size="12">posted indirectly: the system determines the account</text>
  <text x="810" y="195.5" text-anchor="middle" font-size="12">filled by allocation, assessment and settlement</text>
  <rect x="20" y="224" width="500" height="168" rx="10" fill="#4ade80" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="254" text-anchor="start" font-size="13">01  Primary costs / cost-reducing revenues</text>
  <text x="40" y="278" text-anchor="start" font-size="13">03  Accrual/deferral per surcharge</text>
  <text x="40" y="302" text-anchor="start" font-size="13">04  Accrual/deferral per debit = actual</text>
  <text x="40" y="326" text-anchor="start" font-size="13">11  Revenues</text>
  <text x="40" y="350" text-anchor="start" font-size="13">12  Sales deduction</text>
  <text x="40" y="374" text-anchor="start" font-size="13">22  External settlement</text>
  <rect x="560" y="224" width="500" height="216" rx="10" fill="#b76fe0" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="580" y="254" text-anchor="start" font-size="13">21  Internal settlement</text>
  <text x="580" y="278" text-anchor="start" font-size="13">31  Order/project results analysis</text>
  <text x="580" y="302" text-anchor="start" font-size="13">41  Overhead rates</text>
  <text x="580" y="326" text-anchor="start" font-size="13">42  Assessment</text>
  <text x="580" y="350" text-anchor="start" font-size="13">43  Internal activity allocation</text>
  <text x="580" y="374" text-anchor="start" font-size="13">50-52  Project-related incoming orders</text>
  <text x="580" y="398" text-anchor="start" font-size="13">61  Earned value</text>
  <text x="580" y="422" text-anchor="start" font-size="13">66  Reporting cost elements, CO-PA</text>
  <line x1="270" y1="204" x2="270" y2="224" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="810" y1="204" x2="810" y2="224" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="424" width="500" height="56" rx="10" fill="#4fa3c8" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="270" y="447" text-anchor="middle" font-size="13" font-weight="bold">Example in EX00 (illustrative)</text>
  <text x="270" y="465" text-anchor="middle" font-size="11">rent account, category 01, posted on cost center EX-ADM</text>
  <rect x="560" y="456" width="500" height="56" rx="10" fill="#4fa3c8" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="810" y="479" text-anchor="middle" font-size="13" font-weight="bold">Example in EX00 (illustrative)</text>
  <text x="810" y="497" text-anchor="middle" font-size="11">940000 IT costs allocated, category 42, set by assessment</text>
  <text x="540" y="544" text-anchor="middle" font-size="11">Categories 03, 04 and 31 appear on the on-premise page; the Public Edition page lists the other categories.</text>
</svg>
