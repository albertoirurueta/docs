<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="410" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">AI tiers and the shared monthly allowance</text>
  <rect x="20" y="56" width="230" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="135" y="86" font-size="16" fill="#1F2937" text-anchor="middle" font-weight="bold">Standard</text>
  <text x="135" y="112" font-size="12" fill="#374151" text-anchor="middle">Image Upscaler, Magic Formulas</text>
  <text x="135" y="180" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Paid plans: unmetered*</text>
  <text x="135" y="198" font-size="12" fill="#92400E" text-anchor="middle">Free: draws from the allowance</text>
  <rect x="40" y="226" width="190" height="16" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="40" y="226" width="40" height="16" rx="4" fill="#4F46E5"/>
  <text x="135" y="264" font-size="12" fill="#6B7280" text-anchor="middle">lightest draw</text>
  <rect x="265" y="56" width="230" height="230" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="86" font-size="16" fill="#1F2937" text-anchor="middle" font-weight="bold">Premium</text>
  <text x="380" y="112" font-size="12" fill="#374151" text-anchor="middle">Magic Layers, Canva Code,</text>
  <text x="380" y="128" font-size="12" fill="#374151" text-anchor="middle">image and design generation,</text>
  <text x="380" y="144" font-size="12" fill="#374151" text-anchor="middle">music, forms</text>
  <text x="380" y="180" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Shares the monthly allowance</text>
  <text x="380" y="198" font-size="12" fill="#92400E" text-anchor="middle">Limited on Free</text>
  <rect x="285" y="226" width="190" height="16" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="285" y="226" width="95" height="16" rx="4" fill="#4F46E5"/>
  <text x="380" y="264" font-size="12" fill="#6B7280" text-anchor="middle">heavier draw</text>
  <rect x="510" y="56" width="230" height="230" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="625" y="86" font-size="16" fill="#1F2937" text-anchor="middle" font-weight="bold">Ultra</text>
  <text x="625" y="112" font-size="12" fill="#374151" text-anchor="middle">Conversational design with</text>
  <text x="625" y="128" font-size="12" fill="#374151" text-anchor="middle">Canva AI 2.0, video clips</text>
  <text x="625" y="180" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Shares the allowance, uses the most</text>
  <text x="625" y="198" font-size="12" fill="#92400E" text-anchor="middle">Paid plans only</text>
  <rect x="530" y="226" width="190" height="16" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="530" y="226" width="150" height="16" rx="4" fill="#B45309"/>
  <text x="625" y="264" font-size="12" fill="#6B7280" text-anchor="middle">heaviest draw</text>
  <rect x="20" y="300" width="720" height="48" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="380" y="320" font-size="12" fill="#374151" text-anchor="middle">One shared monthly allowance per member, reset on the billing date. Not pooled across a team.</text>
  <text x="380" y="338" font-size="12" fill="#374151" text-anchor="middle">More allowance: a higher plan, AI Pass (Pro, Business, Nonprofits), or AI top-ups (Business only).</text>
  <text x="380" y="372" font-size="11" fill="#6B7280" text-anchor="middle">* Fair use limits apply.</text>
  <text x="380" y="392" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
