<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">nelNumber,PersonnelSubarea&amp;$orderby=Employee_PersonnelNumber'</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#OrganizationalAssignments&quot;,&quot;value&quot;:[{&quot;Employee_PersonnelNumber&quot;:&quot;00001234&quot;,&quot;PersonnelSuba</text>
