<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 381" width="1080" height="381" role="img" aria-labelledby="sap-hr-guide-query-effective-dated-employee-data-04-as-of-date-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-hr-guide-query-effective-dated-employee-data-04-as-of-date-title">Terminal with three curl commands on the organizational assignments: without a date parameter the answer is the current records, where Ana Torres 00001234 is in personnel subarea 0002 from 2026-07-01 (callout 7); asOfDate=2025-06-30 returns her record from 2024-03-01 in subarea 0001 (callout 8); asOfDate=2026-07-01 returns her record from 2026-07-01 in subarea 0002 (callout 9); Ben Okoye and Chloe Martin have one record each; the long answers wrap onto several lines</title>
<g><rect x="0" y="0" width="1080" height="381" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="349" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/people/OrganizationalAssignments?$select=Employee_PersonnelNumber,PersonnelS</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">ubarea&amp;$orderby=Employee_PersonnelNumber'</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#OrganizationalAssignments&quot;,&quot;value&quot;:[{&quot;Employee_PersonnelNumber&quot;:&quot;00001234&quot;,&quot;PersonnelSuba</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">rea&quot;:&quot;0002&quot;,&quot;BeginDate&quot;:&quot;2026-07-01&quot;},{&quot;Employee_PersonnelNumber&quot;:&quot;00001235&quot;,&quot;PersonnelSubarea&quot;:&quot;0001&quot;,&quot;BeginDate&quot;:&quot;20</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">24-09-01&quot;},{&quot;Employee_PersonnelNumber&quot;:&quot;00001236&quot;,&quot;PersonnelSubarea&quot;:&quot;0002&quot;,&quot;BeginDate&quot;:&quot;2025-01-15&quot;}]}</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s 'http://localhost:4004/odata/v4/people/OrganizationalAssignments?asOfDate=2025-06-30&amp;$select=Employee_Person</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">nelNumber,PersonnelSubarea&amp;$orderby=Employee_PersonnelNumber'</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#OrganizationalAssignments&quot;,&quot;value&quot;:[{&quot;Employee_PersonnelNumber&quot;:&quot;00001234&quot;,&quot;PersonnelSuba</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">rea&quot;:&quot;0001&quot;,&quot;BeginDate&quot;:&quot;2024-03-01&quot;},{&quot;Employee_PersonnelNumber&quot;:&quot;00001235&quot;,&quot;PersonnelSubarea&quot;:&quot;0001&quot;,&quot;BeginDate&quot;:&quot;20</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">24-09-01&quot;},{&quot;Employee_PersonnelNumber&quot;:&quot;00001236&quot;,&quot;PersonnelSubarea&quot;:&quot;0002&quot;,&quot;BeginDate&quot;:&quot;2025-01-15&quot;}]}</text>
