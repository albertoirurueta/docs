<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">How a Vec grows: length versus capacity</text>
  <text x="450" y="46" font-size="12" fill="#666666" text-anchor="middle">when len reaches capacity, the next push allocates a larger buffer (currently double) and moves the elements</text>
  <g font-size="12" fill="#333333">
    <text x="30" y="92" font-weight="bold">push #1</text>
    <text x="30" y="152" font-weight="bold">push #2..4</text>
    <text x="30" y="212" font-weight="bold">push #5</text>
    <text x="30" y="272" font-weight="bold">push #6..8</text>
    <text x="30" y="332" font-weight="bold">push #9</text>
  </g>
  <g stroke-width="1.2">
    <!-- cap 4, len 1 -->
    <rect x="130" y="72" width="40" height="30" fill="#1c4b73" stroke="#1c4b73"/>
    <rect x="170" y="72" width="40" height="30" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="4,3"/>
    <rect x="210" y="72" width="40" height="30" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="4,3"/>
    <rect x="250" y="72" width="40" height="30" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="4,3"/>
    <!-- cap 4, len 4 -->
    <rect x="130" y="132" width="40" height="30" fill="#1c4b73" stroke="#1c4b73"/>
    <rect x="170" y="132" width="40" height="30" fill="#1c4b73" stroke="#1c4b73"/>
    <rect x="210" y="132" width="40" height="30" fill="#1c4b73" stroke="#1c4b73"/>
    <rect x="250" y="132" width="40" height="30" fill="#1c4b73" stroke="#1c4b73"/>
    <!-- cap 8, len 5 -->
    <rect x="130" y="192" width="40" height="30" fill="#a35a00" stroke="#a35a00"/>
    <rect x="170" y="192" width="40" height="30" fill="#a35a00" stroke="#a35a00"/>
    <rect x="210" y="192" width="40" height="30" fill="#a35a00" stroke="#a35a00"/>
    <rect x="250" y="192" width="40" height="30" fill="#a35a00" stroke="#a35a00"/>
    <rect x="290" y="192" width="40" height="30" fill="#1c4b73" stroke="#1c4b73"/>
    <rect x="330" y="192" width="40" height="30" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="4,3"/>
    <rect x="370" y="192" width="40" height="30" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="4,3"/>
    <rect x="410" y="192" width="40" height="30" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="4,3"/>
    <!-- cap 8, len 8 -->
    <rect x="130" y="252" width="320" height="30" fill="#1c4b73" stroke="#1c4b73"/>
    <!-- cap 16, len 9 -->
    <rect x="130" y="312" width="320" height="30" fill="#a35a00" stroke="#a35a00"/>
    <rect x="450" y="312" width="40" height="30" fill="#1c4b73" stroke="#1c4b73"/>
    <rect x="490" y="312" width="280" height="30" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="4,3"/>
  </g>
  <g font-size="12" fill="#333333">
    <text x="310" y="92">len 1, capacity 4 (first allocation)</text>
    <text x="310" y="152">len 4, capacity 4: full</text>
    <text x="470" y="212">len 5, capacity 8: reallocated, 4 moved</text>
    <text x="470" y="272">len 8, capacity 8: full</text>
    <text x="790" y="332">len 9, cap 16</text>
  </g>
  <g font-size="11">
    <rect x="560" y="74" width="14" height="14" fill="#1c4b73"/><text x="580" y="86" fill="#333333">element written in place</text>
    <rect x="560" y="98" width="14" height="14" fill="#a35a00"/><text x="580" y="110" fill="#333333">element moved by a reallocation</text>
    <rect x="560" y="122" width="14" height="14" fill="#ffffff" stroke="#1c4b73" stroke-dasharray="3,2"/><text x="580" y="134" fill="#333333">spare capacity (allocated, uninitialised)</text>
  </g>
  <text x="450" y="368" font-size="12" fill="#666666" text-anchor="middle">growth is amortised O(1) per push; Vec::with_capacity(n) or reserve(n) avoids the intermediate reallocations</text>
</svg>
