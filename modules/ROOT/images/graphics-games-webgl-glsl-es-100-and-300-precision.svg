<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-glsl-precision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Precision qualifiers and their guaranteed minimums</text>
<rect x="20" y="50" width="720" height="30" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="28" y="70" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">Qualifier</text>
<text x="158" y="70" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">float range</text>
<text x="298" y="70" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">float precision</text>
<text x="438" y="70" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">int range (ES 3.00)</text>
<text x="598" y="70" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">typical use</text>
<rect x="20" y="86" width="720" height="36" rx="4" fill="#FEF3C7" stroke="#E5E7EB" stroke-width="1"/>
<text x="28" y="109" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">lowp</text>
<text x="158" y="109" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">-2 .. 2</text>
<text x="298" y="109" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">2^-8</text>
<text x="438" y="109" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">-2^8 .. 2^8</text>
<text x="598" y="109" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">colours in 0 .. 1</text>
<rect x="20" y="126" width="720" height="36" rx="4" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="28" y="149" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">mediump</text>
<text x="158" y="149" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">-2^14 .. 2^14</text>
<text x="298" y="149" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">2^-10</text>
<text x="438" y="149" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">-2^15 .. 2^15</text>
<text x="598" y="149" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">uv, normals, lighting</text>
<rect x="20" y="166" width="720" height="36" rx="4" fill="#D1FAE5" stroke="#E5E7EB" stroke-width="1"/>
<text x="28" y="189" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">highp</text>
<text x="158" y="189" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">-2^62 .. 2^62</text>
<text x="298" y="189" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">2^-16</text>
<text x="438" y="189" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">-2^31 .. 2^31</text>
<text x="598" y="189" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">positions, depth, matrices</text>
<text x="380" y="230" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">These are minimums. Many desktop GPUs run mediump as 32-bit float; phones often run it as 16-bit.</text>
<text x="380" y="252" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Fragment shaders must declare a default float precision (precision mediump float;) or a qualifier on each float.</text>
<text x="380" y="274" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Vertex shaders default to highp. gl.getShaderPrecisionFormat(type, precisionType) reports what the device gives.</text>
<text x="380" y="296" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">In GLSL ES 3.00 highp is mandatory in fragment shaders; in GLSL ES 1.00 it is optional there.</text>
</svg>
