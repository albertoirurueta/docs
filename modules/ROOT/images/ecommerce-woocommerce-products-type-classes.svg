<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">The product classes and the data store each one uses</title>
  <desc id="d">WC_Data is the base of all CRUD objects. WC_Abstract_Legacy_Product extends WC_Data and WC_Product extends it. WC_Product_Simple, WC_Product_Variable, WC_Product_Grouped and WC_Product_External extend WC_Product, and the custom WC_Product_Tasting_Flight of Pocket Coffee does the same. WC_Product_Variation extends WC_Product_Simple. Simple, external and custom types use the data store key product with WC_Product_Data_Store_CPT; variable, grouped and variation products have their own data store classes.</desc>
  <rect x="0" y="0" width="960" height="510" rx="14" fill="#2b3a4a"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker></defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">Four core types, one variation class and a custom type</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">Class hierarchy and data stores in WooCommerce 11.2.1; the dashed box is the Pocket Coffee type built on this page</text>
  <rect x="40" y="76" width="220" height="44" rx="6" fill="#3d5266"/>
  <text x="150.0" y="101.5" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">WC_Data</text>
  <rect x="370" y="76" width="260" height="44" rx="6" fill="#3d5266"/>
  <text x="500.0" y="101.5" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">WC_Abstract_Legacy_Product</text>
  <rect x="740" y="76" width="180" height="44" rx="6" fill="#34495e" stroke="#f4b860" stroke-width="1.6"/>
  <text x="830.0" y="101.5" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">WC_Product</text>
  <path d="M260 98 L368 98" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M630 98 L738 98" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text x="315" y="90" font-size="11" text-anchor="middle" fill="#9fd3c7">extends</text>
  <text x="685" y="90" font-size="11" text-anchor="middle" fill="#9fd3c7">extends</text>
  <rect x="40" y="190" width="168" height="112" rx="6" fill="#3d5266"/>
  <text x="124" y="214" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">WC_Product_Simple</text>
  <text x="124" y="236" font-size="11.5" text-anchor="middle" fill="#9fd3c7" font-family="Menlo, Consolas, monospace">type: simple</text>
  <text x="124" y="258" font-size="11" text-anchor="middle" fill="#f2f5f8">store: product</text>
  <text x="124" y="282" font-size="10.5" text-anchor="middle" fill="#f2f5f8">WC_Product_Data_Store_CPT</text>
  <rect x="218" y="190" width="168" height="112" rx="6" fill="#3d5266"/>
  <text x="302" y="214" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">WC_Product_Variable</text>
  <text x="302" y="236" font-size="11.5" text-anchor="middle" fill="#9fd3c7" font-family="Menlo, Consolas, monospace">type: variable</text>
  <text x="302" y="258" font-size="11" text-anchor="middle" fill="#f2f5f8">store: product-variable</text>
  <text x="302" y="276" font-size="10" text-anchor="middle" fill="#f2f5f8">WC_Product_Variable</text>
  <text x="302" y="290" font-size="10" text-anchor="middle" fill="#f2f5f8">_Data_Store_CPT</text>
  <rect x="396" y="190" width="168" height="112" rx="6" fill="#3d5266"/>
  <text x="480" y="214" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">WC_Product_Grouped</text>
  <text x="480" y="236" font-size="11.5" text-anchor="middle" fill="#9fd3c7" font-family="Menlo, Consolas, monospace">type: grouped</text>
  <text x="480" y="258" font-size="11" text-anchor="middle" fill="#f2f5f8">store: product-grouped</text>
  <text x="480" y="276" font-size="10" text-anchor="middle" fill="#f2f5f8">WC_Product_Grouped</text>
  <text x="480" y="290" font-size="10" text-anchor="middle" fill="#f2f5f8">_Data_Store_CPT</text>
  <rect x="574" y="190" width="168" height="112" rx="6" fill="#3d5266"/>
  <text x="658" y="214" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">WC_Product_External</text>
  <text x="658" y="236" font-size="11.5" text-anchor="middle" fill="#9fd3c7" font-family="Menlo, Consolas, monospace">type: external</text>
  <text x="658" y="258" font-size="11" text-anchor="middle" fill="#f2f5f8">store: product</text>
  <text x="658" y="282" font-size="10.5" text-anchor="middle" fill="#f2f5f8">WC_Product_Data_Store_CPT</text>
  <rect x="752" y="190" width="168" height="112" rx="6" fill="#3d5266" stroke="#e8908a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="836" y="214" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">WC_Product_Tasting_Flight</text>
  <text x="836" y="236" font-size="11.5" text-anchor="middle" fill="#9fd3c7" font-family="Menlo, Consolas, monospace">type: tasting_flight</text>
  <text x="836" y="258" font-size="11" text-anchor="middle" fill="#f2f5f8">store: product (fallback)</text>
  <text x="836" y="282" font-size="10.5" text-anchor="middle" fill="#f2f5f8">WC_Product_Data_Store_CPT</text>
  <path d="M830 120 L830 150 L124 150 L124 188" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M830 120 L830 150 L302 150 L302 188" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M830 120 L830 150 L480 150 L480 188" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M830 120 L830 150 L658 150 L658 188" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <path d="M830 120 L830 150 L836 150 L836 188" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="40" y="350" width="168" height="112" rx="6" fill="#3d5266"/>
  <text x="124" y="374" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#f2f5f8">WC_Product_Variation</text>
  <text x="124" y="396" font-size="11.5" text-anchor="middle" fill="#9fd3c7" font-family="Menlo, Consolas, monospace">type: variation</text>
  <text x="124" y="418" font-size="11" text-anchor="middle" fill="#f2f5f8">store: product-variation</text>
  <text x="124" y="436" font-size="10" text-anchor="middle" fill="#f2f5f8">WC_Product_Variation</text>
  <text x="124" y="450" font-size="10" text-anchor="middle" fill="#f2f5f8">_Data_Store_CPT</text>
  <path d="M124 350 L124 304" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text x="134" y="330" font-size="11" text-anchor="start" fill="#9fd3c7">extends WC_Product_Simple</text>
  <rect x="250" y="350" width="670" height="140" rx="6" fill="#34495e"/>
  <text x="266" y="374" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">How WooCommerce picks the class and the store</text>
  <text x="266" y="400" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_get_product( $id ) reads the product_type term of the post and builds the class name:</text>
  <text x="266" y="420" font-size="11.5" text-anchor="start" fill="#f2f5f8">the class name is WC_Product_ + the slug with its first letter upper-cased (woocommerce_product_class can replace it).</text>
  <text x="266" y="440" font-size="11.5" text-anchor="start" fill="#f2f5f8">WC_Data_Store::load( "product-" . $type ) uses that store if it exists, else the store "product".</text>
  <text x="266" y="460" font-size="11.5" text-anchor="start" fill="#f2f5f8">Variations are posts of type product_variation; every other type is a post of type product.</text>
  <text x="266" y="480" font-size="11.5" text-anchor="start" fill="#f2f5f8">A custom type is a subclass of WC_Product plus an entry in the product_type term list.</text>
</svg>
