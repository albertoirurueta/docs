<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where a file lives: plan, team, folder, file</text>
  <rect x="30" y="50" width="700" height="330" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="48" y="76" font-size="14" font-weight="bold" fill="#3730A3">Plan (Organization or Enterprise: organization, optional workspaces)</text>
  <rect x="55" y="92" width="650" height="272" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="72" y="116" font-size="14" font-weight="bold" fill="#3730A3">Team: Bookshelf Product</text>
  <rect x="80" y="130" width="300" height="214" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="96" y="152" font-size="13" font-weight="bold" fill="#3730A3">Folder: Mobile app</text>
  <rect x="100" y="166" width="260" height="40" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="116" y="191" font-size="13" fill="#374151">Folder: Onboarding (nested)</text>
  <rect x="120" y="218" width="220" height="30" rx="6" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="132" y="238" font-size="12" fill="#374151">File: Bookshelf onboarding</text>
  <rect x="100" y="262" width="240" height="30" rx="6" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="112" y="282" font-size="12" fill="#374151">File: Bookshelf library screens</text>
  <text x="96" y="326" font-size="12" fill="#374151">Folders nest up to 10 levels (paid plans)</text>
  <rect x="410" y="130" width="270" height="100" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="426" y="152" font-size="13" font-weight="bold" fill="#92400E">Drafts (inside the team)</text>
  <rect x="426" y="166" width="238" height="30" rx="6" fill="#FFFFFF" stroke="#B45309"/>
  <text x="438" y="186" font-size="12" fill="#374151">File: Cover ideas (private to you)</text>
  <text x="426" y="216" font-size="12" fill="#374151">Share on purpose, or move into a folder</text>
  <path d="M545 232 C 545 262, 420 262, 384 240" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <text x="560" y="262" font-size="12" fill="#374151">Move file</text>
  <rect x="410" y="290" width="270" height="54" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="426" y="312" font-size="12" fill="#374151">Starter and Professional: one team,</text>
  <text x="426" y="330" font-size="12" fill="#374151">so the plan and the team are the same</text>
  <circle cx="70" cy="104" r="11" fill="#4F46E5"/><text x="70" y="108" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="80" cy="130" r="11" fill="#4F46E5"/><text x="80" y="134" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="410" cy="130" r="11" fill="#B45309"/><text x="410" y="134" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="120" cy="218" r="11" fill="#4F46E5"/><text x="120" y="222" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
</svg>
