<text x="380" y="310" font-size="12" fill="#4B5563" text-anchor="middle">Outline heart = Saved false; filled heart = Saved true. Dashed ring = tap in Presentation view.</text>
<text x="380" y="332" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, after the Figma Learn article on interactive components with variants.</text>
