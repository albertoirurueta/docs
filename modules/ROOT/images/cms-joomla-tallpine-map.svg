<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tallpine Hiking Club site map</title>
<desc id="d">The Tallpine Hiking Club Joomla site: content, the cassiopeia_tallpine child template, the com_tallpine component, the mod_tallpine_nexthikes module and four plugins in the pkg_tallpine package feed one site, which an Astro or Next.js trail map reads through the Web Services API.</desc>
<rect width="960" height="700" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5a6a"/></marker></defs>
<g stroke="#4a5a6a" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M270 160 L395 235"/><path d="M690 160 L565 235"/><path d="M270 470 L395 395"/><path d="M690 470 L565 395"/>
<path d="M480 395 L480 603"/>
</g>
<rect x="395" y="235" width="170" height="160" rx="80" fill="#e8f1fb" stroke="#2a6bb0" stroke-width="3"/>
<text x="480" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3a">Tallpine</text>
<text x="480" y="322" text-anchor="middle" font-size="18" font-weight="700" fill="#1b2a3a">Hiking Club site</text>
<text x="480" y="346" text-anchor="middle" font-size="12" fill="#2c3e50">Joomla 6.2, PHP 8.3+</text>
<rect x="60" y="50" width="330" height="120" rx="10" fill="#fdf3e0" stroke="#c9892b" stroke-width="2"/>
<text x="225.0" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">Content</text>
<text x="225.0" y="100" text-anchor="middle" font-size="13" fill="#2c3e50">articles in Trails (Alpine, Valley) and News</text>
<text x="225.0" y="118" text-anchor="middle" font-size="13" fill="#2c3e50">custom fields: distance-km, elevation-gain,</text>
<text x="225.0" y="136" text-anchor="middle" font-size="13" fill="#2c3e50">difficulty, gpx-file, season</text>
<text x="225.0" y="154" text-anchor="middle" font-size="13" fill="#2c3e50">tags, contacts, banners, Smart Search</text>
<rect x="570" y="50" width="330" height="120" rx="10" fill="#e9f6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="735.0" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">Child template: cassiopeia_tallpine</text>
<text x="735.0" y="100" text-anchor="middle" font-size="13" fill="#2c3e50">child of Cassiopeia (colours, fonts)</text>
<text x="735.0" y="118" text-anchor="middle" font-size="13" fill="#2c3e50">new positions, layout overrides</text>
<text x="735.0" y="136" text-anchor="middle" font-size="13" fill="#2c3e50">joomla.asset.json, templateDetails.xml</text>
<rect x="60" y="430" width="330" height="150" rx="10" fill="#f3e8fb" stroke="#7b3fb0" stroke-width="2"/>
<text x="225.0" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">Component: com_tallpine</text>
<text x="225.0" y="480" text-anchor="middle" font-size="13" fill="#2c3e50">namespace Tallpine\Component\Tallpine</text>
<text x="225.0" y="498" text-anchor="middle" font-size="13" fill="#2c3e50">trail entity, admin and site views</text>
<text x="225.0" y="516" text-anchor="middle" font-size="13" fill="#2c3e50">SEF router, access.xml, categories</text>
<text x="225.0" y="534" text-anchor="middle" font-size="13" fill="#2c3e50">custom fields, language files, SQL scripts</text>
<rect x="570" y="430" width="330" height="150" rx="10" fill="#fbe9e7" stroke="#c0502f" stroke-width="2"/>
<text x="735.0" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">Module and plugins</text>
<text x="735.0" y="480" text-anchor="middle" font-size="13" fill="#2c3e50">mod_tallpine_nexthikes (Dispatcher, Helper)</text>
<text x="735.0" y="498" text-anchor="middle" font-size="13" fill="#2c3e50">plg_content_tallpine_conditions</text>
<text x="735.0" y="516" text-anchor="middle" font-size="13" fill="#2c3e50">plg_webservices_tallpine</text>
<text x="735.0" y="534" text-anchor="middle" font-size="13" fill="#2c3e50">plg_task_tallpine_trailsync</text>
<text x="735.0" y="552" text-anchor="middle" font-size="13" fill="#2c3e50">plg_console_tallpine (tallpine:import)</text>
<rect x="300" y="605" width="360" height="82" rx="10" fill="#eef1f4" stroke="#4a5a6a" stroke-width="2"/>
<text x="480.0" y="627" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2a3a">API front end: trail map</text>
<text x="480.0" y="647" text-anchor="middle" font-size="13" fill="#2c3e50">Astro or Next.js reads the Web Services</text>
<text x="480.0" y="662" text-anchor="middle" font-size="13" fill="#2c3e50">API (/api/index.php/v1/tallpine/trails)</text>
<text x="480.0" y="677" text-anchor="middle" font-size="13" fill="#2c3e50">with an API token kept in the environment</text>
<text x="480" y="699" text-anchor="middle" font-size="12" fill="#2c3e50">Package pkg_tallpine bundles the component, the module and the plugins.</text>
</svg>
