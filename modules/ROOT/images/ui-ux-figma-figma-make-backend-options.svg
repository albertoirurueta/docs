<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two ways to add a backend to the Bookshelf prototype</text>
  <rect x="24" y="48" width="350" height="230" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="386" y="48" width="350" height="230" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text x="199" y="76" font-size="15" font-weight="bold" fill="#3730A3" text-anchor="middle">Payload, created from a prompt</text>
  <text x="561" y="76" font-size="15" font-weight="bold" fill="#92400E" text-anchor="middle">Supabase, connected by you</text>
  <g font-size="12" fill="#374151">
    <text x="44" y="104">1 Describe an app that stores books and reviews</text>
    <text x="44" y="128">2 Click Create on the backend card</text>
    <text x="44" y="152">3 Make designs collections and the front end</text>
    <text x="44" y="176">4 Manage content in the CMS tab</text>
    <text x="44" y="206">Includes database, file storage, auth, admin panel</text>
    <text x="44" y="226">Hosted by Figma; admin at the published URL /admin</text>
    <text x="44" y="250">Not yet usable with GitHub or local codebase</text>
    <text x="406" y="104">1 Make settings, Integrations, Supabase</text>
    <text x="406" y="128">2 Connect Supabase, authorize Figma</text>
    <text x="406" y="152">3 Pick or create a project</text>
    <text x="406" y="176">4 Ask Make to create a secret, fill Create a secret</text>
    <text x="406" y="206">Compute, secret storage and Postgres in Supabase</text>
    <text x="406" y="226">Make currently uses key-value stores, not full SQL</text>
    <text x="406" y="250">Database password is separate from your account</text>
  </g>
  <rect x="24" y="290" width="712" height="28" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="380" y="309" font-size="12" fill="#B91C1C" text-anchor="middle" font-weight="bold">Never paste API keys or passwords into a prompt; use the secret fields and environment variables.</text>
</svg>
