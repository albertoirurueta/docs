<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-buffers-interleaved-layout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Interleaved vertex layout: stride and offset</text>
<text x="20" y="56" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">One vertex = position (vec3) + normal (vec3) + uv (vec2) = 32 bytes</text>
<rect x="20" y="80" width="120" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80.0" y="105.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">position  12 B</text>
<rect x="140" y="80" width="72" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="176.0" y="99.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">normal</text>
<text x="176.0" y="112.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">12 B</text>
<rect x="212" y="80" width="48" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="236.0" y="99.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">uv</text>
<text x="236.0" y="112.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">8 B</text>
<text x="140" y="148" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex 0</text>
<rect x="260" y="80" width="120" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="320.0" y="105.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">position  12 B</text>
<rect x="380" y="80" width="72" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="416.0" y="99.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">normal</text>
<text x="416.0" y="112.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">12 B</text>
<rect x="452" y="80" width="48" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="476.0" y="99.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">uv</text>
<text x="476.0" y="112.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">8 B</text>
<text x="380" y="148" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex 1</text>
<rect x="500" y="80" width="120" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="560.0" y="105.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">position  12 B</text>
<rect x="620" y="80" width="72" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="656.0" y="99.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">normal</text>
<text x="656.0" y="112.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">12 B</text>
<rect x="692" y="80" width="48" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="716.0" y="99.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">uv</text>
<text x="716.0" y="112.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">8 B</text>
<text x="620" y="148" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex 2</text>
<text x="20" y="176" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="start">offsets</text>
<rect x="20" y="200" width="230" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="218.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">attribute 0: position</text>
<text x="135.0" y="232.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">offset 0</text>
<rect x="270" y="200" width="230" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="385.0" y="218.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">attribute 1: normal</text>
<text x="385.0" y="232.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">offset 12</text>
<rect x="520" y="200" width="220" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="218.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">attribute 2: uv</text>
<text x="630.0" y="232.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">offset 24</text>
<rect x="20" y="270" width="720" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="290.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">stride = 32 bytes (distance from vertex n to vertex n + 1)</text>
<text x="380.0" y="305.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">glVertexArrayVertexBuffer(vao, 0, vbo, 0, 32)</text>
<rect x="20" y="340" width="720" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="364.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glVertexAttribPointer(1, 3, GL_FLOAT, GL_FALSE, 32, (void*)12)</text>
<text x="380.0" y="378.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">stride 32, offset 12 for the normal; offsets are the byte distance from the start of one vertex</text>
</svg>
