<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Chatterbox on Laravel Reverb: the browser sends messages to Laravel over HTTP, Laravel stores them in MySQL and posts the event to a Reverb server, Reverb servers share events through Redis, and every browser receives the event over its Pusher-protocol WebSocket</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Chatterbox on Laravel Reverb</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">writes go over HTTP, pushes come back over the Pusher-protocol WebSocket</text>

  <!-- arrows -->
  <line x1="170" y1="130" x2="290" y2="130" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="110" x2="600" y2="95" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="395" y1="170" x2="395" y2="330" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="690" y1="135" x2="690" y2="165" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="690" y1="220" x2="690" y2="255" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="600" y1="295" x2="170" y2="295" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- boxes -->
  <rect x="20" y="90" width="150" height="240" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="95" y="114" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Browser</text>
  <text x="95" y="134" font-size="10" fill="#0d3c75" text-anchor="middle">Echo + pusher-js</text>
  <text x="95" y="150" font-size="10" fill="#0d3c75" text-anchor="middle">@laravel/echo-react</text>
  <text x="95" y="172" font-size="10" fill="#0d3c75" text-anchor="middle">join('chat.general')</text>
  <text x="95" y="188" font-size="10" fill="#0d3c75" text-anchor="middle">.listen('.message')</text>
  <text x="95" y="204" font-size="10" fill="#0d3c75" text-anchor="middle">whisper('typing')</text>
  <text x="95" y="240" font-size="10" fill="#0d3c75" text-anchor="middle">sorts by seq,</text>
  <text x="95" y="255" font-size="10" fill="#0d3c75" text-anchor="middle">retries with the</text>
  <text x="95" y="270" font-size="10" fill="#0d3c75" text-anchor="middle">same id</text>

  <rect x="290" y="70" width="210" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="395" y="94" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">Laravel app</text>
  <text x="395" y="114" font-size="10" fill="#1b4d1f" text-anchor="middle">POST /api/chat (Sanctum)</text>
  <text x="395" y="130" font-size="10" fill="#1b4d1f" text-anchor="middle">POST /api/broadcasting/auth</text>
  <text x="395" y="146" font-size="10" fill="#1b4d1f" text-anchor="middle">validate, seq, dedupe, ack</text>
  <text x="395" y="160" font-size="10" fill="#1b4d1f" text-anchor="middle">ChatEnvelope event</text>

  <rect x="290" y="335" width="210" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="395" y="357" font-size="13" font-weight="bold" fill="#7a2e00" text-anchor="middle">MySQL</text>
  <text x="395" y="373" font-size="10" fill="#7a2e00" text-anchor="middle">messages, acks, room counter</text>
  <text x="395" y="387" font-size="10" fill="#7a2e00" text-anchor="middle">row lock gives the seq</text>

  <rect x="600" y="60" width="180" height="75" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="690" y="84" font-size="13" font-weight="bold" fill="#3d0f57" text-anchor="middle">Reverb 1 :8080</text>
  <text x="690" y="102" font-size="10" fill="#3d0f57" text-anchor="middle">/app WebSocket</text>
  <text x="690" y="117" font-size="10" fill="#3d0f57" text-anchor="middle">/apps events API</text>

  <rect x="600" y="165" width="180" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="690" y="189" font-size="13" font-weight="bold" fill="#7a2e00" text-anchor="middle">Redis</text>
  <text x="690" y="207" font-size="10" fill="#7a2e00" text-anchor="middle">pub/sub channel "reverb"</text>

  <rect x="600" y="255" width="180" height="75" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="690" y="279" font-size="13" font-weight="bold" fill="#3d0f57" text-anchor="middle">Reverb 2 :8080</text>
  <text x="690" y="297" font-size="10" fill="#3d0f57" text-anchor="middle">same app key and secret</text>
  <text x="690" y="312" font-size="10" fill="#3d0f57" text-anchor="middle">other browsers connect here</text>

  <!-- labels -->
  <text x="230" y="120" font-size="9.5" fill="#222222" text-anchor="middle">HTTP: envelope in,</text>
  <text x="230" y="146" font-size="9.5" fill="#222222" text-anchor="middle">ack or error out</text>
  <text x="550" y="86" font-size="9.5" fill="#222222" text-anchor="middle">signed POST</text>
  <text x="405" y="250" font-size="9.5" fill="#222222">commit, then broadcast</text>
  <text x="385" y="288" font-size="9.5" fill="#6a1b9a" text-anchor="middle" font-weight="bold">pushes: message, edit, react, member_added, client-typing</text>
  <text x="700" y="153" font-size="9.5" fill="#222222">publish</text>
  <text x="700" y="241" font-size="9.5" fill="#222222">deliver</text>

  <!-- legend -->
  <line x1="40" y1="420" x2="80" y2="420" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="90" y="424" font-size="10" fill="#222222">HTTP</text>
  <line x1="150" y1="420" x2="190" y2="420" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="424" font-size="10" fill="#222222">WebSocket (wss) push</text>
  <line x1="340" y1="420" x2="380" y2="420" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="390" y="424" font-size="10" fill="#222222">Redis pub/sub</text>
  <text x="400" y="442" font-size="10" fill="#555555" text-anchor="middle">Laravel 13.38, Reverb 1.12.0, Echo 2.6.1 and pusher-js 8.6.0 as checked on 2026-10-24</text>
</svg>
