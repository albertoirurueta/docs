<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img">
<title>Gaussian mixture covariance types</title>
<desc>Four panels show two-dimensional Gaussian components for covariance_type spherical, diag, tied and full, with the number of free parameters for three components.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="start" fill="#0F172A" font-weight="bold">covariance_type controls the component shape</text>
<rect x="24" y="60" width="160" height="200" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<ellipse cx="74" cy="138" rx="20.8" ry="20.8" transform="rotate(0 74 138)" fill="#CCFBF1" fill-opacity="0.85" stroke="#0F766E" stroke-width="2"/>
<ellipse cx="130" cy="168" rx="30.400000000000002" ry="30.400000000000002" transform="rotate(0 130 168)" fill="#DBEAFE" fill-opacity="0.85" stroke="#1D4ED8" stroke-width="2"/>
