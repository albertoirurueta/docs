<text x="104" y="286" font-family="Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#0F172A" font-weight="bold">spherical</text>
<text x="104" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">11 parameters</text>
<rect x="197" y="60" width="160" height="200" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<ellipse cx="257" cy="130" rx="32.0" ry="14.4" transform="rotate(0 257 130)" fill="#CCFBF1" fill-opacity="0.85" stroke="#0F766E" stroke-width="2"/>
<ellipse cx="309" cy="166" rx="16.0" ry="30.400000000000002" transform="rotate(0 309 166)" fill="#DBEAFE" fill-opacity="0.85" stroke="#1D4ED8" stroke-width="2"/>
<ellipse cx="263" cy="200" rx="24.0" ry="9.600000000000001" transform="rotate(0 263 200)" fill="#FEF3C7" fill-opacity="0.85" stroke="#B45309" stroke-width="2"/>
<text x="277" y="286" font-family="Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#0F172A" font-weight="bold">diag</text>
<text x="277" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">14 parameters</text>
<rect x="370" y="60" width="160" height="200" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<ellipse cx="424" cy="130" rx="33.6" ry="16.0" transform="rotate(-30 424 130)" fill="#CCFBF1" fill-opacity="0.85" stroke="#0F766E" stroke-width="2"/>
<ellipse cx="478" cy="160" rx="33.6" ry="16.0" transform="rotate(-30 478 160)" fill="#DBEAFE" fill-opacity="0.85" stroke="#1D4ED8" stroke-width="2"/>
<ellipse cx="430" cy="200" rx="33.6" ry="16.0" transform="rotate(-30 430 200)" fill="#FEF3C7" fill-opacity="0.85" stroke="#B45309" stroke-width="2"/>
<text x="450" y="286" font-family="Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#0F172A" font-weight="bold">tied</text>
<text x="450" y="306" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569">11 parameters</text>
<rect x="543" y="60" width="160" height="200" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<ellipse cx="597" cy="146" rx="35.2" ry="12.8" transform="rotate(-35 597 146)" fill="#CCFBF1" fill-opacity="0.85" stroke="#0F766E" stroke-width="2"/>
<ellipse cx="653" cy="160" rx="24.0" ry="24.0" transform="rotate(0 653 160)" fill="#DBEAFE" fill-opacity="0.85" stroke="#1D4ED8" stroke-width="2"/>
