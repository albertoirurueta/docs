<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ssl-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: from a Bookshelf shader to a bound pipeline stage</text>
<rect x="20" y="70" width="136" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="86" r="11" fill="#4F46E5"/><text x="36" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="88.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Write</text>
<text x="88.0" y="145" text-anchor="middle" font-size="10" fill="#374151">book.slang</text>
<text x="88.0" y="175" text-anchor="middle" font-size="10" fill="#374151">vertexMain and</text>
<text x="88.0" y="191" text-anchor="middle" font-size="10" fill="#374151">fragmentMain</text>
<text x="88.0" y="207" text-anchor="middle" font-size="10" fill="#374151">in one file</text>
<line x1="156" y1="155" x2="166" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sb)"/>
<rect x="166" y="70" width="136" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182" cy="86" r="11" fill="#4F46E5"/><text x="182" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="234.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Compile</text>
<text x="234.0" y="145" text-anchor="middle" font-size="10" fill="#374151">slangc -target spirv</text>
<text x="234.0" y="175" text-anchor="middle" font-size="10" fill="#374151">book.slang</text>
<text x="234.0" y="191" text-anchor="middle" font-size="10" fill="#374151">-o book.spv</text>
<text x="234.0" y="207" text-anchor="middle" font-size="10" fill="#374151">both entries</text>
<line x1="302" y1="155" x2="312" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sb)"/>
<rect x="312" y="70" width="136" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="328" cy="86" r="11" fill="#4F46E5"/><text x="328" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="380.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Validate</text>
<text x="380.0" y="145" text-anchor="middle" font-size="10" fill="#374151">spirv-val</text>
<text x="380.0" y="175" text-anchor="middle" font-size="10" fill="#374151">--target-env</text>
<text x="380.0" y="191" text-anchor="middle" font-size="10" fill="#374151">vulkan1.3</text>
<text x="380.0" y="207" text-anchor="middle" font-size="10" fill="#374151">silent = valid</text>
<line x1="448" y1="155" x2="458" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sb)"/>
<rect x="458" y="70" width="136" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="86" r="11" fill="#4F46E5"/><text x="474" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="526.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Create module</text>
<text x="526.0" y="145" text-anchor="middle" font-size="10" fill="#374151">vkCreateShaderModule</text>
<text x="526.0" y="175" text-anchor="middle" font-size="10" fill="#374151">words from book.spv</text>
<text x="526.0" y="191" text-anchor="middle" font-size="10" fill="#374151">one module,</text>
<text x="526.0" y="207" text-anchor="middle" font-size="10" fill="#374151">two entry points</text>
<line x1="594" y1="155" x2="604" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sb)"/>
<rect x="604" y="70" width="136" height="170" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="620" cy="86" r="11" fill="#4F46E5"/><text x="620" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="672.0" y="120" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Use in pipeline</text>
<text x="672.0" y="145" text-anchor="middle" font-size="10" fill="#374151">stage create info</text>
<text x="672.0" y="175" text-anchor="middle" font-size="10" fill="#374151">stage, module</text>
<text x="672.0" y="191" text-anchor="middle" font-size="10" fill="#374151">pName names</text>
<text x="672.0" y="207" text-anchor="middle" font-size="10" fill="#374151">the entry point</text>
<text x="380" y="275" text-anchor="middle" font-size="11" fill="#374151">Same steps for GLSL (glslc) and HLSL (dxc -spirv); only step 1 and 2 change.</text>
<text x="380" y="295" text-anchor="middle" font-size="11" fill="#374151">Entry-point names are strings in the module, so pName must match exactly.</text>
</svg>
