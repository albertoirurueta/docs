<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Group and lock: keep a layout intact</text>
  <rect x="20" y="50" width="220" height="290" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5" />
  <text x="130" y="76" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Group</text>
  <rect x="270" y="50" width="220" height="290" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5" />
  <text x="380" y="76" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Lock</text>
  <rect x="520" y="50" width="220" height="290" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5" />
  <text x="630" y="76" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Lock position only</text>
  <rect x="40" y="96" width="180" height="120" rx="2" fill="#FFFFFF" stroke="#6B7280" stroke-width="1" />
  <rect x="52" y="110" width="60" height="70" rx="3" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1" />
  <rect x="124" y="118" width="86" height="14" rx="2" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
  <rect x="124" y="140" width="60" height="10" rx="2" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
  <rect x="124" y="160" width="50" height="18" rx="9" fill="#4F46E5" stroke="#4F46E5" stroke-width="1" />
  <rect x="46" y="102" width="170" height="86" rx="3" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="130" y="238" font-size="12" fill="#1F2937" text-anchor="middle">Command + G groups</text>
  <text x="130" y="254" font-size="12" fill="#1F2937" text-anchor="middle">Command + Shift + G ungroups</text>
  <text x="130" y="278" font-size="11" fill="#374151" text-anchor="middle">Moves and scales as one;</text>
  <text x="130" y="294" font-size="11" fill="#374151" text-anchor="middle">click again to edit one part.</text>
  <rect x="290" y="96" width="180" height="120" rx="2" fill="#FFFFFF" stroke="#6B7280" stroke-width="1" />
  <rect x="302" y="108" width="156" height="96" rx="3" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1" />
  <text x="380" y="162" font-size="11" fill="#374151" text-anchor="middle">Background photo</text>
  <rect x="404" y="108" width="54" height="24" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" />
  <text x="431" y="124" font-size="11" fill="#92400E" text-anchor="middle">Locked</text>
  <text x="380" y="238" font-size="12" fill="#1F2937" text-anchor="middle">Lock: position, style and</text>
  <text x="380" y="254" font-size="12" fill="#1F2937" text-anchor="middle">content cannot change</text>
  <text x="380" y="278" font-size="11" fill="#374151" text-anchor="middle">Option + Shift + L cycles</text>
  <text x="380" y="294" font-size="11" fill="#374151" text-anchor="middle">the lock states.</text>
  <rect x="540" y="96" width="180" height="120" rx="2" fill="#FFFFFF" stroke="#6B7280" stroke-width="1" />
  <rect x="552" y="108" width="156" height="40" rx="3" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1" />
  <text x="630" y="132" font-size="11" fill="#374151" text-anchor="middle">Title (editable text)</text>
  <rect x="552" y="158" width="156" height="46" rx="3" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1" />
  <text x="592" y="185" font-size="11" fill="#374151" text-anchor="middle">Photo frame</text>
  <rect x="640" y="160" width="60" height="22" rx="11" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" />
  <text x="670" y="175" font-size="10" fill="#92400E" text-anchor="middle">Pos. lock</text>
  <text x="630" y="238" font-size="12" fill="#1F2937" text-anchor="middle">Position and style fixed,</text>
  <text x="630" y="254" font-size="12" fill="#1F2937" text-anchor="middle">content stays editable</text>
  <text x="630" y="278" font-size="11" fill="#374151" text-anchor="middle">Useful for template slots</text>
  <text x="630" y="294" font-size="11" fill="#374151" text-anchor="middle">filled by someone else.</text>
  <circle cx="34" cy="64" r="11" fill="#4F46E5"/><text x="34" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="284" cy="64" r="11" fill="#4F46E5"/><text x="284" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="534" cy="64" r="11" fill="#B45309"/><text x="534" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="380" y="362" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
