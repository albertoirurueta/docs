<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Anatomy of an email signature made from images</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="350" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of an email signature made from images</text>
<rect x="40" y="50" width="500" height="250" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
<rect x="40" y="50" width="500" height="26" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="290" y="68" font-size="12" fill="#374151" text-anchor="middle">New message</text>
<rect x="56" y="88" width="468" height="20" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
<text x="70" y="102" font-size="11" fill="#6B7280" text-anchor="start">To: reader@example.com</text>
<rect x="56" y="114" width="468" height="92" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
<rect x="70" y="124" width="300" height="6" rx="1" fill="#D1D5DB" stroke="#D1D5DB" stroke-width="1"/>
<rect x="70" y="138" width="260" height="6" rx="1" fill="#D1D5DB" stroke="#D1D5DB" stroke-width="1"/>
<rect x="70" y="152" width="280" height="6" rx="1" fill="#D1D5DB" stroke="#D1D5DB" stroke-width="1"/>
<rect x="56" y="216" width="468" height="70" rx="4" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<rect x="78.0" y="234.8" width="7.199999999999999" height="31.2" fill="#4F46E5"/>
<rect x="86.4" y="227.6" width="7.199999999999999" height="38.4" fill="#B45309"/>
<rect x="94.8" y="239.6" width="7.199999999999999" height="26.4" fill="#4F46E5"/>
<rect x="103.2" y="231.2" width="7.199999999999999" height="34.8" fill="#1F2937"/>
<line x1="74.4" y1="266" x2="114.0" y2="266" stroke="#1F2937" stroke-width="1.7999999999999998"/>
<rect x="130" y="228" width="6" height="52" rx="1" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="146" y="240" font-size="12" fill="#1F2937" text-anchor="start" font-weight="bold">Alex Reader, Community lead</text>
<text x="146" y="256" font-size="11" fill="#374151" text-anchor="start">Bookshelf | bookshelf.example</text>
<text x="146" y="272" font-size="11" fill="#374151" text-anchor="start">alex@bookshelf.example</text>
<circle cx="420" cy="262" r="10" fill="#EEF2FF" stroke="#4F46E5"/><circle cx="450" cy="262" r="10" fill="#EEF2FF" stroke="#4F46E5"/><circle cx="480" cy="262" r="10" fill="#EEF2FF" stroke="#4F46E5"/><circle cx="610" cy="90" r="11" fill="#4F46E5"/><text x="610" y="94" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="628" y="94" font-size="11" fill="#374151" text-anchor="start">One image exported</text>
<text x="628" y="108" font-size="11" fill="#374151" text-anchor="start">as PNG or JPG</text>
<circle cx="610" cy="142" r="11" fill="#4F46E5"/><text x="610" y="146" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="628" y="146" font-size="11" fill="#374151" text-anchor="start">Logo and contact lines</text>
<text x="628" y="160" font-size="11" fill="#374151" text-anchor="start">inside that image</text>
<circle cx="610" cy="194" r="11" fill="#4F46E5"/><text x="610" y="198" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="628" y="198" font-size="11" fill="#374151" text-anchor="start">Each social icon</text>
<text x="628" y="212" font-size="11" fill="#374151" text-anchor="start">exported separately</text>
<circle cx="610" cy="246" r="11" fill="#B45309"/><text x="610" y="250" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="628" y="250" font-size="11" fill="#374151" text-anchor="start">Links added to each</text>
<text x="628" y="264" font-size="11" fill="#374151" text-anchor="start">image in the email</text>
<text x="628" y="278" font-size="11" fill="#374151" text-anchor="start">client settings</text>
<circle cx="62" cy="222" r="9" fill="#4F46E5"/><text x="62" y="226" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<circle cx="140" cy="222" r="9" fill="#4F46E5"/><text x="140" y="226" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<circle cx="450" cy="240" r="9" fill="#4F46E5"/><text x="450" y="244" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<circle cx="290" cy="296" r="9" fill="#B45309"/><text x="290" y="300" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
  <text x="380" y="332" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
