<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-first-triangle-webgl2-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: from a clear colour to the book-cover quad</text>
<rect x="20" y="50" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="34" cy="64" r="11" fill="#4F46E5"/>
<text x="34" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="32" y="82" width="116" height="116" rx="4" fill="#E5E7EB" stroke="#4B5563"/>
<text x="90" y="238" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Clear only</text>
<text x="90" y="254" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">getContext + clear(),</text>
<text x="90" y="267" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">no shaders yet</text>
<rect x="168" y="50" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="182" cy="64" r="11" fill="#4F46E5"/>
<text x="182" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="180" y="82" width="116" height="116" rx="4" fill="#1E293B" stroke="#4B5563"/>
<polygon points="238,96 282,184 194,184" fill="#F9FAFB"/>
<text x="238" y="238" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">One flat triangle</text>
<text x="238" y="254" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">hard-coded colour</text>
<text x="238" y="267" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">drawArrays(TRIANGLES, 0, 3)</text>
<rect x="316" y="50" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="330" cy="64" r="11" fill="#4F46E5"/>
<text x="330" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="328" y="82" width="116" height="116" rx="4" fill="#1E293B" stroke="#4B5563"/>
<defs><linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#EF4444"/><stop offset="0.5" stop-color="#10B981"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
<polygon points="386,96 430,184 342,184" fill="url(#g2)"/>
<text x="386" y="238" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Per-vertex colour</text>
<text x="386" y="254" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">interleaved buffer,</text>
<text x="386" y="267" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">varying interpolation</text>
<rect x="464" y="50" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="478" cy="64" r="11" fill="#4F46E5"/>
<text x="478" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="476" y="82" width="116" height="116" rx="4" fill="#1E293B" stroke="#4B5563"/>
<polygon points="500,96 568,96 568,184 500,184" fill="#B45309"/><line x1="500" y1="184" x2="568" y2="96" stroke="#FEF3C7" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="534" y="238" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Indexed quad</text>
<text x="534" y="254" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">4 vertices + 6 indices</text>
<text x="534" y="267" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">drawElements</text>
<rect x="612" y="50" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="626" cy="64" r="11" fill="#4F46E5"/>
<text x="626" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="624" y="82" width="116" height="116" rx="4" fill="#1E293B" stroke="#4B5563"/>
<rect x="648" y="96" width="68" height="88" fill="#B45309"/><rect x="656" y="106" width="52" height="30" fill="#FEF3C7"/><text x="682" y="126" font-size="10" fill="#92400E" text-anchor="middle">BOOK</text><rect x="656" y="150" width="52" height="4" fill="#FEF3C7"/><rect x="656" y="160" width="36" height="4" fill="#FEF3C7"/>
<text x="682" y="238" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Book cover quad</text>
<text x="682" y="254" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">same quad with a texture</text>
<text x="682" y="267" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">(next page of the track)</text>
<text x="380" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Panels 1 to 4 are this page; panel 5 is the next step of the raw WebGL track.</text>
</svg>
