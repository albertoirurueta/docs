<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The 16 blend modes plus Pass through and Normal, by behaviour</text>
<text x="30" y="64" font-size="13" font-weight="bold" fill="#3730A3">Darkening</text>
<rect x="150" y="48" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="222" y="70" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Darken</text><text x="222" y="90" font-size="11" fill="#374151" text-anchor="middle">darker of the two</text>
<rect x="302" y="48" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="374" y="70" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Multiply</text><text x="374" y="90" font-size="11" fill="#374151" text-anchor="middle">always darker</text>
<rect x="454" y="48" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="526" y="70" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Plus darker</text><text x="526" y="90" font-size="11" fill="#374151" text-anchor="middle">stronger mid-tones</text>
<rect x="606" y="48" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="678" y="70" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Color burn</text><text x="678" y="90" font-size="11" fill="#374151" text-anchor="middle">darker, more contrast</text>
<text x="30" y="128" font-size="13" font-weight="bold" fill="#3730A3">Lightening</text>
<rect x="150" y="112" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="222" y="134" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Lighten</text><text x="222" y="154" font-size="11" fill="#374151" text-anchor="middle">lighter of the two</text>
<rect x="302" y="112" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="374" y="134" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Screen</text><text x="374" y="154" font-size="11" fill="#374151" text-anchor="middle">always lighter</text>
<rect x="454" y="112" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="526" y="134" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Plus lighter</text><text x="526" y="154" font-size="11" fill="#374151" text-anchor="middle">stronger mid-tones</text>
<rect x="606" y="112" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="678" y="134" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Color dodge</text><text x="678" y="154" font-size="11" fill="#374151" text-anchor="middle">lighter, less contrast</text>
<text x="30" y="192" font-size="13" font-weight="bold" fill="#3730A3">Contrast</text>
<rect x="150" y="176" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="222" y="198" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Overlay</text><text x="222" y="218" font-size="11" fill="#374151" text-anchor="middle">multiply or screen</text>
<rect x="302" y="176" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="374" y="198" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Soft light</text><text x="374" y="218" font-size="11" fill="#374151" text-anchor="middle">subtle overlay</text>
<rect x="454" y="176" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="526" y="198" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Hard light</text><text x="526" y="218" font-size="11" fill="#374151" text-anchor="middle">harsh spotlight</text>
<text x="30" y="256" font-size="13" font-weight="bold" fill="#3730A3">Difference</text>
<rect x="150" y="240" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="222" y="262" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Difference</text><text x="222" y="282" font-size="11" fill="#374151" text-anchor="middle">subtract darker</text>
<rect x="302" y="240" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="374" y="262" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Exclusion</text><text x="374" y="282" font-size="11" fill="#374151" text-anchor="middle">softer difference</text>
<text x="30" y="320" font-size="13" font-weight="bold" fill="#3730A3">Component</text>
<rect x="150" y="304" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="222" y="326" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Hue</text><text x="222" y="346" font-size="11" fill="#374151" text-anchor="middle">hue of blend color</text>
<rect x="302" y="304" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="374" y="326" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Saturation</text><text x="374" y="346" font-size="11" fill="#374151" text-anchor="middle">saturation of blend</text>
<rect x="454" y="304" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="526" y="326" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Color</text><text x="526" y="346" font-size="11" fill="#374151" text-anchor="middle">hue and saturation</text>
<rect x="606" y="304" width="144" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><text x="678" y="326" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Luminosity</text><text x="678" y="346" font-size="11" fill="#374151" text-anchor="middle">brightness of blend</text>
<rect x="30" y="372" width="700" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="380" y="396" font-size="12" fill="#92400E" text-anchor="middle">Layers default to Pass through, fills and effects default to Normal. Pass through cannot be set on a fill or effect.</text>
</svg>