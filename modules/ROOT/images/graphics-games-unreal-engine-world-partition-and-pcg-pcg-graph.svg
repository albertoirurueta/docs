<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A PCG graph and its hierarchical generation grids</text>
<rect x="15" y="44" width="730" height="150" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="380" y="64" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">PCG graph (hosted by a PCG Volume)</text>
<rect x="30" y="90" width="140" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100.0" y="114.3" text-anchor="middle" font-size="11" fill="#3730A3">Get Landscape</text>
<text x="100.0" y="129.3" text-anchor="middle" font-size="11" fill="#3730A3">Data</text>
<line x1="170" y1="118" x2="210" y2="118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="210" y="90" width="140" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="280.0" y="114.3" text-anchor="middle" font-size="11" fill="#3730A3">Surface Sampler</text>
<text x="280.0" y="129.3" text-anchor="middle" font-size="11" fill="#3730A3">points on a grid</text>
<line x1="350" y1="118" x2="390" y2="118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="390" y="90" width="140" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="460.0" y="114.3" text-anchor="middle" font-size="11" fill="#3730A3">Transform Points</text>
<text x="460.0" y="129.3" text-anchor="middle" font-size="11" fill="#3730A3">jitter, scale</text>
<line x1="530" y1="118" x2="570" y2="118" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="570" y="90" width="140" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="114.3" text-anchor="middle" font-size="11" fill="#047857">Static Mesh</text>
<text x="640.0" y="129.3" text-anchor="middle" font-size="11" fill="#047857">Spawner</text>
<text x="380" y="176" text-anchor="middle" font-size="11" fill="#374151">data type flowing between nodes: Points (transform, bounds, color, density, steepness, seed)</text>
<rect x="15" y="210" width="730" height="195" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="230" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Hierarchical generation: data flows from larger grids to smaller ones</text>
<rect x="25" y="248" width="690" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="35" y="265" text-anchor="start" font-size="12" fill="#92400E" font-weight="bold">Unbounded</text>
<text x="35" y="281" text-anchor="start" font-size="10" fill="#92400E">runs once, expensive samplers</text>
<rect x="25" y="298" width="520" height="40" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="35" y="315" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">Large grid (example 12800 cm)</text>
<text x="35" y="331" text-anchor="start" font-size="10" fill="#3730A3">big trees, runtime radius large</text>
<rect x="25" y="348" width="330" height="40" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="35" y="365" text-anchor="start" font-size="12" fill="#047857" font-weight="bold">Small grid</text>
<text x="35" y="381" text-anchor="start" font-size="10" fill="#047857">grass and books on shelves, radius small</text>
<path d="M728,254 L728,380" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="380" y="396" text-anchor="middle" font-size="10" fill="#374151">Generation Trigger: Generate at Runtime. Sources: player controllers, streaming sources, PCG Generation Source components.</text>
</svg>
