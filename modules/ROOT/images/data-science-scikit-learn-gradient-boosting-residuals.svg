<title id="t">Gradient boosting fits residuals in turn</title>
<desc id="d">Three panels. Left: noisy sine data with a constant first prediction equal to the mean and vertical residual segments. Middle: the residuals with a depth-two tree fitted to them as a step function. Right: the new prediction, the constant plus the learning rate times the tree, follows the data more closely.</desc>
