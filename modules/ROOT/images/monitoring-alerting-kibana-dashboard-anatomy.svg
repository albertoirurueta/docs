<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a Kibana dashboard</title>
  <desc id="d">Top to bottom: the query bar, filter pills and time picker that apply to every panel; pinned controls; the panel grid with Lens, ES|QL, Discover session and Markdown panels, one inside a collapsible section; and below them the data views and ES|QL queries that read the Elasticsearch data streams. The dashboard is a saved object in a space.</desc>
  <rect width="720" height="440" fill="#ffffff"/>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2933; }
    .h { font-size: 15px; font-weight: bold; }
    .s { font-size: 11px; fill: #52606d; }
    .b { font-size: 13px; }
    .box { stroke-width: 1.5; }
    .env { fill: #f7f9fb; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .bar { fill: #e3f0fb; stroke: #2b6cb0; }
    .ctl { fill: #fff4d6; stroke: #b7791f; }
    .pan { fill: #e6f6ec; stroke: #2f855a; }
    .sec { fill: #f0e9fa; stroke: #6b46c1; }
    .dat { fill: #fde8e8; stroke: #c0392b; }
    .ln { stroke: #52606d; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" class="h">Anatomy of a Kibana dashboard</text>

  <rect x="12" y="38" width="696" height="304" rx="10" class="env"/>
  <text x="26" y="56" class="s">Dashboard: a saved object in a space (title, tags, time range, panels, controls, permissions)</text>

  <rect x="28" y="66" width="664" height="44" rx="6" class="box bar"/>
  <text x="44" y="86" class="b">Query bar (KQL)  +  filter pills  +  time picker and refresh</text>
  <text x="44" y="102" class="s">Apply to every panel; the time range can be overridden per panel; pinned filters are not saved</text>

  <rect x="28" y="120" width="664" height="44" rx="6" class="box ctl"/>
  <text x="44" y="140" class="b">Controls: options list, range slider, time slider, ES|QL variable</text>
  <text x="44" y="156" class="s">Pinned at the top (whole dashboard) or unpinned in the grid or in a section (that section only)</text>

  <rect x="28" y="174" width="400" height="156" rx="6" class="box pan" fill-opacity="0.35"/>
  <text x="40" y="192" class="b">Panel grid (48 columns)</text>
  <rect x="40" y="202" width="110" height="46" rx="5" class="box pan"/>
  <text x="95" y="222" text-anchor="middle" class="b">Lens</text>
  <text x="95" y="238" text-anchor="middle" class="s">metric, XY, table</text>
  <rect x="160" y="202" width="110" height="46" rx="5" class="box pan"/>
  <text x="215" y="222" text-anchor="middle" class="b">ES|QL chart</text>
  <text x="215" y="238" text-anchor="middle" class="s">query as source</text>
  <rect x="280" y="202" width="136" height="46" rx="5" class="box pan"/>
  <text x="348" y="222" text-anchor="middle" class="b">Markdown, Links</text>
  <text x="348" y="238" text-anchor="middle" class="s">runbook, navigation</text>
  <rect x="40" y="260" width="376" height="60" rx="5" class="box sec"/>
  <text x="52" y="278" class="b">Collapsible section "Logs and traces"</text>
  <rect x="52" y="286" width="170" height="26" rx="4" class="box pan"/>
  <text x="137" y="303" text-anchor="middle" class="s">Discover session (library)</text>
  <rect x="232" y="286" width="172" height="26" rx="4" class="box pan"/>
  <text x="318" y="303" text-anchor="middle" class="s">Lens table, unpinned control</text>

  <rect x="446" y="174" width="246" height="156" rx="6" class="box" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="458" y="192" class="b">Panel actions</text>
  <text x="458" y="212" class="s">Drilldowns: dashboard, URL, Discover</text>
  <text x="458" y="228" class="s">Explore in Discover, Inspect, Maximize</text>
  <text x="458" y="244" class="s">Duplicate, copy to dashboard, library</text>
  <text x="458" y="268" class="b">Dashboard actions</text>
  <text x="458" y="288" class="s">Share link, embed, export PDF/PNG/JSON</text>
  <text x="458" y="304" class="s">Duplicate (managed dashboards), import</text>
  <text x="458" y="320" class="s">Dashboards API and Terraform (as code)</text>

  <path d="M228 330 L228 362" class="ln" marker-end="url(#a)"/>

  <rect x="28" y="364" width="320" height="56" rx="6" class="box dat"/>
  <text x="188" y="386" text-anchor="middle" class="b">Data views and ES|QL queries</text>
  <text x="188" y="404" text-anchor="middle" class="s">traces-*, logs-*, metrics-* (@timestamp)</text>
  <rect x="372" y="364" width="320" height="56" rx="6" class="box dat"/>
  <text x="532" y="386" text-anchor="middle" class="b">Elasticsearch data streams</text>
  <text x="532" y="404" text-anchor="middle" class="s">Bookshelf telemetry from the EDOT Collector</text>
  <path d="M348 392 L370 392" class="ln" marker-end="url(#a)"/>
</svg>
