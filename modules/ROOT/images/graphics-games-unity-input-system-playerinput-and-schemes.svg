<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-in-pi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">PlayerInput: one player, one device set, one scheme</text>
<rect x="20" y="60" width="200" height="130" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="98.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#3730A3">PlayerInput component</text>
<text x="120.0" y="113.5" text-anchor="middle" font-size="11" fill="#3730A3">Actions: InputSystem_Actions</text>
<text x="120.0" y="128.5" text-anchor="middle" font-size="11" fill="#3730A3">Default Map: Player</text>
<text x="120.0" y="143.5" text-anchor="middle" font-size="11" fill="#3730A3">Default Scheme: Keyboard&amp;Mouse</text>
<text x="120.0" y="158.5" text-anchor="middle" font-size="11" fill="#3730A3">Behavior: see right</text>
<rect x="260" y="50" width="230" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="375.0" y="70.5" text-anchor="middle" font-size="11" fill="#374151">Send Messages  -&gt;  OnGrab(InputValue)</text>
<rect x="260" y="92" width="230" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="375.0" y="112.5" text-anchor="middle" font-size="11" fill="#374151">Broadcast Messages  (children too)</text>
<rect x="260" y="134" width="230" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="375.0" y="154.5" text-anchor="middle" font-size="11" fill="#374151">Invoke Unity Events  (Inspector wiring)</text>
<rect x="260" y="176" width="230" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="375.0" y="196.5" text-anchor="middle" font-size="11" fill="#374151">Invoke C# Events  (onActionTriggered)</text>
<line x1="220" y1="125" x2="260" y2="67" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-pi)"/>
<line x1="220" y1="125" x2="260" y2="109" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-pi)"/>
<line x1="220" y1="125" x2="260" y2="151" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-pi)"/>
<line x1="220" y1="125" x2="260" y2="193" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-pi)"/>
<rect x="530" y="60" width="210" height="150" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="635.0" y="101.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F2937">Control schemes</text>
<text x="635.0" y="116.0" text-anchor="middle" font-size="11" fill="#1F2937">Keyboard&amp;Mouse</text>
<text x="635.0" y="131.0" text-anchor="middle" font-size="11" fill="#1F2937">Gamepad</text>
<text x="635.0" y="146.0" text-anchor="middle" font-size="11" fill="#1F2937">Touch</text>
<text x="635.0" y="161.0" text-anchor="middle" font-size="11" fill="#1F2937">Devices decide the active</text>
<text x="635.0" y="176.0" text-anchor="middle" font-size="11" fill="#1F2937">scheme and its bindings.</text>
<line x1="490" y1="125" x2="530" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-pi)"/>
<rect x="20" y="240" width="350" height="120" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="273.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">One player or many</text>
<text x="195.0" y="288.5" text-anchor="middle" font-size="11" fill="#92400E">PlayerInputManager joins each new device as a</text>
<text x="195.0" y="303.5" text-anchor="middle" font-size="11" fill="#92400E">separate player, instantiates the player prefab</text>
<text x="195.0" y="318.5" text-anchor="middle" font-size="11" fill="#92400E">and assigns devices (local multiplayer, split screen).</text>
<text x="195.0" y="333.5" text-anchor="middle" font-size="11" fill="#92400E">Bookshelf uses one PlayerInput for the librarian.</text>
<rect x="390" y="240" width="350" height="120" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="273.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">Reacting to device changes</text>
<text x="565.0" y="288.5" text-anchor="middle" font-size="11" fill="#374151">onControlsChanged tells you the scheme changed</text>
<text x="565.0" y="303.5" text-anchor="middle" font-size="11" fill="#374151">(show keyboard prompts or gamepad prompts).</text>
<text x="565.0" y="318.5" text-anchor="middle" font-size="11" fill="#374151">DeviceLost and DeviceRegained handle a pad</text>
<text x="565.0" y="333.5" text-anchor="middle" font-size="11" fill="#374151">that runs out of battery.</text>
<text x="380" y="392" text-anchor="middle" font-size="10" fill="#374151">The component needs a reference to the actions asset; project-wide actions are a separate, simpler route.</text>
</svg>
