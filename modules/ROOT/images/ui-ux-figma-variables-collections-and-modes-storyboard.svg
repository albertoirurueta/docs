<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: add dark mode to Bookshelf</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/></g>
  <g stroke="#4B5563" stroke-width="1.5"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- 1 create variables -->
  <rect x="24" y="90" width="116" height="100" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/><g fill="#9CA3AF"><rect x="32" y="100" width="60" height="8" rx="3"/><rect x="32" y="120" width="70" height="8" rx="3"/><rect x="32" y="140" width="50" height="8" rx="3"/></g><rect x="32" y="162" width="80" height="20" rx="4" fill="#4F46E5"/><text x="72" y="176" font-size="10" fill="#FFFFFF" text-anchor="middle">+ Create variable</text>
  <!-- 2 add Dark mode -->
  <rect x="176" y="90" width="116" height="100" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/><rect x="226" y="98" width="30" height="14" rx="3" fill="#EEF2FF" stroke="#4F46E5"/><text x="241" y="108" font-size="8" fill="#3730A3" text-anchor="middle">Light</text><rect x="260" y="98" width="30" height="14" rx="3" fill="#FEF3C7" stroke="#B45309"/><text x="275" y="108" font-size="8" fill="#92400E" text-anchor="middle">Dark</text><g fill="#E5E7EB"><rect x="226" y="124" width="30" height="14"/><rect x="260" y="124" width="30" height="14"/><rect x="226" y="148" width="30" height="14"/><rect x="260" y="148" width="30" height="14"/></g>
  <!-- 3 set dark values -->
  <rect x="328" y="90" width="116" height="100" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/><rect x="378" y="124" width="30" height="14" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="412" y="124" width="30" height="14" fill="#111827"/><rect x="378" y="148" width="30" height="14" fill="#111827"/><rect x="412" y="148" width="30" height="14" fill="#F9FAFB" stroke="#9CA3AF"/>
  <!-- 4 bind -->
  <rect x="480" y="90" width="116" height="100" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="494" y="104" width="88" height="40" rx="6" fill="#4F46E5"/><text x="538" y="128" font-size="10" fill="#FFFFFF" text-anchor="middle">Add to shelf</text><rect x="494" y="156" width="88" height="22" rx="4" fill="#FEF3C7" stroke="#B45309"/><text x="538" y="171" font-size="9" fill="#92400E" text-anchor="middle">Fill: color/accent</text>
  <!-- 5 side by side -->
  <rect x="630" y="90" width="50" height="100" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="636" y="130" width="38" height="20" rx="4" fill="#4F46E5"/><rect x="688" y="90" width="50" height="100" rx="6" fill="#111827"/><rect x="694" y="130" width="38" height="20" rx="4" fill="#A5B4FC"/>
  <g fill="#4F46E5"><circle cx="30" cy="68" r="11"/><circle cx="182" cy="68" r="11"/><circle cx="334" cy="68" r="11"/><circle cx="486" cy="68" r="11"/></g><circle cx="638" cy="68" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="72">1</text><text x="182" y="72">2</text><text x="334" y="72">3</text><text x="486" y="72">4</text><text x="638" y="72">5</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Create colour</text><text x="82" y="338">variables</text><text x="234" y="322">Add a second</text><text x="234" y="338">mode: Dark</text><text x="386" y="322">Enter the Dark</text><text x="386" y="338">values</text><text x="538" y="322">Bind fills to</text><text x="538" y="338">the variables</text><text x="684" y="322">Set mode on a</text><text x="684" y="338">frame, compare</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, checked against the Figma Learn variables articles on 2026-10-30.</text>
</svg>
