<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Architecture map of the three scenarios: browsers running Chatterbox, Huddle and Pixel Arena connect over WebSocket to application servers that share a Redis backplane, over WebSocket to an XMPP server, over WebRTC media to an SFU and through a TURN relay, and Huddle uses a WebSocket signalling server to set up the calls</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Three scenarios on one map</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">browsers reach servers over WebSocket, media servers over WebRTC, and relays when NAT gets in the way</text>

  <line x1="200" y1="105" x2="300" y2="105" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="240" x2="300" y2="190" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="240" x2="300" y2="255" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="240" x2="300" y2="400" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="200" y1="370" x2="300" y2="330" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="370" x2="300" y2="400" stroke="#37474f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="200" y1="125" x2="300" y2="175" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="105" x2="580" y2="105" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="190" x2="580" y2="120" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="330" x2="580" y2="330" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="20" y="70" width="180" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="94" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Chatterbox</text>
  <text x="110" y="111" font-size="10" fill="#0d3c75" text-anchor="middle">chat: rooms, presence,</text>
  <text x="110" y="125" font-size="10" fill="#0d3c75" text-anchor="middle">receipts, history</text>

  <rect x="20" y="205" width="180" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="229" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Pixel Arena</text>
  <text x="110" y="246" font-size="10" fill="#0d3c75" text-anchor="middle">multiplayer game: ticks,</text>
  <text x="110" y="260" font-size="10" fill="#0d3c75" text-anchor="middle">snapshots, prediction</text>

  <rect x="20" y="335" width="180" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="110" y="359" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Huddle</text>
  <text x="110" y="376" font-size="10" fill="#0d3c75" text-anchor="middle">videoconference: mesh,</text>
  <text x="110" y="390" font-size="10" fill="#0d3c75" text-anchor="middle">SFU, screen sharing</text>

  <rect x="300" y="70" width="210" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="405" y="94" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">XMPP server</text>
  <text x="405" y="111" font-size="10" fill="#1b4d1f" text-anchor="middle">Prosody, ejabberd: MUC, MAM,</text>
  <text x="405" y="125" font-size="10" fill="#1b4d1f" text-anchor="middle">RFC 7395 over WebSocket</text>

  <rect x="300" y="155" width="210" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="405" y="179" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">WebSocket servers</text>
  <text x="405" y="196" font-size="10" fill="#1b4d1f" text-anchor="middle">Socket.IO, uWebSockets.js, SignalR,</text>
  <text x="405" y="210" font-size="10" fill="#1b4d1f" text-anchor="middle">Channels, WebFlux, Swoole, Reverb</text>

  <rect x="300" y="240" width="210" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="405" y="262" font-size="13" font-weight="bold" fill="#1b4d1f" text-anchor="middle">Game server</text>
  <text x="405" y="278" font-size="10" fill="#1b4d1f" text-anchor="middle">authoritative tick loop</text>

  <rect x="300" y="305" width="210" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="405" y="327" font-size="13" font-weight="bold" fill="#7a2e00" text-anchor="middle">SFU</text>
  <text x="405" y="343" font-size="10" fill="#7a2e00" text-anchor="middle">mediasoup, LiveKit: forwards media</text>

  <rect x="300" y="380" width="210" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="405" y="402" font-size="13" font-weight="bold" fill="#7a2e00" text-anchor="middle">TURN relay</text>
  <text x="405" y="418" font-size="10" fill="#7a2e00" text-anchor="middle">coturn: only when direct paths fail</text>

  <rect x="580" y="85" width="190" height="60" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="675" y="109" font-size="13" font-weight="bold" fill="#3d0f57" text-anchor="middle">Redis backplane</text>
  <text x="675" y="126" font-size="10" fill="#3d0f57" text-anchor="middle">pub/sub and Streams fan-out</text>

  <rect x="580" y="305" width="190" height="50" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="675" y="327" font-size="13" font-weight="bold" fill="#3d0f57" text-anchor="middle">Signalling</text>
  <text x="675" y="343" font-size="10" fill="#3d0f57" text-anchor="middle">offers, answers, ICE over WebSocket</text>

  <text x="20" y="455" font-size="10" fill="#555555">Solid arrows: WebSocket traffic or media. Dashed arrows: relayed path.</text>
</svg>
