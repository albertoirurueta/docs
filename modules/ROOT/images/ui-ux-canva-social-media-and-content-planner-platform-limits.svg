<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Upload limits per destination, as listed by the Help Center</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Upload limits per destination, as listed by the Help Center</text>
  <rect x="20" y="50" width="720" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="34" y="69" font-size="13" font-weight="bold" fill="#1F2937">Destination</text><text x="170" y="69" font-size="13" font-weight="bold" fill="#1F2937">File types</text><text x="330" y="69" font-size="13" font-weight="bold" fill="#1F2937">Size limits</text><text x="520" y="69" font-size="13" font-weight="bold" fill="#1F2937">Text and other limits</text>
  <rect x="20" y="86" width="720" height="30" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="34" y="106" font-size="12" font-weight="bold" fill="#1F2937">Facebook</text><text x="170" y="106" font-size="12" fill="#374151">PNG, JPG, MP4, GIF</text><text x="330" y="106" font-size="12" fill="#374151">Image 4 MB, video 250 MB</text><text x="520" y="106" font-size="12" fill="#374151">Pages only, not profiles</text>
  <rect x="20" y="116" width="720" height="30" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="34" y="136" font-size="12" font-weight="bold" fill="#1F2937">Instagram</text><text x="170" y="136" font-size="12" fill="#374151">JPG, MP4</text><text x="330" y="136" font-size="12" fill="#374151">Image 8 MB, video 100 MB</text><text x="520" y="136" font-size="12" fill="#374151">Video 3 to 60 s, 25 per 24 h</text>
  <rect x="20" y="146" width="720" height="30" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="34" y="166" font-size="12" font-weight="bold" fill="#1F2937">LinkedIn</text><text x="170" y="166" font-size="12" fill="#374151">JPG</text><text x="330" y="166" font-size="12" fill="#374151">Image 10 MB</text><text x="520" y="166" font-size="12" fill="#374151">Message 1300 characters</text>
  <rect x="20" y="176" width="720" height="30" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="34" y="196" font-size="12" font-weight="bold" fill="#1F2937">Pinterest</text><text x="170" y="196" font-size="12" fill="#374151">PNG, GIF</text><text x="330" y="196" font-size="12" fill="#374151">32 MB</text><text x="520" y="196" font-size="12" fill="#374151">One page, title 100, text 500</text>
  <rect x="20" y="206" width="720" height="30" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="34" y="226" font-size="12" font-weight="bold" fill="#1F2937">X (Twitter)</text><text x="170" y="226" font-size="12" fill="#374151">PNG, JPG, MP4, GIF</text><text x="330" y="226" font-size="12" fill="#374151">Image 3 MB, video 15 MB</text><text x="520" y="226" font-size="12" fill="#374151">280 characters, 4 photos</text>
  <rect x="20" y="236" width="720" height="30" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="34" y="256" font-size="12" font-weight="bold" fill="#1F2937">Slack</text><text x="170" y="256" font-size="12" fill="#374151">PNG, JPG, PDF</text><text x="330" y="256" font-size="12" fill="#374151">10 MB</text><text x="520" y="256" font-size="12" fill="#374151">One page per upload</text>
  <rect x="20" y="266" width="720" height="30" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="34" y="286" font-size="12" font-weight="bold" fill="#1F2937">Tumblr</text><text x="170" y="286" font-size="12" fill="#374151">PNG, JPG</text><text x="330" y="286" font-size="12" fill="#374151">10 MB</text><text x="520" y="286" font-size="12" fill="#374151">Up to 10 pages</text>
  <rect x="20" y="296" width="720" height="30" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="34" y="316" font-size="12" font-weight="bold" fill="#1F2937">YouTube</text><text x="170" y="316" font-size="12" fill="#374151">Video designs only</text><text x="330" y="316" font-size="12" fill="#374151">Per account status</text><text x="520" y="316" font-size="12" fill="#374151">Shorts: 9:16, up to 60 s</text>
  <rect x="20" y="340" width="720" height="28" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
  <text x="380" y="359" font-size="12" fill="#92400E" text-anchor="middle">YouTube cannot be scheduled from Canva; videos publish immediately.</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Values as read from the Help Center on 2026-11-07; platforms change them, so check Share in the editor.</text>
</svg>
