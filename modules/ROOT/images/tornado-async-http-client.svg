<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>How an AsyncHTTPClient fetch travels from a handler to the upstream service</title>
  <defs>
    <marker id="tahc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">One fetch, from handler to upstream</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">a single shared client per IOLoop decides when each request may run</text>

  <!-- handlers -->
  <rect x="30" y="70" width="170" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="115" y="93" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Request handlers</text>
  <text x="115" y="111" font-size="11" fill="currentColor" text-anchor="middle">await client.fetch(...)</text>

  <!-- client -->
  <rect x="260" y="64" width="200" height="68" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="360" y="87" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">AsyncHTTPClient()</text>
  <text x="360" y="105" font-size="11" fill="currentColor" text-anchor="middle">pseudo-singleton, one per IOLoop</text>
  <text x="360" y="121" font-size="11" fill="currentColor" text-anchor="middle">merges defaults into HTTPRequest</text>

  <!-- queue -->
  <rect x="520" y="70" width="170" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="605" y="93" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Waiting queue</text>
  <text x="605" y="111" font-size="11" fill="currentColor" text-anchor="middle">beyond max_clients</text>

  <line x1="200" y1="98" x2="258" y2="98" stroke="currentColor" stroke-width="1.5" marker-end="url(#tahc-arrow)"/>
  <line x1="460" y1="98" x2="518" y2="98" stroke="currentColor" stroke-width="1.5" marker-end="url(#tahc-arrow)"/>
  <text x="489" y="90" font-size="10" fill="currentColor" text-anchor="middle">full</text>

  <!-- active slots -->
  <rect x="150" y="178" width="420" height="62" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="198" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Active slots (at most max_clients, default 10)</text>
  <rect x="180" y="208" width="100" height="22" rx="4" fill="#808080" fill-opacity="0.35" stroke="currentColor"/>
  <rect x="310" y="208" width="100" height="22" rx="4" fill="#808080" fill-opacity="0.35" stroke="currentColor"/>
  <rect x="440" y="208" width="100" height="22" rx="4" fill="#808080" fill-opacity="0.35" stroke="currentColor"/>
  <text x="230" y="224" font-size="11" fill="currentColor" text-anchor="middle">request</text>
  <text x="360" y="224" font-size="11" fill="currentColor" text-anchor="middle">request</text>
  <text x="490" y="224" font-size="11" fill="currentColor" text-anchor="middle">request</text>

  <line x1="360" y1="132" x2="360" y2="176" stroke="currentColor" stroke-width="1.5" marker-end="url(#tahc-arrow)"/>
  <text x="372" y="158" font-size="10" fill="currentColor">free slot</text>
  <path d="M605,126 L605,160 L572,160 L572,200" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#tahc-arrow)"/>
  <text x="612" y="152" font-size="10" fill="currentColor">slot released</text>

  <!-- implementations -->
  <rect x="60" y="290" width="270" height="76" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="195" y="312" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">SimpleAsyncHTTPClient (default)</text>
  <text x="195" y="331" font-size="11" fill="currentColor" text-anchor="middle">pure Python on IOStream</text>
  <text x="195" y="347" font-size="11" fill="currentColor" text-anchor="middle">new connection per request, no proxies</text>

  <rect x="390" y="290" width="270" height="76" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="525" y="312" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">CurlAsyncHTTPClient (configure)</text>
  <text x="525" y="331" font-size="11" fill="currentColor" text-anchor="middle">libcurl through pycurl</text>
  <text x="525" y="347" font-size="11" fill="currentColor" text-anchor="middle">connection reuse, proxies, digest auth</text>

  <line x1="300" y1="240" x2="230" y2="288" stroke="currentColor" stroke-width="1.5" marker-end="url(#tahc-arrow)"/>
  <line x1="420" y1="240" x2="490" y2="288" stroke="currentColor" stroke-width="1.5" marker-end="url(#tahc-arrow)"/>
  <text x="360" y="266" font-size="10" fill="currentColor" text-anchor="middle">one or the other</text>

  <!-- results -->
  <rect x="60" y="396" width="270" height="30" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="195" y="416" font-size="12" fill="currentColor" text-anchor="middle">upstream service answers: HTTPResponse</text>
  <rect x="390" y="396" width="270" height="30" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="525" y="416" font-size="12" fill="currentColor" text-anchor="middle">non-2xx or timeout: HTTPClientError (599)</text>
  <line x1="195" y1="366" x2="195" y2="394" stroke="currentColor" stroke-width="1.5" marker-end="url(#tahc-arrow)"/>
  <line x1="525" y1="366" x2="525" y2="394" stroke="currentColor" stroke-width="1.5" marker-end="url(#tahc-arrow)"/>
</svg>
