<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="glt-ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker><marker id="glt-ai" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4F46E5"/></marker><marker id="glt-aa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B45309"/></marker><marker id="glt-ag" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#047857"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Pipelined frames at 60 Hz: CPU, GPU and display</text>
<line x1="110" y1="50" x2="110" y2="290" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
<text x="110" y="44" text-anchor="middle" font-size="11" fill="#4B5563">vsync 0</text>
<line x1="270" y1="50" x2="270" y2="290" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
<text x="270" y="44" text-anchor="middle" font-size="11" fill="#4B5563">vsync 1</text>
<line x1="430" y1="50" x2="430" y2="290" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
<text x="430" y="44" text-anchor="middle" font-size="11" fill="#4B5563">vsync 2</text>
<line x1="590" y1="50" x2="590" y2="290" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
<text x="590" y="44" text-anchor="middle" font-size="11" fill="#4B5563">vsync 3</text>
<line x1="750" y1="50" x2="750" y2="290" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 4"/>
<text x="736" y="44" text-anchor="middle" font-size="11" fill="#4B5563">vsync 4</text>
<rect x="10" y="70" width="94" height="44" rx="6" fill="#E5E7EB" stroke="#E5E7EB" stroke-width="1"/>
<text x="57" y="89" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">CPU</text>
<text x="57" y="104" text-anchor="middle" font-size="10" fill="#4B5563">input, update, record</text>
<rect x="10" y="130" width="94" height="44" rx="6" fill="#E5E7EB" stroke="#E5E7EB" stroke-width="1"/>
<text x="57" y="149" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">GPU</text>
<text x="57" y="164" text-anchor="middle" font-size="10" fill="#4B5563">execute commands</text>
<rect x="10" y="190" width="94" height="44" rx="6" fill="#E5E7EB" stroke="#E5E7EB" stroke-width="1"/>
<text x="57" y="209" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Display</text>
<text x="57" y="224" text-anchor="middle" font-size="10" fill="#4B5563">scan-out</text>
<rect x="110" y="74" width="120" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="170" y="87" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">frame N</text>
<text x="170" y="102" text-anchor="middle" font-size="11" fill="#3730A3">sim + record</text>
<rect x="230" y="134" width="120" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="290" y="147" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">frame N</text>
<text x="290" y="162" text-anchor="middle" font-size="11" fill="#3730A3">shade and rasterise</text>
<rect x="430" y="194" width="160" height="36" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="510" y="207" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">frame N</text>
<text x="510" y="222" text-anchor="middle" font-size="11" fill="#3730A3">held for one refresh</text>
<rect x="270" y="74" width="120" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="330" y="87" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">frame N+1</text>
<text x="330" y="102" text-anchor="middle" font-size="11" fill="#92400E">sim + record</text>
<rect x="390" y="134" width="120" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="450" y="147" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">frame N+1</text>
<text x="450" y="162" text-anchor="middle" font-size="11" fill="#92400E">shade and rasterise</text>
<rect x="590" y="194" width="160" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="670" y="207" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">frame N+1</text>
<text x="670" y="222" text-anchor="middle" font-size="11" fill="#92400E">held for one refresh</text>
<rect x="430" y="74" width="120" height="36" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="490" y="87" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">frame N+2</text>
<text x="490" y="102" text-anchor="middle" font-size="11" fill="#047857">sim + record</text>
<rect x="550" y="134" width="120" height="36" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="610" y="147" text-anchor="middle" font-size="11" fill="#047857" font-weight="bold">frame N+2</text>
<text x="610" y="162" text-anchor="middle" font-size="11" fill="#047857">shade and rasterise</text>
<rect x="590" y="74" width="120" height="36" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="650" y="87" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">frame N+3</text>
<text x="650" y="102" text-anchor="middle" font-size="11" fill="#374151">sim + record</text>
<line x1="110" y1="260" x2="430" y2="260" stroke="#B45309" stroke-width="2" marker-end="url(#glt-aa)"/>
<line x1="110" y1="252" x2="110" y2="268" stroke="#B45309" stroke-width="2"/>
<text x="270" y="252" text-anchor="middle" font-size="11" fill="#92400E">input sampled here</text>
<text x="270" y="280" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">about 2 vsync periods (33 ms) until frame N reaches the screen</text>
<circle cx="110" cy="318" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="110" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="130" y="322" text-anchor="start" font-size="12" fill="#374151">The CPU starts frame N+1 while the GPU still works on frame N</text>
<circle cx="110" cy="344" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/>
<text x="110" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="130" y="348" text-anchor="start" font-size="12" fill="#374151">Each stage must fit in one period (16.7 ms at 60 Hz) or the display repeats the previous frame</text>
</svg>
