<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Keras mixed precision dtype flow</title>
<desc id="d">Float32 master variables are cast to float16 or bfloat16 for the layer computation, the loss is computed on float32 outputs, scaled by the loss scale, and gradients are unscaled before the float32 variables are updated.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Mixed precision: variable dtype vs compute dtype</text>
<rect x="30" y="70" width="150" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="96" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">variables</text>
<text x="105" y="116" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">float32</text>
<rect x="285" y="70" width="150" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="96" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">layer compute</text>
<text x="360" y="116" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">float16 / bfloat16</text>
<rect x="540" y="70" width="150" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="615" y="96" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">output + loss</text>
<text x="615" y="116" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">float32</text>
<line x1="180" y1="100" x2="283" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="435" y1="100" x2="538" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="231" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">cast down</text>
<text x="486" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">cast up</text>
<rect x="540" y="180" width="150" height="60" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="615" y="206" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">loss x scale</text>
<text x="615" y="226" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">(float16 only)</text>
<rect x="285" y="180" width="150" height="60" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="360" y="206" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">grads / scale</text>
<text x="360" y="226" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">check inf / nan</text>
<rect x="30" y="180" width="150" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="105" y="206" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">apply update</text>
<text x="105" y="226" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">float32 weights</text>
<line x1="615" y1="130" x2="615" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="540" y1="210" x2="437" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="285" y1="210" x2="182" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Step skipped and scale halved on inf or nan gradients; bfloat16 needs no scaling.</text>
</svg>
