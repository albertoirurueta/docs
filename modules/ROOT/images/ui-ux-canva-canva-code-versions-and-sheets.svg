<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One code thread, many versions, one Sheet per version</text>
  <rect x="20" y="50" width="150" height="230" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="95" y="74" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Code thread</text>
  <rect x="35" y="90" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="95" y="110" font-size="12" fill="#374151" text-anchor="middle">Version 1</text>
  <rect x="35" y="130" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="95" y="150" font-size="12" fill="#374151" text-anchor="middle">Version 2</text>
  <rect x="35" y="170" width="120" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="95" y="190" font-size="12" fill="#92400E" text-anchor="middle">Version 3 (latest)</text>
  <text x="95" y="226" font-size="11" fill="#374151" text-anchor="middle">Each prompt adds</text><text x="95" y="241" font-size="11" fill="#374151" text-anchor="middle">a version</text>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M156,105 L236,105" marker-end="url(#ah)"/><path d="M156,145 L236,145" marker-end="url(#ah)"/><path d="M156,185 L236,185" marker-end="url(#ah)"/></g>
  <g fill="#FFFFFF" stroke="#9CA3AF"><rect x="240" y="88" width="170" height="34" rx="4"/><rect x="240" y="128" width="170" height="34" rx="4"/><rect x="240" y="168" width="170" height="34" rx="4" stroke="#B45309" stroke-width="1.5"/></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="325" y="109">Sheet for version 1</text><text x="325" y="149">Sheet for version 2</text><text x="325" y="189" fill="#92400E">Sheet for version 3</text></g>
  <text x="325" y="226" font-size="11" fill="#374151" text-anchor="middle">Data flows one way: widget to Sheet</text>
  <rect x="470" y="50" width="270" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="605" y="74" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Where a copy of the code goes</text>
  <rect x="490" y="90" width="230" height="40" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="605" y="108" font-size="12" fill="#374151" text-anchor="middle">Use in a design</text><text x="605" y="122" font-size="11" fill="#374151" text-anchor="middle">new design, new separate Sheet</text>
  <rect x="490" y="142" width="230" height="40" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="605" y="160" font-size="12" fill="#374151" text-anchor="middle">Publish from the thread</text><text x="605" y="174" font-size="11" fill="#374151" text-anchor="middle">one URL, updated on every publish</text>
  <rect x="490" y="194" width="230" height="40" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/>
  <text x="605" y="212" font-size="12" fill="#374151" text-anchor="middle">Show code, Copy code</text><text x="605" y="226" font-size="11" fill="#374151" text-anchor="middle">reuse outside Canva</text>
  <text x="605" y="260" font-size="11" fill="#374151" text-anchor="middle">Deleting the thread unpublishes the site</text>
  <text x="380" y="338" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
