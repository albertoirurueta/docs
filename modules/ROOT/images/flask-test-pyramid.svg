<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>The test pyramid for a Flask application</title>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">The test pyramid for a Flask application</text>
  <polygon points="230,50 296.5,120 163.5,120" fill="#808080" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="163.5,120 296.5,120 363,190 97,190" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <polygon points="97,190 363,190 429.5,260 30.5,260" fill="#808080" fill-opacity="0.36" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="102" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">E2E</text>
  <text x="230" y="160" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Integration</text>
  <text x="230" y="230" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Unit</text>
  <line x1="270" y1="88" x2="440" y2="88" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <line x1="333" y1="155" x2="440" y2="155" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <line x1="399" y1="225" x2="440" y2="225" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  <text x="450" y="76" font-size="13" font-weight="bold" fill="currentColor">Live server and browser</text>
  <text x="450" y="94" font-size="11" fill="currentColor">real HTTP, a running server, Selenium or Playwright</text>
  <text x="450" y="110" font-size="11" fill="currentColor" opacity="0.8">few tests, seconds each, the most brittle</text>
  <text x="450" y="143" font-size="13" font-weight="bold" fill="currentColor">Test client and a real database</text>
  <text x="450" y="161" font-size="11" fill="currentColor">app.test_client(), temporary SQLite, CLI runner, contexts</text>
  <text x="450" y="177" font-size="11" fill="currentColor" opacity="0.8">hundreds of tests, milliseconds each</text>
  <text x="450" y="213" font-size="13" font-weight="bold" fill="currentColor">Plain functions</text>
  <text x="450" y="231" font-size="11" fill="currentColor">validators, services, helpers: no Flask object needed</text>
  <text x="450" y="247" font-size="11" fill="currentColor" opacity="0.8">the most tests, microseconds each</text>
</svg>
