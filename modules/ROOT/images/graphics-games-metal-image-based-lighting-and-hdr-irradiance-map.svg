<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-image-based-lighting-and-hdr-irradiance-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From environment to irradiance map</text>
<rect x="30" y="60" width="260" height="130" rx="6" fill="#BFDBFE" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="30" y="125" width="260" height="65" rx="0" fill="#E5E7EB" stroke="#4B5563" stroke-width="1"/>
<circle cx="215" cy="90" r="14" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
<text x="215" y="70" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">lamp: very bright</text>
<text x="160" y="210" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Environment cube (HDR)</text>
<text x="160" y="228" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">sharp detail, values above 1</text>
<line x1="300" y1="125" x2="360" y2="125" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-metal-image-based-lighting-and-hdr-irradiance-map)"/>
<text x="330" y="112" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">convolve</text>
<rect x="370" y="60" width="100" height="130" rx="6" fill="#DBEAFE" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="370" y="125" width="100" height="65" rx="0" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/>
<circle cx="430" cy="92" r="26" fill="#FEF3C7" stroke="none" stroke-width="1"/>
<text x="420" y="210" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Irradiance cube</text>
<text x="420" y="228" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">32 x 32 per face, blurry</text>
<text x="620" y="70" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">One texel = one normal</text>
<circle cx="620" cy="190" r="60" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<rect x="540" y="190" width="160" height="70" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<line x1="540" y1="190" x2="700" y2="190" stroke="#4B5563" stroke-width="2"/>
<line x1="620" y1="190" x2="620" y2="110" stroke="#4F46E5" stroke-width="2" marker-end="url(#ah-metal-image-based-lighting-and-hdr-irradiance-map)"/>
<text x="640" y="120" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="start">N</text>
<line x1="620" y1="190" x2="559.3782217350893" y2="155.0" stroke="#B45309" stroke-width="1.2" marker-end="url(#ah-metal-image-based-lighting-and-hdr-irradiance-map)"/>
<line x1="620" y1="190" x2="585.0" y2="129.37822173508928" stroke="#B45309" stroke-width="1.2" marker-end="url(#ah-metal-image-based-lighting-and-hdr-irradiance-map)"/>
<line x1="620" y1="190" x2="620.0" y2="120.0" stroke="#B45309" stroke-width="1.2" marker-end="url(#ah-metal-image-based-lighting-and-hdr-irradiance-map)"/>
<line x1="620" y1="190" x2="655.0" y2="129.37822173508928" stroke="#B45309" stroke-width="1.2" marker-end="url(#ah-metal-image-based-lighting-and-hdr-irradiance-map)"/>
<line x1="620" y1="190" x2="680.6217782649107" y2="155.0" stroke="#B45309" stroke-width="1.2" marker-end="url(#ah-metal-image-based-lighting-and-hdr-irradiance-map)"/>
<text x="620" y="215" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">sum of light over</text>
<text x="620" y="230" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the hemisphere around N</text>
<rect x="30" y="258" width="700" height="60" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="380" y="282" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Diffuse light for a surface depends on its normal only, so one lookup replaces thousands of light samples.</text>
<text x="380" y="302" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The map is computed once at load (compute kernel) or offline and stored as a half-float cube.</text>
</svg>
