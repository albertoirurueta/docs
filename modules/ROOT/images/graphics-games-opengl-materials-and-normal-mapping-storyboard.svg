<line x1="661" y1="180" x2="666" y2="125" stroke="#6E4529" stroke-width="1.2" marker-end="url(#ah3)"/>
<line x1="683" y1="180" x2="688" y2="125" stroke="#6E4529" stroke-width="1.2" marker-end="url(#ah3)"/>
<line x1="705" y1="180" x2="710" y2="125" stroke="#6E4529" stroke-width="1.2" marker-end="url(#ah3)"/>
<text x="658" y="100" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">bumps catch light</text>
<text x="658" y="272" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Light</text>
<text x="658" y="290" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">use n_world in the Blinn-Phong</text>
<text x="658" y="304" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">terms</text>
</svg>
