<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah3-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: normal mapping the Bookshelf wood in four steps</text>
<rect x="20" y="50" width="172" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/>
<text x="36" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<line x1="60" y1="200" x2="140" y2="200" stroke="#B45309" stroke-width="2" marker-end="url(#ah3-w)"/>
<line x1="60" y1="200" x2="60" y2="120" stroke="#4F46E5" stroke-width="2" marker-end="url(#ah3-a)"/>
<line x1="60" y1="200" x2="95" y2="165" stroke="#047857" stroke-width="2" marker-end="url(#ah3)"/>
<text x="106" y="100" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">T B N</text>
<text x="106" y="272" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Interpolate</text>
<text x="106" y="290" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">T, B, N arrive from the vertex</text>
<text x="106" y="304" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">shader and are</text>
<text x="106" y="318" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">re-orthogonalised</text>
<rect x="204" y="50" width="172" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="220" cy="66" r="11" fill="#4F46E5"/>
<text x="220" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="240" y="100" width="26" height="26" fill="#8080FF" stroke="#FFFFFF" stroke-width="1"/>
<rect x="266" y="100" width="26" height="26" fill="#9A80F0" stroke="#FFFFFF" stroke-width="1"/>
<rect x="292" y="100" width="26" height="26" fill="#7080FF" stroke="#FFFFFF" stroke-width="1"/>
<rect x="318" y="100" width="26" height="26" fill="#8090E8" stroke="#FFFFFF" stroke-width="1"/>
<rect x="240" y="126" width="26" height="26" fill="#9A80F0" stroke="#FFFFFF" stroke-width="1"/>
<rect x="266" y="126" width="26" height="26" fill="#7080FF" stroke="#FFFFFF" stroke-width="1"/>
<rect x="292" y="126" width="26" height="26" fill="#8090E8" stroke="#FFFFFF" stroke-width="1"/>
<rect x="318" y="126" width="26" height="26" fill="#8080FF" stroke="#FFFFFF" stroke-width="1"/>
<rect x="240" y="152" width="26" height="26" fill="#7080FF" stroke="#FFFFFF" stroke-width="1"/>
<rect x="266" y="152" width="26" height="26" fill="#8090E8" stroke="#FFFFFF" stroke-width="1"/>
<rect x="292" y="152" width="26" height="26" fill="#8080FF" stroke="#FFFFFF" stroke-width="1"/>
<rect x="318" y="152" width="26" height="26" fill="#9A80F0" stroke="#FFFFFF" stroke-width="1"/>
<rect x="240" y="178" width="26" height="26" fill="#8090E8" stroke="#FFFFFF" stroke-width="1"/>
<rect x="266" y="178" width="26" height="26" fill="#8080FF" stroke="#FFFFFF" stroke-width="1"/>
<rect x="292" y="178" width="26" height="26" fill="#9A80F0" stroke="#FFFFFF" stroke-width="1"/>
<rect x="318" y="178" width="26" height="26" fill="#7080FF" stroke="#FFFFFF" stroke-width="1"/>
<text x="290" y="224" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">one texel under the cursor</text>
<text x="290" y="272" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Sample</text>
<text x="290" y="290" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">fetch the texel, then scale to</text>
<text x="290" y="304" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">-1..1 and normalise</text>
<rect x="388" y="50" width="172" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="404" cy="66" r="11" fill="#4F46E5"/>
<text x="404" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="418" y="100" width="50" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="443" y="130" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">TBN</text>
<line x1="473" y1="125" x2="508" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<line x1="513" y1="125" x2="538" y2="95" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ah3-a)"/>
<text x="474" y="190" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">tangent to world</text>
<text x="474" y="272" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Rotate</text>
<text x="474" y="290" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">n_world = TBN * n_tangent</text>
<rect x="572" y="50" width="172" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="588" cy="66" r="11" fill="#4F46E5"/>
<text x="588" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<polygon points="602,180 712,180 692,120 622,120" fill="#D9A678" stroke="#1F2937" stroke-width="1.2"/>
<line x1="617" y1="180" x2="622" y2="125" stroke="#6E4529" stroke-width="1.2" marker-end="url(#ah3)"/>
