<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">JSON layouts produced by DataFrame.to_json</title>
  <desc id="d">A two-row table on the left and four JSON layouts on the right: records is a list of row objects, columns is an object of column objects keyed by index label, index is an object of row objects keyed by index label, and split separates columns, index and data.</desc>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">One DataFrame, four orient layouts</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="24" y="80" width="170" height="30" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="109" y="100">id   name</text>
    <rect x="24" y="110" width="170" height="30" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/><text x="109" y="130">r1  1  Ada</text>
    <rect x="24" y="140" width="170" height="30" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/><text x="109" y="160">r2  2  Grace</text>
  </g>
  <text x="109" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">The frame</text>
  <text x="109" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">index labels r1 and r2</text>

  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">
    <rect x="230" y="56" width="466" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
    <text x="244" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">orient="records"  (index dropped)</text>
    <text x="244" y="100">[{"id":1,"name":"Ada"},{"id":2,"name":"Grace"}]</text>

    <rect x="230" y="126" width="466" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="244" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">orient="columns"  (default for DataFrame)</text>
    <text x="244" y="170">{"id":{"r1":1,"r2":2},"name":{"r1":"Ada","r2":"Grace"}}</text>

    <rect x="230" y="196" width="466" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="244" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">orient="index"</text>
    <text x="244" y="240">{"r1":{"id":1,"name":"Ada"},"r2":{"id":2,"name":"Grace"}}</text>

    <rect x="230" y="266" width="466" height="76" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <text x="244" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">orient="split"  (compact, keeps order and index)</text>
    <text x="244" y="308">{"columns":["id","name"],"index":["r1","r2"],</text>
    <text x="244" y="328"> "data":[[1,"Ada"],[2,"Grace"]]}</text>
  </g>
</svg>
