<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-transforms-and-camera-camera-types" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Arcball and first-person cameras</text>
<text x="190" y="58" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Arcball (orbit) camera</text>
<circle cx="190" cy="190" r="70" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6,4"/>
<rect x="165" y="175" width="50" height="30" rx="8" fill="white" stroke="#4F46E5" stroke-width="1.5"/>
<text x="190.0" y="193.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">target</text>
<circle cx="265" cy="150" r="7" fill="#B45309"/>
<line x1="262" y1="153" x2="215" y2="180" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-metal-transforms-and-camera-camera-types)"/>
<text x="290" y="140" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">eye</text>
<text x="190" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">eye = target + distance * (direction from angles)</text>
<text x="190" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">drag changes two angles; scroll changes distance</text>
<text x="570" y="58" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">First-person camera</text>
<circle cx="520" cy="190" r="7" fill="#B45309"/>
<polygon points="520,190 640,130 640,250" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="520" y1="190" x2="660" y2="190" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-metal-transforms-and-camera-camera-types)"/>
<text x="520" y="215" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">eye</text>
<text x="600" y="280" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">forward from yaw and pitch</text>
<text x="570" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="570" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">WASD moves along forward and right; mouse turns</text>
<text x="570" y="326" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">clamp pitch to avoid flipping over</text>
</svg>
