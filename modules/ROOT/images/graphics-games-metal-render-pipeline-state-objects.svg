<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-render-pipeline-state-objects" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What lives in which state object</text>
<rect x="20" y="50" width="230" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="68.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">MTLRenderPipelineState</text>
<text x="135.0" y="82.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">compiled once, immutable</text>
<rect x="20" y="104" width="230" height="190" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="160.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex and fragment functions</text>
<text x="135.0" y="174.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex descriptor</text>
<text x="135.0" y="188.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">colour attachment formats</text>
<text x="135.0" y="202.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blending per attachment</text>
<text x="135.0" y="216.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">raster sample count</text>
<text x="135.0" y="230.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">alpha to coverage</text>
<text x="135.0" y="244.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">depth format (Metal 3 only)</text>
<rect x="265" y="50" width="230" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="68.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">MTLDepthStencilState</text>
<text x="380.0" y="82.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">small, cheap to create</text>
<rect x="265" y="104" width="230" height="190" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="167.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">depth compare function</text>
<text x="380.0" y="181.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">depth write enabled</text>
<text x="380.0" y="195.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">front-face stencil</text>
<text x="380.0" y="209.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">back-face stencil</text>
<text x="380.0" y="223.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(stencil reference value</text>
<text x="380.0" y="237.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">is set on the encoder)</text>
<rect x="510" y="50" width="230" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="68.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Encoder state</text>
<text x="625.0" y="82.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">set per pass or draw</text>
<rect x="510" y="104" width="230" height="190" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="167.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">viewport, scissor rect</text>
<text x="625.0" y="181.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">cull mode, front facing</text>
<text x="625.0" y="195.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">triangle fill mode</text>
<text x="625.0" y="209.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">depth bias, depth clip mode</text>
<text x="625.0" y="223.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">stencil reference, blend colour</text>
<text x="625.0" y="237.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">argument table (Metal 4)</text>
<rect x="20" y="320" width="720" height="60" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="339.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">A draw call combines all three</text>
<text x="380.0" y="353.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">draw: the pipeline decides what the GPU runs, the depth-stencil state decides whether a fragment survives,</text>
<text x="380.0" y="367.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the encoder state decides where and how primitives are rasterised.</text>
<text x="380" y="410" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Create pipeline states at load time; create depth-stencil states once and reuse them.</text>
</svg>
