<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 339" width="1080" height="339" role="img" aria-labelledby="sap-finance-guide-follow-purchase-and-sale-postings-07-invoice-pay-clear-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-finance-guide-follow-purchase-and-sale-postings-07-invoice-pay-clear-title">Terminal with four curl commands: the invoice receipt answered with the document header 100000002 of type RE (callout 10), clearing of the GR/IR account for PO-1 answered with clearing document 100000002 and 2 cleared items (callout 12), the vendor payment answered with document 100000003 of type KZ (callout 13) and clearing of the supplier account answered with clearing document 100000003 and 2 cleared items (callout 14); the long answers wrap onto a second line</title>
<g><rect x="0" y="0" width="1080" height="339" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="307" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -sw &quot;\n&quot; --json @http/invoice-receipt.json $BASE/postInvoiceReceipt</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Documents/$entity&quot;,&quot;DocumentNumber&quot;:&quot;100000002&quot;,&quot;DocumentType&quot;:&quot;RE&quot;,&quot;CompanyCode&quot;:&quot;EX01&quot;,</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;Ledger&quot;:&quot;0L&quot;,&quot;PostingDate&quot;:&quot;2026-03-10&quot;,&quot;Description&quot;:&quot;Invoice PO-1&quot;}</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -sw &quot;\n&quot; --json @http/clear-gr-ir.json $BASE/clearOpenItems</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#LedgerPostingsService.Cleared&quot;,&quot;ClearingDocument&quot;:&quot;100000002&quot;,&quot;ClearedItems&quot;:2}</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -sw &quot;\n&quot; --json @http/pay-vendor.json $BASE/payVendor</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Documents/$entity&quot;,&quot;DocumentNumber&quot;:&quot;100000003&quot;,&quot;DocumentType&quot;:&quot;KZ&quot;,&quot;CompanyCode&quot;:&quot;EX01&quot;,</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;Ledger&quot;:&quot;0L&quot;,&quot;PostingDate&quot;:&quot;2026-03-20&quot;,&quot;Description&quot;:&quot;Payment of 100000002&quot;}</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -sw &quot;\n&quot; --json @http/clear-suppliers.json $BASE/clearOpenItems</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#LedgerPostingsService.Cleared&quot;,&quot;ClearingDocument&quot;:&quot;100000003&quot;,&quot;ClearedItems&quot;:2}</text>
