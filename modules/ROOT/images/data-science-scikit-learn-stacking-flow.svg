<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
<title id="t">Stacking trains the final estimator on out-of-fold predictions</title>
<desc id="d">Training data is split into folds. Each base estimator produces out-of-fold predictions through cross_val_predict. The stacked predictions become the features of the final estimator. For new data, the base estimators are refitted on the whole training set and their predictions feed the final estimator.</desc>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="438" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="28" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">StackingClassifier: what each estimator sees</text>
<text x="180" y="62" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">fit: building the second-level training set</text>
<rect x="30" y="80" width="120" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="90" y="108" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">X_train, y_train</text>
<text x="90" y="128" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">split into cv folds</text>
<rect x="210" y="80" width="110" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="265" y="107" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">ridge</text>
<line x1="150" y1="112" x2="208" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="102" x2="372" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="210" y="138" width="110" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="265" y="165" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">knn</text>
<line x1="150" y1="112" x2="208" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="160" x2="372" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="210" y="196" width="110" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="265" y="223" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">tree</text>
<line x1="150" y1="112" x2="208" y2="218" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="218" x2="372" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="374" y="80" width="120" height="64" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="434" y="104" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">out-of-fold</text>
<text x="434" y="122" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">predictions</text>
<text x="434" y="138" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(one column each)</text>
<line x1="494" y1="112" x2="540" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="542" y="80" width="150" height="64" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="617" y="108" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">final_estimator</text>
<text x="617" y="128" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">fitted on those columns</text>
<text x="180" y="262" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">predict: new samples</text>
<rect x="30" y="320" width="120" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="90" y="350" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">X_new</text>
<rect x="210" y="280" width="110" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="265" y="301" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">ridge</text>
<line x1="150" y1="345" x2="208" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="296" x2="372" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="210" y="320" width="110" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="265" y="341" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">knn</text>
<line x1="150" y1="345" x2="208" y2="336" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="336" x2="372" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="210" y="360" width="110" height="32" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="265" y="381" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">tree</text>
<line x1="150" y1="345" x2="208" y2="376" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="376" x2="372" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="374" y="320" width="120" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="434" y="342" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">base outputs</text>
<text x="434" y="360" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">on X_new</text>
<line x1="494" y1="345" x2="540" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="542" y="320" width="150" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="617" y="341" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">final_estimator</text>
<text x="617" y="359" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">predict(...)</text>
<text x="360" y="404" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">The base estimators used at predict time are refitted on all of X_train, not the fold models.</text>
<text x="360" y="422" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Fitting the final estimator on in-sample predictions would reward overfitted base models.</text>
</svg>
