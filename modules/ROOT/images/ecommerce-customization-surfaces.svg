<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">Customization surfaces of Shopify, PrestaShop, Magento and WooCommerce</title>
  <desc id="d">A grid with one column per platform and one row per customization surface. Theme: Liquid themes for Shopify, Hummingbird and Classic for PrestaShop, Luma and Hyva for Magento, block and classic themes for WooCommerce. Extension: apps, modules, modules with plugins and App Builder, and WordPress plugins. API: GraphQL for Shopify, Webservice and Admin API for PrestaShop, REST and GraphQL for Magento, REST and Store API for WooCommerce. Headless: Hydrogen, a custom front end, PWA Studio and Commerce Storefront, and a custom front end on the Store API.</desc>
  <rect x="130" y="14" width="215" height="42" rx="10" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="237.5" y="41" text-anchor="middle" font-weight="bold" font-size="16">Shopify</text>
  <rect x="355" y="14" width="215" height="42" rx="10" fill="#3498db" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="462.5" y="41" text-anchor="middle" font-weight="bold" font-size="16">PrestaShop</text>
  <rect x="580" y="14" width="215" height="42" rx="10" fill="#e67e22" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="687.5" y="41" text-anchor="middle" font-weight="bold" font-size="16">Magento</text>
  <rect x="805" y="14" width="215" height="42" rx="10" fill="#9b59b6" fill-opacity="0.30" stroke="currentColor" stroke-width="1.5"/>
  <text x="912.5" y="41" text-anchor="middle" font-weight="bold" font-size="16">WooCommerce</text>
  <rect x="14" y="70" width="106" height="108" rx="10" fill="#7f8c8d" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="67" y="129.0" text-anchor="middle" font-weight="bold" font-size="15">Theme</text>
  <rect x="130" y="70" width="215" height="108" rx="10" fill="#2ecc71" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="237.5" y="106" text-anchor="middle">Liquid themes: sections,</text>
  <text x="237.5" y="127" text-anchor="middle">theme blocks, JSON templates</text>
  <text x="237.5" y="148" text-anchor="middle">(Skeleton, Dawn, Horizon)</text>
  <rect x="355" y="70" width="215" height="108" rx="10" fill="#3498db" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="462.5" y="106" text-anchor="middle">Hummingbird (default) and</text>
  <text x="462.5" y="127" text-anchor="middle">Classic themes in Smarty,</text>
  <text x="462.5" y="148" text-anchor="middle">child themes</text>
  <rect x="580" y="70" width="215" height="108" rx="10" fill="#e67e22" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="687.5" y="106" text-anchor="middle">Luma themes with fallback</text>
  <text x="687.5" y="127" text-anchor="middle">inheritance, Hyva theme,</text>
  <text x="687.5" y="148" text-anchor="middle">layout XML and templates</text>
  <rect x="805" y="70" width="215" height="108" rx="10" fill="#9b59b6" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="912.5" y="106" text-anchor="middle">Block themes and classic</text>
  <text x="912.5" y="127" text-anchor="middle">themes (Storefront,</text>
  <text x="912.5" y="148" text-anchor="middle">Purple), template overrides</text>
  <rect x="14" y="188" width="106" height="108" rx="10" fill="#7f8c8d" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="67" y="247.0" text-anchor="middle" font-weight="bold" font-size="15">Extension</text>
  <rect x="130" y="188" width="215" height="108" rx="10" fill="#2ecc71" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="237.5" y="224" text-anchor="middle">Apps (React Router template),</text>
  <text x="237.5" y="245" text-anchor="middle">theme app extensions, checkout</text>
  <text x="237.5" y="266" text-anchor="middle">UI extensions, Shopify Functions</text>
  <rect x="355" y="188" width="215" height="108" rx="10" fill="#3498db" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="462.5" y="224" text-anchor="middle">Modules, hooks, services,</text>
  <text x="462.5" y="245" text-anchor="middle">overrides, Symfony admin</text>
  <text x="462.5" y="266" text-anchor="middle">controllers, CQRS commands</text>
  <rect x="580" y="188" width="215" height="108" rx="10" fill="#e67e22" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="687.5" y="224" text-anchor="middle">Modules: DI, plugins, events,</text>
  <text x="687.5" y="245" text-anchor="middle">declarative schema; App Builder</text>
  <text x="687.5" y="266" text-anchor="middle">for out-of-process extensions</text>
  <rect x="805" y="188" width="215" height="108" rx="10" fill="#9b59b6" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="912.5" y="224" text-anchor="middle">Plugins on WordPress: actions,</text>
  <text x="912.5" y="245" text-anchor="middle">filters, CRUD objects, blocks,</text>
  <text x="912.5" y="266" text-anchor="middle">gateways, shipping methods</text>
  <rect x="14" y="306" width="106" height="108" rx="10" fill="#7f8c8d" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="67" y="365.0" text-anchor="middle" font-weight="bold" font-size="15">API</text>
  <rect x="130" y="306" width="215" height="108" rx="10" fill="#2ecc71" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="237.5" y="342" text-anchor="middle">Admin and Storefront GraphQL,</text>
  <text x="237.5" y="363" text-anchor="middle">webhooks, Customer Account API</text>
  <text x="237.5" y="384" text-anchor="middle">(date-versioned, 2026-10)</text>
  <rect x="355" y="306" width="215" height="108" rx="10" fill="#3498db" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="462.5" y="342" text-anchor="middle">Webservice (XML or JSON)</text>
  <text x="462.5" y="363" text-anchor="middle">and Admin API (OAuth2</text>
  <text x="462.5" y="384" text-anchor="middle">client credentials)</text>
  <rect x="580" y="306" width="215" height="108" rx="10" fill="#e67e22" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="687.5" y="342" text-anchor="middle">REST, GraphQL and async</text>
  <text x="687.5" y="363" text-anchor="middle">endpoints; tokens, OAuth 1.0a</text>
  <text x="687.5" y="384" text-anchor="middle">and integrations</text>
  <rect x="805" y="306" width="215" height="108" rx="10" fill="#9b59b6" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="912.5" y="342" text-anchor="middle">REST API, Store API, webhooks,</text>
  <text x="912.5" y="363" text-anchor="middle">WC-CLI and the MCP developer</text>
  <text x="912.5" y="384" text-anchor="middle">preview</text>
  <rect x="14" y="424" width="106" height="108" rx="10" fill="#7f8c8d" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="67" y="483.0" text-anchor="middle" font-weight="bold" font-size="15">Headless</text>
  <rect x="130" y="424" width="215" height="108" rx="10" fill="#2ecc71" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="237.5" y="460" text-anchor="middle">Hydrogen toolkit and</text>
  <text x="237.5" y="481" text-anchor="middle">Oxygen hosting on the</text>
  <text x="237.5" y="502" text-anchor="middle">Storefront API</text>
  <rect x="355" y="424" width="215" height="108" rx="10" fill="#3498db" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="462.5" y="460" text-anchor="middle">Your own front end on the</text>
  <text x="462.5" y="481" text-anchor="middle">Webservice or Admin API</text>
  <text x="462.5" y="502" text-anchor="middle">(no first-party kit)</text>
  <rect x="580" y="424" width="215" height="108" rx="10" fill="#e67e22" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="687.5" y="460" text-anchor="middle">PWA Studio (maintained) and</text>
  <text x="687.5" y="481" text-anchor="middle">Commerce Storefront on</text>
  <text x="687.5" y="502" text-anchor="middle">Edge Delivery Services</text>
  <rect x="805" y="424" width="215" height="108" rx="10" fill="#9b59b6" fill-opacity="0.14" stroke="currentColor" stroke-width="1.2"/>
  <text x="912.5" y="460" text-anchor="middle">WordPress as back end, your own</text>
  <text x="912.5" y="481" text-anchor="middle">front end on the Store API</text>
  <text x="912.5" y="502" text-anchor="middle">or the REST API</text>
  <text x="520" y="552" text-anchor="middle" font-size="12" fill-opacity="0.8">Versions checked on 2026-10-27: Shopify API 2026-10, PrestaShop 9.2.0, Magento 2.4.9, WooCommerce 11.2.1</text>
</svg>
