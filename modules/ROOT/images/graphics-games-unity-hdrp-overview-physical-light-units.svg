<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-hd-unit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Physical light units: from moonlight to sunlight, and the Bookshelf lamp</text>
<text x="380" y="54" text-anchor="middle" font-size="12" fill="#374151">Illuminance on a surface in lux (logarithmic scale, values from the HDRP manual)</text>
<text x="220" y="85" text-anchor="end" font-size="12" fill="#374151">Moonlight, clear night</text>
<rect x="230.0" y="73" width="63.481684784115885" height="18" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="301.4816847841159" y="87" text-anchor="start" font-size="11" fill="#374151">below 1</text>
<text x="220" y="117" text-anchor="end" font-size="12" fill="#374151">City street at night</text>
<rect x="387.2518306641473" y="105" width="6" height="18" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="401.2518306641473" y="119" text-anchor="start" font-size="11" fill="#374151">30</text>
<text x="220" y="149" text-anchor="end" font-size="12" fill="#374151">Classroom or office</text>
<rect x="450.7335154482632" y="137" width="14.083332392895784" height="18" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="472.81684784115896" y="151" text-anchor="start" font-size="11" fill="#374151">300 to 500</text>
<text x="220" y="181" text-anchor="end" font-size="12" fill="#374151">Overcast sky at midday</text>
<rect x="483.9267391364636" y="169" width="19.109891295304635" height="18" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="511.03663043176823" y="183" text-anchor="start" font-size="11" fill="#374151">1,000 to 2,000</text>
<text x="220" y="213" text-anchor="end" font-size="12" fill="#374151">Blue sky at midday</text>
<rect x="566.5183152158841" y="201" width="6" height="18" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="580.5183152158841" y="215" text-anchor="start" font-size="11" fill="#374151">20,000</text>
<text x="220" y="245" text-anchor="end" font-size="12" fill="#374151">Bright to very bright sun</text>
<rect x="613.517786096278" y="233" width="6" height="18" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="627.517786096278" y="247" text-anchor="start" font-size="11" fill="#374151">110,000 to 120,000</text>
<line x1="230" y1="262" x2="630" y2="262" stroke="#4B5563" stroke-width="1"/>
<line x1="293.4816847841159" y1="262" x2="293.4816847841159" y2="268" stroke="#4B5563" stroke-width="1"/>
<text x="293.4816847841159" y="282" text-anchor="middle" font-size="10" fill="#374151">1</text>
<line x1="420.4450543523477" y1="262" x2="420.4450543523477" y2="268" stroke="#4B5563" stroke-width="1"/>
<text x="420.4450543523477" y="282" text-anchor="middle" font-size="10" fill="#374151">100</text>
<line x1="547.4084239205795" y1="262" x2="547.4084239205795" y2="268" stroke="#4B5563" stroke-width="1"/>
<text x="547.4084239205795" y="282" text-anchor="middle" font-size="10" fill="#374151">10,000</text>
<rect x="20" y="300" width="136" height="92" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="88" y="320" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Lumen (lm)</text>
<text x="88" y="338" text-anchor="middle" font-size="11" fill="#374151">luminous flux:</text>
<text x="88" y="353" text-anchor="middle" font-size="11" fill="#374151">total light emitted</text>
<text x="88" y="368" text-anchor="middle" font-size="11" fill="#374151">point light: 4 pi x cd</text>
<rect x="164" y="300" width="136" height="92" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="232" y="320" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Candela (cd)</text>
<text x="232" y="338" text-anchor="middle" font-size="11" fill="#374151">luminous intensity:</text>
<text x="232" y="353" text-anchor="middle" font-size="11" fill="#374151">flux per steradian</text>
<text x="232" y="368" text-anchor="middle" font-size="11" fill="#374151">native unit of spots</text>
<rect x="308" y="300" width="136" height="92" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="376" y="320" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Lux (lm per m2)</text>
<text x="376" y="338" text-anchor="middle" font-size="11" fill="#374151">illuminance:</text>
<text x="376" y="353" text-anchor="middle" font-size="11" fill="#374151">light arriving on</text>
<text x="376" y="368" text-anchor="middle" font-size="11" fill="#374151">a surface</text>
<rect x="452" y="300" width="136" height="92" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="520" y="320" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Nits (cd per m2)</text>
<text x="520" y="338" text-anchor="middle" font-size="11" fill="#374151">luminance:</text>
<text x="520" y="353" text-anchor="middle" font-size="11" fill="#374151">brightness of a</text>
<text x="520" y="368" text-anchor="middle" font-size="11" fill="#374151">visible surface</text>
<rect x="596" y="300" width="136" height="92" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="664" y="320" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">EV100</text>
<text x="664" y="338" text-anchor="middle" font-size="11" fill="#374151">exposure value:</text>
<text x="664" y="353" text-anchor="middle" font-size="11" fill="#374151">a camera setting or an</text>
<text x="664" y="368" text-anchor="middle" font-size="11" fill="#374151">equivalent light level</text>
<rect x="20" y="404" width="720" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="424" text-anchor="middle" font-size="12" fill="#92400E">Bookshelf desk lamp: an 800 lm lamp gives twice the light of a 400 lm one,</text>
<text x="380" y="442" text-anchor="middle" font-size="12" fill="#92400E">set it in Lumen on the Light component and judge the result through the exposure.</text>
</svg>
