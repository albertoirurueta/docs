<svg viewBox="0 0 720 300" width="720" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="300" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Reset, swap or detach: what each does to an instance</text>
<g stroke-width="1.5">
<rect x="20" y="50" width="210" height="210" rx="12" fill="#EEF2FF" stroke="#4F46E5"/>
<rect x="255" y="50" width="210" height="210" rx="12" fill="#EEF2FF" stroke="#4F46E5"/>
<rect x="490" y="50" width="210" height="210" rx="12" fill="#FEE2E2" stroke="#B91C1C"/>
</g>
<g font-size="14" font-weight="bold" text-anchor="middle"><text x="125" y="78" fill="#3730A3">Reset overrides</text><text x="360" y="78" fill="#3730A3">Swap instance</text><text x="595" y="78" fill="#B91C1C">Detach instance</text></g>
<g font-size="12" fill="#374151" text-anchor="middle">
<text x="125" y="108">Removes local changes.</text><text x="125" y="126">Link to the main stays.</text><text x="125" y="144">Use for one property</text><text x="125" y="160">or all of them.</text>
<text x="360" y="108">Replaces the component</text><text x="360" y="126">with a related one.</text><text x="360" y="144">Link stays, to the new</text><text x="360" y="160">main component.</text>
<text x="595" y="108">Becomes a plain frame.</text><text x="595" y="126">Link is lost, so future</text><text x="595" y="144">edits to the main</text><text x="595" y="160">no longer arrive.</text>
</g>
<rect x="60" y="190" width="130" height="36" rx="8" fill="#4F46E5"/><text x="125" y="213" font-size="12" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
<rect x="295" y="190" width="130" height="36" rx="8" fill="#047857"/><text x="360" y="213" font-size="12" fill="#FFFFFF" text-anchor="middle">Add to wishlist</text>
<rect x="530" y="190" width="130" height="36" rx="8" fill="#9CA3AF"/><text x="595" y="213" font-size="12" fill="#FFFFFF" text-anchor="middle">Frame</text>
<text x="360" y="284" font-size="12" fill="#4B5563" text-anchor="middle">Prefer reset or swap; detach only when the structure must differ from the main.</text>
</svg>
