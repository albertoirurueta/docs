<svg viewBox="0 0 760 500" width="760" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="500" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How an Android device ends up with its settings</text>
<text x="380" y="50" text-anchor="middle" font-size="12" fill="#374151">At launch the engine reads the device, picks one profile, then applies CVars from base to leaf</text>
<rect x="18" y="70" width="160" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="98.0" y="89.2" text-anchor="middle" font-size="12" fill="#3730A3">1  Device info</text>
<text x="98.0" y="105.2" text-anchor="middle" font-size="12" fill="#3730A3">GPU family, model,</text>
<text x="98.0" y="121.2" text-anchor="middle" font-size="12" fill="#3730A3">Android version,</text>
<text x="98.0" y="137.2" text-anchor="middle" font-size="12" fill="#3730A3">Vulkan available</text>
<rect x="206" y="70" width="160" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="286.0" y="89.2" text-anchor="middle" font-size="12" fill="#3730A3">2  Matching rules</text>
<text x="286.0" y="105.2" text-anchor="middle" font-size="12" fill="#3730A3">AndroidDeviceProfile</text>
<text x="286.0" y="121.2" text-anchor="middle" font-size="12" fill="#3730A3">MatchingRules, first</text>
<text x="286.0" y="137.2" text-anchor="middle" font-size="12" fill="#3730A3">match wins</text>
<rect x="394" y="70" width="160" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="474.0" y="89.2" text-anchor="middle" font-size="12" fill="#3730A3">3  Profile chosen</text>
<text x="474.0" y="105.2" text-anchor="middle" font-size="12" fill="#3730A3">fallback: Android_Low,</text>
<text x="474.0" y="121.2" text-anchor="middle" font-size="12" fill="#3730A3">Android_Mid or</text>
<text x="474.0" y="137.2" text-anchor="middle" font-size="12" fill="#3730A3">Android_High</text>
<rect x="582" y="70" width="160" height="78" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="662.0" y="89.2" text-anchor="middle" font-size="12" fill="#3730A3">4  CVars applied</text>
<text x="662.0" y="105.2" text-anchor="middle" font-size="12" fill="#3730A3">from BaseProfileName</text>
<text x="662.0" y="121.2" text-anchor="middle" font-size="12" fill="#3730A3">up the chain, leaf</text>
<text x="662.0" y="137.2" text-anchor="middle" font-size="12" fill="#3730A3">last</text>
<line x1="178" y1="109" x2="206" y2="109" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="366" y1="109" x2="394" y2="109" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="554" y1="109" x2="582" y2="109" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="380" y="178" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Profile inheritance with BaseProfileName</text>
<rect x="18" y="196" width="200" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="118.0" y="223.7" text-anchor="middle" font-size="12" fill="#374151">Android_High</text>
<text x="118.0" y="240.7" text-anchor="middle" font-size="12" fill="#374151">standard tier</text>
<rect x="268" y="196" width="200" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="368.0" y="223.7" text-anchor="middle" font-size="12" fill="#374151">Android_Adreno5xx</text>
<text x="368.0" y="240.7" text-anchor="middle" font-size="12" fill="#374151">adds one CVar</text>
<rect x="500" y="196" width="242" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="621.0" y="223.7" text-anchor="middle" font-size="12" fill="#374151">Android_Adreno5xx_No_Vulkan</text>
<text x="621.0" y="240.7" text-anchor="middle" font-size="12" fill="#374151">turns Vulkan off</text>
<line x1="218" y1="228" x2="268" y2="228" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="243" y="220" text-anchor="middle" font-size="10" fill="#4B5563">base of</text>
<line x1="468" y1="228" x2="500" y2="228" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="380" y="288" text-anchor="middle" font-size="12" fill="#374151">Each profile inherits every setting of its base, then applies its own overrides</text>
<text x="380" y="326" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Config files, later file overrides earlier</text>
<rect x="18" y="344" width="160" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="98.0" y="367.9" text-anchor="middle" font-size="11" fill="#3730A3">Engine/Config/</text>
<text x="98.0" y="383.9" text-anchor="middle" font-size="11" fill="#3730A3">Base*.ini</text>
<rect x="206" y="344" width="160" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="286.0" y="367.9" text-anchor="middle" font-size="11" fill="#3730A3">Project/Config/</text>
<text x="286.0" y="383.9" text-anchor="middle" font-size="11" fill="#3730A3">Base*.ini, Default*.ini</text>
<rect x="394" y="344" width="160" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="474.0" y="367.9" text-anchor="middle" font-size="11" fill="#3730A3">Engine/Config/Android/</text>
<text x="474.0" y="383.9" text-anchor="middle" font-size="11" fill="#3730A3">Android*.ini</text>
<rect x="582" y="344" width="160" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="662.0" y="367.9" text-anchor="middle" font-size="11" fill="#92400E">Project/Config/Android/</text>
<text x="662.0" y="383.9" text-anchor="middle" font-size="11" fill="#92400E">Android*.ini</text>
<line x1="178" y1="372" x2="206" y2="372" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="366" y1="372" x2="394" y2="372" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="554" y1="372" x2="582" y2="372" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="380" y="428" text-anchor="middle" font-size="11" fill="#374151">Scalability groups (sg.*) live in BaseScalability.ini and AndroidScalability.ini and follow the same order</text>
<rect x="18" y="444" width="724" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="467.9" text-anchor="middle" font-size="11" fill="#065F46">Edit Scalability in Config/Android/AndroidScalability.ini so Preview Rendering Level in the editor matches the device</text>
</svg>
