<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="t d">
<title id="t">Forward and reverse diffusion</title>
<desc id="d">A chain of states from a clean data sample x0 to pure noise xT. The forward process adds a little Gaussian noise at each step; the learned reverse process removes it step by step, predicting the noise with a neural network.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="268" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Diffusion: add noise forward, learn to remove it backward</text>
<rect x="30" y="100" width="100" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="80.0" y="130.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x0</text>
<text x="80" y="172" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">data</text>
<rect x="170" y="100" width="100" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="220.0" y="130.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x1</text>
<text x="220" y="172" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">slightly noisy</text>
<rect x="310" y="100" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
<text x="360.0" y="130.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">...</text>
<text x="360" y="172" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"></text>
<rect x="450" y="100" width="100" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="500.0" y="130.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x(T-1)</text>
<text x="500" y="172" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">very noisy</text>
<rect x="590" y="100" width="100" height="50" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="640.0" y="130.0" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">xT</text>
<text x="640" y="172" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">pure noise</text>
<line x1="132" y1="112" x2="168" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="168" y1="138" x2="132" y2="138" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="272" y1="112" x2="308" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="308" y1="138" x2="272" y2="138" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="412" y1="112" x2="448" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="448" y1="138" x2="412" y2="138" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="552" y1="112" x2="588" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="588" y1="138" x2="552" y2="138" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="360" y="66" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Forward q(x_t | x_(t-1)): fixed, adds Gaussian noise (no learning)</text>
<text x="360" y="208" font-size="13" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Reverse p_theta(x_(t-1) | x_t): learned, a network predicts the noise to remove</text>
<text x="360" y="240" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Dashed arrows: the learned reverse direction. Solid arrows: the fixed forward direction.</text>
</svg>
