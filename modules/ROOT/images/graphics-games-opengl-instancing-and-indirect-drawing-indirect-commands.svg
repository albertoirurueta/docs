<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-inst-ind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Multi-draw indirect: the GPU buffer says what to draw</text>
<text x="20" y="56" font-size="13" font-weight="bold" fill="#3730A3">GL_DRAW_INDIRECT_BUFFER: DrawElementsIndirectCommand [3], 20 bytes each</text>
<g font-size="11" text-anchor="middle" fill="#374151">
<rect x="20" y="66" width="60" height="30" fill="#EEF2FF" stroke="#4F46E5"/><text x="50" y="86">count</text>
<rect x="80" y="66" width="86" height="30" fill="#EEF2FF" stroke="#4F46E5"/><text x="123" y="86">instanceCount</text>
<rect x="166" y="66" width="66" height="30" fill="#EEF2FF" stroke="#4F46E5"/><text x="199" y="86">firstIndex</text>
<rect x="232" y="66" width="70" height="30" fill="#EEF2FF" stroke="#4F46E5"/><text x="267" y="86">baseVertex</text>
<rect x="302" y="66" width="78" height="30" fill="#EEF2FF" stroke="#4F46E5"/><text x="341" y="86">baseInstance</text>
<text x="200" y="116" font-size="10">draw 0: the books</text>
<rect x="400" y="66" width="60" height="30" fill="#FFFFFF" stroke="#4F46E5"/><text x="430" y="86">count</text>
<rect x="460" y="66" width="86" height="30" fill="#FFFFFF" stroke="#4F46E5"/><text x="503" y="86">instanceCount</text>
<rect x="546" y="66" width="66" height="30" fill="#FFFFFF" stroke="#4F46E5"/><text x="579" y="86">firstIndex</text>
<rect x="612" y="66" width="70" height="30" fill="#FFFFFF" stroke="#4F46E5"/><text x="647" y="86">baseVertex</text>
<rect x="682" y="66" width="58" height="30" fill="#FFFFFF" stroke="#4F46E5"/><text x="711" y="86">baseInst</text>
<text x="580" y="116" font-size="10">draw 1, draw 2 follow ...</text>
</g>
<text x="20" y="150" font-size="13" font-weight="bold" fill="#047857">One shared vertex buffer and one index buffer for all meshes</text>
<rect x="20" y="160" width="720" height="52" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<rect x="30" y="170" width="200" height="32" rx="5" fill="#FFFFFF" stroke="#047857"/><text x="130" y="190" font-size="11" fill="#374151" text-anchor="middle">book: baseVertex 0, firstIndex 0</text>
<rect x="236" y="170" width="220" height="32" rx="5" fill="#FFFFFF" stroke="#047857"/><text x="346" y="190" font-size="11" fill="#374151" text-anchor="middle">bookend: baseVertex 36, firstIndex 36</text>
<rect x="462" y="170" width="268" height="32" rx="5" fill="#FFFFFF" stroke="#047857"/><text x="596" y="190" font-size="11" fill="#374151" text-anchor="middle">lamp: baseVertex 60, firstIndex 60</text>
<text x="20" y="240" font-size="13" font-weight="bold" fill="#92400E">Instance buffer slices selected by baseInstance</text>
<rect x="20" y="250" width="720" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="30" y="258" width="150" height="28" rx="5" fill="#FFFFFF" stroke="#B45309"/><text x="105" y="276" font-size="11" fill="#374151" text-anchor="middle">books 0..119</text>
<rect x="186" y="258" width="300" height="28" rx="5" fill="#FFFFFF" stroke="#B45309"/><text x="336" y="276" font-size="11" fill="#374151" text-anchor="middle">bookends 120..131, baseInstance 120</text>
<rect x="492" y="258" width="238" height="28" rx="5" fill="#FFFFFF" stroke="#B45309"/><text x="611" y="276" font-size="11" fill="#374151" text-anchor="middle">lamps 132..135, bi 132</text>
<path d="M50 96 L130 160" stroke="#4B5563" stroke-width="1.2" fill="none" marker-end="url(#ah-inst-ind)"/>
<path d="M50 96 L105 250" stroke="#4B5563" stroke-width="1.2" fill="none" marker-end="url(#ah-inst-ind)"/>
<rect x="20" y="320" width="720" height="100" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="344" font-size="12" fill="#374151" text-anchor="middle">glMultiDrawElementsIndirect(GL_TRIANGLES, GL_UNSIGNED_INT, offset 0, drawcount 3, stride 0)</text>
<text x="380" y="364" font-size="12" fill="#374151" text-anchor="middle">is equivalent to three glDrawElementsInstancedBaseVertexBaseInstance calls with those fields,</text>
<text x="380" y="384" font-size="12" fill="#374151" text-anchor="middle">but only one call is made by the CPU, and a compute shader may have written the buffer.</text>
<text x="380" y="404" font-size="11" fill="#374151" text-anchor="middle">gl_DrawID (GLSL 4.60) tells the vertex shader which of the three draws it belongs to.</text>
</svg>
