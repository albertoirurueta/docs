<text x="500" y="134" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">c</text>
<rect x="516" y="110" width="24" height="36" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="528" y="134" font-size="13" font-weight="normal" fill="#1F2937" text-anchor="middle">o</text>
