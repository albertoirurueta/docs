<text x="585" y="180" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Quad corners come from the pen position</text>
<text x="585" y="195" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">plus xoff / yoff; texture coordinates</text>
<text x="585" y="210" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">are the atlas rectangle divided by</text>
<text x="585" y="225" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the atlas size.</text>
<text x="585" y="262" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pen moves right by xadvance</text>
<text x="585" y="277" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">after each glyph.</text>
<rect x="30" y="334" width="700" height="50" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="354" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Sample the atlas as coverage (alpha) with straight alpha blending, and use pixel-exact positions</text>
<text x="380" y="370" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">with GL_NEAREST or a matching size, otherwise small text blurs.</text>
