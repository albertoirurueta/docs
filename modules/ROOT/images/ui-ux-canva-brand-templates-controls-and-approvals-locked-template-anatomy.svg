<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of the locked "Book of the week" template</text>
  <rect x="30" y="50" width="330" height="330" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <rect x="50" y="70" width="290" height="290" rx="4" fill="#EEF2FF" stroke="#6B7280"/>
  <rect x="50" y="70" width="290" height="290" rx="4" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/>
  <g><rect x="68" y="88" width="14" height="34" rx="2" fill="#4F46E5"/><rect x="86" y="82" width="14" height="40" rx="2" fill="#B45309"/><rect x="104" y="92" width="14" height="30" rx="2" fill="#9CA3AF"/><rect x="64" y="122" width="58" height="5" rx="1" fill="#1F2937"/></g>
  <rect x="64" y="80" width="64" height="52" rx="3" fill="none" stroke="#B45309" stroke-width="2"/>
  <rect x="68" y="150" width="200" height="22" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="76" y="166" font-size="13" fill="#374151">Book title goes here</text>
  <rect x="68" y="184" width="130" height="14" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="74" y="195" font-size="11" fill="#374151">Author goes here</text>
  <rect x="68" y="214" width="110" height="130" rx="4" fill="#E5E7EB" stroke="#4F46E5" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="123" y="283" font-size="11" fill="#374151" text-anchor="middle">Cover frame</text>
  <rect x="200" y="300" width="124" height="30" rx="15" fill="#4F46E5"/>
  <rect x="196" y="296" width="132" height="38" rx="19" fill="none" stroke="#B45309" stroke-width="2"/>
  <text x="262" y="320" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Find it on Bookshelf</text>
  <circle cx="30" cy="106" r="11" fill="#B45309"/><text x="30" y="110" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="30" cy="161" r="11" fill="#4F46E5"/><text x="30" y="165" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="30" cy="280" r="11" fill="#4F46E5"/><text x="30" y="284" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="30" cy="316" r="11" fill="#B45309"/><text x="30" y="320" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="52" cy="72" r="11" fill="#B45309"/><text x="52" y="76" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <g font-size="13" fill="#1F2937">
    <text x="400" y="92" font-weight="bold">Legend</text>
    <rect x="400" y="104" width="28" height="16" fill="none" stroke="#B45309" stroke-width="2"/><text x="440" y="117">Solid amber outline: full lock, nothing can change</text>
    <rect x="400" y="130" width="28" height="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="3 3"/><text x="440" y="143">Dashed indigo outline: lock position only</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="400" y="182" font-weight="bold" fill="#1F2937" font-size="13">What a teammate can still do</text>
    <text x="400" y="204">1  Logo mark: nothing, it cannot be moved, resized or deleted</text>
    <text x="400" y="224">2  Title and author: type new words; font, size, colour fixed</text>
    <text x="400" y="244">3  Cover frame: replace, crop or resize the picture inside</text>
    <text x="400" y="264">4  Call to action: full lock keeps the required wording</text>
    <text x="400" y="284">5  Page and background: locked so the page cannot be deleted</text>
  </g>
  <text x="400" y="320" font-size="12" fill="#374151">Locks are set before publishing; to change them later, edit the</text>
  <text x="400" y="336" font-size="12" fill="#374151">template, adjust the locks and republish.</text>
  <text x="380" y="402" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
