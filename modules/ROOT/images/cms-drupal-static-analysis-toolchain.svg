<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
  <title id="t">Static analysis toolchain for a Drupal project</title>
  <desc id="d">Four kinds of source file on the left are checked by the matching tools in the middle, and all tools feed one local script and one CI job on the right.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #1b1b1b; }
    .h { font-weight: bold; }
    .s { font-size: 12px; fill: #444; }
    .box { fill: #eef3fa; stroke: #2b5d9b; stroke-width: 1.5; }
    .tool { fill: #f4f9ee; stroke: #4c7a2a; stroke-width: 1.5; }
    .out { fill: #fdf4e6; stroke: #a8660f; stroke-width: 1.5; }
    .ln { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#a); }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect class="box" x="20" y="30" width="190" height="52" rx="6"/><text class="h" x="32" y="52">PHP and YAML</text><text class="s" x="32" y="70">src/, module, install, yml</text>
  <rect class="box" x="20" y="105" width="190" height="52" rx="6"/><text class="h" x="32" y="127">Twig templates</text><text class="s" x="32" y="145">templates/, components/</text>
  <rect class="box" x="20" y="180" width="190" height="52" rx="6"/><text class="h" x="32" y="202">JavaScript</text><text class="s" x="32" y="220">js/, behaviors</text>
  <rect class="box" x="20" y="255" width="190" height="52" rx="6"/><text class="h" x="32" y="277">CSS</text><text class="s" x="32" y="295">css/, theme assets</text>
  <rect class="tool" x="290" y="20" width="210" height="72" rx="6"/><text class="h" x="302" y="42">PHPCS + Coder 9</text><text class="s" x="302" y="60">Drupal, DrupalPractice</text><text class="s" x="302" y="78">PHPStan + phpstan-drupal</text>
  <rect class="tool" x="290" y="105" width="210" height="52" rx="6"/><text class="h" x="302" y="127">Twig CS Fixer</text><text class="s" x="302" y="145">lint and fix, third party</text>
  <rect class="tool" x="290" y="180" width="210" height="52" rx="6"/><text class="h" x="302" y="202">ESLint + Prettier</text><text class="s" x="302" y="220">core configuration</text>
  <rect class="tool" x="290" y="255" width="210" height="52" rx="6"/><text class="h" x="302" y="277">Stylelint</text><text class="s" x="302" y="295">core configuration</text>
  <rect class="out" x="580" y="105" width="160" height="110" rx="6"/><text class="h" x="592" y="132">One gate</text><text class="s" x="592" y="152">composer script locally</text><text class="s" x="592" y="170">same commands in CI</text><text class="s" x="592" y="188">Upgrade Status and</text><text class="s" x="592" y="204">Rector before upgrades</text>
  <path class="ln" d="M210,56 L288,56"/><path class="ln" d="M210,131 L288,131"/><path class="ln" d="M210,206 L288,206"/><path class="ln" d="M210,281 L288,281"/>
  <path class="ln" d="M500,56 L540,56 L540,140 L578,140"/><path class="ln" d="M500,131 L578,160"/><path class="ln" d="M500,206 L540,206 L540,180 L578,180"/><path class="ln" d="M500,281 L540,281 L540,200 L578,200"/>
</svg>
