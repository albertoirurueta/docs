<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 129" width="1080" height="129" role="img" aria-labelledby="sap-finance-guide-allocate-costs-and-read-a-trial-balance-04-balances-before-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-finance-guide-allocate-costs-and-read-a-trial-balance-04-balances-before-title">Terminal with the curl command that reads the entity CostCenterBalances and the answer: only the cost center EX-RENT has a balance, 1000.00 on the G/L account 455000; callout 7 marks the command and the answer</title>
<g><rect x="0" y="0" width="1080" height="129" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="97" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s http://localhost:4004/odata/v4/allocation/CostCenterBalances</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#CostCenterBalances&quot;,&quot;value&quot;:[{&quot;CostCenter&quot;:&quot;EX-RENT&quot;,&quot;GLAccount&quot;:&quot;455000&quot;,&quot;Balance&quot;:&quot;1000</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">.00&quot;}]}</text>
<rect x="5" y="46" width="1042" height="65" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">7</text></g></g>
</svg>
