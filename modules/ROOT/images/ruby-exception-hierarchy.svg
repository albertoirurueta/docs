<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Ruby exception class hierarchy</title>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Ruby 4.0 built-in exception hierarchy</text>
  <text x="500" y="47" font-size="12" fill="#666666" text-anchor="middle">every class below inherits from Exception; a bare rescue (rescue =&gt; e) handles StandardError and its subclasses only</text>
  <rect x="400" y="64" width="200" height="34" rx="5" fill="#1c4b73" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="500.0" y="85.5" font-size="13" font-family="Courier New, monospace" font-weight="bold" fill="#ffffff" text-anchor="middle">Exception</text>
  <path d="M500,98 L500,116" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M150,116 L640,116" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M150,116 L150,134" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M640,116 L640,134" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="20" y="134" width="260" height="506" rx="8" fill="#fdf0e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="150" y="156" font-size="13" font-weight="bold" fill="#8a4a12" text-anchor="middle">Not caught by a bare rescue</text>
  <rect x="36" y="170" width="228" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="150.0" y="187.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">NoMemoryError</text>
  <rect x="36" y="204" width="228" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="150.0" y="221.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">ScriptError</text>
  <path d="M48,230 L48,251.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M48,251.0 L66,251.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="66" y="238" width="198" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="165.0" y="255.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">LoadError</text>
  <path d="M48,264 L48,285.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M48,285.0 L66,285.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="66" y="272" width="198" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="165.0" y="289.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">NotImplementedError</text>
  <path d="M48,298 L48,319.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M48,319.0 L66,319.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="66" y="306" width="198" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="165.0" y="323.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">SyntaxError</text>
  <rect x="36" y="340" width="228" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="150.0" y="357.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">SecurityError</text>
  <rect x="36" y="374" width="228" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="150.0" y="391.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">SignalException</text>
  <path d="M48,400 L48,421.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M48,421.0 L66,421.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="66" y="408" width="198" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="165.0" y="425.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">Interrupt</text>
  <rect x="36" y="442" width="228" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="150.0" y="459.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">SystemExit</text>
  <rect x="36" y="476" width="228" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="150.0" y="493.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">SystemStackError</text>
  <rect x="36" y="510" width="228" height="26" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="150.0" y="527.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">fatal</text>
  <rect x="300" y="134" width="680" height="506" rx="8" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="640" y="156" font-size="13" font-weight="bold" fill="#1f5a24" text-anchor="middle">StandardError: what a bare rescue catches</text>
  <rect x="316" y="172" width="196" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="414.0" y="189.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">ArgumentError</text>
  <path d="M328,198 L328,219.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M328,219.0 L346,219.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="346" y="206" width="166" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="429.0" y="223.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">UncaughtThrowError</text>
  <rect x="316" y="240" width="196" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="414.0" y="257.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">EncodingError</text>
  <rect x="316" y="274" width="196" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="414.0" y="291.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">FiberError</text>
  <rect x="316" y="308" width="196" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="414.0" y="325.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">IOError</text>
  <path d="M328,334 L328,355.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M328,355.0 L346,355.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="346" y="342" width="166" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="429.0" y="359.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">EOFError</text>
  <rect x="316" y="376" width="196" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="414.0" y="393.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">IndexError</text>
  <path d="M328,402 L328,423.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M328,423.0 L346,423.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="346" y="410" width="166" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="429.0" y="427.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">KeyError</text>
  <path d="M328,436 L328,457.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M328,457.0 L346,457.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="346" y="444" width="166" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="429.0" y="461.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">StopIteration</text>
  <rect x="526" y="172" width="240" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="646.0" y="189.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">LocalJumpError</text>
  <rect x="526" y="206" width="240" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="646.0" y="223.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">NameError</text>
  <path d="M538,232 L538,253.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M538,253.0 L556,253.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="556" y="240" width="210" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="661.0" y="257.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">NoMethodError</text>
  <rect x="526" y="274" width="240" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="646.0" y="291.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">NoMatchingPatternError</text>
  <path d="M538,300 L538,321.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M538,321.0 L556,321.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="556" y="308" width="210" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="661.0" y="325.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">NoMatchingPatternKeyError</text>
  <rect x="526" y="342" width="240" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="646.0" y="359.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">RangeError</text>
  <path d="M538,368 L538,389.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M538,389.0 L556,389.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="556" y="376" width="210" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="661.0" y="393.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">FloatDomainError</text>
  <rect x="526" y="410" width="240" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="646.0" y="427.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">RegexpError</text>
  <rect x="526" y="444" width="240" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="646.0" y="461.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">RuntimeError</text>
  <path d="M538,470 L538,491.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M538,491.0 L556,491.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="556" y="478" width="210" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="661.0" y="495.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">FrozenError</text>
  <rect x="780" y="172" width="184" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="872.0" y="189.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">SystemCallError</text>
  <path d="M792,198 L792,219.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <path d="M792,219.0 L810,219.0" stroke="#777777" stroke-width="1.3" fill="none"/>
  <rect x="810" y="206" width="154" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="887.0" y="223.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">Errno::ENOENT ...</text>
  <rect x="780" y="240" width="184" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="872.0" y="257.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">ThreadError</text>
  <rect x="780" y="274" width="184" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="872.0" y="291.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">TypeError</text>
  <rect x="780" y="308" width="184" height="26" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="872.0" y="325.5" font-size="13" font-family="Courier New, monospace" fill="#222222" text-anchor="middle">ZeroDivisionError</text>
  <text x="316" y="566" font-size="12" fill="#444444">StopIteration also has ClosedQueueError below it. Timeout::Error (timeout library) is a RuntimeError;</text>
  <text x="316" y="584" font-size="12" fill="#444444">Timeout::ExitException, which actually interrupts the block, is a plain Exception.</text>
  <text x="316" y="606" font-size="12" fill="#444444">Custom errors subclass StandardError (or a more specific class). Gems add their own, for example</text>
  <text x="316" y="624" font-size="12" fill="#444444">JSON::ParserError, Net::OpenTimeout and OpenSSL::SSL::SSLError, all under StandardError.</text>
</svg>
