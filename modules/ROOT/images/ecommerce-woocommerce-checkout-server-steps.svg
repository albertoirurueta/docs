<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Server steps of a Store API checkout request and the hooks you can use</title>
  <desc id="d">A vertical list of the steps of POST wc/store/v1/checkout in WooCommerce 11.2.1, numbered like the order step log. Step 1 starts the flow. Step 2 checks that the cart is not empty. Step 3 persists customer data from the request (woocommerce_store_api_checkout_update_customer_from_request). Then the cart is validated (woocommerce_store_api_validate_cart_item and woocommerce_store_api_cart_errors) and the total is checked against what the shopper confirmed. Step 4 creates or updates the draft order (woocommerce_store_api_checkout_order_created and woocommerce_store_api_checkout_update_order_meta). Step 5 writes posted data (woocommerce_store_api_checkout_update_order_from_request). Step 6 creates or syncs the customer. Step 7 validates the order before payment and holds coupons. Step 8 reserves stock and sets the status to pending, then woocommerce_store_api_checkout_order_processed. Step 9 processes the payment through woocommerce_rest_checkout_process_payment_with_context and the gateway.</desc>
  <rect x="0" y="0" width="960" height="640" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ec5f0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8a0a0"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">POST /wc/store/v1/checkout, step by step</text>
  <text x="40" y="56" font-size="12.5" fill="#f2f5f8">Step numbers are the ones printed by the order step log; hooks are the ones observed firing in that order</text>
  <rect x="40" y="76" width="880" height="50" rx="6" fill="#3d5266"/>
  <text x="56" y="107" font-size="14" font-weight="bold" fill="#f4b860">#1</text>
  <text x="110" y="98" font-size="13" font-weight="bold" fill="#f2f5f8">Place order flow initiated</text>
  <text x="110" y="116" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">the order step log starts here (woocommerce_order_step_logging_enabled)</text>
  <rect x="40" y="131" width="880" height="50" rx="6" fill="#3d5266"/>
  <text x="56" y="162" font-size="14" font-weight="bold" fill="#f4b860">#2</text>
  <text x="110" y="153" font-size="13" font-weight="bold" fill="#f2f5f8">Cart validated</text>
  <text x="110" y="171" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">guest checkout allowed, cart not empty</text>
  <rect x="40" y="186" width="880" height="50" rx="6" fill="#3d5266"/>
  <text x="56" y="217" font-size="14" font-weight="bold" fill="#f4b860">#3</text>
  <text x="110" y="208" font-size="13" font-weight="bold" fill="#f2f5f8">Customer data from request</text>
  <text x="110" y="226" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">woocommerce_store_api_checkout_update_customer_from_request</text>
  <rect x="40" y="241" width="880" height="50" rx="6" fill="#33485c" stroke="#9fd3c7" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="56" y="272" font-size="14" font-weight="bold" fill="#f4b860"></text>
  <text x="110" y="263" font-size="13" font-weight="bold" fill="#f2f5f8">Totals and cart validation (not numbered in the log)</text>
  <text x="110" y="281" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">woocommerce_store_api_validate_cart_item, woocommerce_store_api_cart_errors, 409 if expected_total differs (11.1.0)</text>
  <rect x="40" y="296" width="880" height="50" rx="6" fill="#3d5266"/>
  <text x="56" y="327" font-size="14" font-weight="bold" fill="#f4b860">#4</text>
  <text x="110" y="318" font-size="13" font-weight="bold" fill="#f2f5f8">Draft order created or updated</text>
  <text x="110" y="336" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">woocommerce_store_api_checkout_order_created, ..._update_order_meta</text>
  <rect x="40" y="351" width="880" height="50" rx="6" fill="#3d5266"/>
  <text x="56" y="382" font-size="14" font-weight="bold" fill="#f4b860">#5</text>
  <text x="110" y="373" font-size="13" font-weight="bold" fill="#f2f5f8">Order updated with posted data</text>
  <text x="110" y="391" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">woocommerce_store_api_checkout_update_order_from_request</text>
  <rect x="40" y="406" width="880" height="50" rx="6" fill="#3d5266"/>
  <text x="56" y="437" font-size="14" font-weight="bold" fill="#f4b860">#6</text>
  <text x="110" y="428" font-size="13" font-weight="bold" fill="#f2f5f8">Customer created or synced</text>
  <text x="110" y="446" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">account creation, billing and shipping copied to the customer</text>
  <rect x="40" y="461" width="880" height="50" rx="6" fill="#3d5266"/>
  <text x="56" y="492" font-size="14" font-weight="bold" fill="#f4b860">#7</text>
  <text x="110" y="483" font-size="13" font-weight="bold" fill="#f2f5f8">Order validated before payment</text>
  <text x="110" y="501" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">woocommerce_checkout_validate_order_before_payment, coupons held</text>
  <rect x="40" y="516" width="880" height="50" rx="6" fill="#3d5266"/>
  <text x="56" y="547" font-size="14" font-weight="bold" fill="#f4b860">#8</text>
  <text x="110" y="538" font-size="13" font-weight="bold" fill="#f2f5f8">Stock reserved, status pending</text>
  <text x="110" y="556" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">wc_reserve_stock_for_order(), then woocommerce_store_api_checkout_order_processed</text>
  <rect x="40" y="571" width="880" height="50" rx="6" fill="#3d5266"/>
  <text x="56" y="602" font-size="14" font-weight="bold" fill="#f4b860">#9</text>
  <text x="110" y="593" font-size="13" font-weight="bold" fill="#f2f5f8">Payment processed</text>
  <text x="110" y="611" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#9fd3c7">woocommerce_rest_checkout_process_payment_with_context, gateway process_payment()</text>
  <path d="M34 86 L34 600" stroke="#9fd3c7" stroke-width="2" fill="none" marker-end="url(#b)"/>
</svg>
