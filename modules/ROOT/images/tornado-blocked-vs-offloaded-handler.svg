<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>One blocked handler stalls every connection, while an offloaded handler lets the event loop keep serving</title>
  <defs>
    <marker id="tbo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <pattern id="tbo-wait" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="2" opacity="0.45"/>
    </pattern>
  </defs>

  <text x="360" y="24" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Same traffic, two handlers</text>
  <text x="360" y="42" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">one Tornado process; the horizontal axis is time; GET /report starts at the left edge</text>

  <!-- Scenario 1 -->
  <text x="20" y="74" font-size="13" font-weight="bold" fill="currentColor">1. Blocking call inside the handler</text>
  <text x="20" y="92" font-size="11" fill="currentColor" opacity="0.85">time.sleep, a sync driver or password hashing</text>

  <text x="20" y="124" font-size="11" fill="currentColor">event loop thread</text>
  <rect x="150" y="108" width="40" height="22" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <text x="170" y="123" font-size="10" fill="currentColor" text-anchor="middle">parse</text>
  <rect x="190" y="108" width="380" height="22" rx="3" fill="#808080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/>
  <text x="380" y="123" font-size="11" fill="currentColor" text-anchor="middle">GET /report is BLOCKED in the handler</text>
  <rect x="570" y="108" width="60" height="22" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <text x="600" y="123" font-size="10" fill="currentColor" text-anchor="middle">finish</text>

  <text x="20" y="160" font-size="11" fill="currentColor">GET /ping (tab 2)</text>
  <rect x="215" y="146" width="355" height="18" rx="3" fill="url(#tbo-wait)" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="392" y="159" font-size="10" fill="currentColor" text-anchor="middle">accepted by the kernel, waits for the loop</text>
  <rect x="570" y="146" width="40" height="18" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <text x="620" y="159" font-size="10" fill="currentColor">answered late</text>

  <text x="20" y="190" font-size="11" fill="currentColor">WebSocket frame</text>
  <rect x="300" y="176" width="270" height="18" rx="3" fill="url(#tbo-wait)" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="435" y="189" font-size="10" fill="currentColor" text-anchor="middle">delivered late, timers fire late</text>
  <line x1="150" y1="206" x2="700" y2="206" stroke="currentColor" stroke-width="1" marker-end="url(#tbo-arrow)" opacity="0.6"/>

  <!-- Scenario 2 -->
  <text x="20" y="250" font-size="13" font-weight="bold" fill="currentColor">2. Offloaded with run_in_executor</text>
  <text x="20" y="268" font-size="11" fill="currentColor" opacity="0.85">the handler awaits; the loop stays free</text>

  <text x="20" y="300" font-size="11" fill="currentColor">event loop thread</text>
  <rect x="150" y="284" width="40" height="22" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <text x="170" y="299" font-size="10" fill="currentColor" text-anchor="middle">parse</text>
  <rect x="190" y="284" width="30" height="22" rx="3" fill="#808080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/>
  <text x="205" y="299" font-size="10" fill="currentColor" text-anchor="middle">await</text>
  <rect x="225" y="284" width="30" height="22" rx="3" fill="#808080" fill-opacity="0.2" stroke="currentColor" stroke-width="1.2"/>
  <text x="240" y="299" font-size="10" fill="currentColor" text-anchor="middle">ping</text>
  <rect x="300" y="284" width="40" height="22" rx="3" fill="#808080" fill-opacity="0.2" stroke="currentColor" stroke-width="1.2"/>
  <text x="320" y="299" font-size="10" fill="currentColor" text-anchor="middle">frame</text>
  <rect x="400" y="284" width="40" height="22" rx="3" fill="#808080" fill-opacity="0.2" stroke="currentColor" stroke-width="1.2"/>
  <text x="420" y="299" font-size="10" fill="currentColor" text-anchor="middle">timer</text>
  <rect x="570" y="284" width="60" height="22" rx="3" fill="#808080" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
  <text x="600" y="299" font-size="10" fill="currentColor" text-anchor="middle">finish</text>
  <text x="440" y="326" font-size="10" fill="currentColor" opacity="0.85">idle slices between the boxes: the loop is waiting for events, not blocked</text>

  <text x="20" y="352" font-size="11" fill="currentColor">worker thread or process</text>
  <rect x="220" y="338" width="350" height="22" rx="3" fill="#808080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/>
  <text x="395" y="353" font-size="11" fill="currentColor" text-anchor="middle">blocking function runs here</text>
  <path d="M205,306 L205,338" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#tbo-arrow)"/>
  <path d="M570,338 L590,306" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#tbo-arrow)"/>
  <text x="212" y="332" font-size="10" fill="currentColor">submit</text>
  <text x="600" y="330" font-size="10" fill="currentColor">future resolves</text>
  <line x1="150" y1="378" x2="700" y2="378" stroke="currentColor" stroke-width="1" marker-end="url(#tbo-arrow)" opacity="0.6"/>

  <text x="20" y="412" font-size="12" font-weight="bold" fill="currentColor">Reading the picture</text>
  <text x="20" y="430" font-size="11" fill="currentColor">Top: the handler is 'running' but not awaiting, so the loop cannot dispatch anything else until it returns.</text>
  <text x="20" y="446" font-size="11" fill="currentColor">Bottom: the same work takes the same wall-clock time, but it happens off the loop thread.</text>
  <text x="20" y="462" font-size="11" fill="currentColor">Total time for GET /report is unchanged; what changes is how long everyone else waits.</text>
</svg>
