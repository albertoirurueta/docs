  <text x="125" y="88" text-anchor="end" font-size="12">(1) 1,200.00</text>
  <text x="133" y="148" text-anchor="middle" font-size="12" font-weight="bold">Balance 1,200.00 debit</text>
  <rect x="268" y="20" width="238" height="140" rx="10" fill="#7873f5" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="387" y="42" text-anchor="middle" font-size="13" font-weight="bold">GR/IR clearing</text>
  <line x1="278" y1="52" x2="496" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <line x1="387" y1="52" x2="387" y2="126" stroke="currentColor" stroke-width="1.5"/>
  <text x="379" y="68" text-anchor="end" font-size="11">Debit</text>
  <text x="395" y="68" text-anchor="start" font-size="11">Credit</text>
  <text x="379" y="88" text-anchor="end" font-size="12">(2) 1,200.00</text>
  <text x="395" y="88" text-anchor="start" font-size="12">(1) 1,200.00</text>
  <text x="387" y="148" text-anchor="middle" font-size="12" font-weight="bold">Balance 0.00</text>
  <rect x="522" y="20" width="238" height="140" rx="10" fill="#ff6ec4" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="641" y="42" text-anchor="middle" font-size="13" font-weight="bold">Input tax</text>
  <line x1="532" y1="52" x2="750" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <line x1="641" y1="52" x2="641" y2="126" stroke="currentColor" stroke-width="1.5"/>
  <text x="633" y="68" text-anchor="end" font-size="11">Debit</text>
  <text x="649" y="68" text-anchor="start" font-size="11">Credit</text>
  <text x="633" y="88" text-anchor="end" font-size="12">(2) 228.00</text>
  <text x="641" y="148" text-anchor="middle" font-size="12" font-weight="bold">Balance 228.00 debit</text>
  <rect x="776" y="20" width="238" height="140" rx="10" fill="#b76fe0" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="895" y="42" text-anchor="middle" font-size="13" font-weight="bold">Supplier account</text>
  <line x1="786" y1="52" x2="1004" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <line x1="895" y1="52" x2="895" y2="126" stroke="currentColor" stroke-width="1.5"/>
  <text x="887" y="68" text-anchor="end" font-size="11">Debit</text>
  <text x="903" y="68" text-anchor="start" font-size="11">Credit</text>
  <text x="887" y="88" text-anchor="end" font-size="12">(3) 1,428.00</text>
  <text x="903" y="88" text-anchor="start" font-size="12">(2) 1,428.00</text>
  <text x="895" y="148" text-anchor="middle" font-size="12" font-weight="bold">Balance 0.00</text>
  <rect x="14" y="190" width="238" height="140" rx="10" fill="#4fa3c8" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="133" y="212" text-anchor="middle" font-size="13" font-weight="bold">Bank clearing</text>
