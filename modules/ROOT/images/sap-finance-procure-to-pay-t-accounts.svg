<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">Procure-to-pay in T-accounts: goods receipt, supplier invoice, payment and bank statement for company code EX01</title>
  <desc id="d">Seven T-accounts show four postings in euro. Step 1, the goods receipt of 100 pieces at 12.00, debits Stock and credits GR/IR clearing with 1,200.00. Step 2, the supplier invoice, debits GR/IR clearing with 1,200.00 and Input tax with 228.00 and credits the supplier account with 1,428.00. Step 3, payment within the discount period, debits the supplier account with 1,428.00 and credits Bank clearing with 1,399.44 and Cash discount gain with 28.56. Step 4, the bank statement, debits Bank clearing and credits Bank with 1,399.44. At the end GR/IR clearing, the supplier account and Bank clearing are zero.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="14" y="20" width="238" height="140" rx="10" fill="#2fbf71" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="133" y="42" text-anchor="middle" font-size="13" font-weight="bold">Stock</text>
  <line x1="24" y1="52" x2="242" y2="52" stroke="currentColor" stroke-width="1.5"/>
  <line x1="133" y1="52" x2="133" y2="126" stroke="currentColor" stroke-width="1.5"/>
  <text x="125" y="68" text-anchor="end" font-size="11">Debit</text>
