  <text x="125" y="258" text-anchor="end" font-size="12">(4) 1,399.44</text>
  <text x="141" y="258" text-anchor="start" font-size="12">(3) 1,399.44</text>
  <text x="133" y="318" text-anchor="middle" font-size="12" font-weight="bold">Balance 0.00</text>
  <rect x="268" y="190" width="238" height="140" rx="10" fill="#5b9bd5" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
