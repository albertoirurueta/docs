  <line x1="278" y1="222" x2="496" y2="222" stroke="currentColor" stroke-width="1.5"/>
  <line x1="387" y1="222" x2="387" y2="296" stroke="currentColor" stroke-width="1.5"/>
  <text x="379" y="238" text-anchor="end" font-size="11">Debit</text>
  <text x="395" y="238" text-anchor="start" font-size="11">Credit</text>
  <text x="395" y="258" text-anchor="start" font-size="12">(4) 1,399.44</text>
  <text x="387" y="318" text-anchor="middle" font-size="12" font-weight="bold">Balance 1,399.44 credit</text>
  <rect x="522" y="190" width="238" height="140" rx="10" fill="#4ade80" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="641" y="212" text-anchor="middle" font-size="13" font-weight="bold">Cash discount gain</text>
  <line x1="532" y1="222" x2="750" y2="222" stroke="currentColor" stroke-width="1.5"/>
  <line x1="641" y1="222" x2="641" y2="296" stroke="currentColor" stroke-width="1.5"/>
  <text x="633" y="238" text-anchor="end" font-size="11">Debit</text>
  <text x="649" y="238" text-anchor="start" font-size="11">Credit</text>
  <text x="649" y="258" text-anchor="start" font-size="12">(3) 28.56</text>
  <text x="641" y="318" text-anchor="middle" font-size="12" font-weight="bold">Balance 28.56 credit</text>
  <rect x="776" y="190" width="238" height="140" rx="10" fill="#7873f5" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="895" y="228" text-anchor="middle" font-size="13" font-weight="bold">The four steps</text>
  <text x="895" y="246" text-anchor="middle" font-size="11">(1) goods receipt, 100 x 12.00</text>
  <text x="895" y="264" text-anchor="middle" font-size="11">(2) supplier invoice, 19 percent tax</text>
  <text x="895" y="282" text-anchor="middle" font-size="11">(3) payment, 2 percent discount</text>
  <text x="895" y="300" text-anchor="middle" font-size="11">(4) bank statement</text>
  <text x="540" y="364" text-anchor="middle" font-size="12">Each posting balances: step 1 1,200.00; step 2 1,200.00 + 228.00 = 1,428.00; step 3 1,399.44 + 28.56 = 1,428.00; step 4 1,399.44.</text>
  <text x="540" y="392" text-anchor="middle" font-size="12">All amounts are made up. Tax and discount rates are illustrative, and each line is written to ledgers 0L and 2L.</text>
</svg>
