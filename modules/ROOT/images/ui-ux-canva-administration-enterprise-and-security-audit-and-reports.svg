<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Three ways to see what happens in the organization</text>
  <!-- audit log -->
  <rect x="12" y="46" width="236" height="296" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="34" cy="68" r="11" fill="#4F46E5"/><text x="34" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="54" y="73" font-size="13" font-weight="bold" fill="#1F2937">Audit logs</text>
  <rect x="26" y="90" width="208" height="20" rx="3" fill="#EEF2FF" stroke="#9CA3AF"/>
  <g font-size="11" fill="#374151"><text x="32" y="104">Time</text><text x="76" y="104">Actor</text><text x="124" y="104">Action</text><text x="180" y="104">Impacted</text></g>
  <g fill="#FFFFFF" stroke="#D1D5DB"><rect x="26" y="114" width="208" height="20"/><rect x="26" y="136" width="208" height="20"/><rect x="26" y="158" width="208" height="20"/><rect x="26" y="180" width="208" height="20"/></g>
  <g fill="#9CA3AF"><rect x="32" y="121" width="30" height="6" rx="2"/><rect x="76" y="121" width="34" height="6" rx="2"/><rect x="124" y="121" width="42" height="6" rx="2"/><rect x="180" y="121" width="40" height="6" rx="2"/><rect x="32" y="143" width="30" height="6" rx="2"/><rect x="76" y="143" width="34" height="6" rx="2"/><rect x="124" y="143" width="42" height="6" rx="2"/><rect x="180" y="143" width="40" height="6" rx="2"/><rect x="32" y="165" width="30" height="6" rx="2"/><rect x="76" y="165" width="34" height="6" rx="2"/><rect x="124" y="165" width="42" height="6" rx="2"/><rect x="180" y="165" width="40" height="6" rx="2"/><rect x="32" y="187" width="30" height="6" rx="2"/><rect x="76" y="187" width="34" height="6" rx="2"/><rect x="124" y="187" width="42" height="6" rx="2"/><rect x="180" y="187" width="40" height="6" rx="2"/></g>
  <g font-size="12" fill="#374151"><text x="26" y="228">Logins, sharing, exports, role</text><text x="26" y="244">changes, Admin API clients</text><text x="26" y="266">Kept for 90 days</text><text x="26" y="282">CSV export, or external</text><text x="26" y="298">storage for a SIEM system</text></g>
  <text x="26" y="324" font-size="12" fill="#92400E">Does not record design edits</text>
  <!-- usage report -->
  <rect x="262" y="46" width="236" height="296" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="284" cy="68" r="11" fill="#4F46E5"/><text x="284" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="304" y="73" font-size="13" font-weight="bold" fill="#1F2937">Usage report</text>
  <g fill="#EEF2FF" stroke="#9CA3AF"><rect x="276" y="90" width="64" height="48" rx="4"/><rect x="348" y="90" width="64" height="48" rx="4"/><rect x="420" y="90" width="64" height="48" rx="4"/></g>
  <g font-size="11" fill="#374151" text-anchor="middle"><text x="308" y="110">Templates</text><text x="380" y="110">Members</text><text x="452" y="110">Brand Kits</text></g>
  <g fill="#4F46E5"><rect x="288" y="118" width="40" height="8" rx="2"/><rect x="360" y="118" width="40" height="8" rx="2"/><rect x="432" y="118" width="40" height="8" rx="2"/></g>
  <g fill="#E5E7EB" stroke="#9CA3AF"><rect x="276" y="152" width="208" height="70" rx="4"/></g>
  <g fill="#4F46E5"><rect x="292" y="190" width="18" height="24"/><rect x="320" y="176" width="18" height="38"/><rect x="348" y="184" width="18" height="30"/><rect x="376" y="164" width="18" height="50"/><rect x="404" y="178" width="18" height="36"/><rect x="432" y="170" width="18" height="44"/></g>
  <g font-size="12" fill="#374151"><text x="276" y="246">Designs created, active members,</text><text x="276" y="262">last login, Brand Kit applied</text><text x="276" y="284">Refreshes every 24 hours</text><text x="276" y="300">Filter by period, download CSV</text></g>
  <text x="276" y="324" font-size="12" fill="#92400E">Enterprise team admins and owners</text>
  <!-- domain report -->
  <rect x="512" y="46" width="236" height="296" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="534" cy="68" r="11" fill="#4F46E5"/><text x="534" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="554" y="73" font-size="13" font-weight="bold" fill="#1F2937">Domain report</text>
  <rect x="526" y="90" width="208" height="56" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/>
  <g font-size="11" fill="#374151"><text x="536" y="108">Managed accounts</text><text x="536" y="126">Unmanaged accounts</text></g>
  <rect x="650" y="98" width="72" height="8" rx="2" fill="#4F46E5"/><rect x="650" y="116" width="34" height="8" rx="2" fill="#B45309"/>
  <g font-size="12" fill="#374151"><text x="526" y="172">Users and teams on the work</text><text x="526" y="188">email domain outside the</text><text x="526" y="204">company account</text><text x="526" y="226">Location, role, activity,</text><text x="526" y="242">AI usage, design types</text></g>
  <text x="526" y="266" font-size="12" fill="#374151">Verify the domain for full data</text>
  <text x="526" y="286" font-size="12" fill="#374151">Consolidation goes through Sales</text>
  <text x="526" y="324" font-size="12" fill="#92400E">Org admins, or team admins</text>
  <text x="380" y="372" font-size="12" fill="#92400E" text-anchor="middle">Audit logs say who did what, the usage report says how much, the domain report says who is outside.</text>
  <text x="380" y="392" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
