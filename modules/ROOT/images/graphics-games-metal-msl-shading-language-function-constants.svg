<text x="285.0" y="292.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">normal map on</text>
<text x="285.0" y="306.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">wear off</text>
<line x1="425" y1="116" x2="285" y2="250" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-function-constants)"/>
