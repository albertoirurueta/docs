<text x="467.0" y="278.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Variant worn</text>
<text x="467.0" y="292.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">normal map off</text>
<text x="467.0" y="306.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">wear on</text>
