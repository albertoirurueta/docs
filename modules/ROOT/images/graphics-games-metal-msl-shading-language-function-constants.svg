<text x="649.0" y="278.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Variant full</text>
<text x="649.0" y="292.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">normal map on</text>
<text x="649.0" y="306.0" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">wear on</text>
<line x1="425" y1="116" x2="649" y2="250" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-function-constants)"/>
<rect x="20" y="350" width="720" height="70" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="374.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Cost model</text>
<text x="380.0" y="388.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A pipeline is created for each variant you use: compile only the combinations you need.</text>
<text x="380.0" y="402.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Constants you do not set are undefined: is_function_constant_defined(name) is false.</text>
