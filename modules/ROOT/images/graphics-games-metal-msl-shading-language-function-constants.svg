<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-msl-shading-language-function-constants" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Function constants: one source function, many specialised pipelines</text>
<rect x="20" y="50" width="260" height="150" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="150.0" y="79.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Shaders.metal (compiled once to AIR)</text>
<text x="150.0" y="93.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">constant bool has_normal_map</text>
<text x="150.0" y="107.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">  [[function_constant(0)]];</text>
<text x="150.0" y="121.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">constant bool has_wear</text>
<text x="150.0" y="135.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">  [[function_constant(1)]];</text>
<text x="150.0" y="149.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle"></text>
<text x="150.0" y="163.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">fragment float4 bookFragment(...)</text>
<text x="150.0" y="177.0" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">  if (has_normal_map) {...}</text>
<rect x="330" y="50" width="190" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="425.0" y="66.0" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">At pipeline creation</text>
<text x="425.0" y="79.0" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">makeFunction(name:</text>
<text x="425.0" y="92.0" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">constantValues:) or a</text>
<text x="425.0" y="105.0" font-size="10" font-weight="normal" fill="#3730A3" text-anchor="middle">specialized descriptor</text>
<line x1="280" y1="125" x2="330" y2="85" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-function-constants)"/>
<rect x="560" y="50" width="180" height="66" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="65.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Back-end compiler</text>
<text x="650.0" y="79.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">unused branches are</text>
<text x="650.0" y="93.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">removed; no runtime</text>
<text x="650.0" y="107.0" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">branch in the GPU code</text>
<line x1="520" y1="83" x2="560" y2="83" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-msl-shading-language-function-constants)"/>
