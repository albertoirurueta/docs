<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-tl-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One frame of the Bookshelf loop in six steps</text>
<rect x="20" y="55" width="225" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="38" cy="73" r="11" fill="#4F46E5"/>
<text x="38" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="132" y="105" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Wait for slot</text>
<rect x="35" y="125" width="195" height="34" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="132.5" y="145.7" text-anchor="middle" font-size="11" fill="#374151">host waits timeline</text>
<text x="132" y="183" text-anchor="middle" font-size="11" fill="#374151">value N - 2</text>
<rect x="265" y="55" width="225" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="283" cy="73" r="11" fill="#4F46E5"/>
<text x="283" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="377" y="105" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Acquire</text>
<rect x="280" y="125" width="195" height="34" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="377.5" y="145.7" text-anchor="middle" font-size="11" fill="#374151">vkAcquireNextImageKHR</text>
<text x="377" y="183" text-anchor="middle" font-size="11" fill="#374151">signals acquire sem</text>
<rect x="510" y="55" width="225" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="528" cy="73" r="11" fill="#4F46E5"/>
<text x="528" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="622" y="105" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Record</text>
<rect x="525" y="125" width="195" height="34" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="622.5" y="145.7" text-anchor="middle" font-size="11" fill="#374151">reset pool, record</text>
<text x="622" y="183" text-anchor="middle" font-size="11" fill="#374151">barrier, draw books</text>
<rect x="20" y="235" width="225" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="38" cy="253" r="11" fill="#B45309"/>
<text x="38" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="132" y="285" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Submit</text>
<rect x="35" y="305" width="195" height="34" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="132.5" y="325.7" text-anchor="middle" font-size="11" fill="#374151">vkQueueSubmit2 waits acquire</text>
<text x="132" y="363" text-anchor="middle" font-size="11" fill="#374151">signals image sem + timeline N</text>
<rect x="265" y="235" width="225" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="283" cy="253" r="11" fill="#4F46E5"/>
<text x="283" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="377" y="285" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Present</text>
<rect x="280" y="305" width="195" height="34" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="377.5" y="325.7" text-anchor="middle" font-size="11" fill="#374151">vkQueuePresentKHR</text>
<text x="377" y="363" text-anchor="middle" font-size="11" fill="#374151">waits image sem</text>
<rect x="510" y="235" width="225" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="528" cy="253" r="11" fill="#4F46E5"/>
<text x="528" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
<text x="622" y="285" text-anchor="middle" font-size="14" fill="#3730A3" font-weight="bold">Advance</text>
<rect x="525" y="305" width="195" height="34" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="622.5" y="325.7" text-anchor="middle" font-size="11" fill="#374151">frame counter + 1</text>
<text x="622" y="363" text-anchor="middle" font-size="11" fill="#374151">next slot</text>
</svg>
