<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One frame has a fixed budget: 16.67 ms at 60 fps</text>
<text x="380" y="52" text-anchor="middle" font-size="12" fill="#374151">CPU and GPU work in parallel; the frame takes as long as the slower of the two (plus waiting)</text>
<text x="122" y="100" text-anchor="end" font-size="12" fill="#374151" font-weight="bold">CPU main</text>
<rect x="130" y="80" width="107.97840431913616" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="183.9892021595681" y="99" text-anchor="middle" font-size="11" fill="#3730A3">Input+Update</text>
<rect x="237.97840431913616" y="80" width="89.98200359928013" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="282.96940611877625" y="99" text-anchor="middle" font-size="11" fill="#3730A3">Physics</text>
<rect x="327.9604079184163" y="80" width="71.9856028794241" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="363.95320935812833" y="99" text-anchor="middle" font-size="11" fill="#3730A3">Animation</text>
<rect x="399.9460107978404" y="80" width="53.98920215956808" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="426.94061187762446" y="99" text-anchor="middle" font-size="11" fill="#3730A3">LateUpdate</text>
<rect x="453.9352129574085" y="80" width="107.97840431913616" height="30" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="507.9244151169766" y="99" text-anchor="middle" font-size="11" fill="#92400E">Render submit</text>
<rect x="561.9136172765446" y="80" width="71.9856028794241" height="30" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="597.9064187162567" y="99" text-anchor="middle" font-size="11" fill="#92400E">GC spike?</text>
<text x="122" y="145" text-anchor="end" font-size="12" fill="#374151" font-weight="bold">Render</text>
<rect x="130" y="125" width="143.9712057588482" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="201.9856028794241" y="144" text-anchor="middle" font-size="11" fill="#3730A3">Culling</text>
<rect x="273.9712057588482" y="125" width="179.96400719856027" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="363.95320935812833" y="144" text-anchor="middle" font-size="11" fill="#3730A3">Batching + draw calls</text>
<rect x="453.93521295740845" y="125" width="71.9856028794241" height="30" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="489.9280143971205" y="144" text-anchor="middle" font-size="11" fill="#374151">Present</text>
<text x="122" y="190" text-anchor="end" font-size="12" fill="#374151" font-weight="bold">GPU</text>
<rect x="130" y="170" width="179.96400719856027" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="219.98200359928012" y="189" text-anchor="middle" font-size="11" fill="#3730A3">Shadows</text>
<rect x="309.96400719856024" y="170" width="233.95320935812833" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="426.9406118776244" y="189" text-anchor="middle" font-size="11" fill="#3730A3">Opaque + lights</text>
<rect x="543.9172165566886" y="170" width="89.98200359928013" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="588.9082183563287" y="189" text-anchor="middle" font-size="11" fill="#3730A3">Post-FX</text>
<rect x="633.8992201559687" y="170" width="53.98920215956808" height="30" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="660.8938212357527" y="189" text-anchor="middle" font-size="11" fill="#3730A3">UI</text>
<text x="122" y="235" text-anchor="end" font-size="12" fill="#374151" font-weight="bold">Budget</text>
<rect x="130" y="215" width="600.0" height="30" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="430.0" y="234" text-anchor="middle" font-size="11" fill="#065F46">16.67 ms at 60 fps (33.3 ms at 30, 11.1 ms at 90)</text>
<line x1="130" y1="260" x2="730" y2="260" stroke="#4B5563" stroke-width="1.2"/>
<line x1="130.0" y1="256" x2="130.0" y2="266" stroke="#4B5563" stroke-width="1.2"/>
<text x="130.0" y="280" text-anchor="middle" font-size="11" fill="#374151">0 ms</text>
<line x1="273.9712057588482" y1="256" x2="273.9712057588482" y2="266" stroke="#4B5563" stroke-width="1.2"/>
<text x="273.9712057588482" y="280" text-anchor="middle" font-size="11" fill="#374151">4 ms</text>
<line x1="417.9424115176964" y1="256" x2="417.9424115176964" y2="266" stroke="#4B5563" stroke-width="1.2"/>
<text x="417.9424115176964" y="280" text-anchor="middle" font-size="11" fill="#374151">8 ms</text>
<line x1="561.9136172765446" y1="256" x2="561.9136172765446" y2="266" stroke="#4B5563" stroke-width="1.2"/>
<text x="561.9136172765446" y="280" text-anchor="middle" font-size="11" fill="#374151">12 ms</text>
<line x1="730.0" y1="256" x2="730.0" y2="266" stroke="#4B5563" stroke-width="1.2"/>
<text x="730.0" y="280" text-anchor="middle" font-size="11" fill="#374151">16.67 ms</text>
<rect x="130" y="300" width="600" height="80" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="430" y="322" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Reading the bars</text>
<text x="430" y="343" text-anchor="middle" font-size="12" fill="#374151">CPU main longer than the budget: CPU-bound. Fewer scripts and draw calls, no GC spikes.</text>
<text x="430" y="361" text-anchor="middle" font-size="12" fill="#374151">GPU longer than the budget: GPU-bound. Lower resolution, cheaper shadows, less overdraw.</text>
</svg>
