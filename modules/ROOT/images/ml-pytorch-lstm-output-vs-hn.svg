<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d">
<title id="t">LSTM output and final states</title>
<desc id="d">A grid of four time steps and a two layer bidirectional LSTM. The output tensor holds the last layer, both directions, at every time step. The final hidden state h_n holds, for every layer and direction, the state after the last step for the forward direction and after the first step for the backward direction.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
