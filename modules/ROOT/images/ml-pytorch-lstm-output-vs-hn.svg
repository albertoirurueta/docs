<text x="325" y="200" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">time (forward runs left to right, backward runs right to left)</text>
<text x="360" y="336" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Amber: output (last layer, both directions, every step).  Teal with n: h_n (every layer, final state of each direction).</text>
