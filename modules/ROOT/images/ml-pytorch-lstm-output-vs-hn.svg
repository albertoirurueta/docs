<text x="360.0" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">What output and h_n contain (2 layers, bidirectional)</text>
<text x="20" y="98" font-size="13" fill="#0F172A" text-anchor="start" font-family="Menlo, Consolas, monospace">L2 fwd</text>
<rect x="150" y="70" width="80" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="190.0" y="95" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">t=0</text>
