<text x="370.0" y="95" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">t=2</text>
<rect x="420" y="70" width="80" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="460.0" y="95" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">t=3</text>
<circle cx="496" cy="74" r="10" fill="#0F766E"/><text x="496" y="78.5" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">n</text>
