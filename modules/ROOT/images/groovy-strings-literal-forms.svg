<svg viewBox="0 0 960 468" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="468" fill="#ffffff"/>
<text x="480" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The six Groovy string literal forms</text>
<text x="480" y="50" font-size="12" fill="#666666" text-anchor="middle">which ones interpolate ${...}, which span several lines, and what the result is</text>
<rect x="20" y="70" width="920" height="34" rx="4" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.2"/>
<text x="30" y="92" font-size="13" font-weight="bold" fill="#1c4b73">Literal form</text>
<text x="230" y="92" font-size="13" font-weight="bold" fill="#1c4b73">Delimiters</text>
<text x="370" y="92" font-size="13" font-weight="bold" fill="#1c4b73">Interpolation</text>
<text x="500" y="92" font-size="13" font-weight="bold" fill="#1c4b73">Multi-line</text>
<text x="620" y="92" font-size="13" font-weight="bold" fill="#1c4b73">Escapes via</text>
<text x="760" y="92" font-size="13" font-weight="bold" fill="#1c4b73">Result type</text>
<rect x="20" y="104" width="920" height="48" fill="#f4f4f4" stroke="#cccccc" stroke-width="0.8"/>
<text x="30" y="133" font-size="13" fill="#222222" font-weight="bold">single-quoted</text>
<text x="230" y="133" font-size="13" fill="#222222" font-weight="normal" font-family="Menlo, Consolas, monospace">'text'</text>
<text x="370" y="133" font-size="13" fill="#a35a00" font-weight="bold">no</text>
<text x="500" y="133" font-size="13" fill="#a35a00" font-weight="bold">no</text>
<text x="620" y="133" font-size="13" fill="#222222" font-weight="normal">backslash</text>
<text x="760" y="133" font-size="13" fill="#222222" font-weight="normal">String</text>
<rect x="20" y="152" width="920" height="48" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
<text x="30" y="181" font-size="13" fill="#222222" font-weight="bold">triple-single</text>
<text x="230" y="181" font-size="13" fill="#222222" font-weight="normal" font-family="Menlo, Consolas, monospace">'''text'''</text>
<text x="370" y="181" font-size="13" fill="#a35a00" font-weight="bold">no</text>
<text x="500" y="181" font-size="13" fill="#2e7d32" font-weight="bold">yes</text>
<text x="620" y="181" font-size="13" fill="#222222" font-weight="normal">backslash</text>
<text x="760" y="181" font-size="13" fill="#222222" font-weight="normal">String</text>
<rect x="20" y="200" width="920" height="48" fill="#f4f4f4" stroke="#cccccc" stroke-width="0.8"/>
<text x="30" y="229" font-size="13" fill="#222222" font-weight="bold">double-quoted</text>
<text x="230" y="229" font-size="13" fill="#222222" font-weight="normal" font-family="Menlo, Consolas, monospace">"text"</text>
<text x="370" y="229" font-size="13" fill="#2e7d32" font-weight="bold">yes</text>
<text x="500" y="229" font-size="13" fill="#a35a00" font-weight="bold">no</text>
<text x="620" y="229" font-size="13" fill="#222222" font-weight="normal">backslash</text>
<text x="760" y="229" font-size="13" fill="#222222" font-weight="normal">String or GString</text>
<rect x="20" y="248" width="920" height="48" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
<text x="30" y="277" font-size="13" fill="#222222" font-weight="bold">triple-double</text>
<text x="230" y="277" font-size="13" fill="#222222" font-weight="normal" font-family="Menlo, Consolas, monospace">"""text"""</text>
<text x="370" y="277" font-size="13" fill="#2e7d32" font-weight="bold">yes</text>
<text x="500" y="277" font-size="13" fill="#2e7d32" font-weight="bold">yes</text>
<text x="620" y="277" font-size="13" fill="#222222" font-weight="normal">backslash</text>
<text x="760" y="277" font-size="13" fill="#222222" font-weight="normal">String or GString</text>
<rect x="20" y="296" width="920" height="48" fill="#f4f4f4" stroke="#cccccc" stroke-width="0.8"/>
<text x="30" y="325" font-size="13" fill="#222222" font-weight="bold">slashy</text>
<text x="230" y="325" font-size="13" fill="#222222" font-weight="normal" font-family="Menlo, Consolas, monospace">/text/</text>
<text x="370" y="325" font-size="13" fill="#2e7d32" font-weight="bold">yes</text>
<text x="500" y="325" font-size="13" fill="#2e7d32" font-weight="bold">yes</text>
<text x="620" y="325" font-size="13" fill="#222222" font-weight="normal">only \/</text>
<text x="760" y="325" font-size="13" fill="#222222" font-weight="normal">String or GString</text>
<rect x="20" y="344" width="920" height="48" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
<text x="30" y="373" font-size="13" fill="#222222" font-weight="bold">dollar-slashy</text>
<text x="230" y="373" font-size="13" fill="#222222" font-weight="normal" font-family="Menlo, Consolas, monospace">$/text/$</text>
<text x="370" y="373" font-size="13" fill="#2e7d32" font-weight="bold">yes</text>
<text x="500" y="373" font-size="13" fill="#2e7d32" font-weight="bold">yes</text>
<text x="620" y="373" font-size="13" fill="#222222" font-weight="normal">$ escapes</text>
<text x="760" y="373" font-size="13" fill="#222222" font-weight="normal">String or GString</text>
<text x="30" y="420" font-size="12" fill="#444444">A double-quoted form without any ${...} or $name placeholder is an ordinary java.lang.String; with one it is a GString.</text>
<text x="30" y="438" font-size="12" fill="#444444">Single-character strings convert to char on demand: char c = 'a'.</text>
</svg>
