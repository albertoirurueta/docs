<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">One build, two images: what is inside each and what is not</title>
<desc id="d">Two stacks of layers built from one build stage. The PHP-FPM image tagged with the git SHA, run as uid 33, has from the bottom: the php 8.5 fpm base image, the PHP extensions Magento requires and OPcache, the ini baseline, the RDS CA bundle, the scripts mg-migrate and mg-warmup, and on top the read-only code with vendor, app/code, generated, pub/static, setup and config.php. The nginx image tagged with the git SHA and the suffix nginx, run as uid 101, has the unprivileged nginx 1.30 base image, the maintenance page, and the same pub directory and nginx.conf.sample copied from the build stage. A band at the bottom lists what is in neither image: env.php, php.ini, the nginx configuration, var and pub/media mounted at run time, and the Composer credentials, which exist only as a build secret.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker></defs>
<rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">One build stage, two images that always carry the same files</text>
<rect x="30" y="52" width="900" height="44" rx="9" fill="#7a5c3a"/>
<text x="480" y="71" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Stage build (runs once)</text>
<text x="480" y="88" font-size="11.5" fill="#f2f5f8" text-anchor="middle">composer install, setup:di:compile, setup:static-content:deploy es_ES en_GB en_US, mode production, env.php deleted</text>
<path d="M230 96 L230 126" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M730 96 L730 126" stroke="#f4b860" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="30" y="128" width="400" height="34" rx="9" fill="#3f6e9a"/><text x="230.0" y="150" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Image :&lt;git-sha&gt;  (PHP-FPM, uid 33)</text>
<rect x="530" y="128" width="400" height="34" rx="9" fill="#4d7c5a"/><text x="730.0" y="150" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Image :&lt;git-sha&gt;-nginx  (nginx, uid 101)</text>
<rect x="30" y="174" width="400" height="46" rx="8" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5"/>
<text x="230.0" y="193.5" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">Code, root-owned and read-only: vendor/, app/code, app/design,</text>
<text x="230.0" y="208.5" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">generated/, pub/static, setup/, app/etc/config.php</text>
<rect x="30" y="228" width="400" height="46" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="230.0" y="255.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">/usr/local/bin/mg-migrate and mg-warmup</text>
<rect x="30" y="282" width="400" height="46" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="230.0" y="309.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">/etc/ssl/rds/global-bundle.pem (pinned by checksum)</text>
<rect x="30" y="336" width="400" height="46" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="230.0" y="363.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">conf.d/10-pocketcoffee.ini: OPcache, no timestamp checks</text>
<rect x="30" y="390" width="400" height="46" rx="8" fill="#33485c" stroke="#3f6e9a" stroke-width="1.5"/>
<text x="230.0" y="417.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">PHP extensions of Adobe's list + OPcache</text>
<rect x="30" y="444" width="400" height="46" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="1.5"/>
<text x="230.0" y="471.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">php:8.5-fpm (Debian), www-data is uid 33</text>
<rect x="530" y="174" width="400" height="46" rx="8" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5"/>
<text x="730.0" y="193.5" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">pub/ (static files, index.php, get.php, static.php,</text>
<text x="730.0" y="208.5" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">health_check.php, errors/) and nginx.conf.sample</text>
<rect x="530" y="228" width="400" height="46" rx="8" fill="#33485c" stroke="#4d7c5a" stroke-width="1.5"/>
<text x="730.0" y="255.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">/usr/share/nginx/maintenance/maintenance.html</text>
<rect x="530" y="282" width="400" height="46" rx="8" fill="#33485c" stroke="#6f8aa3" stroke-width="1.5"/>
<text x="730.0" y="309.0" font-size="11.5" font-weight="normal" fill="#f2f5f8" text-anchor="middle">nginxinc/nginx-unprivileged:1.30-alpine</text>
<text x="730" y="352" font-size="11.5" fill="#c9b3e6" text-anchor="middle">No PHP, no vendor/, no setup/, no Composer.</text>
<text x="730" y="370" font-size="11.5" fill="#c9b3e6" text-anchor="middle">Same pub/static, same deployed_version.txt as the PHP image.</text>
<rect x="30" y="512" width="900" height="64" rx="9" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="480" y="533" font-size="12.5" font-weight="bold" fill="#f4b860" text-anchor="middle">In neither image</text>
<text x="480" y="551" font-size="11.5" fill="#f2f5f8" text-anchor="middle">env.php, php.ini, php-fpm pool and nginx conf (ConfigMaps), var/ and pub/media (emptyDir or EFS), secrets (Secrets Manager)</text>
<text x="480" y="567" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Composer credentials: a BuildKit secret that exists for one RUN command</text>
</svg>
