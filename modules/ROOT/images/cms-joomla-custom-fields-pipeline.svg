<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Joomla custom fields: from definition to the form, the database and the page</title>
  <desc id="d">Definitions in the Fields component and the field-type plugins build the edit form through the system Fields plugin. Saved values go to the fields values table. On output the system plugin loads the fields, the type plugin renders each value, the field layout wraps it and the fields layout lists all of them.</desc>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Custom fields: edit, save and render</text>

  <!-- Lane 1: definitions -->
  <text x="30" y="62" font-size="13" font-weight="bold" fill="#374151">1. Definitions (Content, Fields and Field Groups)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="72" width="200" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="130" y="94" font-weight="bold" fill="#1e3a8a">Field group</text>
    <text x="130" y="112" fill="#1f2937">tab in the edit form</text>
    <text x="130" y="128" fill="#1f2937">table fields_groups</text>
    <rect x="262" y="72" width="230" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="377" y="94" font-weight="bold" fill="#1e3a8a">Field (context + type + categories)</text>
    <text x="377" y="112" fill="#1f2937">com_content.article, list, ...</text>
    <text x="377" y="128" fill="#1f2937">tables fields, fields_categories</text>
    <rect x="524" y="72" width="200" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="624" y="94" font-weight="bold" fill="#14532d">Field-type plugin</text>
    <text x="624" y="112" fill="#1f2937">plugins/fields/{type}</text>
    <text x="624" y="128" fill="#1f2937">params/ and tmpl/ files</text>
    <rect x="756" y="72" width="174" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="843" y="94" font-weight="bold" fill="#78350f">Component</text>
    <text x="843" y="112" fill="#1f2937">implements the fields</text>
    <text x="843" y="128" fill="#1f2937">service: contexts</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M230 107 H262"/><path d="M492 107 H524"/><path d="M724 107 H756"/>
  </g>

  <!-- Lane 2: edit and save -->
  <text x="30" y="182" font-size="13" font-weight="bold" fill="#374151">2. Edit and save</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="192" width="210" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="135" y="214" font-weight="bold" fill="#4c1d95">onContentPrepareForm</text>
    <text x="135" y="232" fill="#1f2937">system Fields plugin adds</text>
    <text x="135" y="248" fill="#1f2937">the com_fields form group</text>
    <rect x="272" y="192" width="210" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="377" y="214" font-weight="bold" fill="#4c1d95">onCustomFieldsPrepareDom</text>
    <text x="377" y="232" fill="#1f2937">type plugin builds one</text>
    <text x="377" y="248" fill="#1f2937">form field per definition</text>
    <rect x="514" y="192" width="210" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="619" y="214" font-weight="bold" fill="#4c1d95">onContentAfterSave</text>
    <text x="619" y="232" fill="#1f2937">checks core.edit.value, then</text>
    <text x="619" y="248" fill="#1f2937">setFieldValue() per field</text>
    <rect x="756" y="192" width="174" height="70" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
    <text x="843" y="214" font-weight="bold" fill="#111827">fields_values</text>
    <text x="843" y="232" fill="#1f2937">field_id, item_id,</text>
    <text x="843" y="248" fill="#1f2937">value (text)</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M240 227 H272"/><path d="M482 227 H514"/><path d="M724 227 H756"/>
  </g>

  <!-- Lane 3: render -->
  <text x="30" y="302" font-size="13" font-weight="bold" fill="#374151">3. Render on the site</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="312" width="170" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="115" y="334" font-weight="bold" fill="#78350f">getFields()</text>
    <text x="115" y="352" fill="#1f2937">FieldsHelper loads fields</text>
    <text x="115" y="368" fill="#1f2937">for context and category,</text>
    <text x="115" y="384" fill="#1f2937">adds value and rawvalue</text>
    <rect x="224" y="312" width="170" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="309" y="334" font-weight="bold" fill="#14532d">tmpl/{type}.php</text>
    <text x="309" y="352" fill="#1f2937">type plugin turns the raw</text>
    <text x="309" y="368" fill="#1f2937">value into HTML (override:</text>
    <text x="309" y="384" fill="#1f2937">html/plg_fields_{type})</text>
    <rect x="418" y="312" width="170" height="80" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="503" y="334" font-weight="bold" fill="#1e3a8a">field/render.php</text>
    <text x="503" y="352" fill="#1f2937">label, prefix, suffix and</text>
    <text x="503" y="368" fill="#1f2937">CSS classes around one</text>
    <text x="503" y="384" fill="#1f2937">value (layout option)</text>
    <rect x="612" y="312" width="170" height="80" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="697" y="334" font-weight="bold" fill="#1e3a8a">fields/render.php</text>
    <text x="697" y="352" fill="#1f2937">ul.fields-container with</text>
    <text x="697" y="368" fill="#1f2937">one li per non-empty</text>
    <text x="697" y="384" fill="#1f2937">field</text>
    <rect x="806" y="312" width="124" height="80" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
    <text x="868" y="334" font-weight="bold" fill="#111827">Page</text>
    <text x="868" y="352" fill="#1f2937">after title, before</text>
    <text x="868" y="368" fill="#1f2937">or after content,</text>
    <text x="868" y="384" fill="#1f2937">or in an override</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M200 352 H224"/><path d="M394 352 H418"/><path d="M588 352 H612"/><path d="M782 352 H806"/>
  </g>
  <text x="480" y="432" text-anchor="middle" font-size="12" fill="#374151">The system Fields plugin calls getFields() from onContentAfterTitle, onContentBeforeDisplay and onContentAfterDisplay, and from onContentPrepare for $item-&gt;jcfields.</text>
  <text x="480" y="452" text-anchor="middle" font-size="12" fill="#374151">Example: Tallpine fields distance-km, elevation-gain, difficulty, gpx-file and season on com_content.article.</text>
</svg>
