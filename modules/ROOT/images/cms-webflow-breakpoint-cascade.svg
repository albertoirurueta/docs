<svg width="960" height="400" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Webflow breakpoint cascade</title>
  <desc id="d">Desktop is the base breakpoint. Styles cascade down to Tablet, Mobile landscape and Mobile portrait, and up to the optional 1280, 1440 and 1920 breakpoints.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="480" y="30" font-size="18" font-weight="700" fill="#1f2d3d">Breakpoint cascade (width increases to the right)</text>

    <!-- down cascade boxes -->
    <rect x="20" y="110" width="125" height="90" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
    <text x="82" y="140" font-size="14" font-weight="700" fill="#1f2d3d">Mobile portrait</text>
    <text x="82" y="162" font-size="12" fill="#33475b">max-width: 478px</text>
    <text x="82" y="182" font-size="12" fill="#33475b">default</text>

    <rect x="165" y="110" width="125" height="90" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
    <text x="227" y="140" font-size="14" font-weight="700" fill="#1f2d3d">Mobile landscape</text>
    <text x="227" y="162" font-size="12" fill="#33475b">max-width: 767px</text>
    <text x="227" y="182" font-size="12" fill="#33475b">default</text>

    <rect x="310" y="110" width="125" height="90" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
    <text x="372" y="140" font-size="14" font-weight="700" fill="#1f2d3d">Tablet</text>
    <text x="372" y="162" font-size="12" fill="#33475b">max-width: 991px</text>
    <text x="372" y="182" font-size="12" fill="#33475b">default</text>

    <!-- base -->
    <rect x="455" y="95" width="150" height="120" rx="8" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/>
    <text x="530" y="128" font-size="15" font-weight="700" fill="#1f2d3d">Desktop (base)</text>
    <text x="530" y="152" font-size="12" fill="#33475b">no media query</text>
    <text x="530" y="172" font-size="12" fill="#33475b">992px and up</text>
    <text x="530" y="196" font-size="12" font-weight="700" fill="#7a4b00">styles start here</text>

    <!-- up cascade boxes -->
    <rect x="625" y="110" width="95" height="90" rx="8" fill="#e6f5ec" stroke="#2f855a" stroke-width="2"/>
    <text x="672" y="140" font-size="14" font-weight="700" fill="#1f2d3d">1280</text>
    <text x="672" y="162" font-size="12" fill="#33475b">min-width</text>
    <text x="672" y="182" font-size="12" fill="#33475b">optional</text>

    <rect x="740" y="110" width="95" height="90" rx="8" fill="#e6f5ec" stroke="#2f855a" stroke-width="2"/>
    <text x="787" y="140" font-size="14" font-weight="700" fill="#1f2d3d">1440</text>
    <text x="787" y="162" font-size="12" fill="#33475b">min-width</text>
    <text x="787" y="182" font-size="12" fill="#33475b">optional</text>

    <rect x="855" y="110" width="95" height="90" rx="8" fill="#e6f5ec" stroke="#2f855a" stroke-width="2"/>
    <text x="902" y="140" font-size="14" font-weight="700" fill="#1f2d3d">1920</text>
    <text x="902" y="162" font-size="12" fill="#33475b">min-width</text>
    <text x="902" y="182" font-size="12" fill="#33475b">optional</text>

    <!-- arrows down cascade (from base leftwards) -->
    <path d="M450 255 H90" stroke="#44546a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <text x="270" y="278" font-size="13" fill="#1f2d3d">cascades down: each smaller breakpoint inherits from the next larger one</text>
    <path d="M610 255 H940" stroke="#44546a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <text x="775" y="278" font-size="13" fill="#1f2d3d">cascades up: 1280, then 1440, then 1920</text>

    <!-- override note -->
    <rect x="20" y="305" width="920" height="70" rx="8" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="480" y="332" font-size="13" fill="#1f2d3d">A value set on a breakpoint overrides the inherited value there and in every breakpoint that inherits from it.</text>
    <text x="480" y="354" font-size="13" fill="#1f2d3d">Larger breakpoints, once added to a site, cannot be removed from it.</text>
  </g>
</svg>
