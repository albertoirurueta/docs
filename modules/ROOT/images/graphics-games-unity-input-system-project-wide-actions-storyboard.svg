<text x="523" y="143" text-anchor="middle" font-size="9" fill="#92400E">Mouse Left</text>
<text x="523" y="165" text-anchor="middle" font-size="9" fill="#92400E">Gamepad West</text>
<text x="525" y="222" text-anchor="middle" font-size="10" fill="#374151">Binding: Mouse left button,</text>
<text x="525" y="236" text-anchor="middle" font-size="9" fill="#374151">Gamepad button West</text>
<line x1="592" y1="160" x2="604" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-story)"/>
<rect x="604" y="60" width="134" height="200" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="618" cy="74" r="11" fill="#4F46E5"/><text x="618" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="676" y="102" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Set the type</text>
<rect x="616" y="116" width="110" height="84" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1"/>
<rect x="624" y="132" width="90" height="16" rx="3" fill="#E5E7EB"/>
<text x="669" y="144" text-anchor="middle" font-size="10" fill="#1F2937" font-weight="bold">Button</text>
<text x="671" y="222" text-anchor="middle" font-size="10" fill="#374151">Action Type: Button;</text>
<text x="671" y="236" text-anchor="middle" font-size="9" fill="#374151">save the asset</text>
<text x="380" y="290" text-anchor="middle" font-size="11" fill="#374151">The default asset already has Move, Look, Jump and Attack in the Player map; Grab is the Bookshelf addition.</text>
<text x="380" y="310" text-anchor="middle" font-size="11" fill="#374151">The asset is named InputSystem_Actions; read the new action by name with InputSystem.actions.FindAction("Grab").</text>
<text x="380" y="340" text-anchor="middle" font-size="10" fill="#6B7280">Original schematic of the workflow; it is not a screenshot of the Unity Editor.</text>
</svg>
