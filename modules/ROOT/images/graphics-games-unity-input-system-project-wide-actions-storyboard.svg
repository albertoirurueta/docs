<text x="377" y="172" text-anchor="middle" font-size="10" fill="#1F2937">Grab</text>
<text x="379" y="222" text-anchor="middle" font-size="10" fill="#374151">In map Player: + next to</text>
<text x="379" y="236" text-anchor="middle" font-size="9" fill="#374151">Actions, name it Grab</text>
<line x1="446" y1="160" x2="458" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-story)"/>
<rect x="458" y="60" width="134" height="200" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
