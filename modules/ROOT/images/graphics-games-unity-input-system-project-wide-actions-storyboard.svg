<rect x="188" y="140" width="86" height="28" rx="6" fill="#4F46E5"/>
<text x="231" y="158" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">Create</text>
<text x="233" y="222" text-anchor="middle" font-size="10" fill="#374151">Create a new project-wide</text>
<text x="233" y="236" text-anchor="middle" font-size="9" fill="#374151">Action Asset button</text>
<line x1="300" y1="160" x2="312" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-in-story)"/>
<rect x="312" y="60" width="134" height="200" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="74" r="11" fill="#4F46E5"/><text x="326" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="384" y="102" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Add an action</text>
