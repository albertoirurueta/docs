<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Pocket Coffee WooCommerce on EKS: what a store adds to the WordPress architecture</title>
  <desc id="d">Architecture diagram of the Pocket Coffee store on Amazon EKS in eu-west-1. On the left, shoppers reach CloudFront with a web ACL and then the application load balancer, which forwards to the Deployment pocketcoffee-web, whose pods run nginx and php-fpm. A payment provider calls the store back with webhooks, and those calls bypass the cache and reach any pod through the load balancer. The elements that are new or changed for a store compared with plain WordPress are drawn in amber: the Deployment pocketcoffee-worker that runs Action Scheduler with WP-CLI and sends emails and outgoing webhooks to the mail service and to the roasting room system, the CronJob pocketcoffee-cron, and the Job pocketcoffee-migrate for database updates. All PHP workloads, which are web, worker, cron and migrate, share the same data tier on the right: Amazon RDS holding orders in the HPOS tables, the sessions table and the Action Scheduler tables, ElastiCache for Valkey holding the object cache, the S3 media bucket, and Secrets Manager.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" rx="14" fill="#2b3a4a"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">Pocket Coffee on EKS: the WordPress tiers plus what a store adds</text>

  <!-- outside -->
  <rect x="30" y="60" width="160" height="70" rx="9" fill="#3d5266"/>
  <text x="110" y="88" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Shopper</text>
  <text x="110" y="108" font-size="11.5" fill="#f2f5f8" text-anchor="middle">www.pocketcoffee.example</text>

  <rect x="30" y="170" width="160" height="80" rx="9" fill="#7a5c3a"/>
  <text x="110" y="198" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Payment provider</text>
  <text x="110" y="218" font-size="11.5" fill="#f2f5f8" text-anchor="middle">return URL, webhook</text>
  <text x="110" y="234" font-size="11.5" fill="#f2f5f8" text-anchor="middle">calls at any time</text>

  <rect x="30" y="340" width="160" height="70" rx="9" fill="#7a5c3a"/>
  <text x="110" y="368" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Roasting room</text>
  <text x="110" y="388" font-size="11.5" fill="#f2f5f8" text-anchor="middle">order.created webhook</text>

  <rect x="30" y="440" width="160" height="70" rx="9" fill="#7a5c3a"/>
  <text x="110" y="468" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Email service</text>
  <text x="110" y="488" font-size="11.5" fill="#f2f5f8" text-anchor="middle">order and shipping mail</text>

  <!-- edge -->
  <rect x="230" y="60" width="170" height="80" rx="9" fill="#3f6e9a"/>
  <text x="315" y="88" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">CloudFront + web ACL</text>
  <text x="315" y="108" font-size="11.5" fill="#f2f5f8" text-anchor="middle">caches catalog pages only;</text>
  <text x="315" y="124" font-size="11.5" fill="#f2f5f8" text-anchor="middle">cart, checkout, account bypass</text>

  <rect x="230" y="170" width="170" height="80" rx="9" fill="#3f6e9a"/>
  <text x="315" y="198" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Application load balancer</text>
  <text x="315" y="218" font-size="11.5" fill="#f2f5f8" text-anchor="middle">any healthy pod; webhooks</text>
  <text x="315" y="234" font-size="11.5" fill="#f2f5f8" text-anchor="middle">are not tied to a session</text>

  <!-- web pods -->
  <rect x="440" y="60" width="250" height="200" rx="10" fill="#33485c" stroke="#9fd3c7" stroke-width="2"/>
  <text x="565" y="84" font-size="13" font-weight="bold" fill="#9fd3c7" text-anchor="middle">Deployment pocketcoffee-web</text>
  <rect x="456" y="98" width="106" height="52" rx="8" fill="#3d5266"/>
  <text x="509" y="120" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">nginx</text>
  <text x="509" y="138" font-size="11.5" fill="#f2f5f8" text-anchor="middle">static, FastCGI</text>
  <rect x="574" y="98" width="100" height="52" rx="8" fill="#3d5266"/>
  <text x="624" y="120" font-size="12.5" font-weight="bold" fill="#f2f5f8" text-anchor="middle">php-fpm</text>
  <text x="624" y="138" font-size="11.5" fill="#f2f5f8" text-anchor="middle">WordPress + Woo</text>
  <text x="565" y="176" font-size="11.5" fill="#f2f5f8" text-anchor="middle">2 or more pods, several zones</text>
  <text x="565" y="196" font-size="11.5" fill="#f2f5f8" text-anchor="middle">cart, checkout, My Account,</text>
  <text x="565" y="212" font-size="11.5" fill="#f2f5f8" text-anchor="middle">Store API, wc-api webhooks</text>
  <text x="565" y="236" font-size="11.5" fill="#f4b860" text-anchor="middle">ASYNC RUNNER OFF, WP-CRON OFF</text>

  <!-- store additions -->
  <rect x="440" y="290" width="250" height="76" rx="10" fill="#4d7c5a" stroke="#f4b860" stroke-width="2"/>
  <text x="565" y="314" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Deployment pocketcoffee-worker</text>
  <text x="565" y="334" font-size="11.5" fill="#f2f5f8" text-anchor="middle">wp action-scheduler run: emails,</text>
  <text x="565" y="350" font-size="11.5" fill="#f2f5f8" text-anchor="middle">outgoing webhooks, stock, sync</text>

  <rect x="440" y="386" width="250" height="52" rx="10" fill="#4d7c5a" stroke="#f4b860" stroke-width="2"/>
  <text x="565" y="408" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">CronJob pocketcoffee-cron</text>
  <text x="565" y="426" font-size="11.5" fill="#f2f5f8" text-anchor="middle">wp cron event run --due-now</text>

  <rect x="440" y="458" width="250" height="52" rx="10" fill="#4d7c5a" stroke="#f4b860" stroke-width="2"/>
  <text x="565" y="480" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Job pocketcoffee-migrate</text>
  <text x="565" y="498" font-size="11.5" fill="#f2f5f8" text-anchor="middle">wp core update-db, wp wc update</text>

  <!-- data tier -->
  <rect x="740" y="60" width="190" height="120" rx="10" fill="#3f6e9a"/>
  <text x="835" y="84" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">RDS pocketcoffee-prod</text>
  <text x="835" y="106" font-size="11.5" fill="#f2f5f8" text-anchor="middle">orders (HPOS tables)</text>
  <text x="835" y="124" font-size="11.5" fill="#f2f5f8" text-anchor="middle">woocommerce_sessions</text>
  <text x="835" y="142" font-size="11.5" fill="#f2f5f8" text-anchor="middle">actionscheduler_* tables</text>
  <text x="835" y="160" font-size="11.5" fill="#f2f5f8" text-anchor="middle">reserved stock, customers</text>

  <rect x="740" y="206" width="190" height="64" rx="10" fill="#3f6e9a"/>
  <text x="835" y="232" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">ElastiCache for Valkey</text>
  <text x="835" y="252" font-size="11.5" fill="#f2f5f8" text-anchor="middle">object cache, session cache</text>

  <rect x="740" y="296" width="190" height="64" rx="10" fill="#3f6e9a"/>
  <text x="835" y="322" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">S3 pocketcoffee-prod-media</text>
  <text x="835" y="342" font-size="11.5" fill="#f2f5f8" text-anchor="middle">uploads; behind media host</text>

  <rect x="740" y="386" width="190" height="64" rx="10" fill="#3f6e9a"/>
  <text x="835" y="412" font-size="13" font-weight="bold" fill="#f2f5f8" text-anchor="middle">Secrets Manager</text>
  <text x="835" y="432" font-size="11.5" fill="#f2f5f8" text-anchor="middle">keys, salts, gateway secrets</text>

  <!-- bus -->
  <path d="M 700 130 L 712 130 L 712 484" fill="none" stroke="#f2f5f8" stroke-width="2"/>
  <path d="M 690 130 L 712 130" fill="none" stroke="#f2f5f8" stroke-width="2"/>
  <path d="M 690 328 L 712 328" fill="none" stroke="#f4b860" stroke-width="2"/>
  <path d="M 690 412 L 712 412" fill="none" stroke="#f4b860" stroke-width="2"/>
  <path d="M 690 484 L 712 484" fill="none" stroke="#f4b860" stroke-width="2"/>
  <path d="M 712 120 L 738 120" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 712 238 L 738 238" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 712 328 L 738 328" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 712 418 L 738 418" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <!-- front arrows -->
  <path d="M 190 95 L 228 95" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 315 140 L 315 168" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 190 210 L 228 210" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <path d="M 400 210 L 438 210" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 400 100 L 420 100 L 420 80 L 438 80" fill="none" stroke="#f2f5f8" stroke-width="2" marker-end="url(#a)"/>

  <!-- outgoing from worker -->
  <path d="M 440 318 L 215 318 L 215 365 L 192 365" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>
  <path d="M 440 340 L 230 340 L 230 475 L 192 475" fill="none" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>

  <!-- legend -->
  <rect x="30" y="540" width="900" height="76" rx="9" fill="#33485c"/>
  <rect x="46" y="556" width="26" height="14" rx="3" fill="#4d7c5a" stroke="#f4b860" stroke-width="2"/>
  <text x="82" y="568" font-size="12" fill="#f2f5f8">New or changed for a store: the worker is new, cron and update Jobs do more, the payment path is uncached</text>
  <rect x="46" y="580" width="26" height="14" rx="3" fill="#3f6e9a"/>
  <text x="82" y="592" font-size="12" fill="#f2f5f8">Shared state: every PHP pod and Job reads and writes the same tier</text>
  <text x="46" y="610" font-size="11.5" fill="#9fd3c7">All four workloads use one image, pocketcoffee/woocommerce:git-sha, and one chart, pocketcoffee-woocommerce.</text>
</svg>
