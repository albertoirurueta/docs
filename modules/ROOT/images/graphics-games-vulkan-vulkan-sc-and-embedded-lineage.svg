<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-sc-lineage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Vulkan SC 1.0 starts from Vulkan 1.2 and removes more than it adds</text>
<rect x="20" y="60" width="220" height="290" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="152.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Starting point</text>
<text x="130.0" y="168.0" text-anchor="middle" font-size="12" fill="#3730A3">Vulkan 1.2 API</text>
<text x="130.0" y="184.0" text-anchor="middle" font-size="12" fill="#3730A3">render passes and</text>
<text x="130.0" y="200.0" text-anchor="middle" font-size="12" fill="#3730A3">framebuffers</text>
<text x="130.0" y="216.0" text-anchor="middle" font-size="12" fill="#3730A3">pipelines and caches</text>
<text x="130.0" y="232.0" text-anchor="middle" font-size="12" fill="#3730A3">descriptor sets</text>
<text x="130.0" y="248.0" text-anchor="middle" font-size="12" fill="#3730A3">command buffers</text>
<text x="130.0" y="264.0" text-anchor="middle" font-size="12" fill="#3730A3">SPIR-V shaders</text>
<rect x="290" y="60" width="200" height="135" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="390.0" y="98.5" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Removed or tightened</text>
<text x="390.0" y="114.5" text-anchor="middle" font-size="12" fill="#92400E">sparse memory</text>
<text x="390.0" y="130.5" text-anchor="middle" font-size="12" fill="#92400E">descriptor update templates</text>
<text x="390.0" y="146.5" text-anchor="middle" font-size="12" fill="#92400E">certain object deleters</text>
<text x="390.0" y="162.5" text-anchor="middle" font-size="12" fill="#92400E">ignored parameters</text>
<rect x="290" y="215" width="200" height="135" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="390.0" y="253.5" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Added</text>
<text x="390.0" y="269.5" text-anchor="middle" font-size="12" fill="#065F46">object reservation</text>
<text x="390.0" y="285.5" text-anchor="middle" font-size="12" fill="#065F46">offline pipelines</text>
<text x="390.0" y="301.5" text-anchor="middle" font-size="12" fill="#065F46">fault reporting</text>
<text x="390.0" y="317.5" text-anchor="middle" font-size="12" fill="#065F46">memory consumption queries</text>
<rect x="540" y="60" width="200" height="290" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="640.0" y="168.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Result</text>
<text x="640.0" y="184.0" text-anchor="middle" font-size="12" fill="#374151">Vulkan SC 1.0</text>
<text x="640.0" y="200.0" text-anchor="middle" font-size="12" fill="#374151">deterministic memory</text>
<text x="640.0" y="216.0" text-anchor="middle" font-size="12" fill="#374151">deterministic timing</text>
<text x="640.0" y="232.0" text-anchor="middle" font-size="12" fill="#374151">MISRA C aligned</text>
<text x="640.0" y="248.0" text-anchor="middle" font-size="12" fill="#374151">own conformance suite</text>
<line x1="240" y1="130" x2="288" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-sc-lineage)"/>
<line x1="240" y1="285" x2="288" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-sc-lineage)"/>
<line x1="490" y1="130" x2="538" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-sc-lineage)"/>
<line x1="490" y1="285" x2="538" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-sc-lineage)"/>
<text x="380" y="378" text-anchor="middle" font-size="11" fill="#374151">Dynamic rendering and synchronization2 belong to Vulkan 1.3, so SC code keeps using render passes.</text>
</svg>
