<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">The payment provider gateway of Magento: facade, command pool and gateway command</title>
  <desc id="d">The payment method facade (Adapter) receives authorize, capture, refund or void from the sales code, looks the operation up in the command pool and executes a gateway command. A gateway command runs a request builder, a transfer factory, a client, a response validator and a response handler. The client talks to the provider over HTTPS. Value handlers supply the configuration of the method.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="10" y="40" width="150" height="80" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="85.0" y="66" text-anchor="middle" font-weight="bold">Sales code</text>
  <text x="85.0" y="84" text-anchor="middle">Order Payment</text>
  <text x="85.0" y="102" text-anchor="middle">place, capture, refund</text>
  <rect x="200" y="40" width="170" height="80" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="285.0" y="66" text-anchor="middle" font-weight="bold">Facade</text>
  <text x="285.0" y="84" text-anchor="middle">Magento\Payment\</text>
  <text x="285.0" y="102" text-anchor="middle">Model\Method\Adapter</text>
  <rect x="410" y="40" width="170" height="80" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="495.0" y="66" text-anchor="middle" font-weight="bold">Command pool</text>
  <text x="495.0" y="84" text-anchor="middle">authorize, capture,</text>
  <text x="495.0" y="102" text-anchor="middle">refund, void, vault_*</text>
  <rect x="620" y="40" width="270" height="80" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="755.0" y="66" text-anchor="middle" font-weight="bold">Provider (gateway)</text>
  <text x="755.0" y="84" text-anchor="middle">authorize, sale, capture,</text>
  <text x="755.0" y="102" text-anchor="middle">refund, void over HTTPS</text>
  <rect x="200" y="150" width="170" height="52" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="285.0" y="171" text-anchor="middle" font-weight="bold">Value handler pool</text>
  <text x="285.0" y="189" text-anchor="middle">title, can_capture, active</text>
  <rect x="10" y="230" width="880" height="130" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="22" y="250" font-weight="bold" font-size="13">Gateway command (one per operation)</text>
  <rect x="30" y="260" width="150" height="80" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="105.0" y="286" text-anchor="middle" font-weight="bold">Request builder</text>
  <text x="105.0" y="304" text-anchor="middle">BuilderComposite</text>
  <text x="105.0" y="322" text-anchor="middle">amount, token, ids</text>
  <rect x="200" y="260" width="150" height="80" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="275.0" y="286" text-anchor="middle" font-weight="bold">Transfer factory</text>
  <text x="275.0" y="304" text-anchor="middle">URL, headers,</text>
  <text x="275.0" y="322" text-anchor="middle">JSON body</text>
  <rect x="370" y="260" width="150" height="80" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="445.0" y="286" text-anchor="middle" font-weight="bold">Client</text>
  <text x="445.0" y="304" text-anchor="middle">sends the request,</text>
  <text x="445.0" y="322" text-anchor="middle">returns an array</text>
  <rect x="540" y="260" width="150" height="80" rx="12" fill="#e74c3c" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="615.0" y="286" text-anchor="middle" font-weight="bold">Response validator</text>
  <text x="615.0" y="304" text-anchor="middle">status and codes,</text>
  <text x="615.0" y="322" text-anchor="middle">error mapper</text>
  <rect x="710" y="260" width="160" height="80" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="790.0" y="286" text-anchor="middle" font-weight="bold">Response handler</text>
  <text x="790.0" y="304" text-anchor="middle">transaction id, card</text>
  <text x="790.0" y="322" text-anchor="middle">summary, vault token</text>
  <line x1="160" y1="80" x2="198" y2="80" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="80" x2="408" y2="80" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="285" y1="122" x2="285" y2="148" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="495" y1="122" x2="495" y2="228" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="180" y1="300" x2="198" y2="300" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="300" x2="368" y2="300" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="300" x2="538" y2="300" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="690" y1="300" x2="708" y2="300" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M445,260 L445,215 L760,215 L760,122" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="600" y="209" text-anchor="middle" font-size="12">HTTPS request and response</text>
  <text x="450" y="385" text-anchor="middle" font-size="12" opacity="0.85">Solid arrows: the call chain of one operation. Dashed arrows: configuration lookups and the HTTPS exchange with the provider.</text>
</svg>
