<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-unity-audio-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Setting up the Bookshelf mixer in the Editor</text>
<rect x="15" y="50" width="170" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="32" cy="67" r="11" fill="#4F46E5"/><text x="32" y="71.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<rect x="35" y="95" width="130" height="30" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="100" y="114" text-anchor="middle" font-size="11" fill="#374151">Audio Mixer window</text>
<rect x="35" y="135" width="130" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="100" y="154" text-anchor="middle" font-size="11" fill="#3730A3">Mixers panel: +</text>
<rect x="35" y="175" width="130" height="30" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="100" y="194" text-anchor="middle" font-size="11" fill="#374151">BookshelfMixer</text>
<text x="100" y="228" text-anchor="middle" font-size="10" fill="#374151">the new asset appears</text>
<text x="100" y="243" text-anchor="middle" font-size="10" fill="#374151">in the Project window</text>
<rect x="200" y="50" width="170" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="217" cy="67" r="11" fill="#4F46E5"/><text x="217" y="71.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<rect x="225" y="95" width="120" height="26" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="285" y="112" text-anchor="middle" font-size="11" fill="#92400E">Master</text>
<rect x="240" y="128" width="105" height="26" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="292" y="145" text-anchor="middle" font-size="11" fill="#3730A3">SFX</text>
<rect x="240" y="161" width="105" height="26" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="292" y="178" text-anchor="middle" font-size="11" fill="#3730A3">Ambience</text>
<rect x="240" y="194" width="105" height="26" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="292" y="211" text-anchor="middle" font-size="11" fill="#3730A3">Music</text>
<text x="285" y="243" text-anchor="middle" font-size="10" fill="#374151">Add child group on Master</text>
<rect x="385" y="50" width="170" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="402" cy="67" r="11" fill="#4F46E5"/><text x="402" y="71.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="470" y="105" text-anchor="middle" font-size="11" fill="#374151">Inspector of Music</text>
<rect x="405" y="115" width="130" height="30" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="470" y="134" text-anchor="middle" font-size="11" fill="#374151">Volume  0.0 dB</text>
<rect x="405" y="155" width="130" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="470" y="174" text-anchor="middle" font-size="10" fill="#92400E">right-click: Expose to script</text>
<text x="470" y="215" text-anchor="middle" font-size="10" fill="#374151">rename in Exposed Parameters</text>
<text x="470" y="230" text-anchor="middle" font-size="10" fill="#374151">to MusicVolume</text>
<rect x="570" y="50" width="175" height="210" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="587" cy="67" r="11" fill="#4F46E5"/><text x="587" y="71.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="657" y="105" text-anchor="middle" font-size="11" fill="#374151">Inspector of an Audio Source</text>
<rect x="590" y="115" width="135" height="30" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="657" y="134" text-anchor="middle" font-size="11" fill="#374151">Audio Generator: clip</text>
<rect x="590" y="155" width="135" height="30" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="657" y="174" text-anchor="middle" font-size="11" fill="#1F2937">Output: Music</text>
<text x="657" y="215" text-anchor="middle" font-size="10" fill="#374151">the source now routes into</text>
<text x="657" y="230" text-anchor="middle" font-size="10" fill="#374151">the Music group</text>
<line x1="185" y1="155" x2="200" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-audio-story)"/>
<line x1="370" y1="155" x2="385" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-audio-story)"/>
<line x1="555" y1="155" x2="570" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-audio-story)"/>
<text x="100" y="282" text-anchor="middle" font-size="11" fill="#374151">Create the mixer asset</text>
<text x="285" y="282" text-anchor="middle" font-size="11" fill="#374151">Add the groups</text>
<text x="470" y="282" text-anchor="middle" font-size="11" fill="#374151">Expose the volume</text>
<text x="657" y="282" text-anchor="middle" font-size="11" fill="#374151">Route the sources</text>
<text x="380" y="312" text-anchor="middle" font-size="11" fill="#374151">The exposed names are what AudioMixer.SetFloat receives at runtime.</text>
</svg>
