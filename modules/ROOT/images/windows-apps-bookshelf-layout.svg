<svg viewBox="0 0 800 480" width="800" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>
  <text x="400" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf Desktop main window: the Grid layout</text>
  <text x="400" y="45" font-size="13" fill="#666666" text-anchor="middle">Outer Grid RowDefinitions="Auto,*,Auto". Inner Grid ColumnDefinitions="1*, Auto, 300".</text>

  <!-- window frame -->
  <rect x="20" y="58" width="760" height="406" rx="10" fill="#f7f9fc" stroke="#1c4b73" stroke-width="2"/>
  <rect x="20" y="58" width="760" height="28" rx="10" fill="#1c4b73"/>
  <rect x="20" y="74" width="760" height="12" fill="#1c4b73"/>
  <text x="36" y="77" font-size="13" font-weight="bold" fill="#ffffff">Bookshelf Desktop</text>

  <!-- row 0 toolbar -->
  <rect x="32" y="96" width="736" height="44" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="46" y="123" font-size="13" font-weight="bold" fill="#222222">Row 0 (Auto): toolbar</text>
  <rect x="300" y="105" width="300" height="26" rx="4" fill="#ffffff" stroke="#666666"/>
  <text x="312" y="123" font-size="12" fill="#666666">Search title or author</text>
  <rect x="616" y="105" width="64" height="26" rx="4" fill="#ffffff" stroke="#666666"/>
  <text x="648" y="123" font-size="12" fill="#222222" text-anchor="middle">Add</text>
  <rect x="688" y="105" width="64" height="26" rx="4" fill="#ffffff" stroke="#666666"/>
  <text x="720" y="123" font-size="12" fill="#222222" text-anchor="middle">Edit</text>

  <!-- row 1 content -->
  <rect x="32" y="150" width="420" height="232" rx="6" fill="#eef7ee" stroke="#2a6a2a"/>
  <text x="46" y="172" font-size="13" font-weight="bold" fill="#2a6a2a">Row 1, Column 0 (1*)</text>
  <text x="46" y="190" font-size="12" fill="#333333">Book list: DataGrid</text>
  <rect x="46" y="200" width="392" height="22" fill="#cfe5cf" stroke="#2a6a2a"/>
  <text x="56" y="215" font-size="11" fill="#222222">Title</text>
  <text x="206" y="215" font-size="11" fill="#222222">Author</text>
  <text x="336" y="215" font-size="11" fill="#222222">Year</text>
  <rect x="46" y="222" width="392" height="22" fill="#ffffff" stroke="#9bbf9b"/>
  <rect x="46" y="244" width="392" height="22" fill="#f2f8f2" stroke="#9bbf9b"/>
  <rect x="46" y="266" width="392" height="22" fill="#ffffff" stroke="#9bbf9b"/>
  <rect x="46" y="288" width="392" height="22" fill="#f2f8f2" stroke="#9bbf9b"/>
  <text x="46" y="330" font-size="12" fill="#333333">Takes all width not claimed by the other columns,</text>
  <text x="46" y="348" font-size="12" fill="#333333">and all the height not used by rows 0 and 2.</text>

  <rect x="456" y="150" width="8" height="232" fill="#f8e9c4" stroke="#a07820"/>

  <rect x="468" y="150" width="300" height="232" rx="6" fill="#fdf8ee" stroke="#a07820"/>
  <text x="482" y="172" font-size="13" font-weight="bold" fill="#7a5a10">Row 1, Column 2 (300)</text>
  <text x="482" y="190" font-size="12" fill="#333333">Details pane: StackPanel / form Grid</text>
  <rect x="482" y="204" width="272" height="20" fill="#ffffff" stroke="#a07820"/>
  <text x="490" y="218" font-size="11" fill="#222222">Title</text>
  <rect x="482" y="230" width="272" height="20" fill="#ffffff" stroke="#a07820"/>
  <text x="490" y="244" font-size="11" fill="#222222">Author</text>
  <rect x="482" y="256" width="272" height="20" fill="#ffffff" stroke="#a07820"/>
  <text x="490" y="270" font-size="11" fill="#222222">ISBN</text>
  <text x="482" y="304" font-size="12" fill="#333333">Fixed 300 device-independent units wide.</text>
  <text x="482" y="322" font-size="12" fill="#333333">Labels share one column width through</text>
  <text x="482" y="340" font-size="12" fill="#333333">SharedSizeGroup="Labels".</text>

  <!-- row 2 status -->
  <rect x="32" y="392" width="736" height="36" rx="6" fill="#dbe8f5" stroke="#1c4b73"/>
  <text x="46" y="414" font-size="13" font-weight="bold" fill="#222222">Row 2 (Auto): status bar, full width</text>
  <text x="620" y="414" font-size="12" fill="#333333">12 books, 1 selected</text>
  <text x="400" y="452" font-size="12" fill="#7a5a10" text-anchor="middle">Column 1 (Auto) holds the thin GridSplitter between the list and the details pane.</text>
</svg>
