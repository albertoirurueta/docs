<svg viewBox="0 0 760 574" width="760" height="574" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="574" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">WPF dependency property value precedence</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">The effective value is the first source found, scanning from the top; SetCurrentValue is not in the list</text>
  <text x="40" y="78" font-size="12" font-weight="bold" fill="#333333">Highest precedence</text>
  <rect x="60" y="90" width="640" height="32" rx="6" fill="#fbe9e7" stroke="#a33a2a" stroke-width="1.5"/>
  <text x="78" y="111" font-size="14" font-weight="bold" fill="#a33a2a">1</text>
  <text x="112" y="111" font-size="13" font-weight="bold" fill="#222222">Property system coercion</text>
  <text x="690" y="111" font-size="12" fill="#333333" text-anchor="end">CoerceValueCallback, CoerceValue</text>
  <rect x="60" y="128" width="640" height="32" rx="6" fill="#fbe9e7" stroke="#a33a2a" stroke-width="1.5"/>
  <text x="78" y="149" font-size="14" font-weight="bold" fill="#a33a2a">2</text>
  <text x="112" y="149" font-size="13" font-weight="bold" fill="#222222">Active animations (or Hold behavior)</text>
  <text x="690" y="149" font-size="12" fill="#333333" text-anchor="end">Storyboard on the base value</text>
  <rect x="60" y="166" width="640" height="32" rx="6" fill="#e8f1fb" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="78" y="187" font-size="14" font-weight="bold" fill="#1c4b73">3</text>
  <text x="112" y="187" font-size="13" font-weight="bold" fill="#222222">Local value</text>
  <text x="690" y="187" font-size="12" fill="#333333" text-anchor="end">XAML attribute, SetValue, Binding, resource reference</text>
  <rect x="60" y="204" width="640" height="32" rx="6" fill="#eef7ee" stroke="#2a6a2a" stroke-width="1.5"/>
  <text x="78" y="225" font-size="14" font-weight="bold" fill="#2a6a2a">4</text>
  <text x="112" y="225" font-size="13" font-weight="bold" fill="#222222">TemplatedParent template values</text>
  <text x="690" y="225" font-size="12" fill="#333333" text-anchor="end">triggers first, then property sets</text>
  <rect x="60" y="242" width="640" height="32" rx="6" fill="#eef7ee" stroke="#2a6a2a" stroke-width="1.5"/>
  <text x="78" y="263" font-size="14" font-weight="bold" fill="#2a6a2a">5</text>
  <text x="112" y="263" font-size="13" font-weight="bold" fill="#222222">Implicit style</text>
  <text x="690" y="263" font-size="12" fill="#333333" text-anchor="end">Style property only, TargetType exact match</text>
  <rect x="60" y="280" width="640" height="32" rx="6" fill="#eef7ee" stroke="#2a6a2a" stroke-width="1.5"/>
  <text x="78" y="301" font-size="14" font-weight="bold" fill="#2a6a2a">6</text>
  <text x="112" y="301" font-size="13" font-weight="bold" fill="#222222">Style triggers</text>
  <text x="690" y="301" font-size="12" fill="#333333" text-anchor="end">explicit or implicit style</text>
  <rect x="60" y="318" width="640" height="32" rx="6" fill="#eef7ee" stroke="#2a6a2a" stroke-width="1.5"/>
  <text x="78" y="339" font-size="14" font-weight="bold" fill="#2a6a2a">7</text>
  <text x="112" y="339" font-size="13" font-weight="bold" fill="#222222">Template triggers</text>
  <text x="690" y="339" font-size="12" fill="#333333" text-anchor="end">directly applied template, or template in a style</text>
  <rect x="60" y="356" width="640" height="32" rx="6" fill="#eef7ee" stroke="#2a6a2a" stroke-width="1.5"/>
  <text x="78" y="377" font-size="14" font-weight="bold" fill="#2a6a2a">8</text>
  <text x="112" y="377" font-size="13" font-weight="bold" fill="#222222">Style setters</text>
  <text x="690" y="377" font-size="12" fill="#333333" text-anchor="end">Setter in a style</text>
  <rect x="60" y="394" width="640" height="32" rx="6" fill="#fdf8ee" stroke="#7a5a10" stroke-width="1.5"/>
  <text x="78" y="415" font-size="14" font-weight="bold" fill="#7a5a10">9</text>
  <text x="112" y="415" font-size="13" font-weight="bold" fill="#222222">Default (theme) style</text>
  <text x="690" y="415" font-size="12" fill="#333333" text-anchor="end">active triggers first, then setters</text>
  <rect x="60" y="432" width="640" height="32" rx="6" fill="#f3eefb" stroke="#5a3a8a" stroke-width="1.5"/>
  <text x="78" y="453" font-size="14" font-weight="bold" fill="#5a3a8a">10</text>
  <text x="112" y="453" font-size="13" font-weight="bold" fill="#222222">Inheritance</text>
  <text x="690" y="453" font-size="12" fill="#333333" text-anchor="end">Inherits metadata flag, parent to child</text>
  <rect x="60" y="470" width="640" height="32" rx="6" fill="#f3eefb" stroke="#5a3a8a" stroke-width="1.5"/>
  <text x="78" y="491" font-size="14" font-weight="bold" fill="#5a3a8a">11</text>
  <text x="112" y="491" font-size="13" font-weight="bold" fill="#222222">Metadata default value</text>
  <text x="690" y="491" font-size="12" fill="#333333" text-anchor="end">registered default, per-type overrides</text>
  <text x="40" y="522" font-size="12" font-weight="bold" fill="#333333">Lowest precedence</text>
  <line x1="30" y1="96" x2="30" y2="498" stroke="#666666" stroke-width="2"/>
  <polygon points="24,494 36,494 30,506" fill="#666666"/>
  <text x="380" y="544" font-size="12" fill="#666666" text-anchor="middle">Source: Microsoft Learn, Dependency property value precedence (11-step list, redrawn)</text>
</svg>
