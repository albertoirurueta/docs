<title id="monitoring-alerting-grafana-guide-g17-06-template-editor-title">New notification template group page: the field Template group name holds guide (callout 10), the Template group editor holds the definitions guide.title and guide.message (callout 11), the Refresh button of the Preview pane is marked by callout 12 and the Save button is marked by callout 13</title>
