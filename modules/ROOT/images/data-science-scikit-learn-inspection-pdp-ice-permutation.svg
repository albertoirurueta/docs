<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="int ind" font-family="Arial, Helvetica, sans-serif">
<title id="int">Partial dependence, ICE and permutation importance</title>
<desc id="ind">Left: several thin individual conditional expectation curves for different samples, with one thick curve for their average, which is the partial dependence. Right: permutation importance as the drop in score when one column is shuffled, shown as bars for three features.</desc>
<rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Two ways to inspect a fitted model</text>
<text x="24" y="62" font-size="14" font-weight="bold" fill="#0F172A">ICE lines and their average (PDP)</text>
<line x1="50" y1="300" x2="340" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="50" y1="80" x2="50" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
<text x="195" y="330" text-anchor="middle" font-size="14" fill="#475569">feature value</text>
<text x="20" y="190" text-anchor="middle" font-size="14" fill="#475569" transform="rotate(-90 20 190)">prediction</text>
<path d="M60,270 C120,262 200,200 330,120" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M60,240 C130,236 210,190 330,140" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M60,200 C140,198 230,170 330,160" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M60,290 C140,288 220,250 330,200" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M60,180 C120,180 220,176 330,104" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M60,236 C130,232 215,196 330,145" fill="none" stroke="#B45309" stroke-width="4"/>
<circle cx="102" cy="104" r="11" fill="#0F172A"/><text x="102" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="302" cy="232" r="11" fill="#0F172A"/><text x="302" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
<line x1="380" y1="80" x2="380" y2="320" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="400" y="62" font-size="14" font-weight="bold" fill="#0F172A">Permutation importance (score drop)</text>
<line x1="470" y1="300" x2="470" y2="84" stroke="#94A3B8" stroke-width="1.5"/>
<text x="460" y="124" text-anchor="end" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">bmi</text>
<rect x="470" y="104" width="170" height="30" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="460" y="194" text-anchor="end" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">bp</text>
<rect x="470" y="174" width="95" height="30" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="460" y="264" text-anchor="end" font-size="14" font-family="Menlo, Consolas, monospace" fill="#0F172A">age</text>
<rect x="470" y="244" width="8" height="30" rx="3" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<line x1="620" y1="119" x2="662" y2="119" stroke="#475569" stroke-width="2"/>
<line x1="620" y1="109" x2="620" y2="129" stroke="#475569" stroke-width="2"/>
<line x1="662" y1="109" x2="662" y2="129" stroke="#475569" stroke-width="2"/>
<text x="570" y="330" text-anchor="middle" font-size="14" fill="#475569">mean over n_repeats shuffles</text>
<circle cx="694" cy="119" r="11" fill="#0F172A"/><text x="694" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
</svg>
