<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
<title id="t">Three ways to connect scikit-learn and deep learning</title>
<desc id="d">Three rows. A wrapper row: a scikit-learn pipeline holds a skorch or Keras wrapper that trains a PyTorch or Keras model. A data row: with Array API dispatch, PyTorch tensors on a GPU are passed straight to supported scikit-learn estimators. A legacy row: SciKeras wraps Keras for older code.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="338" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Three bridges between scikit-learn and deep learning</text>
<text x="24" y="66" font-size="13" font-weight="bold" fill="#0F766E" font-family="Arial, Helvetica, sans-serif">1  Wrap the model</text>
<rect x="150" y="48" width="130" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="215" y="70" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Pipeline</text>
<rect x="320" y="48" width="170" height="34" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="405" y="70" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">skorch / keras.wrappers</text>
<rect x="530" y="48" width="160" height="34" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="610" y="70" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">nn.Module / Model</text>
<path d="M280,65 L318,65 M490,65 L528,65" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="24" y="170" font-size="13" font-weight="bold" fill="#B45309" font-family="Arial, Helvetica, sans-serif">2  Share the arrays</text>
<rect x="150" y="152" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="215" y="174" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">torch.Tensor (GPU)</text>
<rect x="320" y="152" width="170" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="405" y="174" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">array_api_dispatch</text>
<rect x="530" y="152" width="160" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="610" y="174" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">supported estimator</text>
<path d="M280,169 L318,169 M490,169 L528,169" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="24" y="274" font-size="13" font-weight="bold" fill="#BE123C" font-family="Arial, Helvetica, sans-serif">3  Legacy wrapper</text>
<rect x="150" y="256" width="130" height="34" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="215" y="278" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Pipeline</text>
<rect x="320" y="256" width="170" height="34" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2" stroke-dasharray="4 3"/><text x="405" y="278" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">SciKeras</text>
<rect x="530" y="256" width="160" height="34" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="610" y="278" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">Keras model</text>
<path d="M280,273 L318,273 M490,273 L528,273" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="150" y="108" font-size="11" fill="#475569" font-family="Arial, Helvetica, sans-serif">fit / predict / get_params; works in GridSearchCV and cross_val_score</text>
<text x="150" y="212" font-size="11" fill="#475569" font-family="Arial, Helvetica, sans-serif">no wrapper: tensors in, tensors out, on the same device</text>
<text x="150" y="316" font-size="11" fill="#475569" font-family="Arial, Helvetica, sans-serif">dashed: older code; prefer the first row for new projects</text>
</svg>
