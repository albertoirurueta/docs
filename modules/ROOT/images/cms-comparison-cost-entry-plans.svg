<text class="footer" x="24" y="606" text-anchor="start"><tspan x="24" dy="0">Source: vendor pricing pages (Webflow, Wix, WordPress.com, Ghost, Strapi, Sanity, Craft CMS); retrieved 2026-10-29. The total cost of ownership depends</tspan><tspan x="24" dy="15">on hosting, extensions and developer time; the scenario inputs are in cost.csv. Raw data: scripts/cms-comparison-charts/data/cost.csv. See the</tspan><tspan x="24" dy="15">Bibliography for the sources.</tspan></text>
