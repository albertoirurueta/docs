<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 657" width="900" height="657" role="img" aria-labelledby="cost-entry-plans-t cost-entry-plans-d">
<title id="cost-entry-plans-t">Entry price per month</title>
<desc id="cost-entry-plans-d">Cheapest paid plan of each CMS, or 0 for free software, in US dollars per month on the snapshot date, billed yearly where the vendor offers it (Sanity Growth is per seat and billed monthly). Free software still needs hosting and development, so 0 is not a total cost. Squarespace and Umbraco Cloud publish euro prices, which are not converted; Contentful pricing could not be verified and AEM is quote only (all n/a). Webflow Basic has no CMS.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}.l3{stroke:var(--s3);stroke-width:2;fill:none;stroke-dasharray:8 3 2 3;stroke-linejoin:round}.m3{fill:var(--s3);stroke:var(--s3)}.f3{fill:var(--s3)}.a3{fill:var(--s3);fill-opacity:.12;stroke:var(--s3);stroke-width:2;stroke-dasharray:8 3 2 3;}.l4{stroke:var(--s4);stroke-width:2;fill:none;stroke-dasharray:4 4;stroke-linejoin:round}.m4{fill:var(--s4);stroke:var(--s4)}.f4{fill:var(--s4)}.a4{fill:var(--s4);fill-opacity:.12;stroke:var(--s4);stroke-width:2;stroke-dasharray:4 4;}.l5{stroke:var(--s5);stroke-width:2;fill:none;stroke-dasharray:10 3;stroke-linejoin:round}.m5{fill:var(--s5);stroke:var(--s5)}.f5{fill:var(--s5)}.a5{fill:var(--s5);fill-opacity:.12;stroke:var(--s5);stroke-width:2;stroke-dasharray:10 3;}.l6{stroke:var(--s6);stroke-width:2;fill:none;stroke-dasharray:1 3;stroke-linejoin:round}.m6{fill:var(--s6);stroke:var(--s6)}.f6{fill:var(--s6)}.a6{fill:var(--s6);fill-opacity:.12;stroke:var(--s6);stroke-width:2;stroke-dasharray:1 3;}.l7{stroke:var(--s7);stroke-width:2;fill:none;stroke-dasharray:6 2 1 2;stroke-linejoin:round}.m7{fill:var(--s7);stroke:var(--s7)}.f7{fill:var(--s7)}.a7{fill:var(--s7);fill-opacity:.12;stroke:var(--s7);stroke-width:2;stroke-dasharray:6 2 1 2;}</style>
<rect width="900" height="657" fill="var(--bg)"/>
<text class="title" x="450" y="24" text-anchor="middle">Entry price per month</text>
<g transform="translate(0 44)"><g class="legend"><rect class="f0" x="74" y="-6" width="16" height="12"/><text x="100" y="4">Traditional open-source</text><rect class="f1" x="297" y="-6" width="16" height="12"/><text x="323" y="4">Hosted builders</text><rect class="f2" x="520" y="-6" width="16" height="12"/><text x="546" y="4">Headless</text><rect class="f3" x="74" y="14" width="16" height="12"/><text x="100" y="24">Enterprise and other stacks</text></g></g><line class="grid" x1="267" y1="98" x2="267" y2="540"/><text class="muted" x="267" y="558" text-anchor="middle">0</text><line class="grid" x1="454.67" y1="98" x2="454.67" y2="540"/><text class="muted" x="454.67" y="558" text-anchor="middle">50</text><line class="grid" x1="642.33" y1="98" x2="642.33" y2="540"/><text class="muted" x="642.33" y="558" text-anchor="middle">100</text><line class="grid" x1="830" y1="98" x2="830" y2="540"/><text class="muted" x="830" y="558" text-anchor="middle">150</text><path class="axis" d="M267 98V540H830"/><text x="259" y="115" text-anchor="end">WordPress.com Personal (hosted)</text><g><title>WordPress.com Personal (hosted): USD 4</title><rect class="f0" x="267" y="102" width="15.01" height="18"/><text class="muted" x="287.01" y="115">USD 4</text></g><text x="259" y="141" text-anchor="end">Drupal (free software)</text><g><title>Drupal (free software): 0 (free software)</title><rect class="f0" x="267" y="128" width="1" height="18"/><text class="muted" x="272" y="141">0 (free software)</text></g><text x="259" y="167" text-anchor="end">Joomla (free software)</text><g><title>Joomla (free software): 0 (free software)</title><rect class="f0" x="267" y="154" width="1" height="18"/><text class="muted" x="272" y="167">0 (free software)</text></g><text x="259" y="193" text-anchor="end">TYPO3 (free software)</text><g><title>TYPO3 (free software): 0 (free software)</title><rect class="f0" x="267" y="180" width="1" height="18"/><text class="muted" x="272" y="193">0 (free software)</text></g><text x="259" y="219" text-anchor="end">Craft CMS Cloud Team</text><g><title>Craft CMS Cloud Team: USD 110</title><rect class="f0" x="267" y="206" width="412.87" height="18"/><text class="muted" x="684.87" y="219">USD 110</text></g><text x="259" y="245" text-anchor="end">Webflow Basic (no CMS)</text><g><title>Webflow Basic (no CMS): USD 15</title><rect class="f1" x="267" y="232" width="56.3" height="18"/><text class="muted" x="328.3" y="245">USD 15</text></g><text x="259" y="271" text-anchor="end">Webflow Premium (with CMS)</text><g><title>Webflow Premium (with CMS): USD 25</title><rect class="f1" x="267" y="258" width="93.83" height="18"/><text class="muted" x="365.83" y="271">USD 25</text></g><text x="259" y="297" text-anchor="end">Wix Light</text><g><title>Wix Light: USD 17.77</title><rect class="f1" x="267" y="284" width="66.7" height="18"/><text class="muted" x="338.7" y="297">USD 17.77</text></g><text x="259" y="323" text-anchor="end">Squarespace Basic</text><g><title>Squarespace Basic: n/a</title><text class="na" x="273" y="323">n/a (EUR price only)</text></g><text x="259" y="349" text-anchor="end">Contentful</text><g><title>Contentful: n/a</title><text class="na" x="273" y="349">n/a (unverified)</text></g><text x="259" y="375" text-anchor="end">Strapi Cloud Starter</text><g><title>Strapi Cloud Starter: USD 29</title><rect class="f2" x="267" y="362" width="108.85" height="18"/><text class="muted" x="380.85" y="375">USD 29</text></g><text x="259" y="401" text-anchor="end">Sanity Growth (per seat, monthly)</text><g><title>Sanity Growth (per seat, monthly): USD 15</title><rect class="f2" x="267" y="388" width="56.3" height="18"/><text class="muted" x="328.3" y="401">USD 15</text></g><text x="259" y="427" text-anchor="end">Payload (free software)</text><g><title>Payload (free software): 0 (free software)</title><rect class="f2" x="267" y="414" width="1" height="18"/><text class="muted" x="272" y="427">0 (free software)</text></g><text x="259" y="453" text-anchor="end">AEM</text><g><title>AEM: n/a</title><text class="na" x="273" y="453">n/a (quote only)</text></g><text x="259" y="479" text-anchor="end">Umbraco Cloud Starter</text><g><title>Umbraco Cloud Starter: n/a</title><text class="na" x="273" y="479">n/a (EUR price only)</text></g><text x="259" y="505" text-anchor="end">Wagtail (free software)</text><g><title>Wagtail (free software): 0 (free software)</title><rect class="f3" x="267" y="492" width="1" height="18"/><text class="muted" x="272" y="505">0 (free software)</text></g><text x="259" y="531" text-anchor="end">Ghost(Pro) Starter</text><g><title>Ghost(Pro) Starter: USD 15</title><rect class="f3" x="267" y="518" width="56.3" height="18"/><text class="muted" x="328.3" y="531">USD 15</text></g><text class="axis-label" x="548.5" y="580" text-anchor="middle">USD per month, excluding hosting, apps and development</text><text class="axis-label" transform="translate(16 319) rotate(-90)" text-anchor="middle">CMS and plan</text>
