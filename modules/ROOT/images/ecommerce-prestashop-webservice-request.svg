<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Life of a Webservice request</title>
  <desc id="d">A request to /api/resource is rewritten by the web server to webservice/dispatcher.php, which reads the key and builds a WebserviceRequest. The request checks that the Webservice is enabled, authenticates the key, checks the shop, the resource and the HTTP method, runs the ObjectModel operation and renders XML or JSON. Each check can end the request with an error status and code.</desc>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">What happens to GET /api/customers?filter[email]=...</text>

  <!-- main flow row 1 -->
  <g fill="#f2f5f8">
    <rect x="30" y="60" width="170" height="86" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="42" y="84" font-size="14" font-weight="bold">Client</text>
    <text x="42" y="104" font-size="11">Basic auth, key as user</text>
    <text x="42" y="120" font-size="11">XML body for POST, PUT,</text>
    <text x="42" y="136" font-size="11">PATCH</text>

    <rect x="250" y="60" width="190" height="86" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="262" y="84" font-size="14" font-weight="bold">.htaccess rewrite</text>
    <text x="262" y="104" font-size="11" font-family="Menlo, Consolas, monospace">^api(?:/(.*))?$</text>
    <text x="262" y="122" font-size="11" font-family="Menlo, Consolas, monospace">webservice/dispatcher.php</text>
    <text x="262" y="138" font-size="11" font-family="Menlo, Consolas, monospace">?url=$1</text>

    <rect x="490" y="60" width="210" height="86" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="502" y="84" font-size="14" font-weight="bold">dispatcher.php</text>
    <text x="502" y="104" font-size="11">key = PHP_AUTH_USER or ws_key</text>
    <text x="502" y="120" font-size="11">method = ps_method or HTTP verb</text>
    <text x="502" y="136" font-size="11">class from webservice_account</text>

    <rect x="750" y="60" width="180" height="86" rx="8" fill="#34495e" stroke="#f2f5f8"/>
    <text x="762" y="84" font-size="14" font-weight="bold">WebserviceRequest</text>
    <text x="762" y="104" font-size="11">::fetch(key, method,</text>
    <text x="762" y="120" font-size="11">url, params, xml)</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M200 103 H 248"/>
    <path d="M440 103 H 488"/>
    <path d="M700 103 H 748"/>
    <path d="M840 146 V 188 H 150 V 214"/>
  </g>

  <!-- checks row 2 -->
  <g fill="#f2f5f8">
    <rect x="30" y="216" width="150" height="104" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="42" y="238" font-size="13" font-weight="bold">1. Enabled?</text>
    <text x="42" y="258" font-size="11">PS_WEBSERVICE = 1</text>
    <text x="42" y="278" font-size="11" fill="#ffd9a8">503 / code 22</text>

    <rect x="210" y="216" width="170" height="104" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="222" y="238" font-size="13" font-weight="bold">2. Authenticate</text>
    <text x="222" y="258" font-size="11">32 chars, key active,</text>
    <text x="222" y="274" font-size="11">has permissions</text>
    <text x="222" y="296" font-size="11" fill="#ffd9a8">401 / codes 17 to 21</text>

    <rect x="410" y="216" width="150" height="104" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="422" y="238" font-size="13" font-weight="bold">3. Shop</text>
    <text x="422" y="258" font-size="11">id_shop, id_group_shop</text>
    <text x="422" y="274" font-size="11">key linked to the shop</text>
    <text x="422" y="296" font-size="11" fill="#ffd9a8">403 / code 132</text>

    <rect x="590" y="216" width="160" height="104" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="602" y="238" font-size="13" font-weight="bold">4. Resource</text>
    <text x="602" y="258" font-size="11">known and allowed</text>
    <text x="602" y="274" font-size="11">for this key</text>
    <text x="602" y="296" font-size="11" fill="#ffd9a8">401 / code 26</text>

    <rect x="780" y="216" width="150" height="104" rx="8" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="792" y="238" font-size="13" font-weight="bold">5. HTTP method</text>
    <text x="792" y="258" font-size="11">allowed for the key</text>
    <text x="792" y="274" font-size="11">and the resource</text>
    <text x="792" y="296" font-size="11" fill="#ffd9a8">405 / codes 23, 25, 101</text>
  </g>
  <g fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)">
    <path d="M180 268 H 208"/>
    <path d="M380 268 H 408"/>
    <path d="M560 268 H 588"/>
    <path d="M750 268 H 778"/>
    <path d="M855 320 V 360 H 480 V 372"/>
  </g>

  <!-- execution row 3 -->
  <g fill="#f2f5f8">
    <rect x="30" y="374" width="430" height="116" rx="8" fill="#7a5c99" stroke="#f2f5f8"/>
    <text x="42" y="396" font-size="14" font-weight="bold">Execute on the ObjectModel</text>
    <text x="42" y="418" font-size="11">GET/HEAD: list (display, filter, sort, limit, language, date) or one object</text>
    <text x="42" y="436" font-size="11">POST: add   PUT: full replace   PATCH: partial update   DELETE: delete</text>
    <text x="42" y="454" font-size="11">Validation of every field (format, size, required, read-only)</text>
    <text x="42" y="474" font-size="11" fill="#ffd9a8">400 / validation codes 41, 84, 85, 93; 404 / 87; 500 / 46, 127</text>

    <rect x="500" y="374" width="430" height="116" rx="8" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="512" y="396" font-size="14" font-weight="bold">Render and answer</text>
    <text x="512" y="418" font-size="11">XML by default; JSON with output_format=JSON or the Output-Format header</text>
    <text x="512" y="436" font-size="11">Headers: PSWS-Version, Execution-Time, Content-Sha1</text>
    <text x="512" y="454" font-size="11">Local-Content-Sha1 equal to Content-Sha1: 304 Not Modified, empty body</text>
    <text x="512" y="474" font-size="11">201 Created for POST with the new object</text>
  </g>
  <path d="M460 432 H 498" fill="none" stroke="#f2f5f8" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
