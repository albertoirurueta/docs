<text x="75" y="70" font-size="12" fill="#92400E" text-anchor="middle">1 layer blur, 1 bg blur</text>
<text x="75" y="88" font-size="12" fill="#92400E" text-anchor="middle">2 noise, 1 texture</text>
<text x="75" y="106" font-size="12" fill="#92400E" text-anchor="middle">1 glass</text></g>
