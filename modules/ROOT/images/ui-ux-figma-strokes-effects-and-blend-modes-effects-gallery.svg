<svg viewBox="0 0 760 360" width="760" height="360" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs><filter id="ds" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1F2937" flood-opacity="0.35"/></filter>
