<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="sub-title sub-desc">
  <title id="sub-title">The three subsetting operators applied to a vector, a list and a data frame</title>
  <desc id="sub-desc">A three by three grid. Rows are an atomic vector, a list and a data frame; columns are the operators [, [[ and $. On the vector, x[2] returns a vector of the same type that keeps the name, x[[2]] returns the single value 10 without its name, and x$b is an error because $ is not for atomic vectors. On the list, l[2] returns a list, l[[2]] returns the element itself and l$b returns the same element by its literal name. On the data frame, df[2] returns a data frame with one column, df[[2]] returns the column as a vector and df$b returns the same column.</desc>
  <rect x="0" y="0" width="960" height="566" rx="12" fill="#f8fafc"/>
  <rect x="170" y="16" width="250" height="64" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="295" y="46" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#0f172a">x[i]</text>
  <text x="295" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">keeps the container type</text>
  <rect x="428" y="16" width="250" height="64" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="553" y="46" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#0f172a">x[[i]]</text>
  <text x="553" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">extracts one element</text>
  <rect x="686" y="16" width="250" height="64" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="811" y="46" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#0f172a">x$name</text>
  <text x="811" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">extracts one element by a literal name</text>
  <rect x="16" y="96" width="146" height="132" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="89" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Atomic vector</text>
  <text x="89" y="150" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#334155">x &lt;- c(a = 21,</text>
  <text x="89" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#334155">b = 10, c = 1)</text>
  <rect x="16" y="236" width="146" height="132" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="89" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">List</text>
  <text x="89" y="290" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#334155">l &lt;- list(a = 21,</text>
  <text x="89" y="308" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#334155">b = "ten")</text>
  <rect x="16" y="376" width="146" height="132" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="89" y="406" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Data frame</text>
  <text x="89" y="430" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#334155">df &lt;- data.frame(</text>
  <text x="89" y="448" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#334155">a = 1:2,</text>
  <text x="89" y="466" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#334155">b = c("x", "y"))</text>
  <rect x="170" y="96" width="250" height="132" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="184" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#1e3a8a">x[2]</text>
  <text x="184" y="139" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">returns</text>
  <text x="184" y="156" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a" xml:space="preserve"> b</text>
  <text x="184" y="171" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a" xml:space="preserve">10</text>
  <text x="184" y="202" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">a vector of the same type,</text>
  <text x="184" y="219" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">the name b is kept</text>
  <rect x="428" y="96" width="250" height="132" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="442" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#14532d">x[[2]]</text>
  <text x="442" y="139" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">returns</text>
  <text x="442" y="156" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14532d" xml:space="preserve">[1] 10</text>
  <text x="442" y="202" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">one value,</text>
  <text x="442" y="219" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">the name is dropped</text>
  <rect x="686" y="96" width="250" height="132" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="700" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#7f1d1d">x$b</text>
  <text x="700" y="139" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">returns</text>
  <text x="700" y="156" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#7f1d1d" xml:space="preserve">Error: $ operator is invalid</text>
  <text x="700" y="171" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#7f1d1d" xml:space="preserve">for atomic vectors</text>
  <text x="700" y="202" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">not for atomic vectors,</text>
  <text x="700" y="219" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">use [ or [[ instead</text>
  <rect x="170" y="236" width="250" height="132" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="184" y="262" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#1e3a8a">l[2]</text>
  <text x="184" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">returns</text>
  <text x="184" y="296" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a" xml:space="preserve">$b</text>
  <text x="184" y="311" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a" xml:space="preserve">[1] "ten"</text>
  <text x="184" y="342" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">a list of length 1,</text>
  <text x="184" y="359" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">the same type as l</text>
  <rect x="428" y="236" width="250" height="132" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="442" y="262" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#14532d">l[[2]]</text>
  <text x="442" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">returns</text>
  <text x="442" y="296" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14532d" xml:space="preserve">[1] "ten"</text>
  <text x="442" y="342" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">the element itself,</text>
  <text x="442" y="359" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">whatever its type</text>
  <rect x="686" y="236" width="250" height="132" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="700" y="262" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#14532d">l$b</text>
  <text x="700" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">returns</text>
  <text x="700" y="296" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14532d" xml:space="preserve">[1] "ten"</text>
  <text x="700" y="342" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">same as l[["b"]],</text>
  <text x="700" y="359" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">name written literally</text>
  <rect x="170" y="376" width="250" height="132" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="184" y="402" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#1e3a8a">df[2]</text>
  <text x="184" y="419" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">returns</text>
  <text x="184" y="436" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a" xml:space="preserve">  b</text>
  <text x="184" y="451" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a" xml:space="preserve">1 x</text>
  <text x="184" y="466" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1e3a8a" xml:space="preserve">2 y</text>
  <text x="184" y="482" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">a data frame with</text>
  <text x="184" y="499" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">one column</text>
  <rect x="428" y="376" width="250" height="132" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="442" y="402" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#14532d">df[[2]]</text>
  <text x="442" y="419" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">returns</text>
  <text x="442" y="436" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14532d" xml:space="preserve">[1] "x" "y"</text>
  <text x="442" y="482" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">the column,</text>
  <text x="442" y="499" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">as a plain vector</text>
  <rect x="686" y="376" width="250" height="132" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="700" y="402" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#14532d">df$b</text>
  <text x="700" y="419" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">returns</text>
  <text x="700" y="436" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#14532d" xml:space="preserve">[1] "x" "y"</text>
  <text x="700" y="482" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">same as df[["b"]],</text>
  <text x="700" y="499" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">name written literally</text>
  <rect x="170" y="528" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="196" y="542" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">a smaller container of the same kind</text>
  <rect x="470" y="528" width="18" height="18" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="496" y="542" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">the content, taken out of its container</text>
  <rect x="790" y="528" width="18" height="18" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="816" y="542" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">an error</text>
</svg>
