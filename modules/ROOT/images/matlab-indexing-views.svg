<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="ix-t ix-d">
  <title id="ix-t">One 4 by 4 array addressed three ways</title>
  <desc id="ix-d">Three copies of magic(4). The first labels each cell with its row and column subscripts, the second with its linear index counted down the columns, and the third highlights the cells where A is greater than 10, which is the logical mask used by A(A>10).</desc>
