<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Config hierarchy for the Engine category: later files win</text>
<rect x="130" y="56" width="600" height="56" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="110" cy="84" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="110" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="430" y="80" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Engine/Config/Base.ini and BaseEngine.ini</text>
<text x="430" y="98" text-anchor="middle" font-size="11" fill="#374151">engine defaults for every project</text>
<line x1="430" y1="112" x2="430" y2="126" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="130" y="126" width="600" height="56" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="110" cy="154" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="110" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="430" y="150" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Engine/Config/&lt;Platform&gt;/Base&lt;Platform&gt;Engine.ini</text>
<text x="430" y="168" text-anchor="middle" font-size="11" fill="#374151">engine defaults per platform</text>
<line x1="430" y1="182" x2="430" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="130" y="196" width="600" height="56" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="110" cy="224" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="110" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="430" y="220" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Project/Config/DefaultEngine.ini</text>
<text x="430" y="238" text-anchor="middle" font-size="11" fill="#374151">your project defaults: edit and commit this file</text>
<line x1="430" y1="252" x2="430" y2="266" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="130" y="266" width="600" height="56" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<circle cx="110" cy="294" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="110" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="430" y="290" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">&lt;Platform&gt;Engine.ini under Engine and under Project/Config/&lt;Platform&gt;</text>
<text x="430" y="308" text-anchor="middle" font-size="11" fill="#374151">platform overrides of the defaults</text>
<line x1="430" y1="322" x2="430" y2="336" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="130" y="336" width="600" height="56" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<circle cx="110" cy="364" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="110" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="430" y="360" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">UserEngine.ini in user app-data, Documents and Project/Config</text>
<text x="430" y="378" text-anchor="middle" font-size="11" fill="#374151">per-user overrides, last to load</text>
<line x1="50" y1="400" x2="50" y2="70" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<text x="50" y="420" text-anchor="middle" font-size="11" fill="#374151">later wins</text>
<text x="440" y="424" text-anchor="middle" font-size="11" fill="#374151">Config files that exist are loaded in this order per category (Engine, Game, Input and so on).</text>
</svg>
