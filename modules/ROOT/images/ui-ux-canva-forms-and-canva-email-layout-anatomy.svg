<svg viewBox="0 0 760 460" width="760" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Anatomy of the Bookshelf newsletter email layout</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of the Bookshelf newsletter email</text>
  <rect x="60" y="46" width="340" height="370" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <rect x="80" y="60" width="300" height="46" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="94" y="72" width="14" height="22" fill="#4F46E5"/><rect x="110" y="76" width="12" height="18" fill="#B45309"/><rect x="124" y="70" width="14" height="24" fill="#4F46E5"/>
  <text x="300" y="88" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Bookshelf</text>
  <rect x="80" y="116" width="300" height="76" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="94" y="128" width="80" height="52" fill="#E5E7EB" stroke="#9CA3AF"/>
  <text x="134" y="158" font-size="11" fill="#6B7280" text-anchor="middle">Image</text>
  <text x="280" y="146" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Book of the week</text>
  <text x="280" y="164" font-size="11" fill="#374151" text-anchor="middle">Email-safe font, 14-16 px body</text>
  <rect x="80" y="202" width="300" height="70" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="92" y="212" width="136" height="50" fill="#E5E7EB" stroke="#9CA3AF"/><rect x="232" y="212" width="136" height="50" fill="#E5E7EB" stroke="#9CA3AF"/>
  <text x="160" y="241" font-size="11" fill="#374151" text-anchor="middle">Column one</text><text x="300" y="241" font-size="11" fill="#374151" text-anchor="middle">Column two</text>
  <rect x="140" y="284" width="180" height="32" rx="16" fill="#4F46E5"/>
  <text x="230" y="305" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Read the catalogue</text>
  <rect x="80" y="330" width="300" height="72" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="130" cy="352" r="8" fill="#B45309"/><circle cx="170" cy="352" r="8" fill="#B45309"/><circle cx="210" cy="352" r="8" fill="#B45309"/>
  <text x="230" y="378" font-size="11" fill="#92400E" text-anchor="middle">Contact details, Unsubscribe placeholder</text>
  <text x="230" y="394" font-size="11" fill="#92400E" text-anchor="middle">(add the working link in your sending platform)</text>
  <circle cx="440" cy="83" r="11" fill="#4F46E5"/><text x="440" y="87" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="460" y="87" font-size="13" fill="#374151">Header block: logo and brand colours</text>
  <circle cx="440" cy="154" r="11" fill="#4F46E5"/><text x="440" y="158" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="460" y="158" font-size="13" fill="#374151">Hero image and headline</text>
  <circle cx="440" cy="237" r="11" fill="#4F46E5"/><text x="440" y="241" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="460" y="241" font-size="13" fill="#374151">Columns (stack on mobile)</text>
  <circle cx="440" cy="300" r="11" fill="#4F46E5"/><text x="440" y="304" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="460" y="304" font-size="13" fill="#374151">Button: one clear call to action</text>
  <circle cx="440" cy="366" r="11" fill="#B45309"/><text x="440" y="370" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="460" y="370" font-size="13" fill="#374151">Footer and icon block</text>
  <path d="M400,83 L426,83" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M400,154 L426,154" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M400,237 L426,237" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M400,300 L426,300" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M400,366 L426,366" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="380" y="442" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
