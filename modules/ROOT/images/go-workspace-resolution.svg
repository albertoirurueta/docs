<svg viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="440" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Workspace mode: go.work makes every use directory a main module</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">a requirement on a workspace module is answered from its directory; the other requirements are merged with Minimal Version Selection</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <!-- go.work -->
  <rect x="30" y="80" width="190" height="130" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
  <text x="125" y="102" font-size="14" font-weight="bold" fill="#7a4800" text-anchor="middle">go.work</text>
  <g font-family="Courier New, monospace" font-size="13" fill="#222222">
    <text x="46" y="128">go 1.27.2</text>
    <text x="46" y="152">use (</text>
    <text x="62" y="170">./app</text>
    <text x="62" y="188">./catalog</text>
    <text x="62" y="206">./report</text>
  </g>
  <!-- modules -->
  <g font-size="13" fill="#222222">
    <rect x="330" y="70" width="230" height="90" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
    <text x="445" y="92" font-weight="bold" text-anchor="middle" fill="#1c4b73">app  (main module)</text>
    <text x="345" y="114" font-family="Courier New, monospace" font-size="12">require dep v1.0.0</text>
    <text x="345" y="134" font-family="Courier New, monospace" font-size="12">require catalog v0.1.0</text>
    <rect x="330" y="190" width="230" height="70" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
    <text x="445" y="212" font-weight="bold" text-anchor="middle" fill="#1c4b73">report  (main module)</text>
    <text x="345" y="236" font-family="Courier New, monospace" font-size="12">require dep v1.1.0</text>
    <rect x="330" y="300" width="230" height="70" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="445" y="322" font-weight="bold" text-anchor="middle" fill="#2e7d32">catalog  (main module)</text>
    <text x="345" y="346" font-family="Courier New, monospace" font-size="12">source on disk, unpublished edits</text>
  </g>
  <!-- use arrows -->
  <line x1="220" y1="150" x2="326" y2="120" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="165" x2="326" y2="225" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="195" x2="326" y2="330" stroke="#1c4b73" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- app -> catalog local -->
  <path d="M 560 134 C 640 134 640 330 564 332" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="652" y="236" font-size="12" fill="#2e7d32">catalog v0.1.0 is answered</text>
  <text x="652" y="252" font-size="12" fill="#2e7d32">by ./catalog, not by the</text>
  <text x="652" y="268" font-size="12" fill="#2e7d32">published copy</text>
  <!-- dep MVS -->
  <rect x="690" y="70" width="220" height="90" fill="#f3e9f7" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="800" y="92" font-size="13" font-weight="bold" fill="#6a1b9a" text-anchor="middle">example.com/dep</text>
  <text x="800" y="114" font-size="12" fill="#222222" text-anchor="middle">wanted: v1.0.0 and v1.1.0</text>
  <text x="800" y="134" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">workspace build list: v1.1.0</text>
  <line x1="560" y1="104" x2="686" y2="104" stroke="#6a1b9a" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="560" y1="222" x2="760" y2="164" stroke="#6a1b9a" stroke-width="1.3" marker-end="url(#a)"/>
  <!-- sync -->
  <text x="30" y="400" font-size="12" fill="#444444">go work sync writes the build-list versions back: app's require dep v1.0.0 becomes v1.1.0.</text>
  <text x="30" y="418" font-size="12" fill="#444444">GOWORK=off ignores go.work, so each module is built alone against its own go.mod and go.sum.</text>
</svg>
