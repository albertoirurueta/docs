<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Flask layer stack</title>
  <defs>
    <marker id="fls-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">The layers under one Flask request</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">a WSGI server calls the Flask object; the Pallets libraries do the specialised work</text>

  <!-- main column -->
  <rect x="30" y="64" width="400" height="58" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="88" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Your code</text>
  <text x="230" y="107" font-size="11" fill="currentColor" text-anchor="middle">views, blueprints, models, forms, config</text>

  <rect x="30" y="142" width="400" height="58" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="230" y="166" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Extensions</text>
  <text x="230" y="185" font-size="11" fill="currentColor" text-anchor="middle">Flask-SQLAlchemy, Flask-WTF, Flask-Login ... (init_app)</text>

  <rect x="30" y="220" width="400" height="76" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="230" y="246" font-size="15" font-weight="bold" fill="currentColor" text-anchor="middle">Flask</text>
  <text x="230" y="265" font-size="11" fill="currentColor" text-anchor="middle">Flask object, config, blueprints, contexts, sessions,</text>
  <text x="230" y="281" font-size="11" fill="currentColor" text-anchor="middle">URL building, flask command, template glue</text>

  <rect x="30" y="316" width="400" height="58" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="340" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Werkzeug</text>
  <text x="230" y="359" font-size="11" fill="currentColor" text-anchor="middle">routing, Request and Response, WSGI utilities, debugger</text>

  <rect x="30" y="394" width="400" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="417" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">WSGI server (Gunicorn, Waitress, mod_wsgi ...)</text>

  <!-- arrows between layers -->
  <line x1="230" y1="394" x2="230" y2="376" stroke="currentColor" stroke-width="1.5" marker-end="url(#fls-arrow)"/>
  <line x1="230" y1="316" x2="230" y2="298" stroke="currentColor" stroke-width="1.5" marker-end="url(#fls-arrow)"/>
  <line x1="230" y1="220" x2="230" y2="202" stroke="currentColor" stroke-width="1.5" marker-end="url(#fls-arrow)"/>
  <line x1="230" y1="142" x2="230" y2="124" stroke="currentColor" stroke-width="1.5" marker-end="url(#fls-arrow)"/>

  <!-- side column -->
  <text x="575" y="82" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Used by Flask beside the stack</text>

  <rect x="470" y="96" width="210" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="575" y="119" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Jinja + MarkupSafe</text>
  <text x="575" y="136" font-size="11" fill="currentColor" text-anchor="middle">templates and autoescaping</text>

  <rect x="470" y="164" width="210" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="575" y="187" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Click</text>
  <text x="575" y="204" font-size="11" fill="currentColor" text-anchor="middle">the flask command and app.cli</text>

  <rect x="470" y="232" width="210" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="575" y="255" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">ItsDangerous</text>
  <text x="575" y="272" font-size="11" fill="currentColor" text-anchor="middle">signed session cookies</text>

  <rect x="470" y="300" width="210" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="575" y="323" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Blinker</text>
  <text x="575" y="340" font-size="11" fill="currentColor" text-anchor="middle">signals (request_started ...)</text>

  <!-- connectors from Flask to the side column -->
  <line x1="430" y1="258" x2="468" y2="122" stroke="currentColor" stroke-width="1.2" marker-end="url(#fls-arrow)"/>
  <line x1="430" y1="258" x2="468" y2="190" stroke="currentColor" stroke-width="1.2" marker-end="url(#fls-arrow)"/>
  <line x1="430" y1="258" x2="468" y2="258" stroke="currentColor" stroke-width="1.2" marker-end="url(#fls-arrow)"/>
  <line x1="430" y1="258" x2="468" y2="326" stroke="currentColor" stroke-width="1.2" marker-end="url(#fls-arrow)"/>

  <text x="575" y="384" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">Arrows in the main column show control</text>
  <text x="575" y="400" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">flowing from the server up to your code</text>
  <text x="575" y="416" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">and the response coming back down</text>
</svg>
