<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Telemetry pipeline of a Vapor service</text>
  <text x="470" y="44" font-size="12" fill="#666666" text-anchor="middle">three signals leave the process over one OTLP connection; the Collector fans them out to the backends</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <rect x="20" y="62" width="330" height="372" rx="10" fill="#fafafa" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="185" y="84" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">Vapor process</text>

  <rect x="40" y="98" width="290" height="62" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="185" y="120" font-size="13" font-weight="bold" fill="#8a6a00" text-anchor="middle">Traces: swift-distributed-tracing</text>
  <text x="185" y="138" font-size="11" fill="#222222" text-anchor="middle">TracingMiddleware, withSpan, ServiceContext</text>
  <text x="185" y="152" font-size="11" fill="#222222" text-anchor="middle">server span, internal spans, client span</text>

  <rect x="40" y="170" width="290" height="62" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="185" y="192" font-size="13" font-weight="bold" fill="#1f5f99" text-anchor="middle">Metrics: swift-metrics</text>
  <text x="185" y="210" font-size="11" fill="#222222" text-anchor="middle">http_requests_total, http_request_errors_total,</text>
  <text x="185" y="224" font-size="11" fill="#222222" text-anchor="middle">http_request_duration_seconds, your own</text>

  <rect x="40" y="242" width="290" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="185" y="264" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Logs: swift-log</text>
  <text x="185" y="282" font-size="11" fill="#222222" text-anchor="middle">req.logger, request-id metadata,</text>
  <text x="185" y="296" font-size="11" fill="#222222" text-anchor="middle">trace_id and span_id inside a span</text>

  <rect x="40" y="326" width="290" height="94" rx="8" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.5"/>
  <text x="185" y="348" font-size="13" font-weight="bold" fill="#6a3d9a" text-anchor="middle">swift-otel: OTel.bootstrap</text>
  <text x="185" y="366" font-size="11" fill="#222222" text-anchor="middle">tracer, metrics reader, log handler</text>
  <text x="185" y="380" font-size="11" fill="#222222" text-anchor="middle">batch processors, sampler, resource</text>
  <text x="185" y="394" font-size="11" fill="#222222" text-anchor="middle">service.name, service.version</text>
  <text x="185" y="408" font-size="11" fill="#222222" text-anchor="middle">run() inside a ServiceGroup</text>

  <line x1="185" y1="160" x2="185" y2="168" stroke="#444444" stroke-width="1.5"/>
  <line x1="185" y1="232" x2="185" y2="240" stroke="#444444" stroke-width="1.5"/>
  <line x1="185" y1="304" x2="185" y2="324" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>

  <line x1="330" y1="373" x2="408" y2="300" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <text x="346" y="398" font-size="11" fill="#222222">OTLP/HTTP :4318</text>
  <text x="346" y="412" font-size="11" fill="#222222">or OTLP/gRPC :4317</text>

  <rect x="410" y="170" width="190" height="190" rx="8" fill="#fff3e0" stroke="#c76a00" stroke-width="1.5"/>
  <text x="505" y="194" font-size="14" font-weight="bold" fill="#c76a00" text-anchor="middle">OpenTelemetry Collector</text>
  <text x="505" y="220" font-size="11" fill="#222222" text-anchor="middle">receivers: otlp</text>
  <text x="505" y="240" font-size="11" fill="#222222" text-anchor="middle">processors: batch,</text>
  <text x="505" y="256" font-size="11" fill="#222222" text-anchor="middle">sampling, redaction</text>
  <text x="505" y="278" font-size="11" fill="#222222" text-anchor="middle">one pipeline per signal</text>
  <text x="505" y="304" font-size="11" fill="#222222" text-anchor="middle">exporters: otlp, prometheus,</text>
  <text x="505" y="320" font-size="11" fill="#222222" text-anchor="middle">file, debug</text>
  <text x="505" y="344" font-size="11" fill="#666666" text-anchor="middle">the app knows only this endpoint</text>

  <rect x="680" y="70" width="240" height="70" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="1.5"/>
  <text x="800" y="94" font-size="14" font-weight="bold" fill="#8a6a00" text-anchor="middle">Jaeger</text>
  <text x="800" y="114" font-size="11" fill="#222222" text-anchor="middle">traces: search, waterfall,</text>
  <text x="800" y="128" font-size="11" fill="#222222" text-anchor="middle">service dependencies</text>

  <rect x="680" y="190" width="240" height="70" rx="8" fill="#e3f0fb" stroke="#1f5f99" stroke-width="1.5"/>
  <text x="800" y="214" font-size="14" font-weight="bold" fill="#1f5f99" text-anchor="middle">Prometheus</text>
  <text x="800" y="234" font-size="11" fill="#222222" text-anchor="middle">scrapes the Collector (:8889),</text>
  <text x="800" y="248" font-size="11" fill="#222222" text-anchor="middle">PromQL, alert rules</text>

  <rect x="680" y="310" width="240" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="800" y="334" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Log store</text>
  <text x="800" y="354" font-size="11" fill="#222222" text-anchor="middle">a file in the demo; Loki or a</text>
  <text x="800" y="368" font-size="11" fill="#222222" text-anchor="middle">vendor backend in production</text>

  <rect x="680" y="400" width="240" height="44" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="800" y="426" font-size="12" fill="#444444" text-anchor="middle">Grafana: reads all three stores</text>

  <line x1="600" y1="215" x2="678" y2="115" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <text x="652" y="150" font-size="11" fill="#222222" text-anchor="middle">traces</text>
  <line x1="600" y1="262" x2="678" y2="235" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <text x="640" y="236" font-size="11" fill="#222222" text-anchor="middle">metrics</text>
  <line x1="600" y1="310" x2="678" y2="340" stroke="#444444" stroke-width="2" marker-end="url(#a)"/>
  <text x="640" y="344" font-size="11" fill="#222222" text-anchor="middle">logs</text>
</svg>
