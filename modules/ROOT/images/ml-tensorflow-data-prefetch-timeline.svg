<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Prefetch overlaps data preparation and training</title>
  <desc id="d">Two timelines. Without prefetch, the input pipeline and the training step run one after the other, so each step takes the sum of both. With prefetch, preparation of the next batch overlaps the current training step, so each step takes the longer of the two.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Prefetch overlaps producer and consumer</text>
  <text x="24" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Without prefetch</text>
  <text x="24" y="100" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">pipeline</text>
  <text x="24" y="136" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">training</text>
  <rect x="100" y="84" width="110" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <rect x="210" y="120" width="110" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <rect x="320" y="84" width="110" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <rect x="430" y="120" width="110" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="155" y="101" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">load 1</text>
  <text x="265" y="137" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">step 1</text>
  <text x="375" y="101" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">load 2</text>
  <text x="485" y="137" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">step 2</text>
  <text x="560" y="116" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">step time = load + train</text>
  <text x="24" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">With prefetch(AUTOTUNE)</text>
  <text x="24" y="226" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">pipeline</text>
  <text x="24" y="262" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">training</text>
  <rect x="100" y="210" width="110" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <rect x="210" y="210" width="110" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <rect x="320" y="210" width="110" height="24" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <rect x="210" y="246" width="110" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <rect x="320" y="246" width="110" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="155" y="227" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">load 1</text>
  <text x="265" y="227" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">load 2</text>
  <text x="375" y="227" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">load 3</text>
  <text x="265" y="263" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">step 1</text>
  <text x="375" y="263" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">step 2</text>
  <text x="450" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">step time = max(load, train)</text>
  <line x1="100" y1="290" x2="690" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="700" y="283" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">time</text>
</svg>
