<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif">
  <title id="t2">Chained assignment versus a single indexer</title>
  <desc id="d2">Top row: the first indexing step returns a temporary object, so the write lands on the temporary and the frame is unchanged. Bottom row: a single loc call writes into the frame itself.</desc>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">Why chained assignment never updates the frame</text>

  <circle cx="34" cy="70" r="11" fill="#0F172A"/><text x="34" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="54" y="75" font-size="14" fill="#0F172A" font-family="Menlo, Consolas, monospace">df['foo'][mask] = 100</text>
  <rect x="30" y="95" width="110" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="85" y="126" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">df</text>
  <line x1="140" y1="120" x2="228" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="184" y="110" text-anchor="middle" font-size="12" fill="#475569">df['foo']</text>
  <rect x="230" y="95" width="170" height="50" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="315" y="117" text-anchor="middle" font-size="14" fill="#0F172A">temporary Series</text>
  <text x="315" y="135" text-anchor="middle" font-size="12" fill="#475569">behaves as a copy</text>
  <line x1="400" y1="120" x2="468" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="434" y="110" text-anchor="middle" font-size="12" fill="#475569">write</text>
  <rect x="470" y="95" width="220" height="50" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="580" y="117" text-anchor="middle" font-size="14" fill="#0F172A">lands on the temporary</text>
  <text x="580" y="135" text-anchor="middle" font-size="12" fill="#475569">df is unchanged; warning raised</text>

  <circle cx="34" cy="200" r="11" fill="#0F172A"/><text x="34" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="54" y="205" font-size="14" fill="#0F172A" font-family="Menlo, Consolas, monospace">df.loc[mask, 'foo'] = 100</text>
  <rect x="30" y="225" width="110" height="50" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="85" y="256" text-anchor="middle" font-size="16" fill="#0F172A" font-family="Menlo, Consolas, monospace">df</text>
  <line x1="140" y1="250" x2="228" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="184" y="240" text-anchor="middle" font-size="12" fill="#475569">one call</text>
  <rect x="230" y="225" width="170" height="50" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="315" y="247" text-anchor="middle" font-size="14" fill="#0F172A">rows and column</text>
  <text x="315" y="265" text-anchor="middle" font-size="12" fill="#475569">selected together</text>
  <line x1="400" y1="250" x2="468" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="434" y="240" text-anchor="middle" font-size="12" fill="#475569">write</text>
  <rect x="470" y="225" width="220" height="50" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="580" y="247" text-anchor="middle" font-size="14" fill="#0F172A">df is updated</text>
  <text x="580" y="265" text-anchor="middle" font-size="12" fill="#475569">the intended result</text>
  <text x="360" y="312" text-anchor="middle" font-size="12" fill="#475569">Every indexing result is a separate object, so a chain only edits a temporary</text>
</svg>
