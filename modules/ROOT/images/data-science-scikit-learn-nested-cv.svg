<text x="283" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">val</text>
<rect x="320" y="206" width="66" height="26" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<text x="353" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">fit</text>
<rect x="390" y="206" width="66" height="26" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<text x="423" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">fit</text>
<text x="56" y="259" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">candidate 3</text>
<rect x="180" y="240" width="66" height="26" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<text x="213" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">fit</text>
<rect x="250" y="240" width="66" height="26" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<text x="283" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">fit</text>
<rect x="320" y="240" width="66" height="26" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="353" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">val</text>
<rect x="390" y="240" width="66" height="26" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
<text x="423" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">fit</text>
<rect x="500" y="172" width="160" height="26" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="580" y="190" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">best_params_</text>
<rect x="500" y="222" width="160" height="26" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="580" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">refit on outer train</text>
<line x1="580" y1="198" x2="580" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="580" y1="248" x2="580" y2="326" stroke="#6D28D9" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="56" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Each candidate: mean of its 4 validation scores; the highest mean wins.</text>
<rect x="430" y="330" width="250" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="555" y="353" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">score once on outer test fold</text>
<text x="40" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#0F172A" text-anchor="start">Report the mean of the five outer scores.</text>
<text x="40" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">The inner winner may differ from one outer split to the next.</text>
</svg>
