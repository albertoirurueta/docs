<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
<title>Nested cross-validation</title>
<desc>An outer loop of five folds holds out one test fold at a time. Inside each outer training set an inner grid search with its own folds picks the hyper-parameters, the winner is refitted on the whole outer training set and scored once on the outer test fold.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="418" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Nested cross-validation: the search sits inside the outer loop</text>
<text x="30" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="start">outer loop</text>
<rect x="148" y="54" width="100" height="30" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="198.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">train</text>
<rect x="252" y="54" width="100" height="30" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="302.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">train</text>
<rect x="356" y="54" width="100" height="30" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="406.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">test fold</text>
<rect x="460" y="54" width="100" height="30" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="510.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">train</text>
<rect x="564" y="54" width="100" height="30" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="614.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="middle">train</text>
<text x="30" y="120" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">outer split 2</text>
<line x1="406.0" y1="86" x2="406.0" y2="128" stroke="#B45309" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="40" y="130" width="640" height="190" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="56" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="start">inner GridSearchCV on the outer training data only (4 folds)</text>
<text x="56" y="191" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">candidate 1</text>
<rect x="180" y="172" width="66" height="26" rx="4" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="213" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="middle">val</text>
