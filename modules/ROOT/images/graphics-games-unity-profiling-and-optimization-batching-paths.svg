<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Three ways URP reduces the cost of drawing 500 books</text>
<rect x="20" y="60" width="220" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="86.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">SRP Batcher</text>
<rect x="20" y="114" width="220" height="150" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130" y="140" text-anchor="middle" font-size="11" fill="#374151">Keeps material data in GPU buffers</text>
<text x="130" y="166" text-anchor="middle" font-size="11" fill="#374151">Cuts render-state changes between</text>
<text x="130" y="192" text-anchor="middle" font-size="11" fill="#374151">draw calls with the same shader variant</text>
<text x="130" y="218" text-anchor="middle" font-size="11" fill="#374151">Needs SRP Batcher-compatible shaders</text>
<text x="130" y="244" text-anchor="middle" font-size="11" fill="#374151">Toggle in the URP Asset</text>
<rect x="270" y="60" width="220" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="86.5" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">GPU Resident Drawer</text>
<rect x="270" y="114" width="220" height="150" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="380" y="140" text-anchor="middle" font-size="11" fill="#374151">Uses BatchRendererGroup to draw</text>
<text x="380" y="166" text-anchor="middle" font-size="11" fill="#374151">MeshRenderers with GPU instancing</text>
<text x="380" y="192" text-anchor="middle" font-size="11" fill="#374151">Needs Forward+ and compute shaders</text>
<text x="380" y="218" text-anchor="middle" font-size="11" fill="#374151">Opt out per object when needed</text>
<text x="380" y="244" text-anchor="middle" font-size="11" fill="#374151">Set to Instanced Drawing in the URP Asset</text>
<rect x="520" y="60" width="220" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="86.5" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Manual instancing</text>
<rect x="520" y="114" width="220" height="150" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="630" y="140" text-anchor="middle" font-size="11" fill="#374151">You supply matrices (and data)</text>
<text x="630" y="166" text-anchor="middle" font-size="11" fill="#374151">Full control, more code</text>
<text x="630" y="192" text-anchor="middle" font-size="11" fill="#374151">Shader must opt out of SRP Batcher</text>
<text x="630" y="218" text-anchor="middle" font-size="11" fill="#374151">Useful for non-GameObject data</text>
<text x="630" y="244" text-anchor="middle" font-size="11" fill="#374151">Graphics.RenderMeshInstanced</text>
<rect x="20" y="285" width="720" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="308" text-anchor="middle" font-size="12" fill="#374151">Check the result in the Frame Debugger: SRP Batcher draws are grouped as SRP Batch events,</text>
<text x="380" y="326" text-anchor="middle" font-size="12" fill="#374151">GPU Resident Drawer draws appear as Hybrid Batch Group events; fewer, larger events mean less CPU time.</text>
<text x="380" y="344" text-anchor="middle" font-size="11" fill="#6B7280">Dynamic batching is not part of this picture; it is obsolete from Unity 6.6.</text>
</svg>
