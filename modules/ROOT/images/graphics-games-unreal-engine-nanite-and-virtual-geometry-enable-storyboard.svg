<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Enabling Nanite on a Bookshelf mesh</text>
<rect x="20.0" y="50" width="171.0" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="114" y="71" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Import</text>
<text x="106" y="105" text-anchor="middle" font-size="11" fill="#374151">Drag bookshelf.glb</text>
<text x="106" y="121" text-anchor="middle" font-size="11" fill="#374151">or its FBX into the</text>
<text x="106" y="137" text-anchor="middle" font-size="11" fill="#374151">Content Browser;</text>
<text x="106" y="153" text-anchor="middle" font-size="11" fill="#374151">meshes appear as</text>
<text x="106" y="169" text-anchor="middle" font-size="11" fill="#374151">SM_Book, SM_Shelf</text>
<text x="106" y="262" text-anchor="middle" font-size="11" fill="#374151">Static Meshes</text>
<text x="106" y="276" text-anchor="middle" font-size="11" fill="#374151">created</text>
<line x1="191" y1="145" x2="203" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="203.0" y="50" width="171.0" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="219" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="219" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="296" y="71" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Open mesh</text>
<text x="288" y="105" text-anchor="middle" font-size="11" fill="#374151">Double-click SM_Book;</text>
<text x="288" y="121" text-anchor="middle" font-size="11" fill="#374151">Details panel,</text>
<text x="288" y="137" text-anchor="middle" font-size="11" fill="#374151">Nanite Settings:</text>
<text x="288" y="153" text-anchor="middle" font-size="11" fill="#374151">tick Enable Nanite</text>
<text x="288" y="169" text-anchor="middle" font-size="11" fill="#374151">Support</text>
<text x="288" y="262" text-anchor="middle" font-size="11" fill="#374151">Mesh editor</text>
<text x="288" y="276" text-anchor="middle" font-size="11" fill="#374151">Details panel</text>
<line x1="374" y1="145" x2="386" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="386.0" y="50" width="171.0" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="402" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="402" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="480" y="71" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Apply</text>
<text x="472" y="105" text-anchor="middle" font-size="11" fill="#374151">Press Apply Changes;</text>
<text x="472" y="121" text-anchor="middle" font-size="11" fill="#374151">the editor builds</text>
<text x="472" y="137" text-anchor="middle" font-size="11" fill="#374151">the cluster</text>
<text x="472" y="153" text-anchor="middle" font-size="11" fill="#374151">hierarchy and</text>
<text x="472" y="169" text-anchor="middle" font-size="11" fill="#374151">a fallback mesh</text>
<text x="472" y="262" text-anchor="middle" font-size="11" fill="#374151">Build runs once</text>
<text x="472" y="276" text-anchor="middle" font-size="11" fill="#374151">per mesh</text>
<line x1="557" y1="145" x2="569" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="569.0" y="50" width="171.0" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="585" cy="66" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="585" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="662" y="71" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Inspect</text>
<text x="654" y="105" text-anchor="middle" font-size="11" fill="#374151">Viewport menu:</text>
<text x="654" y="121" text-anchor="middle" font-size="11" fill="#374151">Nanite Visualization</text>
<text x="654" y="137" text-anchor="middle" font-size="11" fill="#374151">&gt; Clusters or</text>
<text x="654" y="153" text-anchor="middle" font-size="11" fill="#374151">Triangles to see</text>
<text x="654" y="169" text-anchor="middle" font-size="11" fill="#374151">the clusters</text>
<text x="654" y="262" text-anchor="middle" font-size="11" fill="#374151">Colour per</text>
<text x="654" y="276" text-anchor="middle" font-size="11" fill="#374151">cluster</text>
</svg>
