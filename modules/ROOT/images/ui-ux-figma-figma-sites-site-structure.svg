  <path d="M165 212 L225 212" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-dasharray="4 3"/>
  <g fill="#4F46E5"><circle cx="30" cy="70" r="11"/><circle cx="210" cy="92" r="11"/><circle cx="730" cy="145" r="11"/></g>
  <circle cx="30" cy="212" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="30" y="74">1</text><text x="210" y="96">2</text><text x="730" y="149">3</text><text x="30" y="216">4</text></g>
  <text x="380" y="404" font-size="12" fill="#374151" text-anchor="middle">1 navigation bar  2 webpages on the canvas  3 breakpoints per webpage  4 CMS feeds list and page blocks</text>
