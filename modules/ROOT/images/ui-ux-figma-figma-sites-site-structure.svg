    <rect x="446" y="214" width="140" height="44" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="516" y="240" font-size="12" fill="#374151" text-anchor="middle">Tablet 800</text>
    <rect x="600" y="214" width="98" height="44" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="649" y="240" font-size="12" fill="#374151" text-anchor="middle">Mobile 375</text>
  </g>
