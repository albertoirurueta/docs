    <rect x="230" y="280" width="480" height="82" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="242" y="298" font-size="13" font-weight="bold" fill="#92400E">Book  (CMS page template: one URL per item)</text>
    <rect x="242" y="308" width="190" height="44" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="337" y="334" font-size="12" fill="#92400E" text-anchor="middle">Desktop 1280 (primary)</text>
    <rect x="446" y="308" width="140" height="44" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="516" y="334" font-size="12" fill="#374151" text-anchor="middle">Tablet 800</text>
    <rect x="600" y="308" width="98" height="44" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="649" y="334" font-size="12" fill="#374151" text-anchor="middle">Mobile 375</text>
