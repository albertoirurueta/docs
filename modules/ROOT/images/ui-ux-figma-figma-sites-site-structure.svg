    <rect x="600" y="120" width="98" height="44" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="649" y="146" font-size="12" fill="#374151" text-anchor="middle">Mobile 375</text>
  </g>
  <g>
    <rect x="230" y="186" width="480" height="82" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
