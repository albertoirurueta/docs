    <rect x="45" y="90" width="120" height="28" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="105" y="109" text-anchor="middle">File: build, publish</text>
    <rect x="45" y="126" width="120" height="28" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="105" y="145" text-anchor="middle">Insert: blocks</text>
    <rect x="45" y="162" width="120" height="28" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="105" y="181" text-anchor="middle">Search</text>
