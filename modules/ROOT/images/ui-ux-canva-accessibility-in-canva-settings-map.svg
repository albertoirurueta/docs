<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where accessibility controls live</text>
  <rect x="24" y="48" width="350" height="300" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="386" y="48" width="350" height="300" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="199" y="72" font-size="14" font-weight="bold" fill="#4F46E5" text-anchor="middle">Account: profile, Settings, Accessibility</text>
  <text x="561" y="72" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Design: File menu</text>
  <g fill="#EEF2FF" stroke="#9CA3AF">
    <rect x="44" y="88" width="310" height="38" rx="6"/><rect x="44" y="134" width="310" height="38" rx="6"/><rect x="44" y="180" width="310" height="38" rx="6"/><rect x="44" y="226" width="310" height="38" rx="6"/><rect x="44" y="272" width="310" height="38" rx="6"/>
  </g>
  <g font-size="13" fill="#1F2937">
    <text x="58" y="112">Theme: light, dark or sync with system</text>
    <text x="58" y="158">High Color Contrast toggle</text>
    <text x="58" y="204">Captions toggle for all media</text>
    <text x="58" y="250">Autoplay videos dropdown</text>
    <text x="58" y="296">Reduce motion: on or system preference</text>
  </g>
  <text x="199" y="332" font-size="11" fill="#374151" text-anchor="middle">Also: longer on-screen messages. Applies to your account only.</text>
  <g fill="#FEF3C7" stroke="#B45309">
    <rect x="406" y="88" width="310" height="38" rx="6"/><rect x="406" y="134" width="310" height="38" rx="6"/><rect x="406" y="180" width="310" height="38" rx="6"/><rect x="406" y="226" width="310" height="38" rx="6"/><rect x="406" y="272" width="310" height="38" rx="6"/>
  </g>
  <g font-size="13" fill="#1F2937">
    <text x="420" y="112">Check design accessibility</text>
    <text x="420" y="158">Edit text semantics (desktop)</text>
    <text x="420" y="204">Show view-only captions on media</text>
    <text x="420" y="250">Reduce motion (checkmark when on)</text>
    <text x="420" y="296">Language: screen reader language</text>
  </g>
  <text x="561" y="332" font-size="11" fill="#374151" text-anchor="middle">Per design and per session. Language sits under File itself.</text>
  <text x="380" y="372" font-size="12" fill="#374151" text-anchor="middle">Menu labels and positions change as navigation is rolled out; search the Help Center for the current wording.</text>
  <text x="380" y="392" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
