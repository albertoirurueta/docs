<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>

  <defs>
    <marker id="vs-in" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6fa8"/>
    </marker>
    <marker id="vs-back" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c25a1d"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Slots: parent content projected into child outlets</text>

  <rect x="30" y="46" width="300" height="316" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="45" y="68" font-size="13" font-weight="bold" fill="#444444">Parent template</text>

  <rect x="390" y="46" width="300" height="316" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="405" y="68" font-size="13" font-weight="bold" fill="#444444">&lt;BaseLayout&gt; component</text>

  <!-- header row -->
  <rect x="44" y="82" width="272" height="40" rx="4" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.3"/>
  <text x="56" y="99" font-size="11.5" fill="#1c4b73">&lt;template #header&gt;</text>
  <text x="56" y="115" font-size="11.5" fill="#1c4b73">&lt;h1&gt;Page title&lt;/h1&gt;</text>
  <rect x="404" y="82" width="272" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="416" y="106" font-size="11.5" fill="#222222" font-family="'Courier New', monospace">&lt;slot name="header" /&gt;</text>
  <line x1="316" y1="102" x2="402" y2="102" stroke="#2f6fa8" stroke-width="2" marker-end="url(#vs-in)"/>

  <!-- default row -->
  <rect x="44" y="140" width="272" height="40" rx="4" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.3"/>
  <text x="56" y="157" font-size="11.5" fill="#1c4b73">&lt;p&gt;Main body&lt;/p&gt;</text>
  <text x="56" y="173" font-size="11.5" fill="#1c4b73">(default slot, no wrapper)</text>
  <rect x="404" y="140" width="272" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="416" y="164" font-size="11.5" fill="#222222" font-family="'Courier New', monospace">&lt;slot /&gt;</text>
  <line x1="316" y1="160" x2="402" y2="160" stroke="#2f6fa8" stroke-width="2" marker-end="url(#vs-in)"/>

  <!-- footer row -->
  <rect x="44" y="198" width="272" height="40" rx="4" fill="#e8f0fb" stroke="#2f6fa8" stroke-width="1.3"/>
  <text x="56" y="215" font-size="11.5" fill="#1c4b73">&lt;template #footer&gt;</text>
  <text x="56" y="231" font-size="11.5" fill="#1c4b73">&lt;small&gt;(c) 2026&lt;/small&gt;</text>
  <rect x="404" y="198" width="272" height="40" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="416" y="222" font-size="11.5" fill="#222222" font-family="'Courier New', monospace">&lt;slot name="footer" /&gt;</text>
  <line x1="316" y1="218" x2="402" y2="218" stroke="#2f6fa8" stroke-width="2" marker-end="url(#vs-in)"/>

  <!-- scoped row -->
  <rect x="44" y="262" width="272" height="52" rx="4" fill="#fdefe4" stroke="#c25a1d" stroke-width="1.3"/>
  <text x="56" y="280" font-size="11.5" fill="#c25a1d">&lt;template #row="{ row }"&gt;</text>
  <text x="56" y="296" font-size="11.5" fill="#c25a1d">{{ row.name }} -- {{ row.email }}</text>
  <text x="56" y="309" font-size="10" fill="#c25a1d">reads the object handed back by the child</text>
  <rect x="404" y="262" width="272" height="52" rx="4" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="416" y="284" font-size="11.5" fill="#222222" font-family="'Courier New', monospace">&lt;slot name="row"</text>
  <text x="416" y="300" font-size="11.5" fill="#222222" font-family="'Courier New', monospace">:row="item" /&gt;</text>
  <line x1="316" y1="278" x2="402" y2="278" stroke="#2f6fa8" stroke-width="2" marker-end="url(#vs-in)"/>
  <line x1="402" y1="300" x2="316" y2="300" stroke="#c25a1d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#vs-back)"/>

  <text x="360" y="342" font-size="11" fill="#c25a1d" text-anchor="middle">scoped slot: the child passes :row back up to the parent's template</text>
  <text x="360" y="380" font-size="12" fill="#444444" text-anchor="middle">Blue: parent markup projected into a named outlet.   Orange: data returned by a scoped slot.</text>
</svg>
