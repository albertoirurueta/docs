<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
  <title id="t">The three families of pandas dtypes</title>
  <desc id="d">Three columns: NumPy-backed dtypes with NaN for missing values, nullable masked dtypes with pd.NA, and PyArrow-backed dtypes with pd.NA. A bottom band lists the pandas-specific dtypes: str, category, datetime with time zone, period, interval and sparse.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="438" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Three families of dtypes</text>

  <rect x="24" y="52" width="216" height="248" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="132" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">NumPy-backed</text>
  <text x="132" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">default for numbers and dates</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="44" y="110" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/><text x="132" y="129">int64, float64</text>
    <rect x="44" y="146" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/><text x="132" y="165">bool</text>
    <rect x="44" y="182" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/><text x="132" y="201">datetime64[us]</text>
    <rect x="44" y="218" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/><text x="132" y="237">timedelta64[us]</text>
    <rect x="44" y="254" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/><text x="132" y="273">object</text>
  </g>

  <rect x="252" y="52" width="216" height="248" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="360" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Nullable (masked)</text>
  <text x="360" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">values plus a boolean mask</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="272" y="110" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="2"/><text x="360" y="129">Int64, UInt8, ...</text>
    <rect x="272" y="146" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="2"/><text x="360" y="165">Float64</text>
    <rect x="272" y="182" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="2"/><text x="360" y="201">boolean</text>
    <rect x="272" y="218" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="2"/><text x="360" y="237">string</text>
  </g>
  <text x="360" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">missing value: pd.NA</text>

  <rect x="480" y="52" width="216" height="248" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="588" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Arrow-backed</text>
  <text x="588" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">needs PyArrow, opt-in</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="500" y="110" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#6D28D9" stroke-width="2"/><text x="588" y="129">int64[pyarrow]</text>
    <rect x="500" y="146" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#6D28D9" stroke-width="2"/><text x="588" y="165">double[pyarrow]</text>
    <rect x="500" y="182" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#6D28D9" stroke-width="2"/><text x="588" y="201">string[pyarrow]</text>
    <rect x="500" y="218" width="176" height="28" rx="6" fill="#F8FAFC" stroke="#6D28D9" stroke-width="2"/><text x="588" y="237">date32[day][pyarrow]</text>
  </g>
  <text x="588" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">missing value: pd.NA</text>

  <rect x="24" y="320" width="672" height="100" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="360" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">pandas-specific dtypes</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">
    <rect x="40" y="362" width="96" height="28" rx="6" fill="#F8FAFC" stroke="#B45309" stroke-width="2"/><text x="88" y="381">str</text>
    <rect x="146" y="362" width="104" height="28" rx="6" fill="#F8FAFC" stroke="#B45309" stroke-width="2"/><text x="198" y="381">category</text>
    <rect x="260" y="362" width="172" height="28" rx="6" fill="#F8FAFC" stroke="#B45309" stroke-width="2"/><text x="346" y="381">datetime64[us, tz]</text>
    <rect x="442" y="362" width="96" height="28" rx="6" fill="#F8FAFC" stroke="#B45309" stroke-width="2"/><text x="490" y="381">period[M]</text>
    <rect x="548" y="362" width="136" height="28" rx="6" fill="#F8FAFC" stroke="#B45309" stroke-width="2"/><text x="616" y="381">interval[int64]</text>
  </g>
  <text x="360" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">plus Sparse[...] and any dtype added through the extension-array API</text>
</svg>
