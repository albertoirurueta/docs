<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-gpu-memory-hierarchy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The GPU memory hierarchy: smaller and faster at the top</text>
<rect x="110.0" y="50" width="170" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="79.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Registers</text>
<text x="400" y="80" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">private to one thread; fastest</text>
<rect x="92.0" y="112" width="206" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="141.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Shared / threadgroup memory</text>
<text x="400" y="142" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">shared inside one workgroup; managed by code</text>
<rect x="74.0" y="174" width="242" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="203.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">L1 and texture caches</text>
<text x="400" y="204" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">per core cluster; automatic</text>
<rect x="56.0" y="236" width="278" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="265.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">L2 cache</text>
<text x="400" y="266" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">shared by all cores; automatic</text>
<rect x="38.0" y="298" width="314" height="50" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="327.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Video memory (VRAM)</text>
<text x="400" y="328" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">GDDR or HBM, or the unified pool; large</text>
<rect x="20.0" y="360" width="350" height="50" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="389.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">System memory</text>
<text x="400" y="390" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">reached over PCIe, or the same pool when unified</text>
<line x1="745" y1="60" x2="745" y2="390" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gpu-memory-hierarchy)"/>
<text x="735" y="60" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="end">faster, smaller</text>
<text x="735" y="402" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="end">slower, larger</text>
</svg>
