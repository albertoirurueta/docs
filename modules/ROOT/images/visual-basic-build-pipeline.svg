<svg viewBox="0 0 960 610" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From Visual Basic source to a running program: dotnet build and dotnet run</title>
  <desc id="d">MSBuild reads the .vbproj file and the .vb sources, restores packages and runs the Roslyn Visual Basic compiler against the reference assemblies and Microsoft.VisualBasic.Core. The output is an IL assembly with a PDB, an apphost and runtimeconfig files. The dotnet host then starts the .NET runtime, which JIT-compiles the IL to native code and calls Main.</desc>
  <rect x="0" y="0" width="960" height="610" fill="#ffffff"/>
  <text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From Visual Basic source to a running program</text>
  <text x="480" y="46" font-size="12" fill="#666666" text-anchor="middle">dotnet build compiles to IL once; dotnet run (or the apphost) starts the runtime, which compiles IL to native code as methods are first called</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
  </defs>

  <text x="24" y="78" font-size="13" font-weight="bold" fill="#1c4b73">1. Inputs</text>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="24" y="90" width="210" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="129" y="114" font-weight="bold">.vb source files</text>
    <text x="129" y="132" font-size="11">Program.vb, Domain.vb, ...</text>
    <text x="129" y="147" font-size="11">Option Strict On at the top,</text>
    <text x="129" y="162" font-size="11">or OptionStrict in the project</text>

    <rect x="252" y="90" width="210" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="357" y="114" font-weight="bold">.vbproj and props files</text>
    <text x="357" y="132" font-size="11">TargetFramework, OutputType,</text>
    <text x="357" y="147" font-size="11">LangVersion, Option*, RootNamespace,</text>
    <text x="357" y="162" font-size="11">Directory.Build.props</text>

    <rect x="480" y="90" width="226" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="593" y="114" font-weight="bold">Referenced assemblies</text>
    <text x="593" y="132" font-size="11">reference pack for net10.0, NuGet</text>
    <text x="593" y="147" font-size="11">packages, project references</text>
    <text x="593" y="162" font-size="11">(restored by NuGet first)</text>

    <rect x="724" y="90" width="212" height="82" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="830" y="114" font-weight="bold">Microsoft.VisualBasic.Core</text>
    <text x="830" y="132" font-size="11">Left, Mid, CInt, Like, Format, ...</text>
    <text x="830" y="147" font-size="11">referenced automatically</text>
    <text x="830" y="162" font-size="11">by the SDK</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="129" y1="172" x2="129" y2="204"/>
    <line x1="357" y1="172" x2="357" y2="204"/>
    <line x1="593" y1="172" x2="593" y2="204"/>
    <line x1="830" y1="172" x2="830" y2="204"/>
  </g>

  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="24" y="206" width="912" height="44" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="480" y="225" font-weight="bold">2. Build (dotnet build): MSBuild</text>
    <text x="480" y="241" font-size="11">evaluates the project, restores NuGet packages, then calls the Vbc task, which runs the Roslyn Visual Basic compiler</text>

    <rect x="24" y="274" width="912" height="74" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="480" y="294" font-weight="bold">Roslyn Visual Basic compiler (vbc)</text>
    <text x="480" y="312" font-size="11">parse (case-insensitive, line-oriented) and bind names and types, applying Option Explicit, Strict, Infer and Compare, the global imports and My</text>
    <text x="480" y="328" font-size="11">report BC errors and warnings, stop on errors (or on warnings when TreatWarningsAsErrors is set), otherwise emit IL, metadata and PDB</text>
  </g>
  <line x1="480" y1="250" x2="480" y2="272" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="480" y1="348" x2="480" y2="372" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="24" y="374" width="912" height="104" fill="none" stroke="#2e7d32" stroke-dasharray="5 3"/>
  <text x="36" y="392" font-size="13" font-weight="bold" fill="#2e7d32">3. Output in bin/Debug/net10.0</text>
  <g font-size="13" fill="#222222" text-anchor="middle">
    <rect x="36" y="402" width="196" height="66" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="134" y="424" font-weight="bold">Shelf.Cli.dll</text>
    <text x="134" y="441" font-size="11">IL and metadata: the assembly,</text>
    <text x="134" y="455" font-size="11">not machine code</text>

    <rect x="248" y="402" width="170" height="66" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="333" y="424" font-weight="bold">Shelf.Cli.pdb</text>
    <text x="333" y="441" font-size="11">sequence points and locals</text>
    <text x="333" y="455" font-size="11">for the debugger</text>

    <rect x="434" y="402" width="170" height="66" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="519" y="424" font-weight="bold">Shelf.Cli (apphost)</text>
    <text x="519" y="441" font-size="11">native launcher, Shelf.Cli.exe</text>
    <text x="519" y="455" font-size="11">on Windows</text>

    <rect x="620" y="402" width="304" height="66" fill="#e9f5e9" stroke="#2e7d32"/>
    <text x="772" y="424" font-weight="bold">runtimeconfig.json, deps.json</text>
    <text x="772" y="441" font-size="11">framework to use (Microsoft.NETCore.App 10.0)</text>
    <text x="772" y="455" font-size="11">and the assemblies to probe</text>
  </g>
  <line x1="480" y1="478" x2="480" y2="502" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="24" y="504" width="912" height="92" fill="none" stroke="#b28704" stroke-dasharray="5 3"/>
  <text x="36" y="522" font-size="13" font-weight="bold" fill="#b28704">4. Run (dotnet run, dotnet Shelf.Cli.dll, or the apphost)</text>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="36" y="534" width="200" height="50" fill="#fff8e1" stroke="#b28704"/>
    <text x="136" y="554" font-weight="bold">dotnet host (hostfxr)</text>
    <text x="136" y="570" font-size="11">reads runtimeconfig.json</text>

    <rect x="268" y="534" width="200" height="50" fill="#fff8e1" stroke="#b28704"/>
    <text x="368" y="554" font-weight="bold">CLR starts</text>
    <text x="368" y="570" font-size="11">loads the assemblies</text>

    <rect x="500" y="534" width="200" height="50" fill="#fff8e1" stroke="#b28704"/>
    <text x="600" y="554" font-weight="bold">JIT compiler</text>
    <text x="600" y="570" font-size="11">IL to native code, per method</text>

    <rect x="732" y="534" width="192" height="50" fill="#fff8e1" stroke="#b28704"/>
    <text x="828" y="554" font-weight="bold">Main runs</text>
    <text x="828" y="570" font-size="11">your program executes</text>
  </g>
  <g stroke="#1c4b73" stroke-width="1.6" marker-end="url(#a)" fill="none">
    <line x1="236" y1="559" x2="266" y2="559"/>
    <line x1="468" y1="559" x2="498" y2="559"/>
    <line x1="700" y1="559" x2="730" y2="559"/>
  </g>
</svg>
