<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Anatomy of a URP Lit material: maps in, shaded pixel out</text>
<rect x="20" y="46" width="230" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="62.9" text-anchor="middle" font-size="11" fill="#3730A3">Base Map (sRGB colour)</text>
<text x="135.0" y="76.8" text-anchor="middle" font-size="11" fill="#3730A3">cover.png</text>
<line x1="250" y1="66" x2="328" y2="104" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="92" width="230" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="108.8" text-anchor="middle" font-size="11" fill="#3730A3">Normal Map (Normal map type)</text>
<text x="135.0" y="122.8" text-anchor="middle" font-size="11" fill="#3730A3">cover-normal.png</text>
<line x1="250" y1="112" x2="328" y2="126" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="138" width="230" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="135.0" y="154.8" text-anchor="middle" font-size="11" fill="#92400E">Metallic Map (linear, RGBA)</text>
<text x="135.0" y="168.8" text-anchor="middle" font-size="11" fill="#92400E">packed.png</text>
<line x1="250" y1="158" x2="328" y2="148" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="184" width="230" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="135.0" y="200.8" text-anchor="middle" font-size="11" fill="#92400E">Occlusion Map (green channel)</text>
<text x="135.0" y="214.8" text-anchor="middle" font-size="11" fill="#92400E">packed.png</text>
<line x1="250" y1="204" x2="328" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="230" width="230" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="246.8" text-anchor="middle" font-size="11" fill="#374151">Emission Map (HDR colour)</text>
<text x="135.0" y="260.9" text-anchor="middle" font-size="11" fill="#374151">optional</text>
<line x1="250" y1="250" x2="328" y2="192" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="330" y="80" width="170" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="415.0" y="121.7" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">URP Lit shader</text>
<text x="415.0" y="136.7" text-anchor="middle" font-size="12" fill="#3730A3">Workflow: Metallic</text>
<text x="415.0" y="151.7" text-anchor="middle" font-size="12" fill="#3730A3">Surface: Opaque</text>
<text x="415.0" y="166.7" text-anchor="middle" font-size="12" fill="#3730A3">Render Face: Front</text>
<text x="415.0" y="181.7" text-anchor="middle" font-size="12" fill="#3730A3">Receive Shadows: on</text>
<text x="415.0" y="196.7" text-anchor="middle" font-size="12" fill="#3730A3">Physically based</text>
<line x1="500" y1="155" x2="540" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="540" y="80" width="200" height="150" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="129.2" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Shaded pixel</text>
<text x="640.0" y="144.2" text-anchor="middle" font-size="12" fill="#1F2937">diffuse + specular (GGX)</text>
<text x="640.0" y="159.2" text-anchor="middle" font-size="12" fill="#1F2937">+ ambient and probes</text>
<text x="640.0" y="174.2" text-anchor="middle" font-size="12" fill="#1F2937">+ shadows + emission</text>
<text x="640.0" y="189.2" text-anchor="middle" font-size="12" fill="#1F2937">(then post-processing)</text>
<text x="380" y="296" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Channel packing: one linear texture for three inputs</text>
<rect x="100" y="308" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<text x="165" y="328" text-anchor="middle" font-size="16" fill="#B45309" font-weight="bold">R</text>
<text x="165" y="345" text-anchor="middle" font-size="11" fill="#374151">Metallic</text>
<rect x="240" y="308" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
<text x="305" y="328" text-anchor="middle" font-size="16" fill="#047857" font-weight="bold">G</text>
<text x="305" y="345" text-anchor="middle" font-size="11" fill="#374151">Occlusion</text>
<rect x="380" y="308" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="445" y="328" text-anchor="middle" font-size="16" fill="#4B5563" font-weight="bold">B</text>
<text x="445" y="345" text-anchor="middle" font-size="11" fill="#374151">not used</text>
<rect x="520" y="308" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="585" y="328" text-anchor="middle" font-size="16" fill="#4F46E5" font-weight="bold">A</text>
<text x="585" y="345" text-anchor="middle" font-size="11" fill="#374151">Smoothness</text>
<rect x="20" y="370" width="720" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="399.9" text-anchor="middle" font-size="11" fill="#92400E">Turn off sRGB (Color Texture) on the packed texture: it holds data, not colour. Base Map keeps sRGB on.</text>
<text x="380.0" y="413.9" text-anchor="middle" font-size="11" fill="#92400E">Smoothness can come from the Metallic Map alpha (default) or from the Base Map alpha.</text>
<text x="380.0" y="427.9" text-anchor="middle" font-size="11" fill="#92400E">Normal maps must use the Normal map texture type so the importer stores them in the right format.</text>
</svg>
