<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The NestJS layer stack</text>
  <text x="360" y="44" font-size="12" fill="#666666" text-anchor="middle">your code only touches the layers above the platform adapter</text>

  <!-- Layer 1: your code -->
  <rect x="60" y="62" width="400" height="66" fill="#f4f4f4" stroke="#2f5424" stroke-width="1.6"/>
  <text x="260" y="86" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Your code</text>
  <text x="260" y="104" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">controllers, providers, guards, pipes, DTOs</text>
  <text x="260" y="120" font-size="10" fill="#666666" text-anchor="middle">the Bookshelf API lives here</text>

  <!-- Layer 2: modules -->
  <rect x="60" y="144" width="400" height="66" fill="#f4f4f4" stroke="#7a4a00" stroke-width="1.6"/>
  <text x="260" y="168" font-size="14" font-weight="bold" fill="#7a4a00" text-anchor="middle">Modules</text>
  <text x="260" y="186" font-size="11" fill="#444444" text-anchor="middle" font-family="'Courier New', monospace">@Module({ imports, controllers, providers, exports })</text>
  <text x="260" y="202" font-size="10" fill="#666666" text-anchor="middle">the graph that organises the application</text>

  <!-- Layer 3: Nest core -->
  <rect x="60" y="226" width="400" height="86" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="260" y="250" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Nest core and DI container</text>
  <text x="260" y="268" font-size="11" fill="#444444" text-anchor="middle">dependency injection, scanner, router, request pipeline,</text>
  <text x="260" y="283" font-size="11" fill="#444444" text-anchor="middle">lifecycle hooks, exception layer, platform-agnostic adapter API</text>
  <text x="260" y="302" font-size="10" fill="#666666" text-anchor="middle">@nestjs/core and @nestjs/common</text>

  <!-- Layer 4: platform adapter -->
  <rect x="60" y="328" width="400" height="66" fill="#f4f4f4" stroke="#8a1f1f" stroke-width="1.6"/>
  <text x="260" y="352" font-size="14" font-weight="bold" fill="#8a1f1f" text-anchor="middle">HTTP platform adapter</text>
  <text x="260" y="370" font-size="11" fill="#444444" text-anchor="middle">Express (default) or Fastify, behind the same adapter contract</text>
  <text x="260" y="386" font-size="10" fill="#666666" text-anchor="middle">@nestjs/platform-express or @nestjs/platform-fastify</text>

  <!-- Layer 5: Node.js -->
  <rect x="60" y="410" width="400" height="44" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
  <text x="260" y="429" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Node.js</text>
  <text x="260" y="445" font-size="11" fill="#444444" text-anchor="middle">sockets, HTTP parsing, event loop</text>

  <!-- adapter contract arrow -->
  <line x1="260" y1="410" x2="260" y2="396" stroke="#444444" stroke-width="1.4"/>
  <polygon points="260,396 255,404 265,404" fill="#444444"/>

  <!-- Other transports beside -->
  <rect x="520" y="226" width="160" height="168" fill="#f4f4f4" stroke="#444444" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="600" y="252" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Other entry points</text>
  <text x="600" y="274" font-size="11" fill="#444444" text-anchor="middle">microservice</text>
  <text x="600" y="290" font-size="11" fill="#444444" text-anchor="middle">transporters</text>
  <text x="600" y="312" font-size="11" fill="#444444" text-anchor="middle">WebSocket</text>
  <text x="600" y="328" font-size="11" fill="#444444" text-anchor="middle">gateways</text>
  <text x="600" y="350" font-size="11" fill="#444444" text-anchor="middle">standalone</text>
  <text x="600" y="366" font-size="11" fill="#444444" text-anchor="middle">application context</text>
  <text x="600" y="384" font-size="10" fill="#666666" text-anchor="middle">no HTTP adapter needed</text>

  <line x1="520" y1="270" x2="466" y2="270" stroke="#444444" stroke-width="1.4"/>
  <polygon points="462,270 470,265 470,275" fill="#444444"/>
  <text x="493" y="262" font-size="10" fill="#666666" text-anchor="middle">plug into</text>

  <!-- legend -->
  <text x="520" y="90" font-size="11" fill="#222222" font-weight="bold">An HTTP request</text>
  <text x="520" y="106" font-size="11" fill="#444444">travels bottom to top,</text>
  <text x="520" y="122" font-size="11" fill="#444444">the response travels</text>
  <text x="520" y="138" font-size="11" fill="#444444">back down.</text>
</svg>
