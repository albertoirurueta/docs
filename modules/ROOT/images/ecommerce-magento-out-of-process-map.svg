<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">How Adobe Commerce talks to an App Builder app</title>
  <desc id="d">Adobe Commerce emits synchronous webhooks straight to a runtime action and asynchronous events through Adobe I/O Events. The action calls back the Commerce REST and GraphQL APIs. The Admin UI SDK renders the web-src of the app in an iframe inside the Admin, and API Mesh puts one GraphQL endpoint over Commerce and other systems.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="10" y="40" width="340" height="330" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="22" y="60" font-weight="bold" font-size="13">Adobe Commerce (PaaS or SaaS)</text>
  <rect x="30" y="70" width="300" height="56" rx="12" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="180.0" y="93" text-anchor="middle" font-weight="bold">In-process PHP modules</text>
  <text x="180.0" y="111" text-anchor="middle">plugins and observers (PaaS only)</text>
  <rect x="30" y="140" width="300" height="70" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="180.0" y="170" text-anchor="middle" font-weight="bold">Out-of-process modules</text>
  <text x="180.0" y="188" text-anchor="middle">events client, webhooks, backend UI SDK</text>
  <rect x="30" y="225" width="300" height="56" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="180.0" y="248" text-anchor="middle" font-weight="bold">REST and GraphQL APIs</text>
  <text x="180.0" y="266" text-anchor="middle">the way back into Commerce</text>
  <rect x="30" y="296" width="300" height="56" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="180.0" y="319" text-anchor="middle" font-weight="bold">Admin UI SDK host</text>
  <text x="180.0" y="337" text-anchor="middle">menus, grids, mass actions, order view</text>
  <rect x="620" y="40" width="270" height="330" rx="12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="632" y="60" font-weight="bold" font-size="13">App Builder (Adobe I/O Runtime)</text>
  <rect x="640" y="70" width="230" height="64" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="755.0" y="97" text-anchor="middle" font-weight="bold">External systems</text>
  <text x="755.0" y="115" text-anchor="middle">ERP, roastery, payment gateway</text>
  <rect x="640" y="150" width="230" height="80" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="755.0" y="176" text-anchor="middle" font-weight="bold">Runtime actions (Node.js)</text>
  <text x="755.0" y="194" text-anchor="middle">validate-stock, order-placed</text>
  <text x="755.0" y="212" text-anchor="middle">stateless, HTTPS, IMS or signature</text>
  <rect x="640" y="296" width="230" height="56" rx="12" fill="#f1c40f" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="755.0" y="319" text-anchor="middle" font-weight="bold">web-src (React Spectrum)</text>
  <text x="755.0" y="337" text-anchor="middle">rendered in an iframe</text>
  <rect x="400" y="70" width="170" height="56" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="485.0" y="93" text-anchor="middle" font-weight="bold">API Mesh</text>
  <text x="485.0" y="111" text-anchor="middle">one GraphQL endpoint</text>
  <rect x="400" y="190" width="170" height="60" rx="12" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="485.0" y="215" text-anchor="middle" font-weight="bold">Adobe I/O Events</text>
  <text x="485.0" y="233" text-anchor="middle">routes, journals, retries</text>
  <line x1="330" y1="165" x2="638" y2="165" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="485" y="158" text-anchor="middle" font-size="12">webhook: synchronous, signed HTTPS POST</text>
  <line x1="330" y1="205" x2="398" y2="220" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="220" x2="638" y2="212" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="485" y="183" text-anchor="middle" font-size="12">event: queued, sent by cron</text>
  <path d="M700,230 L700,240 L332,240" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="272" text-anchor="middle" font-size="12">REST or GraphQL callback with an IMS token</text>
  <path d="M400,98 L360,98 L360,262 L332,262" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="98" x2="638" y2="98" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="638" y1="324" x2="332" y2="324" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="485" y="316" text-anchor="middle" font-size="12">Admin UI SDK: iframe, IMS token</text>
  <line x1="700" y1="150" x2="700" y2="136" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="450" y="400" text-anchor="middle" font-size="12" opacity="0.85">Magento Open Source has none of the out-of-process modules; Adobe Commerce as a Cloud Service has no in-process PHP.</text>
  <text x="450" y="420" text-anchor="middle" font-size="12" opacity="0.85">Mage-OS 3.6.0 contains none of the Adobe modules either, so the examples emulate the contracts in a small module.</text>
</svg>
