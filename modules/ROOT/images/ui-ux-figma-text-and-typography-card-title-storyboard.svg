<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: style a book card title</text>
  <g>
  <rect x="20" y="50" width="165" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="38" y="80" width="129" height="90" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="46" y="108" font-size="12" fill="#1F2937">The Hobbit, or There and Back Again</text>
  <text x="102" y="205" font-size="12" fill="#374151" text-anchor="middle">Press T, click the card,</text>
  <text x="102" y="223" font-size="12" fill="#374151" text-anchor="middle">type the title</text>
  <circle cx="34" cy="64" r="11" fill="#4F46E5"/><text x="34" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  </g>
  <g>
  <rect x="207" y="50" width="165" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="225" y="80" width="129" height="90" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="233" y="108" font-size="12" fill="#1F2937">The Hobbit, or There</text>
  <text x="233" y="124" font-size="12" fill="#1F2937">and Back Again</text>
  <rect x="229" y="94" width="121" height="38" fill="none" stroke="#B45309" stroke-width="2"/>
  <text x="289" y="205" font-size="12" fill="#374151" text-anchor="middle">Set Auto height so the</text>
  <text x="289" y="223" font-size="12" fill="#374151" text-anchor="middle">title wraps in the card</text>
  <circle cx="221" cy="64" r="11" fill="#4F46E5"/><text x="221" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>
  <g>
  <rect x="394" y="50" width="165" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="412" y="80" width="129" height="90" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="420" y="108" font-size="14" font-weight="bold" fill="#1F2937">The Hobbit, or</text>
  <text x="420" y="127" font-size="14" font-weight="bold" fill="#1F2937">There and Back</text>
  <text x="420" y="146" font-size="14" font-weight="bold" fill="#1F2937">Again</text>
  <text x="476" y="205" font-size="12" fill="#374151" text-anchor="middle">Pick font, weight Bold,</text>
  <text x="476" y="223" font-size="12" fill="#374151" text-anchor="middle">size 20, line height 140%</text>
  <circle cx="408" cy="64" r="11" fill="#4F46E5"/><text x="408" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>
  <g>
  <rect x="581" y="50" width="159" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="597" y="80" width="127" height="90" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="605" y="108" font-size="14" font-weight="bold" fill="#1F2937">The Hobbit, or</text>
  <text x="605" y="126" font-size="14" font-weight="bold" fill="#1F2937">There and Back...</text>
  <rect x="605" y="188" width="120" height="0" fill="none"/>
  <rect x="597" y="140" width="52" height="20" rx="10" fill="#4F46E5"/>
  <text x="660" y="205" font-size="12" fill="#374151" text-anchor="middle">Max lines 2 + truncate,</text>
  <text x="660" y="223" font-size="12" fill="#374151" text-anchor="middle">then save as text style</text>
  <circle cx="595" cy="64" r="11" fill="#B45309"/><text x="595" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  </g>
  <path d="M187,170 L205,170" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M374,170 L392,170" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M561,170 L579,170" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="380" y="316" font-size="12" fill="#374151" text-anchor="middle">Result: one reusable style for every Bookshelf card title.</text>
</svg>
