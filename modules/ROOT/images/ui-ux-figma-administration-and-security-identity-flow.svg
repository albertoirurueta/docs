<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Sign-in (SAML) and provisioning (SCIM) are two separate channels</text>
  <rect x="30" y="60" width="200" height="150" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="130" y="86" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Identity provider</text>
  <text x="130" y="110" font-size="12" fill="#374151" text-anchor="middle">Company directory</text>
  <rect x="50" y="124" width="160" height="22" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="130" y="140" font-size="11" fill="#3730A3" text-anchor="middle">Bookshelf team members</text>
  <rect x="50" y="154" width="160" height="22" rx="4" fill="#FFFFFF" stroke="#4F46E5"/><text x="130" y="170" font-size="11" fill="#3730A3" text-anchor="middle">Groups</text>
  <text x="130" y="198" font-size="11" fill="#4B5563" text-anchor="middle">Holds the user list</text>
  <rect x="530" y="60" width="200" height="150" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="630" y="86" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Figma organization</text>
  <text x="630" y="110" font-size="12" fill="#374151" text-anchor="middle">Members, seats, groups</text>
  <rect x="550" y="124" width="160" height="22" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="630" y="140" font-size="11" fill="#92400E" text-anchor="middle">Tenant ID (from Admin)</text>
  <rect x="550" y="154" width="160" height="22" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="630" y="170" font-size="11" fill="#92400E" text-anchor="middle">Verified domains</text>
  <text x="630" y="198" font-size="11" fill="#4B5563" text-anchor="middle">Admin, Settings tab</text>
  <line x1="232" y1="100" x2="528" y2="100" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="380" cy="100" r="11" fill="#4F46E5"/><text x="380" y="104" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="380" y="80" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">SAML SSO: sign-in</text>
  <text x="380" y="126" font-size="11" fill="#374151" text-anchor="middle">Person signs in at the IdP</text>
  <line x1="232" y1="170" x2="528" y2="170" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="380" cy="170" r="11" fill="#B45309"/><text x="380" y="174" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="380" y="150" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">SCIM: create, update, deactivate</text>
  <text x="380" y="196" font-size="11" fill="#374151" text-anchor="middle">Pushed when the admin changes the IdP</text>
  <rect x="30" y="236" width="340" height="104" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="200" y="260" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">SAML alone: JIT provisioning</text>
  <text x="200" y="284" font-size="12" fill="#374151" text-anchor="middle">Account is created or updated only</text>
  <text x="200" y="302" font-size="12" fill="#374151" text-anchor="middle">at the person's next login</text>
  <text x="200" y="324" font-size="11" fill="#4B5563" text-anchor="middle">Organization, Enterprise, Education, Government</text>
  <rect x="390" y="236" width="340" height="104" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="560" y="260" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">SAML plus SCIM</text>
  <text x="560" y="284" font-size="12" fill="#374151" text-anchor="middle">Changes apply at once; import, deactivate,</text>
  <text x="560" y="302" font-size="12" fill="#374151" text-anchor="middle">sync groups; seat types on Enterprise</text>
  <text x="560" y="324" font-size="11" fill="#4B5563" text-anchor="middle">Guests are outside both channels</text>
</svg>
