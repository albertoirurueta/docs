<svg viewBox="0 0 900 500" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">AWS storage options compared: block, file and object</text>
  <rect x="20" y="50" width="280" height="330" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="160" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#123a72">Block storage</text>
  <text x="160" y="98" text-anchor="middle" font-size="12" fill="#123a72">Amazon EBS, instance store</text>
  <text x="34" y="122" font-size="10" font-weight="700" fill="#1a5fb4">ATTACHED TO</text>
  <text x="34" y="138" font-size="12" fill="#123a72">One instance (Multi-Attach only on io2)</text>
  <text x="34" y="164" font-size="10" font-weight="700" fill="#1a5fb4">ACCESS MODEL</text>
  <text x="34" y="180" font-size="12" fill="#123a72">Raw disk: you format, mount</text>
  <text x="34" y="206" font-size="10" font-weight="700" fill="#1a5fb4">RESILIENCE</text>
  <text x="34" y="222" font-size="12" fill="#123a72">Single Availability Zone</text>
  <text x="34" y="248" font-size="10" font-weight="700" fill="#1a5fb4">PERFORMANCE</text>
  <text x="34" y="264" font-size="12" fill="#123a72">gp3 / io2 Block Express / st1 / sc1</text>
  <text x="34" y="290" font-size="10" font-weight="700" fill="#1a5fb4">TYPICAL USE</text>
  <text x="34" y="306" font-size="12" fill="#123a72">Boot volumes, databases, low latency</text>
  <text x="34" y="332" font-size="10" font-weight="700" fill="#1a5fb4">PROTECTION</text>
  <text x="34" y="348" font-size="12" fill="#123a72">Snapshots to S3 (Regional)</text>
  <rect x="310" y="50" width="280" height="330" rx="10" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.8"/>
  <text x="450" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">File storage</text>
  <text x="450" y="98" text-anchor="middle" font-size="12" fill="#14532d">Amazon EFS, Amazon FSx, S3 Files</text>
  <text x="324" y="122" font-size="10" font-weight="700" fill="#1e7e34">ATTACHED TO</text>
  <text x="324" y="138" font-size="12" fill="#14532d">Many instances, pods, functions</text>
  <text x="324" y="164" font-size="10" font-weight="700" fill="#1e7e34">ACCESS MODEL</text>
  <text x="324" y="180" font-size="12" fill="#14532d">NFS (EFS) or SMB (FSx Windows)</text>
  <text x="324" y="206" font-size="10" font-weight="700" fill="#1e7e34">RESILIENCE</text>
  <text x="324" y="222" font-size="12" fill="#14532d">EFS Regional: many AZs</text>
  <text x="324" y="248" font-size="10" font-weight="700" fill="#1e7e34">PERFORMANCE</text>
  <text x="324" y="264" font-size="12" fill="#14532d">Elastic throughput by default</text>
  <text x="324" y="290" font-size="10" font-weight="700" fill="#1e7e34">TYPICAL USE</text>
  <text x="324" y="306" font-size="12" fill="#14532d">Shared content, home directories</text>
  <text x="324" y="332" font-size="10" font-weight="700" fill="#1e7e34">PROTECTION</text>
  <text x="324" y="348" font-size="12" fill="#14532d">Backups with AWS Backup</text>
  <rect x="600" y="50" width="280" height="330" rx="10" fill="#fff4e0" stroke="#b45f06" stroke-width="1.8"/>
  <text x="740" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#6b3a04">Object storage</text>
  <text x="740" y="98" text-anchor="middle" font-size="12" fill="#6b3a04">Amazon S3 (own page)</text>
  <text x="614" y="122" font-size="10" font-weight="700" fill="#b45f06">ATTACHED TO</text>
  <text x="614" y="138" font-size="12" fill="#6b3a04">Any client over HTTPS</text>
  <text x="614" y="164" font-size="10" font-weight="700" fill="#b45f06">ACCESS MODEL</text>
  <text x="614" y="180" font-size="12" fill="#6b3a04">Whole objects through an API</text>
  <text x="614" y="206" font-size="10" font-weight="700" fill="#b45f06">RESILIENCE</text>
  <text x="614" y="222" font-size="12" fill="#6b3a04">Regional, multi-AZ by default</text>
  <text x="614" y="248" font-size="10" font-weight="700" fill="#b45f06">PERFORMANCE</text>
  <text x="614" y="264" font-size="12" fill="#6b3a04">Storage classes and lifecycle rules</text>
  <text x="614" y="290" font-size="10" font-weight="700" fill="#b45f06">TYPICAL USE</text>
  <text x="614" y="306" font-size="12" fill="#6b3a04">Uploads, static sites, data lakes</text>
  <text x="614" y="332" font-size="10" font-weight="700" fill="#b45f06">PROTECTION</text>
  <text x="614" y="348" font-size="12" fill="#6b3a04">Versioning and replication</text>
  <text x="20" y="408" font-size="13" font-weight="700" fill="#3c4a58">Moving and protecting data between them</text>
  <rect x="20" y="418" width="212" height="62" rx="8" fill="#f1f3f5" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="126" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">AWS Backup</text>
  <text x="126" y="462" text-anchor="middle" font-size="10.5" fill="#3c4a58">plans, vaults, cross-Region copy</text>
  <rect x="242" y="418" width="212" height="62" rx="8" fill="#f1f3f5" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="348" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">AWS DataSync</text>
  <text x="348" y="462" text-anchor="middle" font-size="10.5" fill="#3c4a58">scheduled copy: NFS, SMB, S3, EFS, FSx</text>
  <rect x="464" y="418" width="212" height="62" rx="8" fill="#f1f3f5" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="570" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">Storage Gateway</text>
  <text x="570" y="462" text-anchor="middle" font-size="10.5" fill="#3c4a58">on-premises cache in front of AWS</text>
  <rect x="686" y="418" width="212" height="62" rx="8" fill="#f1f3f5" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="792" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">Transfer Family</text>
  <text x="792" y="462" text-anchor="middle" font-size="10.5" fill="#3c4a58">SFTP, FTPS, FTP, AS2 into S3 or EFS</text>
</svg>
