<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Tornado layer stack</title>
  <defs>
    <marker id="tls-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">The layers under one Tornado request</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">one process, one thread, one event loop: every layer is a coroutine-friendly wrapper of the one below</text>

  <!-- main column, top to bottom -->
  <rect x="30" y="64" width="400" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="87" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">Your code</text>
  <text x="230" y="105" font-size="11" fill="currentColor" text-anchor="middle">handlers (async def get/post), UI modules, settings</text>

  <rect x="30" y="138" width="400" height="66" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/>
  <text x="230" y="162" font-size="15" font-weight="bold" fill="currentColor" text-anchor="middle">Application + RequestHandler</text>
  <text x="230" y="181" font-size="11" fill="currentColor" text-anchor="middle">routing, templates, cookies, XSRF, WebSocketHandler</text>
  <text x="230" y="195" font-size="11" fill="currentColor" text-anchor="middle">(tornado.web, tornado.routing, tornado.websocket)</text>

  <rect x="30" y="222" width="400" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="245" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">HTTPServer / AsyncHTTPClient</text>
  <text x="230" y="263" font-size="11" fill="currentColor" text-anchor="middle">HTTP/1.x parsing (tornado.httpserver, httpclient, httputil)</text>

  <rect x="30" y="296" width="400" height="56" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="319" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">TCPServer / IOStream</text>
  <text x="230" y="337" font-size="11" fill="currentColor" text-anchor="middle">non-blocking sockets, buffered reads and writes, TLS</text>

  <rect x="30" y="370" width="400" height="40" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="395" font-size="14" font-weight="bold" fill="currentColor" text-anchor="middle">IOLoop (wraps the asyncio loop)</text>

  <rect x="30" y="426" width="400" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="230" y="449" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">asyncio event loop on epoll / kqueue / select</text>

  <!-- arrows upward -->
  <line x1="230" y1="426" x2="230" y2="412" stroke="currentColor" stroke-width="1.5" marker-end="url(#tls-arrow)"/>
  <line x1="230" y1="370" x2="230" y2="354" stroke="currentColor" stroke-width="1.5" marker-end="url(#tls-arrow)"/>
  <line x1="230" y1="296" x2="230" y2="280" stroke="currentColor" stroke-width="1.5" marker-end="url(#tls-arrow)"/>
  <line x1="230" y1="222" x2="230" y2="206" stroke="currentColor" stroke-width="1.5" marker-end="url(#tls-arrow)"/>
  <line x1="230" y1="138" x2="230" y2="122" stroke="currentColor" stroke-width="1.5" marker-end="url(#tls-arrow)"/>

  <!-- side column -->
  <text x="575" y="82" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">Used beside the stack</text>

  <rect x="470" y="96" width="210" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="575" y="119" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Coroutines</text>
  <text x="575" y="136" font-size="11" fill="currentColor" text-anchor="middle">async def / await, tornado.gen,</text>
  <text x="575" y="150" font-size="11" fill="currentColor" text-anchor="middle">tornado.queues, tornado.locks</text>

  <rect x="470" y="176" width="210" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="575" y="199" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Templates and locale</text>
  <text x="575" y="216" font-size="11" fill="currentColor" text-anchor="middle">tornado.template, tornado.locale,</text>
  <text x="575" y="230" font-size="11" fill="currentColor" text-anchor="middle">tornado.escape</text>

  <rect x="470" y="256" width="210" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="575" y="279" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Process helpers</text>
  <text x="575" y="296" font-size="11" fill="currentColor" text-anchor="middle">tornado.process (fork_processes),</text>
  <text x="575" y="310" font-size="11" fill="currentColor" text-anchor="middle">run_in_executor, autoreload</text>

  <rect x="470" y="336" width="210" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="575" y="359" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Optional WSGI bridge</text>
  <text x="575" y="376" font-size="11" fill="currentColor" text-anchor="middle">WSGIContainer inside Application:</text>
  <text x="575" y="390" font-size="11" fill="currentColor" text-anchor="middle">hosts a WSGI app, discouraged</text>

  <line x1="430" y1="171" x2="468" y2="130" stroke="currentColor" stroke-width="1.2" marker-end="url(#tls-arrow)"/>
  <line x1="430" y1="171" x2="468" y2="207" stroke="currentColor" stroke-width="1.2" marker-end="url(#tls-arrow)"/>
  <line x1="430" y1="390" x2="468" y2="287" stroke="currentColor" stroke-width="1.2" marker-end="url(#tls-arrow)"/>
  <line x1="430" y1="171" x2="468" y2="367" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#tls-arrow)"/>
</svg>
