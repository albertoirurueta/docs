<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif">
  <title id="t1">How three scalers treat one outlier</title>
  <desc id="d1">Ten values, nine of them from 1 to 9 and one outlier at 1000, shown after StandardScaler, MinMaxScaler and RobustScaler. With the first two, the nine ordinary values collapse into a tiny clump next to the outlier. With RobustScaler they stay spread out between minus one and one while the outlier lands far off the chart.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="378" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">One outlier, three scalers</text>
  <text x="24" y="56" font-size="14" fill="#475569">Input: 1, 2, 3, 4, 5, 6, 7, 8, 9 and 1000, each scaler fitted on all ten values</text>

  <!-- Row 1 StandardScaler axis -1..4 over x=60..640 (116px/unit) -->
  <text x="24" y="92" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">StandardScaler</text>
  <line x1="60" y1="130" x2="660" y2="130" stroke="#94A3B8" stroke-width="1.5"/>
  <g stroke="#94A3B8" stroke-width="1.5"><line x1="176" y1="125" x2="176" y2="135"/><line x1="292" y1="125" x2="292" y2="135"/><line x1="408" y1="125" x2="408" y2="135"/><line x1="524" y1="125" x2="524" y2="135"/></g>
  <g font-size="12" fill="#475569" text-anchor="middle"><text x="176" y="150">0</text><text x="292" y="150">1</text><text x="408" y="150">2</text><text x="524" y="150">3</text></g>
  <rect x="127" y="113" width="12" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <circle cx="524" cy="125" r="7" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="152" y="108" font-size="12" fill="#475569">nine values within 0.03</text>
  <text x="536" y="108" font-size="12" fill="#475569">outlier: 3.0</text>

  <!-- Row 2 MinMax axis 0..1 over x=100..600 -->
  <text x="24" y="196" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">MinMaxScaler</text>
  <line x1="100" y1="232" x2="600" y2="232" stroke="#94A3B8" stroke-width="1.5"/>
  <g stroke="#94A3B8" stroke-width="1.5"><line x1="100" y1="227" x2="100" y2="237"/><line x1="350" y1="227" x2="350" y2="237"/><line x1="600" y1="227" x2="600" y2="237"/></g>
  <g font-size="12" fill="#475569" text-anchor="middle"><text x="100" y="252">0</text><text x="350" y="252">0.5</text><text x="600" y="252">1</text></g>
  <rect x="97" y="215" width="12" height="24" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <circle cx="600" cy="227" r="7" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="120" y="210" font-size="12" fill="#475569">nine values within 0.008</text>
  <text x="520" y="210" font-size="12" fill="#475569">outlier: 1.0</text>

  <!-- Row 3 Robust axis -2..3, x=60..560 (100px/unit); outlier off chart -->
  <text x="24" y="296" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">RobustScaler</text>
  <line x1="60" y1="334" x2="620" y2="334" stroke="#94A3B8" stroke-width="1.5"/>
  <g stroke="#94A3B8" stroke-width="1.5"><line x1="60" y1="329" x2="60" y2="339"/><line x1="160" y1="329" x2="160" y2="339"/><line x1="260" y1="329" x2="260" y2="339"/><line x1="360" y1="329" x2="360" y2="339"/><line x1="460" y1="329" x2="460" y2="339"/></g>
  <g font-size="12" fill="#475569" text-anchor="middle"><text x="60" y="354">-2</text><text x="160" y="354">-1</text><text x="260" y="354">0</text><text x="360" y="354">1</text><text x="460" y="354">2</text></g>
  <g fill="#CCFBF1" stroke="#0F766E" stroke-width="2">
    <circle cx="160" cy="334" r="6"/><circle cx="182" cy="334" r="6"/><circle cx="204" cy="334" r="6"/><circle cx="227" cy="334" r="6"/><circle cx="249" cy="334" r="6"/><circle cx="271" cy="334" r="6"/><circle cx="293" cy="334" r="6"/><circle cx="316" cy="334" r="6"/><circle cx="338" cy="334" r="6"/>
  </g>
  <line x1="480" y1="334" x2="590" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#a1)"/>
  <circle cx="640" cy="334" r="7" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="598" y="316" font-size="12" fill="#475569">outlier: 221</text>
  <text x="160" y="312" font-size="12" fill="#475569">nine values still spread from -1 to 0.8</text>
</svg>
