<svg viewBox="0 0 900 330" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">EKS compute options: who operates what</text>
  <text x="20" y="62" font-size="11" fill="#3c4a58">More managed by AWS</text>
  <line x1="150" y1="58" x2="880" y2="58" stroke="#5c6b7a" stroke-width="1.5"/>
  <polygon points="880,53 890,58 880,63" fill="#5c6b7a"/>

  <rect x="20" y="76" width="205" height="226" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="122" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1b4d20">Self-managed nodes</text>
  <text x="122" y="124" text-anchor="middle" font-size="10.5" fill="#1b4d20">You: AMI, patching,</text>
  <text x="122" y="140" text-anchor="middle" font-size="10.5" fill="#1b4d20">Auto Scaling group,</text>
  <text x="122" y="156" text-anchor="middle" font-size="10.5" fill="#1b4d20">upgrades, add-ons</text>
  <text x="122" y="188" text-anchor="middle" font-size="10.5" fill="#1b4d20">Use for: custom AMIs,</text>
  <text x="122" y="204" text-anchor="middle" font-size="10.5" fill="#1b4d20">Windows, special kernels</text>

  <rect x="238" y="76" width="205" height="226" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="340" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">Managed node groups</text>
  <text x="340" y="124" text-anchor="middle" font-size="10.5" fill="#123a72">AWS: node provisioning,</text>
  <text x="340" y="140" text-anchor="middle" font-size="10.5" fill="#123a72">rolling AMI updates</text>
  <text x="340" y="156" text-anchor="middle" font-size="10.5" fill="#123a72">You: sizing, scaling, add-ons</text>
  <text x="340" y="188" text-anchor="middle" font-size="10.5" fill="#123a72">Use for: predictable fleets,</text>
  <text x="340" y="204" text-anchor="middle" font-size="10.5" fill="#123a72">full instance control</text>

  <rect x="456" y="76" width="205" height="226" rx="8" fill="#fff4e0" stroke="#b8741a" stroke-width="1.8"/>
  <text x="558" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#6a4300">Karpenter (self-run)</text>
  <text x="558" y="124" text-anchor="middle" font-size="10.5" fill="#6a4300">AWS: control plane only</text>
  <text x="558" y="140" text-anchor="middle" font-size="10.5" fill="#6a4300">You: install and upgrade</text>
  <text x="558" y="156" text-anchor="middle" font-size="10.5" fill="#6a4300">Karpenter, NodePools, AMIs</text>
  <text x="558" y="188" text-anchor="middle" font-size="10.5" fill="#6a4300">Use for: dynamic, Spot-heavy</text>
  <text x="558" y="204" text-anchor="middle" font-size="10.5" fill="#6a4300">fleets with your own control</text>

  <rect x="674" y="76" width="206" height="226" rx="8" fill="#f3eefb" stroke="#6b4fa3" stroke-width="1.8"/>
  <text x="777" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#43307a">Auto Mode / Fargate</text>
  <text x="777" y="124" text-anchor="middle" font-size="10.5" fill="#43307a">Auto Mode: AWS runs nodes,</text>
  <text x="777" y="140" text-anchor="middle" font-size="10.5" fill="#43307a">scaling, networking, storage,</text>
  <text x="777" y="156" text-anchor="middle" font-size="10.5" fill="#43307a">load balancing, OS patching</text>
  <text x="777" y="176" text-anchor="middle" font-size="10.5" fill="#43307a">Fargate: one micro-VM per Pod,</text>
  <text x="777" y="192" text-anchor="middle" font-size="10.5" fill="#43307a">no nodes at all</text>
  <text x="777" y="224" text-anchor="middle" font-size="10.5" fill="#43307a">Use for: least operations</text>
</svg>
