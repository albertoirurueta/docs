<svg viewBox="0 0 760 370" width="760" height="370" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="370" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where a setting comes from: global values, profile overrides, defines</text>
<rect x="30" y="60" width="150" height="90" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="87.8" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Project Settings</text>
<text x="105.0" y="101.8" text-anchor="middle" font-size="11" fill="#1F2937">(global)</text>
<text x="105.0" y="115.8" text-anchor="middle" font-size="11" fill="#1F2937">Player, Graphics,</text>
<text x="105.0" y="129.8" text-anchor="middle" font-size="11" fill="#1F2937">Quality per platform</text>
<line x1="180" y1="105" x2="212" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah2)"/>
