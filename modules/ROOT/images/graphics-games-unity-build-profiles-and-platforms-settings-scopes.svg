<text x="287.0" y="87.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Platform profile</text>
<text x="287.0" y="101.8" text-anchor="middle" font-size="11" fill="#374151">shared settings:</text>
<text x="287.0" y="115.8" text-anchor="middle" font-size="11" fill="#374151">Development Build,</text>
<text x="287.0" y="129.8" text-anchor="middle" font-size="11" fill="#374151">compression method</text>
<line x1="362" y1="105" x2="394" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah2)"/>
<rect x="394" y="60" width="150" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="469.0" y="87.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Build profile</text>
<text x="469.0" y="101.8" text-anchor="middle" font-size="11" fill="#3730A3">(asset file)</text>
<text x="469.0" y="115.8" text-anchor="middle" font-size="11" fill="#3730A3">only sections added</text>
<text x="469.0" y="129.8" text-anchor="middle" font-size="11" fill="#3730A3">with Add Settings</text>
<line x1="544" y1="105" x2="576" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah2)"/>
<rect x="576" y="60" width="150" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="651.0" y="87.8" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Player build</text>
<text x="651.0" y="101.8" text-anchor="middle" font-size="11" fill="#065F46">what the shipped</text>
<text x="651.0" y="115.8" text-anchor="middle" font-size="11" fill="#065F46">application really</text>
<text x="651.0" y="129.8" text-anchor="middle" font-size="11" fill="#065F46">uses</text>
<text x="380" y="175" text-anchor="middle" font-size="11" fill="#374151">A section left out of the profile keeps the global value; Reset returns an added section to the global values.</text>
<text x="380" y="205" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Scripting define symbols are additive: each scope adds to the others</text>
<rect x="30" y="222" width="150" height="64" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="243.8" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">csc.rsp in Assets</text>
<text x="105.0" y="257.9" text-anchor="middle" font-size="11" fill="#1F2937">whole project,</text>
<text x="105.0" y="271.9" text-anchor="middle" font-size="11" fill="#1F2937">every profile</text>
<rect x="212" y="222" width="150" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="287.0" y="243.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Player Settings list</text>
<text x="287.0" y="257.9" text-anchor="middle" font-size="11" fill="#374151">active platform</text>
<text x="287.0" y="271.9" text-anchor="middle" font-size="11" fill="#374151">and its profiles</text>
<rect x="394" y="222" width="150" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="469.0" y="243.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Build profile</text>
<text x="469.0" y="257.9" text-anchor="middle" font-size="11" fill="#3730A3">Scripting Defines</text>
<text x="469.0" y="271.9" text-anchor="middle" font-size="11" fill="#3730A3">while it is active</text>
<rect x="576" y="222" width="150" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="651.0" y="243.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">From code</text>
<text x="651.0" y="257.9" text-anchor="middle" font-size="11" fill="#92400E">SetScripting</text>
<text x="651.0" y="271.9" text-anchor="middle" font-size="11" fill="#92400E">DefineSymbols</text>
<rect x="30" y="305" width="700" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="323.9" text-anchor="middle" font-size="11" fill="#374151">UNITY_EDITOR, UNITY_WEBGL, UNITY_ANDROID, UNITY_IOS ... are predefined by Unity for the target and are always present</text>
<text x="380.0" y="337.9" text-anchor="middle" font-size="11" fill="#374151">Compile-time only: code in a false #if branch is not in the build at all</text>
<line x1="380" y1="286" x2="380" y2="305" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah2)"/>
</svg>
