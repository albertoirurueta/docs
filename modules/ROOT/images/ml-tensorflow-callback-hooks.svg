<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Keras callback hooks during fit()</title>
  <desc id="d">Nested boxes show on_train_begin and on_train_end around an epoch loop, with on_epoch_begin and on_epoch_end around a batch loop that calls on_train_batch_begin and on_train_batch_end, and validation hooks on_test_begin, on_test_batch_begin, on_test_batch_end and on_test_end running before on_epoch_end.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Callback hooks called by fit()</text>
  <rect x="20" y="50" width="680" height="330" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="36" y="72" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">on_train_begin</text>
  <text x="684" y="72" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">on_train_end</text>
  <rect x="40" y="86" width="640" height="276" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="56" y="108" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">on_epoch_begin</text>
  <text x="664" y="108" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">on_epoch_end</text>
  <text x="360" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">repeated for each epoch</text>
  <rect x="60" y="124" width="290" height="120" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="205" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Training batches</text>
  <rect x="80" y="158" width="250" height="30" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="205" y="178" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">on_train_batch_begin(batch)</text>
  <rect x="80" y="196" width="250" height="30" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="205" y="216" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">on_train_batch_end(batch, logs)</text>
  <path d="M205,188 L205,196" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="380" y="124" width="280" height="120" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="520" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Validation (if validation data)</text>
  <text x="520" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">on_test_begin</text>
  <text x="520" y="190" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">on_test_batch_begin / _end</text>
  <text x="520" y="210" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">on_test_end</text>
  <path d="M350,184 L380,184" stroke="#475569" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 3"/>
  <circle cx="72" cy="262" r="11" fill="#B45309"/><text x="72" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="92" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">Batch hooks fire every N batches when steps_per_execution is N.</text>
  <circle cx="72" cy="290" r="11" fill="#B45309"/><text x="72" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="92" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">on_epoch_end logs contain loss, metrics and val_ metrics.</text>
  <circle cx="72" cy="318" r="11" fill="#B45309"/><text x="72" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="92" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F172A">Setting self.model.stop_training = True ends fit() after the epoch.</text>
  <text x="92" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">evaluate() and predict() call the on_test_* and on_predict_* families only.</text>
</svg>
