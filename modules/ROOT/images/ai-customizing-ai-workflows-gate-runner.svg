<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">A naive quality gate vs. the iru-gate-runner pattern</text>

  <!-- Column headers -->
  <text x="230" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a1c1c">Naive gate</text>
  <text x="730" y="66" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c5c8a">iru-gate-runner (isolated agent)</text>

  <!-- ===================== LEFT: NAIVE ===================== -->
  <!-- Caller box -->
  <rect x="60" y="88" width="340" height="150" rx="8" fill="#fbeaea" stroke="#8a1c1c" stroke-width="2"/>
  <text x="230" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c1414">Caller's context window</text>
  <text x="80" y="136" font-size="11" fill="#5c1414">$ mvn test 2&gt;&amp;1</text>
  <text x="80" y="154" font-size="11" fill="#5c1414">[INFO] Running com.example.FooTest</text>
  <text x="80" y="170" font-size="11" fill="#5c1414">[INFO] Tests run: 214, Failures: 1 ...</text>
  <text x="80" y="186" font-size="11" fill="#5c1414">... full Surefire/JaCoCo/SARIF text ...</text>
  <text x="80" y="202" font-size="11" fill="#5c1414">... every passing test line too ...</text>
  <text x="80" y="218" font-size="11" fill="#5c1414">[thousands of lines, every re-run]</text>

  <path d="M 230 238 L 230 268" stroke="#8a1c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="245" y="258" font-size="11" fill="#5c1414">stays in context</text>

  <rect x="60" y="272" width="340" height="60" rx="8" fill="#fbeaea" stroke="#8a1c1c" stroke-width="2"/>
  <text x="230" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c1414">Every later turn re-reads</text>
  <text x="230" y="314" text-anchor="middle" font-size="12" fill="#5c1414">the whole raw log again</text>

  <text x="230" y="360" text-anchor="middle" font-size="12" fill="#5c1414">Effect: the log's full token</text>
  <text x="230" y="378" text-anchor="middle" font-size="12" fill="#5c1414">cost is paid on every turn</text>
  <text x="230" y="396" text-anchor="middle" font-size="12" fill="#5c1414">for the rest of the session,</text>
  <text x="230" y="414" text-anchor="middle" font-size="12" fill="#5c1414">whether or not it is ever</text>
  <text x="230" y="432" text-anchor="middle" font-size="12" fill="#5c1414">read again.</text>

  <!-- ===================== RIGHT: GATE RUNNER ===================== -->
  <rect x="560" y="88" width="340" height="150" rx="8" fill="#eaf1fb" stroke="#1c5c8a" stroke-width="2"/>
  <text x="730" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#123a5c">iru-gate-runner's own context (isolated)</text>
  <text x="580" y="136" font-size="11" fill="#123a5c">Skill({skill: "iru-java-test"})</text>
  <text x="580" y="154" font-size="11" fill="#123a5c">[INFO] Running com.example.FooTest</text>
  <text x="580" y="170" font-size="11" fill="#123a5c">[INFO] Tests run: 214, Failures: 1 ...</text>
  <text x="580" y="186" font-size="11" fill="#123a5c">... full Surefire text stays here ...</text>
  <text x="580" y="202" font-size="11" fill="#123a5c">... never returned to the caller ...</text>
  <text x="580" y="218" font-size="11" fill="#123a5c">discarded when the agent exits</text>

  <path d="M 730 238 L 730 268" stroke="#1c5c8a" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="745" y="258" font-size="11" fill="#123a5c">reports back only</text>

  <rect x="560" y="272" width="340" height="60" rx="8" fill="#eaf1fb" stroke="#1c5c8a" stroke-width="2"/>
  <text x="730" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#123a5c">"1 failure: FooTest#bar --</text>
  <text x="730" y="310" text-anchor="middle" font-size="12" fill="#123a5c">expected 3 got 4 (Foo.java:42)"</text>

  <text x="730" y="360" text-anchor="middle" font-size="12" fill="#123a5c">Effect: only the compact</text>
  <text x="730" y="378" text-anchor="middle" font-size="12" fill="#123a5c">summary enters the caller's</text>
  <text x="730" y="396" text-anchor="middle" font-size="12" fill="#123a5c">context and stays there --</text>
  <text x="730" y="414" text-anchor="middle" font-size="12" fill="#123a5c">the raw log's token cost is</text>
  <text x="730" y="432" text-anchor="middle" font-size="12" fill="#123a5c">paid once, inside the agent.</text>

  <!-- Divider -->
  <line x1="480" y1="80" x2="480" y2="450" stroke="#cccccc" stroke-width="1"/>

  <!-- Bottom note -->
  <rect x="60" y="466" width="840" height="76" rx="8" fill="#f4f4f4" stroke="#666666" stroke-width="1.5"/>
  <text x="480" y="490" text-anchor="middle" font-size="12" fill="#333333">Same underlying tool output on both sides -- the difference is where it is read. A naive gate reads the</text>
  <text x="480" y="508" text-anchor="middle" font-size="12" fill="#333333">report into the caller's own context; iru-gate-runner reads it inside a forked agent (tools: Skill, Bash, Read)</text>
  <text x="480" y="526" text-anchor="middle" font-size="12" fill="#333333">and returns a pass/fail-plus-counts summary, per its own "What you report back" contract.</text>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a1c1c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1c5c8a"/>
    </marker>
  </defs>
</svg>
