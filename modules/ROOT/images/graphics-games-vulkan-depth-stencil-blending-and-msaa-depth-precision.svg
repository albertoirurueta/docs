<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dsb-depth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where the depth values land: standard vs reversed-Z</text>
<text x="20" y="64" font-size="14" font-weight="bold" fill="#3730A3">Standard (near maps to 0, far maps to 1)</text>
<line x1="40" y1="110" x2="720" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dsb-depth)"/>
<text x="40" y="132" font-size="11" fill="#374151">near: depth 0</text>
<text x="640" y="132" font-size="11" fill="#374151">far: depth 1</text>
<rect x="40" y="80" width="150" height="22" rx="4" fill="#D1FAE5" stroke="#047857"/>
<text x="115" y="95" text-anchor="middle" font-size="10" fill="#065F46">most of the float resolution</text>
<rect x="190" y="80" width="530" height="22" rx="4" fill="#FEF3C7" stroke="#B45309"/>
<text x="455" y="95" text-anchor="middle" font-size="10" fill="#92400E">1/z mapping crowds distant values near 1, where floats are coarse</text>
<text x="20" y="184" font-size="14" font-weight="bold" fill="#3730A3">Reversed-Z (near maps to 1, far maps to 0)</text>
<line x1="40" y1="230" x2="720" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dsb-depth)"/>
<text x="40" y="252" font-size="11" fill="#374151">near: depth 1</text>
<text x="640" y="252" font-size="11" fill="#374151">far: depth 0</text>
<rect x="40" y="200" width="530" height="22" rx="4" fill="#FEF3C7" stroke="#B45309"/>
<text x="305" y="215" text-anchor="middle" font-size="10" fill="#92400E">1/z crowding now lands near 1, where float values are sparse, which evens out the error</text>
<rect x="570" y="200" width="150" height="22" rx="4" fill="#D1FAE5" stroke="#047857"/>
<text x="645" y="215" text-anchor="middle" font-size="10" fill="#065F46">dense floats near 0</text>
<rect x="20" y="280" width="720" height="62" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="304" text-anchor="middle" font-size="12" fill="#374151">Recipe: D32_SFLOAT depth, clear to 0, compare op GREATER (or GREATER_OR_EQUAL),</text>
<text x="380" y="324" text-anchor="middle" font-size="12" fill="#374151">projection built so near gives 1 and far gives 0, viewport minDepth 0 and maxDepth 1</text>
</svg>
