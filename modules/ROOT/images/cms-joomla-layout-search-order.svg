<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d">
  <title id="t">Joomla layout search order for com_tallpine.trail.card in a child template</title>
  <desc id="d">Seven directories are searched from top to bottom; the first directory that contains the file wins.</desc>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1b2a38">Layout ID com_tallpine.trail.card (child template cassiopeia_tallpine, parent cassiopeia)</text>
  <text x="20" y="48" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#44566a">The first directory that contains com_tallpine/trail/card.php (or the path below it) supplies the file.</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1b2a38">
    <rect x="20" y="64" width="720" height="44" rx="6" fill="#fdf0d5" stroke="#b7791f"/>
    <text x="34" y="83" font-weight="bold">1  $basePath (only when the caller passes one)</text>
    <text x="34" y="100" font-family="Menlo, Consolas, monospace" font-size="11">JPATH_ROOT/modules/mod_tallpine_nexthikes/layouts</text>

    <rect x="20" y="116" width="720" height="44" rx="6" fill="#e3f1e6" stroke="#2f855a"/>
    <text x="34" y="135" font-weight="bold">2  Component override in the active template</text>
    <text x="34" y="152" font-family="Menlo, Consolas, monospace" font-size="11">templates/cassiopeia_tallpine/html/layouts/com_tallpine/com_tallpine/trail/card.php</text>

    <rect x="20" y="168" width="720" height="44" rx="6" fill="#e3f1e6" stroke="#2f855a"/>
    <text x="34" y="187" font-weight="bold">2a  Component override in the parent template</text>
    <text x="34" y="204" font-family="Menlo, Consolas, monospace" font-size="11">templates/cassiopeia/html/layouts/com_tallpine/com_tallpine/trail/card.php</text>

    <rect x="20" y="220" width="720" height="44" rx="6" fill="#e1ecf8" stroke="#2b6cb0"/>
    <text x="34" y="239" font-weight="bold">3  The component's own layouts folder (site or administrator by client)</text>
    <text x="34" y="256" font-family="Menlo, Consolas, monospace" font-size="11">components/com_tallpine/layouts/com_tallpine/trail/card.php</text>

    <rect x="20" y="272" width="720" height="44" rx="6" fill="#e3f1e6" stroke="#2f855a"/>
    <text x="34" y="291" font-weight="bold">4  General layout override in the active template</text>
    <text x="34" y="308" font-family="Menlo, Consolas, monospace" font-size="11">templates/cassiopeia_tallpine/html/layouts/com_tallpine/trail/card.php</text>

    <rect x="20" y="324" width="720" height="44" rx="6" fill="#e3f1e6" stroke="#2f855a"/>
    <text x="34" y="343" font-weight="bold">4a  General layout override in the parent template</text>
    <text x="34" y="360" font-family="Menlo, Consolas, monospace" font-size="11">templates/cassiopeia/html/layouts/com_tallpine/trail/card.php</text>

    <rect x="20" y="376" width="720" height="44" rx="6" fill="#e1ecf8" stroke="#2b6cb0"/>
    <text x="34" y="395" font-weight="bold">5  Core layouts (lowest priority)</text>
    <text x="34" y="412" font-family="Menlo, Consolas, monospace" font-size="11">layouts/com_tallpine/trail/card.php</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#44566a">
    <rect x="20" y="432" width="14" height="14" fill="#e3f1e6" stroke="#2f855a"/><text x="40" y="444">template override (yours)</text>
    <rect x="210" y="432" width="14" height="14" fill="#e1ecf8" stroke="#2b6cb0"/><text x="230" y="444">extension or core file</text>
    <rect x="390" y="432" width="14" height="14" fill="#fdf0d5" stroke="#b7791f"/><text x="410" y="444">caller-supplied path</text>
    <text x="20" y="464">Steps 2 and 2a are skipped when no component applies; 2a, 4a and the parent paths exist only for a child template.</text>
  </g>
</svg>
