<text x="20" y="432" font-size="10.5" font-weight="normal" fill="#374151" text-anchor="start">Still needed: glBindVertexArray, glUseProgram and glBindFramebuffer(GL_DRAW_FRAMEBUFFER, ...) before drawing; glBindBufferBase for UBO and SSBO slots.</text>
