<text x="380.0" y="111.7" text-anchor="middle" font-size="12" fill="#1F2937">variables</text>
<text x="380.0" y="126.7" text-anchor="middle" font-size="12" fill="#1F2937">Speed, bIsFalling,</text>
<text x="380.0" y="141.7" text-anchor="middle" font-size="12" fill="#1F2937">AimPitch</text>
