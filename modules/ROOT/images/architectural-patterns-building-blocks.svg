<svg viewBox="0 0 780 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="540" fill="#ffffff"/>

  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Tactical building blocks and the dependency directions allowed between them</text>

  <defs>
    <marker id="bb-arrow-app" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="bb-arrow-support" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
    <marker id="bb-arrow-domain" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
  </defs>

  <!-- Application Service: top center -->
  <rect x="290" y="55" width="200" height="60" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="2.2"/>
  <text x="390" y="80" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Application Service</text>
  <text x="390" y="96" font-size="9.5" fill="#444444" text-anchor="middle">use-case orchestrator, @Transactional</text>

  <!-- Domain Service: mid left -->
  <rect x="60" y="165" width="180" height="60" rx="8" fill="#f6eefb" stroke="#7a3b8f" stroke-width="1.8"/>
  <text x="150" y="190" font-size="13" font-weight="bold" fill="#7a3b8f" text-anchor="middle">Domain Service</text>
  <text x="150" y="206" font-size="9.5" fill="#444444" text-anchor="middle">stateless domain logic</text>

  <!-- Repository: mid right (interface) -->
  <rect x="540" y="165" width="180" height="60" rx="8" fill="#f4f4f4" stroke="#666666" stroke-width="1.8"/>
  <text x="630" y="188" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">Repository</text>
  <text x="630" y="203" font-size="9" fill="#666666" text-anchor="middle">interface, in the domain layer --</text>
  <text x="630" y="215" font-size="9" fill="#666666" text-anchor="middle">impl. lives in infrastructure</text>

  <!-- Factory: lower left -->
  <rect x="60" y="275" width="180" height="60" rx="8" fill="#f4f4f4" stroke="#666666" stroke-width="1.8"/>
  <text x="150" y="300" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">Factory</text>
  <text x="150" y="316" font-size="9.5" fill="#666666" text-anchor="middle">static method or dedicated class</text>

  <!-- Aggregate Root: center -->
  <rect x="290" y="270" width="200" height="70" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="2.2"/>
  <text x="390" y="297" font-size="14" font-weight="bold" fill="#2d6a34" text-anchor="middle">Aggregate Root</text>
  <text x="390" y="313" font-size="9.5" fill="#444444" text-anchor="middle">e.g. Order -- one per transaction</text>
  <text x="390" y="327" font-size="9" fill="#666666" text-anchor="middle">enforces its own invariants</text>

  <!-- Entity: bottom left -->
  <rect x="170" y="415" width="170" height="58" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="255" y="439" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Entity</text>
  <text x="255" y="454" font-size="9" fill="#666666" text-anchor="middle">local identity inside the aggregate</text>

  <!-- Value Object: bottom right -->
  <rect x="440" y="415" width="170" height="58" rx="8" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="525" y="439" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Value Object</text>
  <text x="525" y="454" font-size="9" fill="#666666" text-anchor="middle">e.g. Money -- attribute equality</text>

  <!-- Application Service -> Domain Service -->
  <line x1="315" y1="115" x2="185" y2="163" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#bb-arrow-app)"/>
  <text x="225" y="140" font-size="9.5" fill="#1c4b73" text-anchor="middle" transform="rotate(-25 225 140)">uses</text>

  <!-- Application Service -> Repository -->
  <line x1="465" y1="115" x2="595" y2="163" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#bb-arrow-app)"/>
  <text x="555" y="140" font-size="9.5" fill="#1c4b73" text-anchor="middle" transform="rotate(25 555 140)">uses</text>

  <!-- Application Service -> Aggregate Root -->
  <line x1="390" y1="115" x2="390" y2="268" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#bb-arrow-app)"/>
  <text x="404" y="195" font-size="9.5" fill="#1c4b73" text-anchor="start">loads / invokes / saves</text>

  <!-- Factory -> Aggregate Root -->
  <line x1="240" y1="305" x2="288" y2="305" stroke="#666666" stroke-width="1.8" marker-end="url(#bb-arrow-support)"/>
  <text x="264" y="298" font-size="9" fill="#666666" text-anchor="middle">creates</text>

  <!-- Repository -> Aggregate Root -->
  <line x1="595" y1="225" x2="478" y2="278" stroke="#666666" stroke-width="1.8" marker-end="url(#bb-arrow-support)"/>
  <text x="560" y="245" font-size="9" fill="#666666" text-anchor="middle" transform="rotate(25 560 245)">persists / loads</text>

  <!-- Aggregate Root -> Entity -->
  <line x1="345" y1="340" x2="270" y2="413" stroke="#2d6a34" stroke-width="1.8" marker-end="url(#bb-arrow-domain)"/>
  <text x="285" y="380" font-size="9" fill="#2d6a34" text-anchor="middle" transform="rotate(45 285 380)">contains</text>

  <!-- Aggregate Root -> Value Object -->
  <line x1="435" y1="340" x2="510" y2="413" stroke="#2d6a34" stroke-width="1.8" marker-end="url(#bb-arrow-domain)"/>
  <text x="495" y="380" font-size="9" fill="#2d6a34" text-anchor="middle" transform="rotate(-45 495 380)">contains</text>

  <text x="390" y="500" font-size="10.5" fill="#444444" text-anchor="middle">Every arrow points the direction a dependency is allowed to run. No arrow ever points back at Application</text>
  <text x="390" y="515" font-size="10.5" fill="#444444" text-anchor="middle">Service from the domain layer, and nothing outside Repository ever points at its implementation -- only its interface.</text>
</svg>
