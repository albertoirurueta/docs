<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-b01-bp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Blinn-Phong vectors at one point of the book cover</text>
<line x1="60" y1="300" x2="480" y2="300" stroke="#1F2937" stroke-width="3"/>
<line x1="270" y1="300" x2="270" y2="150" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-vk-b01-bp)"/>
<text x="256" y="150" text-anchor="middle" font-size="14" fill="#047857" font-weight="bold">N</text>
<line x1="270" y1="300" x2="160" y2="180" stroke="#B45309" stroke-width="2.5" marker-end="url(#ah-vk-b01-bp)"/>
<text x="134" y="184" text-anchor="middle" font-size="14" fill="#B45309" font-weight="bold">L</text>
<line x1="270" y1="300" x2="390" y2="190" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ah-vk-b01-bp)"/>
<text x="404" y="186" text-anchor="middle" font-size="14" fill="#4F46E5" font-weight="bold">V</text>
<line x1="270" y1="300" x2="276" y2="170" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#ah-vk-b01-bp)"/>
<text x="286" y="164" text-anchor="middle" font-size="14" fill="#B91C1C" font-weight="bold">H</text>
<circle cx="160" cy="180" r="10" fill="#FEF3C7" stroke="#B45309"/>
<text x="95" y="150" text-anchor="start" font-size="11" fill="#374151">desk lamp</text>
<text x="430" y="190" text-anchor="start" font-size="11" fill="#374151">camera</text>
<text x="270" y="322" text-anchor="middle" font-size="11" fill="#374151">cover surface point</text>
<rect x="520" y="60" width="220" height="250" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="630.0" y="107.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Terms</text>
<text x="630.0" y="122.0" text-anchor="middle" font-size="11" fill="#3730A3"></text>
<text x="630.0" y="137.0" text-anchor="middle" font-size="11" fill="#3730A3">N  surface normal</text>
<text x="630.0" y="152.0" text-anchor="middle" font-size="11" fill="#3730A3">L  to the lamp</text>
<text x="630.0" y="167.0" text-anchor="middle" font-size="11" fill="#3730A3">V  to the camera</text>
<text x="630.0" y="182.0" text-anchor="middle" font-size="11" fill="#3730A3">H = normalize(L + V)</text>
<text x="630.0" y="197.0" text-anchor="middle" font-size="11" fill="#3730A3"></text>
<text x="630.0" y="212.0" text-anchor="middle" font-size="11" fill="#3730A3">diffuse = max(N . L, 0)</text>
<text x="630.0" y="227.0" text-anchor="middle" font-size="11" fill="#3730A3">specular = max(N . H, 0)^shine</text>
<text x="630.0" y="242.0" text-anchor="middle" font-size="11" fill="#3730A3"></text>
<text x="630.0" y="257.0" text-anchor="middle" font-size="11" fill="#3730A3">H is cheaper than the</text>
<text x="630.0" y="272.0" text-anchor="middle" font-size="11" fill="#3730A3">mirror vector R of Phong</text>
</svg>
