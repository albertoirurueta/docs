<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-security-cors-and-privacy-fingerprinting" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What a WebGL context can reveal about a device</text>
<rect x="280" y="50" width="200" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="76.5" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">getContext('webgl2')</text>
<line x1="380" y1="94" x2="130" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-security-cors-and-privacy-fingerprinting)"/>
<rect x="20" y="130" width="220" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="130.0" y="169.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Capabilities</text>
<text x="130.0" y="184.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">getParameter limits</text>
<text x="130.0" y="199.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MAX_TEXTURE_SIZE ...</text>
<text x="130.0" y="214.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">supported extensions</text>
<text x="130.0" y="229.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">shader precision</text>
<line x1="380" y1="94" x2="380" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-security-cors-and-privacy-fingerprinting)"/>
<rect x="270" y="130" width="220" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="169.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Driver strings</text>
<text x="380.0" y="184.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">VENDOR / RENDERER</text>
<text x="380.0" y="199.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">masked by default</text>
<text x="380.0" y="214.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">UNMASKED_* via</text>
<text x="380.0" y="229.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">WEBGL_debug_renderer_info</text>
<line x1="380" y1="94" x2="630" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-security-cors-and-privacy-fingerprinting)"/>
<rect x="520" y="130" width="220" height="130" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630.0" y="169.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Rendered output</text>
<text x="630.0" y="184.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">draw a scene</text>
<text x="630.0" y="199.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">readPixels / toDataURL</text>
<text x="630.0" y="214.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">tiny GPU and driver</text>
<text x="630.0" y="229.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">differences in pixels</text>
<rect x="20" y="285" width="720" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="309.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Mitigations: browsers mask or round values, gate the unmasked strings behind privacy settings, and limit timers.</text>
<text x="380.0" y="323.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Your code: request only the data needed, avoid collecting renderer strings, and treat them as personal data.</text>
</svg>
