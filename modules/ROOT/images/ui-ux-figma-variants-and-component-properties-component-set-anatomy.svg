<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of a component set: the Bookshelf button</text>
  <rect x="30" y="50" width="400" height="230" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="44" y="72" font-size="13" font-weight="bold" fill="#3730A3">Component set "Button"</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="50" y="90" width="170" height="70" rx="6"/><rect x="240" y="90" width="170" height="70" rx="6"/><rect x="50" y="180" width="170" height="70" rx="6"/><rect x="240" y="180" width="170" height="70" rx="6"/></g>
  <g fill="#4F46E5"><rect x="80" y="112" width="110" height="26" rx="13"/><rect x="270" y="112" width="110" height="26" rx="13" fill="#3730A3"/><rect x="80" y="202" width="110" height="26" rx="13" fill="#9CA3AF"/><rect x="270" y="202" width="110" height="26" rx="13" fill="#FFFFFF" stroke="#4F46E5"/></g>
  <g font-size="11" fill="#374151" text-anchor="middle"><text x="135" y="154">Type=Primary, State=Default</text><text x="325" y="154">Type=Primary, State=Hover</text><text x="135" y="244">Type=Primary, State=Disabled</text><text x="325" y="244">Type=Ghost, State=Default</text></g>
  <text x="230" y="272" font-size="11" fill="#6B7280" text-anchor="middle">Each variant is a main component with a unique combination of values</text>
  <path d="M432,165 L498,165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="465" y="156" font-size="11" fill="#374151" text-anchor="middle">drag out</text>
  <rect x="502" y="90" width="226" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="515" y="112" font-size="13" font-weight="bold" fill="#3730A3">Instance of Button</text>
  <rect x="530" y="128" width="170" height="30" rx="15" fill="#4F46E5"/><text x="615" y="148" font-size="12" fill="#FFFFFF" text-anchor="middle">Add to shelf</text>
  <text x="515" y="186" font-size="12" fill="#374151">Type: Primary  State: Default</text>
  <text x="515" y="206" font-size="12" fill="#374151">Label: text override</text>
  <text x="515" y="226" font-size="12" fill="#374151">Show icon: on or off</text>
  <g fill="#B45309"><circle cx="44" cy="318" r="11"/></g><text x="44" y="322" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="64" y="322" font-size="12" fill="#374151">The top-left variant is the default: it is what a new instance shows, and the Assets tab previews it.</text>
</svg>
