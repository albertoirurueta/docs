<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Where each CRUD object keeps its data</title>
  <desc id="d">A table with one row per CRUD object. Products, variations and coupons are stored as posts with postmeta; customers in the users and usermeta tables; order items, payment tokens and shipping zones in their own WooCommerce tables; orders in the four HPOS tables with a placeholder post, or in posts and postmeta when the legacy storage is authoritative. The Pocket Coffee roast lot of this page keeps a row in its own table and its meta in a second table. The data store key column shows the argument of WC_Data_Store::load().</desc>
  <rect x="0" y="0" width="960" height="610" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd3c7"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8908a"/></marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" text-anchor="start" fill="#f2f5f8">One CRUD interface, several kinds of storage</text>
  <text x="40" y="54" font-size="12.5" text-anchor="start" fill="#f2f5f8">Core data store keys and tables in WooCommerce 11.2.1; the outlined row is the custom store built on this page</text>
  <rect x="40" y="76" width="880" height="30" rx="6" fill="#34495e"/>
  <text x="50" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">CRUD class</text>
  <text x="245" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">load() key</text>
  <text x="400" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">Data store class</text>
  <text x="665" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#f2f5f8">Tables</text>
  <rect x="40" y="114" width="880" height="38" rx="6" fill="#3d5266"/>
  <text x="50" y="138" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">WC_Product_Simple, ...</text>
  <text x="245" y="138" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">product</text>
  <text x="400" y="138" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">WC_Product_Data_Store_CPT</text>
  <text x="665" y="138" font-size="11.5" text-anchor="start" fill="#f2f5f8">wp_posts, wp_postmeta, lookup</text>
  <rect x="40" y="158" width="880" height="38" rx="6" fill="#3d5266"/>
  <text x="50" y="182" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">WC_Product_Variation</text>
  <text x="245" y="182" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">product-variation</text>
  <text x="400" y="182" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">WC_Product_Variation_Data_Store_CPT</text>
  <text x="665" y="182" font-size="11.5" text-anchor="start" fill="#f2f5f8">wp_posts (product_variation)</text>
  <rect x="40" y="202" width="880" height="38" rx="6" fill="#3d5266"/>
  <text x="50" y="226" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">WC_Coupon</text>
  <text x="245" y="226" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">coupon</text>
  <text x="400" y="226" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">WC_Coupon_Data_Store_CPT</text>
  <text x="665" y="226" font-size="11.5" text-anchor="start" fill="#f2f5f8">wp_posts (shop_coupon), postmeta</text>
  <rect x="40" y="246" width="880" height="38" rx="6" fill="#4d7c5a"/>
  <text x="50" y="270" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">WC_Order (HPOS on)</text>
  <text x="245" y="270" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">order</text>
  <text x="400" y="270" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">OrdersTableDataStore</text>
  <text x="665" y="270" font-size="11.5" text-anchor="start" fill="#f2f5f8">wc_orders + 3 sibling tables</text>
  <rect x="40" y="290" width="880" height="38" rx="6" fill="#3d5266"/>
  <text x="50" y="314" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">WC_Order (HPOS off)</text>
  <text x="245" y="314" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">order</text>
  <text x="400" y="314" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">WC_Order_Data_Store_CPT</text>
  <text x="665" y="314" font-size="11.5" text-anchor="start" fill="#f2f5f8">wp_posts (shop_order), postmeta</text>
  <rect x="40" y="334" width="880" height="38" rx="6" fill="#4d7c5a"/>
  <text x="50" y="358" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">WC_Order_Item_Product, ...</text>
  <text x="245" y="358" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">order-item-product</text>
  <text x="400" y="358" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">WC_Order_Item_Product_Data_Store</text>
  <text x="665" y="358" font-size="11.5" text-anchor="start" fill="#f2f5f8">woocommerce_order_items + meta</text>
  <rect x="40" y="378" width="880" height="38" rx="6" fill="#6b5b95"/>
  <text x="50" y="402" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">WC_Customer</text>
  <text x="245" y="402" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">customer</text>
  <text x="400" y="402" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">WC_Customer_Data_Store</text>
  <text x="665" y="402" font-size="11.5" text-anchor="start" fill="#f2f5f8">wp_users, wp_usermeta</text>
  <rect x="40" y="422" width="880" height="38" rx="6" fill="#4d7c5a"/>
  <text x="50" y="446" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">WC_Payment_Token_CC, ...</text>
  <text x="245" y="446" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">payment-token</text>
  <text x="400" y="446" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">WC_Payment_Token_Data_Store</text>
  <text x="665" y="446" font-size="11.5" text-anchor="start" fill="#f2f5f8">woocommerce_payment_tokens + meta</text>
  <rect x="40" y="466" width="880" height="38" rx="6" fill="#4d7c5a"/>
  <text x="50" y="490" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">WC_Shipping_Zone</text>
  <text x="245" y="490" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">shipping-zone</text>
  <text x="400" y="490" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">WC_Shipping_Zone_Data_Store</text>
  <text x="665" y="490" font-size="11.5" text-anchor="start" fill="#f2f5f8">woocommerce_shipping_zones + more</text>
  <rect x="40" y="510" width="880" height="38" rx="6" fill="#2e8b6a" stroke="#f4b860" stroke-width="2"/>
  <text x="50" y="534" font-size="12.5" font-weight="bold" text-anchor="start" fill="#f2f5f8">PC_Roast_Lot (this page)</text>
  <text x="245" y="534" font-size="12" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">pocket-coffee-lot</text>
  <text x="400" y="534" font-size="11" text-anchor="start" fill="#f2f5f8" font-family="Menlo, Consolas, monospace">PC_Roast_Lot_Data_Store</text>
  <text x="665" y="534" font-size="11.5" text-anchor="start" fill="#f2f5f8">pocket_coffee_lots + lotmeta</text>
  <rect x="40" y="560" width="14" height="14" rx="3" fill="#3d5266"/>  <text x="60" y="572" font-size="12" text-anchor="start" fill="#f2f5f8">WordPress posts and postmeta</text>
  <rect x="290" y="560" width="14" height="14" rx="3" fill="#4d7c5a"/>  <text x="310" y="572" font-size="12" text-anchor="start" fill="#f2f5f8">WooCommerce custom tables</text>
  <rect x="520" y="560" width="14" height="14" rx="3" fill="#6b5b95"/>  <text x="540" y="572" font-size="12" text-anchor="start" fill="#f2f5f8">WordPress users and usermeta</text>
  <rect x="760" y="560" width="14" height="14" rx="3" fill="#2e8b6a"/>  <text x="780" y="572" font-size="12" text-anchor="start" fill="#f2f5f8">a store you add</text>
</svg>
