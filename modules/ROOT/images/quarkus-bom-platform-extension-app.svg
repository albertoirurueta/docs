<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From BOM to your application</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">solid arrows: version pinning / transitive dependency -- each stage narrows to one concrete artifact</text>

  <!-- BOM -->
  <rect x="20" y="90" width="160" height="100" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="100" y="116" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">BOM</text>
  <text x="100" y="134" font-size="10.5" fill="#333333" text-anchor="middle">quarkus-bom</text>
  <text x="100" y="150" font-size="10.5" fill="#333333" text-anchor="middle">pins one tested version</text>
  <text x="100" y="164" font-size="10.5" fill="#333333" text-anchor="middle">for every first-party</text>
  <text x="100" y="178" font-size="10.5" fill="#333333" text-anchor="middle">extension artifact</text>

  <!-- Platform -->
  <rect x="220" y="90" width="160" height="100" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="300" y="116" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Platform</text>
  <text x="300" y="134" font-size="10.5" fill="#333333" text-anchor="middle">the curated set of</text>
  <text x="300" y="148" font-size="10.5" fill="#333333" text-anchor="middle">first-party extensions</text>
  <text x="300" y="162" font-size="10.5" fill="#333333" text-anchor="middle">released together and</text>
  <text x="300" y="176" font-size="10.5" fill="#333333" text-anchor="middle">covered by the BOM</text>

  <!-- Extension -->
  <rect x="420" y="90" width="160" height="100" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="500" y="116" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Extension</text>
  <text x="500" y="134" font-size="10.5" fill="#333333" text-anchor="middle">a single artifact, e.g.</text>
  <text x="500" y="148" font-size="10.5" fill="#333333" text-anchor="middle">quarkus-hibernate-orm</text>
  <text x="500" y="164" font-size="10.5" fill="#333333" text-anchor="middle">no explicit &lt;version&gt;</text>
  <text x="500" y="178" font-size="10.5" fill="#333333" text-anchor="middle">in the app's POM</text>

  <!-- Your App -->
  <rect x="600" y="90" width="140" height="100" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="670" y="116" font-size="13" font-weight="bold" fill="#a33" text-anchor="middle">Your App</text>
  <text x="670" y="134" font-size="10.5" fill="#333333" text-anchor="middle">depends on the</text>
  <text x="670" y="148" font-size="10.5" fill="#333333" text-anchor="middle">extension, inherits</text>
  <text x="670" y="164" font-size="10.5" fill="#333333" text-anchor="middle">the pinned version</text>
  <text x="670" y="178" font-size="10.5" fill="#333333" text-anchor="middle">transitively</text>

  <!-- arrows -->
  <line x1="180" y1="140" x2="220" y2="140" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="200" y="128" font-size="9.5" fill="#333333" text-anchor="middle">pins</text>

  <line x1="380" y1="140" x2="420" y2="140" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="400" y="128" font-size="9.5" fill="#333333" text-anchor="middle">includes</text>

  <line x1="580" y1="140" x2="600" y2="140" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="590" y="128" font-size="9.5" fill="#333333" text-anchor="middle"> </text>

  <!-- caption -->
  <text x="380" y="260" font-size="10.5" fill="#666666" text-anchor="middle">Importing quarkus-bom in dependencyManagement, then adding an extension with no version, is what keeps</text>
  <text x="380" y="276" font-size="10.5" fill="#666666" text-anchor="middle">every extension in an application on the same tested, mutually compatible set of versions</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
