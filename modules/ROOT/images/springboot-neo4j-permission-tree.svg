<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#888888"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#1e8449"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#2471a3"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Inherited permission path: user, groups, role, resource tree</text>

  <text x="100" y="62" font-size="12.5" font-weight="bold" fill="#555555" text-anchor="middle">Subjects</text>
  <text x="320" y="62" font-size="12.5" font-weight="bold" fill="#555555" text-anchor="middle">Roles</text>
  <text x="560" y="62" font-size="12.5" font-weight="bold" fill="#555555" text-anchor="middle">Resources</text>

  <!-- membership chain (bottom to top) -->
  <line x1="100" y1="310" x2="100" y2="272" stroke="#1e8449" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="110" y="295" font-size="11.5" fill="#1e8449">MEMBER_OF</text>
  <line x1="100" y1="230" x2="100" y2="192" stroke="#1e8449" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="110" y="215" font-size="11.5" fill="#1e8449">MEMBER_OF</text>

  <!-- group roles -->
  <line x1="160" y1="170" x2="265" y2="170" stroke="#1e8449" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="212" y="162" font-size="11.5" fill="#1e8449" text-anchor="middle">HAS_ROLE</text>
  <line x1="160" y1="250" x2="265" y2="250" stroke="#2471a3" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="212" y="242" font-size="11.5" fill="#2471a3" text-anchor="middle">HAS_ROLE</text>

  <!-- grants -->
  <line x1="375" y1="170" x2="505" y2="170" stroke="#1e8449" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="440" y="162" font-size="11.5" fill="#1e8449" text-anchor="middle">CAN_READ</text>
  <line x1="375" y1="250" x2="505" y2="250" stroke="#2471a3" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="440" y="242" font-size="11.5" fill="#2471a3" text-anchor="middle">CAN_WRITE</text>

  <!-- resource hierarchy (child points to parent) -->
  <line x1="560" y1="310" x2="560" y2="272" stroke="#888888" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="570" y="295" font-size="11.5" fill="#666666">CHILD_OF</text>
  <line x1="560" y1="230" x2="560" y2="192" stroke="#888888" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="570" y="215" font-size="11.5" fill="#666666">CHILD_OF</text>
  <line x1="560" y1="150" x2="560" y2="112" stroke="#888888" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="570" y="135" font-size="11.5" fill="#666666">CHILD_OF</text>

  <!-- subject nodes -->
  <rect x="40" y="310" width="120" height="40" rx="20" fill="#e8f1fb" stroke="#2471a3" stroke-width="2"/>
  <text x="100" y="335" font-size="14" font-weight="bold" fill="#1b4f72" text-anchor="middle">User alice</text>
  <rect x="40" y="230" width="120" height="40" rx="8" fill="#fdf2e0" stroke="#d68910" stroke-width="2"/>
  <text x="100" y="255" font-size="13" font-weight="bold" fill="#7e5109" text-anchor="middle">backend-team</text>
  <rect x="40" y="150" width="120" height="40" rx="8" fill="#fdf2e0" stroke="#d68910" stroke-width="2"/>
  <text x="100" y="175" font-size="13" font-weight="bold" fill="#7e5109" text-anchor="middle">engineering</text>

  <!-- role nodes -->
  <rect x="265" y="150" width="110" height="40" rx="8" fill="#eaf6ee" stroke="#1e8449" stroke-width="2"/>
  <text x="320" y="175" font-size="13" font-weight="bold" fill="#145a32" text-anchor="middle">reader-eng</text>
  <rect x="265" y="230" width="110" height="40" rx="8" fill="#eaf6ee" stroke="#1e8449" stroke-width="2"/>
  <text x="320" y="255" font-size="13" font-weight="bold" fill="#145a32" text-anchor="middle">editor-design</text>

  <!-- resource nodes -->
  <rect x="505" y="70" width="110" height="40" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="2"/>
  <text x="560" y="95" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">wiki</text>
  <rect x="505" y="150" width="110" height="40" rx="8" fill="#f4f4f4" stroke="#1e8449" stroke-width="2.6"/>
  <text x="560" y="175" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">eng</text>
  <rect x="505" y="230" width="110" height="40" rx="8" fill="#f4f4f4" stroke="#2471a3" stroke-width="2.6"/>
  <text x="560" y="255" font-size="13" font-weight="bold" fill="#444444" text-anchor="middle">design</text>
  <rect x="505" y="310" width="110" height="40" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.6"/>
  <text x="560" y="335" font-size="13" font-weight="bold" fill="#7a1f1f" text-anchor="middle">adr-1</text>

  <!-- explanation -->
  <text x="360" y="386" font-size="12.5" fill="#333333" text-anchor="middle">alice reads adr-1: engineering has reader-eng on eng, and adr-1 is a descendant of eng.</text>
  <text x="360" y="406" font-size="12.5" fill="#333333" text-anchor="middle">alice writes adr-1: backend-team has editor-design on design, the parent of adr-1.</text>
  <text x="360" y="426" font-size="11.5" fill="#777777" text-anchor="middle">Green: inherited read path. Blue: inherited write path. Grey: resource hierarchy.</text>
</svg>
