<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Bookshelf GL frame: MSAA scene, resolve, tone map</text>
<rect x="20" y="90" width="150" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="95.0" y="119.0" text-anchor="middle" font-size="12" fill="#92400E">Multisample FBO</text>
<text x="95.0" y="134.0" text-anchor="middle" font-size="12" fill="#92400E">RGBA16F renderbuffer</text>
<text x="95.0" y="149.0" text-anchor="middle" font-size="12" fill="#92400E">4 samples + depth</text>
<rect x="205" y="90" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="280.0" y="119.0" text-anchor="middle" font-size="12" fill="#3730A3">Resolve FBO</text>
<text x="280.0" y="134.0" text-anchor="middle" font-size="12" fill="#3730A3">RGBA16F texture</text>
<text x="280.0" y="149.0" text-anchor="middle" font-size="12" fill="#3730A3">1 sample</text>
<rect x="390" y="90" width="150" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="465.0" y="119.0" text-anchor="middle" font-size="12" fill="#3730A3">Tone-map pass</text>
<text x="465.0" y="134.0" text-anchor="middle" font-size="12" fill="#3730A3">exposure + curve</text>
<text x="465.0" y="149.0" text-anchor="middle" font-size="12" fill="#3730A3">+ sRGB encode</text>
<rect x="575" y="90" width="150" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="119.0" text-anchor="middle" font-size="12" fill="#065F46">Window</text>
<text x="650.0" y="134.0" text-anchor="middle" font-size="12" fill="#065F46">8-bit default</text>
<text x="650.0" y="149.0" text-anchor="middle" font-size="12" fill="#065F46">framebuffer</text>
<line x1="170" y1="130" x2="203" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="187" y="200" text-anchor="middle" font-size="10" fill="#374151"></text>
<line x1="355" y1="130" x2="388" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="372" y="200" text-anchor="middle" font-size="10" fill="#374151"></text>
<line x1="540" y1="130" x2="573" y2="130" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="557" y="200" text-anchor="middle" font-size="10" fill="#374151"></text>
<text x="190" y="208" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">glBlitFramebuffer</text>
<text x="190" y="223" text-anchor="middle" font-size="11" fill="#374151">(resolve)</text>
<text x="375" y="208" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">sample the HDR texture</text>
<text x="560" y="208" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">clamped to 0..1 now</text>
<rect x="20" y="245" width="720" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="267" text-anchor="middle" font-size="12" fill="#374151">Values above 1.0 survive in the 16-bit float buffers until the tone-map pass.</text>
<text x="380" y="284" text-anchor="middle" font-size="12" fill="#374151">Resolving before tone mapping averages bright and dark samples in linear light.</text>
</svg>
