<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-glsl-es-and-portability-precision-qualif" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Precision qualifiers: guaranteed minimum range and precision (floating point)</text>
<rect x="20" y="46" width="108" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74.0" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Qualifier</text>
<rect x="130" y="46" width="138" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="199.0" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Minimum range</text>
<rect x="270" y="46" width="148" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="344.0" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Minimum precision</text>
<rect x="420" y="46" width="138" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="489.0" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Typical hardware</text>
<rect x="560" y="46" width="180" height="30" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="650.0" y="66" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Use it for</text>
<rect x="20" y="84" width="108" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="74.0" y="111" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">lowp</text>
<rect x="130" y="84" width="138" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="199.0" y="111" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">-2 to 2</text>
<rect x="270" y="84" width="148" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="344.0" y="111" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">2^-8 (absolute)</text>
<rect x="420" y="84" width="138" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="489.0" y="111" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">8-bit fixed or half</text>
<rect x="560" y="84" width="180" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="650.0" y="111" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">colours, normalised data</text>
<rect x="20" y="136" width="108" height="44" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74.0" y="163" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">mediump</text>
<rect x="130" y="136" width="138" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="199.0" y="163" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">-2^14 to 2^14</text>
<rect x="270" y="136" width="148" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="344.0" y="163" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">2^-10 (relative)</text>
<rect x="420" y="136" width="138" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="489.0" y="163" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">16-bit half float</text>
<rect x="560" y="136" width="180" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="650.0" y="163" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">colours, UVs of small textures</text>
<rect x="20" y="188" width="108" height="44" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="74.0" y="215" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">highp</text>
<rect x="130" y="188" width="138" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="199.0" y="215" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">-2^62 to 2^62</text>
<rect x="270" y="188" width="148" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="344.0" y="215" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">2^-16 (relative)</text>
<rect x="420" y="188" width="138" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="489.0" y="215" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">32-bit float</text>
<rect x="560" y="188" width="180" height="44" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="650.0" y="215" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">positions, matrices, depth, UVs</text>
<text x="380" y="252" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Desktop GLSL accepts the qualifiers and ignores them: every float is at least 32-bit there.</text>
<rect x="60" y="268" width="640" height="70" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="291" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">A mediump position, matrix or large texture coordinate looks fine on a desktop GPU and breaks</text>
<text x="380" y="306" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">on a phone where mediump is a 16-bit half float: shimmering, jitter, banded lighting.</text>
</svg>
