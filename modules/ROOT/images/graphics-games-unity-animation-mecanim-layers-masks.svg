<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-uan-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Animation layers and an Avatar Mask</text>
<text x="100" y="54" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Avatar Mask: Upper Body</text>
<circle cx="100" cy="76" r="13" fill="#D1FAE5" stroke="#4B5563" stroke-width="1.5"/>
<rect x="86" y="92" width="28" height="44" rx="6" fill="#D1FAE5" stroke="#4B5563" stroke-width="1.5"/>
<line x1="86" y1="98" x2="66" y2="126" stroke="#4B5563" stroke-width="5"/>
<line x1="114" y1="98" x2="134" y2="126" stroke="#4B5563" stroke-width="5"/>
<rect x="86" y="140" width="12" height="48" rx="4" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<rect x="102" y="140" width="12" height="48" rx="4" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="100" y="212" text-anchor="middle" font-size="10" fill="#4B5563">green = body parts the mask allows</text>
<rect x="220" y="60" width="350" height="72" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="236" y="82" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Layer 0  Base</text>
<text x="236" y="100" text-anchor="start" font-size="11" fill="#374151">Override, weight 1, no mask</text>
<text x="236" y="118" text-anchor="start" font-size="11" fill="#374151">Idle, Walk, Run in a blend tree</text>
<line x1="570" y1="96" x2="600" y2="96" stroke="#4B5563" stroke-width="1.5"/>
<rect x="220" y="146" width="350" height="72" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="236" y="168" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Layer 1  UpperBody</text>
<text x="236" y="186" text-anchor="start" font-size="11" fill="#374151">Override, weight 0 to 1, mask: Upper Body</text>
<text x="236" y="204" text-anchor="start" font-size="11" fill="#374151">Carry, Reach for book</text>
<line x1="570" y1="182" x2="600" y2="182" stroke="#4B5563" stroke-width="1.5"/>
<rect x="220" y="232" width="350" height="72" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="236" y="254" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">Layer 2  Wobble</text>
<text x="236" y="272" text-anchor="start" font-size="11" fill="#374151">Additive, weight 0 to 1, mask: none</text>
<text x="236" y="290" text-anchor="start" font-size="11" fill="#374151">Small shake on hover</text>
<line x1="570" y1="268" x2="600" y2="268" stroke="#4B5563" stroke-width="1.5"/>
<line x1="600" y1="96" x2="600" y2="268" stroke="#4B5563" stroke-width="1.5"/>
<line x1="600" y1="182" x2="630" y2="182" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-uan-layers)"/>
<rect x="632" y="150" width="110" height="64" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="687" y="176" text-anchor="middle" font-size="12" fill="#374151">Final pose</text>
<text x="687" y="191" text-anchor="middle" font-size="12" fill="#374151">per frame</text>
<rect x="20" y="236" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.2"/>
<text x="32" y="256" text-anchor="start" font-size="10" fill="#374151">Layer settings:</text>
<text x="32" y="269" text-anchor="start" font-size="10" fill="#374151">Mask, Blending,</text>
<text x="32" y="282" text-anchor="start" font-size="10" fill="#374151">Sync, Timing, IK Pass</text>
<text x="32" y="295" text-anchor="start" font-size="10" fill="#374151"></text>
<text x="32" y="308" text-anchor="start" font-size="10" fill="#374151">Weight is set from a</text>
<text x="32" y="321" text-anchor="start" font-size="10" fill="#374151">script with</text>
<text x="32" y="334" text-anchor="start" font-size="10" fill="#374151">Animator.SetLayerWeight</text>
<rect x="220" y="324" width="520" height="34" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="480" y="346" text-anchor="middle" font-size="11" fill="#374151">Layers evaluate from the lowest index up: Override replaces what came before, Additive adds to it.</text>
</svg>
