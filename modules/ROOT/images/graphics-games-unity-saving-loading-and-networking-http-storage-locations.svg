<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-sv1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where Bookshelf data can live: three stores with different jobs</text>
<rect x="25" y="55" width="225" height="250" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="137" y="82" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">PlayerPrefs</text>
<text x="137" y="115" text-anchor="middle" font-size="12" fill="#374151">Small settings:</text>
<text x="137" y="141" text-anchor="middle" font-size="12" fill="#374151">volume, last tab, flags</text>
<text x="137" y="167" text-anchor="middle" font-size="12" fill="#374151">Platform store, no encryption</text>
<text x="137" y="193" text-anchor="middle" font-size="12" fill="#374151">Windows: Registry</text>
<text x="137" y="219" text-anchor="middle" font-size="12" fill="#374151">macOS: .plist, Linux: ~/.config</text>
<text x="137" y="245" text-anchor="middle" font-size="12" fill="#374151">Web: IndexedDB, 1 MB</text>
<rect x="270" y="55" width="225" height="250" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="382" y="82" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">File in persistentDataPath</text>
<text x="382" y="115" text-anchor="middle" font-size="12" fill="#374151">Save games, as JSON</text>
<text x="382" y="141" text-anchor="middle" font-size="12" fill="#374151">Survives app updates</text>
<text x="382" y="167" text-anchor="middle" font-size="12" fill="#374151">Path depends on platform</text>
<text x="382" y="193" text-anchor="middle" font-size="12" fill="#374151">Write to a temp file, then</text>
<text x="382" y="219" text-anchor="middle" font-size="12" fill="#374151">replace the old one</text>
<text x="382" y="245" text-anchor="middle" font-size="12" fill="#374151">Web: IndexedDB file system</text>
<rect x="515" y="55" width="225" height="250" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="627" y="82" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Remote server over HTTP</text>
<text x="627" y="115" text-anchor="middle" font-size="12" fill="#374151">Cloud saves, catalogs,</text>
<text x="627" y="141" text-anchor="middle" font-size="12" fill="#374151">leaderboards</text>
<text x="627" y="167" text-anchor="middle" font-size="12" fill="#374151">UnityWebRequest + JSON</text>
<text x="627" y="193" text-anchor="middle" font-size="12" fill="#374151">Needs network, timeouts</text>
<text x="627" y="219" text-anchor="middle" font-size="12" fill="#374151">and error handling</text>
<text x="627" y="245" text-anchor="middle" font-size="12" fill="#374151">Web builds: CORS applies</text>
<rect x="25" y="325" width="705" height="55" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="377" y="347" text-anchor="middle" font-size="11" fill="#374151">Rule of thumb: preferences go to PlayerPrefs, the game state goes to a JSON file, anything shared goes to a server.</text>
<text x="377" y="365" text-anchor="middle" font-size="11" fill="#374151">Never put secrets in PlayerPrefs, and never trust a file the player can edit without validating it.</text>
</svg>
