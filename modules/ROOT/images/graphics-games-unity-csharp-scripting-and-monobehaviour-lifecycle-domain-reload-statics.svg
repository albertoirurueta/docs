<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Static fields across two Play sessions</text>
<rect x="30" y="50" width="330" height="30" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="69.5" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Domain reload ON (older default)</text>
<rect x="400" y="50" width="330" height="30" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="69.5" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Domain reload OFF (new 6.6 projects)</text>
<rect x="30" y="96" width="150" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="120.2" text-anchor="middle" font-size="12" fill="#3730A3">Session 1</text>
<text x="105.0" y="136.2" text-anchor="middle" font-size="12" fill="#3730A3">counter 0 to 3</text>
<rect x="210" y="96" width="150" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="285.0" y="128.2" text-anchor="middle" font-size="12" fill="#374151">Enter Play Mode</text>
<line x1="180" y1="124" x2="210" y2="124" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="176" width="330" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="200.2" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Session 2 starts with counter = 0</text>
<line x1="285" y1="152" x2="285" y2="176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="400" y="96" width="150" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="475.0" y="120.2" text-anchor="middle" font-size="12" fill="#3730A3">Session 1</text>
<text x="475.0" y="136.2" text-anchor="middle" font-size="12" fill="#3730A3">counter 0 to 3</text>
<rect x="580" y="96" width="150" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="655.0" y="128.2" text-anchor="middle" font-size="12" fill="#374151">Enter Play Mode</text>
<line x1="550" y1="124" x2="580" y2="124" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="400" y="176" width="330" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="200.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Session 2 starts with counter = 3</text>
<line x1="655" y1="152" x2="655" y2="176" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="195" y="240" text-anchor="middle" font-size="11" fill="#374151">The domain is unloaded, so static fields</text>
<text x="195" y="255" text-anchor="middle" font-size="11" fill="#374151">return to their initial values.</text>
<text x="565" y="240" text-anchor="middle" font-size="11" fill="#374151">Statics and static event handlers survive,</text>
<text x="565" y="255" text-anchor="middle" font-size="11" fill="#374151">so session 2 starts with the old values.</text>
<rect x="30" y="280" width="700" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="306.4" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">The fix: reset in code</text>
<text x="380.0" y="321.4" text-anchor="middle" font-size="11" fill="#1F2937">[RuntimeInitializeOnLoadMethod(SubsystemRegistration)] static void Reset() { counter = 0; OnScore = null; }</text>
<rect x="30" y="356" width="700" height="58" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="381.4" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Where it matters</text>
<text x="380.0" y="396.4" text-anchor="middle" font-size="11" fill="#374151">Static singletons, counters and caches, and static events that scripts subscribe to and never leave.</text>
</svg>
