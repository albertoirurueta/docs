<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 436" width="1080" height="436" role="img" aria-labelledby="sap-abap-map-abaplint-terminal-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-abap-map-abaplint-terminal-title">Map of the terminal workflow for ABAP without an SAP system with four numbered regions: npm install, the abaplint check, the transpile step and the run of the transpiled program</title>
<rect x="0" y="0" width="1080" height="436" fill="#181818"/>
<g><rect x="0" y="0" width="1080" height="300" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="268" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm install</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">added packages, audited packages, found 0 vulnerabilities</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npx abaplint</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">src/zhello.prog.abap[3, 1] Line too long (line_length)</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npx abap_transpile</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Transpiling to build/</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ node build/project/zhello.prog.mjs</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">Hello, world</text>
<g><circle cx="1056" cy="56" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1056" y="61" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">1</text></g>
<g><circle cx="1056" cy="98" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1056" y="103" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">2</text></g>
<g><circle cx="1056" cy="140" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1056" y="145" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">3</text></g>
<g><circle cx="1056" cy="182" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1056" y="187" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">4</text></g></g>
<g><circle cx="28" cy="328" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="333" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">1</text></g>
<text x="48" y="333" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Install: npm install adds abaplint and the open-abap transpiler to the project, no account involved</text>
<g><circle cx="28" cy="358" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="363" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">2</text></g>
<text x="48" y="363" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">abaplint: reads the ABAP files and prints one line per finding with its rule name</text>
<g><circle cx="28" cy="388" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="393" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">3</text></g>
<text x="48" y="393" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Transpile: turns the ABAP files into JavaScript files in the build folder</text>
<g><circle cx="28" cy="418" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="28" y="423" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">4</text></g>
<text x="48" y="423" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Run: Node.js runs the transpiled program and the program output ends the workflow</text>
</svg>
