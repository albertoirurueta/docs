<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 294" width="820" height="294" role="img" aria-labelledby="stars-t stars-d">
<title id="stars-t">Repository stars</title>
<desc id="stars-d">Stars of each tool&apos;s source repository on 2026-10-26 (GitHub REST API; GitLab REST API for Antora). GitLab and GitHub stars are not directly comparable.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="820" height="294" fill="var(--bg)"/>
<text class="title" x="410" y="24" text-anchor="middle">Repository stars</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Stars (count)</text></g></g><line class="grid" x1="169" y1="78" x2="169" y2="234"/><text class="muted" x="169" y="252" text-anchor="middle">0</text><line class="grid" x1="317.75" y1="78" x2="317.75" y2="234"/><text class="muted" x="317.75" y="252" text-anchor="middle">20k</text><line class="grid" x1="466.5" y1="78" x2="466.5" y2="234"/><text class="muted" x="466.5" y="252" text-anchor="middle">40k</text><line class="grid" x1="615.25" y1="78" x2="615.25" y2="234"/><text class="muted" x="615.25" y="252" text-anchor="middle">60k</text><line class="grid" x1="764" y1="78" x2="764" y2="234"/><text class="muted" x="764" y="252" text-anchor="middle">80k</text><path class="axis" d="M169 78V234H764"/><text x="161" y="95" text-anchor="end">Docusaurus</text><rect class="f0" x="169" y="82" width="495.25" height="18"/><text class="muted" x="669.25" y="95">66,588</text><text x="161" y="121" text-anchor="end">Material for MkDocs</text><rect class="f0" x="169" y="108" width="205.18" height="18"/><text class="muted" x="379.18" y="121">27,587</text><text x="161" y="147" text-anchor="end">MkDocs</text><rect class="f0" x="169" y="134" width="167.49" height="18"/><text class="muted" x="341.49" y="147">22,519</text><text x="161" y="173" text-anchor="end">Zensical</text><rect class="f0" x="169" y="160" width="44.65" height="18"/><text class="muted" x="218.65" y="173">6,004</text><text x="161" y="199" text-anchor="end">DocFX</text><rect class="f0" x="169" y="186" width="33.05" height="18"/><text class="muted" x="207.05" y="199">4,444</text><text x="161" y="225" text-anchor="end">Antora (GitLab)</text><rect class="f0" x="169" y="212" width="4.46" height="18"/><text class="muted" x="178.46" y="225">599</text><text class="axis-label" x="466.5" y="274" text-anchor="middle">Stars (count)</text><text class="axis-label" transform="translate(16 156) rotate(-90)" text-anchor="middle">Tool</text>
</svg>
