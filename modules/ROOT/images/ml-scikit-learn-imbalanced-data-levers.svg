<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Three places to act on class imbalance</title>
<desc id="d">Imbalanced classification can be addressed in the data with resampling, in the model with class weights or balanced ensembles, and in the decision by moving the threshold; evaluation with precision recall metrics applies to all three.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Three levers for imbalanced data</text>
<rect x="24" y="56" width="200" height="190" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="124" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">1. Data</text>
<text x="124" y="108" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">RandomUnderSampler</text>
<text x="124" y="128" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">RandomOverSampler</text>
<text x="124" y="148" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">SMOTE</text>
<text x="124" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">changes the training set</text>
<text x="124" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">inside the pipeline, fit only</text>
<text x="124" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">imbalanced-learn</text>
<rect x="260" y="56" width="200" height="190" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="360" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">2. Model</text>
<text x="360" y="108" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">class_weight</text>
<text x="360" y="128" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">sample_weight</text>
<text x="360" y="148" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">BalancedRandomForest</text>
<text x="360" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">changes the loss</text>
<text x="360" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">probabilities become biased</text>
<text x="360" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">scikit-learn / imbalanced-learn</text>
<rect x="496" y="56" width="200" height="190" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="596" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">3. Decision</text>
<text x="596" y="108" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">TunedThresholdClassifierCV</text>
<text x="596" y="128" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">FixedThresholdClassifier</text>
<text x="596" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">moves the cut-off, keeps</text>
<text x="596" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">the ranking of the model</text>
<text x="596" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">scikit-learn 1.5 and later</text>
<rect x="24" y="268" width="672" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="360" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0F172A">Always: stratified splits, a dummy baseline, and metrics that look at the rare class (recall, precision, PR curve)</text>
</svg>
