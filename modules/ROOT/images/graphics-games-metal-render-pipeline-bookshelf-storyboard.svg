<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-render-pipeline-bookshelf-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Bookshelf: adding depth, culling and blending to the book pipeline</text>
<rect x="20" y="50" width="350" height="160" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="133.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="40" y="66" width="310" height="128" rx="4" fill="#1F2937"/>
<rect x="100" y="96" width="110" height="80" fill="#34D399"/><rect x="170" y="116" width="120" height="70" fill="#FCD34D"/>
<text x="155" y="138" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">cover</text>
<text x="230" y="156" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">pages</text>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/>
<text x="36" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="195" y="228" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">1. Pipeline only: no depth state</text>
<text x="195" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Draw order decides, so the pages hide the cover</text>
<rect x="390" y="50" width="350" height="160" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="133.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="410" y="66" width="310" height="128" rx="4" fill="#1F2937"/>
<rect x="540" y="116" width="120" height="70" fill="#FCD34D"/><rect x="470" y="96" width="110" height="80" fill="#34D399"/>
<text x="525" y="138" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">cover</text>
<text x="625" y="171" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">pages behind</text>
<circle cx="406" cy="66" r="11" fill="#4F46E5"/>
<text x="406" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="565" y="228" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">2. Depth state .less, write on</text>
<text x="565" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The nearer cover wins in any draw order</text>
<rect x="20" y="260" width="350" height="160" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="343.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="40" y="276" width="310" height="128" rx="4" fill="#1F2937"/>
<rect x="130" y="316" width="110" height="80" fill="#34D399" stroke="#047857"/><rect x="160" y="301" width="110" height="80" fill="none" stroke="#9CA3AF" stroke-dasharray="4 3"/>
<text x="255" y="396" font-size="11" font-weight="normal" fill="#D1D5DB" text-anchor="start">back faces culled</text>
<circle cx="36" cy="276" r="11" fill="#4F46E5"/>
<text x="36" y="280" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="195" y="438" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">3. Cull mode .back</text>
<text x="195" y="452" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Hidden faces are not rasterised: about half the work</text>
<rect x="390" y="260" width="350" height="160" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="343.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="410" y="276" width="310" height="128" rx="4" fill="#1F2937"/>
<rect x="500" y="316" width="110" height="80" fill="#34D399"/><rect x="550" y="298" width="110" height="80" fill="#F9A8D4" fill-opacity="0.5"/>
<text x="426" y="396" font-size="11" font-weight="normal" fill="#D1D5DB" text-anchor="start">translucent dust quad</text>
<circle cx="406" cy="276" r="11" fill="#4F46E5"/>
<text x="406" y="280" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="565" y="438" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">4. Blending in the pipeline</text>
<text x="565" y="452" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Alpha-blended dust drawn last with depth write off</text>
</svg>
