<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" width="920" height="610" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">Drupal entity type, bundle, field storage, field instance and displays</title>
  <desc id="d">An entity type (node) has bundles (exhibition and event). A field storage (shared by name across bundles of one entity type) is attached to each bundle through a field instance. Each bundle has a form display and a view display that decide the widget and formatter for each field. Base fields belong to the entity type and are shared by every bundle.</desc>
  <rect width="920" height="610" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
  </defs>

  <!-- entity type -->
  <rect x="300" y="14" width="320" height="76" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="460" y="40" text-anchor="middle" font-weight="bold" fill="#0d47a1">Entity type: node</text>
  <text x="460" y="60" text-anchor="middle" fill="#0d47a1">content entity, tables node, node_field_data</text>
  <text x="460" y="78" text-anchor="middle" fill="#0d47a1">base fields: nid, title, status, uid, created ...</text>

  <!-- bundles -->
  <line x1="400" y1="90" x2="230" y2="132" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="520" y1="90" x2="690" y2="132" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="80" y="134" width="300" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="230" y="158" text-anchor="middle" font-weight="bold" fill="#1b5e20">Bundle: exhibition</text>
  <text x="230" y="178" text-anchor="middle" fill="#1b5e20">config entity node.type.exhibition</text>
  <rect x="540" y="134" width="300" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="690" y="158" text-anchor="middle" font-weight="bold" fill="#1b5e20">Bundle: event</text>
  <text x="690" y="178" text-anchor="middle" fill="#1b5e20">config entity node.type.event</text>

  <!-- instances -->
  <line x1="230" y1="196" x2="230" y2="256" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="690" y1="196" x2="690" y2="256" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="80" y="258" width="300" height="76" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="230" y="282" text-anchor="middle" font-weight="bold" fill="#6d4c00">Field instance (FieldConfig)</text>
  <text x="230" y="302" text-anchor="middle" fill="#6d4c00">field.field.node.exhibition.field_dates</text>
  <text x="230" y="320" text-anchor="middle" fill="#6d4c00">label, help text, required, default value</text>
  <rect x="540" y="258" width="300" height="76" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="690" y="282" text-anchor="middle" font-weight="bold" fill="#6d4c00">Field instance (FieldConfig)</text>
  <text x="690" y="302" text-anchor="middle" fill="#6d4c00">field.field.node.event.field_dates</text>
  <text x="690" y="320" text-anchor="middle" fill="#6d4c00">its own label, help text and defaults</text>

  <!-- storage -->
  <line x1="340" y1="334" x2="410" y2="446" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="580" y1="334" x2="510" y2="446" stroke="#37474f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="270" y="448" width="380" height="92" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="460" y="472" text-anchor="middle" font-weight="bold" fill="#4a148c">Field storage (FieldStorageConfig)</text>
  <text x="460" y="492" text-anchor="middle" fill="#4a148c">field.storage.node.field_dates</text>
  <text x="460" y="510" text-anchor="middle" fill="#4a148c">type daterange, cardinality, storage settings</text>
  <text x="460" y="528" text-anchor="middle" fill="#4a148c">table node__field_dates (plus a revision table)</text>

  <!-- displays -->
  <rect x="80" y="352" width="120" height="40" rx="6" fill="#ffffff" stroke="#546e7a" stroke-dasharray="5 3"/>
  <text x="140" y="369" text-anchor="middle" fill="#263238">Form display</text>
  <text x="140" y="384" text-anchor="middle" font-size="11" fill="#263238">widget per field</text>
  <rect x="206" y="352" width="120" height="40" rx="6" fill="#ffffff" stroke="#546e7a" stroke-dasharray="5 3"/>
  <text x="266" y="369" text-anchor="middle" fill="#263238">View display</text>
  <text x="266" y="384" text-anchor="middle" font-size="11" fill="#263238">formatter per field</text>
  <rect x="596" y="352" width="120" height="40" rx="6" fill="#ffffff" stroke="#546e7a" stroke-dasharray="5 3"/>
  <text x="656" y="369" text-anchor="middle" fill="#263238">Form display</text>
  <text x="656" y="384" text-anchor="middle" font-size="11" fill="#263238">widget per field</text>
  <rect x="722" y="352" width="118" height="40" rx="6" fill="#ffffff" stroke="#546e7a" stroke-dasharray="5 3"/>
  <text x="781" y="369" text-anchor="middle" fill="#263238">View display</text>
  <text x="781" y="384" text-anchor="middle" font-size="11" fill="#263238">formatter per field</text>
  <text x="80" y="412" fill="#37474f" font-size="12">core.entity_form_display.node.exhibition.default</text>
  <text x="80" y="428" fill="#37474f" font-size="12">core.entity_view_display.node.exhibition.default</text>
  <text x="610" y="412" fill="#37474f" font-size="12">core.entity_form_display.node.event.default</text>
  <text x="610" y="428" fill="#37474f" font-size="12">core.entity_view_display.node.event.default</text>
  <text x="460" y="582" text-anchor="middle" fill="#37474f" font-size="12">One storage per entity type and field name, one instance per bundle, one display entry per instance.</text>
</svg>
