<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">The SAP BTP account model: global account, directories, subaccounts, and the Cloud Foundry and Kyma environments inside a subaccount</title>
  <desc id="d">A global account is the contract with SAP. It can contain directories, which only group subaccounts, and it holds entitlements and quotas that are assigned to subaccounts. A subaccount lives in one region. Inside a subaccount, the Cloud Foundry environment provides an organization with spaces, and the Kyma environment provides a Kubernetes cluster. Applications and service instances live in spaces or in the cluster.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="20" width="1000" height="520" rx="14" fill="#1e1b4b" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="46" text-anchor="start" font-size="15" font-weight="bold">Global account: the contract with SAP, billing and the pool of entitlements</text>
  <rect x="40" y="62" width="300" height="50" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="190" y="82" text-anchor="middle" font-size="14" font-weight="bold">Entitlements and quotas</text>
  <text x="190" y="101" text-anchor="middle" font-size="12">what you may use, and how much</text>
  <rect x="380" y="62" width="300" height="50" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="530" y="82" text-anchor="middle" font-size="14" font-weight="bold">Directory (optional)</text>
  <text x="530" y="101" text-anchor="middle" font-size="12">only groups subaccounts</text>
  <line x1="190" y1="112" x2="190" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="142" text-anchor="start" font-size="12">assigned to subaccounts</text>
  <line x1="530" y1="112" x2="530" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="540" y="142" text-anchor="start" font-size="12">contains</text>
  <rect x="40" y="160" width="940" height="360" rx="12" fill="#7873f5" fill-opacity="0.14" stroke="currentColor" stroke-width="1.5"/>
  <text x="60" y="186" text-anchor="start" font-size="15" font-weight="bold">Subaccount: one region, one set of users, roles and trust settings</text>
  <rect x="60" y="204" width="440" height="296" rx="10" fill="#4ade80" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="76" y="228" text-anchor="start" font-size="14" font-weight="bold">Cloud Foundry environment</text>
  <rect x="80" y="242" width="400" height="56" rx="10" fill="#2fbf71" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="280" y="265" text-anchor="middle" font-size="14" font-weight="bold">Organization</text>
  <text x="280" y="284" text-anchor="middle" font-size="12">one per subaccount</text>
  <rect x="80" y="318" width="190" height="70" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="175" y="338.5" text-anchor="middle" font-size="14" font-weight="bold">Space dev</text>
  <text x="175" y="357.5" text-anchor="middle" font-size="12">apps and service</text>
  <text x="175" y="376.5" text-anchor="middle" font-size="12">instances</text>
  <rect x="290" y="318" width="190" height="70" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="385" y="338.5" text-anchor="middle" font-size="14" font-weight="bold">Space prod</text>
  <text x="385" y="357.5" text-anchor="middle" font-size="12">apps and service</text>
  <text x="385" y="376.5" text-anchor="middle" font-size="12">instances</text>
  <line x1="175" y1="298" x2="175" y2="318" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="385" y1="298" x2="385" y2="318" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="80" y="420" text-anchor="start" font-size="12">Buildpacks run the apps; cf push deploys them.</text>
  <rect x="540" y="204" width="420" height="296" rx="10" fill="#b76fe0" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="556" y="228" text-anchor="start" font-size="14" font-weight="bold">Kyma environment</text>
  <rect x="560" y="242" width="380" height="56" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="750" y="265" text-anchor="middle" font-size="14" font-weight="bold">Kubernetes cluster</text>
  <text x="750" y="284" text-anchor="middle" font-size="12">managed on Gardener</text>
  <rect x="560" y="318" width="180" height="70" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="650" y="338.5" text-anchor="middle" font-size="14" font-weight="bold">Namespace</text>
  <text x="650" y="357.5" text-anchor="middle" font-size="12">workloads and</text>
  <text x="650" y="376.5" text-anchor="middle" font-size="12">APIRules</text>
  <rect x="760" y="318" width="180" height="70" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="850" y="338.5" text-anchor="middle" font-size="14" font-weight="bold">Namespace</text>
  <text x="850" y="357.5" text-anchor="middle" font-size="12">workloads and</text>
  <text x="850" y="376.5" text-anchor="middle" font-size="12">APIRules</text>
  <line x1="650" y1="298" x2="650" y2="318" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="850" y1="298" x2="850" y2="318" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="560" y="420" text-anchor="start" font-size="12">Containers run the apps; kubectl applies them.</text>
</svg>
