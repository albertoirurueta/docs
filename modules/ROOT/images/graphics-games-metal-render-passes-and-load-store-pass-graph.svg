<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-render-passes-and-load-store-pass-graph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The Bookshelf frame as a graph of render passes</text>
<rect x="20" y="70" width="200" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="106.7" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Pass 1: shadow</text>
<text x="120.0" y="121.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">depth32Float, 2048 x 2048</text>
<text x="120.0" y="136.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">load: clear   store: store</text>
<text x="120.0" y="151.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">no colour attachment</text>
<rect x="280" y="70" width="230" height="130" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="395.0" y="109.2" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Pass 2: main scene</text>
<text x="395.0" y="124.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">colour: 4x MSAA, memoryless</text>
<text x="395.0" y="139.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">load: clear</text>
<text x="395.0" y="154.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">store: multisampleResolve</text>
<text x="395.0" y="169.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">depth: memoryless, dontCare</text>
<rect x="570" y="70" width="170" height="110" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="655.0" y="106.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Pass 3: post</text>
<text x="655.0" y="121.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">reads the resolved image</text>
<text x="655.0" y="136.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">load: dontCare</text>
<text x="655.0" y="151.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">store: store</text>
<line x1="220" y1="125" x2="280" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-passes-and-load-store-pass-graph)"/>
<text x="250" y="116" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">shadow</text>
<text x="250" y="148" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">map</text>
<line x1="510" y1="125" x2="570" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-passes-and-load-store-pass-graph)"/>
<text x="540" y="116" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">resolved</text>
<text x="540" y="148" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">texture</text>
<rect x="580" y="230" width="160" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="660.0" y="256.7" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">Drawable</text>
<text x="660.0" y="271.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">shown on screen</text>
<line x1="655" y1="180" x2="655" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-render-passes-and-load-store-pass-graph)"/>
<rect x="20" y="230" width="530" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="285.0" y="256.7" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Rules read off the graph</text>
<text x="285.0" y="271.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">A texture sampled later must be stored; one that is not needed is dontCare.</text>
<text x="285.0" y="286.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Anything used only inside a pass (MSAA colour, depth) can be memoryless.</text>
<text x="285.0" y="301.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Each arrow is a dependency the GPU must respect between encoders.</text>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Passes 1 and 2 are two encoders in one command buffer; pass 3 can merge into 2 if it needs no neighbour pixels.</text>
<text x="380" y="368" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Metal 4 expresses the pass 1 to pass 2 dependency with a barrier; Metal 3 tracks it for you.</text>
</svg>
