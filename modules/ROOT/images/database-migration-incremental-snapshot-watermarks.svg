<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Incremental snapshot watermarks</title>
  <desc id="d">One chunk of an incremental snapshot of BOOKSHOP.BOOK. The connector writes a low watermark row, runs the chunk query into a buffer, drops buffered rows whose key also appears in streamed events inside the window, and emits the remaining READ events when it sees the high watermark row.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Incremental snapshot of BOOKSHOP.BOOK: one chunk</text>
  <text x="480" y="56" text-anchor="middle" font-size="15" fill="#374151">Streaming never stops; inside the window, a streamed key wins over the buffered READ row</text>

  <!-- snapshot window shading -->
  <rect x="318" y="68" width="524" height="416" fill="#fff7d6" stroke="#d4a300" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="86" text-anchor="middle" font-size="14" font-style="italic" fill="#7a5c00">snapshot window for chunk 1</text>

  <!-- lane separators -->
  <line x1="12" y1="176" x2="948" y2="176" stroke="#d1d5db" stroke-width="1"/>
  <line x1="12" y1="296" x2="948" y2="296" stroke="#d1d5db" stroke-width="1"/>

  <!-- lane labels -->
  <text x="16" y="126" font-size="15" font-weight="bold" fill="#111827">Redo log</text>
  <text x="16" y="146" font-size="14" fill="#374151">(LogMiner stream)</text>
  <text x="16" y="236" font-size="15" font-weight="bold" fill="#111827">Kafka topic</text>
  <text x="16" y="256" font-size="13" fill="#374151">legacy.BOOKSHOP.BOOK</text>
  <text x="16" y="376" font-size="15" font-weight="bold" fill="#111827">Chunk buffer</text>
  <text x="16" y="396" font-size="14" fill="#374151">(connector memory)</text>

  <!-- timeline -->
  <line x1="190" y1="131" x2="950" y2="131" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- redo log events -->
  <rect x="196" y="104" width="110" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="251" y="126" text-anchor="middle" font-size="15" fill="#1e3a8a">UPDATE</text>
  <text x="251" y="146" text-anchor="middle" font-size="15" fill="#1e3a8a">BOOK_ID=7</text>

  <rect x="326" y="104" width="120" height="54" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="386" y="126" text-anchor="middle" font-size="14" fill="#4c1d95">low watermark</text>
  <text x="386" y="146" text-anchor="middle" font-size="14" fill="#4c1d95">row id &#8230;-open</text>

  <rect x="462" y="104" width="110" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="517" y="126" text-anchor="middle" font-size="15" fill="#1e3a8a">UPDATE</text>
  <text x="517" y="146" text-anchor="middle" font-size="15" fill="#1e3a8a">BOOK_ID=17</text>

  <rect x="588" y="104" width="110" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="643" y="126" text-anchor="middle" font-size="15" fill="#1e3a8a">DELETE</text>
  <text x="643" y="146" text-anchor="middle" font-size="15" fill="#1e3a8a">BOOK_ID=99</text>

  <rect x="714" y="104" width="120" height="54" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="774" y="126" text-anchor="middle" font-size="14" fill="#4c1d95">high watermark</text>
  <text x="774" y="146" text-anchor="middle" font-size="14" fill="#4c1d95">row id &#8230;-close</text>

  <rect x="850" y="104" width="100" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="900" y="126" text-anchor="middle" font-size="15" fill="#1e3a8a">UPDATE</text>
  <text x="900" y="146" text-anchor="middle" font-size="15" fill="#1e3a8a">BOOK_ID=5</text>

  <!-- arrows: streamed events go straight to the topic -->
  <line x1="251" y1="158" x2="251" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="517" y1="158" x2="517" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="643" y1="158" x2="643" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="158" x2="900" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- low watermark opens the window and starts the chunk query -->
  <line x1="386" y1="158" x2="386" y2="316" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <!-- high watermark flushes the buffer -->
  <line x1="774" y1="158" x2="774" y2="210" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- topic records -->
  <rect x="196" y="214" width="110" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="251" y="236" text-anchor="middle" font-size="15" fill="#1e3a8a">op u</text>
  <text x="251" y="256" text-anchor="middle" font-size="15" fill="#1e3a8a">BOOK_ID=7</text>

  <rect x="462" y="214" width="110" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="517" y="236" text-anchor="middle" font-size="15" fill="#1e3a8a">op u</text>
  <text x="517" y="256" text-anchor="middle" font-size="15" fill="#1e3a8a">BOOK_ID=17</text>

  <rect x="588" y="214" width="110" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="643" y="236" text-anchor="middle" font-size="15" fill="#1e3a8a">op d</text>
  <text x="643" y="256" text-anchor="middle" font-size="15" fill="#1e3a8a">BOOK_ID=99</text>

  <rect x="714" y="214" width="120" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="774" y="236" text-anchor="middle" font-size="14" fill="#14532d">op r: 1 to 1024</text>
  <text x="774" y="256" text-anchor="middle" font-size="14" fill="#14532d">except 17, 99</text>

  <rect x="850" y="214" width="100" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="900" y="236" text-anchor="middle" font-size="15" fill="#1e3a8a">op u</text>
  <text x="900" y="256" text-anchor="middle" font-size="15" fill="#1e3a8a">BOOK_ID=5</text>

  <!-- buffer -->
  <rect x="330" y="320" width="372" height="148" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="342" y="344" font-size="15" fill="#14532d">1. Low watermark seen: run the chunk query</text>
  <text x="360" y="366" font-size="15" fill="#14532d">(BOOK_ID above the last key, ordered,</text>
  <text x="360" y="388" font-size="15" fill="#14532d">at most 1024 rows): READ 1 to READ 1024</text>
  <text x="342" y="410" font-size="15" fill="#b91c1c">2. Keys 17 and 99 streamed in the window:</text>
  <text x="360" y="432" font-size="15" fill="#b91c1c">buffered READ 17 and READ 99 dropped</text>
  <!-- buffer flushed at high watermark -->
  <text x="342" y="456" font-size="15" fill="#14532d">3. High watermark seen: the rest is emitted</text>
  <path d="M702,395 L774,395 L774,272" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="24" y="504" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="54" y="517" font-size="14" fill="#111827">Change committed by the legacy application, read from the redo log (op c, u or d)</text>
  <rect x="24" y="530" width="22" height="16" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="54" y="543" font-size="14" fill="#111827">Watermark row the connector inserts into BOOKSHOP.DEBEZIUM_SIGNAL (snapshot-window-open, snapshot-window-close)</text>
  <rect x="24" y="556" width="22" height="16" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="54" y="569" font-size="14" fill="#111827">READ event (op r, source.snapshot = incremental) from the chunk query</text>
  <text x="24" y="604" font-size="13" fill="#374151">insert_insert (default) writes an open and a close row per chunk; insert_delete writes one open row and deletes it to close the window.</text>
</svg>
