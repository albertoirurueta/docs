<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">pandas deprecation lifecycle (PDEP-17)</title>
  <desc id="d">Three stages: a feature is deprecated in a minor release with a PandasDeprecationWarning that Python hides by default, promoted to a PandasFutureWarning in the last minor release before the next major release, and removed in the next major release.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Life of a deprecation in pandas</text>

  <rect x="24" y="64" width="204" height="150" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="126" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">1. Introduce</text>
  <text x="126" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">a minor release</text>
  <text x="126" y="136" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">PandasDeprecationWarning</text>
  <text x="126" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">subclass of DeprecationWarning:</text>
  <text x="126" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">hidden outside __main__</text>
  <text x="126" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">behaviour unchanged</text>

  <rect x="258" y="64" width="204" height="150" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="360" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">2. Promote</text>
  <text x="360" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">last minor before the major</text>
  <text x="360" y="136" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">PandasFutureWarning</text>
  <text x="360" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">subclass of FutureWarning:</text>
  <text x="360" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">shown to every user</text>
  <text x="360" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">one release to migrate</text>

  <rect x="492" y="64" width="204" height="150" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="594" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F172A">3. Remove</text>
  <text x="594" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">the next major release</text>
  <text x="594" y="136" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">removed or changed</text>
  <text x="594" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">old code stops working</text>
  <text x="594" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">patch releases never</text>
  <text x="594" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">add deprecations</text>

  <line x1="230" y1="139" x2="254" y2="139" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="464" y1="139" x2="488" y2="139" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="24" y="234" width="672" height="48" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="360" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">Filter by target: Pandas4Warning (removal in 4.0), Pandas5Warning (removal in 5.0)</text>
  <text x="360" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">All of them inherit from PandasChangeWarning</text>
</svg>
