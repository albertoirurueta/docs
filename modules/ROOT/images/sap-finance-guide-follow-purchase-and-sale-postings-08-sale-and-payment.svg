<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 276" width="1080" height="276" role="img" aria-labelledby="sap-finance-guide-follow-purchase-and-sale-postings-08-sale-and-payment-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-finance-guide-follow-purchase-and-sale-postings-08-sale-and-payment-title">Terminal with three curl commands: the sale answered with the billing document 100000005 of type RV (callout 15), the customer payment answered with document 100000006 of type DZ (callout 16) and clearing of the customer account answered with clearing document 100000006 and 2 cleared items (callout 18); the long answers wrap onto a second line</title>
<g><rect x="0" y="0" width="1080" height="276" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="244" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -sw &quot;\n&quot; --json @http/sale.json $BASE/postSale</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Documents/$entity&quot;,&quot;DocumentNumber&quot;:&quot;100000005&quot;,&quot;DocumentType&quot;:&quot;RV&quot;,&quot;CompanyCode&quot;:&quot;EX01&quot;,</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;Ledger&quot;:&quot;0L&quot;,&quot;PostingDate&quot;:&quot;2026-03-25&quot;,&quot;Description&quot;:&quot;Billing C-2000&quot;}</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -sw &quot;\n&quot; --json @http/customer-payment.json $BASE/receiveCustomerPayment</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Documents/$entity&quot;,&quot;DocumentNumber&quot;:&quot;100000006&quot;,&quot;DocumentType&quot;:&quot;DZ&quot;,&quot;CompanyCode&quot;:&quot;EX01&quot;,</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">&quot;Ledger&quot;:&quot;0L&quot;,&quot;PostingDate&quot;:&quot;2026-04-02&quot;,&quot;Description&quot;:&quot;Payment of C-2000&quot;}</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -sw &quot;\n&quot; --json @http/clear-customers.json $BASE/clearOpenItems</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#LedgerPostingsService.Cleared&quot;,&quot;ClearingDocument&quot;:&quot;100000006&quot;,&quot;ClearedItems&quot;:2}</text>
