<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-buffers-attributes-uniforms-vaos-std140-layout" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">std140 layout of a uniform block</text>
<text x="30" y="56" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">layout(std140) uniform Frame { mat4 uView; mat4 uProj; vec3 uEye; float uTime; vec4 uLight; float uPower; };</text>
