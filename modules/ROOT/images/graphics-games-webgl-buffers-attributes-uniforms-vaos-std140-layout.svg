<text x="150.0" y="120" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uView column 1</text>
<text x="60" y="149" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">32</text>
<rect x="70" y="132" width="160" height="26" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="150.0" y="149" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uView column 2</text>
<text x="60" y="178" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">48</text>
<rect x="70" y="161" width="160" height="26" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="150.0" y="178" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uView column 3</text>
<text x="60" y="207" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">64</text>
<rect x="70" y="190" width="160" height="26" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="150.0" y="207" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uProj column 0</text>
