<text x="60" y="294" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">112</text>
<rect x="70" y="277" width="160" height="26" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="150.0" y="294" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uProj column 3</text>
<text x="60" y="323" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">128</text>
<rect x="70" y="306" width="120" height="26" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="130.0" y="323" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uEye (vec3)</text>
<rect x="190" y="306" width="40" height="26" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="210.0" y="323" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uTime</text>
<text x="60" y="352" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">144</text>
<rect x="70" y="335" width="160" height="26" rx="3" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="150.0" y="352" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uLight (vec4)</text>
<text x="60" y="381" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">160</text>
<rect x="70" y="364" width="40" height="26" rx="3" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="90.0" y="381" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uPwr</text>
<rect x="110" y="364" width="120" height="26" rx="3" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="170.0" y="381" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">padding to 16 B</text>
<text x="250" y="86" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="260" y="98" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Rules used above (std140):</text>
<text x="260" y="118" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">- scalar: size 4, align 4</text>
<text x="260" y="138" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">- vec2: align 8; vec3 and vec4: align 16</text>
<text x="260" y="158" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">- mat4: 4 columns, each aligned like a vec4</text>
<text x="260" y="178" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">- vec3 takes 12 bytes: a float may follow it</text>
<text x="260" y="198" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">- block size is rounded up to a multiple of 16</text>
<text x="260" y="218" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Total here: 176 bytes.</text>
<text x="380" y="423" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Arrays of scalars or vec2/vec3 are padded: float f[3] uses a 16-byte stride per element in std140.</text>
</svg>
