<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Storyboard: from a blank email to a sent newsletter</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: from a blank email to a sent newsletter</text>
  <rect x="12" y="50" width="140" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="164" y="50" width="140" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="316" y="50" width="140" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="468" y="50" width="140" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="620" y="50" width="128" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <path d="M153,175 L163,175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M305,175 L315,175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M457,175 L467,175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M609,175 L619,175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="30" cy="68" r="11" fill="#4F46E5"/><text x="30" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="182" cy="68" r="11" fill="#4F46E5"/><text x="182" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="334" cy="68" r="11" fill="#4F46E5"/><text x="334" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="486" cy="68" r="11" fill="#4F46E5"/><text x="486" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="638" cy="68" r="11" fill="#B45309"/><text x="638" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <rect x="28" y="96" width="108" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/><text x="82" y="116" font-size="11" fill="#374151" text-anchor="middle">Email icon</text>
  <rect x="28" y="140" width="108" height="100" fill="#E5E7EB" stroke="#9CA3AF"/><text x="82" y="194" font-size="11" fill="#374151" text-anchor="middle">Layout or blank</text>
  <rect x="180" y="96" width="108" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/><text x="234" y="116" font-size="11" fill="#374151" text-anchor="middle">Elements tab</text>
  <rect x="180" y="140" width="108" height="30" fill="#E5E7EB" stroke="#9CA3AF"/><text x="234" y="160" font-size="11" fill="#374151" text-anchor="middle">Header</text>
  <rect x="180" y="178" width="108" height="30" fill="#E5E7EB" stroke="#9CA3AF"/><text x="234" y="198" font-size="11" fill="#374151" text-anchor="middle">Columns</text>
  <rect x="180" y="216" width="108" height="30" fill="#E5E7EB" stroke="#9CA3AF"/><text x="234" y="236" font-size="11" fill="#374151" text-anchor="middle">Footer</text>
  <rect x="332" y="96" width="108" height="60" fill="#E5E7EB" stroke="#9CA3AF"/><text x="386" y="130" font-size="11" fill="#374151" text-anchor="middle">Cover image</text>
  <rect x="352" y="172" width="68" height="26" rx="13" fill="#4F46E5"/><text x="386" y="189" font-size="11" fill="#FFFFFF" text-anchor="middle">Button</text>
  <text x="386" y="226" font-size="11" fill="#374151" text-anchor="middle">Name and URL</text>
  <rect x="484" y="96" width="108" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/><text x="538" y="116" font-size="11" fill="#374151" text-anchor="middle">Send test email</text>
  <rect x="484" y="140" width="108" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/><text x="538" y="160" font-size="11" fill="#374151" text-anchor="middle">Preview</text>
  <text x="538" y="204" font-size="11" fill="#374151" text-anchor="middle">Desktop and mobile</text>
  <rect x="636" y="96" width="96" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF"/><text x="684" y="116" font-size="11" fill="#374151" text-anchor="middle">Share</text>
  <rect x="636" y="140" width="96" height="30" rx="6" fill="#FFFFFF" stroke="#B45309"/><text x="684" y="160" font-size="11" fill="#92400E" text-anchor="middle">Mailchimp</text>
  <rect x="636" y="190" width="96" height="30" rx="6" fill="#4F46E5"/><text x="684" y="210" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Publish now</text>
  <text x="82" y="322" font-size="12" fill="#374151" text-anchor="middle">Start a new email</text><text x="82" y="338" font-size="12" fill="#374151" text-anchor="middle">design</text>
  <text x="234" y="322" font-size="12" fill="#374151" text-anchor="middle">Add header,</text><text x="234" y="338" font-size="12" fill="#374151" text-anchor="middle">columns, footer</text>
  <text x="386" y="322" font-size="12" fill="#374151" text-anchor="middle">Add image and</text><text x="386" y="338" font-size="12" fill="#374151" text-anchor="middle">call to action</text>
  <text x="538" y="322" font-size="12" fill="#374151" text-anchor="middle">Preview and send</text><text x="538" y="338" font-size="12" fill="#374151" text-anchor="middle">yourself a test</text>
  <text x="684" y="322" font-size="12" fill="#374151" text-anchor="middle">Publish to</text><text x="684" y="338" font-size="12" fill="#374151" text-anchor="middle">Mailchimp</text>
</svg>
