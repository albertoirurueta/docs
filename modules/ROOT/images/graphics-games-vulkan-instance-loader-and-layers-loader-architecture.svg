<text x="160.0" y="351.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">ICD 1</text>
<text x="160.0" y="366.0" text-anchor="middle" font-size="11" fill="#065F46">driver A (manifest in icd.d)</text>
