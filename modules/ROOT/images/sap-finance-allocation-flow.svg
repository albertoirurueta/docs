<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">One allocation: a sender cost center passes 1,000.00 EUR to three receiver cost centers by floor area</title>
  <desc id="d">The sender, the collector cost center EX-RENT of controlling area EX00, holds a posted rent of 1,000.00 EUR. The sender rule Posted amounts with a sender share of 100 percent releases all of it. The receiver rule Variable portions uses the statistical key figure floor area as tracing factor: EX-ADM has 120 square meters, EX-SALES 180 and EX-PROD 300, 600 in total. Each receiver gets the sender amount times its factor divided by the sum of the factors: 200.00, 300.00 and 500.00 EUR, which add up to 1,000.00 EUR. Below, two boxes compare the two allocation types: distribution keeps the original rent account on the receivers, and overhead allocation posts to one secondary account with cost element category 42, so the receivers no longer see the original account.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="120" width="230" height="110" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="135" y="151" text-anchor="middle" font-size="14" font-weight="bold">Sender: EX-RENT</text>
  <text x="135" y="170" text-anchor="middle" font-size="12">rent posted: 1,000.00 EUR</text>
  <text x="135" y="189" text-anchor="middle" font-size="12">sender rule: Posted amounts</text>
  <text x="135" y="208" text-anchor="middle" font-size="12">sender share: 100 %</text>
  <rect x="330" y="20" width="230" height="70" rx="10" fill="#b76fe0" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="445" y="40.5" text-anchor="middle" font-size="14" font-weight="bold">Receiver rule</text>
  <text x="445" y="59.5" text-anchor="middle" font-size="12">Variable portions</text>
  <text x="445" y="78.5" text-anchor="middle" font-size="12">reference: floor area (SKF)</text>
  <line x1="250" y1="160" x2="300" y2="160" stroke="currentColor" stroke-width="1.5"/>
  <line x1="300" y1="160" x2="300" y2="55" stroke="currentColor" stroke-width="1.5"/>
  <line x1="300" y1="55" x2="330" y2="55" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="250" y1="175" x2="640" y2="143" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="640" y="110" width="220" height="66" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="750" y="128.5" text-anchor="middle" font-size="14" font-weight="bold">EX-ADM</text>
  <text x="750" y="147.5" text-anchor="middle" font-size="12">factor 120 m2</text>
  <text x="750" y="166.5" text-anchor="middle" font-size="12">receives 200.00 EUR</text>
  <line x1="250" y1="175" x2="640" y2="227" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="640" y="194" width="220" height="66" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="750" y="212.5" text-anchor="middle" font-size="14" font-weight="bold">EX-SALES</text>
  <text x="750" y="231.5" text-anchor="middle" font-size="12">factor 180 m2</text>
  <text x="750" y="250.5" text-anchor="middle" font-size="12">receives 300.00 EUR</text>
  <line x1="250" y1="175" x2="640" y2="311" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="640" y="278" width="220" height="66" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="750" y="296.5" text-anchor="middle" font-size="14" font-weight="bold">EX-PROD</text>
  <text x="750" y="315.5" text-anchor="middle" font-size="12">factor 300 m2</text>
  <text x="750" y="334.5" text-anchor="middle" font-size="12">receives 500.00 EUR</text>
  <text x="445" y="112" text-anchor="middle" font-size="12">1,000.00 x factor / 600</text>
  <rect x="890" y="110" width="170" height="234" rx="10" fill="#4fa3c8" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="975" y="165" text-anchor="middle" font-size="14" font-weight="bold">Check</text>
  <text x="975" y="184" text-anchor="middle" font-size="12">200.00</text>
  <text x="975" y="203" text-anchor="middle" font-size="12">+ 300.00</text>
  <text x="975" y="222" text-anchor="middle" font-size="12">+ 500.00</text>
  <text x="975" y="241" text-anchor="middle" font-size="12">= 1,000.00 EUR</text>
  <text x="975" y="260" text-anchor="middle" font-size="12"></text>
  <text x="975" y="279" text-anchor="middle" font-size="12">sender credited</text>
  <text x="975" y="298" text-anchor="middle" font-size="12">with the same sum</text>
  <rect x="20" y="372" width="520" height="72" rx="10" fill="#ff6ec4" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="280" y="394" text-anchor="middle" font-size="13" font-weight="bold">Distribution</text>
  <text x="280" y="412" text-anchor="middle" font-size="11">receivers see the original rent account:</text>
  <text x="280" y="430" text-anchor="middle" font-size="11">the composition of the cost stays visible</text>
  <rect x="560" y="372" width="500" height="72" rx="10" fill="#5b9bd5" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="810" y="394" text-anchor="middle" font-size="13" font-weight="bold">Overhead allocation</text>
  <text x="810" y="412" text-anchor="middle" font-size="11">receivers see one secondary account, category 42:</text>
  <text x="810" y="430" text-anchor="middle" font-size="11">the original accounts are not visible</text>
  <text x="540" y="462" text-anchor="middle" font-size="11">All names and amounts are made up for the running example (controlling area EX00, company code EX01).</text>
</svg>
