<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-geo-groups" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Geometry groups map index ranges to a material array</text>
<text x="20" y="56" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="start">index buffer of BoxGeometry (36 indices)</text>
<rect x="20" y="70" width="114" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="77" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">face +x</text>
<text x="77" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 0, count 6</text>
<text x="77" y="138" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">materialIndex 0</text>
<line x1="77" y1="146" x2="77" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-geo-groups)"/>
<rect x="20" y="198" width="114" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="77" y="214" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">materials[0]</text>
<text x="77" y="230" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Cover</text>
<rect x="140" y="70" width="114" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="197" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">face -x</text>
<text x="197" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 6, count 6</text>
<text x="197" y="138" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">materialIndex 1</text>
<line x1="197" y1="146" x2="197" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-geo-groups)"/>
<rect x="140" y="198" width="114" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="197" y="214" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">materials[1]</text>
<text x="197" y="230" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Cover</text>
<rect x="260" y="70" width="114" height="34" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="317" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">face +y</text>
<text x="317" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 12, count 6</text>
<text x="317" y="138" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">materialIndex 2</text>
<line x1="317" y1="146" x2="317" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-geo-groups)"/>
<rect x="260" y="198" width="114" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="317" y="214" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">materials[2]</text>
<text x="317" y="230" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pages</text>
<rect x="380" y="70" width="114" height="34" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="437" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">face -y</text>
<text x="437" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 18, count 6</text>
<text x="437" y="138" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">materialIndex 3</text>
<line x1="437" y1="146" x2="437" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-geo-groups)"/>
<rect x="380" y="198" width="114" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="437" y="214" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">materials[3]</text>
<text x="437" y="230" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pages</text>
<rect x="500" y="70" width="114" height="34" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="557" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">face +z</text>
<text x="557" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 24, count 6</text>
<text x="557" y="138" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">materialIndex 4</text>
<line x1="557" y1="146" x2="557" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-geo-groups)"/>
<rect x="500" y="198" width="114" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="557" y="214" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">materials[4]</text>
<text x="557" y="230" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pages</text>
<rect x="620" y="70" width="114" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="677" y="92" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">face -z</text>
<text x="677" y="122" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">start 30, count 6</text>
<text x="677" y="138" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">materialIndex 5</text>
<line x1="677" y1="146" x2="677" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-geo-groups)"/>
<rect x="620" y="198" width="114" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="677" y="214" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="middle">materials[5]</text>
<text x="677" y="230" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Spine</text>
<text x="380" y="274" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The renderer issues one draw per group, so six groups cost six draw calls.</text>
<text x="380" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Every index must belong to exactly one group; Mesh needs a material array of matching length.</text>
<text x="380" y="316" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">mesh = new THREE.Mesh(geometry, [cover, cover, pages, pages, pages, spine])</text>
</svg>
