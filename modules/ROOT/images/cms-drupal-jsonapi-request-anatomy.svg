<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a JSON:API collection request</title>
  <desc id="d">A request URL split into base path, entity type, bundle and five query parameters, each with the rule it applies and what the response carries back.</desc>
  <rect width="760" height="420" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b2733">
    <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold">Meridian Museum: one collection request</text>

    <rect x="20" y="40" width="720" height="40" rx="6" fill="#f4f6f8" stroke="#8a97a4"/>
    <text x="34" y="65" font-family="Menlo, Consolas, monospace" font-size="12.5">GET /jsonapi/node/exhibition ? filter ... &amp; sort ... &amp; include ... &amp; fields ... &amp; page ...</text>

    <rect x="20" y="96" width="140" height="64" rx="6" fill="#e3f0fb" stroke="#2f6da3"/>
    <text x="30" y="117" font-weight="bold">Path</text>
    <text x="30" y="135" font-size="12">/jsonapi base path,</text>
    <text x="30" y="150" font-size="12">entity type, bundle</text>

    <rect x="172" y="96" width="140" height="64" rx="6" fill="#e6f5e9" stroke="#3b8a4f"/>
    <text x="182" y="117" font-weight="bold">filter</text>
    <text x="182" y="135" font-size="12">conditions and AND/OR</text>
    <text x="182" y="150" font-size="12">groups on fields</text>

    <rect x="324" y="96" width="140" height="64" rx="6" fill="#fff3da" stroke="#b07a10"/>
    <text x="334" y="117" font-weight="bold">sort and page</text>
    <text x="334" y="135" font-size="12">order, limit (max 50),</text>
    <text x="334" y="150" font-size="12">offset, next links</text>

    <rect x="476" y="96" width="140" height="64" rx="6" fill="#f3e8fa" stroke="#7a4a9c"/>
    <text x="486" y="117" font-weight="bold">include</text>
    <text x="486" y="135" font-size="12">related resources in</text>
    <text x="486" y="150" font-size="12">the included array</text>

    <rect x="628" y="96" width="112" height="64" rx="6" fill="#fde9e7" stroke="#b5483c"/>
    <text x="638" y="117" font-weight="bold">fields</text>
    <text x="638" y="135" font-size="12">sparse fieldsets</text>
    <text x="638" y="150" font-size="12">per resource type</text>

    <path d="M370 172 L370 196" stroke="#555" stroke-width="2" fill="none"/>
    <path d="M364 190 L370 200 L376 190 Z" fill="#555"/>

    <rect x="20" y="204" width="720" height="70" rx="6" fill="#ececec" stroke="#666666"/>
    <text x="34" y="226" font-weight="bold">Drupal checks, entity by entity</text>
    <text x="34" y="246" font-size="12.5">Entity access and field access decide what each client sees. Inaccessible items are left out</text>
    <text x="34" y="262" font-size="12.5">and reported in meta.errors. Filters narrow results but never grant access.</text>

    <path d="M370 280 L370 304" stroke="#555" stroke-width="2" fill="none"/>
    <path d="M364 298 L370 308 L376 298 Z" fill="#555"/>

    <rect x="20" y="312" width="720" height="90" rx="6" fill="#ffffff" stroke="#2f6da3" stroke-width="1.5"/>
    <text x="34" y="334" font-weight="bold">Response: application/vnd.api+json</text>
    <text x="34" y="354" font-size="12.5">data: array of node--exhibition resources (id is the UUID, fields under attributes and relationships)</text>
    <text x="34" y="372" font-size="12.5">included: related resources, once each     links: self, next, prev     meta: errors, counts</text>
    <text x="34" y="390" font-size="12.5">Cache tags and contexts travel with the response, so the page cache can serve it again.</text>
  </g>
</svg>
