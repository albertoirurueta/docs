<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF"/>
  <text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Path versus vector network</text>
  <rect x="20" y="48" width="326" height="250" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="374" y="48" width="326" height="250" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="183" y="72" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Path: one direction, start to end</text>
  <text x="537" y="72" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Vector network: points can branch</text>
  <path d="M50 250 L120 130 L200 220 L300 110" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"><rect x="44" y="244" width="12" height="12"/><rect x="114" y="124" width="12" height="12"/><rect x="194" y="214" width="12" height="12"/><rect x="294" y="104" width="12" height="12"/></g>
  <text x="50" y="278" font-size="12" fill="#374151">start</text><text x="283" y="98" font-size="12" fill="#374151">end</text>
  <path d="M410 250 L490 160 L560 220 L670 120 M490 160 L520 100 M560 220 L600 270" fill="none" stroke="#B45309" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="#B45309" stroke-width="2"><rect x="404" y="244" width="12" height="12"/><rect x="484" y="154" width="12" height="12"/><rect x="554" y="214" width="12" height="12"/><rect x="664" y="114" width="12" height="12"/><rect x="514" y="94" width="12" height="12"/><rect x="594" y="264" width="12" height="12"/></g>
  <circle cx="490" cy="160" r="20" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="440" y="196" font-size="12" fill="#92400E">branch point</text>
  <text x="183" y="322" font-size="12" fill="#374151" text-anchor="middle">Each segment follows the one before it</text>
  <text x="537" y="322" font-size="12" fill="#374151" text-anchor="middle">Several segments leave one point; edit as one layer</text>
  <text x="360" y="346" font-size="11" fill="#6B7280" text-anchor="middle">Schematic: Figma shape layers store their geometry as a vector network; this drawing only illustrates the difference.</text>
</svg>
