<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker>
    <mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="120"><rect x="0" y="0" width="100" height="120" fill="#FFFFFF"/><path d="M52 50 L52 -10 L74 -10 L74 50 L63 38 Z" fill="#000000"/></mask>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: draw the Bookshelf logo</text>
  <g>
    <rect x="12" y="50" width="136" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
    <rect x="42" y="80" width="76" height="100" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="26" cy="64" r="11" fill="#4F46E5"/><text x="26" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="80" y="206" font-size="12" fill="#374151" text-anchor="middle">Rectangle tool (R):</text><text x="80" y="222" font-size="12" fill="#374151" text-anchor="middle">draw the book cover</text>
  </g>
  <g>
    <rect x="160" y="50" width="136" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
    <rect x="190" y="80" width="76" height="100" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <path d="M232 70 L232 128 L243 116 L254 128 L254 70 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <circle cx="174" cy="64" r="11" fill="#4F46E5"/><text x="174" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="228" y="206" font-size="12" fill="#374151" text-anchor="middle">Pen tool (P): click four</text><text x="228" y="222" font-size="12" fill="#374151" text-anchor="middle">points for the bookmark</text>
  </g>
  <g>
    <rect x="308" y="50" width="136" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
    <g transform="translate(326,70)"><g mask="url(#m3)"><rect x="12" y="10" width="76" height="100" fill="#4F46E5"/></g></g>
    <circle cx="322" cy="64" r="11" fill="#4F46E5"/><text x="322" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="376" y="206" font-size="12" fill="#374151" text-anchor="middle">Select both, Subtract</text><text x="376" y="222" font-size="12" fill="#374151" text-anchor="middle">(Opt+Shift+S / Alt+Shift+S)</text>
  </g>
  <g>
    <rect x="456" y="50" width="136" height="220" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
    <rect x="486" y="80" width="76" height="100" rx="14" fill="#4F46E5"/>
    <rect x="523" y="80" width="22" height="48" fill="#FFFFFF"/>
    <circle cx="470" cy="64" r="11" fill="#4F46E5"/><text x="470" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="524" y="206" font-size="12" fill="#374151" text-anchor="middle">Set the corner radius,</text><text x="524" y="222" font-size="12" fill="#374151" text-anchor="middle">then Offset vector</text>
  </g>
  <g>
    <rect x="604" y="50" width="144" height="220" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
    <rect x="640" y="80" width="76" height="100" rx="14" fill="#047857"/>
    <rect x="677" y="80" width="22" height="48" fill="#FFFFFF"/>
    <circle cx="618" cy="64" r="11" fill="#B45309"/><text x="618" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="676" y="206" font-size="12" fill="#374151" text-anchor="middle">Flatten (Opt+Shift+F /</text><text x="676" y="222" font-size="12" fill="#374151" text-anchor="middle">Alt+Shift+F): one vector</text>
  </g>
  <g stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"><line x1="148" y1="160" x2="158" y2="160"/><line x1="296" y1="160" x2="306" y2="160"/><line x1="444" y1="160" x2="454" y2="160"/><line x1="592" y1="160" x2="602" y2="160"/></g>
  <text x="380" y="304" font-size="11" fill="#6B7280" text-anchor="middle">Schematic: step 3 cuts the bookmark out of the cover; step 4 rounds corners; step 5 is destructive, so keep a copy of the unflattened logo.</text>
</svg>
