<svg viewBox="0 0 720 330" width="720" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="330" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What Smart Animate can and cannot tween</text>
<g stroke="#047857" stroke-width="1.5" fill="#D1FAE5"><rect x="20" y="50" width="330" height="240" rx="10"/></g>
<g stroke="#B91C1C" stroke-width="1.5" fill="#FEE2E2"><rect x="370" y="50" width="330" height="240" rx="10"/></g>
<text x="185" y="74" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">Animated smoothly</text>
<text x="535" y="74" font-size="14" font-weight="bold" fill="#B91C1C" text-anchor="middle">Falls back to a dissolve</text>
<g font-size="13" fill="#374151">
<text x="40" y="106">Scale: size grows or shrinks</text>
<text x="40" y="136">Position: x and y movement</text>
<text x="40" y="166">Opacity: fade in or out</text>
<text x="40" y="196">Rotation: including around an anchor</text>
<text x="40" y="226">Fill: solid, gradient, image changes</text>
<text x="40" y="256">Background and layer blur</text>
<text x="390" y="106">Drop shadow and inner shadow</text>
<text x="390" y="136">Morphing one shape into another</text>
<text x="390" y="166">New layers with no partner</text>
<text x="390" y="196">Texture or noise (unless frame duplicated)</text>
<text x="390" y="226">Overlays (treated as new frames)</text>
</g>
<text x="360" y="316" font-size="12" fill="#4B5563" text-anchor="middle">Prefer layer opacity in the Design tab to fill opacity when fading.</text>
</svg>
