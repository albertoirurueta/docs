<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-ssl-sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Specialization constants: one SPIR-V module, several pipelines</text>
<rect x="30" y="70" width="200" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="130.0" y="98.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">SPIR-V module</text>
<text x="130.0" y="114.2" text-anchor="middle" font-size="12" fill="#92400E">OpSpecConstant ID 0 = 8</text>
<text x="130.0" y="130.2" text-anchor="middle" font-size="12" fill="#92400E">(default value)</text>
<rect x="300" y="60" width="200" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="400.0" y="84.2" text-anchor="middle" font-size="12" fill="#3730A3">Pipeline A: ID 0 = 4</text>
<rect x="300" y="115" width="200" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="400.0" y="139.2" text-anchor="middle" font-size="12" fill="#3730A3">Pipeline B: ID 0 = 16</text>
<rect x="300" y="170" width="200" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="400.0" y="194.2" text-anchor="middle" font-size="12" fill="#3730A3">Pipeline C: no data (8)</text>
<line x1="230" y1="110" x2="300" y2="80" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sc)"/>
<line x1="230" y1="110" x2="300" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sc)"/>
<line x1="230" y1="110" x2="300" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sc)"/>
<rect x="560" y="60" width="170" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="645.0" y="83.8" text-anchor="middle" font-size="11" fill="#065F46">Driver folds constant,</text>
<text x="645" y="88" text-anchor="middle" font-size="11" fill="#374151">unrolls loops</text>
<line x1="500" y1="80" x2="560" y2="80" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sc)"/>
<line x1="500" y1="135" x2="560" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sc)"/>
<line x1="500" y1="190" x2="560" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-ssl-sc)"/>
<rect x="30" y="250" width="700" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="283.9" text-anchor="middle" font-size="11" fill="#374151">VkSpecializationInfo: mapEntryCount, pMapEntries (constantID, offset, size), dataSize, pData</text>
<text x="380.0" y="298.9" text-anchor="middle" font-size="11" fill="#374151">Entries live in VkPipelineShaderStageCreateInfo::pSpecializationInfo; WorkgroupSize can come from constants.</text>
<text x="380.0" y="313.9" text-anchor="middle" font-size="11" fill="#374151">Different data yields a different pipeline; the cost is paid at pipeline creation, not at draw time.</text>
<line x1="380" y1="215" x2="380" y2="250" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-vk-ssl-sc)"/>
</svg>
