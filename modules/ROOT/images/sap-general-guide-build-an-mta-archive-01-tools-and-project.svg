<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 297" width="1080" height="297" role="img" aria-labelledby="sap-general-guide-build-an-mta-archive-01-tools-and-project-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-build-an-mta-archive-01-tools-and-project-title">Terminal that checks the tools and creates the project: mbt --version prints Cloud MTA Build Tool version 1.2.52 and make --version prints GNU Make 3.81, cds init claims-mta --nodejs prints Successfully initialized CAP project, and npm install in the new folder ends with found 0 vulnerabilities; callout 1 marks the two version checks, callout 2 the cds init command and its answer, callout 3 the npm install</title>
<g><rect x="0" y="0" width="1080" height="297" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="265" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ mbt --version</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Cloud MTA Build Tool version 1.2.52</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ make --version | head -n 1</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">GNU Make 3.81</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ cds init claims-mta --nodejs</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Adding facet: nodejs</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc"></text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Successfully initialized CAP project</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Continue with: code claims-mta</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ cd claims-mta &amp;&amp; npm install</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">found 0 vulnerabilities</text>
<rect x="5" y="46" width="1042" height="86" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">1</text></g>
<rect x="5" y="130" width="1042" height="107" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="130" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">2</text></g>
<rect x="5" y="235" width="1042" height="44" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="235" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="240" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">3</text></g></g>
</svg>
