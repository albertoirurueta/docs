<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-fbo-msaa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Multisampled rendering and the resolve blit</text>
<rect x="20" y="55" width="210" height="200" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="125" y="78" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Multisample FBO</text>
<text x="125" y="95" font-size="10" fill="#374151" text-anchor="middle">renderbuffers, 4 samples per pixel</text>
<rect x="85" y="115" width="80" height="80" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<path d="M85 195 L165 115 L165 195 z" fill="#E5E7EB"/>
<circle cx="105" cy="135" r="4" fill="#4F46E5"/><circle cx="145" cy="135" r="4" fill="#B45309"/><circle cx="105" cy="175" r="4" fill="#4F46E5"/><circle cx="145" cy="175" r="4" fill="#4F46E5"/>
<text x="125" y="220" font-size="10" fill="#374151" text-anchor="middle">each pixel stores 4 colours</text>
<text x="125" y="238" font-size="10" fill="#374151" text-anchor="middle">and 4 depths</text>
<rect x="290" y="55" width="210" height="200" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="395" y="78" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Resolve FBO</text>
<text x="395" y="95" font-size="10" fill="#374151" text-anchor="middle">texture, 1 sample per pixel</text>
<rect x="355" y="115" width="80" height="80" fill="#C7D2FE" stroke="#4B5563" stroke-width="1.5"/>
<path d="M355 195 L435 115 L435 195 z" fill="#E5E7EB" opacity="0.6"/>
<text x="395" y="220" font-size="10" fill="#374151" text-anchor="middle">averaged colour: 3 parts blue,</text>
<text x="395" y="238" font-size="10" fill="#374151" text-anchor="middle">1 part amber</text>
<rect x="560" y="55" width="180" height="200" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="650" y="78" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Default framebuffer</text>
<text x="650" y="95" font-size="10" fill="#374151" text-anchor="middle">or a post-processing pass</text>
<rect x="610" y="115" width="80" height="80" fill="#C7D2FE" stroke="#4B5563" stroke-width="1.5"/>
<text x="650" y="220" font-size="10" fill="#374151" text-anchor="middle">blit again, or sample</text>
<text x="650" y="238" font-size="10" fill="#374151" text-anchor="middle">the texture in a shader</text>
<path d="M230 155 L290 155" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-fbo-msaa)"/>
<text x="260" y="145" font-size="10" fill="#374151" text-anchor="middle">blit</text>
<path d="M500 155 L560 155" stroke="#4B5563" stroke-width="2" marker-end="url(#ah-fbo-msaa)"/>
<text x="530" y="145" font-size="10" fill="#374151" text-anchor="middle">present</text>
<rect x="20" y="280" width="720" height="78" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="303" font-size="12" fill="#374151" text-anchor="middle">glBlitNamedFramebuffer(msaa, resolve, 0,0,w,h, 0,0,w,h, GL_COLOR_BUFFER_BIT, GL_NEAREST)</text>
<text x="380" y="323" font-size="12" fill="#374151" text-anchor="middle">Resolving requires equal rectangles (no scaling) and matching formats; pass GL_NEAREST as the filter.</text>
<text x="380" y="343" font-size="12" fill="#374151" text-anchor="middle">Depth cannot be averaged meaningfully: resolve it only if you need it, and expect a single sample.</text>
</svg>
