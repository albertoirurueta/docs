<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Convolution output size</title>
<desc id="d">A one-dimensional example. An input of seven values with one zero of padding on each side, a kernel of size three and stride two produces four outputs, matching floor((7 + 2*1 - 3)/2) + 1 = 4.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360.0" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Output size of a convolution (1-D view)</text>
<rect x="80" y="70" width="46" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
<text x="103.0" y="95" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">0</text>
<rect x="132" y="70" width="46" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="155.0" y="95" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x1</text>
<rect x="184" y="70" width="46" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="207.0" y="95" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x2</text>
<rect x="236" y="70" width="46" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="259.0" y="95" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x3</text>
<rect x="288" y="70" width="46" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="311.0" y="95" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x4</text>
<rect x="340" y="70" width="46" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="363.0" y="95" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x5</text>
<rect x="392" y="70" width="46" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="415.0" y="95" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x6</text>
<rect x="444" y="70" width="46" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="467.0" y="95" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x7</text>
<rect x="496" y="70" width="46" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
<text x="519.0" y="95" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">0</text>
<text x="20" y="95" font-size="13" fill="#0F172A" text-anchor="start" font-family="Arial, Helvetica, sans-serif">input</text>
<rect x="77" y="64" width="156" height="52" rx="6" fill="none" stroke="#B45309" stroke-width="2.5"/>
<line x1="155.0" y1="116" x2="0" y2="0" stroke="none"/>
<rect x="181" y="64" width="156" height="52" rx="6" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<line x1="259.0" y1="116" x2="0" y2="0" stroke="none"/>
<rect x="285" y="64" width="156" height="52" rx="6" fill="none" stroke="#6D28D9" stroke-width="2.5"/>
<line x1="363.0" y1="116" x2="0" y2="0" stroke="none"/>
<rect x="389" y="64" width="156" height="52" rx="6" fill="none" stroke="#BE123C" stroke-width="2.5"/>
<line x1="467.0" y1="116" x2="0" y2="0" stroke="none"/>
<text x="20" y="225" font-size="13" fill="#0F172A" text-anchor="start" font-family="Arial, Helvetica, sans-serif">output</text>
<rect x="133.0" y="200" width="44" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="155.0" y="225" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">y1</text>
<line x1="155.0" y1="118" x2="155.0" y2="197" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="237.0" y="200" width="44" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="259.0" y="225" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">y2</text>
<line x1="259.0" y1="118" x2="259.0" y2="197" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="341.0" y="200" width="44" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="363.0" y="225" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">y3</text>
<line x1="363.0" y1="118" x2="363.0" y2="197" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="445.0" y="200" width="44" height="40" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="467.0" y="225" font-size="14" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">y4</text>
<line x1="467.0" y1="118" x2="467.0" y2="197" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="262" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">k=3, s=2, p=1, d=1:  out = floor((n + 2p - d(k-1) - 1) / s) + 1 = floor(8/2) + 1 = 4</text>
<text x="360" y="284" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Each coloured window is one position of the kernel; it moves s cells at a time over the padded input.</text>
</svg>
