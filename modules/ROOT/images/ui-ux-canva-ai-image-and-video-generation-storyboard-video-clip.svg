<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Storyboard: create a short teaser clip with Canva AI</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: create a short teaser clip with Canva AI</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/></g>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <g transform="translate(12,50)"><rect x="10" y="40" width="34" height="150" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="14" y="60" width="26" height="16" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="27" y="71" font-size="10" fill="#92400E" text-anchor="middle" font-weight="bold">AI</text><rect x="52" y="60" width="80" height="110" rx="4" fill="#F9FAFB" stroke="#9CA3AF"/><rect x="58" y="70" width="68" height="22" rx="4" fill="#F9FAFB" stroke="#9CA3AF"/><text x="64" y="84" font-size="11" fill="#374151" text-anchor="start">Ask Canva AI</text><rect x="58" y="106" width="68" height="20" rx="10" fill="#FFFFFF" stroke="#B45309"/><text x="92.0" y="120" font-size="11" fill="#92400E" text-anchor="middle" font-weight="bold">Video clip</text></g>
  <circle cx="30" cy="68" r="11" fill="#4F46E5"/><text x="30" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
  <text x="82.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Canva AI on the</text><text x="82.0" y="338" font-size="12" fill="#374151" text-anchor="middle">homepage, Video clip</text>
  <g transform="translate(164,50)"><rect x="8" y="70" width="124" height="48" rx="4" fill="#F9FAFB" stroke="#9CA3AF"/><text x="14" y="84" font-size="11" fill="#374151" text-anchor="start">Pages turning in</text><text x="14" y="102" font-size="10" fill="#374151" text-anchor="start">soft morning light</text><rect x="8" y="128" width="56" height="30" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-dasharray="3 2"/><text x="36" y="147" font-size="10" fill="#6B7280" text-anchor="middle">Reference</text><rect x="8" y="170" width="124" height="18" rx="9" fill="#FFFFFF" stroke="#4F46E5"/><text x="70.0" y="184" font-size="11" fill="#4F46E5" text-anchor="middle" font-weight="bold">Style, ratio, lighting</text></g>
  <circle cx="182" cy="68" r="11" fill="#4F46E5"/><text x="182" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
  <text x="234.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Describe the shot,</text><text x="234.0" y="338" font-size="12" fill="#374151" text-anchor="middle">add a reference</text>
  <g transform="translate(316,50)"><rect x="14" y="80" width="112" height="70" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="60" y="92" width="20" height="44" rx="2" fill="#4F46E5"/><rect x="63" y="100" width="14" height="4" fill="#FFFFFF"/><circle cx="70" cy="115" r="0" fill="none"/><rect x="14" y="170" width="112" height="8" rx="4" fill="#E5E7EB"/><rect x="14" y="170" width="60" height="8" rx="4" fill="#4F46E5"/><text x="70" y="200" font-size="11" fill="#374151" text-anchor="middle">Generating, wait</text><text x="70" y="216" font-size="11" fill="#374151" text-anchor="middle">up to 2 minutes</text></g>
  <circle cx="334" cy="68" r="11" fill="#4F46E5"/><text x="334" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
  <text x="386.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Wait while the</text><text x="386.0" y="338" font-size="12" fill="#374151" text-anchor="middle">clip generates</text>
  <g transform="translate(468,50)"><rect x="14" y="80" width="112" height="70" rx="4" fill="#EEF2FF" stroke="#9CA3AF"/><polygon points="62,98 62,132 90,115" fill="#4F46E5"/><rect x="14" y="162" width="112" height="6" rx="3" fill="#E5E7EB"/><rect x="14" y="162" width="30" height="6" rx="3" fill="#B45309"/><text x="70" y="196" font-size="11" fill="#374151" text-anchor="middle">Preview the clip</text><text x="70" y="212" font-size="11" fill="#374151" text-anchor="middle">8 s with audio</text><text x="70" y="228" font-size="11" fill="#374151" text-anchor="middle">6 s without</text></g>
  <circle cx="486" cy="68" r="11" fill="#4F46E5"/><text x="486" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
  <text x="538.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Preview the</text><text x="538.0" y="338" font-size="12" fill="#374151" text-anchor="middle">clip</text>
  <g transform="translate(620,50)"><rect x="8" y="90" width="112" height="22" rx="11" fill="#FFFFFF" stroke="#4F46E5"/><text x="64.0" y="104" font-size="11" fill="#4F46E5" text-anchor="middle" font-weight="bold">Download</text><rect x="8" y="126" width="112" height="22" rx="11" fill="#4F46E5"/><text x="64.0" y="140" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Use Canva Editor</text><text x="64" y="178" font-size="11" fill="#374151" text-anchor="middle">Trim, add text,</text><text x="64" y="194" font-size="11" fill="#374151" text-anchor="middle">overlay music</text></g>
  <circle cx="638" cy="68" r="11" fill="#B45309"/><text x="638" y="72" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
  <text x="684.0" y="322" font-size="12" fill="#374151" text-anchor="middle">Download, or use</text><text x="684.0" y="338" font-size="12" fill="#374151" text-anchor="middle">Canva Editor</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
