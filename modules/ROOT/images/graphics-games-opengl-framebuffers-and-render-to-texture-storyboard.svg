<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-fbo-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: render the Bookshelf to a texture, then post-process it</text>
<g>
<rect x="15" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="65" r="11" fill="#4F46E5"/><text x="30" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="35" y="90" width="130" height="90" fill="#F9FAFB" stroke="#4B5563"/>
<rect x="45" y="100" width="12" height="35" fill="#B45309"/><rect x="60" y="105" width="12" height="30" fill="#4F46E5"/><rect x="75" y="98" width="12" height="37" fill="#047857"/><rect x="90" y="104" width="12" height="31" fill="#B45309"/>
<rect x="40" y="135" width="120" height="6" fill="#92400E"/>
<text x="100" y="205" font-size="11" fill="#374151" text-anchor="middle">glBindFramebuffer(fbo)</text>
<text x="100" y="222" font-size="11" fill="#374151" text-anchor="middle">viewport = texture size</text>
<text x="100" y="239" font-size="11" fill="#374151" text-anchor="middle">clear, draw the shelf</text>
<text x="100" y="270" font-size="10" fill="#374151" text-anchor="middle">pixels go to the attachments</text>
</g>
<g>
<rect x="195" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="210" cy="65" r="11" fill="#4F46E5"/><text x="210" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="215" y="90" width="130" height="90" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<rect x="225" y="100" width="12" height="35" fill="#B45309"/><rect x="240" y="105" width="12" height="30" fill="#4F46E5"/><rect x="255" y="98" width="12" height="37" fill="#047857"/><rect x="270" y="104" width="12" height="31" fill="#B45309"/>
<text x="280" y="205" font-size="11" fill="#374151" text-anchor="middle">colour texture now holds</text>
<text x="280" y="222" font-size="11" fill="#374151" text-anchor="middle">the finished image</text>
<text x="280" y="270" font-size="10" fill="#374151" text-anchor="middle">no copy: the texture is the target</text>
</g>
<g>
<rect x="375" y="50" width="170" height="250" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="390" cy="65" r="11" fill="#4F46E5"/><text x="390" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="395" y="90" width="130" height="90" fill="#F9FAFB" stroke="#4B5563"/>
<path d="M395 90 L525 90 L395 180 z" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="460" y="205" font-size="11" fill="#374151" text-anchor="middle">bind framebuffer 0</text>
<text x="460" y="222" font-size="11" fill="#374151" text-anchor="middle">bind the texture</text>
<text x="460" y="239" font-size="11" fill="#374151" text-anchor="middle">draw one big triangle</text>
<text x="460" y="270" font-size="10" fill="#374151" text-anchor="middle">fragment shader samples texture</text>
</g>
<g>
<rect x="555" y="50" width="190" height="250" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<circle cx="570" cy="65" r="11" fill="#B45309"/><text x="570" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="585" y="90" width="130" height="90" fill="#E5E7EB" stroke="#4B5563"/>
<rect x="595" y="100" width="12" height="35" fill="#6B7280"/><rect x="610" y="105" width="12" height="30" fill="#4B5563"/><rect x="625" y="98" width="12" height="37" fill="#9CA3AF"/><rect x="640" y="104" width="12" height="31" fill="#6B7280"/>
<text x="650" y="205" font-size="11" fill="#374151" text-anchor="middle">effect applied per pixel</text>
<text x="650" y="222" font-size="11" fill="#374151" text-anchor="middle">(here: grayscale and vignette)</text>
<text x="650" y="270" font-size="10" fill="#374151" text-anchor="middle">swap buffers to show it</text>
</g>
<path d="M185 175 L195 175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-fbo-sb)"/>
<path d="M365 175 L375 175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-fbo-sb)"/>
<path d="M545 175 L555 175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-fbo-sb)"/>
<rect x="15" y="320" width="730" height="60" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="344" font-size="12" fill="#374151" text-anchor="middle">Panels 1 and 2 are pass one (scene into the FBO). Panels 3 and 4 are pass two (texture onto the window).</text>
<text x="380" y="364" font-size="12" fill="#374151" text-anchor="middle">Never sample the texture while it is still attached to the bound framebuffer.</text>
</svg>
