<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Bit layout of the IEEE binary real kinds real32, real64 and real128</title>
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The real model: sign, exponent and significand bits</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">drawn to scale, 6 px per bit; values are the ones gfortran 16.2 reports for the iso_fortran_env kinds</text>
  <rect x="270" y="62" width="14" height="14" fill="#f3d9d9" stroke="#a33333"/><text x="290" y="74" font-size="12" fill="#222222">sign (1 bit)</text>
  <rect x="390" y="62" width="14" height="14" fill="#e8f0f8" stroke="#1c4b73"/><text x="410" y="74" font-size="12" fill="#222222">biased exponent</text>
  <rect x="540" y="62" width="14" height="14" fill="#e9f5e9" stroke="#2e7d32"/><text x="560" y="74" font-size="12" fill="#222222">stored significand (fraction)</text>
  <text x="128" y="123" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#222222" text-anchor="end">real32</text>
  <rect x="140" y="100" width="6" height="34" fill="#f3d9d9" stroke="#a33333"/>
  <rect x="146" y="100" width="48" height="34" fill="#e8f0f8" stroke="#1c4b73"/><text x="170.0" y="122" font-size="13" fill="#1c4b73" text-anchor="middle">8</text>
  <rect x="194" y="100" width="138" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="263.0" y="122" font-size="13" fill="#2e7d32" text-anchor="middle">23</text>
  <text x="140" y="156" font-size="12.5" fill="#222222" font-family="Courier New, monospace">digits 24 · precision 6 · range 37</text>
  <text x="140" y="175" font-size="12.5" fill="#444444">epsilon = 2⁻²³ ≈ 1.19×10⁻⁷   ·   tiny ≈ 1.18×10⁻³⁸   ·   huge ≈ 3.40×10³⁸</text>
  <text x="128" y="248" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#222222" text-anchor="end">real64</text>
  <rect x="140" y="225" width="6" height="34" fill="#f3d9d9" stroke="#a33333"/>
  <rect x="146" y="225" width="66" height="34" fill="#e8f0f8" stroke="#1c4b73"/><text x="179.0" y="247" font-size="13" fill="#1c4b73" text-anchor="middle">11</text>
  <rect x="212" y="225" width="312" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="368.0" y="247" font-size="13" fill="#2e7d32" text-anchor="middle">52</text>
  <text x="140" y="281" font-size="12.5" fill="#222222" font-family="Courier New, monospace">digits 53 · precision 15 · range 307</text>
  <text x="140" y="300" font-size="12.5" fill="#444444">epsilon = 2⁻⁵² ≈ 2.22×10⁻¹⁶   ·   tiny ≈ 2.23×10⁻³⁰⁸   ·   huge ≈ 1.80×10³⁰⁸</text>
  <text x="128" y="373" font-size="14" font-weight="bold" font-family="Courier New, monospace" fill="#222222" text-anchor="end">real128</text>
  <rect x="140" y="350" width="6" height="34" fill="#f3d9d9" stroke="#a33333"/>
  <rect x="146" y="350" width="90" height="34" fill="#e8f0f8" stroke="#1c4b73"/><text x="191.0" y="372" font-size="13" fill="#1c4b73" text-anchor="middle">15</text>
  <rect x="236" y="350" width="672" height="34" fill="#e9f5e9" stroke="#2e7d32"/><text x="572.0" y="372" font-size="13" fill="#2e7d32" text-anchor="middle">112</text>
  <text x="140" y="406" font-size="12.5" fill="#222222" font-family="Courier New, monospace">digits 113 · precision 33 · range 4931</text>
  <text x="140" y="425" font-size="12.5" fill="#444444">epsilon = 2⁻¹¹² ≈ 1.93×10⁻³⁴   ·   tiny ≈ 3.36×10⁻⁴⁹³²   ·   huge ≈ 1.19×10⁴⁹³²</text>
  <text x="470" y="457" font-size="12" fill="#666666" text-anchor="middle">epsilon is the gap between 1 and the next value; tiny is the smallest normal number; huge is the largest finite number</text>
</svg>
