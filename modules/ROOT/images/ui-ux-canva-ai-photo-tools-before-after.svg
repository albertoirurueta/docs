ubject</text><rect x="390" y="316" width="350" height="124" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="402" y="336" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">Grab Text</text><text x="474" y="336" font-size="12" fill="#374151" text-anchor="middle"></text><rect x="424" y="350" width="100" height="70" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="434" y="372" width="80" height="8" rx="2" fill="#6B7280"/><rect x="434" y="388" width="56" height="8" rx="2" fill="#6B7280"/><path d="M536,385 L566,385" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="606" y="350" width="100" height="70" fill="#EEF2FF" stroke="#9CA3AF"/><rect x="614" y="368" width="84" height="14" fill="#FFFFFF" stroke="#B45309"/><rect x="618" y="372" width="70" height="6" rx="2" fill="#4F46E5"/><rect x="614" y="388" width="60" height="14" fill="#FFFFFF" stroke="#B45309"/><rect x="618" y="392" width="44" height="6" rx="2" fill="#4F46E5"/><text x="474" y="432" font-size="11" fill="#6B7280" text-anchor="middle">before</text><text x="656" y="432" font-size="11" fill="#B45309" text-anchor="middle" font-weight="bold">after</text><text x="730" y="336" font-size="11" fill="#374151" text-anchor="end">turn photo text into a text box</text>  <text x="380" y="452" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
