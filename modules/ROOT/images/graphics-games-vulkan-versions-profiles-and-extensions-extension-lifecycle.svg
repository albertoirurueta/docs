<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vpe-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Life of an extension: from vendor idea to core</text>
<rect x="20" y="70" width="150" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="88" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Vendor</text>
<text x="95.0" y="106" text-anchor="middle" font-size="11" fill="#3730A3">VK_NV_*, VK_AMD_*</text>
<text x="95.0" y="121" text-anchor="middle" font-size="11" fill="#3730A3">one company, own naming</text>
<line x1="172" y1="115" x2="203" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-life)"/>
<rect x="205" y="70" width="150" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="280.0" y="88" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">EXT</text>
<text x="280.0" y="106" text-anchor="middle" font-size="11" fill="#3730A3">VK_EXT_*</text>
<text x="280.0" y="121" text-anchor="middle" font-size="11" fill="#3730A3">several vendors agree</text>
<line x1="357" y1="115" x2="388" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-life)"/>
<rect x="390" y="70" width="150" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="465.0" y="88" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">KHR</text>
<text x="465.0" y="106" text-anchor="middle" font-size="11" fill="#3730A3">VK_KHR_*</text>
<text x="465.0" y="121" text-anchor="middle" font-size="11" fill="#3730A3">Khronos ratified</text>
<line x1="542" y1="115" x2="573" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-life)"/>
<rect x="575" y="70" width="150" height="90" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="88" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">Core</text>
<text x="650.0" y="106" text-anchor="middle" font-size="11" fill="#065F46">Vulkan 1.x</text>
<text x="650.0" y="121" text-anchor="middle" font-size="11" fill="#065F46">part of the API version</text>
<rect x="20" y="200" width="330" height="115" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="185.0" y="218" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">What promotion changes</text>
<text x="185.0" y="236" text-anchor="middle" font-size="11" fill="#374151">A feature can skip steps: some EXT extensions go straight</text>
<text x="185.0" y="251" text-anchor="middle" font-size="11" fill="#374151">to core, some stay EXT forever.</text>
<text x="185.0" y="266" text-anchor="middle" font-size="11" fill="#374151">Promotion keeps the same behaviour; the function and</text>
<text x="185.0" y="281" text-anchor="middle" font-size="11" fill="#374151">struct names lose the suffix (vkCmdBeginRenderingKHR</text>
<text x="185.0" y="296" text-anchor="middle" font-size="11" fill="#374151">becomes vkCmdBeginRendering).</text>
<rect x="380" y="200" width="360" height="115" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560.0" y="218" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">What it means for your code</text>
<text x="560.0" y="236" text-anchor="middle" font-size="11" fill="#92400E">Query the extension list and also the core version:</text>
<text x="560.0" y="251" text-anchor="middle" font-size="11" fill="#92400E">a promoted feature is present when apiVersion is high enough,</text>
<text x="560.0" y="266" text-anchor="middle" font-size="11" fill="#92400E">even if the extension name is not listed.</text>
<text x="560.0" y="281" text-anchor="middle" font-size="11" fill="#92400E">Enable the feature struct either way.</text>
</svg>
