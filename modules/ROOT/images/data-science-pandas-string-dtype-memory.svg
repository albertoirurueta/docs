<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Memory of one text column under three dtypes</title>
  <desc id="d">Bars showing a column of 300,000 sensor names: object dtype 17.7 megabytes, default str dtype 5.4 megabytes and category dtype 0.6 megabytes.</desc>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">One text column, three dtypes</text>
  <text x="24" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">300,000 values drawn from 200 distinct names, memory_usage(deep=True)</text>
  <line x1="150" y1="76" x2="150" y2="270" stroke="#94A3B8" stroke-width="1.5"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">
    <text x="136" y="112" text-anchor="end">object</text>
    <text x="136" y="172" text-anchor="end">str</text>
    <text x="136" y="232" text-anchor="end">category</text>
  </g>
  <rect x="150" y="92" width="520" height="30" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <rect x="150" y="152" width="159" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <rect x="150" y="212" width="18" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A">
    <text x="590" y="112" text-anchor="end" font-weight="bold">17.7 MB</text>
    <text x="320" y="172" font-weight="bold">5.4 MB (default since pandas 3.0)</text>
    <text x="180" y="232" font-weight="bold">0.6 MB (integer codes plus 200 labels)</text>
  </g>
</svg>
