<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 970" width="860" height="970" role="img" aria-labelledby="backend-startup-memory-t backend-startup-memory-d">
<title id="backend-startup-memory-t">Startup time and memory: published figures only (lower is better)</title>
<desc id="backend-startup-memory-d">JIT and native (GraalVM) or AOT variants side by side. Each panel is one publisher and one metric with its own axis; figures from different publishers are not comparable. No house measurements were made.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}</style>
<rect width="860" height="970" fill="var(--bg)"/>
<text class="title" x="430" y="24" text-anchor="middle">Startup time and memory: published figures only (lower is better)</text>
