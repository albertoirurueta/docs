<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="320" fill="#ffffff"/>
  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Extension authoring: from build step to running application</text>
  <text x="390" y="48" font-size="11" fill="#666666" text-anchor="middle">solid arrows: build-time flow inside one build -- only the last box ships in the final artifact</text>

  <!-- Deployment module -->
  <rect x="15" y="90" width="175" height="130" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="102" y="114" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Deployment module</text>
  <text x="102" y="132" font-size="10.5" fill="#333333" text-anchor="middle">@BuildStep methods</text>
  <text x="102" y="148" font-size="10.5" fill="#333333" text-anchor="middle">consume/produce build items:</text>
  <text x="102" y="164" font-size="10" fill="#333333" text-anchor="middle">AdditionalBeanBuildItem,</text>
  <text x="102" y="178" font-size="10" fill="#333333" text-anchor="middle">ReflectiveClassBuildItem,</text>
  <text x="102" y="192" font-size="10" fill="#333333" text-anchor="middle">SyntheticBeanBuildItem</text>
  <text x="102" y="210" font-size="9.5" fill="#a33" text-anchor="middle">build-time only -- never ships</text>

  <!-- Recorder -->
  <rect x="220" y="90" width="175" height="130" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="307" y="114" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">@Recorder call</text>
  <text x="307" y="134" font-size="10.5" fill="#333333" text-anchor="middle">a build step calls a</text>
  <text x="307" y="150" font-size="10.5" fill="#333333" text-anchor="middle">recorder method --</text>
  <text x="307" y="166" font-size="10.5" fill="#333333" text-anchor="middle">the call is not executed,</text>
  <text x="307" y="182" font-size="10.5" fill="#333333" text-anchor="middle">it records the bytecode</text>
  <text x="307" y="198" font-size="10.5" fill="#333333" text-anchor="middle">needed to reproduce it</text>

  <!-- Static/Runtime init -->
  <rect x="425" y="90" width="175" height="130" fill="#f0eaf7" stroke="#5a3a8a" stroke-width="1.4"/>
  <text x="512" y="114" font-size="13" font-weight="bold" fill="#5a3a8a" text-anchor="middle">Static / Runtime init</text>
  <text x="512" y="134" font-size="10.5" fill="#333333" text-anchor="middle">@Record(STATIC_INIT):</text>
  <text x="512" y="150" font-size="10.5" fill="#333333" text-anchor="middle">replayed once, baked into</text>
  <text x="512" y="164" font-size="10.5" fill="#333333" text-anchor="middle">the image heap / class init</text>
  <text x="512" y="182" font-size="10.5" fill="#333333" text-anchor="middle">@Record(RUNTIME_INIT):</text>
  <text x="512" y="198" font-size="10.5" fill="#333333" text-anchor="middle">replayed on every process start</text>

  <!-- Runtime module -->
  <rect x="630" y="90" width="135" height="130" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="697" y="114" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Runtime module</text>
  <text x="697" y="134" font-size="10.5" fill="#333333" text-anchor="middle">thin, already-</text>
  <text x="697" y="148" font-size="10.5" fill="#333333" text-anchor="middle">resolved code the</text>
  <text x="697" y="162" font-size="10.5" fill="#333333" text-anchor="middle">recorder actually</text>
  <text x="697" y="176" font-size="10.5" fill="#333333" text-anchor="middle">references</text>
  <text x="697" y="196" font-size="9.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">ships in the app</text>

  <!-- arrows -->
  <line x1="190" y1="150" x2="220" y2="150" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="395" y1="150" x2="425" y2="150" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <line x1="600" y1="150" x2="630" y2="150" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow2)"/>

  <!-- caption -->
  <text x="390" y="270" font-size="10.5" fill="#666666" text-anchor="middle">The deployment module's build steps and recorder calls happen once, during augmentation; only the recorded</text>
  <text x="390" y="286" font-size="10.5" fill="#666666" text-anchor="middle">bytecode replay and the thin runtime module survive into the packaged JAR or native executable</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
