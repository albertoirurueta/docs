<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Where each Sheets command lives</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" fill="#1F2937" text-anchor="middle" font-weight="bold">Where each Sheets command lives</text>
  <text x="380" y="412" font-size="11" fill="#6B7280" text-anchor="middle">Schematic, not a screenshot. Command names follow the Help Center articles checked on 2026-11-07.</text>
  <rect x="210" y="46" width="340" height="34" rx="17" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="68" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Actions menu in the floating toolbar</text>
  <rect x="20" y="110" width="232" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="136" y="132" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Generate and analyse</text>
  <rect x="34" y="144" width="204" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="136" y="163" font-size="12" fill="#374151" text-anchor="middle">Generate table</text>
  <rect x="34" y="182" width="204" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="136" y="201" font-size="12" fill="#374151" text-anchor="middle">Fill empty cells</text>
  <rect x="34" y="220" width="204" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="136" y="239" font-size="12" fill="#374151" text-anchor="middle">Magic Write</text>
  <rect x="34" y="258" width="204" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="136" y="277" font-size="12" fill="#374151" text-anchor="middle">Magic Insights</text>
  <path d="M300,80 L136,108" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="268" y="110" width="232" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="384" y="132" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Data in, designs out</text>
  <rect x="282" y="144" width="204" height="30" rx="6" fill="#FEF3C7" stroke="#9CA3AF" stroke-width="1"/>
  <text x="384" y="163" font-size="12" fill="#374151" text-anchor="middle">Import data</text>
  <rect x="282" y="182" width="204" height="30" rx="6" fill="#FEF3C7" stroke="#9CA3AF" stroke-width="1"/>
  <text x="384" y="201" font-size="12" fill="#374151" text-anchor="middle">Data Actions (after import)</text>
  <rect x="282" y="220" width="204" height="30" rx="6" fill="#FEF3C7" stroke="#9CA3AF" stroke-width="1"/>
  <text x="384" y="239" font-size="12" fill="#374151" text-anchor="middle">Bulk Create</text>
  <rect x="282" y="258" width="204" height="30" rx="6" fill="#FEF3C7" stroke="#9CA3AF" stroke-width="1"/>
  <text x="384" y="277" font-size="12" fill="#374151" text-anchor="middle">Resize designs</text>
  <path d="M380,80 L384,108" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="516" y="110" width="232" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="632" y="132" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Format and structure</text>
  <rect x="530" y="144" width="204" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="632" y="163" font-size="12" fill="#374151" text-anchor="middle">Conditional Formatting</text>
  <rect x="530" y="182" width="204" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="632" y="201" font-size="12" fill="#374151" text-anchor="middle">Dropdown</text>
  <rect x="530" y="220" width="204" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="632" y="239" font-size="12" fill="#374151" text-anchor="middle">Sort and Filter (toolbar)</text>
  <rect x="530" y="258" width="204" height="30" rx="6" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="632" y="277" font-size="12" fill="#374151" text-anchor="middle">Group rows, Hide columns</text>
  <path d="M460,80 L632,108" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="20" y="332" width="356" height="60" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="198" y="354" font-size="13" fill="#92400E" text-anchor="middle" font-weight="bold">Type = in a cell</text>
  <text x="198" y="374" font-size="11" fill="#374151" text-anchor="middle">Pick Magic Formulas and describe the calculation</text>
  <rect x="384" y="332" width="356" height="60" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="562" y="354" font-size="13" fill="#92400E" text-anchor="middle" font-weight="bold">Canva AI in the side panel</text>
  <text x="562" y="374" font-size="11" fill="#374151" text-anchor="middle">Prompts that edit the sheet (Canva AI 2.0)</text>
</svg>
