<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">One Dockerfile, three images: the build stages of the Pocket Coffee PrestaShop image</title>
  <desc id="d">Left column, the inputs: the official prestashop/prestashop 9.2.0-fpm image, the repository folders modules, themes, docker and nginx, and the Node, Composer and Nginx base images. Middle column, the build stages: a theme stage builds the theme assets with Node, a modules stage runs Composer for the modules, the base stage adds the redis extension, the PHP and PHP-FPM settings, the modules, the theme and the entrypoint. The installer stage keeps admin and install for the one-off install Job. The app stage renames admin to admin-pocketcoffee, removes install and the Entity index files, and adds the read-only parameters.php. A static stage copies the images, scripts and style sheets out of the app stage. Right column, the three images: the php-fpm image tagged with the git SHA, the Nginx image tagged with the SHA and the suffix web, and the installer image tagged with the SHA and the suffix installer. A bottom strip lists what never enters an image: Node, Composer, secrets, the compiled var/cache and the shop media.</desc>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">One Dockerfile builds three images from public base images and the repository</text>

  <g>
    <rect x="30" y="52" width="230" height="350" rx="10" fill="#33485c"/>
    <rect x="300" y="52" width="360" height="350" rx="10" fill="#3d5266"/>
    <rect x="700" y="52" width="230" height="350" rx="10" fill="#33485c"/>
  </g>
  <g fill="#f4b860" font-size="14" font-weight="bold">
    <text x="42" y="76">Inputs</text>
    <text x="312" y="76">Build stages</text>
    <text x="712" y="76">Images in the registry</text>
  </g>

  <g fill="#f2f5f8" font-size="12.5">
    <text x="42" y="104" font-weight="bold">prestashop/prestashop:9.2.0-fpm</text>
    <text x="42" y="121">PrestaShop, PHP 8.5, php-fpm</text>
    <text x="42" y="152" font-weight="bold">nginxinc/nginx-unprivileged</text>
    <text x="42" y="169">Nginx 1.29 as user nginx</text>
    <text x="42" y="200" font-weight="bold">node:24-slim, composer:2</text>
    <text x="42" y="217">build tools, stages only</text>
    <text x="42" y="248" font-weight="bold">modules/ themes/pocketcoffee/</text>
    <text x="42" y="265">pocketcoffee_roast, _pay, _lot</text>
    <text x="42" y="296" font-weight="bold">docker/ nginx/</text>
    <text x="42" y="313">ini, pool, entrypoint,</text>
    <text x="42" y="330">parameters.php, default.conf</text>
    <text x="42" y="372" fill="#9fd3c7">Build argument ADMIN_DIR</text>
    <text x="42" y="389" fill="#9fd3c7">= admin-pocketcoffee</text>
  </g>

  <g fill="#f2f5f8" font-size="12.5">
    <rect x="312" y="88" width="160" height="42" rx="8" fill="#2f4a44"/>
    <text x="322" y="106" font-weight="bold">theme</text>
    <text x="322" y="122">npm ci, npm run build</text>
    <rect x="488" y="88" width="160" height="42" rx="8" fill="#2f4a44"/>
    <text x="498" y="106" font-weight="bold">modules</text>
    <text x="498" y="122">composer install --no-dev</text>

    <rect x="312" y="150" width="336" height="58" rx="8" fill="#4d7c5a"/>
    <text x="322" y="168" font-weight="bold">base</text>
    <text x="322" y="185">redis extension, zz-pocketcoffee.ini and .conf,</text>
    <text x="322" y="201">modules, theme, entrypoint</text>

    <rect x="312" y="228" width="160" height="58" rx="8" fill="#7a5c3a"/>
    <text x="322" y="246" font-weight="bold">installer</text>
    <text x="322" y="263">keeps admin/ and install/</text>
    <text x="322" y="279">for the install Job</text>
    <rect x="488" y="228" width="160" height="58" rx="8" fill="#4d7c5a"/>
    <text x="498" y="246" font-weight="bold">app</text>
    <text x="498" y="263">admin-pocketcoffee,</text>
    <text x="498" y="279">no install/, non-root</text>

    <rect x="488" y="308" width="160" height="42" rx="8" fill="#2f4a44"/>
    <text x="498" y="326" font-weight="bold">static</text>
    <text x="498" y="342">css, js, images, fonts</text>
    <rect x="312" y="308" width="160" height="42" rx="8" fill="#2f4a44"/>
    <text x="322" y="326" font-weight="bold">web (Nginx)</text>
    <text x="322" y="342">static + default.conf</text>
  </g>

  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="392" y1="130" x2="392" y2="148" marker-end="url(#a)"/>
    <line x1="568" y1="130" x2="568" y2="148" marker-end="url(#a)"/>
    <line x1="392" y1="208" x2="392" y2="226" marker-end="url(#a)"/>
    <line x1="568" y1="208" x2="568" y2="226" marker-end="url(#a)"/>
    <line x1="568" y1="286" x2="568" y2="306" marker-end="url(#a)"/>
    <line x1="486" y1="329" x2="474" y2="329" marker-end="url(#a)"/>
  </g>
  <g stroke="#f4b860" stroke-width="3" fill="none">
    <line x1="262" y1="227" x2="298" y2="227" marker-end="url(#a)"/>
    <line x1="662" y1="227" x2="698" y2="227" marker-end="url(#a)"/>
  </g>
  <g>
    <circle cx="634" cy="240" r="11" fill="#f4b860"/>
    <circle cx="458" cy="322" r="11" fill="#f4b860"/>
    <circle cx="458" cy="240" r="11" fill="#f4b860"/>
    <circle cx="904" cy="106" r="11" fill="#f4b860"/>
    <circle cx="904" cy="202" r="11" fill="#f4b860"/>
    <circle cx="904" cy="298" r="11" fill="#f4b860"/>
  </g>
  <g fill="#1b2733" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="634" y="245">1</text>
    <text x="458" y="327">2</text>
    <text x="458" y="245">3</text>
    <text x="904" y="111">1</text>
    <text x="904" y="207">2</text>
    <text x="904" y="303">3</text>
  </g>

  <g fill="#f2f5f8" font-size="12.5">
    <rect x="712" y="92" width="206" height="76" rx="8" fill="#4d7c5a"/>
    <text x="722" y="110" font-weight="bold">pocketcoffee/prestashop</text>
    <text x="722" y="127">:&lt;git-sha&gt;</text>
    <text x="722" y="144">php-fpm on loopback, non-root</text>
    <text x="722" y="160">pods, cron and migrate Jobs</text>
    <rect x="712" y="188" width="206" height="76" rx="8" fill="#3f6e9a"/>
    <text x="722" y="206" font-weight="bold">pocketcoffee/prestashop</text>
    <text x="722" y="223">:&lt;git-sha&gt;-nginx</text>
    <text x="722" y="240">nginx on port 8080, non-root</text>
    <text x="722" y="256">second container of the pod</text>
    <rect x="712" y="284" width="206" height="76" rx="8" fill="#7a5c3a"/>
    <text x="722" y="302" font-weight="bold">pocketcoffee/prestashop</text>
    <text x="722" y="319">:&lt;git-sha&gt;-install</text>
    <text x="722" y="336">used once, by the install Job</text>
    <text x="722" y="352">of an empty database</text>
  </g>

  <rect x="30" y="418" width="900" height="82" rx="10" fill="#2f4a44"/>
  <g fill="#f2f5f8" font-size="12.5">
    <text x="44" y="442" font-weight="bold" fill="#9fd3c7">Never inside an image</text>
    <text x="44" y="462">Node and Composer (build stages only)  |  any secret: DB password, cookie keys, API keys (they come from the environment of the pod)</text>
    <text x="44" y="481">The compiled var/cache (it embeds the database settings and the active modules)  |  shop media in img/, upload/ and download/</text>
  </g>
</svg>
