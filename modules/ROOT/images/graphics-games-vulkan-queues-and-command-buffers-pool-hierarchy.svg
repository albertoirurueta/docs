<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-qcb-pools" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Command pools own the memory of command buffers</text>
<rect x="20" y="60" width="150" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="99.5" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">VkDevice</text>
<rect x="230" y="60" width="500" height="150" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="480.0" y="139.2" text-anchor="middle" font-size="12" fill="#374151"> </text>
<text x="480" y="80" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">One VkCommandPool per (thread, frame in flight), tied to one queue family</text>
<rect x="250" y="95" width="220" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="360.0" y="126.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Primary buffers</text>
<text x="360.0" y="141.3" text-anchor="middle" font-size="11" fill="#3730A3">vkBeginCommandBuffer</text>
<text x="360.0" y="156.3" text-anchor="middle" font-size="11" fill="#3730A3">can be submitted to a queue</text>
<text x="360.0" y="171.3" text-anchor="middle" font-size="11" fill="#3730A3">can call secondaries</text>
<rect x="490" y="95" width="220" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="600.0" y="126.3" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Secondary buffers</text>
<text x="600.0" y="141.3" text-anchor="middle" font-size="11" fill="#92400E">cannot be submitted</text>
<text x="600.0" y="156.3" text-anchor="middle" font-size="11" fill="#92400E">executed by vkCmdExecuteCommands</text>
<text x="600.0" y="171.3" text-anchor="middle" font-size="11" fill="#92400E">inherit state from the primary</text>
<line x1="170" y1="95" x2="228" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-qcb-pools)"/>
<text x="199" y="88" text-anchor="middle" font-size="10" fill="#374151">create</text>
<rect x="20" y="240" width="230" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="135.0" y="268.9" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">vkResetCommandPool</text>
<text x="135.0" y="283.9" text-anchor="middle" font-size="11" fill="#065F46">recycles every buffer of the</text>
<text x="135.0" y="298.9" text-anchor="middle" font-size="11" fill="#065F46">pool in one cheap call</text>
<rect x="270" y="240" width="230" height="80" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="385.0" y="268.9" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">vkFreeCommandBuffers</text>
<text x="385.0" y="283.9" text-anchor="middle" font-size="11" fill="#374151">returns individual buffers</text>
<text x="385.0" y="298.9" text-anchor="middle" font-size="11" fill="#374151">to the pool</text>
<rect x="520" y="240" width="220" height="80" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630.0" y="268.9" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">vkDestroyCommandPool</text>
<text x="630.0" y="283.9" text-anchor="middle" font-size="11" fill="#374151">frees the pool and all</text>
<text x="630.0" y="298.9" text-anchor="middle" font-size="11" fill="#374151">buffers allocated from it</text>
<text x="380" y="360" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">A pool is externally synchronised: only one thread may touch it (or its buffers) at a time.</text>
<text x="380" y="382" text-anchor="middle" font-size="11" fill="#374151">That is why multithreaded recording uses one pool per thread and per frame.</text>
<text x="380" y="408" text-anchor="middle" font-size="11" fill="#374151">Flags: TRANSIENT hints short-lived buffers; RESET_COMMAND_BUFFER lets one buffer be reset alone.</text>
</svg>
