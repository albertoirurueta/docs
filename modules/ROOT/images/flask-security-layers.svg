<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Flask security layers</title>
  <defs>
    <marker id="fsl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">Where each protection lives</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">no single layer is enough: enforce each rule where it is cheapest and hardest to bypass</text>
  <rect x="10" y="70" width="132" height="150" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="76" y="94" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">1 Browser</text>
  <text x="76" y="122" font-size="10.5" fill="currentColor" text-anchor="middle">enforces CSP</text>
  <text x="76" y="144" font-size="10.5" fill="currentColor" text-anchor="middle">SameSite, Secure,</text>
  <text x="76" y="166" font-size="10.5" fill="currentColor" text-anchor="middle">HttpOnly, nosniff</text>
  <text x="76" y="188" font-size="10.5" fill="currentColor" text-anchor="middle">same-origin policy</text>
  <line x1="142" y1="125" x2="152" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#fsl-arrow)"/>
  <rect x="152" y="70" width="132" height="150" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="218" y="94" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">2 Proxy / platform</text>
  <text x="218" y="122" font-size="10.5" fill="currentColor" text-anchor="middle">TLS and HSTS</text>
  <text x="218" y="144" font-size="10.5" fill="currentColor" text-anchor="middle">body size, timeouts</text>
  <text x="218" y="166" font-size="10.5" fill="currentColor" text-anchor="middle">rate limiting</text>
  <text x="218" y="188" font-size="10.5" fill="currentColor" text-anchor="middle">X-Forwarded-*</text>
  <line x1="284" y1="125" x2="294" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#fsl-arrow)"/>
  <rect x="294" y="70" width="132" height="150" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="360" y="94" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">3 WSGI server</text>
  <text x="360" y="122" font-size="10.5" fill="currentColor" text-anchor="middle">worker timeouts</text>
  <text x="360" y="144" font-size="10.5" fill="currentColor" text-anchor="middle">header limits</text>
  <text x="360" y="166" font-size="10.5" fill="currentColor" text-anchor="middle">process isolation</text>
  <text x="360" y="188" font-size="10.5" fill="currentColor" text-anchor="middle">no debugger</text>
  <line x1="426" y1="125" x2="436" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#fsl-arrow)"/>
  <rect x="436" y="70" width="132" height="150" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="502" y="94" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">4 Flask</text>
  <text x="502" y="122" font-size="10.5" fill="currentColor" text-anchor="middle">request size limits</text>
  <text x="502" y="144" font-size="10.5" fill="currentColor" text-anchor="middle">TRUSTED_HOSTS</text>
  <text x="502" y="166" font-size="10.5" fill="currentColor" text-anchor="middle">SECRET_KEY, cookies</text>
  <text x="502" y="188" font-size="10.5" fill="currentColor" text-anchor="middle">CSRF, rate limits</text>
  <line x1="568" y1="125" x2="578" y2="125" stroke="currentColor" stroke-width="1.5" marker-end="url(#fsl-arrow)"/>
  <rect x="578" y="70" width="132" height="150" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="644" y="94" font-size="12.5" font-weight="bold" fill="currentColor" text-anchor="middle">5 Jinja / response</text>
  <text x="644" y="122" font-size="10.5" fill="currentColor" text-anchor="middle">autoescape, tojson</text>
  <text x="644" y="144" font-size="10.5" fill="currentColor" text-anchor="middle">sanitised rich text</text>
  <text x="644" y="166" font-size="10.5" fill="currentColor" text-anchor="middle">security headers</text>
  <text x="644" y="188" font-size="10.5" fill="currentColor" text-anchor="middle">generic errors</text>
  <line x1="70" y1="250" x2="650" y2="250" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fsl-arrow)" marker-start="url(#fsl-arrow)"/>
  <text x="360" y="244" font-size="11" fill="currentColor" text-anchor="middle">request travels right, response travels back left</text>
  <text x="360" y="274" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.85">Flask-Talisman, Flask-WTF and Flask-Limiter plug into layer 4 and act on layers 1 and 5</text>
</svg>
