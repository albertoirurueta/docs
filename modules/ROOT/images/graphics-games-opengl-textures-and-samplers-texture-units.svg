<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-textures-and-samplers-texture-units" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Texture objects, texture units, sampler objects and shader samplers</text>
<rect x="40" y="50" width="210" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145" y="69" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Texture objects</text>
<text x="145" y="92" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glCreateTextures / glGenTextures</text>
<rect x="275" y="50" width="210" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="69" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Texture units</text>
<text x="380" y="92" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glActiveTexture(GL_TEXTURE0 + i)</text>
<rect x="510" y="50" width="210" height="28" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="615" y="69" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Shader</text>
<text x="615" y="92" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">uniform sampler2D</text>
<rect x="40" y="110" width="210" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="145" y="139" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">texture: cover</text>
<rect x="40" y="170" width="210" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="145" y="199" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">texture: spine</text>
<rect x="40" y="230" width="210" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="145" y="259" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">texture: pages</text>
<rect x="275" y="110" width="210" height="48" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="130" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">unit 0</text>
<text x="380" y="147" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glBindTexture + glBindSampler</text>
<line x1="250" y1="134" x2="275" y2="134" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-texture-units)"/>
<rect x="275" y="170" width="210" height="48" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="190" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">unit 1</text>
<text x="380" y="207" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glBindTexture + glBindSampler</text>
<line x1="250" y1="194" x2="275" y2="194" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-texture-units)"/>
<rect x="275" y="230" width="210" height="48" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="250" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">unit 2</text>
<text x="380" y="267" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glBindTexture + glBindSampler</text>
<line x1="250" y1="254" x2="275" y2="254" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-texture-units)"/>
<rect x="510" y="110" width="210" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="615" y="131" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">uCover = 0</text>
<text x="615" y="148" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glUniform1i(loc, 0)</text>
<rect x="510" y="170" width="210" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="615" y="191" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">uSpine = 1</text>
<text x="615" y="208" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glUniform1i(loc, 1)</text>
<rect x="510" y="230" width="210" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="615" y="251" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">uPages = 2</text>
<text x="615" y="268" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">glUniform1i(loc, 2)</text>
<line x1="485" y1="134" x2="510" y2="134" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-texture-units)"/>
<line x1="485" y1="194" x2="510" y2="194" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-texture-units)"/>
<line x1="485" y1="254" x2="510" y2="254" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-textures-and-samplers-texture-units)"/>
<rect x="275" y="304" width="210" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="322" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">sampler object: filter + wrap</text>
<text x="380" y="337" font-size="10" font-weight="normal" fill="#92400E" text-anchor="middle">overrides the texture's own state</text>
<line x1="380" y1="304" x2="380" y2="282" stroke="#B45309" stroke-width="1.2" marker-end="url(#ah-textures-and-samplers-texture-units)"/>
</svg>
