<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="350" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: make and play the book-thud MetaSound</text>
<rect x="14" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="30" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="81.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Content Browser:</text>
<text x="81.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">Add &gt; Audio &gt;</text>
<text x="81.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">MetaSound Source</text>
<text x="81.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">name it MS_BookThud</text>
<text x="81.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Create the asset</text>
<line x1="149" y1="140" x2="159" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="176" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="176" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="227.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Double-click it</text>
<text x="227.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">Source button: pick a</text>
<text x="227.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">Sound Attenuation</text>
<text x="227.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">asset, SA_Book</text>
<text x="227.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Open the editor</text>
<line x1="295" y1="140" x2="305" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="306" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="322" cy="76" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="322" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="373.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">On Play to Random Get</text>
<text x="373.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">to Wave Player (Mono)</text>
<text x="373.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">to Mono Mixer (2),</text>
<text x="373.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">add Intensity input</text>
<text x="373.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Build the graph</text>
<line x1="441" y1="140" x2="451" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="452" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="468" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="468" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="519.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Press Play in the</text>
<text x="519.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">toolbar, click Execute</text>
<text x="519.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">on the trigger, drag</text>
<text x="519.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">the Intensity dial</text>
<text x="519.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Audition</text>
<line x1="587" y1="140" x2="597" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="598" y="60" width="134" height="160" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="614" cy="76" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="614" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="665.0" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Spawn Sound Attached</text>
<text x="665.0" y="134" text-anchor="middle" font-size="11" fill="#3730A3">then Set Float</text>
<text x="665.0" y="156" text-anchor="middle" font-size="11" fill="#3730A3">Parameter Intensity</text>
<text x="665.0" y="178" text-anchor="middle" font-size="11" fill="#3730A3">on the result</text>
<text x="665.0" y="242" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Play from a Book</text>
<text x="380" y="290" text-anchor="middle" font-size="11" fill="#374151">A MetaSound Source keeps the OneShot interface by default, which adds the On Finished output.</text>
<text x="380" y="308" text-anchor="middle" font-size="11" fill="#374151">Remove that interface for a sound that should never stop on its own, such as a room tone.</text>
</svg>
