<text x="726" y="228" font-size="10" font-weight="normal" fill="#374151" text-anchor="end">(w,h)</text>
<rect x="669.0" y="130.0" width="30" height="60" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<line x1="674.4" y1="130.0" x2="674.4" y2="190.0" stroke="#4F46E5" stroke-width="1.2"/>
<text x="380" y="310" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">A book vertex gains an extra coordinate at step 4 (w) and loses it again at the divide.</text>
