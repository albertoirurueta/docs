<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="740" height="330" fill="#FFFFFF"/>
  <text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Reading a Community listing before you run a plugin</text>

  <rect x="20" y="50" width="300" height="260" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <rect x="36" y="66" width="268" height="22" rx="4" fill="#E5E7EB"/>
  <text x="48" y="82" font-size="12" font-weight="bold" fill="#1F2937">Example plugin listing</text>
  <rect x="36" y="100" width="120" height="14" rx="3" fill="#EEF2FF"/>
  <text x="44" y="111" font-size="11" fill="#3730A3">Creator and support</text>
  <rect x="36" y="128" width="268" height="30" rx="4" fill="#EEF2FF"/>
  <text x="44" y="147" font-size="12" fill="#374151">Description, comments, uses</text>
  <rect x="36" y="168" width="268" height="30" rx="4" fill="#FEF3C7"/>
  <text x="44" y="187" font-size="12" fill="#92400E">Network access: allowed domains</text>
  <rect x="36" y="208" width="268" height="30" rx="4" fill="#FEF3C7"/>
  <text x="44" y="227" font-size="12" fill="#92400E">Security disclosure, if approved</text>
  <rect x="36" y="248" width="268" height="30" rx="4" fill="#EEF2FF"/>
  <text x="44" y="267" font-size="12" fill="#374151">Price, in-app purchases, trial</text>

  <g fill="#B45309">
    <circle cx="344" cy="183" r="11"/><circle cx="344" cy="223" r="11"/>
  </g>
  <g fill="#4F46E5">
    <circle cx="344" cy="143" r="11"/><circle cx="344" cy="263" r="11"/><circle cx="344" cy="115" r="11"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="344" y="119">1</text><text x="344" y="147">2</text><text x="344" y="187">3</text><text x="344" y="227">4</text><text x="344" y="267">5</text>
  </g>

  <g font-size="13" fill="#374151">
    <text x="370" y="104" font-weight="bold" fill="#3730A3">What to ask yourself</text>
    <text x="370" y="120">1  Is there a creator with a support channel?</text>
    <text x="370" y="148">2  Is it used and discussed by others?</text>
    <text x="370" y="188">3  Does it need the network, and for what?</text>
    <text x="370" y="228">4  Has the creator disclosed data handling?</text>
    <text x="370" y="268">5  Is any account or payment required?</text>
  </g>
  <text x="370" y="298" font-size="12" fill="#92400E">Amber rows are the ones that decide whether file data leaves Figma.</text>
</svg>
