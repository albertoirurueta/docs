<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs><rect width="720" height="360" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Block menu and Markdown shorthand</text>
