<text x="36" y="80" font-size="13" fill="#374151">Type / on an empty line</text>
<rect x="36" y="96" width="218" height="224" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<g font-size="13" fill="#3730A3"><text x="52" y="124">Heading 1, 2, 3</text><text x="52" y="152">Bullet list</text><text x="52" y="180">Numbered list</text><text x="52" y="208">To-do</text><text x="52" y="236">Quote</text><text x="52" y="264">Code block</text><text x="52" y="292">Image / Figma file embed</text><text x="52" y="312">Divider</text></g>
<circle cx="262" cy="70" r="11" fill="#4F46E5"/><text x="262" y="74" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="300" y="50" width="400" height="290" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="316" y="80" font-size="13" font-weight="bold" fill="#1F2937">Shorthand typed at line start</text>
<g font-size="13" fill="#374151" font-family="Courier, monospace"><text x="316" y="116"># ## ###</text><text x="316" y="150">* or -</text><text x="316" y="184">1.</text><text x="316" y="218">[]</text><text x="316" y="252">&gt;</text><text x="316" y="286">three backticks</text><text x="316" y="320">no shorthand</text></g>
<g font-size="13" fill="#374151"><text x="470" y="116">Heading 1, 2, 3</text><text x="470" y="150">Bullet list</text><text x="470" y="184">Numbered list</text><text x="470" y="218">To-do</text><text x="470" y="252">Quote</text><text x="470" y="286">Code block</text><text x="470" y="320">Image, embed, divider</text></g>
