<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Direct light and indirect bounces in L_Library</text>
<rect x="60" y="60" width="640" height="300" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<rect x="60" y="320" width="640" height="40" rx="0" fill="#D6B88A" stroke="#4B5563" stroke-width="1.5"/>
<rect x="60" y="60" width="20" height="260" rx="0" fill="#F3E8D0" stroke="#4B5563" stroke-width="1"/>
<rect x="400" y="262" width="70" height="58" rx="2" fill="#B45309" stroke="#92400E" stroke-width="1.5"/>
<text x="435" y="296" text-anchor="middle" font-size="12" fill="#FFFFFF">Book</text>
<circle cx="150" cy="110" r="16" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
<text x="150" y="90" text-anchor="middle" font-size="12" fill="#92400E">Desk lamp</text>
<line x1="160" y1="124" x2="420" y2="262" stroke="#B45309" stroke-width="2" marker-end="url(#d1)"/>
<text x="260" y="170" text-anchor="middle" font-size="12" fill="#92400E">direct</text>
<line x1="150" y1="126" x2="250" y2="318" stroke="#B45309" stroke-width="2" marker-end="url(#d1)"/>
<line x1="420" y1="262" x2="330" y2="140" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#d1)"/>
<text x="420" y="185" text-anchor="start" font-size="12" fill="#92400E">1st bounce, warm</text>
<line x1="250" y1="318" x2="560" y2="322" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 3"/>
<line x1="435" y1="320" x2="600" y2="200" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#d1)"/>
<text x="600" y="190" text-anchor="middle" font-size="12" fill="#374151">2nd bounce, fainter</text>
<rect x="600" y="240" width="70" height="80" rx="3" fill="#6D4C2F" stroke="#4B5563" stroke-width="1.5"/>
<text x="635" y="285" text-anchor="middle" font-size="12" fill="#FFFFFF">Shelf</text>
<text x="380" y="385" text-anchor="middle" font-size="12" fill="#374151">Lumen traces these paths each frame, so moving the lamp or opening a door changes the indirect light without a bake.</text>
</svg>
