<svg viewBox="0 0 900 560" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">An EKS cluster: AWS-managed control plane, your data plane and the services around it</text>

  <!-- AWS managed account -->
  <rect x="20" y="44" width="250" height="400" rx="12" fill="#f3eefb" stroke="#6b4fa3" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="145" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#43307a">AWS-managed account</text>
  <text x="145" y="84" text-anchor="middle" font-size="10.5" fill="#43307a">control plane, spread over 3 AZs</text>
  <rect x="40" y="98" width="210" height="52" rx="6" fill="#e3d9f5" stroke="#6b4fa3"/>
  <text x="145" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#2d1f55">Kubernetes API servers</text>
  <text x="145" y="137" text-anchor="middle" font-size="10" fill="#2d1f55">scheduler, controller managers</text>
  <rect x="40" y="162" width="210" height="44" rx="6" fill="#e3d9f5" stroke="#6b4fa3"/>
  <text x="145" y="189" text-anchor="middle" font-size="12" font-weight="600" fill="#2d1f55">etcd (encrypted at rest)</text>
  <rect x="40" y="218" width="210" height="44" rx="6" fill="#e3d9f5" stroke="#6b4fa3"/>
  <text x="145" y="237" text-anchor="middle" font-size="12" font-weight="600" fill="#2d1f55">EKS Auth service</text>
  <text x="145" y="252" text-anchor="middle" font-size="10" fill="#2d1f55">Pod Identity credentials</text>
  <rect x="40" y="274" width="210" height="44" rx="6" fill="#e3d9f5" stroke="#6b4fa3"/>
  <text x="145" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#2d1f55">Auto Mode controllers</text>
  <text x="145" y="308" text-anchor="middle" font-size="10" fill="#2d1f55">compute, storage, load balancing</text>
  <rect x="40" y="330" width="210" height="44" rx="6" fill="#e3d9f5" stroke="#6b4fa3"/>
  <text x="145" y="349" text-anchor="middle" font-size="12" font-weight="600" fill="#2d1f55">EKS Capabilities (optional)</text>
  <text x="145" y="364" text-anchor="middle" font-size="10" fill="#2d1f55">Argo CD, ACK, kro</text>
  <text x="145" y="404" text-anchor="middle" font-size="10" fill="#43307a">You never see these instances;</text>
  <text x="145" y="418" text-anchor="middle" font-size="10" fill="#43307a">you reach the API endpoint only</text>

  <!-- ENI arrows -->
  <line x1="270" y1="150" x2="330" y2="150" stroke="#5c6b7a" stroke-width="2"/>
  <polygon points="330,145 340,150 330,155" fill="#5c6b7a"/>
  <text x="305" y="140" text-anchor="middle" font-size="10" fill="#3c4a58">cross-account</text>
  <text x="305" y="172" text-anchor="middle" font-size="10" fill="#3c4a58">ENIs</text>

  <!-- Customer VPC -->
  <rect x="340" y="44" width="540" height="400" rx="12" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="360" y="68" font-size="13" font-weight="700" fill="#3c4a58">Your VPC (data plane)</text>

  <rect x="360" y="84" width="250" height="210" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="485" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Private subnet, AZ A</text>
  <rect x="376" y="116" width="218" height="52" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="485" y="138" text-anchor="middle" font-size="11.5" font-weight="600" fill="#123a72">Node (Auto Mode, Bottlerocket)</text>
  <text x="485" y="155" text-anchor="middle" font-size="10" fill="#123a72">Pods: catalog-api, orders-api</text>
  <rect x="376" y="178" width="218" height="52" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="485" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#123a72">Managed node group (EC2)</text>
  <text x="485" y="217" text-anchor="middle" font-size="10" fill="#123a72">Pods: notifier, add-on DaemonSets</text>
  <rect x="376" y="240" width="218" height="40" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="485" y="265" text-anchor="middle" font-size="11.5" font-weight="600" fill="#123a72">Fargate profile (optional)</text>

  <rect x="630" y="84" width="230" height="210" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="1.8"/>
  <text x="745" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Private subnet, AZ B</text>
  <rect x="646" y="116" width="198" height="52" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="745" y="138" text-anchor="middle" font-size="11.5" font-weight="600" fill="#123a72">Node (Auto Mode)</text>
  <text x="745" y="155" text-anchor="middle" font-size="10" fill="#123a72">Pods spread by topology</text>
  <rect x="646" y="178" width="198" height="52" rx="5" fill="#dbe7fb" stroke="#1a73e8"/>
  <text x="745" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#123a72">Managed node group (EC2)</text>
  <text x="745" y="217" text-anchor="middle" font-size="10" fill="#123a72">Karpenter or fixed size</text>
  <text x="745" y="265" text-anchor="middle" font-size="10" fill="#123a72">VPC CNI: Pod IPs from the subnet</text>

  <rect x="360" y="308" width="500" height="44" rx="8" fill="#fff4e0" stroke="#b8741a" stroke-width="1.6"/>
  <text x="610" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#6a4300">Public subnets: load balancers (ALB, NLB) and NAT gateway</text>
  <text x="610" y="343" text-anchor="middle" font-size="10" fill="#6a4300">created by the Load Balancer Controller or Auto Mode for Services, Ingress and Gateways</text>

  <rect x="360" y="366" width="500" height="64" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="610" y="387" text-anchor="middle" font-size="12" font-weight="700" fill="#1b4d20">Add-ons and agents</text>
  <text x="610" y="404" text-anchor="middle" font-size="10.5" fill="#1b4d20">VPC CNI, CoreDNS, kube-proxy, EBS/EFS CSI, Pod Identity Agent,</text>
  <text x="610" y="419" text-anchor="middle" font-size="10.5" fill="#1b4d20">CloudWatch Observability, ADOT (Auto Mode folds several of these into the platform)</text>

  <!-- Surrounding services -->
  <rect x="20" y="470" width="190" height="70" rx="8" fill="#e8f0fe" stroke="#1a5fb4"/>
  <text x="115" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Amazon ECR</text>
  <text x="115" y="511" text-anchor="middle" font-size="10" fill="#123a72">bookshelf/catalog-api</text>
  <text x="115" y="525" text-anchor="middle" font-size="10" fill="#123a72">images pulled by nodes</text>
  <rect x="235" y="470" width="190" height="70" rx="8" fill="#e8f0fe" stroke="#1a5fb4"/>
  <text x="330" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">Secrets Manager / S3</text>
  <text x="330" y="511" text-anchor="middle" font-size="10" fill="#123a72">read by Pods through</text>
  <text x="330" y="525" text-anchor="middle" font-size="10" fill="#123a72">EKS Pod Identity</text>
  <rect x="450" y="470" width="190" height="70" rx="8" fill="#e8f0fe" stroke="#1a5fb4"/>
  <text x="545" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">CloudWatch</text>
  <text x="545" y="511" text-anchor="middle" font-size="10" fill="#123a72">control plane logs,</text>
  <text x="545" y="525" text-anchor="middle" font-size="10" fill="#123a72">Container Insights, metrics</text>
  <rect x="665" y="470" width="215" height="70" rx="8" fill="#e8f0fe" stroke="#1a5fb4"/>
  <text x="772" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#123a72">IAM and access entries</text>
  <text x="772" y="511" text-anchor="middle" font-size="10" fill="#123a72">who may call the Kubernetes API,</text>
  <text x="772" y="525" text-anchor="middle" font-size="10" fill="#123a72">cluster role, node role</text>
  <line x1="610" y1="444" x2="545" y2="468" stroke="#5c6b7a" stroke-width="1.4"/>
  <line x1="500" y1="444" x2="330" y2="468" stroke="#5c6b7a" stroke-width="1.4"/>
  <line x1="420" y1="444" x2="115" y2="468" stroke="#5c6b7a" stroke-width="1.4"/>
  <line x1="780" y1="444" x2="772" y2="468" stroke="#5c6b7a" stroke-width="1.4"/>
</svg>
