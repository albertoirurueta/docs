<text x="127" y="268" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">world = I</text>
<line x1="235" y1="256" x2="270" y2="256" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-sg-matrix-chain)"/>
<rect x="270" y="230" width="215" height="52" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
