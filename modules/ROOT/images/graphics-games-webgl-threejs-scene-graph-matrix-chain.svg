<rect x="262" y="98" width="170" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="347" y="122" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">matrix</text>
<text x="347" y="140" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">local = T x R x S</text>
<line x1="432" y1="126" x2="484" y2="126" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-sg-matrix-chain)"/>
