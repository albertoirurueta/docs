<text x="377" y="268" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">local t = (1, 0, 0)</text>
<line x1="485" y1="256" x2="520" y2="256" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-sg-matrix-chain)"/>
