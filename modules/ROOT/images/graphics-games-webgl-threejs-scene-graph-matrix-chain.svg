<text x="380" y="304" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Book_Shaders matrixWorld translation = (1, 0, 0) + (-0.39, 0.52, 0) = (0.61, 0.52, 0)</text>
<text x="380" y="324" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">flags: matrixAutoUpdate (local), matrixWorldAutoUpdate (world), matrixWorldNeedsUpdate</text>
