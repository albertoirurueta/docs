<text x="612" y="140" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">parent.matrixWorld x matrix</text>
<text x="347" y="176" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">updateMatrix()</text>
<text x="612" y="176" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">updateMatrixWorld()</text>
<text x="380" y="214" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Example along the Bookshelf chain (translation only, for clarity)</text>
