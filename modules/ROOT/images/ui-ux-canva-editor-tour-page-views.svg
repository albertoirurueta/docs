<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Four page views of the same five-page carousel</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#F9FAFB">
    <rect x="12" y="46" width="176" height="270" rx="10"/><rect x="198" y="46" width="176" height="270" rx="10"/><rect x="386" y="46" width="176" height="270" rx="10"/><rect x="572" y="46" width="176" height="270" rx="10"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle"><text x="100" y="68">Single page</text><text x="286" y="68">Thumbnails</text><text x="474" y="68">Scroll</text><text x="660" y="68">Grid</text></g>
  <!-- single -->
  <rect x="50" y="84" width="100" height="100" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><rect x="60" y="94" width="60" height="8" rx="2" fill="#4F46E5"/><rect x="60" y="150" width="80" height="24" rx="3" fill="#E5E7EB"/>
  <text x="100" y="212" font-size="12" fill="#374151" text-anchor="middle">One page at a time</text>
  <!-- thumbnails -->
  <rect x="226" y="84" width="120" height="120" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/><rect x="236" y="94" width="70" height="8" rx="2" fill="#4F46E5"/><rect x="236" y="164" width="100" height="30" rx="3" fill="#E5E7EB"/>
  <g stroke="#9CA3AF" fill="#EEF2FF"><rect x="208" y="262" width="30" height="30"/><rect x="244" y="262" width="30" height="30"/><rect x="280" y="262" width="30" height="30"/><rect x="316" y="262" width="30" height="30"/><rect x="352" y="262" width="0" height="30"/></g>
  <rect x="244" y="262" width="30" height="30" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="286" y="232" font-size="12" fill="#374151" text-anchor="middle">Strip of previews below</text>
  <!-- scroll -->
  <g stroke="#6B7280" stroke-width="1.5" fill="#FFFFFF"><rect x="436" y="82" width="76" height="76"/><rect x="436" y="168" width="76" height="76"/><rect x="436" y="254" width="76" height="50"/></g>
  <rect x="444" y="90" width="44" height="6" rx="2" fill="#4F46E5"/><rect x="444" y="176" width="44" height="6" rx="2" fill="#4F46E5"/><rect x="444" y="262" width="44" height="6" rx="2" fill="#4F46E5"/>
  <rect x="520" y="82" width="6" height="222" rx="3" fill="#D1D5DB"/><rect x="520" y="100" width="6" height="60" rx="3" fill="#4F46E5"/>
  <text x="474" y="326" font-size="12" fill="#374151" text-anchor="middle">Pages stacked, continuous scroll</text>
  <!-- grid -->
  <g stroke="#6B7280" stroke-width="1.5" fill="#FFFFFF"><rect x="590" y="86" width="64" height="64"/><rect x="664" y="86" width="64" height="64"/><rect x="590" y="168" width="64" height="64"/><rect x="664" y="168" width="64" height="64"/><rect x="590" y="250" width="64" height="50"/></g>
  <g fill="#4F46E5"><rect x="597" y="93" width="30" height="5" rx="2"/><rect x="671" y="93" width="30" height="5" rx="2"/><rect x="597" y="175" width="30" height="5" rx="2"/><rect x="671" y="175" width="30" height="5" rx="2"/><rect x="597" y="257" width="30" height="5" rx="2"/></g>
  <text x="660" y="326" font-size="12" fill="#374151" text-anchor="middle">All pages as tiles</text>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="100" y="262">Hides the video</text><text x="100" y="278">timeline if active</text>
    <text x="474" y="344">Hides the video</text><text x="474" y="360">timeline if active</text>
    <text x="660" y="344">Add, duplicate, delete,</text><text x="660" y="360">hide, drag to reorder</text>
    <text x="286" y="344">Toggled with the Pages button</text>
  </g>
  <text x="380" y="388" font-size="12" fill="#92400E" text-anchor="middle">Menu route for all four: File, Page view. Keyboard: Option+Cmd+1 scroll, 2 thumbnails, 3 grid (Mac).</text>
  <text x="380" y="410" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
