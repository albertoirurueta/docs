<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Control Rig: three events and the rig hierarchy</text>
<rect x="30" y="50" width="210" height="54" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="135.0" y="73.7" text-anchor="middle" font-size="12" fill="#92400E">Construction Event</text>
<text x="135.0" y="88.7" text-anchor="middle" font-size="12" fill="#92400E">runs once after initialisation</text>
<text x="135" y="128" text-anchor="middle" font-size="11" fill="#374151">Sets initial values and control offsets,</text>
<text x="135" y="142" text-anchor="middle" font-size="11" fill="#374151">spawns bones, nulls and controls</text>
<text x="135" y="156" text-anchor="middle" font-size="11" fill="#374151">(Spawn nodes work only here)</text>
<rect x="275" y="50" width="210" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="73.7" text-anchor="middle" font-size="12" fill="#3730A3">Forwards Solve</text>
<text x="380.0" y="88.7" text-anchor="middle" font-size="12" fill="#3730A3">runs every evaluation</text>
<text x="380" y="128" text-anchor="middle" font-size="11" fill="#374151">Controls, variables and inputs drive bones.</text>
<text x="380" y="142" text-anchor="middle" font-size="11" fill="#374151">Used by Sequencer and the</text>
<text x="380" y="156" text-anchor="middle" font-size="11" fill="#374151">Animation Blueprint Control Rig node</text>
<rect x="520" y="50" width="210" height="54" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="625.0" y="73.7" text-anchor="middle" font-size="12" fill="#047857">Backwards Solve</text>
<text x="625.0" y="88.7" text-anchor="middle" font-size="12" fill="#047857">optional, bones drive controls</text>
<text x="625" y="128" text-anchor="middle" font-size="11" fill="#374151">Bones drive controls. Used by</text>
<text x="625" y="142" text-anchor="middle" font-size="11" fill="#374151">Bake To Control Rig in Sequencer</text>
<text x="625" y="156" text-anchor="middle" font-size="11" fill="#374151">and for preview of baked data</text>
<text x="380" y="205" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Rig hierarchy (elements the events read and write)</text>
<rect x="30" y="230" width="140" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100.0" y="253.7" text-anchor="middle" font-size="12" fill="#3730A3">Control</text>
<text x="100.0" y="268.7" text-anchor="middle" font-size="12" fill="#3730A3">ctrl_hand_r</text>
<rect x="225" y="230" width="140" height="54" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="295.0" y="253.7" text-anchor="middle" font-size="12" fill="#374151">Null</text>
<text x="295.0" y="268.7" text-anchor="middle" font-size="12" fill="#374151">null_hand_r</text>
<rect x="420" y="218" width="310" height="78" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="575" y="236" text-anchor="middle" font-size="11" fill="#374151">Bones of the skeleton</text>
<rect x="428" y="246" width="94" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="475.0" y="268.9" text-anchor="middle" font-size="11" fill="#92400E">upperarm_r</text>
<rect x="528" y="246" width="94" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="575.0" y="268.9" text-anchor="middle" font-size="11" fill="#92400E">lowerarm_r</text>
<rect x="628" y="246" width="94" height="38" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="675.0" y="268.9" text-anchor="middle" font-size="11" fill="#92400E">hand_r</text>
<line x1="170" y1="250" x2="225" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="365" y1="250" x2="420" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="225" y1="270" x2="170" y2="270" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<line x1="420" y1="270" x2="365" y2="270" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<text x="197" y="244" text-anchor="middle" font-size="10" fill="#3730A3">fwd</text>
<text x="197" y="288" text-anchor="middle" font-size="10" fill="#047857">back</text>
<rect x="30" y="318" width="700" height="66" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="380" y="338" text-anchor="middle" font-size="11" fill="#374151">The Rig Graph is a node graph made of Rig Units. A Modular Control Rig chains small rigs (Modules)</text>
<text x="380" y="352" text-anchor="middle" font-size="11" fill="#374151">that each run these events, one Module after another in tree order, so a Foot Module</text>
<text x="380" y="366" text-anchor="middle" font-size="11" fill="#374151">can add foot roll to a Leg Module through the pre and post forwards solve hooks.</text>
</svg>
