<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Routes from a finished email design to an inbox</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Routes from a finished email design to an inbox</text>
  <rect x="20" y="170" width="150" height="80" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="95" y="204" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Email design</text>
  <text x="95" y="224" font-size="12" fill="#374151" text-anchor="middle">Share menu</text>
  <rect x="250" y="52" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="365" y="78" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Send test email</text>
  <text x="365" y="98" font-size="12" fill="#374151" text-anchor="middle">only to your Canva login address</text>
  <rect x="250" y="136" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="365" y="162" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Gmail (Export to Gmail)</text>
  <text x="365" y="182" font-size="12" fill="#374151" text-anchor="middle">opens a draft; one-off sends</text>
  <rect x="250" y="220" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="365" y="246" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Mailchimp (Publish now)</text>
  <text x="365" y="266" font-size="12" fill="#374151" text-anchor="middle">email page as Email (HTML)</text>
  <rect x="250" y="304" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="365" y="330" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Copy HTML or HTML and images</text>
  <text x="365" y="350" font-size="12" fill="#374151" text-anchor="middle">any platform that accepts HTML</text>
  <path d="M170,200 L250,84" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M170,208 L250,168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M170,214 L250,252" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M170,222 L250,336" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="560" y="136" width="180" height="64" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="650" y="162" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Inbox provider</text>
  <text x="650" y="182" font-size="12" fill="#374151" text-anchor="middle">Gmail, Outlook</text>
  <rect x="560" y="262" width="180" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="650" y="288" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Email Service Provider</text>
  <text x="650" y="308" font-size="12" fill="#92400E" text-anchor="middle">lists, unsubscribe, merge tags</text>
  <path d="M480,168 L560,168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M480,252 L560,285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M480,336 L560,306" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="380" y="402" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
