<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">How the system processes a bank statement</title>
  <desc id="d">Four ways bring a bank statement into the system: SAP Multi-Bank Connectivity, the Manage Incoming Payment Files app, the Bank Statement - Post API and manual entry in the Manage Bank Statements app. The system saves the statement. After posting is triggered, the first processing phase applies posting rules and interpretation algorithms and saves matching open items as clearing proposals. The second phase looks for exactly one matching processing rule per item. The posting phase performs the actions of the processing rule, or uses the proposals of the first phase, and posts and clears the items. Items without any match stop the automatic processing and are handled in the Reprocess Bank Statement Items app.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="120" y="22" text-anchor="middle" font-size="13" font-weight="bold">Ways in</text>
  <rect x="10" y="34" width="220" height="50" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="120" y="62.5" text-anchor="middle" font-size="12">SAP Multi-Bank Connectivity</text>
  <rect x="10" y="96" width="220" height="50" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="120" y="124.5" text-anchor="middle" font-size="12">Manage Incoming Payment Files</text>
  <rect x="10" y="158" width="220" height="50" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="120" y="186.5" text-anchor="middle" font-size="12">Bank Statement - Post API</text>
  <rect x="10" y="220" width="220" height="50" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="120" y="240" text-anchor="middle" font-size="12">Manual entry in</text>
  <text x="120" y="257" text-anchor="middle" font-size="12">Manage Bank Statements</text>
  <rect x="290" y="100" width="150" height="100" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="365" y="145" text-anchor="middle" font-size="13" font-weight="bold">Bank statement</text>
  <text x="365" y="163" text-anchor="middle" font-size="11">saved with its items</text>
  <line x1="230" y1="59" x2="290" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="230" y1="121" x2="290" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="230" y1="183" x2="290" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="230" y1="245" x2="290" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="765" y="22" text-anchor="middle" font-size="13" font-weight="bold">After posting is triggered</text>
  <rect x="500" y="34" width="200" height="80" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="600" y="60" text-anchor="middle" font-size="13" font-weight="bold">1 First phase</text>
  <text x="600" y="78" text-anchor="middle" font-size="11">posting rules and</text>
  <text x="600" y="96" text-anchor="middle" font-size="11">interpretation algorithms</text>
  <rect x="745" y="34" width="150" height="80" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="820" y="60" text-anchor="middle" font-size="13" font-weight="bold">2 Second phase</text>
  <text x="820" y="78" text-anchor="middle" font-size="11">one matching</text>
  <text x="820" y="96" text-anchor="middle" font-size="11">processing rule</text>
  <rect x="920" y="34" width="150" height="80" rx="10" fill="#2fbf71" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="995" y="60" text-anchor="middle" font-size="13" font-weight="bold">3 Posting phase</text>
  <text x="995" y="78" text-anchor="middle" font-size="11">post and clear</text>
  <text x="995" y="96" text-anchor="middle" font-size="11">the items</text>
  <line x1="440" y1="150" x2="470" y2="150" stroke="currentColor" stroke-width="1.5"/>
  <line x1="470" y1="150" x2="470" y2="74" stroke="currentColor" stroke-width="1.5"/>
  <line x1="470" y1="74" x2="500" y2="74" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="74" x2="745" y2="74" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="895" y1="74" x2="920" y2="74" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="560" y="170" width="335" height="70" rx="10" fill="#4fa3c8" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="727.5" y="200" text-anchor="middle" font-size="12" font-weight="bold">Clearing proposals from phase 1</text>
  <text x="727.5" y="217" text-anchor="middle" font-size="10">used when no processing rule applies</text>
  <line x1="640" y1="114" x2="640" y2="170" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="895" y1="205" x2="995" y2="205" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="995" y1="205" x2="995" y2="114" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="500" y="275" width="395" height="85" rx="10" fill="#7873f5" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="697.5" y="295.5" text-anchor="middle" font-size="12" font-weight="bold">No matching open item</text>
  <text x="697.5" y="312.5" text-anchor="middle" font-size="10">an item without any match in phase 1 stops the</text>
  <text x="697.5" y="329.5" text-anchor="middle" font-size="10">automatic processing; handle it by hand in</text>
  <text x="697.5" y="346.5" text-anchor="middle" font-size="10">Reprocess Bank Statement Items</text>
  <line x1="520" y1="114" x2="520" y2="275" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="540" y="385" text-anchor="middle" font-size="11">Order of the phases as described in SAP Help. Names of the ways in and of the apps are those of SAP S/4HANA 2025 FPS02 and the Public Edition 2608.</text>
</svg>
