<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-sml-off" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">Byte offsets of vec3, vec2, vec4 under three layouts</text>
<line x1="150" y1="70" x2="150" y2="84" stroke="#4B5563" stroke-width="1"/>
<text x="150" y="64" text-anchor="middle" font-size="11" fill="#374151">0</text>
<line x1="198" y1="70" x2="198" y2="78" stroke="#4B5563" stroke-width="1"/>
<line x1="246" y1="70" x2="246" y2="78" stroke="#4B5563" stroke-width="1"/>
<line x1="294" y1="70" x2="294" y2="78" stroke="#4B5563" stroke-width="1"/>
<line x1="342" y1="70" x2="342" y2="84" stroke="#4B5563" stroke-width="1"/>
<text x="342" y="64" text-anchor="middle" font-size="11" fill="#374151">16</text>
<line x1="390" y1="70" x2="390" y2="78" stroke="#4B5563" stroke-width="1"/>
<line x1="438" y1="70" x2="438" y2="78" stroke="#4B5563" stroke-width="1"/>
<line x1="486" y1="70" x2="486" y2="78" stroke="#4B5563" stroke-width="1"/>
<line x1="534" y1="70" x2="534" y2="84" stroke="#4B5563" stroke-width="1"/>
<text x="534" y="64" text-anchor="middle" font-size="11" fill="#374151">32</text>
<line x1="582" y1="70" x2="582" y2="78" stroke="#4B5563" stroke-width="1"/>
<text x="582" y="64" text-anchor="middle" font-size="11" fill="#374151">36</text>
<line x1="630" y1="70" x2="630" y2="78" stroke="#4B5563" stroke-width="1"/>
<line x1="678" y1="70" x2="678" y2="78" stroke="#4B5563" stroke-width="1"/>
<line x1="726" y1="70" x2="726" y2="84" stroke="#4B5563" stroke-width="1"/>
<text x="726" y="64" text-anchor="middle" font-size="11" fill="#374151">48</text>
<text x="138" y="66" text-anchor="end" font-size="11" fill="#6B7280">byte</text>
<text x="20" y="110" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">std140</text>
<text x="20" y="126" text-anchor="start" font-size="11" fill="#6B7280">and std430</text>
<rect x="150" y="90" width="144" height="40" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="222.0" y="114.0" text-anchor="middle" font-size="11" fill="#3730A3">vec3 a</text>
<rect x="294" y="90" width="48" height="40" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="318.0" y="114.0" text-anchor="middle" font-size="11" fill="#92400E">pad</text>
<rect x="342" y="90" width="96" height="40" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="390.0" y="114.0" text-anchor="middle" font-size="11" fill="#065F46">vec2 b</text>
<rect x="438" y="90" width="96" height="40" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="486.0" y="114.0" text-anchor="middle" font-size="11" fill="#92400E">padding</text>
<rect x="534" y="90" width="192" height="40" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="630.0" y="114.0" text-anchor="middle" font-size="11" fill="#3730A3">vec4 c</text>
<text x="20" y="170" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">scalar</text>
<text x="20" y="186" text-anchor="start" font-size="11" fill="#6B7280">scalarBlockLayout</text>
<rect x="150" y="150" width="144" height="40" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="222.0" y="174.0" text-anchor="middle" font-size="11" fill="#3730A3">vec3 a</text>
<rect x="294" y="150" width="96" height="40" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="342.0" y="174.0" text-anchor="middle" font-size="11" fill="#065F46">vec2 b</text>
<rect x="390" y="150" width="192" height="40" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="486.0" y="174.0" text-anchor="middle" font-size="11" fill="#3730A3">vec4 c</text>
<rect x="40" y="215" width="330" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="205.0" y="241.3" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Offsets and sizes</text>
<text x="205.0" y="256.4" text-anchor="middle" font-size="11" fill="#374151">std140: a at 0, b at 16, c at 32, size 48</text>
<text x="205.0" y="271.4" text-anchor="middle" font-size="11" fill="#374151">vec2 needs 8 (16 after the vec3), vec4 needs 16</text>
<text x="205.0" y="286.4" text-anchor="middle" font-size="11" fill="#374151">Scalar: a at 0, b at 12, c at 20, size 36</text>
<rect x="390" y="215" width="330" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="555.0" y="241.3" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Why the holes appear</text>
<text x="555.0" y="256.4" text-anchor="middle" font-size="11" fill="#92400E">A vec3 occupies 12 bytes but std140 and std430</text>
<text x="555.0" y="271.4" text-anchor="middle" font-size="11" fill="#92400E">align it to 16, so the next member may start</text>
<text x="555.0" y="286.4" text-anchor="middle" font-size="11" fill="#92400E">inside it only if its alignment allows</text>
</svg>
