<svg viewBox="0 0 740 330" width="740" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="740" height="330" fill="#FFFFFF"/>
<text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Prototype variable types, values and operators</text>
<g font-size="12" fill="#374151">
<rect x="20" y="48" width="165" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="102" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Number</text>
<text x="32" y="92">cartCount = 0</text><text x="32" y="110">Operators: + - * /</text><text x="32" y="128">Also: &gt; &lt; &gt;= &lt;= == !=</text><text x="32" y="146">Drives sizes, radius, text</text>
<rect x="200" y="48" width="165" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="282" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">String</text>
<text x="212" y="92">badgeText = "0 books"</text><text x="212" y="110">Literals in quotation marks</text><text x="212" y="128">+ appends text or numbers</text><text x="212" y="146">Drives text content</text>
<rect x="380" y="48" width="165" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="462" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Boolean</text>
<text x="392" y="92">isEmpty = true</text><text x="392" y="110">and, or, !, not, ==</text><text x="392" y="128">Result must be true or false</text><text x="392" y="146">Drives layer visibility</text>
<rect x="560" y="48" width="160" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Color</text>
<text x="572" y="92">accent = #4F46E5</text><text x="572" y="110">Hex code or picker value</text><text x="572" y="128">Set variable only; no</text><text x="572" y="146">expression operators</text>
</g>
<rect x="20" y="186" width="700" height="124" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="36" y="210" font-size="14" font-weight="bold" fill="#92400E">Order of evaluation (equal precedence runs left to right)</text>
<g font-size="12" fill="#374151">
<circle cx="44" cy="236" r="11" fill="#B45309"/><text x="44" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text><text x="64" y="240">Parentheses</text>
<circle cx="204" cy="236" r="11" fill="#B45309"/><text x="204" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text><text x="224" y="240">Multiply and divide</text>
<circle cx="404" cy="236" r="11" fill="#B45309"/><text x="404" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text><text x="424" y="240">Add and subtract</text>
<text x="36" y="274">Boolean expressions: parentheses, then comparisons, then and, then or.</text>
<text x="36" y="294">Example condition: cartCount &gt; 0 and isEmpty == false</text>
</g>
</svg>
