<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-textures-and-samplers-mip-pyramid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A mipmap chain: 256 x 256 down to 1 x 1</text>
<rect x="30" y="69.68" width="184.32" height="184.32" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="122.16" y="61.68000000000001" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">L0</text>
<text x="122.16" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">256</text>
<rect x="224.32" y="161.84" width="92.16" height="92.16" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="270.4" y="153.84" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">L1</text>
<text x="270.4" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">128</text>
<rect x="326.48" y="207.92000000000002" width="46.08" height="46.08" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="349.52000000000004" y="199.92000000000002" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">L2</text>
<text x="349.52000000000004" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">64</text>
<rect x="382.56" y="230.96" width="23.04" height="23.04" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="394.08" y="222.96" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">L3</text>
<text x="394.08" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">32</text>
<rect x="415.6" y="242.48" width="11.52" height="11.52" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="421.36" y="234.48" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">L4</text>
<text x="421.36" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">16</text>
<rect x="437.12" y="248.24" width="5.76" height="5.76" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="440.0" y="240.24" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">L5</text>
<text x="440.0" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">8</text>
<rect x="452.88" y="251" width="3" height="3" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="454.38" y="243" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">L6</text>
<text x="454.38" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">4</text>
<rect x="463.88" y="251" width="3" height="3" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="465.38" y="243" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">L7</text>
<text x="465.38" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">2</text>
<rect x="474.88" y="251" width="3" height="3" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="476.38" y="243" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">L8</text>
<text x="476.38" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">1</text>
<text x="380" y="296" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">level number above each image, width in texels below</text>
<rect x="60" y="314" width="640" height="50" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="336" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">levels = floor(log2(max(width, height))) + 1  -&gt;  9 levels for 256 x 256</text>
<text x="380" y="354" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Each level halves each side (rounding down, minimum 1); the whole chain costs about 4/3 of level 0.</text>
</svg>
