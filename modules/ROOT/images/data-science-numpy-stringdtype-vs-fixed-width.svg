<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t2 d2">
  <title id="t2">Fixed-width U dtype compared with StringDType</title>
  <desc id="d2">Three strings of different lengths. In a U10 array every element reserves ten code points. In a StringDType array every element is a small fixed-size record that holds short text inline or points to variable-length UTF-8 data on the heap.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Fixed width reserves space; StringDType stores what is there</text>
  <text x="24" y="70" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">dtype="U10": 40 bytes per element</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="24" y="82" width="200" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <rect x="228" y="82" width="200" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <rect x="432" y="82" width="200" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <text x="124" y="107">fig  + 7 unused</text>
    <text x="328" y="107">banana + 4 unused</text>
    <text x="532" y="107">ten letters</text>
  </g>
  <text x="24" y="150" font-size="12" fill="#475569">A longer value assigned later is cut to 10 characters; a single long string makes every element wider.</text>
  <text x="24" y="196" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">dtype=StringDType(): 16 bytes per element record</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <rect x="24" y="208" width="120" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <rect x="148" y="208" width="120" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <rect x="272" y="208" width="120" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <text x="84" y="233">"fig"</text>
    <text x="208" y="233">"banana"</text>
    <text x="332" y="233">pointer</text>
    <rect x="470" y="264" width="226" height="40" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="583" y="289">UTF-8 bytes on the heap</text>
  </g>
  <line x1="332" y1="250" x2="466" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <circle cx="404" cy="228" r="11" fill="#0F172A"/><text x="404" y="233" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="440" cy="262" r="11" fill="#0F172A"/><text x="440" y="267" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="24" y="284" font-size="12" fill="#475569">Short strings live inside the record; longer ones are stored</text>
  <text x="24" y="302" font-size="12" fill="#475569">out of line and shown by the pointer cell.</text>
</svg>
