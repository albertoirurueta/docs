<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-performance-and-debugging-canvas-size-and-dpr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="320" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">CSS size, device pixels and the drawing buffer</text>
<rect x="20" y="60" width="220" height="100" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="130.0" y="106.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">canvas.clientWidth x clientHeight</text>
<text x="130.0" y="121.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(CSS pixels, from layout)</text>
<rect x="270" y="60" width="220" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="99.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">devicePixelRatio or</text>
<text x="380.0" y="114.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">device-pixel-content-box</text>
<text x="380.0" y="129.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">(physical pixels)</text>
<rect x="520" y="60" width="220" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="99.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">canvas.width / height</text>
<text x="630.0" y="114.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">(drawing buffer size)</text>
<text x="630.0" y="129.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">gl.viewport(0,0,w,h)</text>
<line x1="240" y1="110" x2="270" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-performance-and-debugging-canvas-size-and-dpr)"/>
<line x1="490" y1="110" x2="520" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-performance-and-debugging-canvas-size-and-dpr)"/>
<text x="255" y="185" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">multiply</text>
<text x="505" y="185" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">assign only when it changed</text>
<rect x="20" y="210" width="720" height="80" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="254.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="380" y="232" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Cost model: fragment work grows with the product width x height</text>
<text x="380" y="254" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">1920 x 1080 at ratio 1 = 2.07 M pixels;  at ratio 2 = 8.29 M pixels (4 times the fill cost)</text>
<text x="380" y="274" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Cap the ratio (for example Math.min(devicePixelRatio, 2)) or scale down when frames run long.</text>
</svg>
