  <line x1="690" y1="240" x2="760" y2="240" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="725" y="116" text-anchor="middle" font-size="11">query</text>
  <text x="355" y="116" text-anchor="middle" font-size="11">request</text>
  <text x="355" y="160" text-anchor="middle" font-size="11">data</text>
  <text x="725" y="160" text-anchor="middle" font-size="11">data</text>
  <text x="725" y="206" text-anchor="middle" font-size="11">query</text>
  <text x="355" y="206" text-anchor="middle" font-size="11">request</text>
  <text x="355" y="250" text-anchor="middle" font-size="11">data</text>
  <text x="725" y="250" text-anchor="middle" font-size="11">data</text>
  <rect x="20" y="290" width="300" height="80" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="316.5" text-anchor="middle" font-size="12" font-weight="bold">Source record in Employee Central</text>
  <text x="170" y="333.5" text-anchor="middle" font-size="10">Ana Torres, Sales Manager, hired 01.03.2024</text>
  <text x="170" y="350.5" text-anchor="middle" font-size="10">position in the department Sales</text>
  <rect x="390" y="290" width="300" height="80" rx="10" fill="#5b9bd5" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="316.5" text-anchor="middle" font-size="12" font-weight="bold">Event starts the processing job</text>
  <text x="540" y="333.5" text-anchor="middle" font-size="10">writing to the staging area raises</text>
  <text x="540" y="350.5" text-anchor="middle" font-size="10">an event; a background job reacts</text>
  <rect x="760" y="290" width="300" height="80" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="910" y="316" text-anchor="middle" font-size="13" font-weight="bold">Staging area</text>
  <text x="910" y="334" text-anchor="middle" font-size="11">one replication request per employee</text>
  <text x="910" y="352" text-anchor="middle" font-size="11">status Open when stored</text>
  <line x1="910" y1="260" x2="910" y2="290" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="690" y1="330" x2="760" y2="330" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="760" y="400" width="300" height="70" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="910" y="430" text-anchor="middle" font-size="12" font-weight="bold">Processing program</text>
  <text x="910" y="447" text-anchor="middle" font-size="12" font-weight="bold">ECPAO_RPRQ_EE_PROCESSING</text>
  <line x1="910" y1="370" x2="910" y2="400" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="390" y="400" width="300" height="70" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="430" text-anchor="middle" font-size="13" font-weight="bold">Integration flow</text>
  <text x="540" y="448" text-anchor="middle" font-size="11">confirmation</text>
  <rect x="20" y="400" width="300" height="70" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="421" text-anchor="middle" font-size="13" font-weight="bold">Data Replication Monitor</text>
  <text x="170" y="439" text-anchor="middle" font-size="11">Admin Center: Successful,</text>
  <text x="170" y="457" text-anchor="middle" font-size="11">Failed or Pending per employee</text>
  <line x1="760" y1="435" x2="690" y2="435" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="390" y1="435" x2="320" y2="435" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="725" y="429" text-anchor="middle" font-size="11">result</text>
  <text x="355" y="429" text-anchor="middle" font-size="11">result</text>
  <line x1="910" y1="470" x2="910" y2="500" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="760" y="500" width="300" height="80" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="910" y="526" text-anchor="middle" font-size="13" font-weight="bold">Infotypes in PA and OM</text>
  <text x="910" y="544" text-anchor="middle" font-size="11">Ana: Organizational Assignment (0001),</text>
  <text x="910" y="562" text-anchor="middle" font-size="11">Relationships (1001) of her position</text>
  <rect x="20" y="500" width="670" height="80" rx="10" fill="#5b9bd5" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="355" y="526" text-anchor="middle" font-size="13" font-weight="bold">Status of every replication request</text>
  <text x="355" y="544" text-anchor="middle" font-size="11">Successful when processing worked; Pending after a temporary problem</text>
  <text x="355" y="562" text-anchor="middle" font-size="11">(Failed after three days); Failed after a data or configuration problem</text>
  <line x1="760" y1="540" x2="690" y2="540" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="610" width="1040" height="56" rx="10" fill="#ff6ec4" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="633" text-anchor="middle" font-size="13" font-weight="bold">SAP S/4HANA Cloud Public Edition: SAP Master Data Integration instead of the add-on</text>
  <text x="540" y="651" text-anchor="middle" font-size="11">Only the workforce person is replicated: not enough for HR processes such as payroll.</text>
  <text x="540" y="684" text-anchor="middle" font-size="11">Ana Torres and all values are invented examples; names of programs and statuses are those of the SAP documentation for the add-on ECS4HCM.</text>
</svg>
