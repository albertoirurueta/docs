<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" width="1080" height="690" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">Employee Central to SAP S/4HANA: replication through SAP Cloud Integration, the staging area and the confirmation back</title>
  <desc id="d">Three columns. Left: SAP SuccessFactors Employee Central, the system of record, with the Compound Employee API for employee data and organizational assignments, OData APIs for organizational objects, the source record of Ana Torres, and the Data Replication Monitor in the Admin Center. Middle: SAP Cloud Integration with one integration flow for employee master data and organizational assignments, one for organizational objects and one for the confirmation. Right: SAP S/4HANA with the query program for employees, the query program for organizational objects, the staging area with one replication request per employee, the processing program started by an event, and the infotypes of Personnel Administration and Organizational Management. Steps one to four: S/4HANA sends a query to the middleware, the middleware requests the data from Employee Central, Employee Central returns it, and the middleware passes it to the staging area in S/4HANA. After processing, S/4HANA sends Successful, Failed or Pending confirmations through the middleware to the Data Replication Monitor. A band at the bottom shows the alternative for SAP S/4HANA Cloud Public Edition: SAP Master Data Integration replicates only the workforce person, which is not enough for payroll. Ana Torres, personnel number 00001234, is an invented example value.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="170" y="70" text-anchor="middle" font-size="14" font-weight="bold">SAP SuccessFactors Employee Central</text>
  <text x="540" y="70" text-anchor="middle" font-size="14" font-weight="bold">SAP Cloud Integration (middleware)</text>
  <text x="910" y="70" text-anchor="middle" font-size="14" font-weight="bold">SAP S/4HANA (on premise or Private Edition)</text>
  <rect x="20" y="100" width="300" height="70" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="121" text-anchor="middle" font-size="13" font-weight="bold">Compound Employee API</text>
  <text x="170" y="139" text-anchor="middle" font-size="11">SOAP: employee data and</text>
  <text x="170" y="157" text-anchor="middle" font-size="11">organizational assignments</text>
  <rect x="390" y="100" width="300" height="70" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="121" text-anchor="middle" font-size="13" font-weight="bold">Integration flow</text>
  <text x="540" y="139" text-anchor="middle" font-size="11">employee master data and</text>
  <text x="540" y="157" text-anchor="middle" font-size="11">organizational assignments</text>
  <rect x="760" y="100" width="300" height="70" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="910" y="121.5" text-anchor="middle" font-size="12" font-weight="bold">Query program</text>
  <text x="910" y="138.5" text-anchor="middle" font-size="12" font-weight="bold">ECPAO_EE_ORG_REPL_QUERY</text>
  <text x="910" y="155.5" text-anchor="middle" font-size="10">sends the query on a schedule</text>
  <rect x="20" y="190" width="300" height="70" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="211" text-anchor="middle" font-size="13" font-weight="bold">OData APIs</text>
  <text x="170" y="229" text-anchor="middle" font-size="11">organizational objects:</text>
  <text x="170" y="247" text-anchor="middle" font-size="11">departments, divisions, positions</text>
  <rect x="390" y="190" width="300" height="70" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="540" y="220" text-anchor="middle" font-size="13" font-weight="bold">Integration flow</text>
  <text x="540" y="238" text-anchor="middle" font-size="11">organizational objects</text>
  <rect x="760" y="190" width="300" height="70" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="910" y="220" text-anchor="middle" font-size="12" font-weight="bold">Query program</text>
  <text x="910" y="237" text-anchor="middle" font-size="12" font-weight="bold">RH_SFIOM_ORG_OBJ_REPL_QUERY</text>
  <line x1="760" y1="122" x2="690" y2="122" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="390" y1="122" x2="320" y2="122" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="320" y1="150" x2="390" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="690" y1="150" x2="760" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
