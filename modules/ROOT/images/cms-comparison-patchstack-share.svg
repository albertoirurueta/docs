<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 258" width="860" height="258" role="img" aria-labelledby="patchstack-share-t patchstack-share-d">
<title id="patchstack-share-t">Where new WordPress vulnerabilities are found</title>
<desc id="patchstack-share-d">Share of the 11,334 new WordPress ecosystem vulnerabilities reported in 2025 by Patchstack that were in plugins (91%), themes (9%) or WordPress core (6 vulnerabilities, 0.05%). The ecosystem, not the core, is where WordPress sites are attacked. The share for core is computed from the two published counts.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}.l3{stroke:var(--s3);stroke-width:2;fill:none;stroke-dasharray:8 3 2 3;stroke-linejoin:round}.m3{fill:var(--s3);stroke:var(--s3)}.f3{fill:var(--s3)}.a3{fill:var(--s3);fill-opacity:.12;stroke:var(--s3);stroke-width:2;stroke-dasharray:8 3 2 3;}.l4{stroke:var(--s4);stroke-width:2;fill:none;stroke-dasharray:4 4;stroke-linejoin:round}.m4{fill:var(--s4);stroke:var(--s4)}.f4{fill:var(--s4)}.a4{fill:var(--s4);fill-opacity:.12;stroke:var(--s4);stroke-width:2;stroke-dasharray:4 4;}.l5{stroke:var(--s5);stroke-width:2;fill:none;stroke-dasharray:10 3;stroke-linejoin:round}.m5{fill:var(--s5);stroke:var(--s5)}.f5{fill:var(--s5)}.a5{fill:var(--s5);fill-opacity:.12;stroke:var(--s5);stroke-width:2;stroke-dasharray:10 3;}.l6{stroke:var(--s6);stroke-width:2;fill:none;stroke-dasharray:1 3;stroke-linejoin:round}.m6{fill:var(--s6);stroke:var(--s6)}.f6{fill:var(--s6)}.a6{fill:var(--s6);fill-opacity:.12;stroke:var(--s6);stroke-width:2;stroke-dasharray:1 3;}.l7{stroke:var(--s7);stroke-width:2;fill:none;stroke-dasharray:6 2 1 2;stroke-linejoin:round}.m7{fill:var(--s7);stroke:var(--s7)}.f7{fill:var(--s7)}.a7{fill:var(--s7);fill-opacity:.12;stroke:var(--s7);stroke-width:2;stroke-dasharray:6 2 1 2;}</style>
<rect width="860" height="258" fill="var(--bg)"/>
<text class="title" x="430" y="24" text-anchor="middle">Where new WordPress vulnerabilities are found</text>
<g transform="translate(0 44)"><g class="legend"><rect class="f0" x="74" y="-6" width="16" height="12"/><text x="100" y="4">Traditional open-source</text></g></g><line class="grid" x1="211" y1="78" x2="211" y2="156"/><text class="muted" x="211" y="174" text-anchor="middle">0</text><line class="grid" x1="326.8" y1="78" x2="326.8" y2="156"/><text class="muted" x="326.8" y="174" text-anchor="middle">20</text><line class="grid" x1="442.6" y1="78" x2="442.6" y2="156"/><text class="muted" x="442.6" y="174" text-anchor="middle">40</text><line class="grid" x1="558.4" y1="78" x2="558.4" y2="156"/><text class="muted" x="558.4" y="174" text-anchor="middle">60</text><line class="grid" x1="674.2" y1="78" x2="674.2" y2="156"/><text class="muted" x="674.2" y="174" text-anchor="middle">80</text><line class="grid" x1="790" y1="78" x2="790" y2="156"/><text class="muted" x="790" y="174" text-anchor="middle">100</text><path class="axis" d="M211 78V156H790"/><text x="203" y="95" text-anchor="end">Plugins</text><g><title>Plugins: 91%</title><rect class="f0" x="211" y="82" width="526.89" height="18"/><text class="muted" x="742.89" y="95">91%</text></g><text x="203" y="121" text-anchor="end">Themes</text><g><title>Themes: 9%</title><rect class="f0" x="211" y="108" width="52.11" height="18"/><text class="muted" x="268.11" y="121">9%</text></g><text x="203" y="147" text-anchor="end">WordPress core (computed)</text><g><title>WordPress core (computed): 0.05%</title><rect class="f0" x="211" y="134" width="1" height="18"/><text class="muted" x="216.31" y="147">0.05%</text></g><text class="axis-label" x="500.5" y="196" text-anchor="middle">Share of new vulnerabilities, 2025 (%)</text><text class="axis-label" transform="translate(16 117) rotate(-90)" text-anchor="middle">Component</text>
<style>.footer{font-size:11px;fill:var(--muted)}</style>
<text class="footer" x="24" y="222" text-anchor="start"><tspan x="24" dy="0">Source: Patchstack State of WordPress Security in 2026; retrieved 2026-10-29. Patchstack counts differ from NVD counts. Raw data:</tspan><tspan x="24" dy="15">scripts/cms-comparison-charts/data/security.csv. See the Bibliography for the sources.</tspan></text>
</svg>
