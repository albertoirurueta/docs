<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b4c8c"/>
    </marker>
  </defs>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Tag files: files on disk and the layout they build at run time</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">The Bookshelf catalogue page calls a layout tag file, which calls another one; each call is a new page scope</text>

  <!-- left: directory tree -->
  <rect x="20" y="62" width="250" height="518" rx="10" fill="#f6f6f6" stroke="#888888" stroke-width="1.5"/>
  <text x="36" y="86" font-size="14" font-weight="bold" fill="#222222">WEB-INF/tags (implicit libraries)</text>
  <text x="36" y="106" font-size="11" fill="#555555">one directory = one tag library, loaded</text>
  <text x="36" y="120" font-size="11" fill="#555555">with taglib tagdir="..."</text>
  <g font-family="Menlo, Consolas, monospace" font-size="11" fill="#222222">
    <text x="36" y="148">layout/</text>
    <text x="52" y="166" fill="#2b4c8c">page.tag</text>
    <text x="52" y="184" fill="#2b4c8c">catalogue.tag</text>
    <text x="36" y="212">ui/</text>
    <text x="52" y="230" fill="#2f7a3c">bookCard.tag</text>
    <text x="52" y="248" fill="#2f7a3c">navLink.tag</text>
    <text x="52" y="266" fill="#2f7a3c">rating.tag</text>
    <text x="52" y="284" fill="#2f7a3c">each.tag</text>
    <text x="52" y="302" fill="#2f7a3c">note.tagx</text>
    <text x="36" y="330">versioned/</text>
    <text x="52" y="348" fill="#8a5200">implicit.tld</text>
    <text x="52" y="366" fill="#8a5200">parts.tag</text>
    <text x="52" y="384" fill="#8a5200">footer.tagf</text>
  </g>
  <line x1="36" y1="404" x2="254" y2="404" stroke="#bbbbbb" stroke-width="1"/>
  <text x="36" y="424" font-size="11" font-weight="bold" fill="#222222">Directives inside a tag file</text>
  <g font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#333333">
    <text x="36" y="442">tag        body, EL, whitespace</text>
    <text x="36" y="458">attribute  inputs, fragments</text>
    <text x="36" y="474">variable   outputs to the caller</text>
    <text x="36" y="490">taglib     own prefixes (not</text>
    <text x="36" y="506">           inherited)</text>
  </g>
  <text x="36" y="530" font-size="11" fill="#555555">Inside the body: jsp:doBody runs the</text>
  <text x="36" y="544" font-size="11" fill="#555555">caller body, jsp:invoke runs a fragment</text>
  <text x="36" y="558" font-size="11" fill="#555555">attribute. Neither exists in a JSP.</text>

  <!-- right: nested call frames -->
  <rect x="300" y="62" width="580" height="518" rx="10" fill="#fde8e8" stroke="#8c2b2b" stroke-width="1.8"/>
  <text x="316" y="86" font-size="14" font-weight="bold" fill="#5a1a1a">nested.jsp (page scope 1)</text>
  <text x="316" y="104" font-size="11" fill="#8c2b2b">layout:catalogue title="Sci-fi" with jsp:attribute sidebar and jsp:body</text>

  <rect x="320" y="120" width="540" height="444" rx="10" fill="#eef3fb" stroke="#2b4c8c" stroke-width="1.8"/>
  <text x="336" y="144" font-size="14" font-weight="bold" fill="#1a2f5a">layout/catalogue.tag (page scope 2)</text>
  <text x="336" y="162" font-size="11" fill="#2b4c8c">attributes: title and fragment sidebar; wraps layout:page</text>

  <rect x="340" y="178" width="500" height="372" rx="10" fill="#fff6e5" stroke="#b36b00" stroke-width="1.8"/>
  <text x="356" y="202" font-size="14" font-weight="bold" fill="#6b4100">layout/page.tag (page scope 3)</text>
  <text x="356" y="220" font-size="11" fill="#8a5200">attributes: title, active, fragments head and sidebar; the HTML skeleton lives here</text>

  <!-- skeleton slots -->
  <rect x="364" y="236" width="452" height="34" rx="6" fill="#ffffff" stroke="#b36b00" stroke-width="1.2"/>
  <text x="378" y="257" font-size="12" fill="#333333">head: jsp:invoke fragment="head"</text>
  <text x="800" y="257" font-size="11" fill="#8a5200" text-anchor="end">optional, null is fine</text>

  <rect x="364" y="280" width="452" height="34" rx="6" fill="#ffffff" stroke="#b36b00" stroke-width="1.2"/>
  <text x="378" y="301" font-size="12" fill="#333333">nav: ui:navLink x 2 (component tag files)</text>

  <rect x="364" y="324" width="452" height="82" rx="6" fill="#ffffff" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="378" y="345" font-size="12" font-weight="bold" fill="#1a2f5a">main: jsp:doBody</text>
  <text x="378" y="362" font-size="11" fill="#2b4c8c">runs the body written in layout/catalogue.tag, which in turn runs</text>
  <text x="378" y="378" font-size="11" fill="#2b4c8c">jsp:doBody for the body written in nested.jsp (page scope 1)</text>
  <text x="378" y="396" font-size="11" fill="#555555">the output goes to the same JspWriter</text>

  <rect x="364" y="416" width="452" height="50" rx="6" fill="#ffffff" stroke="#2b4c8c" stroke-width="1.6"/>
  <text x="378" y="437" font-size="12" font-weight="bold" fill="#1a2f5a">aside: jsp:invoke fragment="sidebar"</text>
  <text x="378" y="454" font-size="11" fill="#2b4c8c">filters from catalogue.tag, then the sidebar fragment written in nested.jsp</text>

  <rect x="364" y="476" width="452" height="34" rx="6" fill="#ffffff" stroke="#b36b00" stroke-width="1.2"/>
  <text x="378" y="497" font-size="12" fill="#333333">footer: EL ${books.size()} reads application scope</text>

  <text x="356" y="532" font-size="11" fill="#8a5200">Each frame has its own page scope. A body or fragment runs with the page scope</text>
  <text x="356" y="545" font-size="11" fill="#8a5200">of the frame that wrote it. Request, session and application are shared.</text>

</svg>
