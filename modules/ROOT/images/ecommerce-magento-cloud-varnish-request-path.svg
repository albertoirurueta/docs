<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Request path of a page view through CloudFront, the load balancer and Varnish</title>
  <desc id="d">A browser sends HTTPS requests for www.pocketcoffee.example to CloudFront, which forwards every page request to the origin without caching HTML and caches only versioned static files. The Application Load Balancer, protected by the regional web ACL, terminates TLS with the ACM certificate and adds X-Forwarded-Proto: https. The Gateway API route pocketcoffee-www sends the request to the Service pocketcoffee-varnish, which reaches one of the Varnish pods on port 6081. On a hit Varnish answers from memory and PHP is not involved. On a miss, or for customer, checkout, static and media paths that the VCL passes, Varnish forwards the request to the Service pocketcoffee-web on port 8080, where nginx and php-fpm build the page, and Varnish stores it when the response is public. The administration path /admin_pocketcoffee uses a second route straight to the admin Service and never touches Varnish. Private content such as the mini cart is loaded by the browser afterwards from customer-data endpoints that are not cached.</desc>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#f2f5f8">A page view: hits stop in Varnish, misses and private paths reach PHP</text>

  <rect x="30" y="64" width="130" height="86" rx="10" fill="#3d5266"/>
  <text x="44" y="90" font-size="14" font-weight="bold" fill="#f2f5f8">Browser</text>
  <text x="44" y="112" font-size="12" fill="#f2f5f8">HTTPS request for</text>
  <text x="44" y="128" font-size="12" fill="#f2f5f8">the www host</text>

  <rect x="200" y="64" width="150" height="86" rx="10" fill="#3f6e9a"/>
  <text x="214" y="90" font-size="14" font-weight="bold" fill="#f2f5f8">CloudFront</text>
  <text x="214" y="112" font-size="12" fill="#f2f5f8">HTML: not cached</text>
  <text x="214" y="128" font-size="12" fill="#f2f5f8">/static/version*: cached</text>

  <rect x="390" y="64" width="170" height="86" rx="10" fill="#3f6e9a"/>
  <text x="404" y="90" font-size="14" font-weight="bold" fill="#f2f5f8">ALB + WAF web ACL</text>
  <text x="404" y="112" font-size="12" fill="#f2f5f8">terminates TLS (ACM)</text>
  <text x="404" y="128" font-size="12" fill="#f2f5f8">X-Forwarded-Proto: https</text>

  <rect x="600" y="64" width="150" height="86" rx="10" fill="#34495e"/>
  <text x="614" y="90" font-size="14" font-weight="bold" fill="#f2f5f8">HTTPRoute</text>
  <text x="614" y="112" font-size="12" fill="#f2f5f8">pocketcoffee-www</text>
  <text x="614" y="128" font-size="12" fill="#f2f5f8">to Service varnish</text>

  <rect x="790" y="64" width="140" height="86" rx="10" fill="#34495e"/>
  <text x="804" y="90" font-size="14" font-weight="bold" fill="#f2f5f8">Service</text>
  <text x="804" y="112" font-size="12" fill="#f2f5f8">pocketcoffee-varnish</text>
  <text x="804" y="128" font-size="12" fill="#f2f5f8">port 80 to 6081</text>

  <g stroke="#f2f5f8" stroke-width="2" fill="none">
    <line x1="160" y1="107" x2="198" y2="107" marker-end="url(#a)"/>
    <line x1="350" y1="107" x2="388" y2="107" marker-end="url(#a)"/>
    <line x1="560" y1="107" x2="598" y2="107" marker-end="url(#a)"/>
    <line x1="750" y1="107" x2="788" y2="107" marker-end="url(#a)"/>
    <line x1="860" y1="150" x2="860" y2="196" marker-end="url(#a)"/>
  </g>

  <rect x="560" y="198" width="370" height="206" rx="10" fill="#33485c"/>
  <text x="576" y="224" font-size="14" font-weight="bold" fill="#f2f5f8">Varnish pod (one of pocketcoffee-varnish-N)</text>
  <rect x="576" y="238" width="338" height="48" rx="8" fill="#4d7c5a"/>
  <text x="588" y="259" font-size="12.5" font-weight="bold" fill="#f2f5f8">vcl_recv: PURGE and ACL, pass rules</text>
  <text x="588" y="276" font-size="12" fill="#f2f5f8">/customer, /checkout, POST, /static, /media</text>
  <rect x="576" y="296" width="160" height="92" rx="8" fill="#4d7c5a"/>
  <text x="588" y="318" font-size="12.5" font-weight="bold" fill="#f2f5f8">HIT</text>
  <text x="588" y="336" font-size="12" fill="#f2f5f8">answered from memory,</text>
  <text x="588" y="352" font-size="12" fill="#f2f5f8">TTL or grace window,</text>
  <text x="588" y="368" font-size="12" fill="#9fd3c7">no PHP involved</text>
  <rect x="750" y="296" width="164" height="92" rx="8" fill="#7a5c3a"/>
  <text x="762" y="318" font-size="12.5" font-weight="bold" fill="#f2f5f8">MISS or PASS</text>
  <text x="762" y="336" font-size="12" fill="#f2f5f8">fetch from the web</text>
  <text x="762" y="352" font-size="12" fill="#f2f5f8">Service, store only if</text>
  <text x="762" y="368" font-size="12" fill="#f2f5f8">public and 200 or 404</text>

  <line x1="832" y1="388" x2="832" y2="430" stroke="#f4b860" stroke-width="2" marker-end="url(#b)"/>

  <rect x="560" y="432" width="370" height="136" rx="10" fill="#33485c"/>
  <text x="576" y="458" font-size="14" font-weight="bold" fill="#f2f5f8">Service pocketcoffee-web, port 8080</text>
  <rect x="576" y="472" width="338" height="80" rx="8" fill="#4d7c5a"/>
  <text x="588" y="494" font-size="12.5" font-weight="bold" fill="#f2f5f8">nginx 8080 to php-fpm 127.0.0.1:9000</text>
  <text x="588" y="513" font-size="12" fill="#f2f5f8">Magento builds the page, sets Cache-Control,</text>
  <text x="588" y="530" font-size="12" fill="#f2f5f8">X-Magento-Tags and X-Magento-Vary, and the</text>
  <text x="588" y="547" font-size="12" fill="#f2f5f8">probe /health_check.php runs here</text>

  <rect x="30" y="198" width="470" height="170" rx="10" fill="#3d5266"/>
  <text x="46" y="224" font-size="14" font-weight="bold" fill="#f2f5f8">Paths that do not go through Varnish or are not cached</text>
  <text x="46" y="248" font-size="12.5" fill="#f4b860">/admin_pocketcoffee</text>
  <text x="46" y="266" font-size="12.5" fill="#f2f5f8">second HTTPRoute straight to pocketcoffee-admin</text>
  <text x="46" y="292" font-size="12.5" fill="#f4b860">/customer, /checkout, POST, PUT, DELETE</text>
  <text x="46" y="310" font-size="12.5" fill="#f2f5f8">pass: Varnish forwards every request to PHP</text>
  <text x="46" y="336" font-size="12.5" fill="#f4b860">mini cart, wishlist, account name</text>
  <text x="46" y="354" font-size="12.5" fill="#f2f5f8">loaded by the browser from customer-data (private content)</text>

  <rect x="30" y="398" width="470" height="170" rx="10" fill="#34495e"/>
  <text x="46" y="424" font-size="14" font-weight="bold" fill="#f2f5f8">Why CloudFront does not cache the HTML</text>
  <text x="46" y="448" font-size="12.5" fill="#f2f5f8">Magento purges the Varnish replicas only. A second cache</text>
  <text x="46" y="466" font-size="12.5" fill="#f2f5f8">of pages in CloudFront would keep serving a product page</text>
  <text x="46" y="484" font-size="12.5" fill="#f2f5f8">after the price changed, and nothing would purge it.</text>
  <text x="46" y="510" font-size="12.5" fill="#9fd3c7">CloudFront caches only what never changes under one URL:</text>
  <text x="46" y="528" font-size="12.5" fill="#9fd3c7">the versioned files below /static/version...</text>

</svg>
