<text x="590" y="76" font-weight="bold" fill="#1F2937">Legend</text>
<text x="590" y="104">1 Chat history, Memory</text><text x="590" y="120">  and Tasks live behind</text><text x="590" y="136">  the panel icon</text>
<text x="590" y="168">2 Conversation thread</text><text x="590" y="184">  of prompts and replies</text>
<text x="590" y="216">3 Stop interrupts the</text><text x="590" y="232">  agent mid-task</text>
