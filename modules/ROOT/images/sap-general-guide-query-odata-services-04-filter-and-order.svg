<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="sap-general-guide-query-odata-services-04-filter-and-order-title" font-family="Helvetica, Arial, sans-serif">
<title id="sap-general-guide-query-odata-services-04-filter-and-order-title">Browser with the address localhost:4004/odata/v4/query/Claims with the options filter status eq A and amount gt 50, orderby amount desc and select title,amount, marked by callout 8: the JSON response lists four claims from the largest to the smallest, Flight Berlin 212.40, Hotel Madrid 180.00, Client dinner 142.60 and Team lunch 64.80, each with its ID</title>
<g><rect x="0" y="0" width="1080" height="640" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><rect x="0" y="0" width="1080" height="92" fill="#f5f6f7" stroke="#d9d9d9" stroke-width="1"/>
<rect x="12" y="8" width="100" height="34" rx="8" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
<text x="26" y="29" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#131e29">localhost</text>
<g transform="translate(16 52) scale(1)" fill="none" stroke="#556b82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></g>
<g transform="translate(44 52) scale(1)" fill="none" stroke="#556b82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 11-1.6-3.7M13 2.5V5h-2.5"/></g>
<rect x="76" y="44" width="928" height="32" rx="16" fill="#ffffff" stroke="#bcc3ca" stroke-width="1"/>
<text x="96" y="64" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#131e29">localhost:4004/odata/v4/query/Claims?$filter=status eq 'A' and amount gt 50&amp;$orderby=amount desc&amp;$select=title,amount</text>
<rect x="0" y="92" width="1080" height="548" fill="#ffffff"/>
<g><rect x="16" y="104" width="1048" height="505" rx="6" fill="#ffffff" stroke="#bcc3ca" stroke-width="1"/><text x="28" y="126" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29">{</text><text x="28" y="146" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">  &quot;@odata.context&quot;: &quot;$metadata#Claims&quot;,</text><text x="28" y="166" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">  &quot;value&quot;: [</text><text x="28" y="186" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">    {</text><text x="28" y="206" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;title&quot;: &quot;Flight Berlin&quot;,</text><text x="28" y="226" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;amount&quot;: &quot;212.40&quot;,</text><text x="28" y="246" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;ID&quot;: 6</text><text x="28" y="266" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">    },</text><text x="28" y="286" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">    {</text><text x="28" y="306" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;title&quot;: &quot;Hotel Madrid&quot;,</text><text x="28" y="326" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;amount&quot;: &quot;180.00&quot;,</text><text x="28" y="346" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;ID&quot;: 2</text><text x="28" y="366" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">    },</text><text x="28" y="386" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">    {</text><text x="28" y="406" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;title&quot;: &quot;Client dinner&quot;,</text><text x="28" y="426" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;amount&quot;: &quot;142.60&quot;,</text><text x="28" y="446" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;ID&quot;: 12</text><text x="28" y="466" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">    },</text><text x="28" y="486" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">    {</text><text x="28" y="506" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;title&quot;: &quot;Team lunch&quot;,</text><text x="28" y="526" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;amount&quot;: &quot;64.80&quot;,</text><text x="28" y="546" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">      &quot;ID&quot;: 5</text><text x="28" y="566" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">    }</text><text x="28" y="586" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29" xml:space="preserve">  ]</text><text x="28" y="606" font-family="Menlo, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#131e29">}</text></g>
