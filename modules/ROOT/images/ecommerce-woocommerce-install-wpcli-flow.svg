<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 430" width="1010" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Installing WordPress and WooCommerce with WP-CLI</title>
  <desc id="d">Five stages: download WordPress, create wp-config.php, run the core install, install and activate WooCommerce, then seed the store. Each stage lists the command and what it produces. A bottom band lists the checks that confirm each stage.</desc>
  <rect x="15" y="20" width="182" height="134" rx="10" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="106.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">1. Download</text>
  <text x="106.0" y="68" text-anchor="middle" font-size="12">wp core download</text>
  <text x="106.0" y="86" text-anchor="middle" font-size="12">--version=7.1.3</text>
  <text x="106.0" y="104" text-anchor="middle" font-size="12">php -d memory_limit=512M</text>
  <text x="106.0" y="122" text-anchor="middle" font-size="12">if extraction runs out</text>
  <rect x="15" y="172" width="182" height="82" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="106" y="194" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="106" y="216" text-anchor="middle" font-size="12">WordPress files</text>
  <text x="106" y="234" text-anchor="middle" font-size="12">wp-includes, wp-admin</text>
  <path d="M197 87 L213 87" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="215" y="20" width="182" height="134" rx="10" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="306.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">2. Configure</text>
  <text x="306.0" y="68" text-anchor="middle" font-size="12">wp config create</text>
  <text x="306.0" y="86" text-anchor="middle" font-size="12">--dbname --dbuser</text>
  <text x="306.0" y="104" text-anchor="middle" font-size="12">--dbhost, database exists</text>
  <text x="306.0" y="122" text-anchor="middle" font-size="12">before this step</text>
  <rect x="215" y="172" width="182" height="82" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="306" y="194" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="306" y="216" text-anchor="middle" font-size="12">wp-config.php</text>
  <text x="306" y="234" text-anchor="middle" font-size="12">salts generated</text>
  <path d="M397 87 L413 87" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="415" y="20" width="182" height="134" rx="10" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="506.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">3. Install</text>
  <text x="506.0" y="68" text-anchor="middle" font-size="12">wp core install</text>
  <text x="506.0" y="86" text-anchor="middle" font-size="12">--url --title</text>
  <text x="506.0" y="104" text-anchor="middle" font-size="12">--admin_user --admin_email</text>
  <text x="506.0" y="122" text-anchor="middle" font-size="12">--skip-email</text>
  <rect x="415" y="172" width="182" height="82" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="506" y="194" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="506" y="216" text-anchor="middle" font-size="12">tables, admin user</text>
  <text x="506" y="234" text-anchor="middle" font-size="12">site URL stored</text>
  <path d="M597 87 L613 87" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="615" y="20" width="182" height="134" rx="10" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="706.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">4. WooCommerce</text>
  <text x="706.0" y="68" text-anchor="middle" font-size="12">wp plugin install</text>
  <text x="706.0" y="86" text-anchor="middle" font-size="12">woocommerce</text>
  <text x="706.0" y="104" text-anchor="middle" font-size="12">--version=11.2.1</text>
  <text x="706.0" y="122" text-anchor="middle" font-size="12">--activate</text>
  <rect x="615" y="172" width="182" height="82" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="706" y="194" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="706" y="216" text-anchor="middle" font-size="12">WC tables, 5 pages</text>
  <text x="706" y="234" text-anchor="middle" font-size="12">wp wc hpos enable adds HPOS</text>
  <path d="M797 87 L813 87" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="815" y="20" width="182" height="134" rx="10" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="906.0" y="44" text-anchor="middle" font-size="14" font-weight="bold">5. Seed</text>
  <text x="906.0" y="68" text-anchor="middle" font-size="12">wp option update</text>
  <text x="906.0" y="86" text-anchor="middle" font-size="12">wp wc ... create</text>
  <text x="906.0" y="104" text-anchor="middle" font-size="12">wp wc generate ...</text>
  <text x="906.0" y="122" text-anchor="middle" font-size="12">wp eval-file import</text>
  <rect x="815" y="172" width="182" height="82" rx="8" fill="#7f8c8d" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"/>
  <text x="906" y="194" text-anchor="middle" font-size="12" font-weight="bold">Produces</text>
  <text x="906" y="216" text-anchor="middle" font-size="12">settings, products</text>
  <text x="906" y="234" text-anchor="middle" font-size="12">orders, customers</text>
  <rect x="15" y="276" width="980" height="138" rx="10" fill="#7f8c8d" fill-opacity="0.14" stroke="currentColor" stroke-opacity="1" stroke-width="1.5"/>
  <text x="505" y="302" text-anchor="middle" font-weight="bold">Checks that confirm each stage</text>
  <text x="40" y="332" font-size="12" font-family="Menlo, Consolas, monospace">wp core version</text>
  <text x="40" y="354" font-size="12" font-family="Menlo, Consolas, monospace">wp core is-installed</text>
  <text x="280" y="332" font-size="12" font-family="Menlo, Consolas, monospace">wp plugin list</text>
  <text x="280" y="354" font-size="12" font-family="Menlo, Consolas, monospace">wp plugin verify-checksums woocom...</text>
  <text x="520" y="332" font-size="12" font-family="Menlo, Consolas, monospace">wp wc hpos status</text>
  <text x="520" y="354" font-size="12" font-family="Menlo, Consolas, monospace">wp option get woocommerce_default...</text>
  <text x="760" y="332" font-size="12" font-family="Menlo, Consolas, monospace">wp post list --post_type=page</text>
  <text x="760" y="354" font-size="12" font-family="Menlo, Consolas, monospace">wp wc tool list --user=&lt;admin&gt;</text>
  <text x="40" y="392" font-size="12.5">Every wp wc command needs --user=&lt;administrator&gt; because it is REST-backed.</text>
</svg>
