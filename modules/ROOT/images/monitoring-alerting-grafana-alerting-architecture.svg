<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Grafana Alerting architecture: Grafana-managed rules are evaluated by Grafana and produce alert instances that go to the built-in Grafana Alertmanager (notification policy, then contact point) and optionally to external Alertmanagers; data source-managed rules are stored and evaluated in the Mimir or Loki ruler</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
<text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Grafana Alerting: where rules run and where notifications are handled</text>
<text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">rule, then instance, then notification policy, then contact point</text>

<rect x="20" y="64" width="500" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="36" y="84" font-size="12" font-weight="bold" fill="#0d3c75">1. Grafana-managed rules (evaluated by Grafana, recommended)</text>
<rect x="40" y="98" width="140" height="70" rx="6" fill="#ffffff" stroke="#1565c0"/>
<text x="110" y="118" font-size="10.5" fill="#0d3c75" text-anchor="middle">Queries</text>
<text x="110" y="134" font-size="9.5" fill="#37474f" text-anchor="middle">one or many data sources</text>
<text x="110" y="148" font-size="9.5" fill="#37474f" text-anchor="middle">alerting-enabled backends</text>
<rect x="195" y="98" width="140" height="70" rx="6" fill="#ffffff" stroke="#1565c0"/>
<text x="265" y="118" font-size="10.5" fill="#0d3c75" text-anchor="middle">Expressions</text>
<text x="265" y="134" font-size="9.5" fill="#37474f" text-anchor="middle">Reduce, Math, Resample,</text>
<text x="265" y="148" font-size="9.5" fill="#37474f" text-anchor="middle">Threshold, SQL</text>
<rect x="350" y="98" width="150" height="70" rx="6" fill="#ffffff" stroke="#1565c0"/>
<text x="425" y="118" font-size="10.5" fill="#0d3c75" text-anchor="middle">Condition + states</text>
<text x="425" y="134" font-size="9.5" fill="#37474f" text-anchor="middle">pending, keep firing for,</text>
<text x="425" y="148" font-size="9.5" fill="#37474f" text-anchor="middle">No Data and Error handling</text>
<line x1="180" y1="133" x2="193" y2="133" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="335" y1="133" x2="348" y2="133" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="540" y="64" width="240" height="120" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="556" y="84" font-size="12" font-weight="bold" fill="#8a3c00">1b. Data source-managed rules</text>
<rect x="556" y="98" width="208" height="70" rx="6" fill="#ffffff" stroke="#ef6c00"/>
<text x="660" y="118" font-size="10.5" fill="#8a3c00" text-anchor="middle">Stored and evaluated in the</text>
<text x="660" y="132" font-size="10.5" fill="#8a3c00" text-anchor="middle">data source (Mimir, Loki ruler)</text>
<text x="660" y="148" font-size="9.5" fill="#37474f" text-anchor="middle">query holds the condition; no</text>
<text x="660" y="160" font-size="9.5" fill="#37474f" text-anchor="middle">No Data or Error handling</text>

<rect x="20" y="212" width="500" height="64" rx="8" fill="#f3f3f3" stroke="#607d8b" stroke-width="1.5"/>
<text x="36" y="232" font-size="12" font-weight="bold" fill="#263238">2. Alert instances</text>
<text x="270" y="252" font-size="10.5" fill="#37474f" text-anchor="middle">one instance per series or row, identified by its label set;</text>
<text x="270" y="267" font-size="10.5" fill="#37474f" text-anchor="middle">Grafana sends firing and resolved instances to an Alertmanager</text>
<line x1="270" y1="184" x2="270" y2="210" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="20" y="304" width="360" height="212" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
<text x="36" y="324" font-size="12" font-weight="bold" fill="#2e1a63">3a. Built-in Grafana Alertmanager (default)</text>
<rect x="46" y="338" width="308" height="40" rx="6" fill="#ffffff" stroke="#5e35b1"/>
<text x="200" y="355" font-size="10.5" fill="#2e1a63" text-anchor="middle">Notification policy tree</text>
<text x="200" y="370" font-size="9.5" fill="#37474f" text-anchor="middle">label matchers, grouping, timing</text>
<rect x="46" y="398" width="308" height="40" rx="6" fill="#ffffff" stroke="#5e35b1"/>
<text x="200" y="415" font-size="10.5" fill="#2e1a63" text-anchor="middle">Contact point + template</text>
<text x="200" y="430" font-size="9.5" fill="#37474f" text-anchor="middle">email, chat, paging, webhook</text>
<line x1="200" y1="378" x2="200" y2="396" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="200" y="462" font-size="9.5" fill="#37474f" text-anchor="middle">own silences, mute timings, templates,</text>
<text x="200" y="476" font-size="9.5" fill="#37474f" text-anchor="middle">and up to 100 configuration versions</text>
<text x="200" y="494" font-size="9.5" fill="#37474f" text-anchor="middle">a rule may name a contact point directly</text>
<text x="200" y="507" font-size="9.5" fill="#37474f" text-anchor="middle">and skip the policy tree</text>

<rect x="420" y="304" width="360" height="212" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="436" y="324" font-size="12" font-weight="bold" fill="#1b5e20">3b. External Alertmanagers (optional)</text>
<rect x="446" y="338" width="308" height="52" rx="6" fill="#ffffff" stroke="#2e7d32"/>
<text x="600" y="357" font-size="10.5" fill="#1b5e20" text-anchor="middle">Alertmanager data source</text>
<text x="600" y="372" font-size="9.5" fill="#37474f" text-anchor="middle">Mimir, Cortex or Prometheus implementation</text>
<text x="600" y="384" font-size="9.5" fill="#37474f" text-anchor="middle">receives Grafana alerts when enabled</text>
<text x="600" y="414" font-size="9.5" fill="#37474f" text-anchor="middle">its own policies, contact points, silences</text>
<text x="600" y="428" font-size="9.5" fill="#37474f" text-anchor="middle">(read-only in Grafana for Prometheus,</text>
<text x="600" y="442" font-size="9.5" fill="#37474f" text-anchor="middle">except silences)</text>
<text x="600" y="476" font-size="9.5" fill="#37474f" text-anchor="middle">routing is configured outside the</text>
<text x="600" y="490" font-size="9.5" fill="#37474f" text-anchor="middle">Grafana policy tree</text>

<line x1="200" y1="276" x2="200" y2="302" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M520 244 L600 244 L600 302" fill="none" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="606" y="262" font-size="9.5" fill="#37474f">all alerts, or only those routed</text>
<text x="606" y="275" font-size="9.5" fill="#37474f">to an Alertmanager contact point</text>
<text x="400" y="540" font-size="11" fill="#222222" text-anchor="middle">Receiver: a person, a chat channel, an on-call tool, or the lab webhook receiver</text>
</svg>
