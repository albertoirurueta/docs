<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>The alert pipeline in two tools: a rule is evaluated on a schedule and produces one alert instance per series; Grafana sends instances through a notification policy tree with grouping, silences, mute timings and inhibition to a contact point; Kibana sends alerts through per-rule actions with action frequency, snooze and maintenance windows to a connector</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
<text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">From query to notification</text>
<text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">evaluation decides state; routing decides who hears about it</text>
<rect x="20" y="64" width="760" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="36" y="84" font-size="12" font-weight="bold" fill="#0d3c75">1. Evaluate (both tools)</text>
<rect x="40" y="98" width="150" height="50" rx="6" fill="#ffffff" stroke="#1565c0"/>
<text x="115" y="118" font-size="10.5" fill="#0d3c75" text-anchor="middle">Rule: query + condition</text>
<text x="115" y="134" font-size="9.5" fill="#37474f" text-anchor="middle">runs every interval</text>
<rect x="225" y="98" width="150" height="50" rx="6" fill="#ffffff" stroke="#1565c0"/>
<text x="300" y="118" font-size="10.5" fill="#0d3c75" text-anchor="middle">Instance per series</text>
<text x="300" y="134" font-size="9.5" fill="#37474f" text-anchor="middle">labels identify it</text>
<rect x="410" y="98" width="170" height="50" rx="6" fill="#ffffff" stroke="#1565c0"/>
<text x="495" y="118" font-size="10.5" fill="#0d3c75" text-anchor="middle">State machine</text>
<text x="495" y="134" font-size="9.5" fill="#37474f" text-anchor="middle">pending, firing, recovering</text>
<rect x="615" y="98" width="145" height="50" rx="6" fill="#ffffff" stroke="#1565c0"/>
<text x="688" y="118" font-size="10.5" fill="#0d3c75" text-anchor="middle">Special states</text>
<text x="688" y="134" font-size="9.5" fill="#37474f" text-anchor="middle">no data, error</text>
<line x1="190" y1="123" x2="223" y2="123" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="375" y1="123" x2="408" y2="123" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="580" y1="123" x2="613" y2="123" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="20" y="200" width="370" height="300" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
<text x="36" y="222" font-size="12" font-weight="bold" fill="#2e1a63">2a. Grafana: central routing</text>
<rect x="50" y="236" width="310" height="40" rx="6" fill="#ffffff" stroke="#5e35b1"/>
<text x="205" y="253" font-size="10.5" fill="#2e1a63" text-anchor="middle">Notification policy tree</text>
<text x="205" y="268" font-size="9.5" fill="#37474f" text-anchor="middle">label matchers, continue matching, inheritance</text>
<rect x="50" y="296" width="310" height="40" rx="6" fill="#ffffff" stroke="#5e35b1"/>
<text x="205" y="313" font-size="10.5" fill="#2e1a63" text-anchor="middle">Grouping and timers</text>
<text x="205" y="328" font-size="9.5" fill="#37474f" text-anchor="middle">group wait, group interval, repeat interval</text>
<rect x="50" y="356" width="310" height="40" rx="6" fill="#ffffff" stroke="#5e35b1"/>
<text x="205" y="373" font-size="10.5" fill="#2e1a63" text-anchor="middle">Silences, mute timings, inhibition</text>
<text x="205" y="388" font-size="9.5" fill="#37474f" text-anchor="middle">suppress notifications, rules keep evaluating</text>
<rect x="50" y="416" width="310" height="40" rx="6" fill="#ffffff" stroke="#5e35b1"/>
<text x="205" y="433" font-size="10.5" fill="#2e1a63" text-anchor="middle">Contact point + notification template</text>
<text x="205" y="448" font-size="9.5" fill="#37474f" text-anchor="middle">email, chat, paging, webhook</text>
<line x1="205" y1="276" x2="205" y2="294" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="205" y1="336" x2="205" y2="354" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="205" y1="396" x2="205" y2="414" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="205" y="482" font-size="9.5" fill="#37474f" text-anchor="middle">a rule may also name a contact point directly</text>
<rect x="410" y="200" width="370" height="300" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="426" y="222" font-size="12" font-weight="bold" fill="#1b5e20">2b. Kibana: actions on each rule</text>
<rect x="440" y="236" width="310" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
<text x="595" y="253" font-size="10.5" fill="#1b5e20" text-anchor="middle">Rule actions (one or more)</text>
<text x="595" y="268" font-size="9.5" fill="#37474f" text-anchor="middle">action group: alert, warning, recovered</text>
<rect x="440" y="296" width="310" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
<text x="595" y="313" font-size="10.5" fill="#1b5e20" text-anchor="middle">Action frequency</text>
<text x="595" y="328" font-size="9.5" fill="#37474f" text-anchor="middle">each run, on status change, custom; summary or per alert</text>
<rect x="440" y="356" width="310" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
<text x="595" y="373" font-size="10.5" fill="#1b5e20" text-anchor="middle">Snooze, maintenance windows</text>
<text x="595" y="388" font-size="9.5" fill="#37474f" text-anchor="middle">suppress actions, alerts are still created</text>
<rect x="440" y="416" width="310" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
<text x="595" y="433" font-size="10.5" fill="#1b5e20" text-anchor="middle">Connector + Mustache message</text>
<text x="595" y="448" font-size="9.5" fill="#37474f" text-anchor="middle">email, chat, paging, webhook, cases</text>
<line x1="595" y1="276" x2="595" y2="294" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="595" y1="336" x2="595" y2="354" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="595" y1="396" x2="595" y2="414" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="595" y="482" font-size="9.5" fill="#37474f" text-anchor="middle">routing lives in the rule, not in a shared tree</text>
<line x1="205" y1="164" x2="205" y2="198" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="595" y1="164" x2="595" y2="198" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="400" y="528" font-size="11" fill="#222222" text-anchor="middle">Receiver: a person, a chat channel, an on-call tool, or the lab webhook receiver</text>
<line x1="205" y1="500" x2="205" y2="512" stroke="#37474f" stroke-width="1.2"/>
<line x1="595" y1="500" x2="595" y2="512" stroke="#37474f" stroke-width="1.2"/>
</svg>
