<svg viewBox="0 0 900 600" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">PAdES baseline levels: each level adds one layer of evidence</text>

  <!-- Level columns, bottom aligned at y=250 -->
  <!-- B-B -->
  <rect x="30" y="190" width="190" height="60" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="125" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Signature (CAdES)</text>
  <text x="125" y="228" text-anchor="middle" font-size="11" fill="#333">signing certificate and chain</text>
  <text x="125" y="242" text-anchor="middle" font-size="11" fill="#333">signed attributes, ByteRange</text>
  <rect x="30" y="256" width="190" height="30" rx="6" fill="#1f5fa6"/>
  <text x="125" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">B-B  basic</text>

  <!-- B-T -->
  <rect x="245" y="190" width="190" height="60" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="340" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Signature (CAdES)</text>
  <text x="340" y="228" text-anchor="middle" font-size="11" fill="#333">signing certificate and chain</text>
  <text x="340" y="242" text-anchor="middle" font-size="11" fill="#333">signed attributes, ByteRange</text>
  <rect x="245" y="150" width="190" height="34" rx="6" fill="#fff0d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="340" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4800">+ signature timestamp</text>
  <text x="340" y="179" text-anchor="middle" font-size="11" fill="#333">RFC 3161 token from a TSA</text>
  <rect x="245" y="256" width="190" height="30" rx="6" fill="#b36b00"/>
  <text x="340" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">B-T  timestamp</text>

  <!-- B-LT -->
  <rect x="460" y="190" width="190" height="60" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="555" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Signature (CAdES)</text>
  <text x="555" y="228" text-anchor="middle" font-size="11" fill="#333">signing certificate and chain</text>
  <text x="555" y="242" text-anchor="middle" font-size="11" fill="#333">signed attributes, ByteRange</text>
  <rect x="460" y="150" width="190" height="34" rx="6" fill="#fff0d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="555" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4800">+ signature timestamp</text>
  <text x="555" y="179" text-anchor="middle" font-size="11" fill="#333">RFC 3161 token from a TSA</text>
  <rect x="460" y="108" width="190" height="36" rx="6" fill="#e3f4e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="555" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5c1f">+ DSS dictionary</text>
  <text x="555" y="138" text-anchor="middle" font-size="11" fill="#333">certs, OCSP, CRLs (VRI optional)</text>
  <rect x="460" y="256" width="190" height="30" rx="6" fill="#2b7a2b"/>
  <text x="555" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">B-LT  long term</text>

  <!-- B-LTA -->
  <rect x="675" y="190" width="195" height="60" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="772" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Signature (CAdES)</text>
  <text x="772" y="228" text-anchor="middle" font-size="11" fill="#333">signing certificate and chain</text>
  <text x="772" y="242" text-anchor="middle" font-size="11" fill="#333">signed attributes, ByteRange</text>
  <rect x="675" y="150" width="195" height="34" rx="6" fill="#fff0d6" stroke="#b36b00" stroke-width="1.6"/>
  <text x="772" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4800">+ signature timestamp</text>
  <text x="772" y="179" text-anchor="middle" font-size="11" fill="#333">RFC 3161 token from a TSA</text>
  <rect x="675" y="108" width="195" height="36" rx="6" fill="#e3f4e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="772" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5c1f">+ DSS dictionary</text>
  <text x="772" y="138" text-anchor="middle" font-size="11" fill="#333">certs, OCSP, CRLs (VRI optional)</text>
  <rect x="675" y="66" width="195" height="36" rx="6" fill="#f3e5fa" stroke="#7b3f9e" stroke-width="1.6"/>
  <text x="772" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#5a2a75">+ document timestamp(s)</text>
  <text x="772" y="96" text-anchor="middle" font-size="11" fill="#333">ETSI.RFC3161, renewed over time</text>
  <rect x="675" y="256" width="195" height="30" rx="6" fill="#7b3f9e"/>
  <text x="772" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">B-LTA  archive</text>

  <!-- ladder arrows -->
  <path d="M222,271 L243,271" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#pl-arrow)"/>
  <path d="M437,271 L458,271" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#pl-arrow)"/>
  <path d="M652,271 L673,271" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#pl-arrow)"/>

  <!-- Question strip -->
  <text x="125" y="306" text-anchor="middle" font-size="11" fill="#333">Who signed?</text>
  <text x="340" y="306" text-anchor="middle" font-size="11" fill="#333">Did the signature exist at time t?</text>
  <text x="555" y="306" text-anchor="middle" font-size="11" fill="#333">Can I validate it offline later?</text>
  <text x="772" y="306" text-anchor="middle" font-size="11" fill="#333">Is it still provable after algorithms age?</text>

  <!-- Timeline -->
  <text x="30" y="350" font-size="14" font-weight="700" fill="#1a1a1a">A B-LTA document over time</text>
  <line x1="40" y1="450" x2="860" y2="450" stroke="#555" stroke-width="2" marker-end="url(#pl-arrow)"/>
  <text x="868" y="468" text-anchor="end" font-size="11" fill="#555">time</text>

  <!-- t0 -->
  <line x1="90" y1="436" x2="90" y2="464" stroke="#1f5fa6" stroke-width="2"/>
  <rect x="45" y="372" width="130" height="50" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="110" y="391" text-anchor="middle" font-size="11" font-weight="700" fill="#1f5fa6">t0: signature</text>
  <text x="110" y="406" text-anchor="middle" font-size="10" fill="#333">signing time is only</text>
  <text x="110" y="418" text-anchor="middle" font-size="10" fill="#333">a claim (B-B)</text>
  <text x="90" y="484" text-anchor="middle" font-size="11" fill="#1f5fa6">t0</text>

  <!-- t0+seconds -->
  <line x1="210" y1="436" x2="210" y2="464" stroke="#b36b00" stroke-width="2"/>
  <rect x="165" y="502" width="150" height="50" rx="6" fill="#fff0d6" stroke="#b36b00" stroke-width="1.4"/>
  <text x="240" y="521" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4800">signature timestamp</text>
  <text x="240" y="536" text-anchor="middle" font-size="10" fill="#333">seconds later, proves</text>
  <text x="240" y="548" text-anchor="middle" font-size="10" fill="#333">existence at t0 (B-T)</text>
  <text x="210" y="484" text-anchor="middle" font-size="11" fill="#7a4800">t0 + s</text>

  <!-- DSS -->
  <line x1="340" y1="436" x2="340" y2="464" stroke="#2b7a2b" stroke-width="2"/>
  <rect x="270" y="372" width="140" height="50" rx="6" fill="#e3f4e3" stroke="#2b7a2b" stroke-width="1.4"/>
  <text x="340" y="391" text-anchor="middle" font-size="11" font-weight="700" fill="#1f5c1f">validation data in DSS</text>
  <text x="340" y="406" text-anchor="middle" font-size="10" fill="#333">OCSP and CRLs fetched</text>
  <text x="340" y="418" text-anchor="middle" font-size="10" fill="#333">while still available (B-LT)</text>
  <text x="340" y="484" text-anchor="middle" font-size="11" fill="#1f5c1f">t0 + minutes</text>

  <!-- Doc TS 1 -->
  <line x1="450" y1="436" x2="450" y2="464" stroke="#7b3f9e" stroke-width="2"/>
  <rect x="385" y="502" width="130" height="50" rx="6" fill="#f3e5fa" stroke="#7b3f9e" stroke-width="1.4"/>
  <text x="450" y="521" text-anchor="middle" font-size="11" font-weight="700" fill="#5a2a75">document timestamp 1</text>
  <text x="450" y="536" text-anchor="middle" font-size="10" fill="#333">covers file and DSS</text>
  <text x="450" y="548" text-anchor="middle" font-size="10" fill="#333">(B-LTA)</text>
  <text x="450" y="484" text-anchor="middle" font-size="11" fill="#5a2a75">t1</text>

  <!-- Doc TS 2 -->
  <line x1="610" y1="436" x2="610" y2="464" stroke="#7b3f9e" stroke-width="2"/>
  <rect x="545" y="502" width="130" height="50" rx="6" fill="#f3e5fa" stroke="#7b3f9e" stroke-width="1.4"/>
  <text x="610" y="521" text-anchor="middle" font-size="11" font-weight="700" fill="#5a2a75">document timestamp 2</text>
  <text x="610" y="536" text-anchor="middle" font-size="10" fill="#333">new DSS data and a</text>
  <text x="610" y="548" text-anchor="middle" font-size="10" fill="#333">fresh TSA certificate</text>
  <text x="610" y="484" text-anchor="middle" font-size="11" fill="#5a2a75">t2 (before TSA expiry)</text>

  <!-- Doc TS 3 -->
  <line x1="770" y1="436" x2="770" y2="464" stroke="#7b3f9e" stroke-width="2"/>
  <rect x="705" y="502" width="130" height="50" rx="6" fill="#f3e5fa" stroke="#7b3f9e" stroke-width="1.4"/>
  <text x="770" y="521" text-anchor="middle" font-size="11" font-weight="700" fill="#5a2a75">document timestamp 3</text>
  <text x="770" y="536" text-anchor="middle" font-size="10" fill="#333">stronger hash or key</text>
  <text x="770" y="548" text-anchor="middle" font-size="10" fill="#333">when old ones age</text>
  <text x="770" y="484" text-anchor="middle" font-size="11" fill="#5a2a75">t3 (before algorithm ages)</text>

  <!-- Renewal arcs -->
  <path d="M450,436 C490,400 570,400 606,436" stroke="#7b3f9e" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#pl-arrow)"/>
  <path d="M610,436 C650,400 730,400 766,436" stroke="#7b3f9e" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#pl-arrow)"/>
  <text x="528" y="404" text-anchor="middle" font-size="10" fill="#5a2a75">renew</text>
  <text x="688" y="404" text-anchor="middle" font-size="10" fill="#5a2a75">renew</text>
</svg>
