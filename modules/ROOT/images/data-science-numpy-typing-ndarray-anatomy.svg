<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" role="img" aria-labelledby="t d">
<title id="t">Anatomy of a fully annotated NumPy array type</title>
<desc id="d">The annotation np.ndarray[tuple[int, int], np.dtype[np.float64]] split into its shape part and its dtype part, with the NDArray alias shown as shorthand for an unconstrained shape.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect x="1" y="1" width="718" height="310" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Reading an ndarray annotation</text>
<rect x="24" y="64" width="672" height="64" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="40" y="104" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">np.ndarray[</text>
<rect x="150" y="76" width="154" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="227" y="102" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">tuple[int, int]</text>
<text x="312" y="104" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">,</text>
<rect x="328" y="76" width="262" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="459" y="102" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">np.dtype[np.float64]</text>
<text x="598" y="104" font-family="Menlo, Consolas, monospace" font-size="16" fill="#0F172A">]</text>
<circle cx="227" cy="152" r="11" fill="#0F172A"/><text x="227" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
<circle cx="459" cy="152" r="11" fill="#0F172A"/><text x="459" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
<text x="227" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">shape: one int per dimension</text>
<text x="459" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">element type: a dtype of a scalar class</text>
<rect x="24" y="214" width="672" height="80" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="40" y="244" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="bold" fill="#0F172A">npt.NDArray[np.float64]</text>
<text x="40" y="274" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">= np.ndarray[tuple[Any, ...], np.dtype[np.float64]]  (any shape)</text>
</svg>
