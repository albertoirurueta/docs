<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Where Figma Sites and Webflow overlap, and where they differ</text>
  <rect x="30" y="48" width="170" height="32" rx="4" fill="#E5E7EB"/>
  <rect x="200" y="48" width="260" height="32" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="460" y="48" width="270" height="32" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="115" y="69" fill="#1F2937">Topic</text><text x="330" y="69" fill="#3730A3">Figma Sites (beta)</text><text x="595" y="69" fill="#92400E">Webflow</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="40" y="106" font-weight="bold">Starting point</text><text x="210" y="106">Design canvas, paste from Design</text><text x="470" y="106">Designer on a visual DOM</text>
    <text x="40" y="146" font-weight="bold">Layout model</text><text x="210" y="146">Auto layout, absolute, min/max</text><text x="470" y="146">Flexbox, grid, box model</text>
    <text x="40" y="186" font-weight="bold">Breakpoints</text><text x="210" y="186">Webpage frames, primary cascades</text><text x="470" y="186">Cascade from the base breakpoint</text>
    <text x="40" y="226" font-weight="bold">Content</text><text x="210" y="226">CMS collections, list, page</text><text x="470" y="226">Collections and template pages</text>
    <text x="40" y="266" font-weight="bold">Interactions</text><text x="210" y="266">Hover, reveal, parallax, marquee</text><text x="470" y="266">Interactions with GSAP</text>
    <text x="40" y="306" font-weight="bold">Custom code</text><text x="210" y="306">Code layers (React), head/body code</text><text x="470" y="306">Custom code, code components</text>
    <text x="40" y="346" font-weight="bold">Code export</text><text x="210" y="346">Not currently available</text><text x="470" y="346">Documented on its own page</text>
  </g>
  <g stroke="#E5E7EB" stroke-width="1.5"><line x1="30" y1="120" x2="730" y2="120"/><line x1="30" y1="160" x2="730" y2="160"/><line x1="30" y1="200" x2="730" y2="200"/><line x1="30" y1="240" x2="730" y2="240"/><line x1="30" y1="280" x2="730" y2="280"/><line x1="30" y1="320" x2="730" y2="320"/><line x1="30" y1="360" x2="730" y2="360"/></g>
  <text x="380" y="386" font-size="12" fill="#374151" text-anchor="middle">Qualitative summary; check each product's current documentation before choosing.</text>
</svg>
