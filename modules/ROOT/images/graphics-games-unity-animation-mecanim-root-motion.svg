<text x="380" y="322" text-anchor="middle" font-size="11" fill="#374151">Per clip: Root Transform Rotation, Position (Y) and Position (XZ) each choose Bake into Pose or leave it as root motion.</text>
<text x="380" y="337" text-anchor="middle" font-size="11" fill="#374151">Scripts take over with OnAnimatorMove, which hands you Animator.deltaPosition and Animator.deltaRotation.</text>
