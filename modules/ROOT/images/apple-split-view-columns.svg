<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One NavigationSplitView, three platforms</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">FieldNotes's ContentView: sidebar = NotebookList, content = NoteList, detail = NoteDetail</text>

  <defs>
    <marker id="sv-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- ===================== iPhone (compact) ===================== -->
  <text x="110" y="76" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">iPhone (compact width)</text>
  <text x="110" y="93" font-size="11.5" fill="#666666" text-anchor="middle">collapses into one stack</text>

  <!-- three stacked phone screens, offset like a deck -->
  <rect x="58" y="112" width="104" height="190" rx="16" fill="#fafafa" stroke="#999999" stroke-width="1.4"/>
  <rect x="68" y="124" width="84" height="22" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="110" y="139" font-size="11" fill="#1c4b73" text-anchor="middle">Notebooks</text>
  <rect x="68" y="152" width="84" height="16" rx="3" fill="#ffffff" stroke="#cccccc"/>
  <rect x="68" y="172" width="84" height="16" rx="3" fill="#ffffff" stroke="#cccccc"/>
  <rect x="68" y="192" width="84" height="16" rx="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="110" y="232" font-size="11" fill="#555555" text-anchor="middle">1. sidebar</text>
  <text x="110" y="248" font-size="11" fill="#555555" text-anchor="middle">shown first</text>

  <line x1="110" y1="306" x2="110" y2="324" stroke="#333333" stroke-width="1.3" marker-end="url(#sv-arrow)"/>
  <text x="120" y="320" font-size="10.5" fill="#333333">push</text>

  <rect x="30" y="330" width="75" height="54" rx="10" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.3"/>
  <text x="67" y="354" font-size="11" fill="#8a5a1c" text-anchor="middle">2. NoteList</text>
  <text x="67" y="370" font-size="10" fill="#8a5a1c" text-anchor="middle">content</text>
  <line x1="106" y1="357" x2="118" y2="357" stroke="#333333" stroke-width="1.3" marker-end="url(#sv-arrow)"/>
  <rect x="122" y="330" width="75" height="54" rx="10" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="159" y="354" font-size="11" fill="#2d6a34" text-anchor="middle">3. NoteDetail</text>
  <text x="159" y="370" font-size="10" fill="#2d6a34" text-anchor="middle">detail</text>

  <text x="110" y="408" font-size="11" fill="#555555" text-anchor="middle">Back button pops a column;</text>
  <text x="110" y="423" font-size="11" fill="#555555" text-anchor="middle">preferredCompactColumn picks the top</text>

  <!-- divider -->
  <line x1="222" y1="70" x2="222" y2="425" stroke="#dddddd" stroke-width="1"/>

  <!-- ===================== iPad (regular) ===================== -->
  <text x="370" y="76" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">iPad (regular width)</text>
  <text x="370" y="93" font-size="11.5" fill="#666666" text-anchor="middle">columns side by side, sidebar can hide</text>

  <rect x="240" y="112" width="260" height="190" rx="14" fill="#fafafa" stroke="#999999" stroke-width="1.4"/>
  <rect x="250" y="122" width="62" height="170" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="281" y="140" font-size="11" fill="#1c4b73" text-anchor="middle">sidebar</text>
  <text x="281" y="156" font-size="10" fill="#1c4b73" text-anchor="middle">Notebooks</text>
  <rect x="318" y="122" width="72" height="170" rx="6" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.2"/>
  <text x="354" y="140" font-size="11" fill="#8a5a1c" text-anchor="middle">content</text>
  <text x="354" y="156" font-size="10" fill="#8a5a1c" text-anchor="middle">NoteList</text>
  <rect x="396" y="122" width="94" height="170" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="443" y="140" font-size="11" fill="#2d6a34" text-anchor="middle">detail</text>
  <text x="443" y="156" font-size="10" fill="#2d6a34" text-anchor="middle">NoteDetail</text>

  <text x="370" y="326" font-size="11" fill="#555555" text-anchor="middle">columnVisibility:</text>
  <text x="370" y="342" font-size="11" fill="#555555" text-anchor="middle">.all  |  .doubleColumn  |  .detailOnly</text>
  <text x="370" y="366" font-size="11" fill="#555555" text-anchor="middle">Narrow Split View or Slide Over</text>
  <text x="370" y="382" font-size="11" fill="#555555" text-anchor="middle">windows collapse like iPhone</text>

  <!-- divider -->
  <line x1="520" y1="70" x2="520" y2="425" stroke="#dddddd" stroke-width="1"/>

  <!-- ===================== Mac ===================== -->
  <text x="638" y="76" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Mac (window)</text>
  <text x="638" y="93" font-size="11.5" fill="#666666" text-anchor="middle">resizable columns, never collapses</text>

  <rect x="534" y="112" width="210" height="190" rx="8" fill="#fafafa" stroke="#999999" stroke-width="1.4"/>
  <rect x="534" y="112" width="210" height="22" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="1.4"/>
  <circle cx="546" cy="123" r="3.5" fill="#d9534f"/>
  <circle cx="557" cy="123" r="3.5" fill="#f0ad4e"/>
  <circle cx="568" cy="123" r="3.5" fill="#5cb85c"/>
  <text x="660" y="127" font-size="10" fill="#555555" text-anchor="middle">toolbar</text>
  <rect x="540" y="140" width="50" height="156" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="565" y="158" font-size="10.5" fill="#1c4b73" text-anchor="middle">sidebar</text>
  <rect x="594" y="140" width="62" height="156" rx="4" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.2"/>
  <text x="625" y="158" font-size="10.5" fill="#8a5a1c" text-anchor="middle">content</text>
  <rect x="660" y="140" width="78" height="156" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.2"/>
  <text x="699" y="158" font-size="10.5" fill="#2d6a34" text-anchor="middle">detail</text>

  <text x="638" y="326" font-size="11" fill="#555555" text-anchor="middle">navigationSplitViewColumnWidth</text>
  <text x="638" y="342" font-size="11" fill="#555555" text-anchor="middle">sets min / ideal / max per column</text>
  <text x="638" y="366" font-size="11" fill="#555555" text-anchor="middle">Sidebar toggle and View menu</text>
  <text x="638" y="382" font-size="11" fill="#555555" text-anchor="middle">commands come for free</text>
</svg>
