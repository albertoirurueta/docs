<svg viewBox="0 0 900 670" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="670" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One request, two frameworks: Struts 1.3.10 and Struts 7.4.0</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">POST /book-add.do in the legacy Bookshelf, POST /book-add.do or .action in the migrated one</text>
  <text x="225" y="76" font-size="14" font-weight="bold" fill="#8a3b12" text-anchor="middle">Struts 1.3.10 (end of life 2013-04-05, javax)</text>
  <text x="675" y="76" font-size="14" font-weight="bold" fill="#133a75" text-anchor="middle">Struts 7.4.0 (jakarta)</text>
  <line x1="450" y1="60" x2="450" y2="620" stroke="#cccccc" stroke-dasharray="4 4"/>
  <rect x="30" y="96" width="390" height="52" rx="4" fill="#f3f3f3" stroke="#666666" stroke-width="1.4"/>
  <text x="225.0" y="119.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="225.0" y="134.0" font-size="10" fill="#666666" text-anchor="middle">POST /book-add.do</text>
  <rect x="480" y="96" width="390" height="52" rx="4" fill="#f3f3f3" stroke="#666666" stroke-width="1.4"/>
  <text x="675.0" y="119.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Browser</text>
  <text x="675.0" y="134.0" font-size="10" fill="#666666" text-anchor="middle">POST /book-add.do or /book-add.action</text>
  <line x1="225" y1="148" x2="225" y2="158" stroke="#555555" stroke-width="1.6"/>
  <polygon points="220,157 230,157 225,164" fill="#555555"/>
  <line x1="675" y1="148" x2="675" y2="158" stroke="#555555" stroke-width="1.6"/>
  <polygon points="670,157 680,157 675,164" fill="#555555"/>
  <rect x="30" y="164" width="390" height="52" rx="4" fill="#fdeee6" stroke="#8a3b12" stroke-width="1.4"/>
  <text x="225.0" y="187.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ActionServlet</text>
  <text x="225.0" y="202.0" font-size="10" fill="#8a3b12" text-anchor="middle">one servlet mapped to *.do; one instance</text>
  <rect x="480" y="164" width="390" height="52" rx="4" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="675.0" y="187.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">StrutsPrepareAndExecuteFilter</text>
  <text x="675.0" y="202.0" font-size="10" fill="#1a4d9c" text-anchor="middle">servlet filter; static content passes through</text>
  <line x1="225" y1="216" x2="225" y2="226" stroke="#555555" stroke-width="1.6"/>
  <polygon points="220,225 230,225 225,232" fill="#555555"/>
  <line x1="675" y1="216" x2="675" y2="226" stroke="#555555" stroke-width="1.6"/>
  <polygon points="670,225 680,225 675,232" fill="#555555"/>
  <rect x="30" y="232" width="390" height="52" rx="4" fill="#fdeee6" stroke="#8a3b12" stroke-width="1.4"/>
  <text x="225.0" y="255.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Request processor chain</text>
  <text x="225.0" y="270.0" font-size="10" fill="#8a3b12" text-anchor="middle">locale, content type, SelectAction (mapping)</text>
  <rect x="480" y="232" width="390" height="52" rx="4" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="675.0" y="255.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ActionMapper and ActionProxy</text>
  <text x="675.0" y="270.0" font-size="10" fill="#1a4d9c" text-anchor="middle">namespace and name, then the configured stack</text>
  <line x1="225" y1="284" x2="225" y2="294" stroke="#555555" stroke-width="1.6"/>
  <polygon points="220,293 230,293 225,300" fill="#555555"/>
  <line x1="675" y1="284" x2="675" y2="294" stroke="#555555" stroke-width="1.6"/>
  <polygon points="670,293 680,293 675,300" fill="#555555"/>
  <rect x="30" y="300" width="390" height="52" rx="4" fill="#fdeee6" stroke="#8a3b12" stroke-width="1.4"/>
  <text x="225.0" y="323.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ActionForm</text>
  <text x="225.0" y="338.0" font-size="10" fill="#8a3b12" text-anchor="middle">CreateActionForm, reset(), populate with BeanUtils</text>
  <rect x="480" y="300" width="390" height="52" rx="4" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="675.0" y="323.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Interceptor stack</text>
  <text x="675.0" y="338.0" font-size="10" fill="#1a4d9c" text-anchor="middle">exception, i18n, token, params (@StrutsParameter)</text>
  <line x1="225" y1="352" x2="225" y2="362" stroke="#555555" stroke-width="1.6"/>
  <polygon points="220,361 230,361 225,368" fill="#555555"/>
  <line x1="675" y1="352" x2="675" y2="362" stroke="#555555" stroke-width="1.6"/>
  <polygon points="670,361 680,361 675,368" fill="#555555"/>
  <rect x="30" y="368" width="390" height="52" rx="4" fill="#fdeee6" stroke="#8a3b12" stroke-width="1.4"/>
  <text x="225.0" y="391.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ValidateActionForm</text>
  <text x="225.0" y="406.0" font-size="10" fill="#8a3b12" text-anchor="middle">form.validate() or Validator; ActionErrors; input page</text>
  <rect x="480" y="368" width="390" height="52" rx="4" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="675.0" y="391.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">validation and workflow</text>
  <text x="675.0" y="406.0" font-size="10" fill="#1a4d9c" text-anchor="middle">validate(), XML or annotations; field errors; input result</text>
  <line x1="225" y1="420" x2="225" y2="430" stroke="#555555" stroke-width="1.6"/>
  <polygon points="220,429 230,429 225,436" fill="#555555"/>
  <line x1="675" y1="420" x2="675" y2="430" stroke="#555555" stroke-width="1.6"/>
  <polygon points="670,429 680,429 675,436" fill="#555555"/>
  <rect x="30" y="436" width="390" height="52" rx="4" fill="#fdeee6" stroke="#8a3b12" stroke-width="1.4"/>
  <text x="225.0" y="459.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Action (singleton)</text>
  <text x="225.0" y="474.0" font-size="10" fill="#8a3b12" text-anchor="middle">execute(mapping, form, request, response)</text>
  <rect x="480" y="436" width="390" height="52" rx="4" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="675.0" y="459.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Action (new per request)</text>
  <text x="675.0" y="474.0" font-size="10" fill="#1e6b34" text-anchor="middle">execute() returns a result code String</text>
  <line x1="225" y1="488" x2="225" y2="498" stroke="#555555" stroke-width="1.6"/>
  <polygon points="220,497 230,497 225,504" fill="#555555"/>
  <line x1="675" y1="488" x2="675" y2="498" stroke="#555555" stroke-width="1.6"/>
  <polygon points="670,497 680,497 675,504" fill="#555555"/>
  <rect x="30" y="504" width="390" height="52" rx="4" fill="#fdeee6" stroke="#8a3b12" stroke-width="1.4"/>
  <text x="225.0" y="527.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">ActionForward</text>
  <text x="225.0" y="542.0" font-size="10" fill="#8a3b12" text-anchor="middle">name looked up in the mapping or global-forwards</text>
  <rect x="480" y="504" width="390" height="52" rx="4" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="675.0" y="527.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Result</text>
  <text x="675.0" y="542.0" font-size="10" fill="#1a4d9c" text-anchor="middle">code looked up in the mapping or global-results</text>
  <line x1="225" y1="556" x2="225" y2="566" stroke="#555555" stroke-width="1.6"/>
  <polygon points="220,565 230,565 225,572" fill="#555555"/>
  <line x1="675" y1="556" x2="675" y2="566" stroke="#555555" stroke-width="1.6"/>
  <polygon points="670,565 680,565 675,572" fill="#555555"/>
  <rect x="30" y="572" width="390" height="52" rx="4" fill="#f3f3f3" stroke="#666666" stroke-width="1.4"/>
  <text x="225.0" y="595.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">JSP view</text>
  <text x="225.0" y="610.0" font-size="10" fill="#666666" text-anchor="middle">html, bean, logic taglibs; scopes and EL</text>
  <rect x="480" y="572" width="390" height="52" rx="4" fill="#f3f3f3" stroke="#666666" stroke-width="1.4"/>
  <text x="675.0" y="595.0" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">JSP view</text>
  <text x="675.0" y="610.0" font-size="10" fill="#666666" text-anchor="middle">s: tags read the ValueStack; or FreeMarker</text>
  <text x="450" y="656" font-size="11" fill="#666666" text-anchor="middle">Left: one lifecycle for every action of a module. Right: a stack of interceptors chosen per action, and one fresh action instance per request.</text>
</svg>
