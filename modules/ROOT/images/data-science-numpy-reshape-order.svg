<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
<title id="t">Reshape: C order versus F order</title>
<desc id="d">The twelve elements 0 to 11 stored in one line are reshaped to 3 rows by 4 columns. C order fills row by row, giving rows 0-3, 4-7, 8-11. Fortran order fills column by column, giving rows 0 3 6 9, 1 4 7 10, 2 5 8 11.</desc>
