  <text x="765" y="323" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">Resource-only jars</text>
  <text x="765" y="345" text-anchor="middle" font-size="12" fill="#333">hyph: hyphenation patterns</text>
  <text x="765" y="363" text-anchor="middle" font-size="12" fill="#333">font-asian: CJK CMaps</text>
  <text x="765" y="385" text-anchor="middle" font-size="11" fill="#333">no classes, no dependencies:</text>
  <text x="765" y="400" text-anchor="middle" font-size="11" fill="#333">found on the class path at run time</text>
  <rect x="740" y="470" width="140" height="0" fill="none"/>
  <text x="26" y="52" font-size="11" fill="#333">itext-core (type pom)</text>
  <text x="26" y="67" font-size="11" fill="#333">pulls in every blue box</text>
  <text x="26" y="82" font-size="11" fill="#333">except the bouncy-castle</text>
  <text x="26" y="97" font-size="11" fill="#333">modules</text>
  <line x1="672" y1="450" x2="708" y2="450" stroke="#555" stroke-width="1.5" marker-end="url(#iu-arrow)"/>
  <text x="716" y="454" font-size="11" fill="#333">compile dependency</text>
  <line x1="672" y1="472" x2="708" y2="472" stroke="#2b7a2b" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#iu-arrow)"/>
  <text x="716" y="476" font-size="11" fill="#333">optional, you pick exactly one</text>
  <line x1="672" y1="494" x2="708" y2="494" stroke="#b36b00" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#iu-arrow)"/>
  <text x="716" y="498" font-size="11" fill="#333">add-on, versioned separately</text>
  <text x="672" y="530" font-size="11" fill="#333">Arrows implied by other arrows are</text>
  <text x="672" y="545" font-size="11" fill="#333">not drawn. sign also needs connector,</text>
  <text x="672" y="560" font-size="11" fill="#333">styled-xml-parser and the XML signature</text>
  <text x="672" y="575" font-size="11" fill="#333">and EU trusted list libraries. Both</text>
  <text x="672" y="590" font-size="11" fill="#333">adapters bring Bouncy Castle (bcprov,</text>
  <text x="672" y="605" font-size="11" fill="#333">bcpkix or bc-fips, bcpkix-fips).</text>
