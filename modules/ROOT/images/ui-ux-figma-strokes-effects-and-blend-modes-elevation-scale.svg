<svg viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs><filter id="e1" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1F2937" flood-opacity="0.3"/></filter>
<filter id="e2" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1F2937" flood-opacity="0.3"/></filter>
<filter id="e3" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1F2937" flood-opacity="0.3"/></filter>
<filter id="e4" x="-40%" y="-30%" width="180%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="10" flood-color="#1F2937" flood-opacity="0.3"/></filter></defs>
<rect width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">An elevation scale: higher layers get larger offset and blur</text>
<rect x="20" y="44" width="720" height="236" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
<rect x="45" y="80" width="130" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="215" y="80" width="130" height="90" rx="8" fill="#FFFFFF" filter="url(#e1)"/>
<rect x="385" y="80" width="130" height="90" rx="8" fill="#FFFFFF" filter="url(#e2)"/>
<rect x="555" y="80" width="150" height="90" rx="8" fill="#FFFFFF" filter="url(#e3)" transform="translate(-10,0)"/>
<g font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle"><text x="110" y="130">Level 0</text><text x="280" y="130">Level 1</text><text x="450" y="130">Level 2</text><text x="620" y="130">Level 3</text></g>
<g font-size="12" fill="#374151" text-anchor="middle"><text x="110" y="205">Card on page</text><text x="110" y="222">no shadow</text>
<text x="280" y="205">Resting card</text><text x="280" y="222">Y 1, blur 2</text>
<text x="450" y="205">Raised button</text><text x="450" y="222">Y 3, blur 6</text>
<text x="620" y="205">Menu or dialog</text><text x="620" y="222">Y 8, blur 12</text></g>
<text x="380" y="258" font-size="12" fill="#92400E" text-anchor="middle">Example values only: pick your own steps and save them as effect styles or variables.</text>
</svg>
