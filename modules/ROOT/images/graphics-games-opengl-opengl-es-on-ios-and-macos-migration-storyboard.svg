<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-es-on-ios-and-macos-migration-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Migrating the Bookshelf view in four steps</text>
<rect x="20" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#B45309" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#B45309"/>
<text x="36" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="30" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">glkView.context =</text>
<text x="30" y="117" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  EAGLContext(api:</text>
<text x="30" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">    .openGLES3)</text>
<text x="30" y="151" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">glkView(_:drawIn:)</text>
<text x="30" y="168" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">glDrawArrays(...)</text>
<text x="101" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Legacy GLKView + EAGLContext</text>
<rect x="206" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="222" cy="66" r="11" fill="#4F46E5"/>
<text x="222" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="216" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">let v = MTKView()</text>
<text x="216" y="117" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">v.device =</text>
<text x="216" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  MTLCreateSystem</text>
<text x="216" y="151" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  DefaultDevice()</text>
<text x="216" y="168" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">v.delegate = renderer</text>
<text x="287" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Swap in an MTKView</text>
<rect x="392" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="408" cy="66" r="11" fill="#4F46E5"/>
<text x="408" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="402" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">#version 300 es</text>
<text x="402" y="117" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  becomes</text>
<text x="402" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">vertex VertexOut</text>
<text x="402" y="151" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  bookVertex(...)</text>
<text x="402" y="168" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">fragment float4 ...</text>
<text x="473" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Port GLSL to MSL</text>
<rect x="578" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="594" cy="66" r="11" fill="#4F46E5"/>
<text x="594" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="588" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">makeCommandBuffer()</text>
<text x="588" y="117" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">makeRenderCommand</text>
<text x="588" y="134" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  Encoder(...)</text>
<text x="588" y="151" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">drawPrimitives(...)</text>
<text x="588" y="168" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">present + commit</text>
<text x="659" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Replace GL calls with an encoder</text>
</svg>
