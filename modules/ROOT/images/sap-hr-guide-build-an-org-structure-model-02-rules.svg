<g><rect x="356" y="73" width="716" height="676" rx="2" fill="#1f1f1f" stroke="#3c3c3c" stroke-width="1"/><text x="368" y="95" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">1</text><text x="392" y="95" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  // Units form a tree: a unit never reports to itself or to a unit below it.</text><text x="368" y="115" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">2</text><text x="392" y="115" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  if (r.Relationship === 'A002' || r.Relationship === 'B002') {</text><text x="368" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">3</text><text x="392" y="135" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    const [lower, higher] = r.Relationship === 'A002'</text><text x="368" y="155" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">4</text><text x="392" y="155" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">      ? [r.SourceId, r.TargetId] : [r.TargetId, r.SourceId]</text><text x="368" y="175" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">5</text><text x="392" y="175" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    for (let up = higher; up; ) {</text><text x="368" y="195" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">6</text><text x="392" y="195" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">      if (up === lower) {</text><text x="368" y="215" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">7</text><text x="392" y="215" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">        return req.error(400, `Unit ${lower} cannot report to `</text><text x="368" y="235" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">8</text><text x="392" y="235" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">          + `${higher}, which is not above it`)</text><text x="368" y="255" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">9</text><text x="392" y="255" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">      }</text><text x="368" y="275" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">10</text><text x="392" y="275" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">      up = (await follow('A002', 'O', up, 'O'))[0]?.TargetId</text><text x="368" y="295" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">11</text><text x="392" y="295" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    }</text><text x="368" y="315" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">12</text><text x="392" y="315" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  }</text><text x="368" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">13</text><text x="392" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  // A unit has one chief position.</text><text x="368" y="355" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">14</text><text x="392" y="355" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  if (r.Relationship === 'A012' || r.Relationship === 'B012') {</text><text x="368" y="375" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">15</text><text x="392" y="375" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    const [position, unit] = r.Relationship === 'A012'</text><text x="368" y="395" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">16</text><text x="392" y="395" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">      ? [r.SourceId, r.TargetId] : [r.TargetId, r.SourceId]</text><text x="368" y="415" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">17</text><text x="392" y="415" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    const chief = (await SELECT.from(Relationships).where({</text><text x="368" y="435" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">18</text><text x="392" y="435" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">      Relationship: 'A012', TargetType: 'O', TargetId: unit }))[0]</text><text x="368" y="455" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">19</text><text x="392" y="455" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    if (chief &amp;&amp; chief.SourceId !== position) {</text><text x="368" y="475" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">20</text><text x="392" y="475" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">      return req.error(400,</text><text x="368" y="495" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">21</text><text x="392" y="495" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">        `Unit ${unit} already has the chief position ${chief.SourceId}`)</text><text x="368" y="515" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">22</text><text x="392" y="515" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    }</text><text x="368" y="535" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">23</text><text x="392" y="535" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  }</text><text x="368" y="555" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">24</text><text x="392" y="555" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text><text x="368" y="575" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">25</text><text x="392" y="575" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">this.after('CREATE', Relationships, async (_, req) =&gt; {</text><text x="368" y="595" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">26</text><text x="392" y="595" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const r = req.data</text><text x="368" y="615" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">27</text><text x="392" y="615" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  const { Inverse } = await SELECT.one.from(RelationshipTypes)</text><text x="368" y="635" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">28</text><text x="392" y="635" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    .where({ Relationship: r.Relationship })</text><text x="368" y="655" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">29</text><text x="392" y="655" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  await INSERT.into(Relationships).entries({</text><text x="368" y="675" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">30</text><text x="392" y="675" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    Relationship: Inverse, SourceType: r.TargetType, SourceId: r.TargetId,</text><text x="368" y="695" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">31</text><text x="392" y="695" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    TargetType: r.SourceType, TargetId: r.SourceId })</text><text x="368" y="715" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">32</text><text x="392" y="715" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">  req.info(`Relationship ${r.Relationship} was stored with `</text><text x="368" y="735" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">33</text><text x="392" y="735" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc" xml:space="preserve">    + `its inverse ${Inverse}`)</text><text x="368" y="755" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#989898">34</text><text x="392" y="755" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">})</text></g>
