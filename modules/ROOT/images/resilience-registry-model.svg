<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Registry, configuration, instance, decorated function</text>
  <defs>
    <marker id="rg-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- Registry -->
  <rect x="20" y="50" width="270" height="230" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="155" y="74" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">CircuitBreakerRegistry</text>
  <text x="155" y="90" font-size="10.5" fill="#666666" text-anchor="middle">one per module, a Spring bean in Boot</text>
  <rect x="36" y="102" width="238" height="52" rx="5" fill="#ffffff" stroke="#999999"/>
  <text x="155" y="122" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Configurations (name to config)</text>
  <text x="155" y="140" font-size="10.5" fill="#666666" text-anchor="middle">"default", "strict", "lenient" ...</text>
  <rect x="36" y="164" width="238" height="52" rx="5" fill="#ffffff" stroke="#999999"/>
  <text x="155" y="184" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">RegistryStore</text>
  <text x="155" y="202" font-size="10.5" fill="#666666" text-anchor="middle">in-memory map of name to instance</text>
  <text x="155" y="240" font-size="10.5" fill="#444444" text-anchor="middle">registry tags + EventPublisher:</text>
  <text x="155" y="256" font-size="10.5" fill="#444444" text-anchor="middle">onEntryAdded / Removed / Replaced</text>

  <line x1="290" y1="150" x2="338" y2="150" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#rg-arrow)"/>
  <text x="314" y="138" font-size="10" fill="#444444" text-anchor="middle">get or</text>
  <text x="314" y="170" font-size="10" fill="#444444" text-anchor="middle">create</text>

  <!-- Instance -->
  <rect x="340" y="80" width="230" height="150" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="455" y="104" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Instance "pricing"</text>
  <text x="455" y="122" font-size="10.5" fill="#666666" text-anchor="middle">built from one config + tags</text>
  <text x="455" y="150" font-size="11" fill="#222222" text-anchor="middle">state machine + sliding window</text>
  <text x="455" y="170" font-size="11" fill="#222222" text-anchor="middle">getEventPublisher()</text>
  <text x="455" y="190" font-size="11" fill="#222222" text-anchor="middle">getMetrics()</text>
  <text x="455" y="212" font-size="10.5" fill="#666666" text-anchor="middle">one per remote backend</text>

  <line x1="570" y1="150" x2="618" y2="150" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#rg-arrow)"/>
  <text x="594" y="138" font-size="10" fill="#444444" text-anchor="middle">decorate*</text>
  <text x="594" y="170" font-size="10" fill="#444444" text-anchor="middle">Decorators</text>

  <!-- Decorated function -->
  <rect x="620" y="96" width="260" height="118" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="750" y="122" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Decorated function</text>
  <text x="750" y="146" font-size="11" fill="#222222" text-anchor="middle">Supplier, Callable, Runnable,</text>
  <text x="750" y="162" font-size="11" fill="#222222" text-anchor="middle">Function, CompletionStage,</text>
  <text x="750" y="178" font-size="11" fill="#222222" text-anchor="middle">Checked* variants</text>
  <text x="750" y="200" font-size="10.5" fill="#666666" text-anchor="middle">same signature as the original</text>

  <!-- Boot feed -->
  <rect x="20" y="304" width="270" height="48" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="155" y="324" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Spring Boot: application.yml</text>
  <text x="155" y="340" font-size="10.5" fill="#666666" text-anchor="middle">configs and instances fill the registry</text>
  <line x1="155" y1="304" x2="155" y2="284" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#rg-arrow)"/>

  <rect x="340" y="304" width="540" height="48" rx="6" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="610" y="324" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Programmatic use</text>
  <text x="610" y="340" font-size="10.5" fill="#666666" text-anchor="middle">registry.circuitBreaker("pricing") then CircuitBreaker.decorateSupplier(cb, call)</text>
  <line x1="455" y1="304" x2="455" y2="234" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
