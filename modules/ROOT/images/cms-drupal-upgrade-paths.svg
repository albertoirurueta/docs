<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Drupal upgrade paths: 7 to 10 or 11, 10 to 11 and 11 to 12</title>
<desc id="d">Three lanes. Drupal 6 or 7 sites migrate with the Migrate API into Drupal 10 or 11, and must land on 11.x before Drupal 12 because Migrate Drupal is removed there. Drupal 10 sites update in place to 11 from 10.3 or later. Drupal 11 sites update in place to 12 from 11.3 or later, with 11.4 or 11.5 recommended and PHP 8.5.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="960" height="470" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="700" fill="#1a1a1a">Drupal upgrade paths and the minimum version to start from</text>
<text x="20" y="50" font-size="12" fill="#555">Checked 2026-10-30. Drupal 12.0.0 and the end of life of Drupal 10 (2026-12-09) are scheduled, not released.</text>

<text x="20" y="88" font-size="14" font-weight="700" fill="#1a1a1a">Lane 1: migrate (new site, content and configuration copied)</text>
<rect x="20" y="100" width="190" height="62" rx="6" fill="#f3e3c8" stroke="#8a5a00"/>
<text x="115" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Drupal 6 / 7</text>
<text x="115" y="144" text-anchor="middle" font-size="12" fill="#333">end of life, no in-place path</text>
<line x1="210" y1="131" x2="330" y2="131" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="122" text-anchor="middle" font-size="11" fill="#333">Migrate API</text>
<rect x="335" y="100" width="230" height="62" rx="6" fill="#dbe8f6" stroke="#1f5fa8"/>
<text x="450" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Drupal 10 or 11</text>
<text x="450" y="144" text-anchor="middle" font-size="12" fill="#333">prefer 11.x (10 ends 2026-12-09)</text>
<line x1="565" y1="131" x2="685" y2="131" stroke="#b00020" stroke-width="2" stroke-dasharray="6 4"/>
<text x="625" y="122" text-anchor="middle" font-size="11" fill="#b00020">no migrate in 12</text>
<rect x="690" y="100" width="250" height="62" rx="6" fill="#f6f6f6" stroke="#999" stroke-dasharray="5 4"/>
<text x="815" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#666">Migrate Drupal removed in 12</text>
<text x="815" y="144" text-anchor="middle" font-size="12" fill="#666">migrate to 11.x first, then update</text>

<text x="20" y="204" font-size="14" font-weight="700" fill="#1a1a1a">Lane 2: update 10 to 11 (in place, Composer and drush updatedb)</text>
<rect x="20" y="216" width="190" height="62" rx="6" fill="#f3e3c8" stroke="#8a5a00"/>
<text x="115" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Drupal 10.3 or later</text>
<text x="115" y="260" text-anchor="middle" font-size="12" fill="#333">10.6 is the last minor</text>
<line x1="210" y1="247" x2="330" y2="247" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="238" text-anchor="middle" font-size="11" fill="#333">PHP 8.3+</text>
<rect x="335" y="216" width="230" height="62" rx="6" fill="#dbe8f6" stroke="#1f5fa8"/>
<text x="450" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Drupal 11.x</text>
<text x="450" y="260" text-anchor="middle" font-size="12" fill="#333">target 11.3 or later to reach 12</text>
<text x="690" y="236" font-size="12" fill="#333">Updates before 10.3 were removed in 11.</text>
<text x="690" y="256" font-size="12" fill="#333">Uninstall or replace removed modules first.</text>

<text x="20" y="320" font-size="14" font-weight="700" fill="#1a1a1a">Lane 3: update 11 to 12 (in place, scheduled week of 2026-12-07)</text>
<rect x="20" y="332" width="190" height="62" rx="6" fill="#f3e3c8" stroke="#8a5a00"/>
<text x="115" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Drupal 11.3 or later</text>
<text x="115" y="376" text-anchor="middle" font-size="12" fill="#333">11.4 or 11.5 recommended</text>
<line x1="210" y1="363" x2="330" y2="363" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="354" text-anchor="middle" font-size="11" fill="#333">PHP 8.5</text>
<rect x="335" y="332" width="230" height="62" rx="6" fill="#d8efdc" stroke="#1d7a33"/>
<text x="450" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Drupal 12.0</text>
<text x="450" y="376" text-anchor="middle" font-size="12" fill="#333">Symfony 8, argon2id, Default Admin</text>
<text x="690" y="352" font-size="12" fill="#333">Updates before 11.3 were removed in 12.</text>
<text x="690" y="372" font-size="12" fill="#333">Contrib or custom code must be 12-ready:</text>
<text x="690" y="392" font-size="12" fill="#333">Upgrade Status and Drupal Rector.</text>

<rect x="20" y="420" width="920" height="36" rx="6" fill="#f6f6f6" stroke="#ccc"/>
<text x="34" y="443" font-size="12" fill="#333">Rule of thumb: a site never skips a major. Reach the last 11.x minor, clear every deprecation, then update the code base to 12.</text>
</svg>
