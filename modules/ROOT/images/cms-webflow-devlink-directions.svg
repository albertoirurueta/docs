<svg width="900" height="470" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="DevLink in both directions: components exported from a Webflow site to a React codebase, and React code components imported from a codebase into a Workspace library and installed on sites">
<rect width="900" height="470" fill="#FFFFFF"/>
<text x="450" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F6C">DevLink in both directions</text>

<rect x="20" y="50" width="860" height="170" rx="10" fill="#F4FAF9" stroke="#0B4F6C" stroke-width="1.5"/>
<text x="36" y="76" font-size="15" font-weight="700" fill="#0B4F6C">Export: Webflow to code (devlink export)</text>
<rect x="40" y="95" width="200" height="100" rx="8" fill="#E6F4F2" stroke="#0B4F6C" stroke-width="2"/>
<text x="140" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4F6C">Webflow site</text>
<text x="140" y="148" text-anchor="middle" font-size="13" fill="#0B4F6C">PlantCard component</text>
<text x="140" y="168" text-anchor="middle" font-size="13" fill="#0B4F6C">designed visually</text>
<rect x="350" y="95" width="200" height="100" rx="8" fill="#CDE6F5" stroke="#0B4F6C" stroke-width="2"/>
<text x="450" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4F6C">Generated React</text>
<text x="450" y="148" text-anchor="middle" font-size="13" fill="#0B4F6C">components, global.css,</text>
<text x="450" y="168" text-anchor="middle" font-size="13" fill="#0B4F6C">DevLinkProvider</text>
<rect x="660" y="95" width="200" height="100" rx="8" fill="#CFE8CF" stroke="#2F7D32" stroke-width="2"/>
<text x="760" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#1B5E20">Kiosk app</text>
<text x="760" y="148" text-anchor="middle" font-size="13" fill="#1B5E20">Next.js visitor kiosk</text>
<text x="760" y="168" text-anchor="middle" font-size="13" fill="#1B5E20">imports the components</text>
<line x1="240" y1="145" x2="348" y2="145" stroke="#333333" stroke-width="2"/>
<polygon points="348,145 340,140 340,150" fill="#333333"/>
<line x1="550" y1="145" x2="658" y2="145" stroke="#333333" stroke-width="2"/>
<polygon points="658,145 650,140 650,150" fill="#333333"/>

<rect x="20" y="245" width="860" height="200" rx="10" fill="#FEF8EE" stroke="#B26A00" stroke-width="1.5"/>
<text x="36" y="271" font-size="15" font-weight="700" fill="#7A4800">Import: code to Webflow (devlink import)</text>
<rect x="40" y="295" width="190" height="120" rx="8" fill="#CFE8CF" stroke="#2F7D32" stroke-width="2"/>
<text x="135" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#1B5E20">React codebase</text>
<text x="135" y="345" text-anchor="middle" font-size="13" fill="#1B5E20">BloomCalendar.tsx</text>
<text x="135" y="365" text-anchor="middle" font-size="13" fill="#1B5E20">BloomCalendar.webflow.tsx</text>
<text x="135" y="385" text-anchor="middle" font-size="13" fill="#1B5E20">webflow.json</text>
<rect x="300" y="295" width="170" height="120" rx="8" fill="#FDEBD3" stroke="#B26A00" stroke-width="2"/>
<text x="385" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4800">Bundle</text>
<text x="385" y="345" text-anchor="middle" font-size="13" fill="#7A4800">one React copy</text>
<text x="385" y="365" text-anchor="middle" font-size="13" fill="#7A4800">at most 50 MB</text>
<rect x="540" y="295" width="150" height="120" rx="8" fill="#CDE6F5" stroke="#0B4F6C" stroke-width="2"/>
<text x="615" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4F6C">Workspace</text>
<text x="615" y="345" text-anchor="middle" font-size="13" fill="#0B4F6C">shared library</text>
<text x="615" y="365" text-anchor="middle" font-size="13" fill="#0B4F6C">(Libraries panel)</text>
<rect x="745" y="295" width="115" height="120" rx="8" fill="#E6F4F2" stroke="#0B4F6C" stroke-width="2"/>
<text x="802" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4F6C">Sites</text>
<text x="802" y="345" text-anchor="middle" font-size="13" fill="#0B4F6C">install, drag,</text>
<text x="802" y="365" text-anchor="middle" font-size="13" fill="#0B4F6C">set props</text>
<line x1="230" y1="355" x2="298" y2="355" stroke="#333333" stroke-width="2"/>
<polygon points="298,355 290,350 290,360" fill="#333333"/>
<line x1="470" y1="355" x2="538" y2="355" stroke="#333333" stroke-width="2"/>
<polygon points="538,355 530,350 530,360" fill="#333333"/>
<line x1="690" y1="355" x2="743" y2="355" stroke="#333333" stroke-width="2"/>
<polygon points="743,355 735,350 735,360" fill="#333333"/>
<text x="450" y="438" text-anchor="middle" font-size="12" fill="#555555">Components made visually flow out as React; components written in React flow in as Designer components</text>
</svg>
