<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="380" fill="#ffffff"/>
  <text x="390" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Apple tool chain</text>
  <text x="390" y="48" font-size="13" fill="#666666" text-anchor="middle">From source code in Xcode to a build on the App Store, as FieldNotes travels through it</text>

  <defs>
    <marker id="tc-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
    <marker id="tc-arrow-back" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a5a1c"/>
    </marker>
  </defs>

  <!-- Xcode -->
  <rect x="20" y="80" width="165" height="150" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="102" y="108" font-size="15" font-weight="bold" fill="#1c4b73" text-anchor="middle">Xcode 27</text>
  <text x="102" y="132" font-size="13" fill="#333333" text-anchor="middle">edit and build</text>
  <text x="102" y="152" font-size="13" fill="#333333" text-anchor="middle">#Preview canvas</text>
  <text x="102" y="172" font-size="13" fill="#333333" text-anchor="middle">debugger</text>
  <text x="102" y="192" font-size="13" fill="#333333" text-anchor="middle">coding intelligence</text>
  <text x="102" y="212" font-size="13" fill="#333333" text-anchor="middle">Swift 6.4, 27 SDKs</text>

  <line x1="185" y1="155" x2="211" y2="155" stroke="#333333" stroke-width="1.5" marker-end="url(#tc-arrow)"/>

  <!-- Device Hub -->
  <rect x="215" y="80" width="165" height="150" rx="10" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="297" y="108" font-size="15" font-weight="bold" fill="#2d6a34" text-anchor="middle">Device Hub</text>
  <text x="297" y="132" font-size="13" fill="#333333" text-anchor="middle">simulators</text>
  <text x="297" y="152" font-size="13" fill="#333333" text-anchor="middle">paired iPhone, iPad,</text>
  <text x="297" y="172" font-size="13" fill="#333333" text-anchor="middle">Watch, Vision Pro</text>
  <text x="297" y="192" font-size="13" fill="#333333" text-anchor="middle">Developer Mode on</text>
  <text x="297" y="212" font-size="13" fill="#333333" text-anchor="middle">Run (Command-R)</text>

  <line x1="380" y1="155" x2="406" y2="155" stroke="#333333" stroke-width="1.5" marker-end="url(#tc-arrow)"/>

  <!-- Instruments -->
  <rect x="410" y="80" width="165" height="150" rx="10" fill="#fdf3d8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="492" y="108" font-size="15" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Instruments</text>
  <text x="492" y="132" font-size="13" fill="#333333" text-anchor="middle">Profile (Command-I)</text>
  <text x="492" y="152" font-size="13" fill="#333333" text-anchor="middle">Release build</text>
  <text x="492" y="172" font-size="13" fill="#333333" text-anchor="middle">time, hangs, memory,</text>
  <text x="492" y="192" font-size="13" fill="#333333" text-anchor="middle">SwiftUI updates</text>
  <text x="492" y="212" font-size="13" fill="#333333" text-anchor="middle">on a real device</text>

  <line x1="575" y1="155" x2="601" y2="155" stroke="#333333" stroke-width="1.5" marker-end="url(#tc-arrow)"/>

  <!-- App Store Connect -->
  <rect x="605" y="80" width="155" height="150" rx="10" fill="#f3eef8" stroke="#5a3d86" stroke-width="1.6"/>
  <text x="682" y="108" font-size="15" font-weight="bold" fill="#5a3d86" text-anchor="middle">App Store Connect</text>
  <text x="682" y="132" font-size="13" fill="#333333" text-anchor="middle">Archive and upload</text>
  <text x="682" y="152" font-size="13" fill="#333333" text-anchor="middle">TestFlight</text>
  <text x="682" y="172" font-size="13" fill="#333333" text-anchor="middle">App Review</text>
  <text x="682" y="192" font-size="13" fill="#333333" text-anchor="middle">release, analytics,</text>
  <text x="682" y="212" font-size="13" fill="#333333" text-anchor="middle">crash reports</text>

  <!-- Feedback loop back to Xcode -->
  <path d="M297,230 L297,268 L102,268 L102,236" fill="none" stroke="#8a5a1c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#tc-arrow-back)"/>
  <path d="M492,230 L492,268 L297,268" fill="none" stroke="#8a5a1c" stroke-width="1.4" stroke-dasharray="5,4"/>
  <path d="M682,230 L682,268 L492,268" fill="none" stroke="#8a5a1c" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="390" y="288" font-size="13" fill="#8a5a1c" text-anchor="middle">feedback: bugs, traces, TestFlight feedback and crash logs return to Xcode</text>

  <!-- Artifact band -->
  <rect x="20" y="310" width="740" height="52" rx="8" fill="#f6f6f6" stroke="#bbbbbb" stroke-width="1"/>
  <text x="102" y="332" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">FieldNotes.xcodeproj</text>
  <text x="102" y="350" font-size="13" fill="#555555" text-anchor="middle">sources, packages</text>
  <text x="297" y="332" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">FieldNotes.app</text>
  <text x="297" y="350" font-size="13" fill="#555555" text-anchor="middle">Debug, dev-signed</text>
  <text x="492" y="332" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">.trace document</text>
  <text x="492" y="350" font-size="13" fill="#555555" text-anchor="middle">recorded profile</text>
  <text x="682" y="332" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">.xcarchive</text>
  <text x="682" y="350" font-size="13" fill="#555555" text-anchor="middle">Release, dist-signed</text>
</svg>
