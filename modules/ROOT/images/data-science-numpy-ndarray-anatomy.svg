<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a two-dimensional ndarray</title>
  <desc id="d">A 3 by 4 array drawn as a grid, with axis 0 running down the rows, axis 1 running across the columns, and the attributes shape, ndim, size and dtype listed beside it.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">A 2-D ndarray</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">
    <g stroke="#0F766E" stroke-width="2" fill="#CCFBF1">
      <rect x="120" y="90" width="64" height="48" rx="6"/><rect x="190" y="90" width="64" height="48" rx="6"/><rect x="260" y="90" width="64" height="48" rx="6"/><rect x="330" y="90" width="64" height="48" rx="6"/>
      <rect x="120" y="144" width="64" height="48" rx="6"/><rect x="190" y="144" width="64" height="48" rx="6"/><rect x="260" y="144" width="64" height="48" rx="6"/><rect x="330" y="144" width="64" height="48" rx="6"/>
      <rect x="120" y="198" width="64" height="48" rx="6"/><rect x="190" y="198" width="64" height="48" rx="6"/><rect x="260" y="198" width="64" height="48" rx="6"/><rect x="330" y="198" width="64" height="48" rx="6"/>
    </g>
    <text x="152" y="120">1</text><text x="222" y="120">2</text><text x="292" y="120">3</text><text x="362" y="120">4</text>
    <text x="152" y="174">5</text><text x="222" y="174">6</text><text x="292" y="174">7</text><text x="362" y="174">8</text>
    <text x="152" y="228">9</text><text x="222" y="228">10</text><text x="292" y="228">11</text><text x="362" y="228">12</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#475569" text-anchor="middle">
    <text x="152" y="82">0</text><text x="222" y="82">1</text><text x="292" y="82">2</text><text x="362" y="82">3</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#475569" text-anchor="end">
    <text x="108" y="120">0</text><text x="108" y="174">1</text><text x="108" y="228">2</text>
  </g>
  <line x1="120" y1="276" x2="394" y2="276" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="257" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">axis 1 (columns, length 4)</text>
  <line x1="60" y1="90" x2="60" y2="246" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="40" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle" transform="rotate(-90 40 170)">axis 0 (rows, length 3)</text>
  <circle cx="436" cy="114" r="11" fill="#0F172A"/><text x="436" y="119" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="436" cy="170" r="11" fill="#0F172A"/><text x="436" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="436" cy="226" r="11" fill="#0F172A"/><text x="436" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <g stroke-width="2" rx="6">
    <rect x="456" y="92" width="240" height="44" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/>
    <rect x="456" y="148" width="240" height="44" rx="6" fill="#FEF3C7" stroke="#B45309"/>
    <rect x="456" y="204" width="240" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">
    <text x="470" y="119">shape = (3, 4)   ndim = 2</text>
    <text x="470" y="175">size = 12  itemsize = 8</text>
    <text x="470" y="231">dtype = int64</text>
  </g>
  <text x="456" y="276" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">a[1, 2] is 7: first index picks the row (axis 0),</text>
  <text x="456" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">the second picks the column (axis 1).</text>
</svg>
