<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-tsl-backend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">How WebGPURenderer picks a backend</text>
<rect x="240" y="50" width="280" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="77.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">new THREE.WebGPURenderer(opts)</text>
<line x1="380" y1="96" x2="380" y2="126" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-backend)"/>
<rect x="240" y="126" width="280" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="153.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle" font-family="Menlo, Consolas, monospace">await renderer.init()</text>
<line x1="380" y1="172" x2="380" y2="202" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-backend)"/>
<rect x="240" y="202" width="280" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="226.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">forceWebGL false and</text>
<text x="380.0" y="241.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">navigator.gpu gives an adapter?</text>
<line x1="240" y1="230" x2="175" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-backend)"/>
<text x="208" y="222" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">yes</text>
<line x1="520" y1="230" x2="585" y2="230" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-backend)"/>
<text x="552" y="222" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">no, or forced</text>
<rect x="30" y="202" width="145" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="102.5" y="226.5" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">WebGPU backend</text>
<text x="102.5" y="241.5" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">WGSL, compute</text>
<rect x="585" y="202" width="155" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="662.5" y="226.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">WebGL 2 backend</text>
<text x="662.5" y="241.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">GLSL ES 3.00</text>
<line x1="100" y1="258" x2="290" y2="306" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-backend)"/>
<line x1="660" y1="258" x2="470" y2="306" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-tsl-backend)"/>
<rect x="240" y="306" width="280" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="332.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Same scene, camera,</text>
<text x="380.0" y="347.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">node materials, RenderPipeline</text>
<text x="380" y="392" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">WebGLRenderer is a separate class: it keeps ShaderMaterial, onBeforeCompile and EffectComposer.</text>
<text x="380" y="410" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Only the WebGPU backend runs compute shaders at full capability.</text>
</svg>
