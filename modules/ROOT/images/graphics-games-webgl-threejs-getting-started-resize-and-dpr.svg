<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-getting-started-resize-and-dpr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">CSS size, drawing buffer and pixel ratio</text>
<rect x="20" y="60" width="220" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="89.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Container element</text>
<text x="130.0" y="104.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">clientWidth x clientHeight</text>
<text x="130.0" y="119.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">e.g. 800 x 450 CSS px</text>
<rect x="290" y="60" width="200" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="390.0" y="89.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">setPixelRatio(min(dpr, 2))</text>
<text x="390.0" y="104.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">dpr = devicePixelRatio</text>
<text x="390.0" y="119.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">caps cost on 3x screens</text>
<rect x="540" y="60" width="200" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="89.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Drawing buffer</text>
<text x="640.0" y="104.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">1600 x 900 device px</text>
<text x="640.0" y="119.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">on a dpr = 2 screen</text>
<line x1="240" y1="100" x2="290" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-resize-and-dpr)"/>
<line x1="490" y1="100" x2="540" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-resize-and-dpr)"/>
<rect x="20" y="190" width="350" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="214.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">renderer.setSize(w, h)</text>
<text x="195.0" y="229.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">sets canvas CSS size and buffer size</text>
<text x="195.0" y="244.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">pass false as third argument to keep CSS</text>
<rect x="400" y="190" width="340" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="570.0" y="214.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">camera.aspect = w / h</text>
<text x="570.0" y="229.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">camera.updateProjectionMatrix()</text>
<text x="570.0" y="244.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">otherwise the image is stretched</text>
<text x="380" y="295" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Run both on window resize or with a ResizeObserver on the container.</text>
<text x="380" y="313" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Rendering at a lower pixel ratio is the cheapest performance lever on high-density screens.</text>
</svg>
