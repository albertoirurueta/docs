<title id="sap-hr-guide-model-employee-records-with-validity-periods-06-delete-rules-title">Terminal with two curl commands that delete a record: the delete of the basic pay record is answered with the message A record with time constraint 1 cannot be deleted and HTTP 400 (callout 10), the delete of the parking permit is answered with HTTP 204 (callout 11)</title>
