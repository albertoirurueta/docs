<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -w &quot;\nHTTP %{http_code}\n&quot; -X DELETE &quot;http://localhost:4004/odata/v4/people/BasicPayRecords(Employee_Personn</text>
