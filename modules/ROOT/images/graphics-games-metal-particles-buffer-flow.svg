<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-particles-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">How dust particles flow through one frame</text>
<rect x="20" y="50" width="720" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="70" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Uniform ring: 3 buffers, one per frame in flight (CPU writes, GPU reads)</text>
<rect x="190" y="80" width="120" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="250.0" y="99.0" text-anchor="middle" font-size="11" fill="#3730A3">uniforms[0]</text>
<rect x="320" y="80" width="120" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="99.0" text-anchor="middle" font-size="11" fill="#3730A3">uniforms[1]</text>
<rect x="450" y="80" width="120" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="510.0" y="99.0" text-anchor="middle" font-size="11" fill="#3730A3">uniforms[2]</text>
<rect x="20" y="170" width="200" height="86" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="194.5" text-anchor="middle" font-size="12" fill="#3730A3">Compute encoder</text>
<text x="120.0" y="209.5" text-anchor="middle" font-size="12" fill="#3730A3">update_particles</text>
<text x="120.0" y="224.5" text-anchor="middle" font-size="12" fill="#3730A3">one thread per particle</text>
<text x="120.0" y="239.5" text-anchor="middle" font-size="12" fill="#3730A3">age += dt, move, recycle</text>
<rect x="300" y="170" width="160" height="86" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="194.5" text-anchor="middle" font-size="11" fill="#92400E">Particle buffer</text>
<text x="380.0" y="209.5" text-anchor="middle" font-size="11" fill="#92400E">20,000 x 32 B</text>
<text x="380.0" y="224.5" text-anchor="middle" font-size="11" fill="#92400E">storageModePrivate</text>
<text x="380.0" y="239.5" text-anchor="middle" font-size="11" fill="#92400E">two float4 each</text>
<rect x="540" y="170" width="200" height="86" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640.0" y="194.5" text-anchor="middle" font-size="12" fill="#3730A3">Render encoder</text>
<text x="640.0" y="209.5" text-anchor="middle" font-size="12" fill="#3730A3">particle_vertex x 4</text>
<text x="640.0" y="224.5" text-anchor="middle" font-size="12" fill="#3730A3">instance_id = particle</text>
<text x="640.0" y="239.5" text-anchor="middle" font-size="12" fill="#3730A3">triangle strip draw</text>
<line x1="220" y1="200" x2="300" y2="200" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-particles-flow)"/>
<line x1="300" y1="226" x2="220" y2="226" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah-metal-particles-flow)"/>
<text x="260" y="192" text-anchor="middle" font-size="10" fill="#3730A3">read</text>
<text x="260" y="243" text-anchor="middle" font-size="10" fill="#3730A3">write</text>
<line x1="460" y1="213" x2="540" y2="213" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-metal-particles-flow)"/>
<text x="500" y="205" text-anchor="middle" font-size="10" fill="#92400E">read</text>
<line x1="300" y1="110" x2="120" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-particles-flow)"/>
<line x1="640" y1="110" x2="640" y2="170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-particles-flow)"/>
<line x1="480" y1="150" x2="480" y2="276" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="330" y="296" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">barrier(afterStages: .dispatch, beforeQueueStages: .vertex)</text>
<line x1="640" y1="256" x2="640" y2="306" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-particles-flow)"/>
<rect x="540" y="308" width="200" height="38" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640" y="324" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">particle_fragment: soft sprite</text>
<text x="640" y="339" text-anchor="middle" font-size="10" fill="#374151">additive blend into the scene colour</text>
<rect x="20" y="308" width="440" height="78" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="240" y="328" text-anchor="middle" font-size="11" fill="#374151">Once at start-up: init_particles fills the buffer with random positions and ages.</text>
<text x="240" y="346" text-anchor="middle" font-size="11" fill="#374151">Every frame: update, barrier, draw. The CPU never reads the particles back.</text>
<text x="240" y="364" text-anchor="middle" font-size="11" fill="#374151">Expired particles respawn in place, so the count of instances never changes.</text>
</svg>
