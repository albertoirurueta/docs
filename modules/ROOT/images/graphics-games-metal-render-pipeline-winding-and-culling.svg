<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-render-pipeline-winding-and-culling" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Front faces, winding and cull mode</text>
<polygon points="130,90 190,190 70,190" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<circle cx="130" cy="82" r="11" fill="#4F46E5"/>
<text x="130" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0</text>
<circle cx="204" cy="206" r="11" fill="#4F46E5"/>
<text x="204" y="210" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="56" cy="206" r="11" fill="#4F46E5"/>
<text x="56" y="210" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="130" y="228" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Clockwise on screen</text>
<text x="130" y="244" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">front face by default</text>
<polygon points="380,90 320,190 440,190" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<circle cx="380" cy="82" r="11" fill="#B45309"/>
<text x="380" y="86" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0</text>
<circle cx="306" cy="206" r="11" fill="#B45309"/>
<text x="306" y="210" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="454" cy="206" r="11" fill="#B45309"/>
<text x="454" y="210" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="380" y="228" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Counter-clockwise on screen</text>
<text x="380" y="244" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">back face by default</text>
<rect x="530" y="70" width="210" height="170" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="635.0" y="116.0" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">setCullMode</text>
<text x="635.0" y="130.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.back removes back faces:</text>
<text x="635.0" y="144.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">closed meshes draw half</text>
<text x="635.0" y="158.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">the triangles.</text>
<text x="635.0" y="172.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.front removes front faces</text>
<text x="635.0" y="186.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(rarely useful).</text>
<text x="635.0" y="200.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">.none draws both (default).</text>
<rect x="20" y="290" width="720" height="52" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="312.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Winding is judged as the triangle appears on screen after projection.</text>
<text x="380.0" y="326.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">If a mesh disappears, try setFrontFacing(.counterClockwise) before blaming the shader.</text>
</svg>
