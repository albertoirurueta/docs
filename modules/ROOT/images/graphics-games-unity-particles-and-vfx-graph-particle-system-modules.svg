<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-pv-mod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The Particle System component: modules grouped by what they control</text>
<rect x="20" y="60" width="170" height="200" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="105" y="84" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Initial state</text>
<text x="105" y="112" text-anchor="middle" font-size="11" fill="#3730A3">Main: lifetime, speed, size,</text>
<text x="105" y="132" text-anchor="middle" font-size="11" fill="#3730A3">color, max particles, space</text>
<text x="105" y="152" text-anchor="middle" font-size="11" fill="#3730A3">Emission: rate and bursts</text>
<text x="105" y="172" text-anchor="middle" font-size="11" fill="#3730A3">Shape: where and which way</text>
<rect x="200" y="60" width="170" height="200" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="285" y="84" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Motion over time</text>
<text x="285" y="112" text-anchor="middle" font-size="11" fill="#92400E">Velocity and Force over Lifetime</text>
<text x="285" y="132" text-anchor="middle" font-size="11" fill="#92400E">Noise: turbulence</text>
<text x="285" y="152" text-anchor="middle" font-size="11" fill="#92400E">Limit Velocity, Inherit Velocity</text>
<text x="285" y="172" text-anchor="middle" font-size="11" fill="#92400E">External Forces, Collision,</text>
<text x="285" y="192" text-anchor="middle" font-size="11" fill="#92400E">Triggers, Sub Emitters</text>
<rect x="380" y="60" width="170" height="200" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<text x="465" y="84" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Look over time</text>
<text x="465" y="112" text-anchor="middle" font-size="11" fill="#1F2937">Color and Size over Lifetime</text>
<text x="465" y="132" text-anchor="middle" font-size="11" fill="#1F2937">Color and Size by Speed</text>
<text x="465" y="152" text-anchor="middle" font-size="11" fill="#1F2937">Rotation over Lifetime</text>
<text x="465" y="172" text-anchor="middle" font-size="11" fill="#1F2937">Texture Sheet Animation,</text>
<text x="465" y="192" text-anchor="middle" font-size="11" fill="#1F2937">Trails, Lights, Custom Data</text>
<rect x="560" y="60" width="170" height="200" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="645" y="84" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Output</text>
<text x="645" y="112" text-anchor="middle" font-size="11" fill="#374151">Renderer: render mode,</text>
<text x="645" y="132" text-anchor="middle" font-size="11" fill="#374151">material, sort mode,</text>
<text x="645" y="152" text-anchor="middle" font-size="11" fill="#374151">alignment, shadows,</text>
<text x="645" y="172" text-anchor="middle" font-size="11" fill="#374151">light probes, masking</text>
<line x1="190" y1="160" x2="200" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pv-mod)"/>
<line x1="370" y1="160" x2="380" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pv-mod)"/>
<line x1="550" y1="160" x2="560" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pv-mod)"/>
<rect x="20" y="280" width="720" height="96" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="302" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Bookshelf dust, as configured in the DustField script</text>
<text x="380" y="326" text-anchor="middle" font-size="12" fill="#374151">Main: 400 particles max, lifetime 6 to 10 s, size 0.01 to 0.03 m, world space, gravity 0</text>
<text x="380" y="346" text-anchor="middle" font-size="12" fill="#374151">Emission: 40 per second   Shape: Box, 4 x 2.5 x 4 m around the shelf   Noise: strength 0.15, frequency 0.3</text>
<text x="380" y="366" text-anchor="middle" font-size="12" fill="#374151">Color over Lifetime: fade in and out   Renderer: Billboard, URP Particles Unlit material, alpha blended</text>
</svg>
