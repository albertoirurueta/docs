<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 108" width="1080" height="108" role="img" aria-labelledby="sap-abap-guide-abap-sql-on-a-local-database-05-first-error-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-abap-guide-abap-sql-on-a-local-database-05-first-error-title">Terminal after npm run run:sql with a misspelled field in a SELECT: the transpiler stops with the line Error: check_syntax, checkFields, field STATUZ not found, zsql_claims.prog.abap:57 and the program does not run; callout 17 marks the error line</title>
<g><rect x="0" y="0" width="1080" height="108" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="76" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm run run:sql</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#f14c4c">Error: check_syntax, checkFields, field STATUZ not found, zsql_claims.prog.abap:57</text>
<rect x="5" y="67" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="67" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="72" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">17</text></g></g>
