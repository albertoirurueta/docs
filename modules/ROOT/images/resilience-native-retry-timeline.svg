<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One @Retryable call with every default: four invocations, five events</text>
  <defs>
    <marker id="nr-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="nr-arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b03030"/>
    </marker>
  </defs>

  <!-- caller lane -->
  <rect x="30" y="52" width="840" height="64" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="46" y="74" font-size="12.5" font-weight="bold" fill="#222222">caller</text>
  <text x="46" y="92" font-size="11" fill="#444444">calls isbnClient.lookup(...) once and blocks for about 3 seconds</text>
  <text x="46" y="108" font-size="11" fill="#444444">delay 1000 ms, multiplier 1.0, maxRetries 3, no jitter, no timeout</text>

  <!-- time axis -->
  <line x1="60" y1="190" x2="850" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#nr-arrow)"/>
  <text x="860" y="194" font-size="11" fill="#444444">time</text>
  <line x1="80" y1="184" x2="80" y2="196" stroke="#444444"/>
  <line x1="330" y1="184" x2="330" y2="196" stroke="#444444"/>
  <line x1="580" y1="184" x2="580" y2="196" stroke="#444444"/>
  <line x1="830" y1="184" x2="830" y2="196" stroke="#444444"/>
  <text x="80" y="212" font-size="10.5" fill="#444444" text-anchor="middle">0 ms</text>
  <text x="330" y="212" font-size="10.5" fill="#444444" text-anchor="middle">1000 ms</text>
  <text x="580" y="212" font-size="10.5" fill="#444444" text-anchor="middle">2000 ms</text>
  <text x="830" y="212" font-size="10.5" fill="#444444" text-anchor="middle">3000 ms</text>

  <!-- attempts -->
  <rect x="40" y="140" width="80" height="34" rx="4" fill="#b03030"/>
  <text x="80" y="154" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">invocation 1</text>
  <text x="80" y="167" font-size="10" fill="#ffffff" text-anchor="middle">initial call</text>
  <rect x="290" y="140" width="80" height="34" rx="4" fill="#b03030"/>
  <text x="330" y="154" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">invocation 2</text>
  <text x="330" y="167" font-size="10" fill="#ffffff" text-anchor="middle">retry 1</text>
  <rect x="540" y="140" width="80" height="34" rx="4" fill="#b03030"/>
  <text x="580" y="154" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">invocation 3</text>
  <text x="580" y="167" font-size="10" fill="#ffffff" text-anchor="middle">retry 2</text>
  <rect x="790" y="140" width="80" height="34" rx="4" fill="#b03030"/>
  <text x="830" y="154" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">invocation 4</text>
  <text x="830" y="167" font-size="10" fill="#ffffff" text-anchor="middle">retry 3</text>

  <!-- delays -->
  <line x1="122" y1="157" x2="288" y2="157" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#nr-arrow)"/>
  <text x="205" y="148" font-size="10.5" fill="#1c4b73" text-anchor="middle">sleep about 1007 ms</text>
  <line x1="372" y1="157" x2="538" y2="157" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#nr-arrow)"/>
  <text x="455" y="148" font-size="10.5" fill="#1c4b73" text-anchor="middle">sleep about 1003 ms</text>
  <line x1="622" y1="157" x2="788" y2="157" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#nr-arrow)"/>
  <text x="705" y="148" font-size="10.5" fill="#1c4b73" text-anchor="middle">sleep about 1006 ms</text>

  <!-- every attempt threw -->
  <text x="450" y="236" font-size="11" fill="#444444" text-anchor="middle">each invocation throws IllegalStateException (red)</text>

  <!-- events lane -->
  <rect x="30" y="256" width="840" height="112" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="46" y="276" font-size="12.5" font-weight="bold" fill="#222222">MethodRetryEvent published on the ApplicationContext (since Spring Framework 7.0.3)</text>
  <circle cx="80" cy="304" r="8" fill="#1c4b73"/>
  <circle cx="330" cy="304" r="8" fill="#1c4b73"/>
  <circle cx="580" cy="304" r="8" fill="#1c4b73"/>
  <circle cx="780" cy="304" r="8" fill="#1c4b73"/>
  <circle cx="846" cy="304" r="8" fill="#b03030"/>
  <text x="80" y="328" font-size="10" fill="#444444" text-anchor="middle">failure = ISE</text>
  <text x="330" y="328" font-size="10" fill="#444444" text-anchor="middle">failure = ISE</text>
  <text x="580" y="328" font-size="10" fill="#444444" text-anchor="middle">failure = ISE</text>
  <text x="780" y="328" font-size="10" fill="#444444" text-anchor="middle">failure = ISE</text>
  <text x="46" y="344" font-size="10.5" fill="#444444">four events with retryAborted = false, one per failed invocation</text>
  <text x="46" y="360" font-size="10.5" fill="#444444">a fifth event with retryAborted = true carries the RetryException that ended the retrying</text>
  <text x="868" y="344" font-size="10" fill="#b03030" text-anchor="end">RetryException</text>

  <!-- outcome -->
  <line x1="450" y1="368" x2="450" y2="394" stroke="#b03030" stroke-width="1.6" marker-end="url(#nr-arrow-red)"/>
  <rect x="190" y="396" width="520" height="30" rx="6" fill="#ffffff" stroke="#b03030" stroke-width="1.4"/>
  <text x="450" y="416" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">the caller sees the original IllegalStateException, not the RetryException</text>
</svg>
