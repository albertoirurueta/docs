<svg viewBox="0 0 740 380" width="740" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="740" height="380" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">An interaction is a trigger plus an action</text>
<rect x="20" y="50" width="250" height="300" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145" y="74" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Triggers (what the viewer does)</text>
<g font-size="12" fill="#374151"><text x="36" y="102">On click / On tap</text><text x="36" y="126">On drag (left, right, up, down)</text><text x="36" y="150">While hovering</text><text x="36" y="174">While pressing</text><text x="36" y="198">Keyboard / Gamepad</text><text x="36" y="222">Mouse enter, Mouse leave</text><text x="36" y="246">Mouse down, Mouse up</text><text x="36" y="270">After delay (ms)</text><text x="36" y="294">When video hits, When video ends</text></g>
<path d="M275 200 L335 200" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<rect x="340" y="50" width="380" height="300" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="530" y="74" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Actions (what the prototype does)</text>
<g font-size="12" fill="#374151"><text x="356" y="102">Navigate to a frame</text><text x="356" y="126">Back</text><text x="356" y="150">Scroll to</text><text x="356" y="174">Open link</text><text x="356" y="198">Open overlay, Swap overlay, Close overlay</text><text x="356" y="222">Set variable, Set variable mode</text><text x="356" y="246">Conditional (if / else)</text><text x="356" y="270">Change to (variant of an interactive component)</text><text x="356" y="294">Video: play/pause, mute/unmute, set time, jump</text></g>
<text x="530" y="330" font-size="11" fill="#92400E" text-anchor="middle">Each interaction can also set animation, easing and duration</text>
</svg>
