<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Variable types and what scoping narrows</text>
  <g stroke-width="2">
  <rect x="20" y="56" width="170" height="130" rx="12" fill="#EEF2FF" stroke="#4F46E5"/><rect x="205" y="56" width="170" height="130" rx="12" fill="#EEF2FF" stroke="#4F46E5"/><rect x="390" y="56" width="170" height="130" rx="12" fill="#EEF2FF" stroke="#4F46E5"/><rect x="575" y="56" width="165" height="130" rx="12" fill="#EEF2FF" stroke="#4F46E5"/></g>
  <g font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle"><text x="105" y="82">Color</text><text x="290" y="82">Number</text><text x="475" y="82">String</text><text x="657" y="82">Boolean</text></g>
  <g font-size="12" fill="#374151" text-anchor="middle"><text x="105" y="110">fills, strokes,</text><text x="105" y="128">effects, grids</text><text x="105" y="152">gradient stops</text><text x="290" y="110">spacing, gap,</text><text x="290" y="128">padding, radius,</text><text x="290" y="146">size, min/max</text><text x="475" y="110">text content,</text><text x="475" y="128">font family</text><text x="475" y="146">and style</text><text x="657" y="110">layer visibility,</text><text x="657" y="128">prototype logic,</text><text x="657" y="146">variant props</text></g>
  <rect x="20" y="214" width="720" height="70" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="380" y="238" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Scope: limits where a variable is offered in the pickers</text>
  <text x="380" y="260" font-size="12" fill="#374151" text-anchor="middle">Example: color/accent only for Fill and Stroke; space/card-padding only for Gap and padding.</text>
  <text x="380" y="276" font-size="12" fill="#374151" text-anchor="middle">Scoping is a hint for pickers, not a lock. Offered for colour, number and string variables.</text>
  <text x="380" y="318" font-size="11" fill="#6B7280" text-anchor="middle">Property lists are a simplified summary; confirm in the Figma Learn articles.</text>
</svg>
