<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
<title id="t">PHP versions and what each WooCommerce source says about them</title>
<desc id="d">A row of PHP versions from 7.4 to 8.5. PHP 7.4 is the minimum in the plugin header of WooCommerce 11.2.1. PHP 8.0 is the readme recommendation. PHP 8.1 becomes the minimum from WooCommerce 11.6 in February 2027. PHP versions before 8.2 receive no upstream security fixes. PHP 8.3 and later is the recommendation on the merchant server requirements page and PHP 8.4 is the highest version it lists as tested.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold">PHP versions against what WooCommerce and PHP itself say, on 2026-10-27</text>
<rect x="60" y="60" width="116" height="44" rx="8" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="1.8"></rect>
<text x="118.0" y="89" text-anchor="middle" font-size="16" font-weight="bold">PHP 7.4</text>
<rect x="184" y="60" width="116" height="44" rx="8" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="1.8"></rect>
<text x="242.0" y="89" text-anchor="middle" font-size="16" font-weight="bold">PHP 8.0</text>
<rect x="308" y="60" width="116" height="44" rx="8" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.8"></rect>
<text x="366.0" y="89" text-anchor="middle" font-size="16" font-weight="bold">PHP 8.1</text>
<rect x="432" y="60" width="116" height="44" rx="8" fill="#2ecc71" fill-opacity="0.2" stroke="#2ecc71" stroke-width="1.8"></rect>
<text x="490.0" y="89" text-anchor="middle" font-size="16" font-weight="bold">PHP 8.2</text>
<rect x="556" y="60" width="116" height="44" rx="8" fill="#2ecc71" fill-opacity="0.2" stroke="#2ecc71" stroke-width="1.8"></rect>
<text x="614.0" y="89" text-anchor="middle" font-size="16" font-weight="bold">PHP 8.3</text>
<rect x="680" y="60" width="116" height="44" rx="8" fill="#2ecc71" fill-opacity="0.2" stroke="#2ecc71" stroke-width="1.8"></rect>
<text x="738.0" y="89" text-anchor="middle" font-size="16" font-weight="bold">PHP 8.4</text>
<rect x="804" y="60" width="116" height="44" rx="8" fill="#7f8c8d" fill-opacity="0.2" stroke="#7f8c8d" stroke-width="1.8"></rect>
<text x="862.0" y="89" text-anchor="middle" font-size="16" font-weight="bold">PHP 8.5</text>
<rect x="60" y="126" width="860" height="32" rx="6" fill="#e74c3c" fill-opacity="0.16" stroke="#e74c3c" stroke-width="1.5"></rect>
<text x="490.0" y="147" text-anchor="middle" font-size="12">Plugin header of 11.2.1: Requires PHP 7.4 (the floor today)</text>
<rect x="184" y="170" width="736" height="32" rx="6" fill="#e67e22" fill-opacity="0.16" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5 3"></rect>
<text x="552.0" y="191" text-anchor="middle" font-size="12">readme.txt: PHP 8.0 or greater recommended</text>
<rect x="308" y="214" width="612" height="32" rx="6" fill="#3498db" fill-opacity="0.16" stroke="#3498db" stroke-width="1.5"></rect>
<text x="614.0" y="235" text-anchor="middle" font-size="12">From 11.6 (planned February 2027): PHP 8.1 minimum; 11.3 shows a notice on 7.4 and 8.0</text>
<rect x="432" y="258" width="488" height="32" rx="6" fill="#9b59b6" fill-opacity="0.16" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="5 3"></rect>
<text x="676.0" y="279" text-anchor="middle" font-size="12">PHP project: no upstream security fixes before PHP 8.2</text>
<rect x="556" y="302" width="364" height="32" rx="6" fill="#2ecc71" fill-opacity="0.16" stroke="#2ecc71" stroke-width="1.5"></rect>
<text x="738.0" y="323" text-anchor="middle" font-size="12">Server requirements page: PHP 8.3 or greater (tested up to 8.4)</text>
<text x="480" y="368" text-anchor="middle" font-size="12.5">The newest line the stack was run on for this subsection: PHP 8.3.36 with WordPress 7.1.3, WooCommerce 11.2.1 and MariaDB 11.8.9.</text>
<text x="480" y="392" text-anchor="middle" font-size="12.5">Stores that stay on PHP 7.4 or 8.0 keep receiving updates up to WooCommerce 11.5.</text>
</svg>
