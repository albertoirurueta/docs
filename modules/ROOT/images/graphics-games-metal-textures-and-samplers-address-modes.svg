<text x="380" y="265" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">MTLSamplerDescriptor.sAddressMode, tAddressMode and rAddressMode are independent;</text>
<text x="380" y="284" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">the centre tile is the real texture (coordinates 0 to 1).</text>
<text x="380" y="310" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Use repeat for tiling wood, clampToEdge for UI and atlases, and mirrorRepeat to hide seams.</text>
