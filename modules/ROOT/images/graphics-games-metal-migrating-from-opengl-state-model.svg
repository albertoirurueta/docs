<svg viewBox="0 0 760 350" width="760" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-migrating-from-opengl-state-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="350" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">State: mutable context versus baked pipeline objects</text>
<rect x="30" y="55" width="330" height="250" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="184.6" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">OpenGL context</text>
<rect x="50" y="90" width="290" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="109.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">blend, depth, cull, viewport</text>
<rect x="50" y="130" width="290" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="149.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">current program</text>
<rect x="50" y="170" width="290" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="189.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">bound buffers, textures, VAO</text>
<rect x="50" y="210" width="290" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="229.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">framebuffer and draw buffers</text>
<rect x="50" y="250" width="290" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="269.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">any call can change any of it</text>
<rect x="400" y="55" width="330" height="250" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="184.6" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Metal</text>
<rect x="420" y="90" width="290" height="32" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="109.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">MTLRenderPipelineState: shaders, blend, formats</text>
<rect x="420" y="130" width="290" height="32" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="149.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">MTLDepthStencilState: depth and stencil test</text>
<rect x="420" y="170" width="290" height="32" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="189.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">MTLRenderPassDescriptor: attachments, load/store</text>
<rect x="420" y="210" width="290" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="229.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Encoder: viewport, cull, bindings per pass</text>
<rect x="420" y="250" width="290" height="32" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="269.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pipelines are built once, validated early</text>
<text x="380" y="330" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Changing blend or a colour format in Metal means a different pipeline state, created before the frame starts.</text>
