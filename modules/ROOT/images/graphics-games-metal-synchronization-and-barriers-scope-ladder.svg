<svg viewBox="0 0 760 460" width="760" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-sync-ladder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="460" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Synchronisation tools, from narrowest to widest scope</text>
<rect x="20" y="46" width="130" height="26" rx="4" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<text x="85.0" y="63" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Tool</text>
<rect x="150" y="46" width="140" height="26" rx="4" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<text x="220.0" y="63" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Orders</text>
<rect x="290" y="46" width="250" height="26" rx="4" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<text x="415.0" y="63" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Metal 4 (MTL4 types)</text>
<rect x="540" y="46" width="200" height="26" rx="4" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
<text x="640.0" y="63" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Metal 3 and earlier</text>
<rect x="20" y="82" width="130" height="68" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.0" y="120.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Encoder barrier</text>
<rect x="150" y="82" width="140" height="68" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="220.0" y="113.0" text-anchor="middle" font-size="12" fill="#374151">commands inside</text>
<text x="220.0" y="127.0" text-anchor="middle" font-size="12" fill="#374151">one pass</text>
<rect x="290" y="82" width="250" height="68" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="415.0" y="106.0" text-anchor="middle" font-size="10.5" fill="#374151">barrier(afterEncoderStages:</text>
<text x="415.0" y="120.0" text-anchor="middle" font-size="10.5" fill="#374151">beforeEncoderStages:</text>
<text x="415.0" y="134.0" text-anchor="middle" font-size="10.5" fill="#374151">visibilityOptions:)</text>
<rect x="540" y="82" width="200" height="68" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640.0" y="113.0" text-anchor="middle" font-size="10.5" fill="#374151">memoryBarrier(scope:)</text>
<text x="640.0" y="127.0" text-anchor="middle" font-size="10.5" fill="#374151">memoryBarrier(resources:)</text>
<rect x="20" y="156" width="130" height="68" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.0" y="194.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Queue barrier</text>
<rect x="150" y="156" width="140" height="68" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="220.0" y="187.0" text-anchor="middle" font-size="12" fill="#374151">passes of one</text>
<text x="220.0" y="201.0" text-anchor="middle" font-size="12" fill="#374151">queue</text>
<rect x="290" y="156" width="250" height="68" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="415.0" y="173.0" text-anchor="middle" font-size="10.5" fill="#374151">consumer: barrier(afterQueueStages:</text>
<text x="415.0" y="187.0" text-anchor="middle" font-size="10.5" fill="#374151">beforeStages:visibilityOptions:)</text>
<text x="415.0" y="201.0" text-anchor="middle" font-size="10.5" fill="#374151">producer: barrier(afterStages:</text>
<text x="415.0" y="215.0" text-anchor="middle" font-size="10.5" fill="#374151">beforeQueueStages:visibilityOptions:)</text>
<rect x="540" y="156" width="200" height="68" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="640.0" y="187.0" text-anchor="middle" font-size="10.5" fill="#374151">automatic hazard tracking</text>
<text x="640.0" y="201.0" text-anchor="middle" font-size="10.5" fill="#374151">(tracked resources)</text>
<rect x="20" y="230" width="130" height="68" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="85.0" y="268.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Fence</text>
<rect x="150" y="230" width="140" height="68" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="220.0" y="261.0" text-anchor="middle" font-size="12" fill="#374151">two passes,</text>
<text x="220.0" y="275.0" text-anchor="middle" font-size="12" fill="#374151">per stage</text>
<rect x="290" y="230" width="250" height="68" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="415.0" y="261.0" text-anchor="middle" font-size="10.5" fill="#374151">updateFence(_:afterEncoderStages:)</text>
<text x="415.0" y="275.0" text-anchor="middle" font-size="10.5" fill="#374151">waitForFence(_:beforeEncoderStages:)</text>
<rect x="540" y="230" width="200" height="68" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="640.0" y="261.0" text-anchor="middle" font-size="10.5" fill="#374151">updateFence / waitForFence</text>
<text x="640.0" y="275.0" text-anchor="middle" font-size="10.5" fill="#374151">on each encoder type</text>
<rect x="20" y="304" width="130" height="68" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="85.0" y="342.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Event</text>
<rect x="150" y="304" width="140" height="68" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="220.0" y="335.0" text-anchor="middle" font-size="12" fill="#374151">queues of one</text>
<text x="220.0" y="349.0" text-anchor="middle" font-size="12" fill="#374151">device</text>
<rect x="290" y="304" width="250" height="68" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="415.0" y="335.0" text-anchor="middle" font-size="10.5" fill="#374151">queue.signalEvent(_:value:)</text>
<text x="415.0" y="349.0" text-anchor="middle" font-size="10.5" fill="#374151">queue.waitForEvent(_:value:)</text>
<rect x="540" y="304" width="200" height="68" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="640.0" y="335.0" text-anchor="middle" font-size="10.5" fill="#374151">commandBuffer.encodeSignalEvent</text>
<text x="640.0" y="349.0" text-anchor="middle" font-size="10.5" fill="#374151">commandBuffer.encodeWaitForEvent</text>
<rect x="20" y="378" width="130" height="68" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="85.0" y="416.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Shared event</text>
<rect x="150" y="378" width="140" height="68" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="220.0" y="409.0" text-anchor="middle" font-size="12" fill="#374151">CPU, other</text>
<text x="220.0" y="423.0" text-anchor="middle" font-size="12" fill="#374151">devices, processes</text>
<rect x="290" y="378" width="250" height="68" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="415.0" y="402.0" text-anchor="middle" font-size="10.5" fill="#374151">same as an event, plus</text>
<text x="415.0" y="416.0" text-anchor="middle" font-size="10.5" fill="#374151">wait(untilSignaledValue:timeoutMS:)</text>
<text x="415.0" y="430.0" text-anchor="middle" font-size="10.5" fill="#374151">notify(_:atValue:block:)</text>
<rect x="540" y="378" width="200" height="68" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="640.0" y="416.0" text-anchor="middle" font-size="10.5" fill="#374151">same API on MTLSharedEvent</text>
<path d="M 8 90 L 8 440" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-sync-ladder)"/>
</svg>
