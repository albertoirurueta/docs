<svg viewBox="0 0 760 460" width="760" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Liquid Glass layer model</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">Content at the bottom, a functional layer of glass controls above it, transient overlays on top</text>

  <defs>
    <marker id="lg-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555555"/>
    </marker>
    <linearGradient id="lg-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#cfe3f7" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- z-order arrow -->
  <line x1="28" y1="380" x2="28" y2="96" stroke="#555555" stroke-width="1.5" marker-end="url(#lg-arrow)"/>
  <text x="20" y="240" font-size="12" fill="#555555" text-anchor="middle" transform="rotate(-90 20 240)">closer to the viewer</text>

  <!-- Layer 1: content (bottom) -->
  <g transform="translate(110 320) skewX(-45)">
    <rect x="0" y="0" width="300" height="64" rx="6" fill="#f3efe4" stroke="#8a7a52" stroke-width="1.6"/>
    <rect x="14" y="10" width="80" height="44" rx="4" fill="#fffaf0" stroke="#b9a877" stroke-width="1"/>
    <rect x="108" y="10" width="80" height="44" rx="4" fill="#fffaf0" stroke="#b9a877" stroke-width="1"/>
    <rect x="202" y="10" width="84" height="44" rx="4" fill="#dfeedd" stroke="#6f9a68" stroke-width="1"/>
  </g>

  <!-- Layer 2: Liquid Glass functional layer -->
  <g transform="translate(110 215) skewX(-45)">
    <rect x="0" y="0" width="300" height="64" rx="6" fill="none" stroke="#9fb7cf" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="10" y="6" width="280" height="14" rx="7" fill="url(#lg-glass)" stroke="#1c4b73" stroke-width="1.4"/>
    <rect x="10" y="44" width="170" height="14" rx="7" fill="url(#lg-glass)" stroke="#1c4b73" stroke-width="1.4"/>
    <circle cx="258" cy="46" r="12" fill="url(#lg-glass)" stroke="#1c4b73" stroke-width="1.4"/>
  </g>

  <!-- Layer 3: overlays -->
  <g transform="translate(110 110) skewX(-45)">
    <rect x="0" y="0" width="300" height="64" rx="6" fill="none" stroke="#c9b3d6" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="120" y="8" width="160" height="48" rx="10" fill="url(#lg-glass)" stroke="#7a3b8f" stroke-width="1.6"/>
  </g>

  <!-- dashed guides from layers to labels -->
  <line x1="390" y1="142" x2="422" y2="142" stroke="#7a3b8f" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="247" x2="422" y2="247" stroke="#1c4b73" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="352" x2="422" y2="352" stroke="#8a7a52" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Labels: overlays -->
  <text x="430" y="120" font-size="14" font-weight="bold" fill="#7a3b8f">3. Overlays (transient)</text>
  <text x="430" y="139" font-size="12" fill="#333333">Sheets, popovers, menus, alerts.</text>
  <text x="430" y="156" font-size="12" fill="#333333">Half sheets inset; full height turns opaque.</text>
  <text x="430" y="173" font-size="12" fill="#666666">Remove custom sheet and popover backgrounds.</text>

  <!-- Labels: functional layer -->
  <text x="430" y="222" font-size="14" font-weight="bold" fill="#1c4b73">2. Functional layer: Liquid Glass</text>
  <text x="430" y="241" font-size="12" fill="#333333">Toolbars, tab bar, sidebar, search, controls,</text>
  <text x="430" y="258" font-size="12" fill="#333333">and custom glass: the FieldNotes CaptureButton.</text>
  <text x="430" y="275" font-size="12" fill="#666666">glassEffect, GlassEffectContainer, .glass</text>

  <!-- Labels: content layer -->
  <text x="430" y="328" font-size="14" font-weight="bold" fill="#8a7a52">1. Content layer</text>
  <text x="430" y="347" font-size="12" fill="#333333">Note lists, text, photos, sketches, maps.</text>
  <text x="430" y="364" font-size="12" fill="#333333">Scrolls and peeks through beneath the glass.</text>
  <text x="430" y="381" font-size="12" fill="#a33333">No Liquid Glass here; use standard materials.</text>

  <!-- footer -->
  <rect x="60" y="408" width="640" height="36" rx="8" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1"/>
  <text x="380" y="431" font-size="12" fill="#444444" text-anchor="middle">Scroll edge effects and backgroundExtensionEffect() keep content legible where it meets the glass layer.</text>
</svg>
