<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Transform feedback: capturing vertex-stage output into a buffer</text>
<rect x="30" y="70" width="150" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="89.0" text-anchor="middle" font-size="12" fill="#374151">Buffer A</text>
<text x="105.0" y="104.0" text-anchor="middle" font-size="12" fill="#374151">positions, velocities</text>
<text x="105.0" y="119.0" text-anchor="middle" font-size="12" fill="#374151">(input)</text>
<rect x="230" y="70" width="160" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="310.0" y="89.0" text-anchor="middle" font-size="11" fill="#3730A3">Vertex shader</text>
<text x="310.0" y="104.0" text-anchor="middle" font-size="11" fill="#3730A3">updates the particle</text>
<text x="310.0" y="119.0" text-anchor="middle" font-size="11" fill="#3730A3">writes out_pos, out_vel</text>
<rect x="440" y="70" width="140" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="510.0" y="89.0" text-anchor="middle" font-size="11" fill="#92400E">Buffer B</text>
<text x="510.0" y="104.0" text-anchor="middle" font-size="11" fill="#92400E">feedback buffer</text>
<text x="510.0" y="119.0" text-anchor="middle" font-size="11" fill="#92400E">(captured output)</text>
<line x1="180" y1="100" x2="228" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="390" y1="100" x2="438" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="200" y="160" width="220" height="40" rx="8" fill="#FEE2E2" stroke="#B45309" stroke-width="1.5"/>
<text x="310.0" y="176.5" text-anchor="middle" font-size="10" fill="#92400E">Rasteriser skipped by</text>
<text x="310.0" y="191.5" text-anchor="middle" font-size="10" fill="#92400E">GL_RASTERIZER_DISCARD</text>
<line x1="310" y1="130" x2="310" y2="158" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<rect x="30" y="225" width="700" height="100" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="248" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Next frame: swap A and B (ping-pong)</text>
<text x="50" y="272" text-anchor="start" font-size="11" fill="#374151">1. Pass 1 with rasteriser discard on: A is the vertex input, B captures the output.</text>
<text x="50" y="290" text-anchor="start" font-size="11" fill="#374151">2. Pass 2 with discard off: draw B as GL_POINTS with the normal shaders, or glDrawTransformFeedback.</text>
<text x="50" y="308" text-anchor="start" font-size="11" fill="#374151">3. Swap roles: the next frame reads B and captures into A. No CPU readback happens.</text>
<text x="380" y="350" text-anchor="middle" font-size="11" fill="#4B5563">Needs only OpenGL 3.0 or ES 3.0, so it works on contexts that have no compute shaders.</text>
</svg>
