<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">ASP.NET MVC 5 request life cycle (System.Web hosted)</text>

  <!-- row 1: System.Web / routing -->
  <rect x="20" y="55" width="150" height="70" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="95" y="83" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">HTTP request</text>
  <text x="95" y="101" font-size="10.5" fill="#1c4b73" text-anchor="middle">IIS / ASP.NET</text>
  <text x="95" y="115" font-size="10.5" fill="#1c4b73" text-anchor="middle">pipeline</text>

  <rect x="200" y="55" width="160" height="70" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="280" y="83" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">UrlRoutingModule</text>
  <text x="280" y="101" font-size="10.5" fill="#1c4b73" text-anchor="middle">HttpModule; matches</text>
  <text x="280" y="115" font-size="10.5" fill="#1c4b73" text-anchor="middle">RouteTable.Routes</text>

  <rect x="390" y="55" width="160" height="70" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="470" y="83" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">MvcRouteHandler</text>
  <text x="470" y="101" font-size="10.5" fill="#1c4b73" text-anchor="middle">IRouteHandler; creates</text>
  <text x="470" y="115" font-size="10.5" fill="#1c4b73" text-anchor="middle">the MvcHandler</text>

  <rect x="580" y="55" width="150" height="70" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="655" y="83" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">MvcHandler</text>
  <text x="655" y="101" font-size="10.5" fill="#1c4b73" text-anchor="middle">IHttpHandler; entry</text>
  <text x="655" y="115" font-size="10.5" fill="#1c4b73" text-anchor="middle">point into MVC</text>

  <rect x="760" y="55" width="120" height="70" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="820" y="90" font-size="11.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">IControllerFactory</text>
  <text x="820" y="106" font-size="10" fill="#8a3d10" text-anchor="middle">resolves + creates</text>
  <text x="820" y="118" font-size="10" fill="#8a3d10" text-anchor="middle">the Controller</text>

  <!-- arrows row 1 -->
  <g stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="90" x2="197" y2="90"/>
    <line x1="360" y1="90" x2="387" y2="90"/>
    <line x1="550" y1="90" x2="577" y2="90"/>
    <line x1="730" y1="90" x2="757" y2="90"/>
  </g>

  <!-- down arrow from IControllerFactory to row 2 -->
  <path d="M820,125 L820,150 L470,150 L470,170" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- row 2: controller / action invocation -->
  <rect x="200" y="180" width="150" height="70" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="275" y="208" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Controller</text>
  <text x="275" y="226" font-size="10.5" fill="#2f5424" text-anchor="middle">Controller.Execute</text>
  <text x="275" y="240" font-size="10.5" fill="#2f5424" text-anchor="middle">-&gt; ExecuteCore</text>

  <rect x="390" y="180" width="160" height="70" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="470" y="208" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">IActionInvoker</text>
  <text x="470" y="226" font-size="10.5" fill="#2f5424" text-anchor="middle">selects action, binds</text>
  <text x="470" y="240" font-size="10.5" fill="#2f5424" text-anchor="middle">params, runs filters</text>

  <rect x="590" y="180" width="140" height="70" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="660" y="208" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">Action method</text>
  <text x="660" y="226" font-size="10.5" fill="#2f5424" text-anchor="middle">returns an</text>
  <text x="660" y="240" font-size="10.5" fill="#2f5424" text-anchor="middle">ActionResult</text>

  <g stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="350" y1="215" x2="387" y2="215"/>
    <line x1="550" y1="215" x2="587" y2="215"/>
  </g>

  <!-- down arrow to row 3 -->
  <path d="M660,250 L660,275 L470,275 L470,295" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- row 3: result execution / view engine -->
  <rect x="200" y="305" width="220" height="70" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="310" y="333" font-size="12.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">ActionResult.ExecuteResult</text>
  <text x="310" y="351" font-size="10.5" fill="#8a3d10" text-anchor="middle">ViewResult, JsonResult,</text>
  <text x="310" y="365" font-size="10.5" fill="#8a3d10" text-anchor="middle">RedirectResult, ...</text>

  <rect x="450" y="305" width="220" height="70" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="560" y="333" font-size="12.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">ViewEngines / IViewEngine</text>
  <text x="560" y="351" font-size="10.5" fill="#8a3d10" text-anchor="middle">locates + renders the</text>
  <text x="560" y="365" font-size="10.5" fill="#8a3d10" text-anchor="middle">.cshtml with RazorViewEngine</text>

  <path d="M420,340 L447,340" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- final arrow to response -->
  <rect x="710" y="305" width="170" height="70" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="795" y="333" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">HTTP response</text>
  <text x="795" y="351" font-size="10.5" fill="#1c4b73" text-anchor="middle">rendered HTML / JSON</text>
  <text x="795" y="365" font-size="10.5" fill="#1c4b73" text-anchor="middle">written to the client</text>

  <path d="M670,340 L707,340" stroke="#555555" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <text x="450" y="415" font-size="12" fill="#444444" text-anchor="middle">Each step is an extensibility point: a custom IRouteHandler, IControllerFactory, IActionInvoker,</text>
  <text x="450" y="433" font-size="12" fill="#444444" text-anchor="middle">custom ActionResult, or custom IViewEngine can be substituted without changing the others.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>
</svg>
