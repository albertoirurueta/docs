<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Registration at load, work inside the actions</text>
  <rect x="20" y="50" width="330" height="260" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="36" y="74" font-size="13" font-weight="bold" fill="#1F2937">Recommended layout</text>
  <g font-family="Courier, monospace" font-size="12" fill="#1F2937">
    <text x="36" y="104">src/</text>
    <text x="52" y="126">index.tsx</text>
    <text x="52" y="148">intents/</text>
    <text x="68" y="170">design_editor/</text>
    <text x="84" y="192">index.tsx</text>
    <text x="68" y="214">data_connector/</text>
    <text x="84" y="236">index.tsx</text>
    <text x="68" y="258">content_publisher/</text>
    <text x="84" y="280">index.tsx</text>
  </g>
  <rect x="200" y="112" width="140" height="22" rx="11" fill="#FEF3C7" stroke="#B45309"/>
  <text x="270" y="127" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">only prepare calls</text>
  <rect x="380" y="50" width="360" height="124" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="396" y="74" font-size="13" font-weight="bold" fill="#1F2937">At module level (synchronous)</text>
  <g font-size="12" fill="#374151"><text x="396" y="98">1. import each intent implementation</text><text x="396" y="118">2. call prepareDesignEditor(...) and friends</text><text x="396" y="138">3. nothing else: no fetch, no state, no UI</text><text x="396" y="158">Register once, as soon as the app loads</text></g>
  <rect x="380" y="186" width="360" height="124" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="396" y="210" font-size="13" font-weight="bold" fill="#92400E">Inside the intent actions</text>
  <g font-size="12" fill="#374151"><text x="396" y="234">render(): mount the React UI with AppUiProvider</text><text x="396" y="254">getDataTable(), publishContent(): call your backend</text><text x="396" y="274">OAuth and side effects start here, on a user action</text><text x="396" y="294">Initialise lazily inside components</text></g>
  <path d="M350,112 L378,112" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M350,248 L378,248" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="380" y="342" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic app project, not a screenshot of any product.</text>
</svg>
