<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Which Canva measurement tool answers which question</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Four places to measure the Bookshelf launch</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#EEF2FF">
    <rect x="20" y="50" width="170" height="64" rx="8"/><rect x="205" y="50" width="170" height="64" rx="8"/><rect x="390" y="50" width="170" height="64" rx="8"/><rect x="575" y="50" width="165" height="64" rx="8"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text x="105" y="76">Design analytics</text><text x="290" y="76">Website insights</text><text x="475" y="76">Social post insights</text><text x="657" y="76">Canva Grow Learn</text>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="105" y="95">Analytics, top menu</text><text x="290" y="95">Analytics, published site</text><text x="475" y="95">Insights, Content Planner</text><text x="657" y="95">Grow, then Learn</text>
  </g>
  <g fill="none" stroke="#4B5563" stroke-width="1.5">
    <path d="M105,114 L105,140" marker-end="url(#ah)"/><path d="M290,114 L290,140" marker-end="url(#ah)"/><path d="M475,114 L475,140" marker-end="url(#ah)"/><path d="M657,114 L657,140" marker-end="url(#ah)"/>
  </g>
  <g stroke="#9CA3AF" fill="#FFFFFF">
    <rect x="20" y="142" width="170" height="104" rx="6"/><rect x="205" y="142" width="170" height="104" rx="6"/><rect x="390" y="142" width="170" height="104" rx="6"/><rect x="575" y="142" width="165" height="104" rx="6"/>
  </g>
  <g font-size="11" fill="#374151">
    <text x="30" y="164">Visits and visitors</text><text x="30" y="182">Time spent per page</text><text x="30" y="200">Public view links</text><text x="30" y="218">Poll and quiz answers</text>
    <text x="215" y="164">Visits per page</text><text x="215" y="182">Country and device</text><text x="215" y="200">Traffic sources</text><text x="215" y="218">Link clicks</text>
    <text x="400" y="164">Impressions</text><text x="400" y="182">Clicks</text><text x="400" y="200">Reactions</text><text x="400" y="218">Engagements</text>
    <text x="585" y="164">ROAS, CPM, impressions</text><text x="585" y="182">Hook, click, convert</text><text x="585" y="200">Winner and scaling ads</text><text x="585" y="218">Saved reports</text>
  </g>
  <g font-size="12" fill="#92400E" text-anchor="middle" font-weight="bold">
    <rect x="20" y="262" width="170" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="105" y="287">Who looked at a design?</text>
    <rect x="205" y="262" width="170" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="290" y="287">Who came to the site?</text>
    <rect x="390" y="262" width="170" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="475" y="287">Did the post land?</text>
    <rect x="575" y="262" width="165" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="657" y="287">Which paid ad wins?</text>
  </g>
  <text x="380" y="342" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of generic measurement tools, not a screenshot of any product.</text>
</svg>
