<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="mpf-title mpf-desc">
  <title id="mpf-title">Base MATLAB, add-on products and Simulink</title>
  <desc id="mpf-desc">Three layers. At the bottom, base MATLAB: the language, the desktop, the core math and graphics libraries and the interfaces to other languages. This is the scope of this section. Above it, add-on products (toolboxes, now also distributed as packages) that depend on base MATLAB and are only listed on one overview page. Beside them, Simulink and its own add-ons, also only listed.</desc>
  <rect x="0" y="0" width="960" height="440" rx="12" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">The MATLAB product family and the scope of this section</text>

  <rect x="30" y="64" width="560" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#78350f">Add-on products (toolboxes)</text>
  <text x="50" y="120" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#78350f">Statistics and Machine Learning, Deep Learning, Signal Processing,</text>
  <text x="50" y="142" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#78350f">Image Processing, Optimization, Parallel Computing, and many more</text>
  <text x="50" y="170" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#92400e">Listed on one overview page, not documented here</text>

  <rect x="620" y="64" width="310" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="640" y="94" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#78350f">Simulink</text>
  <text x="640" y="120" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#78350f">Block-diagram modelling and its own</text>
  <text x="640" y="142" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#78350f">add-on products</text>
  <text x="640" y="170" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#92400e">Listed only, not documented here</text>

  <path d="M 310 240 L 310 190" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M 304 198 L 310 188 L 316 198 z" fill="#334155"/>
  <path d="M 775 240 L 775 190" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M 769 198 L 775 188 L 781 198 z" fill="#334155"/>
  <text x="326" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">build on</text>
  <text x="791" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">build on</text>

  <rect x="30" y="246" width="900" height="160" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="50" y="278" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#14532d">Base MATLAB: the scope of this section</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#14532d">
    <text x="50" y="312">The language: arrays, types, functions, classes</text>
    <text x="50" y="338">Desktop, Editor, Live Editor, App Designer</text>
    <text x="50" y="364">Testing (matlab.unittest) and build tools (buildtool)</text>
    <text x="500" y="312">Graphics and data import and export</text>
    <text x="500" y="338">Linear algebra, sparse matrices, ODEs, optimization</text>
    <text x="500" y="364">Python, C and C++, Java and .NET interfaces</text>
  </g>
  <text x="50" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#166534">Every example in this section needs base MATLAB only</text>
</svg>
