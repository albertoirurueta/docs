<svg viewBox="0 0 760 325" width="760" height="325" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="325" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Mono and IL2CPP: from C# to running code</text>
<text x="380" y="55" text-anchor="middle" font-size="12" fill="#4B5563">Both start with the C# compiler producing IL assemblies</text>
<rect x="30" y="70" width="120" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="90.0" y="91.7" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">C# scripts</text>
<text x="90.0" y="106.7" text-anchor="middle" font-size="12" fill="#374151">.cs</text>
<rect x="190" y="70" width="120" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="250.0" y="91.7" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">IL assemblies</text>
<text x="250.0" y="106.7" text-anchor="middle" font-size="12" fill="#374151">.dll</text>
<line x1="150" y1="95" x2="190" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<text x="380" y="150" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Mono (JIT)</text>
<rect x="30" y="160" width="150" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="105.0" y="182.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Mono runtime</text>
<text x="105.0" y="196.8" text-anchor="middle" font-size="11" fill="#92400E">in the player</text>
<rect x="215" y="160" width="170" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="300.0" y="182.8" text-anchor="middle" font-size="11" fill="#92400E">JIT compiles IL</text>
<text x="300.0" y="196.8" text-anchor="middle" font-size="11" fill="#92400E">to machine code at run time</text>
<rect x="420" y="160" width="150" height="52" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="495.0" y="182.8" text-anchor="middle" font-size="11" fill="#92400E">Fast iteration</text>
<text x="495.0" y="196.8" text-anchor="middle" font-size="11" fill="#92400E">smaller build step</text>
<line x1="180" y1="186" x2="215" y2="186" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<line x1="385" y1="186" x2="420" y2="186" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<text x="380" y="245" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">IL2CPP (AOT)</text>
<rect x="30" y="255" width="150" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="277.9" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">IL2CPP converts</text>
<text x="105.0" y="291.9" text-anchor="middle" font-size="11" fill="#3730A3">IL to C++</text>
<rect x="215" y="255" width="170" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="300.0" y="277.9" text-anchor="middle" font-size="11" fill="#3730A3">Native C++ compiler</text>
<text x="300.0" y="291.9" text-anchor="middle" font-size="11" fill="#3730A3">builds machine code</text>
<rect x="420" y="255" width="170" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="505.0" y="277.9" text-anchor="middle" font-size="11" fill="#3730A3">Native binary plus</text>
<text x="505.0" y="291.9" text-anchor="middle" font-size="11" fill="#3730A3">C# metadata, no JIT</text>
<line x1="180" y1="281" x2="215" y2="281" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<line x1="385" y1="281" x2="420" y2="281" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah3)"/>
<path d="M250,120 L250,135 L105,135 L105,160" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah3)"/>
<path d="M250,120 L250,240 L105,240 L105,255" fill="none" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#ah3)"/>
<rect x="610" y="160" width="125" height="52" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="672.5" y="183.0" text-anchor="middle" font-size="10" fill="#374151">Desktop and Editor</text>
<text x="672.5" y="196.0" text-anchor="middle" font-size="10" fill="#374151">(Mono allowed)</text>
<rect x="610" y="255" width="125" height="52" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="672.5" y="278.0" text-anchor="middle" font-size="10" fill="#374151">iOS, Web, consoles</text>
<text x="672.5" y="291.0" text-anchor="middle" font-size="10" fill="#374151">(IL2CPP required)</text>
</svg>
