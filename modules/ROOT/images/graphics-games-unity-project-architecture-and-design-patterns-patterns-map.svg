<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-arch-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Which pattern solves which Bookshelf problem</text>
<rect x="20" y="50" width="350" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="70.0" text-anchor="middle" font-size="11" fill="#3730A3">Many things must react to a catch</text>
<text x="195.0" y="85.0" text-anchor="middle" font-size="11" fill="#3730A3">-&gt; Observer, event channel, event bus</text>
<rect x="390" y="50" width="350" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="70.0" text-anchor="middle" font-size="11" fill="#3730A3">Shelf modes: playing, paused, game over</text>
<text x="565.0" y="85.0" text-anchor="middle" font-size="11" fill="#3730A3">-&gt; State</text>
<rect x="20" y="108" width="350" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="128.0" text-anchor="middle" font-size="11" fill="#3730A3">Undo the last shelf move in the editor</text>
<text x="195.0" y="143.0" text-anchor="middle" font-size="11" fill="#3730A3">-&gt; Command</text>
<rect x="390" y="108" width="350" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="128.0" text-anchor="middle" font-size="11" fill="#3730A3">Choose how books fall: gravity, wind, wobble</text>
<text x="565.0" y="143.0" text-anchor="middle" font-size="11" fill="#3730A3">-&gt; Strategy</text>
<rect x="20" y="166" width="350" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="186.0" text-anchor="middle" font-size="11" fill="#3730A3">Stack bonuses: double points, slow motion</text>
<text x="195.0" y="201.0" text-anchor="middle" font-size="11" fill="#3730A3">-&gt; Decorator</text>
<rect x="390" y="166" width="350" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="186.0" text-anchor="middle" font-size="11" fill="#3730A3">Replay and tools walk every book type</text>
<text x="565.0" y="201.0" text-anchor="middle" font-size="11" fill="#3730A3">-&gt; Visitor</text>
<rect x="20" y="224" width="350" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="244.0" text-anchor="middle" font-size="11" fill="#1F2937">One call to start a round</text>
<text x="195.0" y="259.0" text-anchor="middle" font-size="11" fill="#1F2937">-&gt; Facade</text>
<rect x="390" y="224" width="350" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="244.0" text-anchor="middle" font-size="11" fill="#1F2937">Wrap a platform SDK behind our interface</text>
<text x="565.0" y="259.0" text-anchor="middle" font-size="11" fill="#1F2937">-&gt; Adapter</text>
<rect x="20" y="282" width="350" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="302.0" text-anchor="middle" font-size="11" fill="#92400E">Find the books near the lamp quickly</text>
<text x="195.0" y="317.0" text-anchor="middle" font-size="11" fill="#92400E">-&gt; Spatial partition</text>
<rect x="390" y="282" width="350" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="302.0" text-anchor="middle" font-size="11" fill="#92400E">Reuse falling books without GC spikes</text>
<text x="565.0" y="317.0" text-anchor="middle" font-size="11" fill="#92400E">-&gt; Object pool</text>
<rect x="20" y="340" width="350" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="360.0" text-anchor="middle" font-size="11" fill="#374151">Find the audio or save service</text>
<text x="195.0" y="375.0" text-anchor="middle" font-size="11" fill="#374151">-&gt; Service locator (use sparingly)</text>
<rect x="390" y="340" width="350" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="360.0" text-anchor="middle" font-size="11" fill="#1F2937">Keep HUD logic out of the view</text>
<text x="565.0" y="375.0" text-anchor="middle" font-size="11" fill="#1F2937">-&gt; MVP / MVVM</text>
<text x="380" y="402" text-anchor="middle" font-size="11" fill="#374151">Blue: behaviour. Green: structure and presentation. Amber: performance. Grey: use with caution.</text>
</svg>
