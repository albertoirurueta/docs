<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">float w[3] and vec3 v[2] under std140 and std430</text>
<text x="20" y="56" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">std140: float w[3]  (array stride 16, 48 bytes)</text>
<rect x="20" y="66" width="57" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="48.5" y="84.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">w[0]</text>
<rect x="80" y="66" width="177" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="168.5" y="84.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">pad</text>
<rect x="260" y="66" width="57" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="288.5" y="84.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">w[1]</text>
<rect x="320" y="66" width="177" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="408.5" y="84.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">pad</text>
<rect x="500" y="66" width="57" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="528.5" y="84.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">w[2]</text>
<text x="20" y="114" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">scalars in an array are padded to vec4 size: three floats take 36 to 48 bytes</text>
<text x="20" y="140" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">std430: float w[3]  (array stride 4, 12 bytes)</text>
<rect x="20" y="150" width="57" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="48.5" y="168.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">w[0]</text>
<rect x="80" y="150" width="57" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="108.5" y="168.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">w[1]</text>
<rect x="140" y="150" width="57" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="168.5" y="168.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">w[2]</text>
<text x="20" y="198" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">tightly packed, like the C++ array float w[3]</text>
<text x="20" y="224" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="start">std140 and std430: vec3 v[2]  (stride 16 in both)</text>
<rect x="20" y="234" width="177" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="108.5" y="252.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">v[0].xyz</text>
<rect x="200" y="234" width="57" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="228.5" y="252.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">pad</text>
<rect x="260" y="234" width="177" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="348.5" y="252.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">v[1].xyz</text>
<rect x="440" y="234" width="57" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="468.5" y="252.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">pad</text>
<text x="20" y="282" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">vec3 always occupies a 16-byte slot in arrays; prefer vec4 on the CPU side</text>
<rect x="20" y="316" width="720" height="84" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="34" y="338" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">std430 is allowed for shader storage blocks (GLSL 4.30, ES 3.1). Uniform blocks stay std140 (or shared / packed).</text>
<text x="34" y="354" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">Difference in one line: std430 does not round array strides and struct alignment up to vec4.</text>
<text x="34" y="370" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">Matrices follow the array rule: a mat3 is three vec3 columns (stride 16 in both), a mat2 is two vec2 columns (std140: stride 16, std430: stride 8).</text>
</svg>
