<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dsb-blend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The per-fragment tests and the blend equation</text>
<rect x="20" y="60" width="120" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="80" y="86" text-anchor="middle" font-size="12" fill="#374151">Fragment</text>
<text x="80" y="104" text-anchor="middle" font-size="12" fill="#374151">shader</text>
<rect x="175" y="60" width="120" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="235" y="86" text-anchor="middle" font-size="12" fill="#92400E">Stencil test</text>
<text x="235" y="104" text-anchor="middle" font-size="11" fill="#92400E">ref, mask, op</text>
<rect x="330" y="60" width="120" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="390" y="86" text-anchor="middle" font-size="12" fill="#92400E">Depth test</text>
<text x="390" y="104" text-anchor="middle" font-size="11" fill="#92400E">compare op</text>
<rect x="485" y="60" width="120" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="545" y="86" text-anchor="middle" font-size="12" fill="#3730A3">Blend</text>
<text x="545" y="104" text-anchor="middle" font-size="11" fill="#3730A3">per attachment</text>
<rect x="640" y="60" width="100" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="690" y="86" text-anchor="middle" font-size="12" fill="#065F46">Color write</text>
<text x="690" y="104" text-anchor="middle" font-size="11" fill="#065F46">mask</text>
<line x1="140" y1="90" x2="173" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dsb-blend)"/>
<line x1="295" y1="90" x2="328" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dsb-blend)"/>
<line x1="450" y1="90" x2="483" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dsb-blend)"/>
<line x1="605" y1="90" x2="638" y2="90" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dsb-blend)"/>
<text x="380" y="148" text-anchor="middle" font-size="11" fill="#6B7280">The fixed-function order is stencil, then depth; early tests may run before the fragment shader when the shader allows it.</text>
<rect x="20" y="170" width="720" height="140" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="380" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730A3">Alpha blending of a translucent lamp glass (straight alpha)</text>
<text x="380" y="224" text-anchor="middle" font-size="13" fill="#1F2937">rgb = src.rgb x srcColorFactor  (op)  dst.rgb x dstColorFactor</text>
<text x="380" y="248" text-anchor="middle" font-size="12" fill="#374151">srcColorFactor = SRC_ALPHA, dstColorFactor = ONE_MINUS_SRC_ALPHA, colorBlendOp = ADD</text>
<text x="380" y="270" text-anchor="middle" font-size="12" fill="#374151">srcAlphaFactor = ONE, dstAlphaFactor = ONE_MINUS_SRC_ALPHA, alphaBlendOp = ADD</text>
<text x="380" y="294" text-anchor="middle" font-size="11" fill="#6B7280">Premultiplied alpha: srcColorFactor = ONE</text>
</svg>
