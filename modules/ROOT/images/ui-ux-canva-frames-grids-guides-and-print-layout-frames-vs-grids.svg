<text x="650" y="214" font-size="12" fill="#374151" text-anchor="middle">Equal tiles, wide gap</text>
<text x="560" y="246" font-size="12" fill="#374151" text-anchor="middle">Click one cell, then add a photo; each cell is cropped</text>
<text x="560" y="262" font-size="12" fill="#374151" text-anchor="middle">to its own space. Spacing slider widens or narrows gaps.</text>
