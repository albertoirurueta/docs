<svg viewBox="0 0 920 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="640" fill="#ffffff"/>
  <text x="460" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two orthogonal axes: primary factor and additional layer</text>
  <text x="460" y="45" font-size="11" fill="#666666" text-anchor="middle">2FA/MFA is the vertical axis -- a layer stacked on whatever the horizontal axis already chose, never a peer of it</text>

  <!-- Axes -->
  <line x1="170" y1="580" x2="880" y2="580" stroke="#9a9a9a" stroke-width="2"/>
  <line x1="170" y1="580" x2="170" y2="90" stroke="#9a9a9a" stroke-width="2"/>
  <text x="525" y="605" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">primary factor -- what identifies the user in the first place</text>
  <text x="60" y="335" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle" transform="rotate(-90 60 335)">additional layer -- stacked on top, optional</text>

  <!-- Column headers -->
  <text x="330" y="70" font-size="12.5" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Password</text>
  <text x="700" y="70" font-size="12.5" font-weight="bold" fill="#2d6a34" text-anchor="middle">Passwordless primary method</text>
  <text x="700" y="86" font-size="9.5" fill="#2d6a34" text-anchor="middle">email OTP, magic link, SMS OTP, push, passkey, device-bound, federated, mTLS</text>

  <!-- Row headers -->
  <text x="175" y="500" font-size="11" fill="#333333" text-anchor="start">None</text>
  <text x="175" y="220" font-size="11" fill="#333333" text-anchor="start">+ second factor</text>
  <text x="175" y="234" font-size="9" fill="#666666" text-anchor="start">TOTP/HOTP, OTP, push,</text>
  <text x="175" y="246" font-size="9" fill="#666666" text-anchor="start">hardware token, passkey-as-2FA</text>

  <!-- Quadrant boundaries -->
  <line x1="525" y1="90" x2="525" y2="580" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="170" y1="335" x2="880" y2="335" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Q1: bottom-left, password alone -->
  <rect x="195" y="400" width="300" height="150" fill="#fbecec" stroke="#a33" stroke-width="1.4"/>
  <text x="345" y="425" font-size="12" font-weight="bold" fill="#a33" text-anchor="middle">1. Password alone</text>
  <text x="345" y="445" font-size="10" fill="#333333" text-anchor="middle">Weakest combination.</text>
  <text x="345" y="460" font-size="10" fill="#333333" text-anchor="middle">Single knowledge factor,</text>
  <text x="345" y="475" font-size="10" fill="#333333" text-anchor="middle">phishable, reusable if leaked.</text>
  <text x="345" y="495" font-size="10" fill="#a33" text-anchor="middle" font-weight="bold">passwordless: no</text>
  <text x="345" y="510" font-size="10" fill="#a33" text-anchor="middle" font-weight="bold">phishing-resistant: no</text>

  <!-- Q2: top-left, password + layer -->
  <rect x="195" y="120" width="300" height="150" fill="#f7f0e6" stroke="#8a5a1c" stroke-width="1.4"/>
  <text x="345" y="145" font-size="12" font-weight="bold" fill="#8a5a1c" text-anchor="middle">2. Password + second factor</text>
  <text x="345" y="165" font-size="10" fill="#333333" text-anchor="middle">A hardened password login --</text>
  <text x="345" y="180" font-size="10" fill="#333333" text-anchor="middle">the layer adds possession or</text>
  <text x="345" y="195" font-size="10" fill="#333333" text-anchor="middle">inherence, the password stays.</text>
  <text x="345" y="215" font-size="10" fill="#a33" text-anchor="middle" font-weight="bold">passwordless: NO</text>
  <text x="345" y="230" font-size="10" fill="#333333" text-anchor="middle">phishing-resistant: only with</text>
  <text x="345" y="245" font-size="10" fill="#333333" text-anchor="middle">a passkey-as-2FA layer</text>

  <!-- Q3: bottom-right, passwordless alone -->
  <rect x="565" y="400" width="290" height="150" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="710" y="425" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">3. Passwordless primary alone</text>
  <text x="710" y="445" font-size="10" fill="#333333" text-anchor="middle">No password anywhere in the</text>
  <text x="710" y="460" font-size="10" fill="#333333" text-anchor="middle">exchange. Strength depends on</text>
  <text x="710" y="475" font-size="10" fill="#333333" text-anchor="middle">which method (see Task 26.3/26.5).</text>
  <text x="710" y="495" font-size="10" fill="#2d6a34" text-anchor="middle" font-weight="bold">passwordless: yes</text>
  <text x="710" y="510" font-size="10" fill="#333333" text-anchor="middle">phishing-resistant: method-dependent</text>

  <!-- Q4: top-right, passwordless + layer -->
  <rect x="565" y="120" width="290" height="150" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="710" y="145" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">4. Passwordless + second factor</text>
  <text x="710" y="165" font-size="10" fill="#333333" text-anchor="middle">e.g. passkey + one-time token.</text>
  <text x="710" y="180" font-size="10" fill="#333333" text-anchor="middle">Passwordless AND multi-factor --</text>
  <text x="710" y="195" font-size="10" fill="#333333" text-anchor="middle">the strongest cell in the grid.</text>
  <text x="710" y="215" font-size="10" fill="#1c4b73" text-anchor="middle" font-weight="bold">passwordless: yes</text>
  <text x="710" y="230" font-size="10" fill="#1c4b73" text-anchor="middle" font-weight="bold">phishing-resistant: yes</text>

  <!-- Arrow hint -->
  <line x1="345" y1="395" x2="345" y2="275" stroke="#666666" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="360" y="335" font-size="9" fill="#666666" text-anchor="start">add a layer</text>
  <line x1="710" y1="395" x2="710" y2="275" stroke="#666666" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="725" y="335" font-size="9" fill="#666666" text-anchor="start">add a layer</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="170" y="590" width="710" height="42" fill="#fbecec" stroke="#a33" stroke-width="1"/>
  <text x="525" y="606" font-size="10.5" fill="#a33" text-anchor="middle" font-weight="bold">TOTP/HOTP, OTP-as-2FA, push-as-2FA, hardware tokens and passkey-as-2FA live ONLY on the vertical axis</text>
  <text x="525" y="620" font-size="10" fill="#333333" text-anchor="middle">they never appear as a column heading -- 2FA/MFA is never a primary method in its own right</text>
</svg>
