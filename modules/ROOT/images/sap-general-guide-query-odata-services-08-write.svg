<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 255" width="1080" height="255" role="img" aria-labelledby="sap-general-guide-query-odata-services-08-write-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-general-guide-query-odata-services-08-write-title">Terminal with two curl commands: the POST of http/new-claim.json answers HTTP 201 Created with the location Claims(13) and the new claim Hotel Lisbon with the status N and its item (callout 14), and the PATCH answers HTTP 200 OK with the status A (callout 15); the long answers wrap onto a second line</title>
<g><rect x="0" y="0" width="1080" height="255" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="223" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -i --json @http/new-claim.json 'http://localhost:4004/odata/v4/query/Claims'</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">HTTP/1.1 201 Created</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">location: Claims(13)</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Claims/$entity&quot;,&quot;ID&quot;:13,&quot;title&quot;:&quot;Hotel Lisbon&quot;,&quot;status&quot;:&quot;N&quot;,&quot;amount&quot;:&quot;120.00&quot;,&quot;claimDate&quot;</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">:&quot;2026-03-30&quot;,&quot;items&quot;:[{&quot;ID&quot;:109,&quot;claim_ID&quot;:13,&quot;category&quot;:&quot;Room&quot;,&quot;amount&quot;:&quot;120.00&quot;}]}</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -i -X PATCH --json '{&quot;status&quot;:&quot;A&quot;}' 'http://localhost:4004/odata/v4/query/Claims(13)'</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">HTTP/1.1 200 OK</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;@odata.context&quot;:&quot;$metadata#Claims/$entity&quot;,&quot;ID&quot;:13,&quot;title&quot;:&quot;Hotel Lisbon&quot;,&quot;status&quot;:&quot;A&quot;,&quot;amount&quot;:&quot;120.00&quot;,&quot;claimDate&quot;</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">:&quot;2026-03-30&quot;}</text>
<rect x="5" y="46" width="1042" height="107" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">14</text></g>
<rect x="5" y="151" width="1042" height="86" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="151" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="156" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">15</text></g></g>
</svg>
