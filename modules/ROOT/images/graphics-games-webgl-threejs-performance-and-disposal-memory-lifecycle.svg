<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-perf-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Who owns what: the lifecycle of GPU resources in three.js</text>
<rect x="20" y="56" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="82.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">JS object</text>
<text x="95.0" y="97.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Mesh in the scene</text>
<rect x="20" y="150" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="176.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Geometry</text>
<text x="95.0" y="191.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">BufferGeometry</text>
<rect x="20" y="244" width="150" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="270.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Material</text>
<text x="95.0" y="285.5" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">+ its textures</text>
<line x1="95" y1="116" x2="95" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-life)"/>
<line x1="95" y1="210" x2="95" y2="244" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-life)"/>
<rect x="310" y="150" width="170" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="395.0" y="176.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">GPU buffers</text>
<text x="395.0" y="191.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">uploaded on first render</text>
<rect x="310" y="244" width="170" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="395.0" y="270.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">GPU textures,</text>
<text x="395.0" y="285.5" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">programs, targets</text>
<line x1="170" y1="180" x2="310" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-life)"/>
<text x="240" y="172" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">first render</text>
<line x1="170" y1="274" x2="310" y2="274" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-life)"/>
<text x="240" y="266" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">first render</text>
<rect x="560" y="56" width="180" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="650.0" y="82.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">scene.remove(mesh)</text>
<text x="650.0" y="97.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">JS reference dropped</text>
<rect x="560" y="150" width="180" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="176.5" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">geometry.dispose()</text>
<text x="650.0" y="191.5" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">frees the buffers</text>
<rect x="560" y="244" width="180" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="270.5" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">material.dispose()</text>
<text x="650.0" y="285.5" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">texture.dispose()</text>
<line x1="650" y1="116" x2="650" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-life)"/>
<line x1="650" y1="210" x2="650" y2="244" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-life)"/>
<line x1="560" y1="180" x2="480" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-life)"/>
<line x1="560" y1="274" x2="480" y2="274" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-perf-life)"/>
<text x="380" y="334" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">remove() only detaches the object. Textures referenced by a material are not freed by material.dispose().</text>
<text x="380" y="352" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">After dispose() the object is still usable: the next render uploads it again.</text>
<text x="380" y="376" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">renderer.info.memory.geometries and .textures should return to the baseline after cleanup.</text>
</svg>
