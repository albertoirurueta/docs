<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">What bin/magento setup:upgrade does to the database, in order</title>
  <desc id="d">Two rows of steps. Schema row: first the declarative schema of all modules is compared with the database and changed, then for each module the legacy InstallSchema and UpgradeSchema scripts run, then the module's schema patches, then the recurring schema scripts. Data row: for each module the legacy InstallData and UpgradeData scripts run, then the data patches, then the recurring data scripts. Below, two bookkeeping tables are shown: patch_list stores the applied patch class names and setup_module stores the versions used by legacy scripts. A side note says db_schema_whitelist.json decides whether a column, index or constraint may be dropped or changed.</desc>
  <rect x="0" y="0" width="960" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4b860"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#f2f5f8">setup:upgrade: declarative schema first, then patches, then data</text>

  <g font-size="12.5" fill="#f2f5f8">
    <text x="40" y="66" font-weight="bold" font-size="14" fill="#f4b860">Schema stage</text>
    <rect x="40" y="76" width="200" height="120" rx="8" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
    <text x="52" y="98" font-weight="bold">1  Declarative schema</text>
    <text x="52" y="120">db_schema.xml of all</text><text x="52" y="136">enabled modules merged,</text><text x="52" y="152">diffed with the database,</text><text x="52" y="168">atomic ALTER statements</text><text x="52" y="184" fill="#f4b860">no version involved</text>

    <rect x="270" y="76" width="200" height="120" rx="8" fill="#3d5266"/>
    <text x="282" y="98" font-weight="bold">2  Legacy scripts</text>
    <text x="282" y="120">per module, only if</text><text x="282" y="136">module.xml has</text><text x="282" y="152">setup_version:</text><text x="282" y="168">InstallSchema,</text><text x="282" y="184">UpgradeSchema</text>

    <rect x="500" y="76" width="200" height="120" rx="8" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
    <text x="512" y="98" font-weight="bold">3  Schema patches</text>
    <text x="512" y="120">Setup/Patch/Schema,</text><text x="512" y="136">dependencies first,</text><text x="512" y="152">once per database:</text><text x="512" y="168">views, triggers,</text><text x="512" y="184">renames, partitions</text>

    <rect x="730" y="76" width="190" height="120" rx="8" fill="#3d5266"/>
    <text x="742" y="98" font-weight="bold">4  Recurring schema</text>
    <text x="742" y="120">Setup/Recurring.php</text><text x="742" y="136">runs on every</text><text x="742" y="152">setup:upgrade</text>

    <text x="40" y="236" font-weight="bold" font-size="14" fill="#f4b860">Data stage</text>
    <rect x="270" y="246" width="200" height="104" rx="8" fill="#3d5266"/>
    <text x="282" y="268" font-weight="bold">5  Legacy scripts</text>
    <text x="282" y="290">InstallData,</text><text x="282" y="306">UpgradeData, same</text><text x="282" y="322">version check as step 2</text>

    <rect x="500" y="246" width="200" height="104" rx="8" fill="#3d5266" stroke="#f4b860" stroke-width="2"/>
    <text x="512" y="268" font-weight="bold">6  Data patches</text>
    <text x="512" y="290">Setup/Patch/Data,</text><text x="512" y="306">dependencies first,</text><text x="512" y="322">once per database</text>

    <rect x="730" y="246" width="190" height="104" rx="8" fill="#3d5266"/>
    <text x="742" y="268" font-weight="bold">7  Recurring data</text>
    <text x="742" y="290">Setup/RecurringData.php</text><text x="742" y="306">runs on every</text><text x="742" y="322">setup:upgrade</text>
  </g>

  <g stroke="#f4b860" stroke-width="2" fill="none">
    <path d="M240 136 L268 136" marker-end="url(#a)"/>
    <path d="M470 136 L498 136" marker-end="url(#a)"/>
    <path d="M700 136 L728 136" marker-end="url(#a)"/>
    <path d="M825 196 L825 222 L160 222 L160 298 L268 298" marker-end="url(#a)"/>
    <path d="M470 298 L498 298" marker-end="url(#a)"/>
    <path d="M700 298 L728 298" marker-end="url(#a)"/>
  </g>

  <g font-size="12.5" fill="#f2f5f8">
    <rect x="40" y="380" width="430" height="150" rx="8" fill="#33485c" stroke="#9fd3c7" stroke-width="1.5"/>
    <text x="54" y="404" font-weight="bold" font-size="14" fill="#9fd3c7">What the database remembers</text>
    <text x="54" y="428">patch_list: one row per applied patch class</text>
    <text x="54" y="446">(patch_id, patch_name). A patch listed there never runs again.</text>
    <text x="54" y="474">setup_module: schema_version and data_version, used only by</text>
    <text x="54" y="492">the legacy scripts of modules that declare setup_version.</text>
    <text x="54" y="516">db_schema.xml has no table of its own: the database is the state.</text>

    <rect x="500" y="380" width="420" height="150" rx="8" fill="#33485c" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="514" y="404" font-weight="bold" font-size="14" fill="#f4b860">The whitelist gates removals</text>
    <text x="514" y="428">Adding a table or column needs no whitelist. Dropping or</text>
    <text x="514" y="446">changing something that was removed from db_schema.xml is</text>
    <text x="514" y="464">allowed only if db_schema_whitelist.json lists it, so generate</text>
    <text x="514" y="482">the file while the element still exists in the XML:</text>
    <text x="514" y="506" font-family="Menlo, Consolas, monospace" font-size="11.5">setup:db-declaration:generate-whitelist --module-name=...</text>
  </g>
</svg>
