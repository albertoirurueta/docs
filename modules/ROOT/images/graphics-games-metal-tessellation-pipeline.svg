<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-tessellation-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The tessellation pipeline in Metal</text>
<rect x="20" y="90" width="128" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="84.0" y="124.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Compute kernel</text>
<text x="84.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">writes factors</text>
<text x="84.0" y="152.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">(optional)</text>
<line x1="148" y1="135" x2="168" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-tessellation-pipeline)"/>
<rect x="168" y="90" width="128" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="232.0" y="124.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Control points</text>
<text x="232.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">fetched with</text>
<text x="232.0" y="152.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">stage_in</text>
<line x1="296" y1="135" x2="316" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-tessellation-pipeline)"/>
<rect x="316" y="90" width="128" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="124.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Tessellator</text>
<text x="380.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">fixed function</text>
<text x="380.0" y="152.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">builds (u, v) grid</text>
<line x1="444" y1="135" x2="464" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-tessellation-pipeline)"/>
<rect x="464" y="90" width="128" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="528.0" y="124.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Post-tessellation</text>
<text x="528.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex function</text>
<text x="528.0" y="152.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">position, displace</text>
<line x1="592" y1="135" x2="612" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-tessellation-pipeline)"/>
<rect x="612" y="90" width="128" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="676.0" y="124.85" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Rasteriser</text>
<text x="676.0" y="138.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">and fragment</text>
<text x="676.0" y="152.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">stages</text>
<rect x="20" y="220" width="300" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="170.0" y="251.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Tessellation factor buffer: half-precision edge</text>
<text x="170.0" y="265.85" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">and inside factors, one struct per patch</text>
<line x1="84" y1="180" x2="84" y2="220" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-metal-tessellation-pipeline)" stroke-dasharray="4 3"/>
<line x1="320" y1="255" x2="455" y2="255" stroke="#4B5563" stroke-width="1.5"/>
<line x1="455" y1="255" x2="455" y2="182" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-tessellation-pipeline)"/>
<rect x="380" y="220" width="360" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560.0" y="251.85" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Pipeline state: partition mode, max factor, step</text>
<text x="560.0" y="265.85" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">function, winding order, control point index type</text>
<text x="380" y="318" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Dashed arrow: the factor buffer is filled on the GPU before the render pass, or set to constants.</text>
</svg>
