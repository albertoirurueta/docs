<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img">
<title>Box plot with IQR fences</title>
<desc>A horizontal box plot showing Q1, median and Q3, whiskers, the fences at 1.5 times the interquartile range, and four flagged points beyond the fences.</desc>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="start">Outlier fences on a box plot</text>
<line x1="50.0" y1="230" x2="670.0" y2="230" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="50.0" y1="230" x2="50.0" y2="236" stroke="#94A3B8" stroke-width="1.5"/>
<text x="50.0" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">-20</text>
<line x1="132.66666666666669" y1="230" x2="132.66666666666669" y2="236" stroke="#94A3B8" stroke-width="1.5"/>
<text x="132.66666666666669" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">0</text>
<line x1="215.33333333333334" y1="230" x2="215.33333333333334" y2="236" stroke="#94A3B8" stroke-width="1.5"/>
<text x="215.33333333333334" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">20</text>
<line x1="298.0" y1="230" x2="298.0" y2="236" stroke="#94A3B8" stroke-width="1.5"/>
<text x="298.0" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">40</text>
<line x1="380.6666666666667" y1="230" x2="380.6666666666667" y2="236" stroke="#94A3B8" stroke-width="1.5"/>
<text x="380.6666666666667" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">60</text>
<line x1="463.3333333333333" y1="230" x2="463.3333333333333" y2="236" stroke="#94A3B8" stroke-width="1.5"/>
<text x="463.3333333333333" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">80</text>
<line x1="546.0" y1="230" x2="546.0" y2="236" stroke="#94A3B8" stroke-width="1.5"/>
<text x="546.0" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">100</text>
<line x1="628.6666666666666" y1="230" x2="628.6666666666666" y2="236" stroke="#94A3B8" stroke-width="1.5"/>
<text x="628.6666666666666" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">120</text>
<line x1="293.8666666666667" y1="150" x2="325.73466666666667" y2="150" stroke="#0F766E" stroke-width="2"/>
<line x1="351.03066666666666" y1="150" x2="384.8" y2="150" stroke="#0F766E" stroke-width="2"/>
<line x1="293.8666666666667" y1="136" x2="293.8666666666667" y2="164" stroke="#0F766E" stroke-width="2"/>
<line x1="384.8" y1="136" x2="384.8" y2="164" stroke="#0F766E" stroke-width="2"/>
<rect x="325.73466666666667" y="122" width="25.295999999999992" height="56" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<line x1="338.50666666666666" y1="122" x2="338.50666666666666" y2="178" stroke="#0F766E" stroke-width="2"/>
<line x1="287.79066666666665" y1="80" x2="287.79066666666665" y2="222" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/>
<text x="287.79066666666665" y="72" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#B45309" text-anchor="middle">Q1 - 1.5 IQR</text>
<line x1="388.9746666666666" y1="80" x2="388.9746666666666" y2="222" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4"/>
<text x="388.9746666666666" y="72" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#B45309" text-anchor="middle">Q3 + 1.5 IQR</text>
<circle cx="399.67999999999995" cy="150" r="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<circle cx="525.3333333333334" cy="150" r="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<circle cx="628.6666666666666" cy="150" r="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<circle cx="91.33333333333334" cy="150" r="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="525.3333333333334" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#BE123C" text-anchor="middle">flagged</text>
<text x="338.50666666666666" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">Q1 | median | Q3</text>
<text x="24" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">Fences are a screening rule: a flagged point is a question for the analyst, not an error.</text>
</svg>
