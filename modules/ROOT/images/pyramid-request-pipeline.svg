<svg viewBox="0 0 720 658" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Pyramid request pipeline</title>
  <defs><marker id="prp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">One request through a Pyramid application</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">synchronous WSGI: one thread handles the request from the first box to the last</text>
  <rect x="30" y="70" width="460" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="90" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">WSGI server</text>
  <text x="260.0" y="107" font-size="10.5" fill="currentColor" text-anchor="middle">Waitress, Gunicorn, mod_wsgi: calls the router with (environ, start_response)</text>
  <line x1="260.0" y1="116" x2="260.0" y2="131" stroke="currentColor" stroke-width="1.5" marker-end="url(#prp-arrow)"/>
  <rect x="30" y="132" width="460" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="152" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Router.__call__</text>
  <text x="260.0" y="169" font-size="10.5" fill="currentColor" text-anchor="middle">builds a Request, pushes registry + request on the thread-local stack</text>
  <line x1="260.0" y1="178" x2="260.0" y2="193" stroke="currentColor" stroke-width="1.5" marker-end="url(#prp-arrow)"/>
  <rect x="30" y="194" width="460" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="214" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Tweens (INGRESS ... EXCVIEW ... MAIN)</text>
  <text x="260.0" y="231" font-size="10.5" fill="currentColor" text-anchor="middle">wrap everything below; the excview tween turns exceptions into exception views</text>
  <line x1="260.0" y1="240" x2="260.0" y2="255" stroke="currentColor" stroke-width="1.5" marker-end="url(#prp-arrow)"/>
  <rect x="30" y="256" width="460" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="276" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">NewRequest event, then route mapper (URL dispatch)</text>
  <text x="260.0" y="293" font-size="10.5" fill="currentColor" text-anchor="middle">first matching route sets matchdict and matched_route; BeforeTraversal event</text>
  <line x1="260.0" y1="302" x2="260.0" y2="317" stroke="currentColor" stroke-width="1.5" marker-end="url(#prp-arrow)"/>
  <rect x="30" y="318" width="460" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="338" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Traversal (root factory, __getitem__)</text>
  <text x="260.0" y="355" font-size="10.5" fill="currentColor" text-anchor="middle">produces context, view_name and subpath; ContextFound event</text>
  <line x1="260.0" y1="364" x2="260.0" y2="379" stroke="currentColor" stroke-width="1.5" marker-end="url(#prp-arrow)"/>
  <rect x="30" y="380" width="460" height="46" rx="6" fill="#808080" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="400" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">View lookup, predicates, permission check</text>
  <text x="260.0" y="417" font-size="10.5" fill="currentColor" text-anchor="middle">view derivers wrap the best match; HTTPNotFound / HTTPForbidden if none or denied</text>
  <line x1="260.0" y1="426" x2="260.0" y2="441" stroke="currentColor" stroke-width="1.5" marker-end="url(#prp-arrow)"/>
  <rect x="30" y="442" width="460" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="462" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">View callable</text>
  <text x="260.0" y="479" font-size="10.5" fill="currentColor" text-anchor="middle">your function or method returns a Response or a dict / object</text>
  <line x1="260.0" y1="488" x2="260.0" y2="503" stroke="currentColor" stroke-width="1.5" marker-end="url(#prp-arrow)"/>
  <rect x="30" y="504" width="460" height="46" rx="6" fill="#808080" fill-opacity="0.22" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="524" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Renderer</text>
  <text x="260.0" y="541" font-size="10.5" fill="currentColor" text-anchor="middle">json, string, Jinja2 ... turns the return value into a Response</text>
  <line x1="260.0" y1="550" x2="260.0" y2="565" stroke="currentColor" stroke-width="1.5" marker-end="url(#prp-arrow)"/>
  <rect x="30" y="566" width="460" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="586" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Response callbacks, NewResponse event</text>
  <text x="260.0" y="603" font-size="10.5" fill="currentColor" text-anchor="middle">then the WSGI response goes back to the server; finished callbacks run last</text>
  <rect x="520" y="188" width="170" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="605" y="204" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="middle">Exception views</text>
  <text x="605" y="220" font-size="10" fill="currentColor" text-anchor="middle">an exception raised below</text>
  <text x="605" y="234" font-size="10" fill="currentColor" text-anchor="middle">is caught here and looked up</text>
  <text x="605" y="248" font-size="10" fill="currentColor" text-anchor="middle">as an exception view</text>
  <rect x="520" y="374" width="170" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="605" y="390" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="middle">HTTP exceptions</text>
  <text x="605" y="406" font-size="10" fill="currentColor" text-anchor="middle">Pyramid's own HTTPNotFound</text>
  <text x="605" y="420" font-size="10" fill="currentColor" text-anchor="middle">and HTTPForbidden are Response</text>
  <text x="605" y="434" font-size="10" fill="currentColor" text-anchor="middle">objects, also raised by the router</text>
  <rect x="520" y="560" width="170" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="605" y="576" font-size="11.5" font-weight="bold" fill="currentColor" text-anchor="middle">Callbacks</text>
  <text x="605" y="592" font-size="10" fill="currentColor" text-anchor="middle">add_response_callback runs</text>
  <text x="605" y="606" font-size="10" fill="currentColor" text-anchor="middle">before NewResponse;</text>
  <text x="605" y="620" font-size="10" fill="currentColor" text-anchor="middle">add_finished_callback after</text>
  <line x1="490" y1="217.0" x2="520" y2="217.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="490" y1="403.0" x2="520" y2="403.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="490" y1="589.0" x2="520" y2="589.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
