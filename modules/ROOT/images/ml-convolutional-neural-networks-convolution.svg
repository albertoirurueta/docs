<text x="360.0" y="300" font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A" text-anchor="middle">top-left output = (1+0+2) - (0+3+0) = 0  (left column minus right column)</text>
<text x="360.0" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">output size = floor((n + 2p - k) / s) + 1 = floor((5 + 0 - 3) / 1) + 1 = 3</text>
<text x="360.0" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Stride 1, no padding. The same 9 weights are reused at every position (weight sharing).</text>
