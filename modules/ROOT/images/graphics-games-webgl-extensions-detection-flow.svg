<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-ext-detection-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Feature detection: ask, check, enable, fall back</text>
<rect x="20" y="60" width="175" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="107.5" y="88.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">getSupportedExtensions()</text>
<text x="107.5" y="103.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(list of names)</text>
<rect x="225" y="60" width="140" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="295.0" y="88.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">getExtension(name)</text>
<text x="295.0" y="103.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">(enables it)</text>
<rect x="405" y="60" width="145" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="477.5" y="88.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Result is null?</text>
<text x="477.5" y="103.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">check every time</text>
<rect x="590" y="40" width="150" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="665.0" y="58.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Use ext.method()</text>
<text x="665.0" y="73.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">ext.CONSTANT</text>
<rect x="590" y="100" width="150" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="665.0" y="118.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Fallback path</text>
<text x="665.0" y="133.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">or hide the feature</text>
<line x1="195" y1="92" x2="225" y2="92" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ext-detection-flow)"/>
<line x1="365" y1="92" x2="405" y2="92" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ext-detection-flow)"/>
<line x1="550" y1="80" x2="590" y2="62" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ext-detection-flow)"/>
<line x1="550" y1="104" x2="590" y2="122" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-ext-detection-flow)"/>
<text x="570" y="60" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">no</text>
<text x="570" y="136" font-size="10" font-weight="bold" fill="#92400E" text-anchor="middle">yes</text>
<rect x="20" y="180" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="210.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Listing does not enable anything.</text>
<text x="190.0" y="224.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Symbols added by an extension live on the</text>
<text x="190.0" y="238.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">object returned by getExtension, not on gl.</text>
<text x="190.0" y="252.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Keep that object: the same one is returned</text>
<text x="190.0" y="266.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">while the extension stays enabled.</text>
<rect x="400" y="180" width="340" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570.0" y="210.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">After a context loss every extension is</text>
<text x="570.0" y="224.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">disabled again: call getExtension again</text>
<text x="570.0" y="238.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">for each one and store the new object.</text>
<text x="570.0" y="252.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">WebGL 2 contexts also have extensions that</text>
<text x="570.0" y="266.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">became core: no call needed for those.</text>
<text x="380" y="314" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Optional extensions should degrade gracefully; required ones should stop with a clear message.</text>
</svg>
