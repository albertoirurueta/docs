<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-sep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Monolithic program versus separable programs in a pipeline object</text>
<text x="20" y="56" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="start">Monolithic: one program holds every stage</text>
<rect x="20" y="66" width="340" height="70" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="34" y="80" width="90" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="79.0" y="104.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">vertex</text>
<rect x="145" y="80" width="90" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="104.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">fragment</text>
<text x="246" y="104" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start" font-family="Menlo, Consolas, monospace">glUseProgram(p)</text>
<text x="400" y="56" font-size="13" font-weight="bold" fill="#047857" text-anchor="start">Separable: stages are programs of their own</text>
<rect x="400" y="66" width="340" height="100" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="414" y="86" font-size="11" font-weight="normal" fill="#065F46" text-anchor="start" font-family="Menlo, Consolas, monospace">glBindProgramPipeline(pipe)</text>
<rect x="414" y="98" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="484.0" y="122.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">progVS</text>
<text x="484.0" y="138.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">GL_PROGRAM_SEPARABLE</text>
<rect x="580" y="98" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="650.0" y="122.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">progFS</text>
<text x="650.0" y="138.0" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">GL_PROGRAM_SEPARABLE</text>
<text x="20" y="190" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Use separable programs to mix any vertex shader with any fragment shader without relinking:</text>
<text x="20" y="212" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glUseProgramStages(pipe, GL_VERTEX_SHADER_BIT, progVS);</text>
<text x="20" y="228" font-size="11" font-weight="normal" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, monospace">glUseProgramStages(pipe, GL_FRAGMENT_SHADER_BIT, progFS);</text>
<rect x="20" y="254" width="720" height="68" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="34" y="274" font-size="10.5" font-weight="normal" fill="#92400E" text-anchor="start">Requirements: link each program with glProgramParameteri(p, GL_PROGRAM_SEPARABLE, GL_TRUE); give every interface variable a matching</text>
<text x="34" y="290" font-size="10.5" font-weight="normal" fill="#92400E" text-anchor="start">layout(location); in core profile redeclare the built-in block gl_PerVertex in the vertex stage; set uniforms with glProgramUniform*.</text>
</svg>
