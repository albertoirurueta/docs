<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
<title id="t">Shape flow of a small CIFAR-10 CNN</title>
<desc id="d">A 32 by 32 by 3 image passes through Conv2D with 32 filters giving 30 by 30 by 32, max pooling giving 15 by 15 by 32, Conv2D with 64 filters giving 13 by 13 by 64, max pooling giving 6 by 6 by 64, Conv2D with 64 filters giving 4 by 4 by 64, flatten to 1024 values, a dense layer of 64 units and 10 output logits.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="248" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Shapes through a small CNN (batch axis omitted)</text>
<g font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#0F172A">
<rect x="14" y="70" width="70" height="60" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="49" y="98">image</text><text x="49" y="114">32x32x3</text>
<rect x="102" y="70" width="70" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="137" y="98">Conv 32</text><text x="137" y="114">30x30x32</text>
<rect x="190" y="70" width="70" height="60" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="225" y="98">Pool</text><text x="225" y="114">15x15x32</text>
<rect x="278" y="70" width="70" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="313" y="98">Conv 64</text><text x="313" y="114">13x13x64</text>
<rect x="366" y="70" width="70" height="60" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/><text x="401" y="98">Pool</text><text x="401" y="114">6x6x64</text>
<rect x="454" y="70" width="70" height="60" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="489" y="98">Conv 64</text><text x="489" y="114">4x4x64</text>
<rect x="542" y="70" width="70" height="60" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="577" y="98">Flatten</text><text x="577" y="114">1024</text>
<rect x="630" y="70" width="76" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/><text x="668" y="92">Dense 64</text><text x="668" y="108">then 10</text><text x="668" y="122">logits</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#ar)"><line x1="84" y1="100" x2="100" y2="100"/><line x1="172" y1="100" x2="188" y2="100"/><line x1="260" y1="100" x2="276" y2="100"/><line x1="348" y1="100" x2="364" y2="100"/><line x1="436" y1="100" x2="452" y2="100"/><line x1="524" y1="100" x2="540" y2="100"/><line x1="612" y1="100" x2="628" y2="100"/></g>
<text x="360" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Valid 3x3 convolution: output = input - 2. Pool 2x2: floor(output / 2).</text>
<text x="360" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Spatial size shrinks while channels grow; the final Dense has no softmax (logits).</text>
<text x="360" y="224" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Redrawn from the architecture described in the official CNN tutorial.</text>
</svg>
