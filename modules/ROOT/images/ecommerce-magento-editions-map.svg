<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
<title id="t">What each Magento and Adobe Commerce offering allows</title>
<desc id="d">A matrix of five offerings, Magento Open Source, the Mage-OS distribution, Adobe Commerce on-premises, Adobe Commerce on Cloud and Adobe Commerce as a Cloud Service, against who runs it, whether PHP modules run in-process, whether out-of-process extensibility is available, the storefront options and how updates arrive.</desc>
<text x="480.0" y="26" text-anchor="middle" font-size="16" font-weight="bold">One code lineage, five ways to run it</text>
<rect x="20" y="46" width="146" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.5"/>
<text x="93.0" y="76" text-anchor="middle" font-weight="bold">Offering</text>
<rect x="170" y="46" width="130" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.5"/>
<text x="235.0" y="76" text-anchor="middle" font-weight="bold">Who runs it</text>
<rect x="304" y="46" width="162" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.5"/>
<text x="385.0" y="69" text-anchor="middle" font-weight="bold">PHP modules</text>
<text x="385.0" y="83" text-anchor="middle" font-weight="bold">(in-process)</text>
<rect x="470" y="46" width="156" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.5"/>
<text x="548.0" y="69" text-anchor="middle" font-weight="bold">Out-of-process (App</text>
<text x="548.0" y="83" text-anchor="middle" font-weight="bold">Builder, API Mesh)</text>
<rect x="630" y="46" width="148" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.5"/>
<text x="704.0" y="76" text-anchor="middle" font-weight="bold">Storefront options</text>
<rect x="782" y="46" width="144" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.5"/>
<text x="854.0" y="76" text-anchor="middle" font-weight="bold">Updates and patches</text>
<rect x="20" y="106" width="146" height="80" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
<text x="28" y="129" font-weight="bold">Magento Open</text>
<text x="28" y="143" font-weight="bold">Source</text>
<text x="28" y="157" font-size="11" opacity="0.85">self-hosted code base,</text>
<text x="28" y="171" font-size="11" opacity="0.85">OSL-3.0 / AFL-3.0</text>
<rect x="170" y="106" width="130" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="235.0" y="150" text-anchor="middle">you or your host</text>
<rect x="304" y="106" width="162" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="385.0" y="150" text-anchor="middle">yes</text>
<rect x="470" y="106" width="156" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="548.0" y="143" text-anchor="middle">APIs: yes</text>
<text x="548.0" y="157" text-anchor="middle">I/O Events: no</text>
<rect x="630" y="106" width="148" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="704.0" y="136" text-anchor="middle">Luma, Blank, Hyva,</text>
<text x="704.0" y="150" text-anchor="middle">PWA Studio, headless;</text>
<text x="704.0" y="164" text-anchor="middle">no Edge Delivery docs</text>
<rect x="782" y="106" width="144" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="854.0" y="143" text-anchor="middle">you apply -pN patches</text>
<text x="854.0" y="157" text-anchor="middle">standard support only</text>
<rect x="20" y="192" width="146" height="80" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
<text x="28" y="215" font-weight="bold">Mage-OS</text>
<text x="28" y="229" font-weight="bold">distribution</text>
<text x="28" y="243" font-size="11" opacity="0.85">community build of the</text>
<text x="28" y="257" font-size="11" opacity="0.85">Open Source code base</text>
<rect x="170" y="192" width="130" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="235.0" y="236" text-anchor="middle">you or your host</text>
<rect x="304" y="192" width="162" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="385.0" y="236" text-anchor="middle">yes</text>
<rect x="470" y="192" width="156" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="548.0" y="229" text-anchor="middle">APIs: yes</text>
<text x="548.0" y="243" text-anchor="middle">no eventing modules</text>
<rect x="630" y="192" width="148" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="704.0" y="229" text-anchor="middle">Luma, Blank, Hyva,</text>
<text x="704.0" y="243" text-anchor="middle">headless</text>
<rect x="782" y="192" width="144" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="854.0" y="229" text-anchor="middle">you apply Mage-OS</text>
<text x="854.0" y="243" text-anchor="middle">releases (monthly)</text>
<rect x="20" y="278" width="146" height="80" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
<text x="28" y="308" font-weight="bold">Adobe Commerce</text>
<text x="28" y="322" font-weight="bold">on-premises</text>
<text x="28" y="336" font-size="11" opacity="0.85">licensed, self-hosted</text>
<rect x="170" y="278" width="130" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="235.0" y="322" text-anchor="middle">you or your host</text>
<rect x="304" y="278" width="162" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="385.0" y="322" text-anchor="middle">yes</text>
<rect x="470" y="278" width="156" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="548.0" y="315" text-anchor="middle">yes: events, webhooks,</text>
<text x="548.0" y="329" text-anchor="middle">Admin UI SDK</text>
<rect x="630" y="278" width="148" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="704.0" y="308" text-anchor="middle">Luma, Hyva, PWA Studio;</text>
<text x="704.0" y="322" text-anchor="middle">Commerce Storefront on</text>
<text x="704.0" y="336" text-anchor="middle">Edge Delivery (add-ons)</text>
<rect x="782" y="278" width="144" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="854.0" y="315" text-anchor="middle">you apply -pN patches;</text>
<text x="854.0" y="329" text-anchor="middle">extended support</text>
<rect x="20" y="364" width="146" height="80" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
<text x="28" y="387" font-weight="bold">Adobe Commerce on</text>
<text x="28" y="401" font-weight="bold">Cloud</text>
<text x="28" y="415" font-size="11" opacity="0.85">PaaS, Adobe-managed</text>
<text x="28" y="429" font-size="11" opacity="0.85">infrastructure</text>
<rect x="170" y="364" width="130" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="235.0" y="401" text-anchor="middle">Adobe: infrastructure</text>
<text x="235.0" y="415" text-anchor="middle">you: application</text>
<rect x="304" y="364" width="162" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="385.0" y="408" text-anchor="middle">yes</text>
<rect x="470" y="364" width="156" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="548.0" y="408" text-anchor="middle">yes (recommended)</text>
<rect x="630" y="364" width="148" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="704.0" y="394" text-anchor="middle">Luma, Hyva, PWA Studio;</text>
<text x="704.0" y="408" text-anchor="middle">Commerce Storefront on</text>
<text x="704.0" y="422" text-anchor="middle">Edge Delivery (add-ons)</text>
<rect x="782" y="364" width="144" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="854.0" y="401" text-anchor="middle">you upgrade; Adobe</text>
<text x="854.0" y="415" text-anchor="middle">enforces deadlines</text>
<rect x="20" y="450" width="146" height="80" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5"/>
<text x="28" y="480" font-weight="bold">Adobe Commerce as</text>
<text x="28" y="494" font-weight="bold">a Cloud Service</text>
<text x="28" y="508" font-size="11" opacity="0.85">SaaS (ACCS), versionless</text>
<rect x="170" y="450" width="130" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="235.0" y="494" text-anchor="middle">Adobe, multi-tenant</text>
<rect x="304" y="450" width="162" height="80" rx="6" fill="#7f8c8d" fill-opacity="0.22" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="385.0" y="494" text-anchor="middle">no</text>
<rect x="470" y="450" width="156" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="548.0" y="494" text-anchor="middle">yes (only model)</text>
<rect x="630" y="450" width="148" height="80" rx="6" fill="#e67e22" fill-opacity="0.2" stroke="#e67e22" stroke-width="1.5"/>
<text x="704.0" y="480" text-anchor="middle">Commerce Storefront on</text>
<text x="704.0" y="494" text-anchor="middle">Edge Delivery only;</text>
<text x="704.0" y="508" text-anchor="middle">no Luma</text>
<rect x="782" y="450" width="144" height="80" rx="6" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71" stroke-width="1.5"/>
<text x="854.0" y="487" text-anchor="middle">automatic, no manual</text>
<text x="854.0" y="501" text-anchor="middle">upgrades</text>
<rect x="20" y="536" width="22" height="14" rx="3" fill="#2ecc71" fill-opacity="0.22" stroke="#2ecc71"/><text x="48" y="548" >available</text>
<rect x="150" y="536" width="22" height="14" rx="3" fill="#e67e22" fill-opacity="0.20" stroke="#e67e22"/><text x="178" y="548">with limits or your responsibility</text>
<rect x="400" y="536" width="22" height="14" rx="3" fill="#7f8c8d" fill-opacity="0.22" stroke="#7f8c8d"/><text x="428" y="548">not available</text>
</svg>