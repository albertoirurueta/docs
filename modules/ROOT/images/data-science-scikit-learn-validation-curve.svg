<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img">
<title>Validation curve of a regularised logistic regression</title>
<desc>Training and validation accuracy against the inverse regularisation strength C on a log axis. Both are low for small C (underfitting). Training accuracy keeps rising with C while validation accuracy peaks at C equal to 1 and then declines (overfitting).</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="458" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">Validation curve: accuracy against C (breast cancer data)</text>
<line x1="90" y1="360" x2="680" y2="360" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="90" y1="360" x2="90" y2="80" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="85" y1="360.0" x2="90" y2="360.0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="80" y="364.0" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="end">0.6</text>
<line x1="90" y1="360.0" x2="680" y2="360.0" stroke="#E2E8F0" stroke-width="1"/>
<line x1="85" y1="290.0" x2="90" y2="290.0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="80" y="294.0" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="end">0.7</text>
<line x1="90" y1="290.0" x2="680" y2="290.0" stroke="#E2E8F0" stroke-width="1"/>
<line x1="85" y1="219.99999999999997" x2="90" y2="219.99999999999997" stroke="#94A3B8" stroke-width="1.5"/>
<text x="80" y="223.99999999999997" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="end">0.8</text>
<line x1="90" y1="219.99999999999997" x2="680" y2="219.99999999999997" stroke="#E2E8F0" stroke-width="1"/>
<line x1="85" y1="149.99999999999997" x2="90" y2="149.99999999999997" stroke="#94A3B8" stroke-width="1.5"/>
<text x="80" y="153.99999999999997" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="end">0.9</text>
<line x1="90" y1="149.99999999999997" x2="680" y2="149.99999999999997" stroke="#E2E8F0" stroke-width="1"/>
<line x1="85" y1="80.0" x2="90" y2="80.0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="80" y="84.0" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="end">1.0</text>
<line x1="90" y1="80.0" x2="680" y2="80.0" stroke="#E2E8F0" stroke-width="1"/>
<line x1="110.0" y1="360" x2="110.0" y2="365" stroke="#94A3B8" stroke-width="1.5"/>
<text x="110.0" y="382" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">0.0001</text>
<line x1="201.66666666666669" y1="360" x2="201.66666666666669" y2="365" stroke="#94A3B8" stroke-width="1.5"/>
<text x="201.66666666666669" y="382" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">0.001</text>
<line x1="293.33333333333337" y1="360" x2="293.33333333333337" y2="365" stroke="#94A3B8" stroke-width="1.5"/>
<text x="293.33333333333337" y="382" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">0.01</text>
<line x1="385.0" y1="360" x2="385.0" y2="365" stroke="#94A3B8" stroke-width="1.5"/>
<text x="385.0" y="382" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">0.1</text>
<line x1="476.6666666666667" y1="360" x2="476.6666666666667" y2="365" stroke="#94A3B8" stroke-width="1.5"/>
<text x="476.6666666666667" y="382" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">1</text>
<line x1="568.3333333333333" y1="360" x2="568.3333333333333" y2="365" stroke="#94A3B8" stroke-width="1.5"/>
<text x="568.3333333333333" y="382" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">10</text>
<line x1="660.0" y1="360" x2="660.0" y2="365" stroke="#94A3B8" stroke-width="1.5"/>
<text x="660.0" y="382" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">100</text>
<text x="385.0" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">C (log scale; smaller means stronger regularisation)</text>
<text x="26" y="220.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle" transform="rotate(-90 26 220.0)">accuracy</text>
<polyline points="110.0,329.2 201.7,150.7 293.3,112.2 385.0,92.6 476.7,88.4 568.3,87.0 660.0,84.9" fill="none" stroke="#0F766E" stroke-width="3"/>
<circle cx="110.0" cy="329.2" r="4.5" fill="#0F766E"/>
<circle cx="201.7" cy="150.7" r="4.5" fill="#0F766E"/>
<circle cx="293.3" cy="112.2" r="4.5" fill="#0F766E"/>
<circle cx="385.0" cy="92.6" r="4.5" fill="#0F766E"/>
<circle cx="476.7" cy="88.4" r="4.5" fill="#0F766E"/>
<circle cx="568.3" cy="87.0" r="4.5" fill="#0F766E"/>
<circle cx="660.0" cy="84.9" r="4.5" fill="#0F766E"/>
<polyline points="110.0,328.5 201.7,156.3 293.3,115.7 385.0,97.5 476.7,94.7 568.3,101.0 660.0,104.5" fill="none" stroke="#B45309" stroke-width="3"/>
<circle cx="110.0" cy="328.5" r="4.5" fill="#B45309"/>
<circle cx="201.7" cy="156.3" r="4.5" fill="#B45309"/>
<circle cx="293.3" cy="115.7" r="4.5" fill="#B45309"/>
<circle cx="385.0" cy="97.5" r="4.5" fill="#B45309"/>
<circle cx="476.7" cy="94.7" r="4.5" fill="#B45309"/>
<circle cx="568.3" cy="101.0" r="4.5" fill="#B45309"/>
<circle cx="660.0" cy="104.5" r="4.5" fill="#B45309"/>
<text x="128.0" y="334.2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#BE123C" text-anchor="start">underfitting</text>
<text x="654.0" y="62.89999999999998" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#BE123C" text-anchor="end">overfitting gap</text>
<circle cx="476.7" cy="94.7" r="11" fill="none" stroke="#6D28D9" stroke-width="2.5"/>
<text x="476.6666666666667" y="124.69999999999999" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#6D28D9" text-anchor="middle">best validation</text>
<line x1="96" y1="428" x2="120" y2="428" stroke="#0F766E" stroke-width="3"/>
<text x="128" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="start">training score</text>
<line x1="260" y1="428" x2="284" y2="428" stroke="#B45309" stroke-width="3"/>
<text x="292" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#0F172A" text-anchor="start">validation score</text>
<text x="450" y="432" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">values: five-fold means from validation_curve</text>
</svg>
