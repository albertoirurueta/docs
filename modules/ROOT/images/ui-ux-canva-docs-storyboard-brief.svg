  <rect x="182" y="100" width="104" height="150" rx="4" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="192" y="122" font-size="14" font-weight="bold" fill="#1F2937">Goals</text>
  <text x="192" y="146" font-size="13" fill="#4F46E5">/</text>
