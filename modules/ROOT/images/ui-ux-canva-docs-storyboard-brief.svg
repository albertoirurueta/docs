  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="116">Digital</text><text x="82" y="146">Pageless</text><text x="82" y="176">A4</text><text x="82" y="206">Letter</text></g>
  <rect x="30" y="160" width="104" height="24" rx="4" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
  <rect x="42" y="232" width="80" height="26" rx="6" fill="#4F46E5"/><text x="82" y="249" font-size="12" fill="#FFFFFF" text-anchor="middle">Create</text>
