  <g font-size="12" fill="#374151" text-anchor="middle"><text x="82" y="322">Create a Doc</text><text x="82" y="338">and pick a size</text><text x="234" y="322">Type / to add</text><text x="234" y="338">headings, tables</text><text x="386" y="322">Draft with</text><text x="386" y="338">Canva AI</text><text x="538" y="322">Review in</text><text x="538" y="338">suggestion mode</text><text x="684" y="322">Download</text><text x="684" y="338">or publish</text></g>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
