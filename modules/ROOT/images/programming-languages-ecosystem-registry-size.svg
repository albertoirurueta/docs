<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 528" width="800" height="528" role="img" aria-labelledby="ecosystem-registry-size-t ecosystem-registry-size-d">
<title id="ecosystem-registry-size-t">Package registry size, 2026 snapshot</title>
<desc id="ecosystem-registry-size-d">Number of packages listed by the main package registry of each language, snapshot taken 2026-10-25/26 from the registry APIs or pages named in ecosystem.csv. Units differ (packages, artifacts, gems, crates, distributions) and are shown in the label, so compare orders of magnitude only. Registries shared by several languages are shown once (NuGet (package IDs): C#, Visual Basic; Maven Central (artifacts): Groovy, Java, Kotlin, Scala; npm (packages): JavaScript, TypeScript). No registry count was found for: C, COBOL, C++, Fortran, Go, MATLAB, Objective-C, Pascal/Delphi, Ada, Lisp, Assembly, Zig, Mojo, SQL, Bash.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--grid:#30363d;--axis:#9198a1;--s0:#56B4E9;--s1:#E69F00;--s2:#44C9A0;--s3:#E8A0CB;--s4:#F0E442;--s5:#7FB8F0;--s6:#D9C84A;--s7:#FFFFFF;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="800" height="528" fill="var(--bg)"/>
<text class="title" x="400" y="24" text-anchor="middle">Package registry size, 2026 snapshot</text>
<g transform="translate(0 44)"><g class="legend"><circle class="m0" cx="82" cy="0" r="4"/><text x="100" y="4">Registry entries</text></g></g><line class="grid" x1="244" y1="78" x2="244" y2="468"/><text class="muted" x="244" y="486" text-anchor="middle">0</text><line class="grid" x1="344" y1="78" x2="344" y2="468"/><text class="muted" x="344" y="486" text-anchor="middle">1M</text><line class="grid" x1="444" y1="78" x2="444" y2="468"/><text class="muted" x="444" y="486" text-anchor="middle">2M</text><line class="grid" x1="544" y1="78" x2="544" y2="468"/><text class="muted" x="544" y="486" text-anchor="middle">3M</text><line class="grid" x1="644" y1="78" x2="644" y2="468"/><text class="muted" x="644" y="486" text-anchor="middle">4M</text><line class="grid" x1="744" y1="78" x2="744" y2="468"/><text class="muted" x="744" y="486" text-anchor="middle">5M</text><path class="axis" d="M244 78V468H744"/><text x="236" y="95" text-anchor="end">npm (packages)</text><rect class="f0" x="244" y="82" width="453.2" height="18"/><text class="muted" x="702.2" y="95">4,532,034</text><text x="236" y="121" text-anchor="end">PyPI (projects)</text><rect class="f0" x="244" y="108" width="92.31" height="18"/><text class="muted" x="341.31" y="121">923,102</text><text x="236" y="147" text-anchor="end">Maven Central (artifacts)</text><rect class="f0" x="244" y="134" width="66.18" height="18"/><text class="muted" x="315.18" y="147">661,801</text><text x="236" y="173" text-anchor="end">NuGet (package IDs)</text><rect class="f0" x="244" y="160" width="52.81" height="18"/><text class="muted" x="301.81" y="173">528,060</text><text x="236" y="199" text-anchor="end">Packagist (package names)</text><rect class="f0" x="244" y="186" width="47" height="18"/><text class="muted" x="296" y="199">470,008</text><text x="236" y="225" text-anchor="end">crates.io (crates)</text><rect class="f0" x="244" y="212" width="36.18" height="18"/><text class="muted" x="285.18" y="225">361,763</text><text x="236" y="251" text-anchor="end">RubyGems (gems)</text><rect class="f0" x="244" y="238" width="19.79" height="18"/><text class="muted" x="268.79" y="251">197,949</text><text x="236" y="277" text-anchor="end">pub.dev (packages)</text><rect class="f0" x="244" y="264" width="9.34" height="18"/><text class="muted" x="258.34" y="277">93,435</text><text x="236" y="303" text-anchor="end">CPAN (distributions)</text><rect class="f0" x="244" y="290" width="5.29" height="18"/><text class="muted" x="254.29" y="303">52,878</text><text x="236" y="329" text-anchor="end">CRAN (packages)</text><rect class="f0" x="244" y="316" width="2.55" height="18"/><text class="muted" x="251.55" y="329">25,529</text><text x="236" y="355" text-anchor="end">Hex (packages)</text><rect class="f0" x="244" y="342" width="2.29" height="18"/><text class="muted" x="251.29" y="355">22,923</text><text x="236" y="381" text-anchor="end">Hackage (packages)</text><rect class="f0" x="244" y="368" width="1.96" height="18"/><text class="muted" x="250.96" y="381">19,594</text><text x="236" y="407" text-anchor="end">Julia General (packages)</text><rect class="f0" x="244" y="394" width="1.46" height="18"/><text class="muted" x="250.46" y="407">14,627</text><text x="236" y="433" text-anchor="end">Swift Package Index (packages)</text><rect class="f0" x="244" y="420" width="1.24" height="18"/><text class="muted" x="250.24" y="433">12,380</text><text x="236" y="459" text-anchor="end">LuaRocks (modules)</text><rect class="f0" x="244" y="446" width="0.69" height="18"/><text class="muted" x="249.69" y="459">6,943</text><text class="axis-label" x="494" y="508" text-anchor="middle">Entries in the registry (count)</text><text class="axis-label" transform="translate(16 273) rotate(-90)" text-anchor="middle">Registry (unit)</text>
</svg>
