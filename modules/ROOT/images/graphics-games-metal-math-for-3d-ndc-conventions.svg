<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-math-for-3d-ndc-conventions" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Normalised device coordinates in Metal and OpenGL</text>
<text x="170" y="60" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Metal NDC</text>
<rect x="80" y="80" width="180" height="150" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="170.0" y="159.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="105" y="80" width="0" height="0"/>
<line x1="80" y1="155" x2="260" y2="155" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="170" y1="80" x2="170" y2="230" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<text x="176" y="100" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">+y up</text>
<text x="254" y="172" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">+x</text>
<rect x="110" y="250" width="120" height="36" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="170.0" y="264.9" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">z from 0 (near)</text>
<text x="170.0" y="278.9" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">to 1 (far)</text>
<text x="590" y="60" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">OpenGL NDC</text>
<rect x="500" y="80" width="180" height="150" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="590.0" y="159.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<rect x="525" y="80" width="0" height="0"/>
<line x1="500" y1="155" x2="680" y2="155" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="590" y1="80" x2="590" y2="230" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3"/>
<text x="596" y="100" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">+y up</text>
<text x="674" y="172" font-size="11" font-weight="normal" fill="#374151" text-anchor="end">+x</text>
<rect x="530" y="250" width="120" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="590.0" y="264.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">z from -1 (near)</text>
<text x="590.0" y="278.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">to 1 (far)</text>
<text x="380" y="160" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">x, y: -1..1 in both</text>
<text x="380" y="180" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Metal framebuffer y</text>
<text x="380" y="195" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">origin: top left</text>
<text x="380" y="310" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Metal clip space: -w &lt;= x, y &lt;= w and 0 &lt;= z &lt;= w. A matrix made for OpenGL needs its z row remapped.</text>
</svg>
