<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>

  <text x="390" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Blazor interactive hosting models</text>

  <!-- ===== Interactive Server ===== -->
  <rect x="30" y="55" width="230" height="360" rx="8" fill="#eef4fa" stroke="#2f6fa8" stroke-width="2"/>
  <text x="145" y="80" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Interactive Server</text>

  <rect x="55" y="100" width="180" height="52" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="145" y="122" font-size="11.5" fill="#1c4b73" text-anchor="middle">Browser: thin DOM</text>
  <text x="145" y="139" font-size="10.5" fill="#666666" text-anchor="middle">blazor.web.js</text>

  <line x1="145" y1="152" x2="145" y2="196" stroke="#c25a1d" stroke-width="2"/>
  <text x="196" y="177" font-size="10" fill="#c25a1d" text-anchor="middle">SignalR</text>
  <text x="196" y="189" font-size="10" fill="#c25a1d" text-anchor="middle">circuit</text>

  <rect x="55" y="198" width="180" height="70" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="145" y="222" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Server</text>
  <text x="145" y="240" font-size="10.5" fill="#1c4b73" text-anchor="middle">component state,</text>
  <text x="145" y="255" font-size="10.5" fill="#1c4b73" text-anchor="middle">event handlers, render</text>

  <text x="145" y="300" font-size="10.5" fill="#2a6636" text-anchor="middle">+ tiny download</text>
  <text x="145" y="318" font-size="10.5" fill="#2a6636" text-anchor="middle">+ code/secrets stay server-side</text>
  <text x="145" y="336" font-size="10.5" fill="#8a3d10" text-anchor="middle">- needs a live connection</text>
  <text x="145" y="354" font-size="10.5" fill="#8a3d10" text-anchor="middle">- server holds per-user state</text>
  <text x="145" y="372" font-size="10.5" fill="#8a3d10" text-anchor="middle">- latency = round trip</text>

  <!-- ===== Interactive WebAssembly ===== -->
  <rect x="275" y="55" width="230" height="360" rx="8" fill="#eef4fa" stroke="#2f6fa8" stroke-width="2"/>
  <text x="390" y="80" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Interactive WebAssembly</text>

  <rect x="300" y="100" width="180" height="90" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="390" y="122" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Browser</text>
  <text x="390" y="140" font-size="10.5" fill="#1c4b73" text-anchor="middle">.NET WASM runtime,</text>
  <text x="390" y="155" font-size="10.5" fill="#1c4b73" text-anchor="middle">component state,</text>
  <text x="390" y="170" font-size="10.5" fill="#1c4b73" text-anchor="middle">event handlers, render</text>

  <line x1="390" y1="190" x2="390" y2="220" stroke="#999999" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="300" y="222" width="180" height="46" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
  <text x="390" y="243" font-size="10.5" fill="#666666" text-anchor="middle">Server / CDN: static files</text>
  <text x="390" y="258" font-size="10.5" fill="#666666" text-anchor="middle">+ Web API calls only</text>

  <text x="390" y="300" font-size="10.5" fill="#2a6636" text-anchor="middle">+ works offline</text>
  <text x="390" y="318" font-size="10.5" fill="#2a6636" text-anchor="middle">+ no per-user server state</text>
  <text x="390" y="336" font-size="10.5" fill="#2a6636" text-anchor="middle">+ host on a CDN</text>
  <text x="390" y="354" font-size="10.5" fill="#8a3d10" text-anchor="middle">- larger initial download</text>
  <text x="390" y="372" font-size="10.5" fill="#8a3d10" text-anchor="middle">- runtime warm-up</text>

  <!-- ===== Interactive Auto ===== -->
  <rect x="520" y="55" width="230" height="360" rx="8" fill="#eef4fa" stroke="#4a7a3a" stroke-width="2"/>
  <text x="635" y="80" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Interactive Auto</text>

  <rect x="545" y="100" width="180" height="60" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="635" y="122" font-size="11" fill="#2f5424" text-anchor="middle">1st visit: Interactive</text>
  <text x="635" y="138" font-size="11" fill="#2f5424" text-anchor="middle">Server (fast start)</text>
  <text x="635" y="153" font-size="10" fill="#666666" text-anchor="middle">while WASM downloads in bg</text>

  <line x1="635" y1="160" x2="635" y2="188" stroke="#4a7a3a" stroke-width="2" marker-end="url(#bhm-arrow)"/>

  <rect x="545" y="190" width="180" height="60" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="635" y="212" font-size="11" fill="#2f5424" text-anchor="middle">next visits: Interactive</text>
  <text x="635" y="228" font-size="11" fill="#2f5424" text-anchor="middle">WebAssembly (cached)</text>
  <text x="635" y="243" font-size="10" fill="#666666" text-anchor="middle">runs fully in the browser</text>

  <text x="635" y="300" font-size="10.5" fill="#2a6636" text-anchor="middle">+ fast first load</text>
  <text x="635" y="318" font-size="10.5" fill="#2a6636" text-anchor="middle">+ client execution afterwards</text>
  <text x="635" y="336" font-size="10.5" fill="#8a3d10" text-anchor="middle">- must support both models</text>
  <text x="635" y="354" font-size="10.5" fill="#8a3d10" text-anchor="middle">- shared code targets WASM</text>

  <defs>
    <marker id="bhm-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <text x="390" y="445" font-size="12" fill="#444444" text-anchor="middle">All three share the same component code; the render mode is set per page or per component with @rendermode.</text>
  <text x="390" y="466" font-size="12" fill="#444444" text-anchor="middle">Static SSR (no interactivity) is always available and is the default for pages that do not opt in.</text>
</svg>
