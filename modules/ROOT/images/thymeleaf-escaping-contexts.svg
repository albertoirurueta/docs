<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
  <text x="430" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One value, five output contexts</text>
  <text x="430" y="44" font-size="12" fill="#666666" text-anchor="middle">the same untrusted string needs a different encoding in each place it can land</text>

  <!-- value box -->
  <rect x="300" y="58" width="260" height="40" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="430" y="76" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">${name}</text>
  <text x="430" y="91" font-size="11" font-family="Menlo, Consolas, monospace" fill="#444444" text-anchor="middle">Ada &lt;b&gt;"L" &amp; O'N</text>

  <!-- column headers -->
  <text x="40" y="132" font-size="12" font-weight="bold" fill="#222222">Output context</text>
  <text x="250" y="132" font-size="12" font-weight="bold" fill="#222222">Thymeleaf construct</text>
  <text x="520" y="132" font-size="12" font-weight="bold" fill="#222222">Encoding applied</text>
  <line x1="30" y1="138" x2="830" y2="138" stroke="#444444" stroke-width="1"/>

  <!-- arrows from value -->
  <g stroke="#444444" stroke-width="1.4" fill="#444444">
    <line x1="430" y1="98" x2="430" y2="112"/>
    <polygon points="425,110 435,110 430,118"/>
  </g>

  <!-- rows -->
  <rect x="30" y="146" width="800" height="40" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.2"/>
  <text x="40" y="170" font-size="12" font-weight="bold" fill="#14501f">HTML text</text>
  <text x="250" y="170" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">th:text, [[...]]</text>
  <text x="520" y="170" font-size="11" fill="#14501f">HTML entities: &lt; &gt; &amp; " '</text>

  <rect x="30" y="192" width="800" height="40" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.2"/>
  <text x="40" y="216" font-size="12" font-weight="bold" fill="#14501f">HTML attribute value</text>
  <text x="250" y="216" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">th:title, th:value, th:attr</text>
  <text x="520" y="216" font-size="11" fill="#14501f">HTML entities, quotes included</text>

  <rect x="30" y="238" width="800" height="40" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.2"/>
  <text x="40" y="262" font-size="12" font-weight="bold" fill="#14501f">URL query parameter</text>
  <text x="250" y="262" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">@{/path(q=${v})}</text>
  <text x="520" y="262" font-size="11" fill="#14501f">percent-encoding, then HTML-escaped</text>

  <rect x="30" y="284" width="800" height="40" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.2"/>
  <text x="40" y="308" font-size="12" font-weight="bold" fill="#14501f">JavaScript block</text>
  <text x="250" y="308" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">th:inline="javascript"</text>
  <text x="520" y="308" font-size="11" fill="#14501f">JavaScript literal with backslash and unicode escapes</text>

  <rect x="30" y="330" width="800" height="40" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.2"/>
  <text x="40" y="354" font-size="12" font-weight="bold" fill="#14501f">CSS block</text>
  <text x="250" y="354" font-size="11" font-family="Menlo, Consolas, monospace" fill="#222222">th:inline="css"</text>
  <text x="520" y="354" font-size="11" fill="#14501f">CSS escapes (backslash form)</text>

  <text x="430" y="392" font-size="11" fill="#8a1c1c" text-anchor="middle">th:utext and [(...)] skip the encoding step: only trusted or sanitised markup belongs there</text>
</svg>
