<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">The SAP enterprise structure: client, company code, plant, storage location, controlling area, sales area and purchasing organization</title>
  <desc id="d">A client contains one or more company codes. A company code contains one or more plants, and a plant contains one or more storage locations. A controlling area groups company codes for management accounting. A sales organization, together with a distribution channel and a division, forms a sales area. A purchasing organization buys for one or more plants.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="20" width="1000" height="500" rx="14" fill="#1e1b4b" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="46" text-anchor="start" font-size="15" font-weight="bold">Client: the top level, one business entity with its own data</text>
  <text x="60" y="84" text-anchor="start" font-size="13" font-weight="bold">Accounting and logistics</text>
  <rect x="60" y="98" width="220" height="70" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="128" text-anchor="middle" font-size="14" font-weight="bold">Company code</text>
  <text x="170" y="147" text-anchor="middle" font-size="12">legal entity, own books</text>
  <line x1="280" y1="133" x2="340" y2="133" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="310" y="124" text-anchor="middle" font-size="12">1 : n</text>
  <rect x="340" y="98" width="220" height="70" rx="10" fill="#2fbf71" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="450" y="128" text-anchor="middle" font-size="14" font-weight="bold">Plant</text>
  <text x="450" y="147" text-anchor="middle" font-size="12">production or storage site</text>
  <line x1="560" y1="133" x2="620" y2="133" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="590" y="124" text-anchor="middle" font-size="12">1 : n</text>
  <rect x="620" y="98" width="220" height="70" rx="10" fill="#4fa3c8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="730" y="128" text-anchor="middle" font-size="14" font-weight="bold">Storage location</text>
  <text x="730" y="147" text-anchor="middle" font-size="12">where stock is kept</text>
  <rect x="60" y="210" width="220" height="70" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="240" text-anchor="middle" font-size="14" font-weight="bold">Controlling area</text>
  <text x="170" y="259" text-anchor="middle" font-size="12">management accounting</text>
  <line x1="170" y1="210" x2="170" y2="168" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="180" y="194" text-anchor="start" font-size="12">groups company codes</text>
  <text x="60" y="320" text-anchor="start" font-size="13" font-weight="bold">Sales and purchasing</text>
  <rect x="60" y="342" width="220" height="70" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="372" text-anchor="middle" font-size="14" font-weight="bold">Sales organization</text>
  <text x="170" y="391" text-anchor="middle" font-size="12">sells and invoices</text>
  <rect x="340" y="342" width="220" height="70" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="450" y="372" text-anchor="middle" font-size="14" font-weight="bold">Distribution channel</text>
  <text x="450" y="391" text-anchor="middle" font-size="12">how goods reach customers</text>
  <rect x="620" y="342" width="220" height="70" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="730" y="372" text-anchor="middle" font-size="14" font-weight="bold">Division</text>
  <text x="730" y="391" text-anchor="middle" font-size="12">product line</text>
  <rect x="46" y="330" width="808" height="94" rx="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="870" y="372" text-anchor="start" font-size="12">together</text>
  <text x="870" y="390" text-anchor="start" font-size="13" font-weight="bold">a sales area</text>
  <rect x="60" y="440" width="220" height="66" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="170" y="468" text-anchor="middle" font-size="14" font-weight="bold">Purchasing organization</text>
  <text x="170" y="487" text-anchor="middle" font-size="12">negotiates and buys</text>
  <text x="300" y="478" text-anchor="start" font-size="12">buys for one or more plants</text>
</svg>
