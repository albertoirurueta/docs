<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Prefab variants inherit, and overrides win</text>
<rect x="30" y="56" width="210" height="96" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="135.0" y="84.2" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Book.prefab (base)</text>
<text x="135.0" y="100.2" text-anchor="middle" font-size="12" fill="#1F2937">scale 1, 1, 1</text>
<text x="135.0" y="116.2" text-anchor="middle" font-size="12" fill="#1F2937">Cover material: Leather</text>
<text x="135.0" y="132.2" text-anchor="middle" font-size="12" fill="#1F2937">BookSpinner: speed 20</text>
<rect x="275" y="56" width="210" height="96" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="84.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">BookLarge.prefab (variant)</text>
<text x="380.0" y="100.2" text-anchor="middle" font-size="12" fill="#3730A3">override: scale 1.3</text>
<text x="380.0" y="116.2" text-anchor="middle" font-size="12" fill="#3730A3">Cover material: Leather</text>
<text x="380.0" y="132.2" text-anchor="middle" font-size="12" fill="#3730A3">BookSpinner: speed 20</text>
<rect x="520" y="56" width="210" height="96" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="625.0" y="84.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">BookLargeRed.prefab (variant)</text>
<text x="625.0" y="100.2" text-anchor="middle" font-size="12" fill="#3730A3">scale 1.3 (from BookLarge)</text>
<text x="625.0" y="116.2" text-anchor="middle" font-size="12" fill="#3730A3">override: Cover Red</text>
<text x="625.0" y="132.2" text-anchor="middle" font-size="12" fill="#3730A3">BookSpinner: speed 20</text>
<line x1="240" y1="104" x2="275" y2="104" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="485" y1="104" x2="520" y2="104" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="257" y="96" text-anchor="middle" font-size="10" fill="#374151">base</text>
<text x="502" y="96" text-anchor="middle" font-size="10" fill="#374151">base</text>
<rect x="520" y="196" width="210" height="86" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="227.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Scene instance</text>
<text x="625.0" y="243.2" text-anchor="middle" font-size="12" fill="#92400E">override: speed 45</text>
<text x="625.0" y="259.2" text-anchor="middle" font-size="12" fill="#92400E">everything else inherited</text>
<line x1="625" y1="152" x2="625" y2="196" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="275" y="196" width="210" height="86" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="227.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Scene instance</text>
<text x="380.0" y="243.2" text-anchor="middle" font-size="12" fill="#374151">no overrides</text>
<text x="380.0" y="259.2" text-anchor="middle" font-size="12" fill="#374151">shows BookLarge exactly</text>
<line x1="380" y1="152" x2="380" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="196" width="210" height="86" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="227.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Nested prefab</text>
<text x="135.0" y="243.2" text-anchor="middle" font-size="12" fill="#374151">Book inside Shelf.prefab</text>
<text x="135.0" y="259.2" text-anchor="middle" font-size="12" fill="#374151">keeps its own link</text>
<line x1="135" y1="152" x2="135" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="30" y="310" width="700" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="341.4" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Precedence, highest first</text>
<text x="380.0" y="356.4" text-anchor="middle" font-size="11" fill="#374151">1  override on the scene instance        2  override in the variant        3  value in the base prefab</text>
<text x="380.0" y="371.4" text-anchor="middle" font-size="11" fill="#374151">Changing the base later flows into every variant and instance that has not overridden that property.</text>
<text x="380.0" y="386.4" text-anchor="middle" font-size="11" fill="#374151">Apply writes an instance override into the prefab asset; Revert discards it.</text>
</svg>
