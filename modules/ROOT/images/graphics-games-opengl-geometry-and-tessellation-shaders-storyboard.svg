<svg viewBox="0 0 760 390" width="760" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-gts-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="390" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: a tessellated shelf-top terrain with normal debugging</text>
<rect x="15" y="50" width="170" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="65" r="11" fill="#4F46E5"/><text x="30" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<g stroke="#4F46E5" fill="#EEF2FF"><rect x="45" y="90" width="110" height="100"/></g>
<g stroke="#4F46E5"><line x1="82" y1="90" x2="82" y2="190"/><line x1="118" y1="90" x2="118" y2="190"/><line x1="45" y1="123" x2="155" y2="123"/><line x1="45" y1="157" x2="155" y2="157"/></g>
<text x="100" y="215" font-size="11" fill="#374151" text-anchor="middle">a coarse grid of</text>
<text x="100" y="231" font-size="11" fill="#374151" text-anchor="middle">4-vertex patches</text>
<text x="100" y="265" font-size="10" fill="#374151" text-anchor="middle">GL_PATCHES, no height yet</text>
<rect x="195" y="50" width="170" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="210" cy="65" r="11" fill="#4F46E5"/><text x="210" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<g stroke="#4F46E5" fill="#EEF2FF"><rect x="225" y="90" width="110" height="100"/></g>
<g stroke="#4F46E5" stroke-width="0.8"><line x1="225" y1="105" x2="335" y2="105"/><line x1="225" y1="120" x2="335" y2="120"/><line x1="225" y1="135" x2="335" y2="135"/><line x1="225" y1="150" x2="335" y2="150"/><line x1="225" y1="170" x2="335" y2="170"/><line x1="240" y1="90" x2="240" y2="190"/><line x1="255" y1="90" x2="255" y2="190"/><line x1="270" y1="90" x2="270" y2="190"/><line x1="290" y1="90" x2="290" y2="190"/><line x1="315" y1="90" x2="315" y2="190"/></g>
<text x="280" y="215" font-size="11" fill="#374151" text-anchor="middle">control shader: more</text>
<text x="280" y="231" font-size="11" fill="#374151" text-anchor="middle">subdivision near the camera</text>
<text x="280" y="265" font-size="10" fill="#374151" text-anchor="middle">levels from distance</text>
<rect x="375" y="50" width="170" height="240" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="390" cy="65" r="11" fill="#4F46E5"/><text x="390" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<polyline points="405,170 425,150 445,160 465,125 485,145 505,120 525,150" fill="none" stroke="#047857" stroke-width="2"/>
<polyline points="405,185 425,165 445,175 465,140 485,160 505,135 525,165" fill="none" stroke="#047857" stroke-width="1"/>
<text x="460" y="215" font-size="11" fill="#374151" text-anchor="middle">evaluation shader:</text>
<text x="460" y="231" font-size="11" fill="#374151" text-anchor="middle">interpolate corners, add height</text>
<text x="460" y="265" font-size="10" fill="#374151" text-anchor="middle">new vertices are displaced</text>
<rect x="555" y="50" width="190" height="240" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<circle cx="570" cy="65" r="11" fill="#B45309"/><text x="570" y="69" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<polyline points="585,170 605,150 625,160 645,125 665,145 685,120 705,150" fill="none" stroke="#047857" stroke-width="2"/>
<g stroke="#B45309" stroke-width="1.5"><line x1="605" y1="150" x2="600" y2="130"/><line x1="625" y1="160" x2="628" y2="140"/><line x1="645" y1="125" x2="640" y2="105"/><line x1="665" y1="145" x2="668" y2="125"/><line x1="685" y1="120" x2="682" y2="100"/></g>
<text x="650" y="215" font-size="11" fill="#374151" text-anchor="middle">geometry shader draws a</text>
<text x="650" y="231" font-size="11" fill="#374151" text-anchor="middle">short line along each normal</text>
<text x="650" y="265" font-size="10" fill="#374151" text-anchor="middle">a debugging aid, off in release</text>
<path d="M185 170 L195 170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-sb)"/>
<path d="M365 170 L375 170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-sb)"/>
<path d="M545 170 L555 170" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-gts-sb)"/>
<rect x="15" y="310" width="730" height="56" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="333" font-size="12" fill="#374151" text-anchor="middle">Panels 1 to 3 use only the vertex, tessellation control and tessellation evaluation stages.</text>
<text x="380" y="351" font-size="12" fill="#374151" text-anchor="middle">Panel 4 adds a geometry shader after them, built into a second program that shares the same stages.</text>
</svg>
