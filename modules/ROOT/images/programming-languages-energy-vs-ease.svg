:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}.l1{stroke:var(--s1);stroke-width:2;fill:none;stroke-dasharray:6 3;stroke-linejoin:round}.m1{fill:var(--s1);stroke:var(--s1)}.f1{fill:var(--s1)}.a1{fill:var(--s1);fill-opacity:.12;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 3;}.l2{stroke:var(--s2);stroke-width:2;fill:none;stroke-dasharray:2 2;stroke-linejoin:round}.m2{fill:var(--s2);stroke:var(--s2)}.f2{fill:var(--s2)}.a2{fill:var(--s2);fill-opacity:.12;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 2;}.l3{stroke:var(--s3);stroke-width:2;fill:none;stroke-dasharray:8 3 2 3;stroke-linejoin:round}.m3{fill:var(--s3);stroke:var(--s3)}.f3{fill:var(--s3)}.a3{fill:var(--s3);fill-opacity:.12;stroke:var(--s3);stroke-width:2;stroke-dasharray:8 3 2 3;}.l4{stroke:var(--s4);stroke-width:2;fill:none;stroke-dasharray:4 4;stroke-linejoin:round}.m4{fill:var(--s4);stroke:var(--s4)}.f4{fill:var(--s4)}.a4{fill:var(--s4);fill-opacity:.12;stroke:var(--s4);stroke-width:2;stroke-dasharray:4 4;}.l5{stroke:var(--s5);stroke-width:2;fill:none;stroke-dasharray:10 3;stroke-linejoin:round}.m5{fill:var(--s5);stroke:var(--s5)}.f5{fill:var(--s5)}.a5{fill:var(--s5);fill-opacity:.12;stroke:var(--s5);stroke-width:2;stroke-dasharray:10 3;}</style>
