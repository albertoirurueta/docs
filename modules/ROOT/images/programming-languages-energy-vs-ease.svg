<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="energy-vs-ease-t energy-vs-ease-d">
<title id="energy-vs-ease-t">Energy efficiency vs ease of learning</title>
<desc id="energy-vs-ease-d">Energy score (log scale of energy relative to C, 10 = least energy) against ease-of-learning score (mean of the onboarding checks and the shortness of the Benchmarks Game sources), one point per language coloured by editorial group. 17 of 35 languages have both scores; the others lack data and are left out. Scores follow the rubric in data/NOTES.md (retrieved 2026-10-26).</desc>
