<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>AI quality tiers by content type</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">AI quality tiers by content type</text>
  <rect x="40" y="50" width="680" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="56" y="72" font-size="13" fill="#1F2937" text-anchor="start" font-weight="bold">Content type</text><text x="330" y="72" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Standard</text><text x="470" y="72" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Premium</text><text x="610" y="72" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Ultra</text>
  <rect x="40" y="96" width="680" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/><text x="56" y="123" font-size="13" fill="#1F2937" text-anchor="start">Photos</text><circle cx="330" cy="118" r="11" fill="#4F46E5"/><path d="M324,118 l4,5 l8,-9" stroke="#FFFFFF" stroke-width="2.2" fill="none"/><circle cx="470" cy="118" r="11" fill="#4F46E5"/><path d="M464,118 l4,5 l8,-9" stroke="#FFFFFF" stroke-width="2.2" fill="none"/><circle cx="610" cy="118" r="11" fill="#4F46E5"/><path d="M604,118 l4,5 l8,-9" stroke="#FFFFFF" stroke-width="2.2" fill="none"/>
  <rect x="40" y="148" width="680" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/><text x="56" y="175" font-size="13" fill="#1F2937" text-anchor="start">Videos</text><circle cx="330" cy="170" r="11" fill="#FFFFFF" stroke="#9CA3AF"/><path d="M325,170 h10" stroke="#6B7280" stroke-width="2"/><circle cx="470" cy="170" r="11" fill="#4F46E5"/><path d="M464,170 l4,5 l8,-9" stroke="#FFFFFF" stroke-width="2.2" fill="none"/><circle cx="610" cy="170" r="11" fill="#4F46E5"/><path d="M604,170 l4,5 l8,-9" stroke="#FFFFFF" stroke-width="2.2" fill="none"/>
  <rect x="40" y="200" width="680" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/><text x="56" y="227" font-size="13" fill="#1F2937" text-anchor="start">Graphics, audio, 3D</text><circle cx="330" cy="222" r="11" fill="#FFFFFF" stroke="#9CA3AF"/><path d="M325,222 h10" stroke="#6B7280" stroke-width="2"/><circle cx="470" cy="222" r="11" fill="#4F46E5"/><path d="M464,222 l4,5 l8,-9" stroke="#FFFFFF" stroke-width="2.2" fill="none"/><circle cx="610" cy="222" r="11" fill="#FFFFFF" stroke="#9CA3AF"/><path d="M605,222 h10" stroke="#6B7280" stroke-width="2"/>
  <rect x="40" y="252" width="680" height="44" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/><text x="56" y="279" font-size="13" fill="#1F2937" text-anchor="start">Forms, code, charts, Sheets</text><circle cx="330" cy="274" r="11" fill="#FFFFFF" stroke="#9CA3AF"/><path d="M325,274 h10" stroke="#6B7280" stroke-width="2"/><circle cx="470" cy="274" r="11" fill="#4F46E5"/><path d="M464,274 l4,5 l8,-9" stroke="#FFFFFF" stroke-width="2.2" fill="none"/><circle cx="610" cy="274" r="11" fill="#FFFFFF" stroke="#9CA3AF"/><path d="M605,274 h10" stroke="#6B7280" stroke-width="2"/>
  <text x="56" y="326" font-size="11" fill="#374151" text-anchor="start">Ultra is for paid plans, supports audio in video, and draws the allowance fastest. An unsupported tier falls back to Premium.</text>
  <text x="380" y="342" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
