<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-pv-cmp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Where the particles live: Built-in Particle System versus VFX Graph</text>
<rect x="20" y="50" width="350" height="330" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<rect x="390" y="50" width="350" height="330" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="195" y="74" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Built-in Particle System</text>
<text x="565" y="74" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Visual Effect Graph</text>
<text x="195" y="92" text-anchor="middle" font-size="12" fill="#374151">simulated on the CPU</text>
<text x="565" y="92" text-anchor="middle" font-size="12" fill="#374151">simulated on the GPU</text>
<rect x="40" y="106" width="310" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="121.8" text-anchor="middle" font-size="11" fill="#3730A3">Main thread or C# Job System</text>
<text x="195.0" y="136.8" text-anchor="middle" font-size="11" fill="#3730A3">modules run per particle:</text>
<text x="195.0" y="151.8" text-anchor="middle" font-size="11" fill="#3730A3">emit, age, move, color</text>
<line x1="195" y1="160" x2="195" y2="174" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pv-cmp)"/>
<rect x="40" y="174" width="310" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="189.8" text-anchor="middle" font-size="11" fill="#3730A3">Particle array in system memory</text>
<text x="195.0" y="204.8" text-anchor="middle" font-size="11" fill="#3730A3">thousands of particles</text>
<text x="195.0" y="219.8" text-anchor="middle" font-size="11" fill="#3730A3">readable and writable from C#</text>
<line x1="195" y1="228" x2="195" y2="242" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pv-cmp)"/>
<rect x="40" y="242" width="310" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="257.9" text-anchor="middle" font-size="11" fill="#3730A3">Vertex data uploaded every frame</text>
<text x="195.0" y="272.9" text-anchor="middle" font-size="11" fill="#3730A3">billboards or meshes</text>
<text x="195.0" y="287.9" text-anchor="middle" font-size="11" fill="#3730A3">sorted on the CPU</text>
<line x1="195" y1="296" x2="195" y2="310" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pv-cmp)"/>
<rect x="40" y="310" width="310" height="54" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="195.0" y="325.9" text-anchor="middle" font-size="11" fill="#3730A3">Draw call per system</text>
<text x="195.0" y="340.9" text-anchor="middle" font-size="11" fill="#3730A3">the renderer module picks</text>
<text x="195.0" y="355.9" text-anchor="middle" font-size="11" fill="#3730A3">the material</text>
<rect x="410" y="106" width="310" height="54" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="121.8" text-anchor="middle" font-size="11" fill="#1F2937">CPU sends only a few bytes</text>
<text x="565.0" y="136.8" text-anchor="middle" font-size="11" fill="#1F2937">spawn counts, events,</text>
<text x="565.0" y="151.8" text-anchor="middle" font-size="11" fill="#1F2937">exposed properties</text>
<line x1="565" y1="160" x2="565" y2="174" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pv-cmp)"/>
<rect x="410" y="174" width="310" height="54" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="189.8" text-anchor="middle" font-size="11" fill="#1F2937">Compute dispatch: Initialize, Update</text>
<text x="565.0" y="204.8" text-anchor="middle" font-size="11" fill="#1F2937">buffers stay in GPU memory</text>
<text x="565.0" y="219.8" text-anchor="middle" font-size="11" fill="#1F2937">millions of particles</text>
<line x1="565" y1="228" x2="565" y2="242" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pv-cmp)"/>
<rect x="410" y="242" width="310" height="54" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="257.9" text-anchor="middle" font-size="11" fill="#1F2937">Output context reads the buffers</text>
<text x="565.0" y="272.9" text-anchor="middle" font-size="11" fill="#1F2937">GPU sort, indirect draw</text>
<text x="565.0" y="287.9" text-anchor="middle" font-size="11" fill="#1F2937">no read-back to the CPU</text>
<line x1="565" y1="296" x2="565" y2="310" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-pv-cmp)"/>
<rect x="410" y="310" width="310" height="54" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="325.9" text-anchor="middle" font-size="11" fill="#1F2937">Draw through the SRP</text>
<text x="565.0" y="340.9" text-anchor="middle" font-size="11" fill="#1F2937">URP or HDRP only</text>
<text x="565.0" y="355.9" text-anchor="middle" font-size="11" fill="#1F2937">needs compute shaders</text>
<text x="195" y="404" text-anchor="middle" font-size="12" fill="#1F2937">Script access: read and write every particle</text>
<text x="565" y="404" text-anchor="middle" font-size="12" fill="#1F2937">Script access: properties and events only</text>
<text x="380" y="428" text-anchor="middle" font-size="11" fill="#374151">Both can run in the same scene when the platform supports compute shaders.</text>
</svg>
