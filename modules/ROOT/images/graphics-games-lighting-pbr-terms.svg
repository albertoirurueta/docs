<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="pba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="pbw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="pbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The glTF metallic-roughness BRDF is built from four terms</text>
<rect x="30" y="50" width="700" height="56" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="74" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">f(l, v) = (1 - F) * diffuse + specular</text>
<text x="380" y="94" text-anchor="middle" font-size="12" fill="#374151">diffuse = (1 - metallic) * baseColor / pi        specular = D * G * F / (4 * N.L * N.V)</text>
<rect x="30" y="150" width="175" height="120" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="117" y="172" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">D: GGX normal distribution</text>
<text x="117" y="196" text-anchor="middle" font-size="11" fill="#374151">how many microfacets face H;</text>
<text x="117" y="214" text-anchor="middle" font-size="11" fill="#374151">alpha = roughness^2</text>
<line x1="117.0" y1="106.0" x2="117.0" y2="150.0" stroke="#4B5563" stroke-width="1.2" marker-end="url(#pb)"/>
<rect x="205" y="150" width="175" height="120" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="292" y="172" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">G: Smith visibility</text>
<text x="292" y="196" text-anchor="middle" font-size="11" fill="#374151">self-shadowing of microfacets,</text>
<text x="292" y="214" text-anchor="middle" font-size="11" fill="#374151">depends on N.L, N.V, alpha</text>
<line x1="292.0" y1="106.0" x2="292.0" y2="150.0" stroke="#4B5563" stroke-width="1.2" marker-end="url(#pb)"/>
<rect x="380" y="150" width="175" height="120" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="467" y="172" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">F: Fresnel-Schlick</text>
<text x="467" y="196" text-anchor="middle" font-size="11" fill="#374151">F0 + (1 - F0)(1 - V.H)^5</text>
<text x="467" y="214" text-anchor="middle" font-size="11" fill="#374151">F0: 0.04 toward baseColor</text>
<line x1="467.0" y1="106.0" x2="467.0" y2="150.0" stroke="#4B5563" stroke-width="1.2" marker-end="url(#pb)"/>
<rect x="555" y="150" width="175" height="120" rx="10" fill="#F9FAFB" stroke="#374151" stroke-width="1.5"/>
<text x="642" y="172" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Diffuse: Lambert</text>
<text x="642" y="196" text-anchor="middle" font-size="11" fill="#374151">baseColor / pi</text>
<text x="642" y="214" text-anchor="middle" font-size="11" fill="#374151">scaled by (1 - metallic)</text>
<line x1="642.0" y1="106.0" x2="642.0" y2="150.0" stroke="#4B5563" stroke-width="1.2" marker-end="url(#pb)"/>
<circle cx="80.0" cy="300.0" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="80" y="304.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<text x="100" y="304" text-anchor="start" font-size="11" fill="#374151">Inputs: baseColor, metallic, roughness, normal</text>
<circle cx="80.0" cy="330.0" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="80" y="334.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<text x="100" y="334" text-anchor="start" font-size="11" fill="#374151">Light: radiance * N.L from each light, plus image-based lighting for ambient</text>
<circle cx="80.0" cy="360.0" r="11" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="80" y="364.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<text x="100" y="364" text-anchor="start" font-size="11" fill="#374151">Then add emissive, then tone map and encode to sRGB</text>
</svg>
