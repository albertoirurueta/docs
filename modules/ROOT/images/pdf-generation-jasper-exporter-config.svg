<svg viewBox="0 0 900 640" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">JRPdfExporter and its configuration objects (JasperReports 7.0.8)</text>
  <rect x="20" y="50" width="230" height="84" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <text x="135" y="72" font-size="12" font-family="Courier New, monospace" font-weight="700" fill="#1f5fa6" text-anchor="middle">SimpleExporterInput</text>
  <text x="135" y="92" font-size="11" font-family="Courier New, monospace" fill="#333" text-anchor="middle">implements ExporterInput</text>
  <text x="135" y="110" font-size="10.5"  fill="#1f5fa6" text-anchor="middle">wraps one or more JasperPrint</text>
  <text x="135" y="125" font-size="10.5"  fill="#1f5fa6" text-anchor="middle">(batch mode: getInstance(list))</text>
  <rect x="335" y="50" width="230" height="84" rx="6" fill="#f3e5f9" stroke="#7a2b8f" stroke-width="1.4"/>
  <text x="450" y="72" font-size="12" font-family="Courier New, monospace" font-weight="700" fill="#7a2b8f" text-anchor="middle">JRPdfExporter</text>
  <text x="450" y="92" font-size="11" font-family="Courier New, monospace" fill="#333" text-anchor="middle">net.sf.jasperreports.pdf</text>
  <text x="450" y="110" font-size="11" font-family="Courier New, monospace" fill="#333" text-anchor="middle">extends JRAbstractExporter</text>
  <text x="450" y="125" font-size="11" font-family="Courier New, monospace" fill="#333" text-anchor="middle">exportReport()</text>
  <rect x="650" y="50" width="230" height="84" rx="6" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.4"/>
  <text x="765" y="72" font-size="10.5" font-family="Courier New, monospace" font-weight="700" fill="#2b7a2b" text-anchor="middle">SimpleOutputStreamExporterOutput</text>
  <text x="765" y="92" font-size="9.5" font-family="Courier New, monospace" fill="#333" text-anchor="middle">implements OutputStreamExporterOutput</text>
  <text x="765" y="110" font-size="10.5"  fill="#2b7a2b" text-anchor="middle">File, file name or OutputStream</text>
  <text x="765" y="125" font-size="10.5"  fill="#2b7a2b" text-anchor="middle">(a stream you pass is not closed)</text>
  <line x1="250" y1="92" x2="333" y2="92" stroke="#555" stroke-width="1.5" marker-end="url(#ec-arrow)"/>
  <line x1="565" y1="92" x2="648" y2="92" stroke="#555" stroke-width="1.5" marker-end="url(#ec-arrow)"/>
  <text x="292" y="84" font-size="10.5"  fill="#555" text-anchor="middle">input</text>
  <text x="607" y="84" font-size="10.5"  fill="#555" text-anchor="middle">output</text>
  <rect x="20" y="190" width="430" height="240" rx="6" fill="#fff3d6" stroke="#b36b00" stroke-width="1.4"/>
  <rect x="470" y="190" width="410" height="240" rx="6" fill="#fff3d6" stroke="#b36b00" stroke-width="1.4"/>
  <line x1="400" y1="134" x2="235" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#ec-arrow)"/>
  <line x1="500" y1="134" x2="675" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#ec-arrow)"/>
  <text x="235" y="166" font-size="10.5"  fill="#555" text-anchor="middle">setConfiguration(...)</text>
  <text x="680" y="166" font-size="10.5"  fill="#555" text-anchor="middle">setConfiguration(...)</text>
  <text x="235" y="212" font-size="12" font-family="Courier New, monospace" font-weight="700" fill="#b36b00" text-anchor="middle">SimplePdfExporterConfiguration</text>
  <text x="235" y="230" font-size="10.5"  fill="#b36b00" text-anchor="middle">implements PdfExporterConfiguration: once per document</text>
  <text x="34" y="254" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">metadataTitle / Author / Subject / Keywords / Creator / Producer</text>
  <text x="34" y="271" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">displayMetadataTitle, pdfVersion (1.2 to 1.7), compressed</text>
  <text x="34" y="288" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">encrypted, 128BitKey, userPassword, ownerPassword,</text>
  <text x="34" y="305" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">permissions, allowedPermissionsHint, deniedPermissionsHint</text>
  <text x="34" y="322" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">pdfJavaScript, printScaling (default or none)</text>
  <text x="34" y="339" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">useCMYKColors, iccProfilePath, embedIccProfile</text>
  <text x="34" y="356" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">pdfaConformance (pdfa1a to pdfa3u)</text>
  <text x="34" y="373" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">tagged, tagLanguage</text>
  <text x="34" y="390" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">creatingBatchModeBookmarks</text>
  <text x="34" y="407" font-size="10" font-family="Courier New, monospace" fill="#333" text-anchor="start">overrideHints (from SimpleCommonExportConfiguration)</text>
  <text x="675" y="212" font-size="12" font-family="Courier New, monospace" font-weight="700" fill="#b36b00" text-anchor="middle">SimplePdfReportConfiguration</text>
  <text x="675" y="230" font-size="10.5"  fill="#b36b00" text-anchor="middle">implements PdfReportConfiguration: once per exported report</text>
  <text x="484" y="254" font-size="10.5" font-family="Courier New, monospace" fill="#333" text-anchor="start">bookmarksEnabled, collapseMissingBookmarkLevels</text>
  <text x="484" y="271" font-size="10.5" font-family="Courier New, monospace" fill="#333" text-anchor="start">pageIndex, startPageIndex, endPageIndex</text>
  <text x="484" y="288" font-size="10.5" font-family="Courier New, monospace" fill="#333" text-anchor="start">offsetX, offsetY, odd and even page offsets</text>
  <text x="484" y="305" font-size="10.5" font-family="Courier New, monospace" fill="#333" text-anchor="start">sizePageToContent, forceSvgShapes</text>
  <text x="484" y="322" font-size="10.5" font-family="Courier New, monospace" fill="#333" text-anchor="start">ignoreHyperlink, forceLineBreakPolicy</text>
  <text x="484" y="339" font-size="10.5" font-family="Courier New, monospace" fill="#333" text-anchor="start">exporterFilter, hyperlinkProducerFactory,</text>
  <text x="484" y="356" font-size="10.5" font-family="Courier New, monospace" fill="#333" text-anchor="start">progressMonitor</text>
  <text x="484" y="373" font-size="10.5" font-family="Courier New, monospace" fill="#333" text-anchor="start">overrideHints (from SimpleCommonExportConfiguration)</text>
  <text x="20" y="462" font-size="12"  font-weight="700" fill="#1a1a1a" text-anchor="start">Resolved from the JasperReportsContext (jasperreports.properties, SimpleJasperReportsContext)</text>
  <rect x="20" y="474" width="430" height="150" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.4"/>
  <rect x="470" y="474" width="410" height="150" rx="6" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.4"/>
  <text x="235" y="496" font-size="10.5" font-family="Courier New, monospace" font-weight="700" fill="#1f5fa6" text-anchor="middle">net.sf.jasperreports.export.pdf.producer.factory</text>
  <text x="235" y="516" font-size="11" font-family="Courier New, monospace" fill="#333" text-anchor="middle">PdfProducerFactory</text>
  <text x="235" y="536" font-size="11" font-family="Courier New, monospace" fill="#333" text-anchor="middle">default: ClassicPdfProducerFactory</text>
  <line x1="235" y1="544" x2="235" y2="562" stroke="#555" stroke-width="1.5" marker-end="url(#ec-arrow)"/>
  <text x="235" y="580" font-size="11" font-family="Courier New, monospace" font-weight="700" fill="#333" text-anchor="middle">OpenPDF 1.3.43.jaspersoft.2</text>
  <text x="235" y="598" font-size="10.5"  fill="#1f5fa6" text-anchor="middle">(package com.lowagie.text.pdf, bundled by jasperreports-pdf)</text>
  <text x="235" y="614" font-size="10.5"  fill="#1f5fa6" text-anchor="middle">writes the PDF bytes</text>
  <text x="675" y="496" font-size="10.5" font-family="Courier New, monospace" font-weight="700" fill="#2b7a2b" text-anchor="middle">net.sf.jasperreports.export.pdf.tagger.factory</text>
  <text x="675" y="516" font-size="11" font-family="Courier New, monospace" fill="#333" text-anchor="middle">PdfTaggerFactory</text>
  <text x="675" y="536" font-size="11" font-family="Courier New, monospace" fill="#333" text-anchor="middle">default: DefaultPdfTaggerFactory</text>
  <text x="675" y="556" font-size="10.5"  fill="#2b7a2b" text-anchor="middle">tagged=true: raises an error (Community)</text>
  <text x="675" y="574" font-size="10.5"  fill="#2b7a2b" text-anchor="middle">SilentPdfTaggerFactory: no error, no tags</text>
  <text x="675" y="592" font-size="10.5"  fill="#2b7a2b" text-anchor="middle">Professional edition: real tagger (7.0.8)</text>
  <text x="675" y="610" font-size="10.5"  fill="#2b7a2b" text-anchor="middle">used for PDF/UA and the a levels of PDF/A</text>
</svg>
