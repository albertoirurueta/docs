<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">NumPy set operations on two overlapping sets</title>
  <desc id="d">Two overlapping circles A and B. The overlap is intersect1d, the left-only region is setdiff1d(A, B), the right-only region is setdiff1d(B, A), the union of everything is union1d and both outer regions together are setxor1d.</desc>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Which region each function returns</text>
  <circle cx="250" cy="180" r="100" fill="#DBEAFE" fill-opacity="0.85" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="370" cy="180" r="100" fill="#CCFBF1" fill-opacity="0.85" stroke="#0F766E" stroke-width="2"/>
  <path d="M310 93.4 A100 100 0 0 1 310 266.6 A100 100 0 0 1 310 93.4 Z" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0F172A" text-anchor="middle">
    <text x="190" y="140" font-size="16" font-weight="bold">A</text>
    <text x="430" y="140" font-size="16" font-weight="bold">B</text>
  </g>
  <circle cx="200" cy="182" r="11" fill="#0F172A"/><text x="200" y="187" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="420" cy="182" r="11" fill="#0F172A"/><text x="420" y="187" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
  <circle cx="310" cy="180" r="11" fill="#0F172A"/><text x="310" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#0F172A">
    <text x="500" y="90">1  setdiff1d(A, B)</text>
    <text x="500" y="116">2  setdiff1d(B, A)</text>
    <text x="500" y="142">3  intersect1d(A, B)</text>
    <text x="500" y="178">1 + 2  setxor1d(A, B)</text>
    <text x="500" y="204">1 + 2 + 3  union1d(A, B)</text>
  </g>
  <text x="24" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">All five return sorted, de-duplicated 1-D arrays.</text>
</svg>
