<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">File tree of a PrestaShop module</title>
  <desc id="d">The folder modules/pcfcbasics contains the main PHP file named after the module, config.xml, logo.png, composer.json, src, upgrade, views, translations and vendor folders, and optional config, controllers and override folders; every folder has an index.php stub.</desc>
  <text x="20" y="32" font-weight="bold" font-size="16">Module Pocket Coffee roast batches (pcfcbasics) on disk</text>
  <text x="20" y="52" font-size="12" opacity="0.8">Left: path. Right: what PrestaShop does with it.</text>
  <rect x="20" y="70" width="300" height="24" rx="5" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="30" y="87" font-family="Menlo, Consolas, monospace" font-size="12">modules/pcfcbasics/</text>
  <text x="350" y="87">Folder name = technical name = main file = $this->name</text>
  <rect x="54" y="100" width="266" height="24" rx="5" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="117" font-family="Menlo, Consolas, monospace" font-size="12">pcfcbasics.php</text>
  <text x="350" y="117">Main class Pcfcbasics extends Module (required)</text>
  <path d="M40 94 V112 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="130" width="266" height="24" rx="5" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="147" font-family="Menlo, Consolas, monospace" font-size="12">config.xml</text>
  <text x="350" y="147">Cached properties: generated when the module list is built</text>
  <path d="M40 124 V142 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="160" width="266" height="24" rx="5" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="177" font-family="Menlo, Consolas, monospace" font-size="12">logo.png</text>
  <text x="350" y="177">32 x 32 PNG shown in the module manager</text>
  <path d="M40 154 V172 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="190" width="266" height="24" rx="5" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="207" font-family="Menlo, Consolas, monospace" font-size="12">composer.json</text>
  <text x="350" y="207">PSR-4 autoload, prepend-autoloader false</text>
  <path d="M40 184 V202 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="220" width="266" height="24" rx="5" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="237" font-family="Menlo, Consolas, monospace" font-size="12">index.php</text>
  <text x="350" y="237">Redirect stub: one in every folder</text>
  <path d="M40 214 V232 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="250" width="266" height="24" rx="5" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="267" font-family="Menlo, Consolas, monospace" font-size="12">src/</text>
  <text x="350" y="267">Namespaced classes (Install/Installer.php)</text>
  <path d="M40 244 V262 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="280" width="266" height="24" rx="5" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="297" font-family="Menlo, Consolas, monospace" font-size="12">upgrade/</text>
  <text x="350" y="297">upgrade-1.1.0.php runs once per version bump</text>
  <path d="M40 274 V292 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="310" width="266" height="24" rx="5" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="327" font-family="Menlo, Consolas, monospace" font-size="12">views/</text>
  <text x="350" y="327">css/ js/ img/ and templates/{hook,front,admin}</text>
  <path d="M40 304 V322 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="340" width="266" height="24" rx="5" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="357" font-family="Menlo, Consolas, monospace" font-size="12">translations/</text>
  <text x="350" y="357">XLF files for the new translation system</text>
  <path d="M40 334 V352 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="370" width="266" height="24" rx="5" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="387" font-family="Menlo, Consolas, monospace" font-size="12">vendor/</text>
  <text x="350" y="387">Composer autoloader, shipped in the release zip</text>
  <path d="M40 364 V382 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="54" y="400" width="266" height="24" rx="5" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor" stroke-width="1"/>
  <text x="64" y="417" font-family="Menlo, Consolas, monospace" font-size="12">config/ controllers/ override/</text>
  <text x="350" y="417">Optional: services and routes, legacy controllers, overrides</text>
  <path d="M40 394 V412 H54" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <rect x="20" y="444" width="16" height="16" rx="3" fill="#3498db" fill-opacity="0.18" stroke="currentColor"/>
  <text x="44" y="457" font-size="12">folder</text>
  <rect x="132" y="444" width="16" height="16" rx="3" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor"/>
  <text x="156" y="457" font-size="12">file you write</text>
  <rect x="300" y="444" width="16" height="16" rx="3" fill="#e67e22" fill-opacity="0.18" stroke="currentColor"/>
  <text x="324" y="457" font-size="12">generated by PrestaShop</text>
  <rect x="531" y="444" width="16" height="16" rx="3" fill="#9b59b6" fill-opacity="0.18" stroke="currentColor"/>
  <text x="555" y="457" font-size="12">optional folders</text>
</svg>
