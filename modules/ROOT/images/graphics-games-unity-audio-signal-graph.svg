<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-unity-audio-graph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The audio signal path of the Bookshelf</text>
<text x="100" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Audio Sources</text>
<text x="360" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Audio Mixer asset</text>
<text x="650" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Output</text>
<rect x="20" y="75" width="160" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100" y="97" text-anchor="middle" font-size="12" fill="#3730A3">BookSfx (3D)</text>
<text x="100" y="113" text-anchor="middle" font-size="11" fill="#3730A3">PlayOneShot, pitch jitter</text>
<rect x="20" y="145" width="160" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100" y="167" text-anchor="middle" font-size="12" fill="#3730A3">Room tone (3D)</text>
<text x="100" y="183" text-anchor="middle" font-size="11" fill="#3730A3">looping clip near the lamp</text>
<rect x="20" y="215" width="160" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100" y="237" text-anchor="middle" font-size="12" fill="#3730A3">Music A and Music B (2D)</text>
<text x="100" y="253" text-anchor="middle" font-size="11" fill="#3730A3">crossfaded by volume</text>
<rect x="20" y="285" width="160" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="100" y="307" text-anchor="middle" font-size="12" fill="#3730A3">Menu clicks (2D)</text>
<text x="100" y="323" text-anchor="middle" font-size="11" fill="#3730A3">UI sounds</text>
<rect x="250" y="70" width="220" height="290" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<rect x="270" y="85" width="180" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="360" y="103" text-anchor="middle" font-size="12" fill="#92400E">Master</text>
<text x="360" y="118" text-anchor="middle" font-size="10" fill="#92400E">attenuation, limiter</text>
<rect x="270" y="150" width="180" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="360" y="168" text-anchor="middle" font-size="12" fill="#3730A3">SFX</text>
<text x="360" y="183" text-anchor="middle" font-size="10" fill="#3730A3">exposed: SfxVolume</text>
<rect x="270" y="205" width="180" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="360" y="223" text-anchor="middle" font-size="12" fill="#3730A3">Ambience</text>
<text x="360" y="238" text-anchor="middle" font-size="10" fill="#3730A3">low-pass in the Paused snapshot</text>
<rect x="270" y="260" width="180" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="360" y="278" text-anchor="middle" font-size="12" fill="#3730A3">Music</text>
<text x="360" y="293" text-anchor="middle" font-size="10" fill="#3730A3">exposed: MusicVolume</text>
<text x="360" y="325" text-anchor="middle" font-size="11" fill="#374151">Snapshots: Playing, Paused</text>
<text x="360" y="342" text-anchor="middle" font-size="11" fill="#374151">child groups feed the Master group</text>
<rect x="540" y="100" width="220" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="650" y="122" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Audio Listener</text>
<text x="650" y="138" text-anchor="middle" font-size="11" fill="#374151">on the camera, one per scene</text>
<rect x="540" y="200" width="220" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="650" y="222" text-anchor="middle" font-size="12" fill="#374151">Speakers or headphones</text>
<text x="650" y="238" text-anchor="middle" font-size="11" fill="#374151">speaker mode: stereo by default</text>
<line x1="180" y1="100" x2="270" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-audio-graph)"/>
<line x1="180" y1="170" x2="270" y2="225" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-audio-graph)"/>
<line x1="180" y1="240" x2="270" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-audio-graph)"/>
<line x1="180" y1="310" x2="270" y2="170" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-unity-audio-graph)"/>
<line x1="450" y1="105" x2="540" y2="122" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-unity-audio-graph)"/>
<line x1="650" y1="150" x2="650" y2="200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-audio-graph)"/>
<rect x="20" y="365" width="720" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="383" text-anchor="middle" font-size="11" fill="#92400E">Distance attenuation, Doppler and panning are applied at the Audio Source, before the signal enters the mixer.</text>
<text x="380" y="398" text-anchor="middle" font-size="11" fill="#92400E">The mixer mixes categories of sound; it does not know where anything is in the scene.</text>
</svg>
