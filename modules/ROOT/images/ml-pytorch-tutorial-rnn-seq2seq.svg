<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
<title id="t">Sequence-to-sequence with additive attention</title>
<desc id="d">An encoder GRU reads the source tokens and produces one output vector per position plus a final hidden state. At each decoding step the decoder hidden state scores all encoder outputs, a softmax gives attention weights, the weighted sum is the context vector, and the context is concatenated with the embedded previous token as the GRU input that predicts the next token.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Encoder, attention and decoder</text>
<text x="20" y="62" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">Encoder</text>
<rect x="20" y="70" width="70" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="55" y="93" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x1</text>
<rect x="105" y="70" width="70" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="140" y="93" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x2</text>
<rect x="190" y="70" width="70" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="225" y="93" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">x3</text>
<rect x="20" y="130" width="240" height="36" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="140" y="153" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">GRU over the source (embedding first)</text>
<line x1="55" y1="106" x2="55" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="140" y1="106" x2="140" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="225" y1="106" x2="225" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="196" width="70" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="55" y="219" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">o1</text>
<rect x="105" y="196" width="70" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="140" y="219" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">o2</text>
<rect x="190" y="196" width="70" height="36" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="225" y="219" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">o3</text>
<line x1="55" y1="166" x2="55" y2="194" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="140" y1="166" x2="140" y2="194" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="225" y1="166" x2="225" y2="194" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="140" y="254" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">encoder outputs (keys and values)</text>
<text x="320" y="62" font-size="13" fill="#475569" font-family="Arial, Helvetica, sans-serif">One decoder step</text>
<rect x="320" y="70" width="170" height="44" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="405" y="89" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">score(h, o_i), softmax</text>
<text x="405" y="105" font-size="12" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">attention weights</text>
<rect x="320" y="140" width="170" height="36" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="405" y="163" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">context = sum w_i o_i</text>
<rect x="520" y="140" width="180" height="36" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="610" y="156" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">GRU( [emb(prev); context] )</text>
<text x="610" y="170" font-size="11" fill="#475569" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">new hidden state h</text>
<rect x="520" y="196" width="180" height="36" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
<text x="610" y="219" font-size="12" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Linear to vocabulary logits</text>
<line x1="405" y1="114" x2="405" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="490" y1="158" x2="518" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="610" y1="176" x2="610" y2="194" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<path d="M260,214 L300,214 L300,92 L318,92" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="20" y="284" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Dashed: the encoder outputs are read at every decoding step. The previous hidden state h is the query.</text>
<text x="20" y="304" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Redrawn from the architecture described in the PyTorch seq2seq translation tutorial.</text>
</svg>
