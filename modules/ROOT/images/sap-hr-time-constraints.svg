<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">Validity periods of records under time constraints 1, 2, 3, A or B and T, drawn as bars on one time axis</title>
  <desc id="d">A time axis runs from 01.01.2024 to 01.01.2028. Time constraint 1: the Organizational Assignment (0001) records of Ana Torres, 01.03.2024 to 30.06.2026 and 01.07.2026 to 31.12.9999, follow each other with no gap and no overlap. Time constraint 2: at most one record at a time, so records may leave gaps but never overlap; the bars are example values. Time constraint 3: any number of records at the same time, so two powers of attorney, 01.01.2025 to 31.12.2025 and 01.06.2025 to 31.12.9999, overlap; the dates are example values. Time constraints A and B: one record only, valid from 01.01.1800 to 31.12.9999, which cannot be split. Time constraint T: the constraint depends on the subtype, so a main address with no gap and a temporary residence record that exists only for a while can coexist. All dates are invented example values.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="10" y="32" text-anchor="start" font-size="12" font-weight="bold">Dates on the axis</text>
  <line x1="250" y1="40" x2="250" y2="534" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="250" y="32" text-anchor="middle" font-size="12">01.01.2024</text>
  <line x1="448" y1="40" x2="448" y2="534" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="448" y="32" text-anchor="middle" font-size="12">01.01.2025</text>
  <line x1="645" y1="40" x2="645" y2="534" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="645" y="32" text-anchor="middle" font-size="12">01.01.2026</text>
  <line x1="843" y1="40" x2="843" y2="534" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="843" y="32" text-anchor="middle" font-size="12">01.01.2027</text>
  <line x1="1040" y1="40" x2="1040" y2="534" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1040" y="32" text-anchor="end" font-size="12">01.01.2028</text>
  <rect x="10" y="50" width="225" height="70" rx="10" fill="#7873f5" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="122.5" y="71" text-anchor="middle" font-size="13" font-weight="bold">Time constraint 1</text>
  <text x="122.5" y="89" text-anchor="middle" font-size="11">Organizational Assignment (0001)</text>
  <text x="122.5" y="107" text-anchor="middle" font-size="11">of Ana Torres</text>
  <rect x="282" y="60" width="461" height="28" rx="6" fill="#7873f5" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="512.5" y="78" text-anchor="middle" font-size="12">01.03.2024 - 30.06.2026</text>
  <rect x="743" y="60" width="297" height="28" rx="6" fill="#7873f5" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="891.5" y="78" text-anchor="middle" font-size="12">01.07.2026 - 31.12.9999</text>
  <path d="M1028 69 L1035 74 L1028 79" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="260" y="112" text-anchor="start" font-size="11">no gap and no overlap: one record is valid on every day from the hiring</text>
  <rect x="10" y="130" width="225" height="70" rx="10" fill="#b76fe0" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="122.5" y="151" text-anchor="middle" font-size="13" font-weight="bold">Time constraint 2</text>
  <text x="122.5" y="169" text-anchor="middle" font-size="11">at most one record at a time</text>
  <text x="122.5" y="187" text-anchor="middle" font-size="11">example values</text>
  <rect x="332" y="136" width="116" height="34" rx="6" fill="#b76fe0" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="390" y="150" text-anchor="middle" font-size="11">01.06.2024</text>
  <text x="390" y="164" text-anchor="middle" font-size="11">31.12.2024</text>
  <rect x="497" y="136" width="99" height="34" rx="6" fill="#b76fe0" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="546.5" y="150" text-anchor="middle" font-size="11">01.04.2025</text>
  <text x="546.5" y="164" text-anchor="middle" font-size="11">30.09.2025</text>
  <text x="454" y="157" text-anchor="start" font-size="11">gap allowed</text>
  <text x="260" y="192" text-anchor="start" font-size="11">gaps are allowed, overlaps are not</text>
  <rect x="10" y="210" width="225" height="90" rx="10" fill="#ff6ec4" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="122.5" y="241" text-anchor="middle" font-size="13" font-weight="bold">Time constraint 3</text>
  <text x="122.5" y="259" text-anchor="middle" font-size="11">any number of records at once</text>
  <text x="122.5" y="277" text-anchor="middle" font-size="11">Powers of Attorney (0030)</text>
  <rect x="448" y="220" width="197" height="24" rx="6" fill="#ff6ec4" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="546.5" y="236" text-anchor="middle" font-size="12">01.01.2025 - 31.12.2025</text>
  <rect x="530" y="250" width="510" height="24" rx="6" fill="#ff6ec4" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="785" y="266" text-anchor="middle" font-size="12">01.06.2025 - 31.12.9999</text>
  <path d="M1028 257 L1035 262 L1028 267" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="260" y="292" text-anchor="start" font-size="11">overlaps are allowed, and no record has to exist (example dates)</text>
  <rect x="10" y="310" width="225" height="70" rx="10" fill="#2fbf71" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="122.5" y="331" text-anchor="middle" font-size="13" font-weight="bold">Time constraints A and B</text>
  <text x="122.5" y="349" text-anchor="middle" font-size="11">one record in total</text>
  <text x="122.5" y="367" text-anchor="middle" font-size="11">B can be deleted, A cannot</text>
  <rect x="250" y="320" width="790" height="28" rx="6" fill="#2fbf71" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="645" y="338" text-anchor="middle" font-size="12">01.01.1800 - 31.12.9999, cannot be split</text>
  <path d="M1028 329 L1035 334 L1028 339" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <path d="M262 329 L255 334 L262 339" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="260" y="372" text-anchor="start" font-size="11">the system sets this validity itself</text>
  <rect x="10" y="390" width="225" height="130" rx="10" fill="#4fa3c8" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
  <text x="122.5" y="441" text-anchor="middle" font-size="13" font-weight="bold">Time constraint T</text>
  <text x="122.5" y="459" text-anchor="middle" font-size="11">depends on the subtype</text>
  <text x="122.5" y="477" text-anchor="middle" font-size="11">Addresses (0006)</text>
  <text x="260" y="408" text-anchor="start" font-size="11">main address: always one record</text>
  <rect x="282" y="414" width="281" height="24" rx="6" fill="#4fa3c8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="422.5" y="430" text-anchor="middle" font-size="12">01.03.2024 - 31.07.2025</text>
  <rect x="563" y="414" width="477" height="24" rx="6" fill="#4fa3c8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="801.5" y="430" text-anchor="middle" font-size="12">01.08.2025 - 31.12.9999</text>
  <path d="M1028 421 L1035 426 L1028 431" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="260" y="466" text-anchor="start" font-size="11">temporary residence: optional, may come and go</text>
  <rect x="662" y="472" width="115" height="34" rx="6" fill="#4fa3c8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
  <text x="719.5" y="486" text-anchor="middle" font-size="11">01.02.2026</text>
  <text x="719.5" y="500" text-anchor="middle" font-size="11">31.08.2026</text>
  <text x="540" y="552" text-anchor="middle" font-size="11">All dates are invented example values; the records of Ana Torres extend the running example of Example Trading Co.</text>
</svg>
