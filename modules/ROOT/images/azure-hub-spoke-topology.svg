<svg viewBox="0 0 800 620" width="800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="620" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Bookshelf network: hub-spoke-lite topology</text>
  <text x="400" y="44" text-anchor="middle" font-size="11" fill="#5f6368">vnet-hub-bookshelf (10.0.0.0/23) peered with vnet-bookshelf (10.1.0.0/16), eastus2</text>

  <!-- Hub VNet -->
  <rect x="24" y="66" width="300" height="500" rx="10" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="40" y="88" font-size="13" font-weight="700" fill="#173d73">vnet-hub-bookshelf</text>
  <text x="40" y="103" font-size="10" fill="#3c4043">10.0.0.0/23 -- shared perimeter</text>

  <!-- AzureFirewallSubnet -->
  <rect x="40" y="116" width="268" height="82" rx="7" fill="#fde9e9" stroke="#b3261e" stroke-width="1.2"/>
  <text x="52" y="134" font-size="11" font-weight="700" fill="#7a1a15">AzureFirewallSubnet</text>
  <text x="52" y="149" font-size="9.5" fill="#5f2420">10.0.0.0/26</text>
  <rect x="52" y="156" width="120" height="34" rx="5" fill="#ffffff" stroke="#b3261e" stroke-width="1"/>
  <text x="112" y="177" text-anchor="middle" font-size="9.5" fill="#7a1a15">fw-bookshelf</text>
  <text x="222" y="177" text-anchor="middle" font-size="9" fill="#7a1a15">(Azure Firewall</text>
  <text x="222" y="189" text-anchor="middle" font-size="9" fill="#7a1a15">Standard, UDR next hop)</text>

  <!-- AzureBastionSubnet -->
  <rect x="40" y="208" width="268" height="82" rx="7" fill="#e6f4ea" stroke="#188038" stroke-width="1.2"/>
  <text x="52" y="226" font-size="11" font-weight="700" fill="#0d4c22">AzureBastionSubnet</text>
  <text x="52" y="241" font-size="9.5" fill="#0d4c22">10.0.1.0/26</text>
  <rect x="52" y="248" width="120" height="34" rx="5" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="112" y="269" text-anchor="middle" font-size="9.5" fill="#0d4c22">bas-bookshelf</text>
  <text x="222" y="269" text-anchor="middle" font-size="9" fill="#0d4c22">(Azure Bastion</text>
  <text x="222" y="281" text-anchor="middle" font-size="9" fill="#0d4c22">Standard SKU)</text>

  <!-- GatewaySubnet -->
  <rect x="40" y="300" width="268" height="82" rx="7" fill="#fdf0d5" stroke="#c77c00" stroke-width="1.2"/>
  <text x="52" y="318" font-size="11" font-weight="700" fill="#7a4a00">GatewaySubnet</text>
  <text x="52" y="333" font-size="9.5" fill="#7a4a00">10.0.1.64/27</text>
  <rect x="52" y="340" width="120" height="34" rx="5" fill="#ffffff" stroke="#c77c00" stroke-width="1"/>
  <text x="112" y="361" text-anchor="middle" font-size="9.5" fill="#7a4a00">vgw-bookshelf</text>
  <text x="222" y="361" text-anchor="middle" font-size="9" fill="#7a4a00">(VPN Gateway,</text>
  <text x="222" y="373" text-anchor="middle" font-size="9" fill="#7a4a00">VpnGw2AZ)</text>

  <!-- On-prem cloud (left of hub, connects to gateway) -->
  <rect x="40" y="480" width="268" height="66" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="174" y="502" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3c4043">On-premises / admin laptop</text>
  <text x="174" y="518" text-anchor="middle" font-size="9" fill="#5f6368">S2S or P2S VPN client</text>
  <text x="174" y="533" text-anchor="middle" font-size="9" fill="#5f6368">reaches private endpoints via peering</text>

  <line x1="174" y1="480" x2="174" y2="382" stroke="#c77c00" stroke-width="1.6"/>

  <!-- Internet bubble above firewall -->
  <ellipse cx="174" cy="590" rx="70" ry="20" fill="#e8eaed" stroke="#5f6368" stroke-width="1"/>
  <text x="174" y="595" text-anchor="middle" font-size="10" fill="#3c4043">Internet</text>
  <line x1="174" y1="570" x2="112" y2="190" stroke="#188038" stroke-width="1.4"/>
  <text x="90" y="440" font-size="8.5" fill="#5f6368" transform="rotate(-84 90 440)">Bastion public IP</text>

  <!-- Peering connector -->
  <g>
    <line x1="324" y1="230" x2="452" y2="230" stroke="#8430ce" stroke-width="2.2"/>
    <line x1="324" y1="250" x2="452" y2="250" stroke="#8430ce" stroke-width="2.2"/>
    <text x="388" y="222" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5a1a99">VNet peering</text>
    <text x="388" y="266" text-anchor="middle" font-size="8.5" fill="#5a1a99">non-transitive, "allow forwarded</text>
    <text x="388" y="278" text-anchor="middle" font-size="8.5" fill="#5a1a99">traffic" both ways</text>
  </g>

  <!-- Spoke VNet -->
  <rect x="452" y="66" width="324" height="500" rx="10" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="468" y="88" font-size="13" font-weight="700" fill="#173d73">vnet-bookshelf</text>
  <text x="468" y="103" font-size="10" fill="#3c4043">10.1.0.0/16 -- workload spoke</text>

  <!-- apps subnet -->
  <rect x="468" y="116" width="292" height="140" rx="7" fill="#e6f4ea" stroke="#188038" stroke-width="1.2"/>
  <text x="480" y="134" font-size="11" font-weight="700" fill="#0d4c22">snet-apps (10.1.0.0/24)</text>
  <text x="480" y="149" font-size="9" fill="#0d4c22">delegated: Microsoft.App/environments</text>

  <rect x="480" y="158" width="126" height="86" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="543" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="#0d4c22">cae-bookshelf</text>
  <text x="543" y="192" text-anchor="middle" font-size="9" fill="#3c4043">catalog-api</text>
  <text x="543" y="206" text-anchor="middle" font-size="9" fill="#3c4043">orders-api</text>
  <text x="543" y="220" text-anchor="middle" font-size="9" fill="#3c4043">notifier (job)</text>
  <text x="543" y="238" text-anchor="middle" font-size="8.5" fill="#5f6368">VNet-integrated env.</text>

  <rect x="618" y="158" width="126" height="86" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1"/>
  <text x="681" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="#0d4c22">aks-bookshelf</text>
  <text x="681" y="192" text-anchor="middle" font-size="9" fill="#3c4043">node pool</text>
  <text x="681" y="206" text-anchor="middle" font-size="9" fill="#3c4043">(Azure CNI</text>
  <text x="681" y="220" text-anchor="middle" font-size="9" fill="#3c4043">Overlay)</text>
  <text x="681" y="238" text-anchor="middle" font-size="8.5" fill="#5f6368">NSG on subnet</text>

  <!-- data subnet -->
  <rect x="468" y="266" width="292" height="180" rx="7" fill="#f4e8fd" stroke="#8430ce" stroke-width="1.2"/>
  <text x="480" y="284" font-size="11" font-weight="700" fill="#5a1a99">snet-data (10.1.1.0/24)</text>
  <text x="480" y="299" font-size="9" fill="#5a1a99">private endpoints, NSG denies internet inbound</text>

  <rect x="480" y="308" width="82" height="120" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="521" y="326" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5a1a99">PE</text>
  <text x="521" y="342" text-anchor="middle" font-size="8.5" fill="#3c4043">pg-bookshelf</text>
  <text x="521" y="356" text-anchor="middle" font-size="8" fill="#5f6368">privatelink</text>
  <text x="521" y="368" text-anchor="middle" font-size="8" fill="#5f6368">.postgres</text>
  <text x="521" y="380" text-anchor="middle" font-size="8" fill="#5f6368">.database</text>
  <text x="521" y="392" text-anchor="middle" font-size="8" fill="#5f6368">.azure.com</text>

  <rect x="572" y="308" width="82" height="120" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="613" y="326" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5a1a99">PE</text>
  <text x="613" y="342" text-anchor="middle" font-size="8.5" fill="#3c4043">kv-bookshelf</text>
  <text x="613" y="356" text-anchor="middle" font-size="8" fill="#5f6368">privatelink</text>
  <text x="613" y="368" text-anchor="middle" font-size="8" fill="#5f6368">.vaultcore</text>
  <text x="613" y="380" text-anchor="middle" font-size="8" fill="#5f6368">.azure.net</text>

  <rect x="664" y="308" width="82" height="120" rx="6" fill="#ffffff" stroke="#8430ce" stroke-width="1"/>
  <text x="705" y="326" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5a1a99">PE</text>
  <text x="705" y="342" text-anchor="middle" font-size="8.5" fill="#3c4043">stbookshelf</text>
  <text x="705" y="356" text-anchor="middle" font-size="8" fill="#5f6368">privatelink</text>
  <text x="705" y="368" text-anchor="middle" font-size="8" fill="#5f6368">.blob.core</text>
  <text x="705" y="380" text-anchor="middle" font-size="8" fill="#5f6368">.windows.net</text>

  <text x="613" y="434" text-anchor="middle" font-size="8.5" fill="#5f6368">each PE registers into a linked privatelink.* private DNS zone</text>

  <!-- private DNS zone box -->
  <rect x="468" y="456" width="292" height="66" rx="7" fill="#fff8e1" stroke="#c77c00" stroke-width="1.2"/>
  <text x="614" y="476" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7a4a00">Private DNS zones (linked to both VNets)</text>
  <text x="614" y="492" text-anchor="middle" font-size="8.5" fill="#7a4a00">privatelink.postgres.database.azure.com</text>
  <text x="614" y="505" text-anchor="middle" font-size="8.5" fill="#7a4a00">privatelink.vaultcore.azure.net -- privatelink.blob.core.windows.net</text>

  <!-- UDR note -->
  <rect x="468" y="534" width="292" height="32" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1"/>
  <text x="614" y="554" text-anchor="middle" font-size="9" fill="#3c4043">UDR: 0.0.0.0/0 -&gt; fw-bookshelf (hub) as next hop</text>

  <text x="614" y="590" text-anchor="middle" font-size="9" fill="#5f6368">rg-bookshelf, region eastus2 (placeholder)</text>
</svg>
