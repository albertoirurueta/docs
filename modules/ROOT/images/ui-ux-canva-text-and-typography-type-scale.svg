<svg viewBox="0 0 760 442" width="760" height="442" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="442" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A type scale for the Bookshelf "Book of the week" post</text>
  <g font-size="12" fill="#6B7280"><text x="30" y="52">Role</text><text x="230" y="52">Sample (relative size, ratio 1.5 from body up to title)</text></g>
  <line x1="30" y1="148" x2="730" y2="148" stroke="#E5E7EB"/>
  <circle cx="40" cy="120" r="11" fill="#B45309"/><text x="40" y="124" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="62" y="124" font-size="13" fill="#374151">Display / Title (H1)</text><text x="62" y="140" font-size="11" fill="#6B7280">54 px</text>
  <text x="230" y="124" font-size="54" font-weight="bold" fill="#1F2937">Bookshelf</text>
  <line x1="30" y1="228" x2="730" y2="228" stroke="#E5E7EB"/>
  <circle cx="40" cy="200" r="11" fill="#4F46E5"/><text x="40" y="204" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="62" y="204" font-size="13" fill="#374151">Heading (H3)</text><text x="62" y="220" font-size="11" fill="#6B7280">36 px</text>
  <text x="230" y="204" font-size="36" font-weight="bold" fill="#1F2937">Book of the week</text>
  <line x1="30" y1="296" x2="730" y2="296" stroke="#E5E7EB"/>
  <circle cx="40" cy="268" r="11" fill="#4F46E5"/><text x="40" y="272" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="62" y="272" font-size="13" fill="#374151">Subheading (H4)</text><text x="62" y="288" font-size="11" fill="#6B7280">24 px</text>
  <text x="230" y="272" font-size="24" font-weight="bold" fill="#1F2937">The Overstory by Richard Powers</text>
  <line x1="30" y1="356" x2="730" y2="356" stroke="#E5E7EB"/>
  <circle cx="40" cy="328" r="11" fill="#4F46E5"/><text x="40" y="332" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="62" y="332" font-size="13" fill="#374151">Body</text><text x="62" y="348" font-size="11" fill="#6B7280">16 px</text>
  <text x="230" y="332" font-size="16" font-weight="normal" fill="#1F2937">Nine strangers, one forest, and a story about trees.</text>
  <line x1="30" y1="412" x2="730" y2="412" stroke="#E5E7EB"/>
  <circle cx="40" cy="384" r="11" fill="#4F46E5"/><text x="40" y="388" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="62" y="388" font-size="13" fill="#374151">Caption</text><text x="62" y="404" font-size="11" fill="#6B7280">12 px</text>
  <text x="230" y="388" font-size="12" font-weight="normal" fill="#1F2937">Shown in the app and in the catalogue</text>

  <text x="380" y="424" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
