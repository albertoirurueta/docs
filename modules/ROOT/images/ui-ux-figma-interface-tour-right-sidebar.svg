  <circle cx="60" cy="72" r="8" fill="#B45309"/><circle cx="80" cy="72" r="8" fill="#047857"/><rect x="170" y="62" width="86" height="20" rx="10" fill="#4F46E5"/><text x="213" y="76" font-size="11" fill="#FFFFFF" text-anchor="middle">Share</text>
  <rect x="52" y="96" width="100" height="22" rx="4" fill="#4F46E5"/><text x="102" y="111" font-size="11" fill="#FFFFFF" text-anchor="middle">Design</text>
