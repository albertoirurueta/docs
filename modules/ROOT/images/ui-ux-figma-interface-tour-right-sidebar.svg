<circle cx="190" cy="62" r="11" fill="#4F46E5"/><text x="190" y="66" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="52" cy="96" r="11" fill="#B45309"/><text x="52" y="100" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="256" cy="96" r="11" fill="#4F46E5"/><text x="256" y="100" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="40" cy="142" r="11" fill="#4F46E5"/><text x="40" y="146" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="300" y="80" font-size="12" fill="#374151">1  People in the file, Share and zoom/view options</text>
  <text x="300" y="112" font-size="12" fill="#374151">2  Design tab: position, layout, appearance of the selection</text>
  <text x="300" y="144" font-size="12" fill="#374151">3  Prototype tab: interactions, flows, device settings</text>
  <text x="300" y="176" font-size="12" fill="#374151">4  Sections change with the selection type:</text>
  <text x="316" y="194" font-size="12" fill="#374151">frame, text, component instance, vector</text>
  <text x="300" y="230" font-size="12" fill="#374151">Nothing selected: local styles and variables overview</text>
  <text x="300" y="260" font-size="12" fill="#374151">View-only users see Comment and Properties tabs;</text><text x="300" y="278" font-size="12" fill="#374151">Dev Mode replaces the panel with an inspect panel</text>
