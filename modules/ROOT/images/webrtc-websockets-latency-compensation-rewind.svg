<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Server-side rewind for lag compensation: the shooter's screen showed the target as it was at the render time, which is the downstream flight time plus the interpolation delay plus the upstream flight time before the shot arrives; the server rewinds the target by that amount, up to a 200 ms cap, so with 50 ms one-way latency the full 200 ms is available and with 100 ms one-way latency 100 ms is missing</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Lag compensation: how far the server rewinds the target</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">hitscan shot; the shooter aimed at what the screen showed; rewind = flight down + interpolation delay + flight up</text>

  <line x1="40" y1="120" x2="760" y2="120" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="760" y="140" font-size="10" fill="#555555" text-anchor="end">server time</text>
  <circle cx="680" cy="120" r="7" fill="#1565c0"/>
  <text x="680" y="104" font-size="11" font-weight="bold" fill="#0d3c75" text-anchor="middle">shot arrives</text>
  <line x1="680" y1="127" x2="680" y2="150" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="30" y="178" font-size="12" font-weight="bold" fill="#222222">50 ms one way (RTT 100 ms)</text>
  <rect x="280" y="188" width="100" height="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="330" y="205" font-size="10.5" fill="#0d3c75" text-anchor="middle">snapshot flight 50</text>
  <rect x="380" y="188" width="200" height="26" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="480" y="205" font-size="10.5" fill="#1b4d1f" text-anchor="middle">interpolation delay 100</text>
  <rect x="580" y="188" width="100" height="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="630" y="205" font-size="10.5" fill="#0d3c75" text-anchor="middle">shot flight 50</text>
  <line x1="280" y1="226" x2="680" y2="226" stroke="#2e7d32" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="480" y="244" font-size="11" font-weight="bold" fill="#1b4d1f" text-anchor="middle">rewind 200 ms: exactly the cap, the shot hits what the shooter saw</text>

  <text x="30" y="290" font-size="12" font-weight="bold" fill="#222222">100 ms one way (RTT 200 ms)</text>
  <rect x="80" y="300" width="200" height="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="180" y="317" font-size="10.5" fill="#0d3c75" text-anchor="middle">snapshot flight 100</text>
  <rect x="280" y="300" width="200" height="26" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="380" y="317" font-size="10.5" fill="#1b4d1f" text-anchor="middle">interpolation delay 100</text>
  <rect x="480" y="300" width="200" height="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="580" y="317" font-size="10.5" fill="#0d3c75" text-anchor="middle">shot flight 100</text>
  <line x1="80" y1="340" x2="280" y2="340" stroke="#c62828" stroke-width="2.5" stroke-dasharray="5 3" marker-start="url(#a)"/>
  <text x="180" y="360" font-size="10.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">100 ms short: not rewound</text>
  <line x1="280" y1="340" x2="680" y2="340" stroke="#2e7d32" stroke-width="3" marker-end="url(#a)"/>
  <text x="480" y="360" font-size="10.5" fill="#1b4d1f" text-anchor="middle">rewind allowed: 200 ms (the cap)</text>
  <text x="180" y="384" font-size="10.5" fill="#7f1d1d" text-anchor="middle">the target is judged where it was 200 ms ago,</text>
  <text x="180" y="398" font-size="10.5" fill="#7f1d1d" text-anchor="middle">so the shooter's shot at the screen position misses</text>

  <line x1="280" y1="150" x2="280" y2="372" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="288" y="164" font-size="10.5" font-weight="bold" fill="#7f1d1d">cap: shot arrival - 200 ms</text>

  <text x="400" y="424" font-size="10.5" fill="#555555" text-anchor="middle">the cap protects other players: a target is never judged more than 200 ms (about 48 px at 240 px/s) behind its own screen</text>
</svg>
