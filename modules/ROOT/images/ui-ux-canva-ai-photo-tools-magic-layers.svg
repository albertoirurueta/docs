<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Magic Layers: one flat image becomes editable layers</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker><pattern id="chk" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#F9FAFB"/><rect width="6" height="6" fill="#D1D5DB"/><rect x="6" y="6" width="6" height="6" fill="#D1D5DB"/></pattern></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Magic Layers: one flat image becomes editable layers</text>
<rect x="20" y="56" width="190" height="270" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/><text x="115" y="76" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Flat PNG or JPG</text><rect x="44" y="90" width="142" height="200" fill="#FEF3C7" stroke="#9CA3AF"/><circle cx="150" cy="122" r="16" fill="#FFFFFF" stroke="#B45309"/><rect x="58" y="104" width="76" height="12" rx="2" fill="#4F46E5"/><rect x="78" y="150" width="56" height="84" rx="2" fill="#4F46E5"/><rect x="88" y="168" width="36" height="6" fill="#FFFFFF"/><rect x="60" y="250" width="52" height="16" rx="8" fill="#B45309"/><text x="115" y="312" font-size="11" fill="#374151" text-anchor="middle">Poster: no layers yet</text><path d="M214,190 L254,190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><text x="234" y="176" font-size="11" fill="#B45309" text-anchor="middle" font-weight="bold">Magic</text><text x="234" y="206" font-size="11" fill="#B45309" text-anchor="middle" font-weight="bold">Layers</text><rect x="280" y="246" width="150" height="60" rx="6" fill="#FEF3C7" stroke="#9CA3AF" stroke-width="1.5"/><rect x="290" y="268" width="130" height="30" fill="#FEF3C7" stroke="#D1D5DB"/><text x="288" y="260" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">Background</text><rect x="302" y="194" width="150" height="60" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/><rect x="362" y="214" width="34" height="34" rx="2" fill="#4F46E5"/><text x="310" y="208" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">Illustration</text><rect x="324" y="142" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><rect x="338" y="164" width="110" height="12" rx="2" fill="#4F46E5"/><text x="332" y="156" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">Title</text><rect x="346" y="90" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><circle cx="456" cy="120" r="16" fill="#FEF3C7" stroke="#B45309"/><text x="354" y="104" font-size="11" fill="#1F2937" text-anchor="start" font-weight="bold">Badge</text><text x="395" y="334" font-size="11" fill="#6B7280" text-anchor="middle">Layers shown offset to reveal the stack</text><rect x="530" y="56" width="218" height="270" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="639" y="76" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">Then you can</text><rect x="544" y="92" width="190" height="26" rx="5" fill="#EEF2FF" stroke="#9CA3AF"/><text x="556" y="109" font-size="12" fill="#1F2937" text-anchor="start">Move elements</text><rect x="544" y="126" width="190" height="26" rx="5" fill="#EEF2FF" stroke="#9CA3AF"/><text x="556" y="143" font-size="12" fill="#1F2937" text-anchor="start">Resize one element</text><rect x="544" y="160" width="190" height="26" rx="5" fill="#EEF2FF" stroke="#9CA3AF"/><text x="556" y="177" font-size="12" fill="#1F2937" text-anchor="start">Delete an object</text><rect x="544" y="194" width="190" height="26" rx="5" fill="#EEF2FF" stroke="#9CA3AF"/><text x="556" y="211" font-size="12" fill="#1F2937" text-anchor="start">Apply effects to a layer</text><rect x="544" y="228" width="190" height="26" rx="5" fill="#EEF2FF" stroke="#9CA3AF"/><text x="556" y="245" font-size="12" fill="#1F2937" text-anchor="start">Replace with a new image</text><text x="639" y="284" font-size="11" fill="#374151" text-anchor="middle">Limits: PNG or JPG, single page,</text><text x="639" y="300" font-size="11" fill="#374151" text-anchor="middle">longest edge up to 5000 px,</text><text x="639" y="316" font-size="11" fill="#374151" text-anchor="middle">best on graphics, not photos</text>  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
