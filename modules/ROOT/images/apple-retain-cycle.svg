<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">A retain cycle between an @Observable model and a closure</text>
  <text x="380" y="48" font-size="13" fill="#666666" text-anchor="middle">FieldNotes' DraftAutosaver after the composer sheet has closed</text>

  <defs>
    <marker id="rc-strong" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a12626"/>
    </marker>
    <marker id="rc-ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
    <marker id="rc-weak" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2d6a34"/>
    </marker>
  </defs>

  <!-- Left panel: leaking -->
  <rect x="15" y="66" width="355" height="330" rx="10" fill="#fdf1f1" stroke="#a12626" stroke-width="1.4"/>
  <text x="192" y="90" font-size="15" font-weight="bold" fill="#a12626" text-anchor="middle">Leaks: strong references in a loop</text>

  <!-- NoteComposer (gone) -->
  <rect x="35" y="104" width="150" height="46" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="110" y="124" font-size="13" fill="#777777" text-anchor="middle">NoteComposer</text>
  <text x="110" y="141" font-size="13" fill="#777777" text-anchor="middle">(sheet closed)</text>
  <line x1="110" y1="150" x2="110" y2="184" stroke="#999999" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="118" y="172" font-size="13" fill="#777777">@State released</text>

  <!-- DraftAutosaver -->
  <rect x="35" y="188" width="190" height="96" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="130" y="208" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">DraftAutosaver</text>
  <text x="130" y="225" font-size="13" fill="#1c4b73" text-anchor="middle">@Observable</text>
  <text x="45" y="246" font-size="13" fill="#333333">saveAction: () -&gt; Void</text>
  <text x="45" y="266" font-size="13" fill="#333333">loop: Task&lt;Void, Never&gt;?</text>

  <!-- Closure context -->
  <rect x="240" y="300" width="115" height="80" rx="8" fill="#fff6e8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="297" y="322" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">closure and</text>
  <text x="297" y="339" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">Task context</text>
  <text x="297" y="360" font-size="13" fill="#333333" text-anchor="middle">captures self</text>

  <!-- strong: model -> closure -->
  <path d="M225,250 C265,255 290,270 295,298" fill="none" stroke="#a12626" stroke-width="2" marker-end="url(#rc-strong)"/>
  <text x="262" y="244" font-size="13" fill="#a12626">stores</text>
  <!-- strong: closure -> model -->
  <path d="M240,345 C170,345 130,320 130,288" fill="none" stroke="#a12626" stroke-width="2" marker-end="url(#rc-strong)"/>
  <text x="120" y="360" font-size="13" fill="#a12626" text-anchor="middle">self (strong)</text>

  <text x="192" y="388" font-size="13" fill="#a12626" text-anchor="middle">Count never reaches 0: never freed</text>

  <!-- Right panel: fixed -->
  <rect x="390" y="66" width="355" height="330" rx="10" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="567" y="90" font-size="15" font-weight="bold" fill="#2d6a34" text-anchor="middle">Fixed: weak capture, view-owned task</text>

  <rect x="410" y="104" width="150" height="46" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text x="485" y="124" font-size="13" fill="#333333" text-anchor="middle">NoteComposer</text>
  <text x="485" y="141" font-size="13" fill="#333333" text-anchor="middle">.task { run() }</text>
  <line x1="485" y1="150" x2="485" y2="184" stroke="#333333" stroke-width="1.6" marker-end="url(#rc-ok)"/>
  <text x="493" y="172" font-size="13" fill="#333333">@State (only owner)</text>

  <rect x="410" y="188" width="190" height="96" rx="8" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="505" y="208" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">DraftAutosaver</text>
  <text x="505" y="225" font-size="13" fill="#1c4b73" text-anchor="middle">@Observable</text>
  <text x="420" y="246" font-size="13" fill="#333333">saveAction: () -&gt; Void</text>
  <text x="420" y="266" font-size="13" fill="#333333">func run() async</text>

  <rect x="615" y="300" width="115" height="80" rx="8" fill="#fff6e8" stroke="#8a5a1c" stroke-width="1.6"/>
  <text x="672" y="322" font-size="13" font-weight="bold" fill="#8a5a1c" text-anchor="middle">closure</text>
  <text x="672" y="343" font-size="13" fill="#333333" text-anchor="middle">[weak self]</text>
  <text x="672" y="362" font-size="13" fill="#333333" text-anchor="middle">guard let self</text>

  <path d="M600,250 C640,255 665,270 670,298" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#rc-ok)"/>
  <text x="637" y="244" font-size="13" fill="#333333">stores</text>
  <path d="M615,345 C545,345 505,320 505,288" fill="none" stroke="#2d6a34" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#rc-weak)"/>
  <text x="495" y="360" font-size="13" fill="#2d6a34" text-anchor="middle">self (weak)</text>

  <text x="567" y="388" font-size="13" fill="#2d6a34" text-anchor="middle">Sheet closes: task cancelled, model freed</text>

  <!-- Legend -->
  <line x1="150" y1="420" x2="190" y2="420" stroke="#a12626" stroke-width="2"/>
  <text x="198" y="424" font-size="13" fill="#333333">strong reference in the cycle</text>
  <line x1="420" y1="420" x2="460" y2="420" stroke="#2d6a34" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="468" y="424" font-size="13" fill="#333333">weak reference (not counted)</text>
</svg>
