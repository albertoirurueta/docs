<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Connecting Instagram and Facebook for scheduling</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Connecting Instagram and Facebook for scheduling</text>
  <rect x="20" y="60" width="160" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="100" y="92" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Instagram</text><text x="100" y="110" font-size="12" fill="#374151" text-anchor="middle">Business account</text><text x="100" y="128" font-size="11" fill="#6B7280" text-anchor="middle">not a Creator account</text>
  <rect x="300" y="60" width="160" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="380" y="92" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Facebook Page</text><text x="380" y="110" font-size="12" fill="#374151" text-anchor="middle">you are Admin or Editor,</text><text x="380" y="128" font-size="12" fill="#374151" text-anchor="middle">or have Page access</text>
  <rect x="580" y="60" width="160" height="90" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="660" y="92" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Content Planner</text><text x="660" y="110" font-size="12" fill="#374151" text-anchor="middle">Connect social account,</text><text x="660" y="128" font-size="12" fill="#374151" text-anchor="middle">grant permissions</text>
  <path d="M180,105 L298,105" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><text x="239" y="97" font-size="11" fill="#374151" text-anchor="middle">linked to</text>
  <path d="M460,105 L578,105" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><text x="519" y="97" font-size="11" fill="#374151" text-anchor="middle">log in with</text>
  <rect x="20" y="180" width="340" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF"/>
  <text x="190" y="204" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Instagram limits (Help Center)</text><text x="190" y="224" font-size="12" fill="#374151" text-anchor="middle">25 scheduled posts per rolling 24 hours, up to 20 hashtags,</text><text x="190" y="240" font-size="12" fill="#374151" text-anchor="middle">single image or video only, no Stories, Reels or galleries</text>
  <rect x="400" y="180" width="340" height="70" rx="8" fill="#F9FAFB" stroke="#9CA3AF"/>
  <text x="570" y="204" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">Facebook limits (Help Center)</text><text x="570" y="224" font-size="12" fill="#374151" text-anchor="middle">Pages only, never personal profiles; one Facebook account</text><text x="570" y="240" font-size="12" fill="#374151" text-anchor="middle">linked to Canva at a time; two-factor if in a business account</text>
  <text x="380" y="282" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of the account relationships, not a screenshot of any product.</text>
</svg>
