<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-qcb-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Different queues overlap in time and meet at semaphores</text>
<text x="20" y="110" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Transfer queue</text>
<line x1="140" y1="138" x2="740" y2="138" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<text x="20" y="190" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Compute queue</text>
<line x1="140" y1="218" x2="740" y2="218" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<text x="20" y="270" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">Graphics queue</text>
<line x1="140" y1="298" x2="740" y2="298" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="150" y="80" width="150" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="225.0" y="101.3" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Upload book</text>
<text x="225.0" y="116.3" text-anchor="middle" font-size="11" fill="#065F46">textures</text>
<rect x="330" y="160" width="150" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="405.0" y="181.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Dust particles</text>
<text x="405.0" y="196.3" text-anchor="middle" font-size="11" fill="#3730A3">compute dispatch</text>
<rect x="330" y="240" width="200" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="430.0" y="261.4" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Shelf and books</text>
<text x="430.0" y="276.4" text-anchor="middle" font-size="11" fill="#92400E">depth pre-pass</text>
<rect x="560" y="240" width="170" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="645.0" y="261.4" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Shade, present</text>
<text x="645.0" y="276.4" text-anchor="middle" font-size="11" fill="#92400E">blit to swapchain</text>
<line x1="260" y1="130" x2="400" y2="238" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-qcb-async)"/>
<text x="330" y="170" text-anchor="start" font-size="10" fill="#4B5563">upload done</text>
<line x1="480" y1="185" x2="558" y2="255" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-qcb-async)"/>
<text x="520" y="210" text-anchor="start" font-size="10" fill="#4B5563">wait on dust</text>
<text x="380" y="330" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Each arrow is a semaphore: signalled in one submit, waited on in another.</text>
<text x="380" y="352" text-anchor="middle" font-size="11" fill="#374151">Resources used by two queue families need either VK_SHARING_MODE_CONCURRENT</text>
<text x="380" y="370" text-anchor="middle" font-size="11" fill="#374151">or an explicit queue family ownership transfer (release on one queue, acquire on the other).</text>
</svg>
