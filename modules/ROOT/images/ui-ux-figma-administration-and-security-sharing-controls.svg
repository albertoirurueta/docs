<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Guest, link and AI controls by plan (checked 2026-10-30)</text>
  <rect x="25" y="48" width="710" height="34" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="40" y="70" font-size="13" font-weight="bold" fill="#3730A3">Control</text>
  <text x="400" y="70" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Organization</text>
  <text x="530" y="70" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Enterprise</text>
  <text x="660" y="70" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Enterprise + Governance+</text>
  <rect x="25" y="88" width="710" height="40" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="45" cy="108" r="11" fill="#4F46E5"/><text x="45" y="112" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="66" y="113" font-size="13" fill="#374151">Turn off public links and FigJam open sessions</text>
  <rect x="368" y="98" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="400" y="112" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="498" y="98" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="530" y="112" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="628" y="98" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="660" y="112" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="25" y="134" width="710" height="40" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="45" cy="154" r="11" fill="#4F46E5"/><text x="45" y="158" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="66" y="159" font-size="13" fill="#374151">Require passwords or link expiry; workspace overrides</text>
  <rect x="368" y="144" width="64" height="20" rx="10" fill="#FEE2E2" stroke="#B91C1C"/><text x="400" y="158" font-size="11" fill="#B91C1C" text-anchor="middle">No</text>
  <rect x="498" y="144" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="530" y="158" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="628" y="144" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="660" y="158" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="25" y="180" width="710" height="40" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="45" cy="200" r="11" fill="#4F46E5"/><text x="45" y="204" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="66" y="205" font-size="13" fill="#374151">View a guest's access and recent activity</text>
  <rect x="368" y="190" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="400" y="204" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="498" y="190" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="530" y="204" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="628" y="190" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="660" y="204" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="25" y="226" width="710" height="40" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="45" cy="246" r="11" fill="#4F46E5"/><text x="45" y="250" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="66" y="251" font-size="13" fill="#374151">Guest expiration dates</text>
  <rect x="368" y="236" width="64" height="20" rx="10" fill="#FEE2E2" stroke="#B91C1C"/><text x="400" y="250" font-size="11" fill="#B91C1C" text-anchor="middle">No</text>
  <rect x="498" y="236" width="64" height="20" rx="10" fill="#FEE2E2" stroke="#B91C1C"/><text x="530" y="250" font-size="11" fill="#B91C1C" text-anchor="middle">No</text>
  <rect x="628" y="236" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="660" y="250" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="25" y="272" width="710" height="40" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="45" cy="292" r="11" fill="#B45309"/><text x="45" y="296" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="66" y="297" font-size="13" fill="#92400E">AI on or off, organization-wide (per workspace on Enterprise)</text>
  <rect x="368" y="282" width="64" height="20" rx="10" fill="#FFFFFF" stroke="#B45309"/><text x="400" y="296" font-size="11" fill="#92400E" text-anchor="middle">Enable</text>
  <rect x="498" y="282" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="530" y="296" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <rect x="628" y="282" width="64" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/><text x="660" y="296" font-size="11" fill="#047857" text-anchor="middle">Yes</text>
  <text x="380" y="338" font-size="12" fill="#374151" text-anchor="middle">Only organization admins change these. Row 5 on Organization only re-enables AI switched off in beta.</text>
</svg>
