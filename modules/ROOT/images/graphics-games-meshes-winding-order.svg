<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="wo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="woa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="wow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="wog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Winding order decides which side of a triangle is the front</text>
<polygon points="130,230 270,230 200,100" fill="#D1FAE5" stroke="#047857" stroke-width="2"/>
<circle cx="130.0" cy="230.0" r="11" fill="#047857" stroke="#047857" stroke-width="1"/>
<text x="130" y="234.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">0</text>
<circle cx="270.0" cy="230.0" r="11" fill="#047857" stroke="#047857" stroke-width="1"/>
<text x="270" y="234.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<circle cx="200.0" cy="100.0" r="11" fill="#047857" stroke="#047857" stroke-width="1"/>
<text x="200" y="104.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<line x1="186.0" y1="230.0" x2="214.0" y2="230.0" stroke="#1F2937" stroke-width="2" marker-end="url(#wo)"/>
<line x1="241.6" y1="177.3" x2="228.4" y2="152.7" stroke="#1F2937" stroke-width="2" marker-end="url(#wo)"/>
<line x1="171.6" y1="152.7" x2="158.4" y2="177.3" stroke="#1F2937" stroke-width="2" marker-end="url(#wo)"/>
<text x="200" y="64" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Counter-clockwise (front-facing)</text>
<text x="200" y="262" text-anchor="middle" font-size="12" fill="#374151">normal points toward the viewer</text>
<polygon points="490,230 560,100 630,230" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<circle cx="490.0" cy="230.0" r="11" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="490" y="234.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">0</text>
<circle cx="560.0" cy="100.0" r="11" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="560" y="104.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<circle cx="630.0" cy="230.0" r="11" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="630" y="234.5" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<line x1="518.4" y1="177.3" x2="531.6" y2="152.7" stroke="#1F2937" stroke-width="2" marker-end="url(#wo)"/>
<line x1="588.4" y1="152.7" x2="601.6" y2="177.3" stroke="#1F2937" stroke-width="2" marker-end="url(#wo)"/>
<line x1="574.0" y1="230.0" x2="546.0" y2="230.0" stroke="#1F2937" stroke-width="2" marker-end="url(#wo)"/>
<text x="560" y="64" text-anchor="middle" font-size="14" fill="#1F2937" font-weight="bold">Clockwise (back-facing)</text>
<text x="560" y="262" text-anchor="middle" font-size="12" fill="#374151">culled when back-face culling is on</text>
<text x="380" y="292" text-anchor="middle" font-size="11" fill="#374151">Normal n = (v1 - v0) x (v2 - v0); the sign of n . view direction tells front from back.</text>
<text x="380" y="312" text-anchor="middle" font-size="11" fill="#374151">Counter-clockwise is the default in OpenGL, Vulkan can be set per pipeline, Metal defaults to clockwise.</text>
</svg>
