<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 527" width="860" height="527" role="img" aria-labelledby="backend-advisories-t backend-advisories-d">
<title id="backend-advisories-t">Security advisories per year (OSV.dev, deduplicated by CVE)</title>
<desc id="backend-advisories-d">Advisories affecting the framework&apos;s main packages per year (CVE year, or first publication without a CVE). More code and more active disclosure mean more advisories; a low count is not proof of security. 2026 is to date.</desc>
