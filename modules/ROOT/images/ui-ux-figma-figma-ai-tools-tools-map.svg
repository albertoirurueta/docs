<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Map of the one-shot AI tools in Figma Design (checked 2026-10-30)</text>
  <rect x="270" y="190" width="220" height="60" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="380" y="215" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Actions menu</text>
  <text x="380" y="235" font-size="12" fill="#374151" text-anchor="middle">Command K or Control K</text>

  <rect x="30" y="50" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="30" cy="50" r="11" fill="#4F46E5"/><text x="30" y="54" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="46" y="76" font-size="13" font-weight="bold" fill="#3730A3">Text</text>
  <text x="46" y="98" font-size="12" fill="#374151">Rewrite, translate, shorten</text>
  <text x="46" y="116" font-size="12" fill="#374151">Replace content</text>
  <text x="46" y="134" font-size="12" fill="#374151">Adjust tone (FigJam, Slides)</text>

  <rect x="510" y="50" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="510" cy="50" r="11" fill="#4F46E5"/><text x="510" y="54" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="526" y="76" font-size="13" font-weight="bold" fill="#3730A3">Images</text>
  <text x="526" y="98" font-size="12" fill="#374151">Make and edit image</text>
  <text x="526" y="116" font-size="12" fill="#374151">Remove background, expand</text>
  <text x="526" y="134" font-size="12" fill="#374151">Erase, isolate, boost, vectorize</text>

  <rect x="30" y="280" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="30" cy="280" r="11" fill="#4F46E5"/><text x="30" y="284" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="46" y="306" font-size="13" font-weight="bold" fill="#3730A3">Organise and find</text>
  <text x="46" y="328" font-size="12" fill="#374151">Rename layers</text>
  <text x="46" y="346" font-size="12" fill="#374151">AI search (assets, designs)</text>

  <rect x="510" y="280" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="510" cy="280" r="11" fill="#4F46E5"/><text x="510" y="284" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="526" y="306" font-size="13" font-weight="bold" fill="#3730A3">Designs and flows</text>
  <text x="526" y="328" font-size="12" fill="#374151">First Draft (make designs)</text>
  <text x="526" y="346" font-size="12" fill="#374151">Add interactions (prototype)</text>

  <path d="M250 125 L300 188" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M510 125 L460 188" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M250 315 L300 252" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M510 315 L460 252" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <rect x="270" y="290" width="220" height="100" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="316" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Agentic tools (separate)</text>
  <text x="380" y="338" font-size="12" fill="#92400E" text-anchor="middle">Figma agent, Make, code layers</text>
  <text x="380" y="356" font-size="12" fill="#92400E" text-anchor="middle">Variable credit cost, own pages</text>
  <text x="380" y="420" font-size="12" fill="#4B5563" text-anchor="middle">Which tool appears depends on product, plan and file access.</text>
