<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What survives three navigations: layouts versus templates</title>
  <desc id="d">A timeline of three navigations: /books, /books/1 and /books/2. The root layout and the books layout are one continuous bar, the same instance with its state kept. The books template and the page are three separate boxes, because the template gets a new key for each child segment and the page changes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>

  <text x="400" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">What survives three client navigations</text>
  <text x="400" y="47" font-size="12" fill="#555555" text-anchor="middle">green: same instance, state kept; orange: a new instance is mounted</text>

  <!-- time axis -->
  <line x1="150" y1="75" x2="780" y2="75" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="255" y="68">/books</text>
    <text x="465" y="68">/books/1</text>
    <text x="675" y="68">/books/2</text>
  </g>
  <g stroke="#999999" stroke-width="1" stroke-dasharray="4 4">
    <line x1="360" y1="80" x2="360" y2="380"/>
    <line x1="570" y1="80" x2="570" y2="380"/>
  </g>

  <!-- row labels -->
  <g font-size="13" font-weight="bold" fill="#222222" text-anchor="end">
    <text x="138" y="116">layout.tsx (root)</text>
    <text x="138" y="186">books/layout.tsx</text>
    <text x="138" y="256">books/template.tsx</text>
    <text x="138" y="326">page.tsx</text>
  </g>
  <g font-size="11" fill="#555555" text-anchor="end">
    <text x="138" y="131">root layout</text>
    <text x="138" y="201">segment layout</text>
    <text x="138" y="271">key = child segment</text>
    <text x="138" y="341">the leaf of the route</text>
  </g>

  <!-- root layout: one continuous bar -->
  <rect x="160" y="95" width="620" height="46" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="470" y="115" font-size="13" font-weight="bold" fill="#14411f" text-anchor="middle">one instance for the whole session</text>
  <text x="470" y="132" font-size="12" fill="#333333" text-anchor="middle">cart badge keeps its count; no server re-render</text>

  <!-- books layout: one continuous bar -->
  <rect x="160" y="165" width="620" height="46" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.6"/>
  <text x="470" y="185" font-size="13" font-weight="bold" fill="#14411f" text-anchor="middle">one instance while the URL stays under /books</text>
  <text x="470" y="202" font-size="12" fill="#333333" text-anchor="middle">filter text is kept; no server re-render</text>

  <!-- template: three boxes -->
  <rect x="160" y="235" width="190" height="46" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="255" y="255" font-size="13" font-weight="bold" fill="#5c3500" text-anchor="middle">mount A</text>
  <text x="255" y="272" font-size="12" fill="#333333" text-anchor="middle">key /books</text>
  <rect x="370" y="235" width="190" height="46" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="465" y="255" font-size="13" font-weight="bold" fill="#5c3500" text-anchor="middle">mount B</text>
  <text x="465" y="272" font-size="12" fill="#333333" text-anchor="middle">key /books/1, draft empty</text>
  <rect x="580" y="235" width="200" height="46" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.6"/>
  <text x="680" y="255" font-size="13" font-weight="bold" fill="#5c3500" text-anchor="middle">mount C</text>
  <text x="680" y="272" font-size="12" fill="#333333" text-anchor="middle">key /books/2, draft empty</text>

  <!-- page: three boxes -->
  <rect x="160" y="305" width="190" height="46" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="255" y="333" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">catalogue</text>
  <rect x="370" y="305" width="190" height="46" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="465" y="333" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">book 1</text>
  <rect x="580" y="305" width="200" height="46" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.6"/>
  <text x="680" y="333" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">book 2</text>

  <text x="400" y="408" font-size="12" fill="#333333" text-anchor="middle">Only the segments below the shared layout are fetched and rendered; the layouts above them are reused as they are.</text>
  <text x="400" y="426" font-size="12" fill="#333333" text-anchor="middle">Observed with Next.js 16.3.8: the server log showed no layout render during the navigations.</text>
</svg>
