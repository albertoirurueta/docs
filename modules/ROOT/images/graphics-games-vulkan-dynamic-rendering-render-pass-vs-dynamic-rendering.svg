<text x="195.0" y="186.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">VkFramebuffer</text>
<text x="195.0" y="201.0" text-anchor="middle" font-size="11" fill="#374151">bound image views, size, layers</text>
<line x1="195" y1="217" x2="195" y2="235" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-cmp)"/>
<rect x="40" y="235" width="310" height="52" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="256.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">VkPipeline</text>
<text x="195.0" y="271.0" text-anchor="middle" font-size="11" fill="#374151">renderPass handle plus subpass index</text>
<line x1="195" y1="287" x2="195" y2="305" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-cmp)"/>
