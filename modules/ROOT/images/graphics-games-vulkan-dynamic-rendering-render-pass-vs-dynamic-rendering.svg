<text x="195.0" y="326.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">vkCmdBeginRenderPass</text>
<text x="195.0" y="341.0" text-anchor="middle" font-size="11" fill="#374151">clear values, render area</text>
<rect x="410" y="95" width="310" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="116.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">VkRenderingInfo</text>
<text x="565.0" y="131.0" text-anchor="middle" font-size="11" fill="#3730A3">views, layouts, load/store, resolve inline</text>
<line x1="565" y1="147" x2="565" y2="165" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-cmp)"/>
<rect x="410" y="165" width="310" height="52" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565.0" y="186.0" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">(no framebuffer object)</text>
<text x="565.0" y="201.0" text-anchor="middle" font-size="11" fill="#065F46">image views are passed at record time</text>
<line x1="565" y1="217" x2="565" y2="235" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-cmp)"/>
<rect x="410" y="235" width="310" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="256.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">VkPipelineRenderingCreateInfo</text>
<text x="565.0" y="271.0" text-anchor="middle" font-size="11" fill="#3730A3">attachment formats only, renderPass null</text>
<line x1="565" y1="287" x2="565" y2="305" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-dr-cmp)"/>
<rect x="410" y="305" width="310" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="326.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">vkCmdBeginRendering</text>
<text x="565.0" y="341.0" text-anchor="middle" font-size="11" fill="#3730A3">vkCmdEndRendering closes it</text>
<rect x="40" y="375" width="310" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="397.5" text-anchor="middle" font-size="11" fill="#92400E">subpass dependency, render-pass compatibility</text>
