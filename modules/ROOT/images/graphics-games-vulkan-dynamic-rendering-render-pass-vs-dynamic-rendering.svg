<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-dr-cmp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Render pass objects versus dynamic rendering</text>
<rect x="20" y="50" width="350" height="28" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="67.5" text-anchor="middle" font-size="13" fill="#374151">Render pass model (Vulkan 1.0)</text>
<rect x="390" y="50" width="350" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="565.0" y="67.5" text-anchor="middle" font-size="13" fill="#3730A3">Dynamic rendering (core in 1.3, 2022)</text>
<rect x="40" y="95" width="310" height="52" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="116.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">VkRenderPass</text>
<text x="195.0" y="131.0" text-anchor="middle" font-size="11" fill="#374151">attachments, subpasses, dependencies</text>
