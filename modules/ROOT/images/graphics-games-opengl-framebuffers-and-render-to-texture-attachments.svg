<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-fbo-att" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A framebuffer object is a set of attachment points</text>
<rect x="20" y="50" width="250" height="290" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="145" y="74" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Framebuffer object (FBO)</text>
<text x="145" y="92" font-size="11" fill="#374151" text-anchor="middle">a container: it owns no pixel storage</text>
<rect x="40" y="108" width="210" height="34" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145" y="130" font-size="12" fill="#374151" text-anchor="middle">GL_COLOR_ATTACHMENT0</text>
<rect x="40" y="150" width="210" height="34" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145" y="172" font-size="12" fill="#374151" text-anchor="middle">GL_COLOR_ATTACHMENT1 ... n</text>
<rect x="40" y="192" width="210" height="34" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145" y="214" font-size="12" fill="#374151" text-anchor="middle">GL_DEPTH_ATTACHMENT</text>
<rect x="40" y="234" width="210" height="34" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145" y="256" font-size="12" fill="#374151" text-anchor="middle">GL_STENCIL_ATTACHMENT</text>
<rect x="40" y="276" width="210" height="34" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145" y="298" font-size="12" fill="#374151" text-anchor="middle">GL_DEPTH_STENCIL_ATTACHMENT</text>
<text x="145" y="330" font-size="10" fill="#374151" text-anchor="middle">draw buffers and read buffer pick which colour slots are used</text>
<rect x="470" y="60" width="270" height="120" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="605" y="82" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Texture image (level, layer)</text>
<text x="605" y="104" font-size="11" fill="#374151" text-anchor="middle">can be sampled by a later pass</text>
<text x="605" y="122" font-size="11" fill="#374151" text-anchor="middle">can be shared between FBOs</text>
<text x="605" y="140" font-size="11" fill="#374151" text-anchor="middle">cube map faces, array layers, 3D slices</text>
<text x="605" y="160" font-size="11" fill="#374151" text-anchor="middle">e.g. RGBA16F, RGBA8, DEPTH_COMPONENT32F</text>
<rect x="470" y="210" width="270" height="110" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="605" y="232" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Renderbuffer</text>
<text x="605" y="254" font-size="11" fill="#374151" text-anchor="middle">write-only target, cannot be sampled</text>
<text x="605" y="272" font-size="11" fill="#374151" text-anchor="middle">may be multisampled</text>
<text x="605" y="290" font-size="11" fill="#374151" text-anchor="middle">driver may pick the best tiling</text>
<text x="605" y="308" font-size="11" fill="#374151" text-anchor="middle">e.g. DEPTH24_STENCIL8, RGBA8 with 4 samples</text>
<path d="M270 125 L470 120" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah-fbo-att)"/>
<path d="M270 209 L470 250" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah-fbo-att)"/>
<path d="M270 290 L470 280" stroke="#4B5563" stroke-width="1.5" fill="none" marker-end="url(#ah-fbo-att)"/>
<text x="370" y="104" font-size="10" fill="#374151" text-anchor="middle">glNamedFramebufferTexture</text>
<text x="370" y="326" font-size="10" fill="#374151" text-anchor="middle">glNamedFramebufferRenderbuffer</text>
<rect x="20" y="370" width="720" height="50" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="392" font-size="12" fill="#374151" text-anchor="middle">The default framebuffer (object 0) belongs to the window system: it has no attachment points you can change,</text>
<text x="380" y="410" font-size="12" fill="#374151" text-anchor="middle">cannot be sampled, and its colour, depth and stencil formats were chosen when the context was created.</text>
</svg>
