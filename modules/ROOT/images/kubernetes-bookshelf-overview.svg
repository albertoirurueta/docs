<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Overview of the Bookshelf application on a kind cluster with a Gateway in front of three Deployments backed by PostgreSQL and Redis and a notifier CronJob</title>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="400" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf -- the running example</text>

  <rect x="320" y="38" width="160" height="26" rx="6" fill="#fbeee0" stroke="#a05a1f" stroke-width="1.2"/>
  <text x="400" y="55" font-size="11" font-weight="bold" fill="#a05a1f" text-anchor="middle">Browser or API client</text>
  <line x1="400" y1="64" x2="400" y2="82" stroke="#555555" stroke-width="1.3"/>
  <polygon points="395,78 405,78 400,86" fill="#555555"/>

  <rect x="20" y="86" width="760" height="278" rx="10" fill="#f7f9fb" stroke="#1c4b73" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="36" y="106" font-size="12" font-weight="bold" fill="#1c4b73">Namespace bookshelf on a kind cluster</text>

  <rect x="270" y="118" width="260" height="36" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="400" y="141" font-size="11.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Gateway + HTTPRoutes</text>

  <line x1="330" y1="154" x2="150" y2="184" stroke="#555555" stroke-width="1.2"/>
  <line x1="400" y1="154" x2="400" y2="184" stroke="#555555" stroke-width="1.2"/>
  <line x1="470" y1="154" x2="650" y2="184" stroke="#555555" stroke-width="1.2"/>

  <rect x="50" y="184" width="200" height="60" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="150" y="207" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Deployment catalog-api</text>
  <text x="150" y="225" font-size="9" fill="#333333" text-anchor="middle">Service, probes, HPA</text>

  <rect x="300" y="184" width="200" height="60" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="400" y="207" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Deployment reviews-api</text>
  <text x="400" y="225" font-size="9" fill="#333333" text-anchor="middle">Service, probes, PDB</text>

  <rect x="550" y="184" width="200" height="60" rx="6" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="650" y="207" font-size="11" font-weight="bold" fill="#2d6a34" text-anchor="middle">Deployment web</text>
  <text x="650" y="225" font-size="9" fill="#333333" text-anchor="middle">Service, ConfigMap</text>

  <line x1="150" y1="244" x2="150" y2="280" stroke="#555555" stroke-width="1.2"/>
  <line x1="400" y1="244" x2="250" y2="280" stroke="#555555" stroke-width="1.2"/>
  <line x1="400" y1="244" x2="500" y2="280" stroke="#555555" stroke-width="1.2"/>

  <rect x="50" y="280" width="200" height="56" rx="6" fill="#f3eefa" stroke="#5b3a8a" stroke-width="1.3"/>
  <text x="150" y="303" font-size="11" font-weight="bold" fill="#5b3a8a" text-anchor="middle">StatefulSet PostgreSQL</text>
  <text x="150" y="321" font-size="9" fill="#333333" text-anchor="middle">headless Service, PVC, Secret</text>

  <rect x="300" y="280" width="200" height="56" rx="6" fill="#f3eefa" stroke="#5b3a8a" stroke-width="1.3"/>
  <text x="400" y="303" font-size="11" font-weight="bold" fill="#5b3a8a" text-anchor="middle">Redis</text>
  <text x="400" y="321" font-size="9" fill="#333333" text-anchor="middle">cache and work queue</text>

  <rect x="550" y="280" width="200" height="56" rx="6" fill="#fbeee0" stroke="#a05a1f" stroke-width="1.3"/>
  <text x="650" y="303" font-size="11" font-weight="bold" fill="#a05a1f" text-anchor="middle">notifier Job and CronJob</text>
  <text x="650" y="321" font-size="9" fill="#333333" text-anchor="middle">reads the Redis queue</text>
  <line x1="550" y1="308" x2="500" y2="308" stroke="#555555" stroke-width="1.2"/>
</svg>
