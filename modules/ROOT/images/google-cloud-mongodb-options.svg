<svg viewBox="0 0 900 470" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Three ways to run the Bookshelf orders store on Google Cloud</text>

  <!-- orders-api -->
  <rect x="320" y="46" width="260" height="46" rx="8" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="450" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#123a72">orders-api (Cloud Run or GKE)</text>
  <text x="450" y="83" text-anchor="middle" font-size="11" fill="#123a72">MongoDB driver, ${MONGODB_URI} from Secret Manager</text>

  <!-- connectors -->
  <path d="M390 92 L150 160" stroke="#5c6b7a" stroke-width="2" fill="none"/>
  <path d="M450 92 L450 160" stroke="#5c6b7a" stroke-width="2" fill="none"/>
  <path d="M510 92 L750 160" stroke="#5c6b7a" stroke-width="2" fill="none"/>
  <text x="230" y="118" font-size="10.5" fill="#3c4a58" text-anchor="middle">public Google endpoint,</text>
  <text x="230" y="131" font-size="10.5" fill="#3c4a58" text-anchor="middle">TLS, IAM (OIDC) or SCRAM</text>
  <text x="470" y="132" font-size="10.5" fill="#3c4a58">PSC endpoint</text>
  <text x="690" y="118" font-size="10.5" fill="#3c4a58" text-anchor="middle">in-VPC pod IPs or</text>
  <text x="690" y="131" font-size="10.5" fill="#3c4a58" text-anchor="middle">internal load balancer</text>

  <!-- Column 1 -->
  <rect x="30" y="160" width="250" height="240" rx="10" fill="#eaf6ee" stroke="#1e7e45" stroke-width="2"/>
  <text x="155" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14572f">Firestore with MongoDB</text>
  <text x="155" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14572f">compatibility</text>
  <text x="155" y="220" text-anchor="middle" font-size="11" fill="#14572f">Enterprise edition, serverless</text>
  <rect x="50" y="234" width="210" height="150" rx="6" fill="#ffffff" stroke="#1e7e45"/>
  <text x="60" y="254" font-size="11" fill="#1a1a1a">Operated by: Google</text>
  <text x="60" y="272" font-size="11" fill="#1a1a1a">Engine: Firestore, MongoDB API</text>
  <text x="60" y="290" font-size="11" fill="#1a1a1a">Bill: read/write units, bytes</text>
  <text x="60" y="308" font-size="11" fill="#1a1a1a">Scale: no sharding, no idle cost</text>
  <text x="60" y="326" font-size="11" fill="#1a1a1a">Gaps: change streams, $out, $merge</text>
  <text x="60" y="344" font-size="11" fill="#1a1a1a">Auth: IAM OIDC or SCRAM</text>
  <text x="60" y="362" font-size="11" fill="#1a1a1a">Backups: schedules, PITR, clone</text>

  <!-- Column 2 -->
  <rect x="325" y="160" width="250" height="240" rx="10" fill="#fff8e6" stroke="#b06a00" stroke-width="2"/>
  <text x="450" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a4800">MongoDB Atlas on</text>
  <text x="450" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7a4800">Google Cloud</text>
  <text x="450" y="220" text-anchor="middle" font-size="11" fill="#7a4800">Real mongod, run by MongoDB Inc.</text>
  <rect x="345" y="234" width="210" height="150" rx="6" fill="#ffffff" stroke="#b06a00"/>
  <text x="355" y="254" font-size="11" fill="#1a1a1a">Operated by: MongoDB Inc.</text>
  <text x="355" y="272" font-size="11" fill="#1a1a1a">Engine: MongoDB server</text>
  <text x="355" y="290" font-size="11" fill="#1a1a1a">Bill: Marketplace or Atlas invoice</text>
  <text x="355" y="308" font-size="11" fill="#1a1a1a">Scale: tiers, auto-scaling</text>
  <text x="355" y="326" font-size="11" fill="#1a1a1a">Extras: Atlas Search, Vector Search</text>
  <text x="355" y="344" font-size="11" fill="#1a1a1a">Network: allow list, PSC</text>
  <text x="355" y="362" font-size="11" fill="#1a1a1a">Backups: Atlas cloud backups</text>

  <!-- Column 3 -->
  <rect x="620" y="160" width="250" height="240" rx="10" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2"/>
  <text x="745" y="184" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3c4a58">Self-managed MongoDB</text>
  <text x="745" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3c4a58">on GKE or Compute Engine</text>
  <text x="745" y="220" text-anchor="middle" font-size="11" fill="#3c4a58">Replica set you operate</text>
  <rect x="640" y="234" width="210" height="150" rx="6" fill="#ffffff" stroke="#5c6b7a"/>
  <text x="650" y="254" font-size="11" fill="#1a1a1a">Operated by: you</text>
  <text x="650" y="272" font-size="11" fill="#1a1a1a">Engine: Community or Enterprise</text>
  <text x="650" y="290" font-size="11" fill="#1a1a1a">Bill: nodes, Hyperdisk, licence</text>
  <text x="650" y="308" font-size="11" fill="#1a1a1a">Scale: you add members, shards</text>
  <text x="650" y="326" font-size="11" fill="#1a1a1a">Control: any version, any setting</text>
  <text x="650" y="344" font-size="11" fill="#1a1a1a">Network: your VPC only</text>
  <text x="650" y="362" font-size="11" fill="#1a1a1a">Backups: disk snapshots, dumps</text>

  <text x="450" y="430" text-anchor="middle" font-size="11.5" fill="#3c4a58">Operational responsibility grows from left to right; so does control over the MongoDB version and features.</text>
  <text x="450" y="448" text-anchor="middle" font-size="10.5" fill="#5c6b7a">Original schematic; not a Google Cloud or MongoDB architecture diagram.</text>
</svg>
