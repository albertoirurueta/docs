<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 171" width="1080" height="171" role="img" aria-labelledby="sap-abap-guide-set-up-a-local-abap-playground-05-npm-test-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-abap-guide-set-up-a-local-abap-playground-05-npm-test-title">Terminal after npm test: the transpiler counts its source and library files and reports the output files written (one example run), and the test run prints ZCL_GREETER: running ltcl_greeter-&gt;greets_by_name; callout 10 marks the command</title>
<g><rect x="0" y="0" width="1080" height="171" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="139" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm test</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">5 files added from source</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">727 files added from lib, 1.3 seconds</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Output files: 927 written</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">ZCL_GREETER: running ltcl_greeter-&gt;greets_by_name</text>
<rect x="5" y="46" width="1042" height="23" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">10</text></g></g>
</svg>
