<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Four ways for Blueprints to talk to each other</text>
<rect x="15" y="48" width="118" height="30" rx="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74.0" y="67" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Method</text>
<rect x="133" y="48" width="170" height="30" rx="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="218.0" y="67" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Depends on</text>
<rect x="303" y="48" width="138" height="30" rx="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="372.0" y="67" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Needs a reference</text>
<rect x="441" y="48" width="100" height="30" rx="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="491.0" y="67" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Receivers</text>
<rect x="541" y="48" width="204" height="30" rx="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="643.0" y="67" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">Typical use</text>
<rect x="15" y="78" width="118" height="64" rx="0" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="74.0" y="114.0" text-anchor="middle" font-size="12" fill="#3730A3">Direct reference</text>
<rect x="133" y="78" width="170" height="64" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="218.0" y="114.0" text-anchor="middle" font-size="12" fill="#374151">the variable's class</text>
<rect x="303" y="78" width="138" height="64" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="372.0" y="106.5" text-anchor="middle" font-size="12" fill="#374151">Yes, set in the</text>
<text x="372.0" y="121.5" text-anchor="middle" font-size="12" fill="#374151">level or at spawn</text>
<rect x="441" y="78" width="100" height="64" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="491.0" y="114.0" text-anchor="middle" font-size="12" fill="#374151">One</text>
<rect x="541" y="78" width="204" height="64" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="643.0" y="106.5" text-anchor="middle" font-size="12" fill="#374151">A switch opens one</text>
<text x="643.0" y="121.5" text-anchor="middle" font-size="12" fill="#374151">specific door</text>
<rect x="15" y="142" width="118" height="64" rx="0" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="74.0" y="178.0" text-anchor="middle" font-size="12" fill="#3730A3">Cast</text>
<rect x="133" y="142" width="170" height="64" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="218.0" y="170.5" text-anchor="middle" font-size="12" fill="#374151">the class cast to</text>
<text x="218.0" y="185.5" text-anchor="middle" font-size="12" fill="#374151">(it is loaded too)</text>
<rect x="303" y="142" width="138" height="64" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="372.0" y="170.5" text-anchor="middle" font-size="12" fill="#374151">Yes, any reference</text>
<text x="372.0" y="185.5" text-anchor="middle" font-size="12" fill="#374151">of a base type</text>
<rect x="441" y="142" width="100" height="64" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="491.0" y="178.0" text-anchor="middle" font-size="12" fill="#374151">One</text>
<rect x="541" y="142" width="204" height="64" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="643.0" y="170.5" text-anchor="middle" font-size="12" fill="#374151">Reach members only a</text>
<text x="643.0" y="185.5" text-anchor="middle" font-size="12" fill="#374151">known subclass has</text>
<rect x="15" y="206" width="118" height="64" rx="0" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="74.0" y="242.0" text-anchor="middle" font-size="12" fill="#3730A3">Interface</text>
<rect x="133" y="206" width="170" height="64" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="218.0" y="234.5" text-anchor="middle" font-size="12" fill="#374151">only the interface,</text>
<text x="218.0" y="249.5" text-anchor="middle" font-size="12" fill="#374151">not the receiver class</text>
<rect x="303" y="206" width="138" height="64" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="372.0" y="234.5" text-anchor="middle" font-size="12" fill="#374151">Yes, any object</text>
<text x="372.0" y="249.5" text-anchor="middle" font-size="12" fill="#374151">reference</text>
<rect x="441" y="206" width="100" height="64" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="491.0" y="242.0" text-anchor="middle" font-size="12" fill="#374151">One per call</text>
<rect x="541" y="206" width="204" height="64" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="643.0" y="234.5" text-anchor="middle" font-size="12" fill="#374151">Unrelated classes share</text>
<text x="643.0" y="249.5" text-anchor="middle" font-size="12" fill="#374151">one verb (Interact)</text>
<rect x="15" y="270" width="118" height="64" rx="0" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="74.0" y="306.0" text-anchor="middle" font-size="12" fill="#3730A3">Event dispatcher</text>
<rect x="133" y="270" width="170" height="64" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="218.0" y="298.5" text-anchor="middle" font-size="12" fill="#374151">the listener knows the</text>
<text x="218.0" y="313.5" text-anchor="middle" font-size="12" fill="#374151">sender, not vice versa</text>
<rect x="303" y="270" width="138" height="64" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="372.0" y="298.5" text-anchor="middle" font-size="12" fill="#374151">The listener needs</text>
<text x="372.0" y="313.5" text-anchor="middle" font-size="12" fill="#374151">the sender to bind</text>
<rect x="441" y="270" width="100" height="64" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="491.0" y="306.0" text-anchor="middle" font-size="12" fill="#374151">Zero to many</text>
<rect x="541" y="270" width="204" height="64" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="643.0" y="298.5" text-anchor="middle" font-size="12" fill="#374151">Announce that something</text>
<text x="643.0" y="313.5" text-anchor="middle" font-size="12" fill="#374151">happened (book pulled)</text>
<text x="380" y="358" text-anchor="middle" font-size="11" fill="#374151">Cost order for a call: direct reference and interface call are cheap; a Message call is slower;</text>
<text x="380" y="374" text-anchor="middle" font-size="11" fill="#374151">a Cast loads the target class; a dispatcher costs one call per bound listener.</text>
</svg>
