<svg viewBox="0 0 760 500" width="760" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-performance-best-practices-checklist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="500" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Metal performance checklist, in the order to work through it</text>
<rect x="20" y="50" width="350" height="128" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="34" y="72" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="start">1  Measure first</text>
<rect x="34" y="84" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<path d="M36,90 l3,3 l6,-7" fill="none" stroke="#4F46E5" stroke-width="1.6"/>
<text x="54" y="94" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Metal Performance HUD on a real device</text>
<rect x="34" y="105" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<path d="M36,111 l3,3 l6,-7" fill="none" stroke="#4F46E5" stroke-width="1.6"/>
<text x="54" y="115" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">GPU frame capture: cost graph, heat maps</text>
<rect x="34" y="126" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<path d="M36,132 l3,3 l6,-7" fill="none" stroke="#4F46E5" stroke-width="1.6"/>
<text x="54" y="136" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Metal System Trace for CPU/GPU overlap</text>
<rect x="34" y="147" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<path d="M36,153 l3,3 l6,-7" fill="none" stroke="#4F46E5" stroke-width="1.6"/>
<text x="54" y="157" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Fix the biggest bar, then measure again</text>
<rect x="390" y="50" width="350" height="128" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="404" y="72" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="start">2  Pace the frame</text>
<rect x="404" y="84" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<path d="M406,90 l3,3 l6,-7" fill="none" stroke="#4F46E5" stroke-width="1.6"/>
<text x="424" y="94" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">2 or 3 drawables, frames in flight capped</text>
<rect x="404" y="105" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<path d="M406,111 l3,3 l6,-7" fill="none" stroke="#4F46E5" stroke-width="1.6"/>
<text x="424" y="115" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Draw on CAMetalDisplayLink or MTKView</text>
<rect x="404" y="126" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<path d="M406,132 l3,3 l6,-7" fill="none" stroke="#4F46E5" stroke-width="1.6"/>
<text x="424" y="136" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Never wait on the GPU in the draw loop</text>
<rect x="404" y="147" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<path d="M406,153 l3,3 l6,-7" fill="none" stroke="#4F46E5" stroke-width="1.6"/>
<text x="424" y="157" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Watch thermal state, lower the budget</text>
<rect x="20" y="190" width="350" height="128" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="34" y="212" font-size="14" font-weight="bold" fill="#92400E" text-anchor="start">3  Save bandwidth</text>
<rect x="34" y="224" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<path d="M36,230 l3,3 l6,-7" fill="none" stroke="#B45309" stroke-width="1.6"/>
<text x="54" y="234" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">clear + dontCare instead of load + store</text>
<rect x="34" y="245" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<path d="M36,251 l3,3 l6,-7" fill="none" stroke="#B45309" stroke-width="1.6"/>
<text x="54" y="255" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">memoryless for depth, G-buffer, MSAA</text>
<rect x="34" y="266" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<path d="M36,272 l3,3 l6,-7" fill="none" stroke="#B45309" stroke-width="1.6"/>
<text x="54" y="276" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">ASTC textures with a full mip chain</text>
<rect x="34" y="287" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<path d="M36,293 l3,3 l6,-7" fill="none" stroke="#B45309" stroke-width="1.6"/>
<text x="54" y="297" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">half and packed vertex formats</text>
<rect x="390" y="190" width="350" height="128" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="404" y="212" font-size="14" font-weight="bold" fill="#92400E" text-anchor="start">4  Save memory</text>
<rect x="404" y="224" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<path d="M406,230 l3,3 l6,-7" fill="none" stroke="#B45309" stroke-width="1.6"/>
<text x="424" y="234" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Private storage for GPU-only data</text>
<rect x="404" y="245" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<path d="M406,251 l3,3 l6,-7" fill="none" stroke="#B45309" stroke-width="1.6"/>
<text x="424" y="255" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Heaps for transients, purgeable caches</text>
<rect x="404" y="266" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<path d="M406,272 l3,3 l6,-7" fill="none" stroke="#B45309" stroke-width="1.6"/>
<text x="424" y="276" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Residency sets, not whole-scene residency</text>
<rect x="404" y="287" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<path d="M406,293 l3,3 l6,-7" fill="none" stroke="#B45309" stroke-width="1.6"/>
<text x="424" y="297" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">No unused textures or oversized targets</text>
<rect x="20" y="330" width="350" height="128" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="34" y="352" font-size="14" font-weight="bold" fill="#065F46" text-anchor="start">5  Cut CPU cost</text>
<rect x="34" y="364" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<path d="M36,370 l3,3 l6,-7" fill="none" stroke="#047857" stroke-width="1.6"/>
<text x="54" y="374" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Build pipelines at load, never mid-frame</text>
<rect x="34" y="385" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<path d="M36,391 l3,3 l6,-7" fill="none" stroke="#047857" stroke-width="1.6"/>
<text x="54" y="395" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Argument tables or buffers, fewer binds</text>
<rect x="34" y="406" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<path d="M36,412 l3,3 l6,-7" fill="none" stroke="#047857" stroke-width="1.6"/>
<text x="54" y="416" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Reuse command buffers and allocators</text>
<rect x="34" y="427" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<path d="M36,433 l3,3 l6,-7" fill="none" stroke="#047857" stroke-width="1.6"/>
<text x="54" y="437" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">ICBs for large repeated draw lists</text>
<rect x="390" y="330" width="350" height="128" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="404" y="352" font-size="14" font-weight="bold" fill="#065F46" text-anchor="start">6  Tune shaders</text>
<rect x="404" y="364" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<path d="M406,370 l3,3 l6,-7" fill="none" stroke="#047857" stroke-width="1.6"/>
<text x="424" y="374" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">half precision where it is enough</text>
<rect x="404" y="385" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<path d="M406,391 l3,3 l6,-7" fill="none" stroke="#047857" stroke-width="1.6"/>
<text x="424" y="395" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">mathMode fast unless exactness matters</text>
<rect x="404" y="406" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<path d="M406,412 l3,3 l6,-7" fill="none" stroke="#047857" stroke-width="1.6"/>
<text x="424" y="416" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Check occupancy and threadgroup size</text>
<rect x="404" y="427" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<path d="M406,433 l3,3 l6,-7" fill="none" stroke="#047857" stroke-width="1.6"/>
<text x="424" y="437" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Few branches that diverge in a SIMD group</text>
<text x="380" y="486" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Work top to bottom: each group usually pays off more than the one below it.</text>
</svg>
