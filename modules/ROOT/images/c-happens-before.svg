<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Happens-before via release and acquire: the producer's ordinary write to payload is ordered before its releasing store to the published flag, which synchronizes-with the consumer's acquiring load of the same flag, making the payload write visible to the consumer's read; with relaxed operations no such edge exists and the payload read is a data race.</title>
  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>

  <text x="390" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One atomic flag publishes any amount of ordinary data</text>
  <text x="390" y="45" font-size="11" fill="#666666" text-anchor="middle">A release store synchronizes-with an acquire load of the same object; that single edge orders everything before it.</text>

  <!-- thread columns -->
  <rect x="40" y="66" width="290" height="256" fill="#fbfbfb" stroke="#bbbbbb" stroke-width="1.2" rx="5"/>
  <text x="185" y="86" font-size="12" font-weight="bold" fill="#2f5424" text-anchor="middle">producer thread</text>

  <rect x="450" y="66" width="290" height="256" fill="#fbfbfb" stroke="#bbbbbb" stroke-width="1.2" rx="5"/>
  <text x="595" y="86" font-size="12" font-weight="bold" fill="#1f3a52" text-anchor="middle">consumer thread</text>

  <!-- producer steps -->
  <rect x="58" y="100" width="254" height="44" fill="#eef3ec" stroke="#5a8a4a" stroke-width="1.4" rx="4"/>
  <text x="70" y="119" font-size="11" fill="#2f5424" font-family="'Courier New', monospace">payload = 42;</text>
  <text x="70" y="135" font-size="9" fill="#666666">an ordinary, non-atomic write</text>

  <rect x="58" y="170" width="254" height="52" fill="#dfe8dc" stroke="#5a8a4a" stroke-width="1.8" rx="4"/>
  <text x="70" y="189" font-size="11" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">atomic_store_explicit(</text>
  <text x="70" y="203" font-size="11" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">  &amp;published, true,</text>
  <text x="70" y="216" font-size="11" font-weight="bold" fill="#2f5424" font-family="'Courier New', monospace">  memory_order_release);</text>

  <!-- sequenced-before arrow in producer -->
  <line x1="185" y1="144" x2="185" y2="162" stroke="#5a8a4a" stroke-width="1.5"/>
  <polygon points="180,162 190,162 185,170" fill="#5a8a4a"/>
  <text x="196" y="158" font-size="9" font-style="italic" fill="#5a8a4a">sequenced-before</text>

  <text x="185" y="248" font-size="9" fill="#444444" text-anchor="middle">no earlier operation may be reordered</text>
  <text x="185" y="261" font-size="9" fill="#444444" text-anchor="middle">after the release store</text>

  <!-- consumer steps -->
  <rect x="468" y="170" width="254" height="52" fill="#dfe8f4" stroke="#4a6a8a" stroke-width="1.8" rx="4"/>
  <text x="480" y="189" font-size="11" font-weight="bold" fill="#1f3a52" font-family="'Courier New', monospace">while (!atomic_load_</text>
  <text x="480" y="203" font-size="11" font-weight="bold" fill="#1f3a52" font-family="'Courier New', monospace">  explicit(&amp;published,</text>
  <text x="480" y="216" font-size="11" font-weight="bold" fill="#1f3a52" font-family="'Courier New', monospace">  memory_order_acquire))</text>

  <rect x="468" y="248" width="254" height="44" fill="#eef2f8" stroke="#4a6a8a" stroke-width="1.4" rx="4"/>
  <text x="480" y="267" font-size="11" fill="#1f3a52" font-family="'Courier New', monospace">return payload;</text>
  <text x="480" y="283" font-size="9" fill="#666666">reads 42 - and is not a data race</text>

  <line x1="595" y1="222" x2="595" y2="240" stroke="#4a6a8a" stroke-width="1.5"/>
  <polygon points="590,240 600,240 595,248" fill="#4a6a8a"/>
  <text x="606" y="236" font-size="9" font-style="italic" fill="#4a6a8a">sequenced-before</text>

  <text x="595" y="112" font-size="9" fill="#444444" text-anchor="middle">no later operation may be reordered</text>
  <text x="595" y="125" font-size="9" fill="#444444" text-anchor="middle">before the acquire load</text>

  <!-- synchronizes-with edge -->
  <line x1="312" y1="196" x2="462" y2="196" stroke="#a04a4a" stroke-width="2.2"/>
  <polygon points="462,190 462,202 472,196" fill="#a04a4a"/>
  <rect x="330" y="160" width="118" height="30" fill="#f7eeee" stroke="#a04a4a" stroke-width="1.3" rx="4"/>
  <text x="389" y="173" font-size="9.5" font-weight="bold" fill="#6a1f1f" text-anchor="middle">synchronizes-with</text>
  <text x="389" y="184" font-size="8.5" fill="#6a1f1f" text-anchor="middle">same atomic object</text>

  <!-- the transitive edge -->
  <path d="M 185 100 C 185 74, 390 60, 595 262" fill="none" stroke="#7a4a8a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="590,254 600,258 592,266" fill="#7a4a8a"/>
  <text x="390" y="338" font-size="10.5" font-weight="bold" fill="#4a2352" text-anchor="middle">Transitively: the write to payload HAPPENS-BEFORE the read of payload.</text>

  <!-- contrast box -->
  <rect x="40" y="352" width="700" height="72" fill="#f7f3e8" stroke="#a08a4a" stroke-width="1.3" rx="5"/>
  <text x="390" y="371" font-size="11" font-weight="bold" fill="#5c4a14" text-anchor="middle">Replace both with memory_order_relaxed and the edge disappears</text>
  <text x="390" y="389" font-size="9.5" fill="#444444" text-anchor="middle">The flag would still be atomic, so reading it is never undefined - but nothing orders the payload write against the</text>
  <text x="390" y="403" font-size="9.5" fill="#444444" text-anchor="middle">payload read. The consumer may observe published == true and still read a stale payload. That is a data race,</text>
  <text x="390" y="417" font-size="9.5" fill="#444444" text-anchor="middle">and therefore undefined behavior: never use relaxed to publish data.</text>
</svg>
