<title id="sap-finance-guide-allocate-costs-and-read-a-trial-balance-05-allocation-run-title">Terminal with the curl command that posts http/run-allocation.json to runAllocation and the answer: the cycle RENT released 1000.00 with the posting date 2026-03-31, EX-RENT is credited -1000.00 and EX-ADM, EX-SALES and EX-PROD are debited 200.00, 300.00 and 500.00, all on the account 940000, followed by HTTP 200; the long answer wraps onto several lines; callout 8 marks the command</title>
