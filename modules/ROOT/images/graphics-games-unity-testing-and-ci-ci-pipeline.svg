<rect x="438" y="60" width="92" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="484.0" y="97.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Play Mode</text>
<text x="484.0" y="111.8" text-anchor="middle" font-size="11" fill="#3730A3">-runTests</text>
<text x="484.0" y="125.8" text-anchor="middle" font-size="11" fill="#3730A3">-testPlatform</text>
<text x="484.0" y="139.8" text-anchor="middle" font-size="11" fill="#3730A3">PlayMode</text>
<line x1="530" y1="115" x2="542" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah7)"/>
<rect x="544" y="60" width="92" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="590.0" y="97.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Build</text>
<text x="590.0" y="111.8" text-anchor="middle" font-size="11" fill="#3730A3">-executeMethod</text>
<text x="590.0" y="125.8" text-anchor="middle" font-size="11" fill="#3730A3">BuildScript</text>
<text x="590.0" y="139.8" text-anchor="middle" font-size="11" fill="#3730A3">(your method)</text>
<line x1="636" y1="115" x2="648" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah7)"/>
<rect x="650" y="60" width="92" height="110" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="696.0" y="104.8" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Publish</text>
<text x="696.0" y="118.8" text-anchor="middle" font-size="11" fill="#065F46">results XML,</text>
<text x="696.0" y="132.8" text-anchor="middle" font-size="11" fill="#065F46">build artifact</text>
<rect x="14" y="190" width="732" height="110" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="214" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Rules for a reliable pipeline</text>
<text x="380" y="236" text-anchor="middle" font-size="12" fill="#374151">Pin the Unity version (6000.3.x) in ProjectSettings/ProjectVersion.txt and in the CI image.</text>
<text x="380" y="254" text-anchor="middle" font-size="12" fill="#374151">Run with -batchmode and read the exit code and the NUnit XML from -testResults; do not pass -quit with -runTests.</text>
<text x="380" y="272" text-anchor="middle" font-size="12" fill="#374151">Keep the licence only in CI secrets; cache Library, never the licence file; fail the job on any failed test.</text>
</svg>
