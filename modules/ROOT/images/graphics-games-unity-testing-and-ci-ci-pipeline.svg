<text x="166.0" y="111.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Restore cache</text>
<text x="166.0" y="125.8" text-anchor="middle" font-size="11" fill="#374151">Library folder</text>
<line x1="212" y1="115" x2="224" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah7)"/>
<rect x="226" y="60" width="92" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="272.0" y="104.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Activate</text>
<text x="272.0" y="118.8" text-anchor="middle" font-size="11" fill="#92400E">licence from</text>
<text x="272.0" y="132.8" text-anchor="middle" font-size="11" fill="#92400E">CI secret</text>
<line x1="318" y1="115" x2="330" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah7)"/>
<rect x="332" y="60" width="92" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="378.0" y="97.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Edit Mode</text>
<text x="378.0" y="111.8" text-anchor="middle" font-size="11" fill="#3730A3">-runTests</text>
<text x="378.0" y="125.8" text-anchor="middle" font-size="11" fill="#3730A3">-testPlatform</text>
<text x="378.0" y="139.8" text-anchor="middle" font-size="11" fill="#3730A3">EditMode</text>
