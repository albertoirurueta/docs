<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Which Keras a TensorFlow 2.21 program imports</title>
  <desc id="d">A decision diagram. Import keras or tf.keras gives Keras 3 by default. Setting the environment variable TF_USE_LEGACY_KERAS to 1 with the tf-keras package installed makes tf.keras resolve to Keras 2, while a bare import keras still gives Keras 3 unless the import is changed to tf_keras.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Which Keras does the import give you?</text>
  <rect x="245" y="52" width="230" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="360" y="79" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A" text-anchor="middle">TensorFlow 2.21 installed</text>
  <rect x="40" y="140" width="260" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="170" y="164" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">default environment</text>
  <text x="170" y="184" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">import keras / tf.keras</text>
  <text x="170" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F766E" text-anchor="middle">Keras 3</text>
  <rect x="420" y="140" width="260" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="550" y="164" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">pip install tf-keras and</text>
  <text x="550" y="184" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">TF_USE_LEGACY_KERAS=1</text>
  <text x="550" y="201" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">tf.keras is Keras 2</text>
  <line x1="300" y1="96" x2="190" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="420" y1="96" x2="530" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="420" y="234" width="260" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="550" y="254" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A" text-anchor="middle">import tf_keras as keras</text>
  <text x="550" y="271" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">explicit Keras 2 import</text>
  <line x1="550" y1="210" x2="550" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
</svg>
