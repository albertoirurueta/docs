<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 758" width="980" height="758" role="img" aria-labelledby="support-windows-gantt-t support-windows-gantt-d">
<title id="support-windows-gantt-t">Release lines and support windows</title>
<desc id="support-windows-gantt-d">Support windows of WordPress, Drupal, Joomla, TYPO3, Umbraco and Craft CMS release lines, 2019 to 2033, with the check date marked; colour identifies the CMS in this figure. Opacity shows the phase: standard support, security fixes only, and extended or paid support (TYPO3 ELTS, Drupal 7 vendor support). Drupal 7 (ended 2025-01-05) and Joomla 3 (ended 2023-08-17) are historical rows. WordPress supports only its latest release and backports security fixes to older ones as a courtesy, so those segments have no announced end (an arrow marks an open end). TYPO3 and Craft CMS publish multi-year plans; the future dates are plans, not guarantees.</desc>
<style>
