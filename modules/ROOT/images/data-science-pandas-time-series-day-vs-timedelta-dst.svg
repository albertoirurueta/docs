<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t1 d1">
  <title id="t1">Calendar day versus fixed duration across a clock change</title>
  <desc id="d1">A timeline for Europe/Madrid starting on Saturday 24 October 2026 at 12:00. The clocks go back on Sunday 25 October. Adding a calendar Day offset of two lands on Monday 12:00 after 49 elapsed hours, while adding a Timedelta of two days lands on Monday 11:00 after exactly 48 hours.</desc>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Two days later, across a clock change</text>
  <text x="24" y="58" font-size="14" fill="#475569" font-family="Menlo, Consolas, monospace">start = Timestamp("2026-10-24 12:00", tz="Europe/Madrid")</text>
  <!-- axis -->
  <line x1="60" y1="130" x2="660" y2="130" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="60" cy="130" r="6" fill="#0F172A"/>
  <text x="60" y="116" font-size="14" fill="#0F172A" text-anchor="start">Sat 12:00 +02:00</text>
  <!-- DST change -->
  <line x1="244" y1="82" x2="244" y2="250" stroke="#BE123C" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="254" y="76" width="300" height="36" rx="6" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="264" y="92" font-size="12" fill="#0F172A">Sun 03:00 +02:00 becomes 02:00 +01:00</text>
  <text x="264" y="106" font-size="12" fill="#0F172A">that calendar day lasts 25 hours</text>
  <!-- timedelta bar -->
  <rect x="60" y="160" width="587" height="30" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="72" y="180" font-size="14" fill="#0F172A" font-family="Menlo, Consolas, monospace">+ Timedelta(days=2): 48 h</text>
  <circle cx="647" cy="175" r="6" fill="#B45309"/>
  <text x="647" y="212" font-size="14" fill="#0F172A" text-anchor="end">Mon 11:00 +01:00</text>
  <!-- day bar -->
  <rect x="60" y="226" width="600" height="30" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="72" y="246" font-size="14" fill="#0F172A" font-family="Menlo, Consolas, monospace">+ offsets.Day(2): 2 calendar days (49 h)</text>
  <circle cx="660" cy="241" r="6" fill="#0F766E"/>
  <text x="660" y="278" font-size="14" fill="#0F172A" text-anchor="end">Mon 12:00 +01:00</text>
  <text x="24" y="306" font-size="12" fill="#475569">Since pandas 3.0 the Day offset is a calendar day; use Timedelta or "24h" for an exact 24-hour step.</text>
</svg>
