<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 864 604" width="860" height="604" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="currentColor">
  <title id="t">Anatomy of a Magento module</title>
  <desc id="d">File tree of the PocketCoffee_Skeleton module under app/code/PocketCoffee/Skeleton. registration.php, composer.json and etc/module.xml are the minimum. The other files and folders are optional: etc/config.xml, di.xml, area folders with routes.xml, controllers, data patches, view templates and layouts, translations and tests. Each entry has a one-line note on what it does.</desc>
  <rect x="10" y="10" width="840" height="584" rx="12" fill="#7f8c8d" fill-opacity="0.10" stroke="currentColor" stroke-width="1.5"/>
  <text x="30" y="40" font-weight="bold">PocketCoffee_Skeleton</text>
  <rect x="590" y="26" width="14" height="14" rx="3" fill="#e74c3c" fill-opacity="0.35" stroke="currentColor"/>
  <text x="610" y="38" font-size="12">required</text>
  <rect x="690" y="26" width="14" height="14" rx="3" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor"/>
  <text x="710" y="38" font-size="12">optional</text>
  <text x="30" y="68" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold">app/code/PocketCoffee/Skeleton/</text>
  <rect x="50" y="84" width="139" height="24" rx="6" fill="#e74c3c" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
  <text x="57" y="101" font-family="Menlo, Consolas, monospace" font-size="13">registration.php</text>
  <text x="470" y="101" font-size="12">registers the module with the ComponentRegistrar</text>
  <rect x="50" y="118" width="115" height="24" rx="6" fill="#e74c3c" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
  <text x="57" y="135" font-family="Menlo, Consolas, monospace" font-size="13">composer.json</text>
  <text x="470" y="135" font-size="12">package name, type, requirements, autoload files</text>
  <text x="56" y="170" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="bold">etc/</text>
  <rect x="76" y="186" width="92" height="24" rx="6" fill="#e74c3c" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
  <text x="83" y="203" font-family="Menlo, Consolas, monospace" font-size="13">module.xml</text>
  <text x="470" y="203" font-size="12">module name and sequence (load order)</text>
  <rect x="76" y="220" width="92" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="83" y="237" font-family="Menlo, Consolas, monospace" font-size="13">config.xml</text>
  <text x="470" y="237" font-size="12">default values of system configuration</text>
  <rect x="76" y="254" width="61" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="83" y="271" font-family="Menlo, Consolas, monospace" font-size="13">di.xml</text>
  <text x="470" y="271" font-size="12">dependency injection for every area</text>
  <rect x="76" y="288" width="162" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="83" y="305" font-family="Menlo, Consolas, monospace" font-size="13">frontend/routes.xml</text>
  <text x="470" y="305" font-size="12">front name and router for the storefront</text>
  <rect x="76" y="322" width="92" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="83" y="339" font-family="Menlo, Consolas, monospace" font-size="13">adminhtml/</text>
  <text x="470" y="339" font-size="12">area files: di, routes, system, menu, events</text>
  <rect x="50" y="356" width="217" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="57" y="373" font-family="Menlo, Consolas, monospace" font-size="13">Controller/Index/Index.php</text>
  <text x="470" y="373" font-size="12">action class for /pcskeleton/index/index</text>
  <rect x="50" y="390" width="342" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="57" y="407" font-family="Menlo, Consolas, monospace" font-size="13">Setup/Patch/Data/RecordSkeletonInstall.php</text>
  <text x="470" y="407" font-size="12">data patch applied once by setup:upgrade</text>
  <rect x="50" y="424" width="53" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="57" y="441" font-family="Menlo, Consolas, monospace" font-size="13">view/</text>
  <text x="470" y="441" font-size="12">layout, templates, web assets, ui_component</text>
  <rect x="50" y="458" width="209" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="57" y="475" font-family="Menlo, Consolas, monospace" font-size="13">i18n/en_US.csv, es_ES.csv</text>
  <text x="470" y="475" font-size="12">translation dictionaries</text>
  <rect x="50" y="492" width="326" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="57" y="509" font-family="Menlo, Consolas, monospace" font-size="13">Api/, Model/, Block/, Plugin/, Observer/</text>
  <text x="470" y="509" font-size="12">service contracts and code, added as needed</text>
  <rect x="50" y="526" width="186" height="24" rx="6" fill="#2ecc71" fill-opacity="0.30" stroke="currentColor" stroke-width="1"/>
  <text x="57" y="543" font-family="Menlo, Consolas, monospace" font-size="13">Test/Unit/, Test/Mftf/</text>
  <text x="470" y="543" font-size="12">unit and functional tests</text>
</svg>
