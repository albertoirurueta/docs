<svg viewBox="0 0 760 390" width="760" height="390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-performance-buffer-streaming" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="390" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Streaming dynamic data: one buffer, three regions, fences</text>
<rect x="30" y="56" width="700" height="70" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<rect x="30" y="56" width="233" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="146" y="96" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">region 0: GPU reading frame N-2</text>
<rect x="263" y="56" width="233" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="379" y="96" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">region 1: GPU reading frame N-1</text>
<rect x="496" y="56" width="233" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="612" y="96" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">region 2: CPU writing frame N</text>
<text x="380" y="148" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Buffer is split into 3 regions, one per frame in flight</text>
<rect x="30" y="176" width="166" height="86" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="46" cy="192" r="11" fill="#4F46E5"/>
<text x="46" y="196" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="113" y="222" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Wait on the fence</text>
<text x="113" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">of the region you will write</text>
<line x1="196" y1="219" x2="208" y2="219" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-performance-buffer-streaming)"/>
<rect x="208" y="176" width="166" height="86" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="224" cy="192" r="11" fill="#4F46E5"/>
<text x="224" y="196" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="291" y="222" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Write with memcpy</text>
<text x="291" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">into the mapped pointer</text>
<line x1="374" y1="219" x2="386" y2="219" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-performance-buffer-streaming)"/>
<rect x="386" y="176" width="166" height="86" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="402" cy="192" r="11" fill="#4F46E5"/>
<text x="402" y="196" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="469" y="222" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Draw with an offset</text>
<text x="469" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">glBindBufferRange / base vertex</text>
<line x1="552" y1="219" x2="564" y2="219" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-performance-buffer-streaming)"/>
<rect x="564" y="176" width="166" height="86" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="580" cy="192" r="11" fill="#4F46E5"/>
<text x="580" y="196" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="647" y="222" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">glFenceSync after draw</text>
<text x="647" y="242" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">so the region can be reused</text>
<rect x="30" y="286" width="700" height="86" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="310" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Without a fence the CPU may overwrite data the GPU has not read yet. Without MAP_COHERENT_BIT,</text>
<text x="380" y="326" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">call glFlushMappedBufferRange or glMemoryBarrier(GL_CLIENT_MAPPED_BUFFER_BARRIER_BIT) after writing.</text>
<text x="380" y="342" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Fallback when persistent mapping is missing (ES 3.2, GL 4.1): orphan with glBufferData(NULL) or MAP_INVALIDATE_BUFFER_BIT.</text>
</svg>
