<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-gpu-architecture-and-tbdr-tbdr-vs-immediate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Immediate-mode rendering and tile-based deferred rendering</text>
<text x="190" y="58" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Immediate mode (classic desktop GPU)</text>
<text x="570" y="58" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Tile-based deferred (Apple GPU)</text>
<rect x="50" y="75" width="280" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="101.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Vertex shading</text>
<rect x="50" y="137" width="280" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="163.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Rasterise triangle in draw order</text>
<line x1="190" y1="119" x2="190" y2="137" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tbdr-vs-immediate)"/>
<rect x="50" y="199" width="280" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="190.0" y="225.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Depth test, then fragment shading</text>
<line x1="190" y1="181" x2="190" y2="199" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tbdr-vs-immediate)"/>
<rect x="50" y="261" width="280" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="287.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Blend into the framebuffer</text>
<line x1="190" y1="243" x2="190" y2="261" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tbdr-vs-immediate)"/>
<rect x="50" y="330" width="280" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="351.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Framebuffer in video memory</text>
<text x="190.0" y="366.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">touched for every triangle</text>
<line x1="190" y1="299" x2="190" y2="330" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tbdr-vs-immediate)"/>
<rect x="430" y="75" width="300" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="580.0" y="100.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Vertex shading, then bin the triangles into tiles</text>
<rect x="430" y="137" width="300" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="580.0" y="162.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Per tile: depth resolve (hidden surface removal)</text>
<line x1="580" y1="119" x2="580" y2="137" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tbdr-vs-immediate)"/>
<rect x="430" y="199" width="300" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="580.0" y="224.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Shade only the visible fragments</text>
<line x1="580" y1="181" x2="580" y2="199" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tbdr-vs-immediate)"/>
<rect x="430" y="261" width="300" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="580.0" y="286.9" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">Blend and test in on-chip tile memory</text>
<line x1="580" y1="243" x2="580" y2="261" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tbdr-vs-immediate)"/>
<rect x="430" y="330" width="300" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="580.0" y="351.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">Framebuffer in memory written</text>
<text x="580.0" y="366.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">once per tile (the store action)</text>
<line x1="580" y1="299" x2="580" y2="330" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-gpu-architecture-and-tbdr-tbdr-vs-immediate)"/>
<text x="380" y="412" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Tile size and the exact order are implementation details; the guarantees are the ones above.</text>
<text x="380" y="430" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The immediate-mode side is the model of most desktop GPUs; hybrids exist, so treat it as a teaching contrast.</text>
<text x="380" y="448" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Bandwidth is the cost the tile approach avoids: framebuffer traffic stays on chip until the pass ends.</text>
</svg>
