<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>The developer laptop</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">The developer laptop</text>
  <text x="380.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">the IDE-run app on the host; its dependencies in a Compose stack started by spring-boot-docker-compose</text>
  <rect x="20" y="65" width="250" height="300" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="145.0" y="83.0" font-size="12" font-weight="bold" fill="#1c4b73" text-anchor="middle">Host</text>
  <rect x="35" y="105" width="220" height="70" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="145.0" y="129.2" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">IDE / ./mvnw spring-boot:run</text>
  <text x="145.0" y="144.2" font-size="9" fill="#333333" text-anchor="middle">Spring Boot app :8080</text>
  <text x="145.0" y="157.2" font-size="9" fill="#333333" text-anchor="middle">debugger, DevTools</text>
  <rect x="35" y="190" width="220" height="60" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="145.0" y="209.2" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">spring-boot-docker-compose</text>
  <text x="145.0" y="224.2" font-size="9" fill="#333333" text-anchor="middle">docker compose up, readiness,</text>
  <text x="145.0" y="237.2" font-size="9" fill="#333333" text-anchor="middle">ConnectionDetails beans</text>
  <rect x="35" y="265" width="220" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="145.0" y="287.5" font-size="9" fill="#333333" text-anchor="middle">browser / curl / GUI DB client</text>
  <rect x="35" y="315" width="220" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="145.0" y="337.5" font-size="9" fill="#333333" text-anchor="middle">docker compose CLI</text>
  <rect x="320" y="65" width="420" height="300" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="530.0" y="83.0" font-size="12" font-weight="bold" fill="#2d6a34" text-anchor="middle">Compose project "orders" (compose.yaml)</text>
  <rect x="340" y="95" width="180" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="430.0" y="115.8" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">postgres</text>
  <text x="430.0" y="130.8" font-size="9" fill="#333333" text-anchor="middle">127.0.0.1:5432  healthcheck</text>
  <rect x="540" y="130" width="180" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="630.0" y="150.8" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">kafka</text>
  <text x="630.0" y="165.8" font-size="9" fill="#333333" text-anchor="middle">127.0.0.1:9092  healthcheck</text>
  <rect x="340" y="165" width="180" height="50" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="430.0" y="185.8" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">wiremock</text>
  <text x="430.0" y="200.8" font-size="9" fill="#333333" text-anchor="middle">127.0.0.1:8585  payments mock</text>
  <rect x="540" y="190" width="180" height="45" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="630.0" y="208.2" font-size="10.5" font-weight="bold" fill="#555555" text-anchor="middle">volume postgres-data</text>
  <text x="630.0" y="223.2" font-size="9" fill="#333333" text-anchor="middle">kept across restarts</text>
  <rect x="340" y="245" width="380" height="100" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="530.0" y="284.2" font-size="10.5" font-weight="bold" fill="#5b3a8c" text-anchor="middle">profile "observability" (optional)</text>
  <text x="530.0" y="299.2" font-size="9" fill="#333333" text-anchor="middle">prometheus :9090 scrapes host.docker.internal:8080</text>
  <text x="530.0" y="312.2" font-size="9" fill="#333333" text-anchor="middle">grafana :3000 with provisioned datasource</text>
  <line x1="255" y1="120" x2="340" y2="120" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="297.5" y="115.0" font-size="9.5" fill="#555555" text-anchor="middle">JDBC</text>
  <line x1="255" y1="150" x2="540" y2="155" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="560" y="127" font-size="9.5" fill="#555555" text-anchor="middle">Kafka</text>
  <line x1="255" y1="165" x2="340" y2="190" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="300" y="195" font-size="9.5" fill="#555555" text-anchor="middle">HTTP</text>
  <line x1="145" y1="250" x2="145" y2="265" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="255" y1="215" x2="320" y2="215" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="288" y="235" font-size="9.5" fill="#555555" text-anchor="middle">up / stop</text>
  <text x="380" y="395" font-size="10" fill="#555555" text-anchor="middle">The same compose.yaml is started by the integration tests through Testcontainers (with skip.in-tests=true).</text>
</svg>
