<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-b01-ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">One frame: CPU steps, GPU work and the semaphores that join them</text>
<rect x="20" y="70" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.0" y="102.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">wait timeline</text>
<text x="85.0" y="117.0" text-anchor="middle" font-size="11" fill="#3730A3">value of slot</text>
<circle cx="32" cy="66" r="11" fill="#4F46E5"/>
<text x="32" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">1</text>
<line x1="150" y1="105" x2="168" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-ff)"/>
<rect x="168" y="70" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="233.0" y="102.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">acquire image</text>
<text x="233.0" y="117.0" text-anchor="middle" font-size="11" fill="#3730A3">signals acquire sem</text>
<circle cx="180" cy="66" r="11" fill="#4F46E5"/>
<text x="180" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">2</text>
<line x1="298" y1="105" x2="316" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-ff)"/>
<rect x="316" y="70" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="381.0" y="94.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">record</text>
<text x="381.0" y="109.5" text-anchor="middle" font-size="11" fill="#3730A3">barrier2, begin,</text>
<text x="381.0" y="124.5" text-anchor="middle" font-size="11" fill="#3730A3">draw, end, barrier2</text>
<circle cx="328" cy="66" r="11" fill="#4F46E5"/>
<text x="328" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">3</text>
<line x1="446" y1="105" x2="464" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-ff)"/>
<rect x="464" y="70" width="130" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="529.0" y="94.5" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">submit2</text>
<text x="529.0" y="109.5" text-anchor="middle" font-size="11" fill="#92400E">wait acquire,</text>
<text x="529.0" y="124.5" text-anchor="middle" font-size="11" fill="#92400E">signal timeline + render sem</text>
<circle cx="476" cy="66" r="11" fill="#4F46E5"/>
<text x="476" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">4</text>
<line x1="594" y1="105" x2="612" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-ff)"/>
<rect x="612" y="70" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="677.0" y="102.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">present</text>
<text x="677.0" y="117.0" text-anchor="middle" font-size="11" fill="#3730A3">waits render sem</text>
<circle cx="624" cy="66" r="11" fill="#4F46E5"/>
<text x="624" y="70" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
<text x="380" y="175" text-anchor="middle" font-size="12" fill="#4F46E5" font-weight="bold">CPU</text>
<line x1="20" y1="190" x2="740" y2="190" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<text x="380" y="208" text-anchor="middle" font-size="12" fill="#047857" font-weight="bold">GPU / presentation engine</text>
<rect x="280" y="225" width="200" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="247.0" text-anchor="middle" font-size="11" fill="#065F46">GPU executes the command buffer</text>
<text x="380.0" y="262.0" text-anchor="middle" font-size="11" fill="#065F46">colour + depth, then PRESENT layout</text>
<rect x="500" y="225" width="110" height="50" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="555.0" y="247.0" text-anchor="middle" font-size="11" fill="#065F46">image shown</text>
<text x="555.0" y="262.0" text-anchor="middle" font-size="11" fill="#065F46">at vblank</text>
<line x1="480" y1="250" x2="500" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-b01-ff)"/>
<line x1="430" y1="140" x2="380" y2="225" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-b01-ff)"/>
<line x1="620" y1="140" x2="555" y2="225" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-b01-ff)"/>
<rect x="20" y="225" width="240" height="110" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="140.0" y="254.5" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Per frame slot (2 in flight)</text>
<text x="140.0" y="269.5" text-anchor="middle" font-size="11" fill="#374151">command buffer, acquire semaphore,</text>
<text x="140.0" y="284.5" text-anchor="middle" font-size="11" fill="#374151">UBO + pick buffer, expected</text>
<text x="140.0" y="299.5" text-anchor="middle" font-size="11" fill="#374151">timeline value</text>
<text x="140.0" y="314.5" text-anchor="middle" font-size="11" fill="#374151">Per swapchain image: render semaphore</text>
<text x="620" y="310" text-anchor="middle" font-size="11" fill="#374151">a slot is reused only after the</text>
<text x="620" y="325" text-anchor="middle" font-size="11" fill="#374151">timeline wait of step 1 passes</text>
</svg>
