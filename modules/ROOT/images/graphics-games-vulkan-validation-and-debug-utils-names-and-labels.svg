<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vdu-names" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Object names and labels turn handles into readable messages</text>
<rect x="30" y="55" width="320" height="140" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="190.0" y="106.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Without names</text>
<text x="190.0" y="121.0" text-anchor="middle" font-size="11" fill="#92400E">Image 0x5a1c3e0000000012 is in layout</text>
<text x="190.0" y="136.0" text-anchor="middle" font-size="11" fill="#92400E">VK_IMAGE_LAYOUT_UNDEFINED</text>
<text x="190.0" y="151.0" text-anchor="middle" font-size="11" fill="#92400E">but expected SHADER_READ_ONLY_OPTIMAL</text>
<rect x="410" y="55" width="320" height="140" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="570.0" y="106.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">With names and labels</text>
<text x="570.0" y="121.0" text-anchor="middle" font-size="11" fill="#065F46">Image "book cover texture" is in layout</text>
<text x="570.0" y="136.0" text-anchor="middle" font-size="11" fill="#065F46">VK_IMAGE_LAYOUT_UNDEFINED</text>
<text x="570.0" y="151.0" text-anchor="middle" font-size="11" fill="#065F46">in cmd buffer "frame 1 / shadow pass"</text>
<line x1="350" y1="125" x2="408" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vdu-names)"/>
<rect x="30" y="220" width="700" height="130" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="380" y="244" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">A capture tool shows the same labels as a tree</text>
<text x="90" y="266" text-anchor="start" font-size="11" fill="#3730A3">Frame 1</text>
<text x="114" y="280" text-anchor="start" font-size="11" fill="#3730A3">shadow pass</text>
<text x="138" y="294" text-anchor="start" font-size="11" fill="#3730A3">draw shelf</text>
<text x="138" y="308" text-anchor="start" font-size="11" fill="#3730A3">draw books (instanced)</text>
<text x="114" y="322" text-anchor="start" font-size="11" fill="#3730A3">lighting pass</text>
<text x="114" y="336" text-anchor="start" font-size="11" fill="#3730A3">post: dust particles</text>
<text x="560" y="300" text-anchor="middle" font-size="11" fill="#92400E">vkCmdBeginDebugUtilsLabelEXT / End</text>
<text x="560" y="318" text-anchor="middle" font-size="11" fill="#92400E">vkSetDebugUtilsObjectNameEXT</text>
</svg>
