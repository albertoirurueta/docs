<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 646" width="760" height="646" role="img" aria-labelledby="radar-mainstream-t radar-mainstream-d">
<title id="radar-mainstream-t">Mainstream picks: scores on twelve axes</title>
<desc id="radar-mainstream-d">The CMS with the highest computed popularity in each group. Scores from 0 to 10 on twelve axes for WordPress, Wix, Sanity, AEM. Five axes (popularity, growth, talent pool, ecosystem and performance) are computed from the data of 2026-10-29 and seven are editorial scores with a recorded basis; the rubric is in the data notes. Low cost, low maintenance effort and portability are oriented so that a larger area is always better. A gap in the outline means no data (n/a).</desc>
