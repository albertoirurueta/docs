<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">Three tiers of SAP S/4HANA: presentation, ABAP application server and SAP HANA database</title>
  <desc id="d">Presentation tier: a browser with SAP Fiori launchpad and the desktop program SAP GUI. Application tier: the ABAP application server, which runs ABAP programs, exposes OData services through SAP Gateway and contains the virtual data model, a layer of CDS views whose names start with I_ for interface views and C_ for consumption views. Database tier: SAP HANA, which stores the tables and runs the CDS views. Requests go down, results come back up.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="20" y="20" width="1000" height="130" rx="14" fill="#ff6ec4" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="46" text-anchor="start" font-size="15" font-weight="bold">Presentation tier: what the user sees</text>
  <rect x="60" y="62" width="420" height="72" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="270" y="93" text-anchor="middle" font-size="14" font-weight="bold">SAP Fiori launchpad</text>
  <text x="270" y="112" text-anchor="middle" font-size="12">web browser, apps as tiles</text>
  <rect x="560" y="62" width="420" height="72" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="770" y="93" text-anchor="middle" font-size="14" font-weight="bold">SAP GUI</text>
  <text x="770" y="112" text-anchor="middle" font-size="12">desktop program, transactions</text>
  <line x1="270" y1="150" x2="270" y2="190" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="770" y1="150" x2="770" y2="190" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="290" y="176" text-anchor="start" font-size="12">HTTPS, OData</text>
  <text x="790" y="176" text-anchor="start" font-size="12">SAP GUI protocol (DIAG)</text>
  <rect x="20" y="190" width="1000" height="190" rx="14" fill="#7873f5" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="216" text-anchor="start" font-size="15" font-weight="bold">Application tier: the ABAP application server</text>
  <rect x="60" y="232" width="280" height="130" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="200" y="282.5" text-anchor="middle" font-size="14" font-weight="bold">ABAP programs</text>
  <text x="200" y="301.5" text-anchor="middle" font-size="12">business logic, transactions,</text>
  <text x="200" y="320.5" text-anchor="middle" font-size="12">classes, RAP business objects</text>
  <rect x="380" y="232" width="280" height="130" rx="10" fill="#5b9bd5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="282.5" text-anchor="middle" font-size="14" font-weight="bold">SAP Gateway (OData)</text>
  <text x="520" y="301.5" text-anchor="middle" font-size="12">services that Fiori apps</text>
  <text x="520" y="320.5" text-anchor="middle" font-size="12">and other clients call</text>
  <rect x="700" y="232" width="280" height="130" rx="10" fill="#2fbf71" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="840" y="282.5" text-anchor="middle" font-size="14" font-weight="bold">Virtual data model</text>
  <text x="840" y="301.5" text-anchor="middle" font-size="12">CDS views: I_ interface views,</text>
  <text x="840" y="320.5" text-anchor="middle" font-size="12">C_ consumption views</text>
  <line x1="520" y1="380" x2="520" y2="420" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="420" width="1000" height="120" rx="14" fill="#4ade80" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
  <text x="40" y="446" text-anchor="start" font-size="15" font-weight="bold">Database tier</text>
  <rect x="60" y="458" width="920" height="66" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="486" text-anchor="middle" font-size="14" font-weight="bold">SAP HANA</text>
  <text x="520" y="505" text-anchor="middle" font-size="12">in-memory column store: tables of the data model, CDS views run here</text>
</svg>
