<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Concurrency in Verse: race cancels the loser</text>
<text x="380" y="52" text-anchor="middle" font-size="12" fill="#374151">WaitOrTimeout runs two suspending expressions and keeps the first to finish</text>
<text x="18" y="92" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">race: first branch</text>
<rect x="170" y="70" width="570" height="34" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="180" y="74" width="250" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="305.0" y="92" text-anchor="middle" font-size="11" fill="#1F2937">WaitForPress (Await)</text>
<text x="18" y="138" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">race: second branch</text>
<rect x="170" y="116" width="570" height="34" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="180" y="120" width="250" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="305.0" y="138" text-anchor="middle" font-size="11" fill="#1F2937">Sleep(10.0)</text>
<rect x="432" y="120" width="288" height="26" rx="4" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"/>
<text x="576" y="137" text-anchor="middle" font-size="11" fill="#374151">cancelled remainder</text>
<rect x="430" y="112" width="3" height="42" rx="0" fill="#B45309" stroke="#B45309" stroke-width="1"/>
<text x="432" y="168" text-anchor="middle" font-size="11" fill="#92400E">button pressed: the other branch is cancelled</text>
<text x="18" y="218" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">sync: all branches</text>
<rect x="170" y="196" width="570" height="34" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="180" y="200" width="250" height="26" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="305.0" y="218" text-anchor="middle" font-size="11" fill="#1F2937">Task A</text>
<rect x="180" y="200" width="400" height="26" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="380.0" y="218" text-anchor="middle" font-size="11" fill="#1F2937">Task B</text>
<rect x="580" y="192" width="3" height="42" rx="0" fill="#047857" stroke="#047857" stroke-width="1"/>
<text x="582" y="250" text-anchor="middle" font-size="11" fill="#065F46">sync continues when the slowest branch ends</text>
<text x="380" y="292" text-anchor="middle" font-size="12" fill="#374151">spawn starts a suspending function that keeps running after the surrounding code continues</text>
<text x="380" y="312" text-anchor="middle" font-size="12" fill="#374151">All of these need an async context: a function marked with the suspends specifier</text>
</svg>
