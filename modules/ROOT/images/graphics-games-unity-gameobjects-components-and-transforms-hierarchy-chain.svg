<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-go-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Parenting multiplies transforms from the root down</text>
<rect x="30" y="56" width="300" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="42" y="75" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">Room</text>
<text x="42" y="92" text-anchor="start" font-size="11" fill="#374151">local T(0,0,0)</text>
<rect x="60" y="114" width="300" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="72" y="133" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">Shelf</text>
<text x="72" y="150" text-anchor="start" font-size="11" fill="#374151">local T(3,0,1)  R(0,30,0)</text>
<line x1="45" y1="102" x2="45" y2="137" stroke="#4B5563" stroke-width="1.2"/>
<line x1="45" y1="137" x2="60" y2="137" stroke="#4B5563" stroke-width="1.2" marker-end="url(#ah-go-chain)"/>
<rect x="90" y="172" width="300" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="102" y="191" text-anchor="start" font-size="12" fill="#3730A3" font-weight="bold">Board_2</text>
<text x="102" y="208" text-anchor="start" font-size="11" fill="#374151">local T(0,1.2,0)</text>
<line x1="75" y1="160" x2="75" y2="195" stroke="#4B5563" stroke-width="1.2"/>
<line x1="75" y1="195" x2="90" y2="195" stroke="#4B5563" stroke-width="1.2" marker-end="url(#ah-go-chain)"/>
<rect x="120" y="230" width="300" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="132" y="249" text-anchor="start" font-size="12" fill="#92400E" font-weight="bold">Book_07</text>
<text x="132" y="266" text-anchor="start" font-size="11" fill="#374151">local T(0.4,0.1,0)  R(0,0,-8)</text>
<line x1="105" y1="218" x2="105" y2="253" stroke="#4B5563" stroke-width="1.2"/>
<line x1="105" y1="253" x2="120" y2="253" stroke="#4B5563" stroke-width="1.2" marker-end="url(#ah-go-chain)"/>
<rect x="440" y="56" width="300" height="150" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="590" y="78" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Matrices, left to right</text>
<text x="590" y="104" text-anchor="middle" font-size="12" fill="#374151">world(Book) =</text>
<text x="590" y="123" text-anchor="middle" font-size="12" fill="#374151">local(Room) x local(Shelf)</text>
<text x="590" y="142" text-anchor="middle" font-size="12" fill="#374151">x local(Board) x local(Book)</text>
<text x="590" y="161" text-anchor="middle" font-size="12" fill="#374151"></text>
<text x="590" y="180" text-anchor="middle" font-size="12" fill="#374151">A point in Book space is moved</text>
<text x="590" y="199" text-anchor="middle" font-size="12" fill="#374151">into world space by all four.</text>
<rect x="440" y="222" width="300" height="170" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="590" y="244" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Watch the scale</text>
<text x="590" y="270" text-anchor="middle" font-size="11" fill="#1F2937">A rotated child under a parent with</text>
<text x="590" y="289" text-anchor="middle" font-size="11" fill="#1F2937">non-uniform scale becomes skewed.</text>
<text x="590" y="308" text-anchor="middle" font-size="11" fill="#1F2937">lossyScale is only an approximation.</text>
<text x="590" y="327" text-anchor="middle" font-size="11" fill="#1F2937">Keep parent scale at (1,1,1) and</text>
<text x="590" y="346" text-anchor="middle" font-size="11" fill="#1F2937">scale the mesh or a child instead.</text>
<rect x="30" y="296" width="300" height="96" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="180" y="320" text-anchor="middle" font-size="11" fill="#065F46">Moving Shelf moves every descendant;</text>
<text x="180" y="338" text-anchor="middle" font-size="11" fill="#065F46">the children keep their local values.</text>
<text x="180" y="356" text-anchor="middle" font-size="11" fill="#065F46">Unparenting keeps world values with</text>
<text x="180" y="374" text-anchor="middle" font-size="11" fill="#065F46">SetParent(null, true).</text>
</svg>
