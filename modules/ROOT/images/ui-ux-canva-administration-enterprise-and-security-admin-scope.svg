<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Who controls what: organization, teams and groups</text>
  <!-- organization -->
  <rect x="12" y="46" width="736" height="130" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <circle cx="34" cy="68" r="11" fill="#4F46E5"/><text x="34" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="54" y="73" font-size="13" font-weight="bold" fill="#1F2937">Organization (Bookshelf Inc.), managed by organization admins</text>
  <g fill="#FFFFFF" stroke="#9CA3AF">
    <rect x="30" y="88" width="160" height="70" rx="6"/><rect x="204" y="88" width="160" height="70" rx="6"/><rect x="378" y="88" width="160" height="70" rx="6"/><rect x="552" y="88" width="180" height="70" rx="6"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="110" y="110">Single sign-on, SCIM</text><text x="110" y="126">verified domains</text><text x="110" y="142">force logout</text>
    <text x="284" y="110">Default permissions</text><text x="284" y="126">team override on or off</text><text x="284" y="142">feature controls</text>
    <text x="458" y="110">Audit logs</text><text x="458" y="126">usage and domain reports</text><text x="458" y="142">data residency</text>
    <text x="642" y="110">Billing, brand controls</text><text x="642" y="126">team creation, org admins</text><text x="642" y="142">support design sharing</text>
  </g>
  <!-- arrow -->
  <path d="M380,176 L380,200" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="392" y="193" font-size="12" fill="#374151">defaults flow down unless a team has overrides</text>
  <!-- teams -->
  <rect x="12" y="206" width="360" height="150" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="34" cy="228" r="11" fill="#4F46E5"/><text x="34" y="232" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="54" y="233" font-size="13" font-weight="bold" fill="#1F2937">Team: Marketing</text>
  <text x="30" y="254" font-size="12" fill="#374151">Team admins: members, projects, content</text>
  <rect x="30" y="266" width="150" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="105" y="288" font-size="12" fill="#374151" text-anchor="middle">Group: Campaign editors</text>
  <rect x="192" y="266" width="164" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="274" y="288" font-size="12" fill="#374151" text-anchor="middle">Group: Reviewers</text>
  <text x="30" y="324" font-size="12" fill="#374151">Brand designers: Brand Kits, Brand Templates</text>
  <text x="30" y="342" font-size="12" fill="#374151">Members: create and collaborate</text>
  <rect x="388" y="206" width="360" height="150" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="410" cy="228" r="11" fill="#4F46E5"/><text x="410" y="232" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="430" y="233" font-size="13" font-weight="bold" fill="#1F2937">Team: Community and events</text>
  <text x="406" y="254" font-size="12" fill="#374151">Team admins: only this team</text>
  <rect x="406" y="266" width="150" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="481" y="288" font-size="12" fill="#374151" text-anchor="middle">Group: Meetup hosts</text>
  <rect x="568" y="266" width="164" height="34" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="650" y="288" font-size="12" fill="#92400E" text-anchor="middle">Own permission overrides</text>
  <text x="406" y="324" font-size="12" fill="#374151">No access to organization-wide settings</text>
  <text x="406" y="342" font-size="12" fill="#374151">Listed under Organization when permissions differ</text>
  <text x="380" y="382" font-size="12" fill="#92400E" text-anchor="middle">Organization admins set the defaults; team admins adjust them only where overrides are enabled.</text>
  <text x="380" y="402" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
