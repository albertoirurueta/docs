<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="1080" height="360" role="img" aria-labelledby="sap-finance-guide-compute-a-depreciation-schedule-05-even-schedules-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-finance-guide-compute-a-depreciation-schedule-05-even-schedules-title">Terminal with two curl commands piped to jq: the straight-line schedule of 15000 over 5 years shows 3000.00 in each of the five years and a net book value of 0.00 at the end (callout 8), and the remaining-life schedule of a net book value of 500 over 5 years shows 100.00 in each year (callout 9); the long commands wrap onto a second line</title>
<g><rect x="0" y="0" width="1080" height="360" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="328" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s &quot;http://localhost:4004/odata/v4/depreciation/calculate(Method='straight-line',Base=15000,Years=5)&quot; | jq -c '</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">.value[] | {Year,Depreciation,NetBookValue,Rule}'</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:1,&quot;Depreciation&quot;:&quot;3000.00&quot;,&quot;NetBookValue&quot;:&quot;12000.00&quot;,&quot;Rule&quot;:&quot;straight-line&quot;}</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:2,&quot;Depreciation&quot;:&quot;3000.00&quot;,&quot;NetBookValue&quot;:&quot;9000.00&quot;,&quot;Rule&quot;:&quot;straight-line&quot;}</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:3,&quot;Depreciation&quot;:&quot;3000.00&quot;,&quot;NetBookValue&quot;:&quot;6000.00&quot;,&quot;Rule&quot;:&quot;straight-line&quot;}</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:4,&quot;Depreciation&quot;:&quot;3000.00&quot;,&quot;NetBookValue&quot;:&quot;3000.00&quot;,&quot;Rule&quot;:&quot;straight-line&quot;}</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:5,&quot;Depreciation&quot;:&quot;3000.00&quot;,&quot;NetBookValue&quot;:&quot;0.00&quot;,&quot;Rule&quot;:&quot;straight-line&quot;}</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s &quot;http://localhost:4004/odata/v4/depreciation/calculate(Method='remaining-life',Base=500,Years=5)&quot; | jq -c '.</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">value[] | {Year,Depreciation,NetBookValue,Rule}'</text>
<text x="16" y="251" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:1,&quot;Depreciation&quot;:&quot;100.00&quot;,&quot;NetBookValue&quot;:&quot;400.00&quot;,&quot;Rule&quot;:&quot;remaining-life&quot;}</text>
<text x="16" y="272" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:2,&quot;Depreciation&quot;:&quot;100.00&quot;,&quot;NetBookValue&quot;:&quot;300.00&quot;,&quot;Rule&quot;:&quot;remaining-life&quot;}</text>
<text x="16" y="293" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:3,&quot;Depreciation&quot;:&quot;100.00&quot;,&quot;NetBookValue&quot;:&quot;200.00&quot;,&quot;Rule&quot;:&quot;remaining-life&quot;}</text>
<text x="16" y="314" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:4,&quot;Depreciation&quot;:&quot;100.00&quot;,&quot;NetBookValue&quot;:&quot;100.00&quot;,&quot;Rule&quot;:&quot;remaining-life&quot;}</text>
<text x="16" y="335" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">{&quot;Year&quot;:5,&quot;Depreciation&quot;:&quot;100.00&quot;,&quot;NetBookValue&quot;:&quot;0.00&quot;,&quot;Rule&quot;:&quot;remaining-life&quot;}</text>
<rect x="5" y="46" width="1042" height="149" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">8</text></g>
<rect x="5" y="193" width="1042" height="149" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="193" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="198" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">9</text></g></g>
</svg>
