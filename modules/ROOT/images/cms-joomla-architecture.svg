<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Joomla architecture: applications, libraries, extension types, database and media</title>
  <desc id="d">Five applications sit on top of the framework libraries and the dependency injection container. Extensions of eight types plug into them. Below are the database and the media and cache folders.</desc>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Joomla architecture at a glance</text>

  <!-- Applications -->
  <text x="30" y="62" font-size="13" font-weight="bold" fill="#374151">1. Applications (one entry point each)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="72" width="170" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="115" y="95" font-weight="bold" fill="#1e3a8a">Site</text>
    <text x="115" y="113" fill="#1f2937">index.php</text>
    <text x="115" y="128" fill="#1f2937">SiteApplication</text>
    <rect x="212" y="72" width="170" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="297" y="95" font-weight="bold" fill="#1e3a8a">Administrator</text>
    <text x="297" y="113" fill="#1f2937">administrator/index.php</text>
    <text x="297" y="128" fill="#1f2937">AdministratorApplication</text>
    <rect x="394" y="72" width="170" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="479" y="95" font-weight="bold" fill="#1e3a8a">API</text>
    <text x="479" y="113" fill="#1f2937">api/index.php</text>
    <text x="479" y="128" fill="#1f2937">ApiApplication</text>
    <rect x="576" y="72" width="170" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="661" y="95" font-weight="bold" fill="#1e3a8a">Console</text>
    <text x="661" y="113" fill="#1f2937">cli/joomla.php</text>
    <text x="661" y="128" fill="#1f2937">Joomla\Console\Application</text>
    <rect x="758" y="72" width="172" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="844" y="95" font-weight="bold" fill="#1e3a8a">Installation</text>
    <text x="844" y="113" fill="#1f2937">installation/index.php</text>
    <text x="844" y="128" fill="#1f2937">InstallationApplication</text>
  </g>

  <!-- Core layer -->
  <text x="30" y="170" font-size="13" font-weight="bold" fill="#374151">2. Shared core (libraries/)</text>
  <rect x="30" y="180" width="900" height="120" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <g font-size="12" text-anchor="middle">
    <rect x="46" y="194" width="205" height="46" rx="6" fill="#ffffff" stroke="#6b7280"/>
    <text x="148" y="213" font-weight="bold" fill="#111827">DI container</text>
    <text x="148" y="230" fill="#374151">Joomla\DI\Container</text>
    <rect x="263" y="194" width="205" height="46" rx="6" fill="#ffffff" stroke="#6b7280"/>
    <text x="365" y="213" font-weight="bold" fill="#111827">Event dispatcher</text>
    <text x="365" y="230" fill="#374151">Joomla\Event + CMS events</text>
    <rect x="480" y="194" width="205" height="46" rx="6" fill="#ffffff" stroke="#6b7280"/>
    <text x="582" y="213" font-weight="bold" fill="#111827">Routers and MVC</text>
    <text x="582" y="230" fill="#374151">SiteRouter, ApiRouter, MVCFactory</text>
    <rect x="697" y="194" width="217" height="46" rx="6" fill="#ffffff" stroke="#6b7280"/>
    <text x="805" y="213" font-weight="bold" fill="#111827">Autoloading</text>
    <text x="805" y="230" fill="#374151">PSR-4 map + Composer classmap</text>
    <rect x="46" y="250" width="205" height="38" rx="6" fill="#ffffff" stroke="#6b7280"/>
    <text x="148" y="274" fill="#111827">Database (DatabaseInterface)</text>
    <rect x="263" y="250" width="205" height="38" rx="6" fill="#ffffff" stroke="#6b7280"/>
    <text x="365" y="274" fill="#111827">Document, Layout, HTML</text>
    <rect x="480" y="250" width="205" height="38" rx="6" fill="#ffffff" stroke="#6b7280"/>
    <text x="582" y="274" fill="#111827">Form, Table, Registry</text>
    <rect x="697" y="250" width="217" height="38" rx="6" fill="#ffffff" stroke="#6b7280"/>
    <text x="805" y="274" fill="#111827">Web Asset Manager, Language</text>
  </g>

  <!-- Extensions -->
  <text x="30" y="334" font-size="13" font-weight="bold" fill="#374151">3. Extensions (installed from a manifest, each with services/provider.php)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="344" width="104" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="82" y="368" font-weight="bold" fill="#14532d">component</text>
    <text x="82" y="386" fill="#1f2937">com_tallpine</text>
    <rect x="144" y="344" width="104" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="196" y="368" font-weight="bold" fill="#14532d">module</text>
    <text x="196" y="386" fill="#1f2937">mod_tallpine_nexthikes</text>
    <rect x="258" y="344" width="104" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="310" y="368" font-weight="bold" fill="#14532d">plugin</text>
    <text x="310" y="386" fill="#1f2937">plg_content_...</text>
    <rect x="372" y="344" width="104" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="424" y="368" font-weight="bold" fill="#14532d">template</text>
    <text x="424" y="386" fill="#1f2937">cassiopeia_tallpine</text>
    <rect x="486" y="344" width="104" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="538" y="368" font-weight="bold" fill="#14532d">language</text>
    <text x="538" y="386" fill="#1f2937">de-DE</text>
    <rect x="600" y="344" width="104" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="652" y="368" font-weight="bold" fill="#14532d">library</text>
    <text x="652" y="386" fill="#1f2937">lib_tallpine</text>
    <rect x="714" y="344" width="104" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="766" y="368" font-weight="bold" fill="#14532d">file</text>
    <text x="766" y="386" fill="#1f2937">loose files</text>
    <rect x="828" y="344" width="102" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="879" y="368" font-weight="bold" fill="#14532d">package</text>
    <text x="879" y="386" fill="#1f2937">pkg_tallpine</text>
  </g>
  <text x="30" y="424" font-size="12" fill="#374151">A package bundles any of the other seven types and installs them together.</text>

  <!-- Storage -->
  <text x="30" y="458" font-size="13" font-weight="bold" fill="#374151">4. Storage</text>
  <g font-size="12" text-anchor="middle">
    <path d="M60 480 v62 a70 14 0 0 0 140 0 v-62 a70 14 0 0 0 -140 0 a70 14 0 0 0 140 0" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="130" y="520" font-weight="bold" fill="#78350f">Database</text>
    <text x="130" y="538" fill="#78350f">MySQL, MariaDB, PostgreSQL</text>
    <rect x="260" y="480" width="200" height="72" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="360" y="508" font-weight="bold" fill="#78350f">images/ and media/</text>
    <text x="360" y="527" fill="#78350f">uploads, vendor assets,</text>
    <text x="360" y="543" fill="#78350f">extension assets</text>
    <rect x="490" y="480" width="200" height="72" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="590" y="508" font-weight="bold" fill="#78350f">cache/, tmp/, logs/</text>
    <text x="590" y="527" fill="#78350f">autoload_psr4.php,</text>
    <text x="590" y="543" fill="#78350f">page cache, logs</text>
    <rect x="720" y="480" width="210" height="72" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="825" y="508" font-weight="bold" fill="#78350f">configuration.php</text>
    <text x="825" y="527" fill="#78350f">database credentials,</text>
    <text x="825" y="543" fill="#78350f">paths, site settings</text>
  </g>

  <!-- arrows -->
  <g stroke="#4b5563" stroke-width="1.5" fill="none">
    <path d="M480 138 V178"/><path d="M115 138 V178"/><path d="M297 138 V178"/><path d="M661 138 V178"/><path d="M844 138 V178"/>
    <path d="M480 302 V342"/><path d="M130 408 V430 M130 430 H130" stroke-dasharray="0"/>
    <path d="M480 404 V440 M130 440 V474 M360 440 V474 M590 440 V474 M825 440 V474 M130 440 H825"/>
  </g>
</svg>
