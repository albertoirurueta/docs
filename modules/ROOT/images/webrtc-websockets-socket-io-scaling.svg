<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Two Socket.IO server instances behind a load balancer share one Redis: a message from Ada on instance A is stored and published through Redis, and instance B delivers it to Bob; the Redis Streams adapter additionally keeps the packets that connection state recovery replays</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">One room, two instances, one Redis</text>
  <text x="400" y="44" font-size="10.5" fill="#555555" text-anchor="middle">the adapter forwards every room broadcast to the other instances; the application keeps seq and history in Redis too</text>

  <rect x="30" y="80" width="130" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="95" y="104" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Ada</text>
  <text x="95" y="122" font-size="10" fill="#0d3c75" text-anchor="middle">browser, WebSocket only</text>
  <rect x="30" y="250" width="130" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="95" y="274" font-size="13" font-weight="bold" fill="#0d3c75" text-anchor="middle">Bob</text>
  <text x="95" y="292" font-size="10" fill="#0d3c75" text-anchor="middle">browser, WebSocket only</text>

  <rect x="230" y="80" width="170" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="315" y="104" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Instance A (8110)</text>
  <text x="315" y="122" font-size="10" fill="#1b5e20" text-anchor="middle">room general: Ada</text>
  <rect x="230" y="250" width="170" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="315" y="274" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">Instance B (8111)</text>
  <text x="315" y="292" font-size="10" fill="#1b5e20" text-anchor="middle">room general: Bob</text>

  <rect x="500" y="150" width="270" height="130" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="635" y="174" font-size="13" font-weight="bold" fill="#6d4c00" text-anchor="middle">Redis (host port 6310)</text>
  <text x="635" y="196" font-size="10.5" fill="#6d4c00" text-anchor="middle">INCR cb:seq:general (shared seq)</text>
  <text x="635" y="214" font-size="10.5" fill="#6d4c00" text-anchor="middle">ZADD cb:room:general (history)</text>
  <text x="635" y="232" font-size="10.5" fill="#6d4c00" text-anchor="middle">pub/sub channel or stream (adapter)</text>
  <text x="635" y="250" font-size="10.5" fill="#6d4c00" text-anchor="middle">sio:session:* (recovery, streams only)</text>
  <text x="635" y="268" font-size="10" font-style="italic" fill="#6d4c00" text-anchor="middle">pub/sub adapter: no recovery</text>

  <line x1="160" y1="108" x2="228" y2="108" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="228" y1="278" x2="160" y2="278" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="110" x2="498" y2="180" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="498" y1="250" x2="400" y2="280" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="194" y="100" font-size="10" fill="#37474f" text-anchor="middle">1 message</text>
  <text x="194" y="296" font-size="10" fill="#37474f" text-anchor="middle">4 deliver</text>
  <text x="470" y="130" font-size="10" fill="#37474f" text-anchor="middle">2 INCR, ZADD, publish</text>
  <text x="470" y="278" font-size="10" fill="#37474f" text-anchor="middle">3 forward</text>

  <text x="400" y="350" font-size="11" fill="#555555" text-anchor="middle">Ada and Bob can sit on different instances with no sticky sessions, because both use the WebSocket transport only</text>
</svg>
