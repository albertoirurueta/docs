<svg viewBox="0 0 900 520" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Anatomy of a PDF file: four parts in the file, one tree of objects in the document</text>

  <text x="140" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#333">File layout (top to bottom)</text>
  <rect x="30" y="66" width="220" height="44" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="140" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Header</text>
  <text x="140" y="101" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">%PDF-1.7  + binary comment</text>

  <rect x="30" y="118" width="220" height="196" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="140" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">Body</text>
  <rect x="44" y="150" width="192" height="26" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="140" y="167" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">1 0 obj  Catalog</text>
  <rect x="44" y="182" width="192" height="26" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="140" y="199" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">2 0 obj  Pages</text>
  <rect x="44" y="214" width="192" height="26" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="140" y="231" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">3 0 obj  Page</text>
  <rect x="44" y="246" width="192" height="26" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="140" y="263" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">4 0 obj  stream</text>
  <rect x="44" y="278" width="192" height="26" rx="4" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="140" y="295" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">5 0 obj  Font</text>

  <rect x="30" y="322" width="220" height="70" rx="6" fill="#fde8c8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="140" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Cross-reference table</text>
  <text x="140" y="360" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">xref  0 6</text>
  <text x="140" y="376" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">0000000015 00000 n  ...</text>

  <rect x="30" y="400" width="220" height="96" rx="6" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="140" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">Trailer</text>
  <text x="140" y="440" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">&lt;&lt; /Size 6 /Root 1 0 R &gt;&gt;</text>
  <text x="140" y="458" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">startxref 418</text>
  <text x="140" y="476" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">%%EOF</text>

  <!-- offsets: xref entries point back into body -->
  <path d="M250 357 C 285 357, 285 190, 252 190" fill="none" stroke="#b36b00" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#fs-arrow)"/>
  <text x="292" y="270" font-size="11" fill="#7a4800">byte offsets</text>
  <!-- startxref points at xref -->
  <path d="M250 466 C 320 466, 320 380, 252 380" fill="none" stroke="#2b7a2b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#fs-arrow)"/>
  <text x="326" y="428" font-size="11" fill="#2b7a2b">startxref</text>

  <text x="640" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Object graph (what a reader builds from the file)</text>

  <rect x="545" y="70" width="190" height="40" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.6"/>
  <text x="640" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#2b7a2b">Trailer  /Root</text>

  <rect x="545" y="140" width="190" height="46" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="640" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">Catalog (1 0 R)</text>
  <text x="640" y="177" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">/Pages 2 0 R</text>

  <rect x="545" y="216" width="190" height="46" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="640" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">Pages node (2 0 R)</text>
  <text x="640" y="253" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">/Kids [3 0 R] /Count 1</text>

  <rect x="545" y="292" width="190" height="46" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="640" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">Page (3 0 R)</text>
  <text x="640" y="329" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">/MediaBox [0 0 595 842]</text>

  <rect x="420" y="400" width="200" height="66" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="520" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Content stream (4 0 R)</text>
  <text x="520" y="438" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">BT /F1 24 Tf 72 700 Td</text>
  <text x="520" y="454" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">(Hello) Tj ET</text>

  <rect x="680" y="400" width="190" height="66" rx="8" fill="#fde8c8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="775" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Resources</text>
  <text x="775" y="438" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">/Font &lt;&lt; /F1 5 0 R &gt;&gt;</text>
  <text x="775" y="454" text-anchor="middle" font-size="11" fill="#7a4800">Font (5 0 R): Helvetica</text>

  <line x1="640" y1="110" x2="640" y2="138" stroke="#555" stroke-width="1.4" marker-end="url(#fs-arrow)"/>
  <line x1="640" y1="186" x2="640" y2="214" stroke="#555" stroke-width="1.4" marker-end="url(#fs-arrow)"/>
  <line x1="640" y1="262" x2="640" y2="290" stroke="#555" stroke-width="1.4" marker-end="url(#fs-arrow)"/>
  <line x1="600" y1="338" x2="540" y2="398" stroke="#555" stroke-width="1.4" marker-end="url(#fs-arrow)"/>
  <line x1="680" y1="338" x2="750" y2="398" stroke="#555" stroke-width="1.4" marker-end="url(#fs-arrow)"/>
  <text x="548" y="372" font-size="11" fill="#555">/Contents</text>
  <text x="730" y="372" font-size="11" fill="#555">/Resources</text>
  <path d="M545 315 C 490 315, 490 239, 543 239" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#fs-arrow)"/>
  <text x="400" y="272" font-size="11" fill="#555">/Parent points back up</text>
</svg>
