<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-android-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Handling a rotation, step by step</text>
<rect x="20" y="70" width="112" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="86" r="11" fill="#4F46E5"/><text x="36" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<rect x="30" y="110" width="92" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="76.0" y="143.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Present returns</text>
<text x="76" y="200" text-anchor="middle" font-size="10" fill="#374151">SUBOPTIMAL_KHR</text>
<text x="76" y="216" text-anchor="middle" font-size="10" fill="#374151">(Android 10 and later)</text>
<line x1="133" y1="155" x2="141" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-story)"/>
<rect x="142" y="70" width="112" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="158" cy="86" r="11" fill="#4F46E5"/><text x="158" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<rect x="152" y="110" width="92" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="198.0" y="143.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Wait idle</text>
<text x="198" y="200" text-anchor="middle" font-size="10" fill="#374151">vkDeviceWaitIdle</text>
<text x="198" y="216" text-anchor="middle" font-size="10" fill="#374151">or wait on fences</text>
<line x1="255" y1="155" x2="263" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-story)"/>
<rect x="264" y="70" width="112" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="280" cy="86" r="11" fill="#4F46E5"/><text x="280" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<rect x="274" y="110" width="92" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="320.0" y="143.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Read caps</text>
<text x="320" y="200" text-anchor="middle" font-size="10" fill="#374151">currentTransform</text>
<text x="320" y="216" text-anchor="middle" font-size="10" fill="#374151">sets preTransform</text>
<line x1="377" y1="155" x2="385" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-story)"/>
<rect x="386" y="70" width="112" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="402" cy="86" r="11" fill="#4F46E5"/><text x="402" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<rect x="396" y="110" width="92" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="442.0" y="143.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Recreate</text>
<text x="442" y="200" text-anchor="middle" font-size="10" fill="#374151">new swapchain</text>
<text x="442" y="216" text-anchor="middle" font-size="10" fill="#374151">oldSwapchain = old</text>
<line x1="499" y1="155" x2="507" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-story)"/>
<rect x="508" y="70" width="112" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="524" cy="86" r="11" fill="#4F46E5"/><text x="524" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<rect x="518" y="110" width="92" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="564.0" y="143.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Update</text>
<text x="564" y="200" text-anchor="middle" font-size="10" fill="#374151">MVP, viewport,</text>
<text x="564" y="216" text-anchor="middle" font-size="10" fill="#374151">scissor, derivatives</text>
<line x1="621" y1="155" x2="629" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-story)"/>
<rect x="630" y="70" width="112" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="646" cy="86" r="11" fill="#4F46E5"/><text x="646" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
<rect x="640" y="110" width="92" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="686.0" y="143.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Resume</text>
<text x="686" y="200" text-anchor="middle" font-size="10" fill="#374151">draw at the</text>
<text x="686" y="216" text-anchor="middle" font-size="10" fill="#374151">identity extent</text>
<rect x="40" y="270" width="320" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="200.0" y="304.9" text-anchor="middle" font-size="11" fill="#374151">Portrait to landscape</text>
<text x="200.0" y="318.9" text-anchor="middle" font-size="11" fill="#374151">Activity keeps running if configChanges</text>
<text x="200.0" y="332.9" text-anchor="middle" font-size="11" fill="#374151">lists orientation and screenSize</text>
<rect x="400" y="270" width="320" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="560.0" y="304.9" text-anchor="middle" font-size="11" fill="#92400E">Also treat VK_ERROR_OUT_OF_DATE_KHR</text>
<text x="560.0" y="318.9" text-anchor="middle" font-size="11" fill="#92400E">as a recreation trigger</text>
<text x="560.0" y="332.9" text-anchor="middle" font-size="11" fill="#92400E">(same code path)</text>
</svg>
