<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-us-ai-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Three places where AI meets a Unity project</text>
<rect x="20" y="45" width="720" height="120" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="36" y="66" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">1  In the Editor: tools that help you build (Assistant, Generators)</text>
<rect x="36" y="78" width="150" height="72" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="111.0" y="102.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Assistant</text>
<text x="111.0" y="117.5" text-anchor="middle" font-size="11" fill="#3730A3">Ask, Plan, Agent</text>
<text x="111.0" y="132.5" text-anchor="middle" font-size="11" fill="#3730A3">skills and custom tools</text>
<rect x="200" y="78" width="150" height="72" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="275.0" y="102.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Generators</text>
<text x="275.0" y="117.5" text-anchor="middle" font-size="11" fill="#3730A3">sprites, textures, sounds,</text>
<text x="275.0" y="132.5" text-anchor="middle" font-size="11" fill="#3730A3">animations, 3D objects</text>
<rect x="364" y="78" width="170" height="72" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="449.0" y="102.5" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">AI gateway</text>
<text x="449.0" y="117.5" text-anchor="middle" font-size="11" fill="#3730A3">third-party agents run</text>
<text x="449.0" y="132.5" text-anchor="middle" font-size="11" fill="#3730A3">inside the Assistant window</text>
<rect x="548" y="78" width="176" height="72" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="636.0" y="102.5" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">AI menu</text>
<text x="636.0" y="117.5" text-anchor="middle" font-size="11" fill="#92400E">credits, account, updates</text>
<text x="636.0" y="132.5" text-anchor="middle" font-size="11" fill="#92400E">Generate New, Open Assistant</text>
<rect x="20" y="180" width="720" height="100" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="36" y="201" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">2  In the game: run a trained network (Sentis, package com.unity.ai.inference)</text>
<rect x="36" y="212" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="111.0" y="236.0" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Model file</text>
<text x="111.0" y="251.0" text-anchor="middle" font-size="11" fill="#374151">ONNX, LiteRT, PyTorch</text>
<rect x="236" y="212" width="180" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="326.0" y="236.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Worker</text>
<text x="326.0" y="251.0" text-anchor="middle" font-size="11" fill="#3730A3">CPU, GPUCompute, GPUPixel</text>
<rect x="456" y="212" width="150" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="531.0" y="236.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Tensors in and out</text>
<text x="531.0" y="251.0" text-anchor="middle" font-size="11" fill="#3730A3">your gameplay code</text>
<line x1="186" y1="240" x2="236" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-d)"/>
<line x1="416" y1="240" x2="456" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-d)"/>
<rect x="650" y="212" width="76" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="688.0" y="236.0" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">Bookshelf</text>
<text x="688.0" y="251.0" text-anchor="middle" font-size="11" fill="#1F2937">book finder</text>
<line x1="606" y1="240" x2="650" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-d)"/>
<rect x="20" y="295" width="720" height="100" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<text x="36" y="316" text-anchor="start" font-size="12" fill="#1F2937" font-weight="bold">3  Offline: train a behaviour (ML-Agents, package com.unity.ml-agents)</text>
<rect x="36" y="327" width="170" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="121.0" y="351.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Unity environment</text>
<text x="121.0" y="366.0" text-anchor="middle" font-size="11" fill="#3730A3">Agent, sensors, rewards</text>
<rect x="276" y="327" width="170" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="361.0" y="351.0" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Python trainer</text>
<text x="361.0" y="366.0" text-anchor="middle" font-size="11" fill="#3730A3">mlagents-learn, PyTorch</text>
<rect x="516" y="327" width="150" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="591.0" y="351.0" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">.onnx policy</text>
<text x="591.0" y="366.0" text-anchor="middle" font-size="11" fill="#92400E">written by training</text>
<line x1="206" y1="345" x2="276" y2="345" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-d)"/>
<line x1="276" y1="365" x2="206" y2="365" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-d)"/>
<line x1="446" y1="355" x2="516" y2="355" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-us-ai-d)"/>
<line x1="591" y1="327" x2="591" y2="268" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-us-ai-d)"/>
<text x="600" y="298" text-anchor="start" font-size="10" fill="#92400E">embedded and run by Sentis</text>
</svg>
