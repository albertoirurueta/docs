<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Filter chain and dispatch types</text>
  <text x="450" y="44" font-size="12" fill="#666666" text-anchor="middle">one request travels in through the filters and back out; a dispatcher type decides which mappings apply</text>

  <!-- chain panel -->
  <text x="30" y="76" font-size="13" font-weight="bold" fill="#222222">1. The chain for a REQUEST to /fragment/x (order of the filter-mapping elements)</text>

  <rect x="30" y="92" width="90" height="70" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="75" y="122" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Client</text>
  <text x="75" y="140" font-size="10" fill="#666666" text-anchor="middle">HTTP request</text>

  <rect x="170" y="92" width="120" height="70" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.6"/>
  <text x="230" y="118" font-size="12" font-weight="bold" fill="#133a75" text-anchor="middle">outer</text>
  <text x="230" y="136" font-size="10" fill="#1a4d9c" text-anchor="middle">url-pattern /*</text>
  <text x="230" y="150" font-size="10" fill="#1a4d9c" text-anchor="middle">declared first</text>

  <rect x="330" y="92" width="120" height="70" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.6"/>
  <text x="390" y="118" font-size="12" font-weight="bold" fill="#133a75" text-anchor="middle">inner</text>
  <text x="390" y="136" font-size="10" fill="#1a4d9c" text-anchor="middle">url-pattern /*</text>
  <text x="390" y="150" font-size="10" fill="#1a4d9c" text-anchor="middle">declared second</text>

  <rect x="490" y="92" width="150" height="70" fill="#fff4d6" stroke="#8a6a00" stroke-width="1.6"/>
  <text x="565" y="118" font-size="12" font-weight="bold" fill="#5c4600" text-anchor="middle">by-servlet-name</text>
  <text x="565" y="136" font-size="10" fill="#8a6a00" text-anchor="middle">servlet-name fragment</text>
  <text x="565" y="150" font-size="10" fill="#8a6a00" text-anchor="middle">runs after all url-patterns</text>

  <rect x="690" y="92" width="180" height="70" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.6"/>
  <text x="780" y="118" font-size="12" font-weight="bold" fill="#14501f" text-anchor="middle">FragmentServlet</text>
  <text x="780" y="136" font-size="10" fill="#1e6b34" text-anchor="middle">service() writes the response</text>
  <text x="780" y="150" font-size="10" fill="#1e6b34" text-anchor="middle">same thread as the filters</text>

  <g stroke="#444444" stroke-width="1.6" fill="#444444">
    <line x1="120" y1="112" x2="164" y2="112"/><polygon points="170,112 160,107 160,117"/>
    <line x1="290" y1="112" x2="324" y2="112"/><polygon points="330,112 320,107 320,117"/>
    <line x1="450" y1="112" x2="484" y2="112"/><polygon points="490,112 480,107 480,117"/>
    <line x1="640" y1="112" x2="684" y2="112"/><polygon points="690,112 680,107 680,117"/>
  </g>
  <g stroke="#7a2e2e" stroke-width="1.4" fill="#7a2e2e">
    <line x1="684" y1="146" x2="640" y2="146"/><polygon points="634,146 644,141 644,151"/>
    <line x1="484" y1="146" x2="450" y2="146"/><polygon points="444,146 454,141 454,151"/>
    <line x1="324" y1="146" x2="290" y2="146"/><polygon points="284,146 294,141 294,151"/>
    <line x1="164" y1="146" x2="120" y2="146"/><polygon points="114,146 124,141 124,151"/>
  </g>
  <text x="450" y="184" font-size="11" fill="#444444" text-anchor="middle">in: each filter runs the code before chain.doFilter(request, response), then hands over (possibly with a wrapper)</text>
  <text x="450" y="200" font-size="11" fill="#7a2e2e" text-anchor="middle">out: the code after chain.doFilter runs in reverse order; a filter that never calls it blocks the request</text>

  <!-- dispatch panel -->
  <text x="30" y="238" font-size="13" font-weight="bold" fill="#222222">2. Dispatcher types: the &lt;dispatcher&gt; element of a filter-mapping (default REQUEST)</text>

  <rect x="30" y="256" width="164" height="190" fill="#f4f4f4" stroke="#444444" stroke-width="1.4"/>
  <text x="112" y="278" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">REQUEST</text>
  <text x="112" y="298" font-size="10" fill="#444444" text-anchor="middle">straight from the client</text>
  <text x="112" y="322" font-size="10" fill="#666666" text-anchor="middle">request and response</text>
  <text x="112" y="336" font-size="10" fill="#666666" text-anchor="middle">are the container's own</text>
  <text x="112" y="360" font-size="10" fill="#666666" text-anchor="middle">getRequestURI() is the</text>
  <text x="112" y="374" font-size="10" fill="#666666" text-anchor="middle">URL the client sent</text>

  <rect x="206" y="256" width="164" height="190" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="288" y="278" font-size="12" font-weight="bold" fill="#133a75" text-anchor="middle">FORWARD</text>
  <text x="288" y="298" font-size="10" fill="#1a4d9c" text-anchor="middle">RequestDispatcher.forward</text>
  <text x="288" y="322" font-size="10" fill="#444444" text-anchor="middle">paths describe the target;</text>
  <text x="288" y="336" font-size="10" fill="#444444" text-anchor="middle">the original is in</text>
  <text x="288" y="350" font-size="10" font-family="Menlo, Consolas, monospace" fill="#444444" text-anchor="middle">jakarta.servlet.forward.*</text>
  <text x="288" y="374" font-size="10" fill="#444444" text-anchor="middle">uncommitted output is</text>
  <text x="288" y="388" font-size="10" fill="#444444" text-anchor="middle">discarded, response is</text>
  <text x="288" y="402" font-size="10" fill="#444444" text-anchor="middle">closed afterwards</text>

  <rect x="382" y="256" width="164" height="190" fill="#e8f0fe" stroke="#1a4d9c" stroke-width="1.4"/>
  <text x="464" y="278" font-size="12" font-weight="bold" fill="#133a75" text-anchor="middle">INCLUDE</text>
  <text x="464" y="298" font-size="10" fill="#1a4d9c" text-anchor="middle">RequestDispatcher.include</text>
  <text x="464" y="322" font-size="10" fill="#444444" text-anchor="middle">paths still describe the</text>
  <text x="464" y="336" font-size="10" fill="#444444" text-anchor="middle">including request; the</text>
  <text x="464" y="350" font-size="10" fill="#444444" text-anchor="middle">target is in</text>
  <text x="464" y="364" font-size="10" font-family="Menlo, Consolas, monospace" fill="#444444" text-anchor="middle">jakarta.servlet.include.*</text>
  <text x="464" y="388" font-size="10" fill="#444444" text-anchor="middle">headers and status set by</text>
  <text x="464" y="402" font-size="10" fill="#444444" text-anchor="middle">the target are ignored</text>

  <rect x="558" y="256" width="164" height="190" fill="#fbe9e7" stroke="#7a2e2e" stroke-width="1.4"/>
  <text x="640" y="278" font-size="12" font-weight="bold" fill="#5a1f1f" text-anchor="middle">ERROR</text>
  <text x="640" y="298" font-size="10" fill="#7a2e2e" text-anchor="middle">error-page mechanism</text>
  <text x="640" y="322" font-size="10" fill="#444444" text-anchor="middle">always an HTTP GET;</text>
  <text x="640" y="336" font-size="10" fill="#444444" text-anchor="middle">details in</text>
  <text x="640" y="350" font-size="10" font-family="Menlo, Consolas, monospace" fill="#444444" text-anchor="middle">jakarta.servlet.error.*</text>
  <text x="640" y="374" font-size="10" fill="#444444" text-anchor="middle">the original method is in</text>
  <text x="640" y="388" font-size="10" font-family="Menlo, Consolas, monospace" fill="#444444" text-anchor="middle">error.method</text>

  <rect x="734" y="256" width="136" height="190" fill="#e6f4ea" stroke="#1e6b34" stroke-width="1.4"/>
  <text x="802" y="278" font-size="12" font-weight="bold" fill="#14501f" text-anchor="middle">ASYNC</text>
  <text x="802" y="298" font-size="10" fill="#1e6b34" text-anchor="middle">AsyncContext.dispatch</text>
  <text x="802" y="322" font-size="10" fill="#444444" text-anchor="middle">needs asyncSupported</text>
  <text x="802" y="336" font-size="10" fill="#444444" text-anchor="middle">on every filter and</text>
  <text x="802" y="350" font-size="10" fill="#444444" text-anchor="middle">servlet in the path</text>

  <rect x="30" y="462" width="840" height="76" fill="#fffbe6" stroke="#8a6a00" stroke-width="1.2"/>
  <text x="450" y="484" font-size="12" font-weight="bold" fill="#5c4600" text-anchor="middle">Reading the figure with the Bookshelf</text>
  <text x="450" y="504" font-size="11" fill="#444444" text-anchor="middle">/dispatch?mode=forward crosses outer and inner once (REQUEST); the filter mapped by servlet name only joins when the forward reaches fragment</text>
  <text x="450" y="522" font-size="11" fill="#444444" text-anchor="middle">a page footer added with a response wrapper must be mapped to FORWARD, because the container closes the real response when forward returns</text>
</svg>
