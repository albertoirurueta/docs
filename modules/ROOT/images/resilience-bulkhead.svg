<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bulkheads: a saturated pool isolates one slow dependency</text>
  <defs>
    <marker id="bh-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="bh-arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b03030"/>
    </marker>
  </defs>

  <!-- callers -->
  <rect x="30" y="60" width="150" height="440" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="105" y="84" font-size="12.5" font-weight="bold" fill="#222222" text-anchor="middle">bookshelf-service</text>
  <text x="105" y="102" font-size="11" fill="#444444" text-anchor="middle">request threads</text>
  <text x="105" y="118" font-size="11" fill="#444444" text-anchor="middle">(Tomcat or virtual)</text>

  <!-- lane separators: the bulkhead walls -->
  <line x1="200" y1="170" x2="700" y2="170" stroke="#1c4b73" stroke-width="3"/>
  <line x1="200" y1="385" x2="700" y2="385" stroke="#1c4b73" stroke-width="3"/>
  <text x="708" y="174" font-size="10.5" fill="#1c4b73">bulkhead wall</text>
  <text x="708" y="389" font-size="10.5" fill="#1c4b73">bulkhead wall</text>

  <!-- lane 1: pricing, healthy -->
  <text x="215" y="66" font-size="12.5" font-weight="bold" fill="#222222">pricing: healthy lane</text>
  <text x="215" y="82" font-size="10.5" fill="#444444">its own capacity, untouched by the slow lane below</text>
  <rect x="215" y="98" width="30" height="30" rx="3" fill="#1c4b73"/>
  <rect x="255" y="98" width="30" height="30" rx="3" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="295" y="98" width="30" height="30" rx="3" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="335" y="98" width="30" height="30" rx="3" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="380" y="118" font-size="10.5" fill="#444444">1 busy, 3 idle: answers in a few milliseconds</text>
  <line x1="180" y1="113" x2="212" y2="113" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#bh-arrow)"/>
  <rect x="730" y="92" width="140" height="42" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="800" y="110" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">pricing-service</text>
  <text x="800" y="125" font-size="10.5" fill="#444444" text-anchor="middle">fast</text>
  <line x1="640" y1="113" x2="727" y2="113" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#bh-arrow)"/>

  <!-- lane 2: recommendations, saturated -->
  <text x="215" y="192" font-size="12.5" font-weight="bold" fill="#222222">recommendations: ThreadPoolBulkhead (saturated)</text>
  <text x="215" y="208" font-size="10.5" fill="#444444">coreThreadPoolSize 2, maxThreadPoolSize 4, queueCapacity 2</text>

  <text x="215" y="236" font-size="10.5" fill="#444444">pool threads (all busy, waiting on the slow service)</text>
  <rect x="215" y="244" width="30" height="30" rx="3" fill="#b03030"/>
  <rect x="255" y="244" width="30" height="30" rx="3" fill="#b03030"/>
  <rect x="295" y="244" width="30" height="30" rx="3" fill="#b03030"/>
  <rect x="335" y="244" width="30" height="30" rx="3" fill="#b03030"/>
  <text x="380" y="263" font-size="10.5" fill="#444444">threads 3 and 4 exist only because the queue was full</text>

  <text x="215" y="298" font-size="10.5" fill="#444444">queue (full)</text>
  <rect x="215" y="306" width="30" height="24" rx="3" fill="#e9eef3" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="255" y="306" width="30" height="24" rx="3" fill="#e9eef3" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="300" y="323" font-size="10.5" fill="#444444">two calls waiting for a free thread</text>

  <line x1="180" y1="259" x2="212" y2="259" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#bh-arrow)"/>
  <line x1="640" y1="259" x2="727" y2="259" stroke="#b03030" stroke-width="1.6" marker-end="url(#bh-arrow-red)"/>
  <rect x="730" y="236" width="140" height="46" rx="6" fill="#f4f4f4" stroke="#b03030" stroke-width="1.6"/>
  <text x="800" y="255" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">recommendations-</text>
  <text x="800" y="270" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">service (slow)</text>
  <text x="800" y="298" font-size="10.5" fill="#b03030" text-anchor="middle">answers in 700 ms and more</text>

  <!-- rejected call and fallback -->
  <path d="M 180 340 L 440 340" fill="none" stroke="#b03030" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#bh-arrow-red)"/>
  <rect x="445" y="322" width="240" height="38" rx="6" fill="#ffffff" stroke="#b03030" stroke-width="1.6"/>
  <text x="565" y="338" font-size="11" font-weight="bold" fill="#b03030" text-anchor="middle">7th call: BulkheadFullException</text>
  <text x="565" y="352" font-size="10.5" fill="#222222" text-anchor="middle">fallback returns an empty list at once</text>

  <!-- lane 3: isbn semaphore -->
  <text x="215" y="408" font-size="12.5" font-weight="bold" fill="#222222">isbn API: SemaphoreBulkhead</text>
  <text x="215" y="424" font-size="10.5" fill="#444444">permits are counted, the caller's own thread runs the call</text>
  <rect x="215" y="440" width="30" height="30" rx="3" fill="#1c4b73"/>
  <rect x="255" y="440" width="30" height="30" rx="3" fill="#1c4b73"/>
  <rect x="295" y="440" width="30" height="30" rx="3" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <rect x="335" y="440" width="30" height="30" rx="3" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="380" y="460" font-size="10.5" fill="#444444">maxConcurrentCalls 4: 2 permits taken, 2 available</text>
  <line x1="180" y1="455" x2="212" y2="455" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#bh-arrow)"/>
  <rect x="730" y="434" width="140" height="42" rx="6" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="800" y="452" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">ISBN metadata API</text>
  <text x="800" y="467" font-size="10.5" fill="#444444" text-anchor="middle">third party</text>
  <line x1="640" y1="455" x2="727" y2="455" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#bh-arrow)"/>

  <!-- footer -->
  <text x="450" y="523" font-size="11.5" fill="#222222" text-anchor="middle">The slow dependency can use up its own threads and queue, but not the capacity of the other lanes.</text>
</svg>
