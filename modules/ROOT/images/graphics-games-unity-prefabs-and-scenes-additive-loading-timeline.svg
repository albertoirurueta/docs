<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">A bootstrap scene with additive level loading</text>
<line x1="100" y1="62" x2="730" y2="62" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="730" y="52" text-anchor="end" font-size="11" fill="#374151">time</text>
<text x="92" y="95" text-anchor="end" font-size="11" fill="#374151" font-weight="bold">Bootstrap</text>
<line x1="100" y1="114" x2="730" y2="114" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="92" y="139" text-anchor="end" font-size="11" fill="#374151" font-weight="bold">Level_Menu</text>
<line x1="100" y1="158" x2="730" y2="158" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="92" y="183" text-anchor="end" font-size="11" fill="#374151" font-weight="bold">Level_Shelf</text>
<line x1="100" y1="202" x2="730" y2="202" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="92" y="227" text-anchor="end" font-size="11" fill="#374151" font-weight="bold">Level_Bonus</text>
<line x1="100" y1="246" x2="730" y2="246" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="100" y="74" width="630" height="34" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="415.0" y="94.8" text-anchor="middle" font-size="11" fill="#1F2937">Always loaded: services, audio, camera, EventSystem, overlay</text>
<rect x="100" y="118" width="290" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="245.0" y="138.8" text-anchor="middle" font-size="11" fill="#3730A3">Level_Menu active</text>
<rect x="280" y="162" width="110" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="335.0" y="182.5" text-anchor="middle" font-size="10" fill="#92400E">loads to 0.9</text>
<rect x="390" y="162" width="230" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="505.0" y="182.8" text-anchor="middle" font-size="11" fill="#3730A3">Level_Shelf active</text>
<rect x="528" y="206" width="119" height="34" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="587.5" y="226.5" text-anchor="middle" font-size="10" fill="#92400E">loads to 0.9</text>
<rect x="647" y="206" width="83" height="34" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="688.5" y="226.8" text-anchor="middle" font-size="11" fill="#3730A3">active</text>
<line x1="390" y1="108" x2="390" y2="250" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4"/>
<text x="390" y="266" text-anchor="middle" font-size="10" fill="#92400E">activate, set active, unload Menu</text>
<line x1="647" y1="108" x2="647" y2="250" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4"/>
<text x="647" y="266" text-anchor="middle" font-size="10" fill="#92400E">activate, set active, unload Shelf</text>
<rect x="40" y="290" width="690" height="92" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="385.0" y="317.4" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Sequence for a level change</text>
<text x="385.0" y="332.4" text-anchor="middle" font-size="11" fill="#374151">1  show the overlay (bootstrap)    2  LoadSceneAsync(next, Additive) with allowSceneActivation = false</text>
<text x="385.0" y="347.4" text-anchor="middle" font-size="11" fill="#374151">3  at progress 0.9: allowSceneActivation = true, then SetActiveScene(next)</text>
<text x="385.0" y="362.4" text-anchor="middle" font-size="11" fill="#374151">4  UnloadSceneAsync(previous), then hide the overlay</text>
</svg>
