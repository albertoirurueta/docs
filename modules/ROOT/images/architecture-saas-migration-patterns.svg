<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="440" fill="#ffffff"/>

  <text x="390" y="24" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Three ways to migrate Bookshop-as-a-SaaS</text>

  <defs>
    <marker id="smp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>

  <!-- Control plane band -->
  <rect x="40" y="44" width="700" height="60" rx="10" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="390" y="62" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Control plane</text>
  <text x="390" y="78" font-size="10" fill="#333333" text-anchor="middle">onboarding, identity, tenant management, billing, metrics, admin</text>
  <text x="390" y="93" font-size="9.5" font-style="italic" fill="#666666" text-anchor="middle">built first -- shared by every migration pattern</text>

  <!-- Arrows down to application plane -->
  <line x1="155" y1="104" x2="155" y2="140" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#smp-arrow)"/>
  <line x1="390" y1="104" x2="390" y2="140" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#smp-arrow)"/>
  <line x1="625" y1="104" x2="625" y2="140" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#smp-arrow)"/>

  <!-- Application plane outer band -->
  <text x="48" y="136" font-size="9.5" letter-spacing="0.5" fill="#888888">APPLICATION PLANE</text>
  <rect x="40" y="142" width="700" height="234" rx="10" fill="#fbfbfb" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Column headers -->
  <rect x="50" y="150" width="210" height="26" rx="6" fill="#eef7ef" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="155" y="167" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Silo lift-and-shift</text>

  <rect x="285" y="150" width="210" height="26" rx="6" fill="#fdf3ea" stroke="#b3541e" stroke-width="1.6"/>
  <text x="390" y="167" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Layered migration</text>

  <rect x="520" y="150" width="210" height="26" rx="6" fill="#f5eef8" stroke="#7a3b8f" stroke-width="1.6"/>
  <text x="625" y="167" font-size="11.5" font-weight="bold" fill="#222222" text-anchor="middle">Service-by-service</text>

  <!-- Column 1: silo lift-and-shift -->
  <rect x="50" y="186" width="210" height="74" rx="6" fill="#ffffff" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="155" y="206" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Tenant A</text>
  <text x="155" y="222" font-size="10" fill="#333333" text-anchor="middle">web + app + db</text>
  <text x="155" y="236" font-size="9.5" fill="#666666" text-anchor="middle">(fully siloed stack)</text>

  <rect x="50" y="270" width="210" height="74" rx="6" fill="#ffffff" stroke="#2d6a34" stroke-width="1.4"/>
  <text x="155" y="290" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Tenant B</text>
  <text x="155" y="306" font-size="10" fill="#333333" text-anchor="middle">web + app + db</text>
  <text x="155" y="320" font-size="9.5" fill="#666666" text-anchor="middle">(fully siloed stack)</text>

  <text x="155" y="358" font-size="9.5" fill="#666666" text-anchor="middle">Same version for every tenant --</text>
  <text x="155" y="371" font-size="9.5" fill="#666666" text-anchor="middle">automated per-tenant onboarding</text>

  <!-- Column 2: layered migration -->
  <rect x="285" y="186" width="210" height="70" rx="6" fill="#ffffff" stroke="#b3541e" stroke-width="1.4"/>
  <text x="390" y="206" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Stage 1</text>
  <text x="390" y="222" font-size="10" fill="#333333" text-anchor="middle">Web tier pooled</text>
  <text x="390" y="236" font-size="9.5" fill="#666666" text-anchor="middle">App tier + DB still siloed</text>

  <line x1="390" y1="256" x2="390" y2="270" stroke="#b3541e" stroke-width="1.6" marker-end="url(#smp-arrow)"/>

  <rect x="285" y="270" width="210" height="74" rx="6" fill="#ffffff" stroke="#b3541e" stroke-width="1.4"/>
  <text x="390" y="290" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">Stage 2</text>
  <text x="390" y="306" font-size="10" fill="#333333" text-anchor="middle">Web + app tier pooled</text>
  <text x="390" y="320" font-size="9.5" fill="#666666" text-anchor="middle">DB still siloed per tenant</text>

  <text x="390" y="358" font-size="9.5" fill="#666666" text-anchor="middle">Pool one layer at a time --</text>
  <text x="390" y="371" font-size="9.5" fill="#666666" text-anchor="middle">least-invasive layers first</text>

  <!-- Column 3: service-by-service -->
  <rect x="520" y="186" width="210" height="74" rx="6" fill="#fafafa" stroke="#999999" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="625" y="206" font-size="11" font-weight="bold" fill="#777777" text-anchor="middle">Legacy app tier</text>
  <text x="625" y="222" font-size="10" fill="#888888" text-anchor="middle">(siloed, shrinking)</text>
  <text x="625" y="236" font-size="9.5" fill="#999999" text-anchor="middle">partial control-plane data</text>

  <rect x="520" y="270" width="210" height="74" rx="6" fill="#ffffff" stroke="#7a3b8f" stroke-width="1.4"/>
  <text x="625" y="290" font-size="11" font-weight="bold" fill="#222222" text-anchor="middle">New microservices</text>
  <text x="625" y="306" font-size="10" fill="#333333" text-anchor="middle">pooled, multi-tenant native</text>
  <text x="625" y="320" font-size="9.5" fill="#666666" text-anchor="middle">full tenant-aware logs/metrics</text>

  <text x="625" y="358" font-size="9.5" fill="#666666" text-anchor="middle">Strangle the app tier, service by</text>
  <text x="625" y="371" font-size="9.5" fill="#666666" text-anchor="middle">service -- new code stays modern</text>

  <text x="390" y="398" font-size="10.5" fill="#666666" text-anchor="middle">All three patterns share the same control plane and onboarding automation --</text>
  <text x="390" y="412" font-size="10.5" fill="#666666" text-anchor="middle">they differ only in how much of the application plane is pooled, and how fast.</text>
</svg>
