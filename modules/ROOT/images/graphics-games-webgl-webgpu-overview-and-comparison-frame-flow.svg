<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-webgpu-frame-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">One frame of the lit book in WebGPU</text>
<rect x="20" y="60" width="150" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="84.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Uniform buffer</text>
<text x="95.0" y="99.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">mvp, model, light</text>
<rect x="20" y="130" width="150" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="154.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Vertex + index</text>
<text x="95.0" y="169.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">buffers</text>
<rect x="20" y="200" width="150" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="217.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Bind group 0</text>
<text x="95.0" y="231.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">uniform, sampler,</text>
<text x="95.0" y="245.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">cover, normal map</text>
<rect x="20" y="270" width="150" height="56" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="294.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Render pipeline</text>
<text x="95.0" y="309.7" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">WGSL + formats</text>
<rect x="250" y="60" width="170" height="130" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="335.0" y="106.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">queue.writeBuffer</text>
<text x="335.0" y="121.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">updates the uniforms</text>
<text x="335.0" y="136.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">every frame</text>
<text x="335.0" y="151.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">(CPU time passes)</text>
<rect x="250" y="205" width="170" height="121" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="335.0" y="241.3" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">Command encoder</text>
<text x="335.0" y="255.3" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">beginRenderPass()</text>
<text x="335.0" y="269.4" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">setPipeline, setBindGroup</text>
<text x="335.0" y="283.4" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">setVertexBuffer, drawIndexed</text>
<text x="335.0" y="297.4" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">pass.end()</text>
<rect x="500" y="100" width="240" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="620.0" y="124.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">encoder.finish()</text>
<text x="620.0" y="139.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">one GPUCommandBuffer</text>
<rect x="500" y="190" width="240" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="620.0" y="214.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">queue.submit([cb])</text>
<text x="620.0" y="229.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">the GPU executes it</text>
<rect x="500" y="280" width="240" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="620.0" y="304.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">getCurrentTexture()</text>
<text x="620.0" y="319.7" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">the canvas image shown</text>
<line x1="170" y1="88" x2="250" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgpu-frame-flow)"/>
<line x1="170" y1="158" x2="250" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgpu-frame-flow)"/>
<line x1="170" y1="228" x2="250" y2="265" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgpu-frame-flow)"/>
<line x1="170" y1="298" x2="250" y2="295" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgpu-frame-flow)"/>
<line x1="420" y1="265" x2="500" y2="128" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgpu-frame-flow)"/>
<line x1="620" y1="156" x2="620" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgpu-frame-flow)"/>
<line x1="620" y1="246" x2="620" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-webgpu-frame-flow)"/>
<text x="380" y="372" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Nothing is drawn until submit: recording is cheap, and state lives in the pipeline and bind group.</text>
</svg>
