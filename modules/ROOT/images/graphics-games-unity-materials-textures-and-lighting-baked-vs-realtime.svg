<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Baked, Mixed and Realtime lights: what is computed when</text>
<rect x="20" y="44" width="170" height="28" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="61.5" text-anchor="middle" font-size="10" fill="#374151"></text>
<rect x="198" y="44" width="176" height="28" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="286.0" y="62.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Realtime</text>
<rect x="382" y="44" width="176" height="28" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="470.0" y="62.5" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Mixed</text>
<rect x="566" y="44" width="176" height="28" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="654.0" y="62.5" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Baked</text>
<rect x="20" y="80" width="170" height="38" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="102.8" text-anchor="middle" font-size="11" fill="#1F2937">Direct light</text>
<rect x="198" y="80" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="286.0" y="102.5" text-anchor="middle" font-size="10" fill="#374151">every frame</text>
<rect x="382" y="80" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="470.0" y="102.5" text-anchor="middle" font-size="10" fill="#374151">every frame</text>
<rect x="566" y="80" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="654.0" y="102.5" text-anchor="middle" font-size="10" fill="#374151">baked into lightmaps</text>
<rect x="20" y="124" width="170" height="38" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="146.8" text-anchor="middle" font-size="11" fill="#1F2937">Indirect light (bounce)</text>
<rect x="198" y="124" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="286.0" y="146.5" text-anchor="middle" font-size="10" fill="#374151">none: only ambient and probes</text>
<rect x="382" y="124" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="470.0" y="146.5" text-anchor="middle" font-size="10" fill="#374151">baked into lightmaps and probes</text>
<rect x="566" y="124" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="654.0" y="146.5" text-anchor="middle" font-size="10" fill="#374151">baked into lightmaps and probes</text>
<rect x="20" y="168" width="170" height="38" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="190.8" text-anchor="middle" font-size="11" fill="#1F2937">Shadows from moving books</text>
<rect x="198" y="168" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="286.0" y="190.5" text-anchor="middle" font-size="10" fill="#374151">shadow map, up to Shadow Distance</text>
<rect x="382" y="168" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="470.0" y="190.5" text-anchor="middle" font-size="10" fill="#374151">real-time (mode dependent)</text>
<rect x="566" y="168" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="654.0" y="190.5" text-anchor="middle" font-size="10" fill="#374151">static objects only; probes for the rest</text>
<rect x="20" y="212" width="170" height="38" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="234.8" text-anchor="middle" font-size="11" fill="#1F2937">Light can change at runtime</text>
<rect x="198" y="212" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="286.0" y="234.5" text-anchor="middle" font-size="10" fill="#374151">yes: position, colour, intensity</text>
<rect x="382" y="212" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="470.0" y="234.5" text-anchor="middle" font-size="10" fill="#374151">direct part only</text>
<rect x="566" y="212" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="654.0" y="234.5" text-anchor="middle" font-size="10" fill="#374151">no</text>
<rect x="20" y="256" width="170" height="38" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="278.9" text-anchor="middle" font-size="11" fill="#1F2937">Runtime cost</text>
<rect x="198" y="256" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="286.0" y="278.5" text-anchor="middle" font-size="10" fill="#374151">high: per light, per shadow</text>
<rect x="382" y="256" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="470.0" y="278.5" text-anchor="middle" font-size="10" fill="#374151">like Realtime plus lightmap reads</text>
<rect x="566" y="256" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="654.0" y="278.5" text-anchor="middle" font-size="10" fill="#374151">lowest: one texture read</text>
<rect x="20" y="300" width="170" height="38" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105.0" y="322.9" text-anchor="middle" font-size="11" fill="#1F2937">Bookshelf use</text>
<rect x="198" y="300" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="286.0" y="322.5" text-anchor="middle" font-size="10" fill="#374151">the desk lamp (toggle, flicker)</text>
<rect x="382" y="300" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="470.0" y="322.5" text-anchor="middle" font-size="10" fill="#374151">window sun on the shelf</text>
<rect x="566" y="300" width="176" height="38" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="654.0" y="322.5" text-anchor="middle" font-size="10" fill="#374151">area light fill, the room</text>
<rect x="20" y="352" width="720" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="374.9" text-anchor="middle" font-size="11" fill="#92400E">URP lighting data: lightmaps (static surfaces), Light Probes or Adaptive Probe Volumes (moving objects), Reflection Probes (reflections).</text>
<text x="380.0" y="388.9" text-anchor="middle" font-size="11" fill="#92400E">Enlighten real-time global illumination exists only in the Built-In pipeline. Mixed lights follow the scene Lighting Mode:</text>
<text x="380.0" y="402.9" text-anchor="middle" font-size="11" fill="#92400E">Baked Indirect, Shadowmask, Distance Shadowmask or Subtractive.</text>
</svg>
