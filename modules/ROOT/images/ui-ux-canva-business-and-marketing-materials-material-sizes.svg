<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Common material sizes for the Bookshelf launch</title>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Common material sizes for the Bookshelf launch</text>
<text x="380" y="50" font-size="12" fill="#6B7280" text-anchor="middle">Shapes are drawn in proportion to each other, not to one exact scale</text>
<rect x="28" y="186" width="64" height="64" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="60" y="272" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Logo mark</text>
<text x="60" y="288" font-size="11" fill="#374151" text-anchor="middle">square, any size</text>
<rect x="123" y="202" width="84" height="48" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="165" y="272" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Business card</text>
<text x="165" y="288" font-size="11" fill="#374151" text-anchor="middle">85 x 55 mm</text>
<rect x="225" y="220" width="90" height="30" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270" y="272" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Signature</text>
<text x="270" y="288" font-size="11" fill="#374151" text-anchor="middle">about 600 x 200 px</text>
<rect x="325" y="194" width="100" height="56" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="375" y="272" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">YouTube thumbnail</text>
<text x="375" y="288" font-size="11" fill="#374151" text-anchor="middle">1280 x 720 px</text>
<rect x="435" y="134" width="90" height="116" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="480" y="272" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Flyer</text>
<text x="480" y="288" font-size="11" fill="#374151" text-anchor="middle">A5, DL or Letter</text>
<rect x="545" y="130" width="80" height="120" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="585" y="272" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Book cover</text>
<text x="585" y="288" font-size="11" fill="#374151" text-anchor="middle">6 x 9 in trim</text>
<rect x="667" y="111" width="46" height="139" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="690" y="272" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">Infographic</text>
<text x="690" y="288" font-size="11" fill="#374151" text-anchor="middle">663 x 2000 px</text>
<line x1="20" y1="250" x2="740" y2="250" stroke="#9CA3AF" stroke-width="1"/>
<rect x="20" y="306" width="720" height="56" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
<text x="380" y="326" font-size="12" fill="#92400E" text-anchor="middle">Print products add bleed outside the trim line. Screen products are measured in pixels, print products in mm or inches.</text>
<text x="380" y="346" font-size="12" fill="#92400E" text-anchor="middle">Values are common conventions. The size shown when you create the design in Canva is the one to follow.</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
