<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Refill styles: tokens after a bucket is drained at t = 0 (capacity 10, refill 10 tokens per 60 s)</text>
<defs><marker id="rs-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/></marker></defs>
<rect x="10" y="48" width="276" height="330" rx="6" fill="#f7f7f7" stroke="#cccccc"/>
<text x="148" y="72" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">refillGreedy</text>
<text x="148" y="90" font-size="10.5" fill="#444444" text-anchor="middle">tokens trickle in continuously: 1 token every 6 s</text>
<line x1="40" y1="120" x2="40" y2="270" stroke="#666666" stroke-width="1.2"/>
<line x1="40" y1="270" x2="272" y2="270" stroke="#666666" stroke-width="1.2" marker-end="url(#rs-arrow)"/>
<text x="34" y="274" font-size="10" fill="#444444" text-anchor="end">0</text>
<line x1="40" y1="270" x2="264" y2="270" stroke="#dddddd" stroke-dasharray="3,3"/>
<text x="34" y="204" font-size="10" fill="#444444" text-anchor="end">5</text>
<line x1="40" y1="200" x2="264" y2="200" stroke="#dddddd" stroke-dasharray="3,3"/>
<text x="34" y="134" font-size="10" fill="#444444" text-anchor="end">10</text>
<line x1="40" y1="130" x2="264" y2="130" stroke="#dddddd" stroke-dasharray="3,3"/>
<text x="40.0" y="285" font-size="10" fill="#444444" text-anchor="middle">0</text>
<text x="88.0" y="285" font-size="10" fill="#444444" text-anchor="middle">20</text>
<text x="136.0" y="285" font-size="10" fill="#444444" text-anchor="middle">40</text>
<text x="184.0" y="285" font-size="10" fill="#444444" text-anchor="middle">60</text>
<text x="232.0" y="285" font-size="10" fill="#444444" text-anchor="middle">80</text>
<text x="280.0" y="285" font-size="10" fill="#444444" text-anchor="middle">100</text>
<text x="272" y="300" font-size="10" fill="#444444" text-anchor="end">seconds</text>
<polyline points="40.0,270.0 184.0,130.0 280.0,130.0" fill="none" stroke="#1c4b73" stroke-width="2.6"/>
<text x="152" y="194" font-size="10.5" fill="#1c4b73">at 30 s: 5 tokens</text>
<text x="44" y="320" font-size="10.5" fill="#444444">a request may arrive at any moment and finds</text>
<text x="44" y="334" font-size="10.5" fill="#444444">a proportional share of the refill</text>
<rect x="300" y="48" width="276" height="330" rx="6" fill="#f7f7f7" stroke="#cccccc"/>
<text x="438" y="72" font-size="14" font-weight="bold" fill="#b34700" text-anchor="middle">refillIntervally</text>
<text x="438" y="90" font-size="10.5" fill="#444444" text-anchor="middle">nothing for a whole period, then all tokens at once</text>
<line x1="330" y1="120" x2="330" y2="270" stroke="#666666" stroke-width="1.2"/>
<line x1="330" y1="270" x2="562" y2="270" stroke="#666666" stroke-width="1.2" marker-end="url(#rs-arrow)"/>
<text x="324" y="274" font-size="10" fill="#444444" text-anchor="end">0</text>
<line x1="330" y1="270" x2="554" y2="270" stroke="#dddddd" stroke-dasharray="3,3"/>
<text x="324" y="204" font-size="10" fill="#444444" text-anchor="end">5</text>
<line x1="330" y1="200" x2="554" y2="200" stroke="#dddddd" stroke-dasharray="3,3"/>
<text x="324" y="134" font-size="10" fill="#444444" text-anchor="end">10</text>
<line x1="330" y1="130" x2="554" y2="130" stroke="#dddddd" stroke-dasharray="3,3"/>
<text x="330.0" y="285" font-size="10" fill="#444444" text-anchor="middle">0</text>
<text x="378.0" y="285" font-size="10" fill="#444444" text-anchor="middle">20</text>
<text x="426.0" y="285" font-size="10" fill="#444444" text-anchor="middle">40</text>
<text x="474.0" y="285" font-size="10" fill="#444444" text-anchor="middle">60</text>
<text x="522.0" y="285" font-size="10" fill="#444444" text-anchor="middle">80</text>
<text x="570.0" y="285" font-size="10" fill="#444444" text-anchor="middle">100</text>
<text x="562" y="300" font-size="10" fill="#444444" text-anchor="end">seconds</text>
<polyline points="330.0,270.0 474.0,270.0 474.0,130.0 570.0,130.0" fill="none" stroke="#b34700" stroke-width="2.6"/>
<text x="340" y="244" font-size="10.5" fill="#b34700">still 0 at 59.9 s</text>
<text x="334" y="320" font-size="10.5" fill="#444444">a rejected caller waits the full remaining</text>
<text x="334" y="334" font-size="10.5" fill="#444444">period; the refill may be smaller than capacity</text>
<rect x="590" y="48" width="276" height="330" rx="6" fill="#f7f7f7" stroke="#cccccc"/>
<text x="728" y="72" font-size="14" font-weight="bold" fill="#2a7d3f" text-anchor="middle">refillIntervallyAligned</text>
<text x="728" y="90" font-size="10.5" fill="#444444" text-anchor="middle">first refill at a chosen instant, then every period</text>
<line x1="620" y1="120" x2="620" y2="270" stroke="#666666" stroke-width="1.2"/>
<line x1="620" y1="270" x2="852" y2="270" stroke="#666666" stroke-width="1.2" marker-end="url(#rs-arrow)"/>
<text x="614" y="274" font-size="10" fill="#444444" text-anchor="end">0</text>
<line x1="620" y1="270" x2="844" y2="270" stroke="#dddddd" stroke-dasharray="3,3"/>
<text x="614" y="204" font-size="10" fill="#444444" text-anchor="end">5</text>
<line x1="620" y1="200" x2="844" y2="200" stroke="#dddddd" stroke-dasharray="3,3"/>
<text x="614" y="134" font-size="10" fill="#444444" text-anchor="end">10</text>
<line x1="620" y1="130" x2="844" y2="130" stroke="#dddddd" stroke-dasharray="3,3"/>
<text x="620.0" y="285" font-size="10" fill="#444444" text-anchor="middle">0</text>
<text x="668.0" y="285" font-size="10" fill="#444444" text-anchor="middle">20</text>
<text x="716.0" y="285" font-size="10" fill="#444444" text-anchor="middle">40</text>
<text x="764.0" y="285" font-size="10" fill="#444444" text-anchor="middle">60</text>
<text x="812.0" y="285" font-size="10" fill="#444444" text-anchor="middle">80</text>
<text x="860.0" y="285" font-size="10" fill="#444444" text-anchor="middle">100</text>
<text x="852" y="300" font-size="10" fill="#444444" text-anchor="end">seconds</text>
<polyline points="620.0,270.0 668.0,270.0 668.0,130.0 692.0,130.0 692.0,270.0 812.0,270.0 812.0,130.0 860.0,130.0" fill="none" stroke="#2a7d3f" stroke-width="2.6"/>
<line x1="668.0" y1="122" x2="668.0" y2="270" stroke="#2a7d3f" stroke-dasharray="4,3"/>
<text x="672.0" y="118" font-size="10" fill="#2a7d3f">boundary</text>
<text x="695.0" y="246" font-size="10" fill="#2a7d3f">drained again</text>
<text x="624" y="320" font-size="10.5" fill="#444444">timeOfFirstRefill aligns refills to a clock</text>
<text x="624" y="334" font-size="10.5" fill="#444444">boundary; needs a wall-clock TimeMeter</text>
<text x="450" y="412" font-size="12" fill="#222222" text-anchor="middle">All three obey the same law: tokens never exceed the capacity, and the average rate is refill tokens divided by the period.</text>
<text x="450" y="432" font-size="12" fill="#222222" text-anchor="middle">The difference is only how the refill arrives, which decides how bursty the caller can be at a period boundary.</text>
<text x="450" y="454" font-size="11" fill="#666666" text-anchor="middle">refillIntervallyAlignedWithAdaptiveInitialTokens is the aligned style with a computed initial token count</text>
</svg>