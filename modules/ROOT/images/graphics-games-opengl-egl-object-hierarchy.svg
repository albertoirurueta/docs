<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-egl-object-hierarchy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">EGL objects and how they relate</text>
<rect x="300" y="50" width="160" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="68.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">EGLDisplay</text>
<text x="380.0" y="83.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">platform connection</text>
<rect x="40" y="150" width="190" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135.0" y="174.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">EGLConfig</text>
<text x="135.0" y="189.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">buffer sizes, API bits</text>
<rect x="285" y="150" width="190" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="174.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">EGLSurface</text>
<text x="380.0" y="189.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">window, pbuffer or pixmap</text>
<rect x="530" y="150" width="190" height="56" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="174.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">EGLContext</text>
<text x="625.0" y="189.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">client API state (GL ES)</text>
<line x1="340" y1="94" x2="150" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-egl-object-hierarchy)"/>
<line x1="380" y1="94" x2="380" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-egl-object-hierarchy)"/>
<line x1="420" y1="94" x2="620" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-egl-object-hierarchy)"/>
<text x="190" y="122" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">eglChooseConfig</text>
<text x="380" y="126" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">eglCreate*Surface</text>
<text x="560" y="122" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">eglCreateContext</text>
<line x1="230" y1="178" x2="285" y2="178" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-egl-object-hierarchy)" stroke-dasharray="5 4"/>
<rect x="250" y="262" width="260" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="286.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">eglMakeCurrent(display, draw, read, ctx)</text>
<text x="380.0" y="301.7" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">binds both to the calling thread</text>
<line x1="380" y1="206" x2="380" y2="262" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-egl-object-hierarchy)" stroke-dasharray="5 4"/>
<line x1="620" y1="206" x2="520" y2="262" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-egl-object-hierarchy)" stroke-dasharray="5 4"/>
<rect x="40" y="262" width="170" height="56" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="125.0" y="286.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">eglSwapBuffers</text>
<text x="125.0" y="301.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">presents the back buffer</text>
<line x1="250" y1="290" x2="210" y2="290" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-opengl-egl-object-hierarchy)"/>
<text x="380" y="350" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A config is chosen first; surface and context are created from it and must be compatible with it.</text>
<text x="380" y="370" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">One context is current on at most one thread at a time.</text>
</svg>
