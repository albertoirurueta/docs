<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">File storage topology</text>
  <text x="380" y="48" font-size="11" fill="#666666" text-anchor="middle">N ephemeral pod replicas vs. a shared network volume vs. an external object-storage service</text>

  <!-- pod replicas column -->
  <rect x="30" y="76" width="190" height="76" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="44" y="98" font-size="12.5" font-weight="bold" fill="#1c4b73">Pod replica 1</text>
  <text x="44" y="116" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">/data/local (container disk)</text>
  <text x="44" y="133" font-size="10" fill="#b23b3b" font-style="italic">vanishes on restart, not shared</text>

  <rect x="30" y="168" width="190" height="76" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="44" y="190" font-size="12.5" font-weight="bold" fill="#1c4b73">Pod replica 2</text>
  <text x="44" y="208" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">/data/local (container disk)</text>
  <text x="44" y="225" font-size="10" fill="#b23b3b" font-style="italic">vanishes on restart, not shared</text>

  <rect x="30" y="260" width="190" height="76" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="44" y="282" font-size="12.5" font-weight="bold" fill="#1c4b73">Pod replica 3</text>
  <text x="44" y="300" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">/data/local (container disk)</text>
  <text x="44" y="317" font-size="10" fill="#b23b3b" font-style="italic">vanishes on restart, not shared</text>

  <text x="44" y="374" font-size="12" fill="#666666" font-style="italic">... pod replica N (scaled independently, rescheduled at any time)</text>

  <!-- crossed-out local disk icon per pod, small marker -->
  <g stroke="#b23b3b" stroke-width="1.6">
    <line x1="190" y1="90" x2="212" y2="112"/>
    <line x1="212" y1="90" x2="190" y2="112"/>
    <line x1="190" y1="182" x2="212" y2="204"/>
    <line x1="212" y1="182" x2="190" y2="204"/>
    <line x1="190" y1="274" x2="212" y2="296"/>
    <line x1="212" y1="274" x2="190" y2="296"/>
  </g>

  <!-- arrows fan out from pods to the two shared destinations -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- to network filesystem (upper right) -->
  <line x1="220" y1="100" x2="330" y2="90" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="220" y1="192" x2="330" y2="130" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="220" y1="284" x2="330" y2="170" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- to object storage (lower right) -->
  <line x1="220" y1="110" x2="330" y2="330" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="220" y1="202" x2="330" y2="330" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="220" y1="294" x2="330" y2="330" stroke="#555555" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- shared network-mounted filesystem box -->
  <rect x="340" y="60" width="380" height="130" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="354" y="84" font-size="13" font-weight="bold" fill="#2f5424">Shared network-mounted filesystem</text>
  <text x="354" y="104" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">EFS / Filestore / Azure Files (CSI driver)</text>
  <text x="354" y="122" font-size="10.5" fill="#666666">ReadWriteMany -- same mount path,</text>
  <text x="354" y="138" font-size="10.5" fill="#666666">visible to every replica at once</text>
  <text x="354" y="156" font-size="10.5" fill="#2f5424" font-weight="bold">durable across restarts, shared, POSIX</text>
  <text x="354" y="174" font-size="10.5" fill="#666666">no new library -- just a mount path</text>

  <!-- external object storage box -->
  <rect x="340" y="264" width="380" height="130" fill="#f4f7ee" stroke="#2f5424" stroke-width="1.4"/>
  <text x="354" y="288" font-size="13" font-weight="bold" fill="#2f5424">External object-storage service</text>
  <text x="354" y="308" font-size="10.5" fill="#333333" font-family="'Courier New', monospace">Amazon S3 / Cloud Storage / Blob Storage</text>
  <text x="354" y="326" font-size="10.5" fill="#666666">reached over HTTPS via a client library,</text>
  <text x="354" y="342" font-size="10.5" fill="#666666">not a mounted path</text>
  <text x="354" y="360" font-size="10.5" fill="#2f5424" font-weight="bold">durable across restarts, shared, tiered</text>
  <text x="354" y="378" font-size="10.5" fill="#666666">Spring Cloud AWS / GCP / Azure starters</text>

  <text x="380" y="420" font-size="11" fill="#666666" text-anchor="middle">local disk is neither shared between replicas nor durable across a restart or reschedule --</text>
  <text x="380" y="438" font-size="11" fill="#666666" text-anchor="middle">both alternatives on the right are both shared and durable</text>
  <text x="380" y="462" font-size="10.5" fill="#666666" text-anchor="middle">"Processes are stateless" -- the same twelve-factor principle behind stateless application instances</text>
</svg>
