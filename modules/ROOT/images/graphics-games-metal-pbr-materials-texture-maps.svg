<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-pbr-materials-texture-maps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Material textures and how the fragment function reads them</text>
<rect x="30" y="56" width="230" height="66" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="145.0" y="78.2" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Base colour</text>
<text x="145.0" y="93.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">sRGB, RGBA8</text>
<text x="145.0" y="108.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">MTKTextureLoader: SRGB true</text>
<line x1="260" y1="89" x2="330" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-texture-maps)"/>
<rect x="30" y="136" width="230" height="66" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="145.0" y="158.2" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Normal map</text>
<text x="145.0" y="173.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">linear, RGB8</text>
<text x="145.0" y="188.2" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">tangent space, SRGB false</text>
<line x1="260" y1="169" x2="330" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-texture-maps)"/>
<rect x="30" y="216" width="230" height="66" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="145.0" y="238.2" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">Metal / rough</text>
<text x="145.0" y="253.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">linear, RGB8</text>
<text x="145.0" y="268.2" font-size="12" font-weight="normal" fill="#065F46" text-anchor="middle">G roughness, B metallic</text>
<line x1="260" y1="249" x2="330" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-texture-maps)"/>
<rect x="30" y="296" width="230" height="66" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="145.0" y="318.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Occlusion</text>
<text x="145.0" y="333.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">linear, R8</text>
<text x="145.0" y="348.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">R = ambient occlusion</text>
<line x1="260" y1="329" x2="330" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-texture-maps)"/>
<rect x="330" y="120" width="200" height="140" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="430.0" y="164.2" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Fragment function</text>
<text x="430.0" y="179.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">sample all four with one</text>
<text x="430.0" y="194.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">sampler, build the TBN</text>
<text x="430.0" y="209.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">basis, perturb N, then</text>
<text x="430.0" y="224.2" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">evaluate the BRDF</text>
<line x1="530" y1="190" x2="590" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-texture-maps)"/>
<rect x="590" y="120" width="150" height="140" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="665.0" y="164.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Vertex data</text>
<text x="665.0" y="179.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">position, normal,</text>
<text x="665.0" y="194.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">tangent, uv</text>
<text x="665.0" y="209.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">needed to build</text>
<text x="665.0" y="224.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">the TBN basis</text>
<line x1="590" y1="220" x2="530" y2="220" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-pbr-materials-texture-maps)"/>
<text x="380" y="330" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Data textures (normal, metallic, roughness, occlusion) must stay linear: no sRGB decode.</text>
<text x="380" y="348" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">A normal map stores N in [0,1]; the shader remaps it with n * 2 - 1 and renormalises.</text>
<text x="380" y="366" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Packing roughness, metallic and occlusion into one texture saves two samples per pixel.</text>
</svg>
