<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Entity-relationship diagram of the main Quartz JDBC job store tables</title>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The QRTZ_ tables: definitions, runtime state and coordination</text>
<defs>
<marker id="er-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/></marker>
<marker id="er-arrow-grey" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#777777"/></marker>
</defs>
<text x="40" y="58" font-size="12" font-weight="bold" fill="#444444">What you scheduled</text>
<rect x="40" y="70" width="250" height="165" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.5"/>
<rect x="40" y="70" width="250" height="24" rx="6" fill="#1c4b73"/>
<rect x="40" y="86" width="250" height="8" fill="#1c4b73"/>
<text x="165.0" y="87" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_JOB_DETAILS</text>
<text x="50" y="112" font-size="10.5" fill="#222222" font-weight="bold">SCHED_NAME, JOB_NAME, JOB_GROUP (PK)</text>
<text x="50" y="127" font-size="10.5" fill="#222222">JOB_CLASS_NAME</text>
<text x="50" y="142" font-size="10.5" fill="#222222">DESCRIPTION</text>
<text x="50" y="157" font-size="10.5" fill="#222222">IS_DURABLE</text>
<text x="50" y="172" font-size="10.5" fill="#222222">IS_NONCONCURRENT</text>
<text x="50" y="187" font-size="10.5" fill="#222222">IS_UPDATE_DATA</text>
<text x="50" y="202" font-size="10.5" fill="#222222">REQUESTS_RECOVERY</text>
<text x="50" y="217" font-size="10.5" fill="#222222">JOB_DATA (BLOB / bytea)</text>
<rect x="380" y="70" width="270" height="225" rx="6" fill="#e8f0f7" stroke="#1c4b73" stroke-width="1.5"/>
<rect x="380" y="70" width="270" height="24" rx="6" fill="#1c4b73"/>
<rect x="380" y="86" width="270" height="8" fill="#1c4b73"/>
<text x="515.0" y="87" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_TRIGGERS</text>
<text x="390" y="112" font-size="10.5" fill="#222222" font-weight="bold">SCHED_NAME, TRIGGER_NAME, TRIGGER_GROUP (PK)</text>
<text x="390" y="127" font-size="10.5" fill="#222222">JOB_NAME, JOB_GROUP (FK to the job)</text>
<text x="390" y="142" font-size="10.5" fill="#222222">TRIGGER_TYPE (SIMPLE, CRON, CAL_INT, ...)</text>
<text x="390" y="157" font-size="10.5" fill="#222222">TRIGGER_STATE (WAITING, ACQUIRED, ...)</text>
<text x="390" y="172" font-size="10.5" fill="#222222">NEXT_FIRE_TIME, PREV_FIRE_TIME</text>
<text x="390" y="187" font-size="10.5" fill="#222222">START_TIME, END_TIME</text>
<text x="390" y="202" font-size="10.5" fill="#222222">PRIORITY, MISFIRE_INSTR</text>
<text x="390" y="217" font-size="10.5" fill="#222222">CALENDAR_NAME (logical link)</text>
<text x="390" y="232" font-size="10.5" fill="#222222">DESCRIPTION</text>
<text x="390" y="247" font-size="10.5" fill="#222222">JOB_DATA (BLOB / bytea)</text>
<rect x="740" y="70" width="230" height="80" rx="6" fill="#eef5ea" stroke="#3f7a2a" stroke-width="1.5"/>
<rect x="740" y="70" width="230" height="24" rx="6" fill="#3f7a2a"/>
<rect x="740" y="86" width="230" height="8" fill="#3f7a2a"/>
<text x="855.0" y="87" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_SIMPLE_TRIGGERS</text>
<text x="750" y="112" font-size="10.5" fill="#222222" font-weight="bold">PK = trigger key (also FK)</text>
<text x="750" y="127" font-size="10.5" fill="#222222">REPEAT_COUNT, REPEAT_INTERVAL</text>
<text x="750" y="142" font-size="10.5" fill="#222222">TIMES_TRIGGERED</text>
<rect x="740" y="160" width="230" height="80" rx="6" fill="#eef5ea" stroke="#3f7a2a" stroke-width="1.5"/>
<rect x="740" y="160" width="230" height="24" rx="6" fill="#3f7a2a"/>
<rect x="740" y="176" width="230" height="8" fill="#3f7a2a"/>
<text x="855.0" y="177" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_CRON_TRIGGERS</text>
<text x="750" y="202" font-size="10.5" fill="#222222" font-weight="bold">PK = trigger key (also FK)</text>
<text x="750" y="217" font-size="10.5" fill="#222222">CRON_EXPRESSION</text>
<text x="750" y="232" font-size="10.5" fill="#222222">TIME_ZONE_ID</text>
<rect x="740" y="250" width="230" height="100" rx="6" fill="#eef5ea" stroke="#3f7a2a" stroke-width="1.5"/>
<rect x="740" y="250" width="230" height="24" rx="6" fill="#3f7a2a"/>
<rect x="740" y="266" width="230" height="8" fill="#3f7a2a"/>
<text x="855.0" y="267" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_SIMPROP_TRIGGERS</text>
<text x="750" y="292" font-size="10.5" fill="#222222" font-weight="bold">PK = trigger key (also FK)</text>
<text x="750" y="307" font-size="10.5" fill="#222222">calendar-interval and daily-time-</text>
<text x="750" y="322" font-size="10.5" fill="#222222">interval triggers: STR_PROP_1..3,</text>
<text x="750" y="337" font-size="10.5" fill="#222222">INT/LONG/DEC/BOOL_PROP_1..2</text>
<rect x="740" y="360" width="230" height="65" rx="6" fill="#eef5ea" stroke="#3f7a2a" stroke-width="1.5"/>
<rect x="740" y="360" width="230" height="24" rx="6" fill="#3f7a2a"/>
<rect x="740" y="376" width="230" height="8" fill="#3f7a2a"/>
<text x="855.0" y="377" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_BLOB_TRIGGERS</text>
<text x="750" y="402" font-size="10.5" fill="#222222" font-weight="bold">PK = trigger key (also FK)</text>
<text x="750" y="417" font-size="10.5" fill="#222222">BLOB_DATA (custom trigger types)</text>
<rect x="380" y="345" width="270" height="55" rx="6" fill="#fdf3e3" stroke="#a8641a" stroke-width="1.5"/>
<rect x="380" y="345" width="270" height="24" rx="6" fill="#a8641a"/>
<rect x="380" y="361" width="270" height="8" fill="#a8641a"/>
<text x="515.0" y="362" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_CALENDARS</text>
<text x="390" y="387" font-size="10.5" fill="#222222" font-weight="bold">SCHED_NAME, CALENDAR_NAME (PK)</text>
<text x="390" y="402" font-size="10.5" fill="#222222">CALENDAR (serialized, BLOB / bytea)</text>
<text x="40" y="288" font-size="12" font-weight="bold" fill="#444444">What is running right now</text>
<rect x="40" y="300" width="250" height="170" rx="6" fill="#f8ecec" stroke="#9a3a3a" stroke-width="1.5"/>
<rect x="40" y="300" width="250" height="24" rx="6" fill="#9a3a3a"/>
<rect x="40" y="316" width="250" height="8" fill="#9a3a3a"/>
<text x="165.0" y="317" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_FIRED_TRIGGERS</text>
<text x="50" y="342" font-size="10.5" fill="#222222" font-weight="bold">SCHED_NAME, ENTRY_ID (PK)</text>
<text x="50" y="357" font-size="10.5" fill="#222222">TRIGGER_NAME, TRIGGER_GROUP</text>
<text x="50" y="372" font-size="10.5" fill="#222222">JOB_NAME, JOB_GROUP</text>
<text x="50" y="387" font-size="10.5" fill="#222222">INSTANCE_NAME (which node)</text>
<text x="50" y="402" font-size="10.5" fill="#222222">STATE (ACQUIRED, EXECUTING)</text>
<text x="50" y="417" font-size="10.5" fill="#222222">FIRED_TIME, SCHED_TIME</text>
<text x="50" y="432" font-size="10.5" fill="#222222">PRIORITY</text>
<text x="50" y="447" font-size="10.5" fill="#222222">IS_NONCONCURRENT</text>
<text x="50" y="462" font-size="10.5" fill="#222222">REQUESTS_RECOVERY</text>
<text x="40" y="508" font-size="12" font-weight="bold" fill="#444444">Coordination between scheduler instances</text>
<rect x="40" y="525" width="250" height="80" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.5"/>
<rect x="40" y="525" width="250" height="24" rx="6" fill="#555555"/>
<rect x="40" y="541" width="250" height="8" fill="#555555"/>
<text x="165.0" y="542" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_SCHEDULER_STATE</text>
<text x="50" y="567" font-size="10.5" fill="#222222" font-weight="bold">SCHED_NAME, INSTANCE_NAME (PK)</text>
<text x="50" y="582" font-size="10.5" fill="#222222">LAST_CHECKIN_TIME</text>
<text x="50" y="597" font-size="10.5" fill="#222222">CHECKIN_INTERVAL</text>
<rect x="380" y="525" width="270" height="80" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.5"/>
<rect x="380" y="525" width="270" height="24" rx="6" fill="#555555"/>
<rect x="380" y="541" width="270" height="8" fill="#555555"/>
<text x="515.0" y="542" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_LOCKS</text>
<text x="390" y="567" font-size="10.5" fill="#222222" font-weight="bold">SCHED_NAME, LOCK_NAME (PK)</text>
<text x="390" y="582" font-size="10.5" fill="#222222">rows: TRIGGER_ACCESS, STATE_ACCESS</text>
<text x="390" y="597" font-size="10.5" fill="#222222">(inserted by Quartz when first needed)</text>
<rect x="740" y="525" width="230" height="80" rx="6" fill="#f4f4f4" stroke="#555555" stroke-width="1.5"/>
<rect x="740" y="525" width="230" height="24" rx="6" fill="#555555"/>
<rect x="740" y="541" width="230" height="8" fill="#555555"/>
<text x="855.0" y="542" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QRTZ_PAUSED_TRIGGER_GRPS</text>
<text x="750" y="567" font-size="10.5" fill="#222222" font-weight="bold">SCHED_NAME, TRIGGER_GROUP (PK)</text>
<text x="750" y="582" font-size="10.5" fill="#222222">group names that are paused,</text>
<text x="750" y="597" font-size="10.5" fill="#222222">no foreign key</text>
<line x1="380" y1="150" x2="292" y2="150" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#er-arrow)"/>
<text x="336" y="143" font-size="10" fill="#1c4b73" text-anchor="middle">FK</text>
<polyline points="740,110 700,110 700,150 652,150" fill="none" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#er-arrow)"/>
<polyline points="740,200 700,200 700,150" fill="none" stroke="#1c4b73" stroke-width="1.8"/>
<polyline points="740,300 700,300 700,200" fill="none" stroke="#1c4b73" stroke-width="1.8"/>
<polyline points="740,392 700,392 700,300" fill="none" stroke="#1c4b73" stroke-width="1.8"/>
<text x="690" y="370" font-size="10" fill="#1c4b73" text-anchor="end">FK, one</text>
<text x="690" y="382" font-size="10" fill="#1c4b73" text-anchor="end">row per</text>
<text x="690" y="394" font-size="10" fill="#1c4b73" text-anchor="end">trigger</text>
<line x1="515" y1="297" x2="515" y2="343" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#er-arrow-grey)"/>
<text x="523" y="326" font-size="10" fill="#555555">by name, no FK</text>
<line x1="165" y1="298" x2="165" y2="237" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#er-arrow-grey)"/>
<polyline points="292,330 335,330 335,250 378,250" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#er-arrow-grey)"/>
<text x="175" y="272" font-size="10" fill="#555555">by key, no FK</text>
<line x1="165" y1="472" x2="165" y2="523" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#er-arrow-grey)"/>
<text x="175" y="492" font-size="10" fill="#555555">INSTANCE_NAME, no FK</text>
<line x1="40" y1="640" x2="80" y2="640" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#er-arrow)"/>
<text x="90" y="644" font-size="11" fill="#222222">declared foreign key (the SQL scripts and the Liquibase changelog)</text>
<line x1="40" y1="662" x2="80" y2="662" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#er-arrow-grey)"/>
<text x="90" y="666" font-size="11" fill="#222222">logical reference that Quartz maintains in code, not declared in the database</text>
<text x="40" y="684" font-size="10.5" fill="#444444">Every primary key starts with SCHED_NAME, so several schedulers (spring.quartz.scheduler-name) can share one set of tables. The prefix QRTZ_ is org.quartz.jobStore.tablePrefix.</text>
</svg>
