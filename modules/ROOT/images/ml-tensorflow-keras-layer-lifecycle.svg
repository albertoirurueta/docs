<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">Lifecycle of a subclassed layer</title>
<desc id="d">Four stages of a custom Keras layer: init stores configuration, build creates weights on first call, call computes the forward pass, and get_config enables saving and loading.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
<rect x="1" y="1" width="718" height="298" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="360" y="32" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Lifecycle of a custom layer</text>
<rect x="20" y="70" width="150" height="70" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="95" y="92" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">__init__</text>
<text x="95" y="110" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">store config, sublayers</text>
<rect x="195" y="70" width="150" height="70" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
<text x="270" y="92" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">build(shape)</text>
<text x="270" y="110" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">add_weight, once</text>
<rect x="370" y="70" width="150" height="70" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="445" y="92" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">call(x, training)</text>
<text x="445" y="110" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">forward pass, every call</text>
<rect x="545" y="70" width="155" height="70" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
<text x="622" y="92" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="Menlo, Consolas, monospace">get_config</text>
<text x="622" y="110" font-size="11" fill="#475569" text-anchor="middle" font-family="Menlo, Consolas, monospace">save and reload</text>
<line x1="170" y1="105" x2="193" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="345" y1="105" x2="368" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="520" y1="105" x2="543" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="270" cy="170" r="11" fill="#B45309"/><text x="270" y="175" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial">1</text>
<text x="290" y="175" font-size="12" fill="#0F172A" font-family="Arial, Helvetica, sans-serif">build runs automatically on the first call, or when the model is built</text>
<circle cx="270" cy="205" r="11" fill="#0F766E"/><text x="270" y="210" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial">2</text>
<text x="290" y="210" font-size="12" fill="#0F172A" font-family="Arial, Helvetica, sans-serif">call must use keras.ops so it runs on every backend</text>
<circle cx="270" cy="240" r="11" fill="#B45309"/><text x="270" y="245" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial">3</text>
<text x="290" y="245" font-size="12" fill="#0F172A" font-family="Arial, Helvetica, sans-serif">get_config returns constructor arguments, from_config rebuilds</text>
<text x="20" y="282" font-size="11" fill="#475569" font-family="Arial, Helvetica, sans-serif">Redrawn from the lifecycle described in the Keras subclassing guide.</text>
</svg>
