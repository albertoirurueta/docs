<svg viewBox="0 0 940 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="430" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf telemetry pipeline</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">services emit OTLP; the Collector samples, enriches and fans out to the backends; Grafana queries them all</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>
  <!-- services -->
  <g font-size="12">
    <rect x="20" y="70" width="200" height="74" rx="6" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.4"/>
    <text x="120" y="92" text-anchor="middle" font-weight="bold" fill="#b7410e">bookshelf-web (axum)</text>
    <text x="120" y="110" text-anchor="middle" fill="#222222">tracing + tracing-opentelemetry</text>
    <text x="120" y="126" text-anchor="middle" fill="#222222">metrics, JSON logs</text>

    <rect x="20" y="170" width="200" height="60" rx="6" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.4"/>
    <text x="120" y="194" text-anchor="middle" font-weight="bold" fill="#b7410e">reviews service</text>
    <text x="120" y="212" text-anchor="middle" fill="#222222">same SDK, same trace ids</text>

    <rect x="20" y="256" width="200" height="60" rx="6" fill="#fdf0e2" stroke="#b7410e" stroke-width="1.4"/>
    <text x="120" y="280" text-anchor="middle" font-weight="bold" fill="#b7410e">background workers</text>
    <text x="120" y="298" text-anchor="middle" fill="#222222">job spans linked to requests</text>
  </g>
  <!-- collector -->
  <rect x="300" y="110" width="280" height="170" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="440" y="135" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">OpenTelemetry Collector</text>
  <g font-size="12" fill="#222222">
    <text x="314" y="160">receivers: OTLP gRPC :4317 / HTTP :4318</text>
    <text x="314" y="182">processors: batch, memory_limiter,</text>
    <text x="314" y="198">  resource attributes, tail sampling</text>
    <text x="314" y="220">exporters: traces, metrics, logs</text>
    <text x="314" y="246" fill="#666666">decouples services from backends:</text>
    <text x="314" y="262" fill="#666666">swap Jaeger for Tempo without redeploying</text>
  </g>
  <!-- backends -->
  <g font-size="12">
    <rect x="640" y="70" width="140" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="710" y="92" text-anchor="middle" font-weight="bold" fill="#1c4b73">Jaeger / Tempo</text>
    <text x="710" y="110" text-anchor="middle" fill="#222222">traces</text>

    <rect x="640" y="170" width="140" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="710" y="192" text-anchor="middle" font-weight="bold" fill="#1c4b73">Prometheus</text>
    <text x="710" y="210" text-anchor="middle" fill="#222222">metrics</text>

    <rect x="640" y="270" width="140" height="50" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.4"/>
    <text x="710" y="292" text-anchor="middle" font-weight="bold" fill="#1c4b73">Loki</text>
    <text x="710" y="310" text-anchor="middle" fill="#222222">logs with trace_id</text>

    <rect x="820" y="170" width="100" height="50" rx="6" fill="#f3e9f7" stroke="#6a3d9a" stroke-width="1.4"/>
    <text x="870" y="192" text-anchor="middle" font-weight="bold" fill="#6a3d9a">Grafana</text>
    <text x="870" y="210" text-anchor="middle" fill="#222222">dashboards</text>
  </g>
  <g stroke="#444444" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <line x1="220" y1="107" x2="298" y2="160"/>
    <line x1="220" y1="200" x2="298" y2="200"/>
    <line x1="220" y1="286" x2="298" y2="240"/>
    <line x1="580" y1="160" x2="638" y2="96"/>
    <line x1="580" y1="195" x2="638" y2="195"/>
    <line x1="580" y1="240" x2="638" y2="294"/>
    <line x1="780" y1="96" x2="836" y2="168"/>
    <line x1="780" y1="195" x2="818" y2="195"/>
    <line x1="780" y1="294" x2="836" y2="222"/>
  </g>
  <text x="248" y="146" font-size="11" fill="#444444">OTLP</text>
  <line x1="120" y1="144" x2="120" y2="168" stroke="#b7410e" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="128" y="160" font-size="11" fill="#b7410e">HTTP + traceparent</text>
  <text x="470" y="360" font-size="12" fill="#222222" text-anchor="middle">Head sampling decides in the service (ParentBased + TraceIdRatioBased); tail sampling in the Collector keeps</text>
  <text x="470" y="378" font-size="12" fill="#222222" text-anchor="middle">every trace with an error or high latency. On shutdown, the service flushes its batch before exiting.</text>
</svg>
