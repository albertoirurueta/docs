<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-loading-models-gltf-result-scene-graph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">What the loader hands back</text>
<rect x="20" y="55" width="230" height="160" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="94.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">gltf (the load result)</text>
<text x="135.0" y="109.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">scene : Group</text>
<text x="135.0" y="124.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">scenes : Group[]</text>
<text x="135.0" y="139.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">animations : AnimationClip[]</text>
<text x="135.0" y="154.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">cameras : Camera[]</text>
<text x="135.0" y="169.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">asset : metadata</text>
<text x="135.0" y="184.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">parser : GLTFParser</text>
<text x="135" y="235" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">await loader.loadAsync(url)</text>
<line x1="250" y1="135" x2="300" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-loading-models-gltf-result-scene-graph)"/>
<text x="520" y="65" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">gltf.scene as Object3D tree (Bookshelf)</text>
<rect x="380" y="80" width="140" height="30" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="450.0" y="99.0" font-size="12" font-weight="normal" fill="#3730A3" text-anchor="middle">Bookshelf (root)</text>
<rect x="300" y="150" width="130" height="30" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="365.0" y="169.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Shelf</text>
<rect x="470" y="150" width="130" height="30" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="535.0" y="169.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Book_* (9 nodes)</text>
<rect x="300" y="220" width="130" height="40" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="365.0" y="236.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Mesh: Wood</text>
<text x="365.0" y="251.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">MeshStandardMaterial</text>
<rect x="470" y="220" width="130" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="535.0" y="236.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Group: 3 Meshes</text>
<text x="535.0" y="251.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Cover, Spine, Pages</text>
<line x1="450" y1="110" x2="365" y2="150" stroke="#4B5563" stroke-width="1.5"/>
<line x1="450" y1="110" x2="535" y2="150" stroke="#4B5563" stroke-width="1.5"/>
<line x1="365" y1="180" x2="365" y2="220" stroke="#4B5563" stroke-width="1.5"/>
<line x1="535" y1="180" x2="535" y2="220" stroke="#4B5563" stroke-width="1.5"/>
<rect x="640" y="150" width="100" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="690.0" y="171.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">animations[]</text>
<text x="690.0" y="186.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">no clips here</text>
<line x1="520" y1="95" x2="640" y2="160" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-webgl-threejs-loading-models-gltf-result-scene-graph)"/>
<text x="380" y="300" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Nodes keep the names from the file: getObjectByName('Book_Shaders') finds one book.</text>
<text x="380" y="322" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The nine Book nodes use one glTF mesh: the clones share geometry and materials.</text>
<text x="380" y="344" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Disposal of geometries, materials and textures is your job when the model is removed.</text>
<text x="380" y="380" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Clips are played with an AnimationMixer, see the animation page.</text>
</svg>
