<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-unity-audio-rolloff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Volume against distance for the three rolloff modes</text>
<rect x="20" y="45" width="500" height="300" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
<line x1="70" y1="310" x2="500" y2="310" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-audio-rolloff)"/>
<line x1="70" y1="310" x2="70" y2="65" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-unity-audio-rolloff)"/>
<text x="285" y="335" text-anchor="middle" font-size="12" fill="#374151">distance from the Audio Listener (metres)</text>
<text x="38" y="190" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 38 190)">volume</text>
<line x1="130" y1="75" x2="130" y2="310" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="430" y1="75" x2="430" y2="310" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="130" y="326" text-anchor="middle" font-size="10" fill="#92400E">Min Distance</text>
<text x="430" y="326" text-anchor="middle" font-size="10" fill="#92400E">Max Distance</text>
<path d="M70,90 L130,90 C150,130 175,170 215,205 C270,245 340,268 430,280 C460,283 490,285 500,285" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
<path d="M70,90 L130,90 L430,300 L500,300" fill="none" stroke="#047857" stroke-width="2.5"/>
<path d="M70,90 L130,90 C200,90 260,100 300,160 C340,225 380,255 430,255 L500,255" fill="none" stroke="#B45309" stroke-width="2.5" stroke-dasharray="7 4"/>
<rect x="545" y="75" width="195" height="80" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="642" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730A3">Logarithmic Rolloff</text>
<text x="642" y="114" text-anchor="middle" font-size="11" fill="#3730A3">drops fast at first, then tapers</text>
<text x="642" y="130" text-anchor="middle" font-size="11" fill="#3730A3">never quite reaches zero</text>
<text x="642" y="146" text-anchor="middle" font-size="11" fill="#3730A3">Max Distance is ignored</text>
<rect x="545" y="170" width="195" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="642" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">Linear Rolloff</text>
<text x="642" y="209" text-anchor="middle" font-size="11" fill="#374151">straight line to Max Distance</text>
<text x="642" y="225" text-anchor="middle" font-size="11" fill="#374151">reaches silence at the end</text>
<rect x="545" y="249" width="195" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="642" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400E">Custom Rolloff</text>
<text x="642" y="288" text-anchor="middle" font-size="11" fill="#92400E">you draw the Volume curve</text>
<text x="642" y="304" text-anchor="middle" font-size="11" fill="#92400E">editing the curve switches</text>
<text x="642" y="320" text-anchor="middle" font-size="11" fill="#92400E">the mode to Custom</text>
<text x="100" y="82" text-anchor="middle" font-size="10" fill="#374151">full volume inside Min</text>
</svg>
