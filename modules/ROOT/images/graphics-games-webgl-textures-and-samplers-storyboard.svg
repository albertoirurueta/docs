<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-textures-and-samplers-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: from an empty quad to the textured book cover</text>
<rect x="20" y="60" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
<circle cx="34" cy="76" r="11" fill="#4F46E5"/>
<text x="34" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="48" y="100" width="80" height="100" rx="2" fill="#111827" stroke="#111827" stroke-width="1" />
<text x="88.0" y="230" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">createTexture</text>
<text x="88.0" y="248" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">bindTexture(unit 0)</text>
<text x="88.0" y="261" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">texture is empty</text>
<text x="88.0" y="274" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">quad is black</text>
<rect x="166" y="60" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
<circle cx="180" cy="76" r="11" fill="#4F46E5"/>
<text x="180" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="194" y="100" width="80" height="100" rx="2" fill="#E5E7EB" stroke="#4B5563" stroke-width="1" />
<text x="234" y="155" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">empty</text>
<text x="234.0" y="230" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">texStorage2D</text>
<text x="234.0" y="248" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">9 levels, 256 x 256</text>
<text x="234.0" y="261" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">SRGB8_ALPHA8</text>
<text x="234.0" y="274" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">immutable storage</text>
<rect x="312" y="60" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
<circle cx="326" cy="76" r="11" fill="#4F46E5"/>
<text x="326" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="340" y="100" width="80" height="100" rx="2" fill="#C7D2FE" stroke="#3730A3" stroke-width="1.5" />
<rect x="348" y="108" width="64" height="84" rx="2" fill="none" stroke="#3730A3" stroke-width="1" />
<text x="380.0" y="230" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">texSubImage2D</text>
<text x="380.0" y="248" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">bitmap copied to L0</text>
<text x="380.0" y="261" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">imageOrientation:</text>
<text x="380.0" y="274" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">flipY</text>
<rect x="458" y="60" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
<circle cx="472" cy="76" r="11" fill="#4F46E5"/>
<text x="472" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="494" y="108" width="60" height="75.0" rx="0" fill="none" stroke="#4F46E5" stroke-width="1" />
<rect x="494" y="108" width="40" height="50.0" rx="0" fill="none" stroke="#4F46E5" stroke-width="1" />
<rect x="494" y="108" width="26" height="32.5" rx="0" fill="none" stroke="#4F46E5" stroke-width="1" />
<rect x="494" y="108" width="16" height="20.0" rx="0" fill="none" stroke="#4F46E5" stroke-width="1" />
<text x="526.0" y="230" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">generateMipmap</text>
<text x="526.0" y="248" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">L1..L8 filled</text>
<text x="526.0" y="261" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">bindSampler: LINEAR_</text>
<text x="526.0" y="274" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">MIPMAP_LINEAR</text>
<rect x="604" y="60" width="136" height="230" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
<circle cx="618" cy="76" r="11" fill="#4F46E5"/>
<text x="618" y="80" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="632" y="100" width="80" height="100" rx="2" fill="#C7D2FE" stroke="#3730A3" stroke-width="1.5" />
<rect x="640" y="108" width="64" height="84" rx="2" fill="none" stroke="#3730A3" stroke-width="1" />
<rect x="648" y="124" width="48" height="14" rx="2" fill="#EEF2FF" stroke="#3730A3" stroke-width="1" />
<text x="672" y="135" font-size="9" font-weight="bold" fill="#3730A3" text-anchor="middle">TITLE</text>
<text x="672.0" y="230" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">drawElements</text>
<text x="672.0" y="248" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">uCover = 0</text>
<text x="672.0" y="261" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">texture(uCover, vUv)</text>
<text x="672.0" y="274" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">cover on the quad</text>
<text x="380" y="322" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle">Steps 1-4 run once at start-up; step 5 runs every frame (or on demand).</text>
</svg>
