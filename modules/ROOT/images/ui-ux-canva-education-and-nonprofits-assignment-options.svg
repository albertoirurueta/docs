<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two ways to hand out an assignment, and how long each lasts</text>
<rect x="30" y="56" width="200" height="150" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/><text x="130" y="80" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Assignment</text><rect x="46" y="92" width="168" height="20" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="130" y="106" font-size="11" fill="#374151" text-anchor="middle">Reading response</text><rect x="60" y="124" width="140" height="18" rx="9" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/><text x="130.0" y="137" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Assign</text><rect x="46" y="156" width="168" height="34" rx="4" fill="#EEF2FF" stroke="#9CA3AF" stroke-width="1"/><text x="130" y="170" font-size="11" fill="#374151" text-anchor="middle">Teacher keeps the</text><text x="130" y="184" font-size="11" fill="#374151" text-anchor="middle">original design</text><path d="M232,110 L292,80" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M232,150 L292,180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="296" y="52" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="406" y="76" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Share via link</text><text x="406" y="94" font-size="11" fill="#374151" text-anchor="middle">Paste into email, chat or an LMS</text><rect x="296" y="152" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/><text x="406" y="176" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Get assignment code</text><text x="406" y="194" font-size="11" fill="#374151" text-anchor="middle">Students type or paste the code</text><path d="M518,80 L558,80" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><path d="M518,180 L558,180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/><rect x="562" y="58" width="168" height="44" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="646" y="76" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Link active</text><text x="646" y="92" font-size="11" fill="#92400E" text-anchor="middle">30 days, can deactivate</text><rect x="562" y="158" width="168" height="44" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="646" y="176" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">Code expires</text><text x="646" y="192" font-size="11" fill="#92400E" text-anchor="middle">after 4 hours</text><text x="380" y="240" font-size="12" fill="#374151" text-anchor="middle">Students need a Canva account; if they have none they are prompted to sign up.</text>  <text x="380" y="282" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
