<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>How the generic type Stack of Element is instantiated once for Int, producing Stack of Int, and once for String, producing Stack of String -- one implementation, two independent, type-safe instantiations.</title>
  <rect x="0" y="0" width="820" height="340" fill="#ffffff"/>

  <text x="410" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Generic instantiation: one implementation, many concrete types</text>
  <text x="410" y="46" font-size="11" fill="#666666" text-anchor="middle">the compiler generates (or specializes) a distinct, type-safe version of Stack per concrete Element used</text>

  <!-- Generic definition box -->
  <rect x="290" y="70" width="240" height="60" rx="8" fill="#eef4fb" stroke="#3d6fa5" stroke-width="1.4"/>
  <text x="410" y="94" font-size="14" text-anchor="middle" fill="#1f3b5c" font-weight="bold">Stack&lt;Element&gt;</text>
  <text x="410" y="114" font-size="10.5" text-anchor="middle" fill="#3d6fa5">items: [Element], push, pop</text>

  <!-- Arrows down to instantiations -->
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <g stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow2)">
    <line x1="360" y1="130" x2="210" y2="190"/>
    <line x1="460" y1="130" x2="610" y2="190"/>
  </g>
  <text x="240" y="155" font-size="10.5" fill="#8a8a8a">Element = Int</text>
  <text x="520" y="155" font-size="10.5" fill="#8a8a8a" text-anchor="end">Element = String</text>

  <!-- Stack<Int> instantiation -->
  <rect x="90" y="190" width="220" height="100" rx="8" fill="#fff4e8" stroke="#b5762a" stroke-width="1.4"/>
  <text x="200" y="212" font-size="13" text-anchor="middle" fill="#7a4d13" font-weight="bold">Stack&lt;Int&gt;</text>
  <text x="200" y="232" font-size="11" text-anchor="middle" fill="#7a4d13">items: [Int]</text>
  <rect x="115" y="244" width="40" height="26" rx="4" fill="#ffffff" stroke="#b5762a" stroke-width="1.1"/>
  <text x="135" y="261" font-size="11" text-anchor="middle" fill="#7a4d13">1</text>
  <rect x="160" y="244" width="40" height="26" rx="4" fill="#ffffff" stroke="#b5762a" stroke-width="1.1"/>
  <text x="180" y="261" font-size="11" text-anchor="middle" fill="#7a4d13">2</text>
  <rect x="205" y="244" width="40" height="26" rx="4" fill="#ffffff" stroke="#b5762a" stroke-width="1.1"/>
  <text x="225" y="261" font-size="11" text-anchor="middle" fill="#7a4d13">3</text>

  <!-- Stack<String> instantiation -->
  <rect x="510" y="190" width="220" height="100" rx="8" fill="#f2eefb" stroke="#6b4fa5" stroke-width="1.4"/>
  <text x="620" y="212" font-size="13" text-anchor="middle" fill="#3c2a5c" font-weight="bold">Stack&lt;String&gt;</text>
  <text x="620" y="232" font-size="11" text-anchor="middle" fill="#3c2a5c">items: [String]</text>
  <rect x="530" y="244" width="80" height="26" rx="4" fill="#ffffff" stroke="#6b4fa5" stroke-width="1.1"/>
  <text x="570" y="261" font-size="10.5" text-anchor="middle" fill="#3c2a5c">"ready"</text>
  <rect x="615" y="244" width="90" height="26" rx="4" fill="#ffffff" stroke="#6b4fa5" stroke-width="1.1"/>
  <text x="660" y="261" font-size="10.5" text-anchor="middle" fill="#3c2a5c">"set"</text>

  <text x="410" y="320" font-size="10.5" fill="#666666" text-anchor="middle">Stack&lt;Int&gt; and Stack&lt;String&gt; are distinct types -- neither's items may mix into the other</text>
</svg>
