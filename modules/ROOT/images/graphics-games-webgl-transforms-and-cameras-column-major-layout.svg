<text x="360" y="86" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="start">Mathematical form</text>
<text x="360" y="112" font-size="13" font-family="monospace" fill="#374151">[ Xx  Yx  Zx  Tx ]</text>
<text x="360" y="132" font-size="13" font-family="monospace" fill="#374151">[ Xy  Yy  Zy  Ty ]</text>
<text x="360" y="152" font-size="13" font-family="monospace" fill="#374151">[ Xz  Yz  Zz  Tz ]</text>
<text x="360" y="172" font-size="13" font-family="monospace" fill="#374151">[  0   0   0   1 ]</text>
<text x="560" y="150" font-size="13" font-weight="normal" fill="#374151" text-anchor="start">v&#x27; = M v</text>
<text x="360" y="205" font-size="12" font-weight="normal" fill="#92400E" text-anchor="start">Translation sits at indices 12, 13, 14.</text>
<text x="360" y="225" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">glMatrix, three.js and OpenGL use this order.</text>
<text x="360" y="245" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">uniformMatrix4fv(loc, false, m) uploads it as is.</text>
