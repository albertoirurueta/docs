<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-biv-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Three ways to get texels into an optimal-tiling image</text>
<rect x="30" y="60" width="210" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="84.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">A. Staging buffer</text>
<rect x="30" y="115" width="95" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="77.5" y="136.2" text-anchor="middle" font-size="12" fill="#374151">Host data</text>
<text x="77.5" y="152.2" text-anchor="middle" font-size="12" fill="#374151">memcpy</text>
<rect x="145" y="115" width="95" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="192.5" y="136.2" text-anchor="middle" font-size="12" fill="#92400E">Staging</text>
<text x="192.5" y="152.2" text-anchor="middle" font-size="12" fill="#92400E">buffer</text>
<line x1="125" y1="140" x2="145" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-up)"/>
<rect x="30" y="190" width="210" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="135.0" y="211.3" text-anchor="middle" font-size="11" fill="#3730A3">vkCmdCopyBufferToImage2</text>
<text x="135.0" y="226.3" text-anchor="middle" font-size="11" fill="#3730A3">+ barriers, on a queue</text>
<line x1="190" y1="165" x2="150" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-up)"/>
<rect x="30" y="265" width="210" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="135.0" y="289.2" text-anchor="middle" font-size="12" fill="#065F46">Optimal-tiling image</text>
<line x1="135" y1="240" x2="135" y2="265" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-up)"/>
<rect x="275" y="60" width="210" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="84.5" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">B. Host image copy (1.4)</text>
<rect x="275" y="115" width="210" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="144.2" text-anchor="middle" font-size="12" fill="#374151">Host data (no staging)</text>
<rect x="275" y="190" width="210" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="211.3" text-anchor="middle" font-size="11" fill="#3730A3">vkCopyMemoryToImage</text>
<text x="380.0" y="226.3" text-anchor="middle" font-size="11" fill="#3730A3">(CPU does the swizzle)</text>
<line x1="380" y1="165" x2="380" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-up)"/>
<rect x="275" y="265" width="210" height="40" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="380.0" y="288.9" text-anchor="middle" font-size="11" fill="#065F46">Image with HOST_TRANSFER usage</text>
<line x1="380" y1="240" x2="380" y2="265" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-up)"/>
<rect x="520" y="60" width="210" height="40" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="84.5" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">C. Linear tiling (avoid)</text>
<rect x="520" y="115" width="210" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="136.3" text-anchor="middle" font-size="11" fill="#374151">Map the image memory</text>
<text x="625.0" y="151.3" text-anchor="middle" font-size="11" fill="#374151">write rows by rowPitch</text>
<rect x="520" y="190" width="210" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625.0" y="211.3" text-anchor="middle" font-size="11" fill="#92400E">Few formats and uses</text>
<text x="625.0" y="226.3" text-anchor="middle" font-size="11" fill="#92400E">no mips, one layer, restricted</text>
<line x1="625" y1="165" x2="625" y2="190" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-up)"/>
<rect x="520" y="265" width="210" height="40" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="625.0" y="289.2" text-anchor="middle" font-size="12" fill="#1F2937">Rarely worth it</text>
<line x1="625" y1="240" x2="625" y2="265" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-biv-up)"/>
<text x="380" y="340" text-anchor="middle" font-size="11" fill="#374151">A works everywhere and can use a transfer queue; B skips the staging copy and GPU round trip;</text>
<text x="380" y="358" text-anchor="middle" font-size="11" fill="#374151">C only suits tiny CPU-visible images such as read-back of a small screenshot.</text>
<text x="380" y="390" text-anchor="middle" font-size="11" fill="#374151">In all cases the image must reach a layout the sampler can read before shaders use it.</text>
</svg>
