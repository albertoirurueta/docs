<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>CMD and ENTRYPOINT: what actually runs</title>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
  <rect x="0" y="0" width="900" height="360" fill="#ffffff"/>
  <text x="450.0" y="24" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">CMD and ENTRYPOINT: what actually runs</text>
  <text x="450.0" y="42" font-size="10.5" fill="#666666" text-anchor="middle">rows = CMD form, columns = ENTRYPOINT form (from the Dockerfile reference)</text>
  <rect x="20" y="60" width="170" height="46" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="105.0" y="86.2" font-size="10.5" fill="#333333" text-anchor="middle"></text>
  <rect x="190.0" y="60" width="230.0" height="46" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="305.0" y="85.8" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">No ENTRYPOINT</text>
  <rect x="420.0" y="60" width="230.0" height="46" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="535.0" y="85.8" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">ENTRYPOINT exec_entry p1_entry</text>
  <rect x="650.0" y="60" width="230.0" height="46" rx="4" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="765.0" y="85.8" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">ENTRYPOINT ["exec_entry", "p1_entry"]</text>
  <rect x="20" y="106" width="170" height="62" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="105.0" y="139.8" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">No CMD</text>
  <rect x="190.0" y="106" width="230.0" height="62" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="305.0" y="139.5" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">error, not allowed</text>
  <rect x="420.0" y="106" width="230.0" height="62" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="535.0" y="133.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">/bin/sh -c</text>
  <text x="535.0" y="146.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">exec_entry p1_entry</text>
  <rect x="650.0" y="106" width="230.0" height="62" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="765.0" y="139.5" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">exec_entry p1_entry</text>
  <rect x="20" y="168" width="170" height="62" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="105.0" y="201.8" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">CMD ["exec_cmd", "p1_cmd"]</text>
  <rect x="190.0" y="168" width="230.0" height="62" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="305.0" y="201.5" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">exec_cmd p1_cmd</text>
  <rect x="420.0" y="168" width="230.0" height="62" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="535.0" y="195.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">/bin/sh -c</text>
  <text x="535.0" y="208.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">exec_entry p1_entry</text>
  <rect x="650.0" y="168" width="230.0" height="62" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="765.0" y="195.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">exec_entry p1_entry</text>
  <text x="765.0" y="208.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">exec_cmd p1_cmd</text>
  <rect x="20" y="230" width="170" height="62" rx="4" fill="#f3eefa" stroke="#5b3a8c" stroke-width="1.3"/>
  <text x="105.0" y="263.8" font-size="9.0" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">CMD exec_cmd p1_cmd</text>
  <rect x="190.0" y="230" width="230.0" height="62" rx="4" fill="#f4f4f4" stroke="#555555" stroke-width="1.3"/>
  <text x="305.0" y="263.5" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">/bin/sh -c exec_cmd p1_cmd</text>
  <rect x="420.0" y="230" width="230.0" height="62" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="535.0" y="257.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">/bin/sh -c</text>
  <text x="535.0" y="270.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">exec_entry p1_entry</text>
  <rect x="650.0" y="230" width="230.0" height="62" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="765.0" y="257.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">exec_entry p1_entry</text>
  <text x="765.0" y="270.0" font-size="8.5" fill="#333333" text-anchor="middle" font-family="Menlo, Consolas, monospace">/bin/sh -c exec_cmd p1_cmd</text>
  <rect x="20" y="300" width="20" height="14" rx="4" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.3"/>
  <text x="46" y="311" font-size="9.5" fill="#333333" text-anchor="start">exec form: arguments appended, signals reach the app</text>
  <rect x="350" y="300" width="20" height="14" rx="4" fill="#fdf3e7" stroke="#9a5a12" stroke-width="1.3"/>
  <text x="376" y="311" font-size="9.5" fill="#333333" text-anchor="start">shell form: /bin/sh is PID 1, CMD/run args ignored</text>
  <rect x="700" y="300" width="20" height="14" rx="4" fill="#fbeeee" stroke="#8f2a2a" stroke-width="1.3"/>
  <text x="726" y="311" font-size="9.5" fill="#333333" text-anchor="start">invalid</text>
  <text x="450" y="340" font-size="10" fill="#1c4b73" text-anchor="middle" font-weight="bold">Recommended: ENTRYPOINT ["java", ...] (exec form) with default arguments in CMD ["..."]</text>
</svg>
