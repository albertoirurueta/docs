<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Two ways to store facet data &#8212; same facet result</text>
  <text x="380" y="45" font-size="12" fill="#666666" text-anchor="middle">lucene-facet: a taxonomy sidecar index of label&#8594;ordinal, or labels kept directly in a SortedSet doc-values field</text>

  <!-- divider -->
  <line x1="380" y1="60" x2="380" y2="262" stroke="#cccccc" stroke-width="1"/>

  <!-- ================= left: taxonomy ================= -->
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#1c4b73">Taxonomy index (sidecar Directory)</text>

  <rect x="40" y="90" width="196" height="72" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="52" y="108" font-size="10.5" fill="#666666">Main index (Directory)</text>
  <text x="52" y="126" font-size="10" fill="#222222" font-family="'Courier New', monospace">FacetField("Category",</text>
  <text x="52" y="139" font-size="10" fill="#222222" font-family="'Courier New', monospace">  "books","computers")</text>
  <text x="52" y="156" font-size="10" fill="#2f5424" font-family="'Courier New', monospace">doc ordinals: 4, 7</text>

  <rect x="256" y="90" width="108" height="72" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="266" y="108" font-size="10.5" fill="#666666">Taxonomy Directory</text>
  <g font-size="10" fill="#222222" font-family="'Courier New', monospace">
    <text x="266" y="126">books &#8594; 4</text>
    <text x="266" y="139">computers &#8594; 7</text>
    <text x="266" y="152">Doug &#8594; 9</text>
  </g>

  <line x1="236" y1="126" x2="256" y2="126" stroke="#999999" stroke-width="1.4"/>
  <polygon points="252,122 252,130 260,126" fill="#999999"/>

  <text x="40" y="182" font-size="10" fill="#999999" font-family="'Courier New', monospace">config.build(taxoWriter, doc)   // DirectoryTaxonomyWriter</text>

  <rect x="40" y="192" width="324" height="44" fill="#ffffff" stroke="#1c4b73" stroke-width="1.3"/>
  <text x="52" y="210" font-size="10.5" font-weight="bold" fill="#222222">Search: FastTaxonomyFacetCounts</text>
  <text x="52" y="227" font-size="9.5" fill="#666666">counts ordinals for the hit set via TaxonomyReader</text>

  <!-- ================= right: SSDV ================= -->
  <text x="400" y="78" font-size="13" font-weight="bold" fill="#2f5424">SortedSetDocValues (no sidecar)</text>

  <rect x="400" y="90" width="320" height="72" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="412" y="108" font-size="10.5" fill="#666666">Main index (Directory) &#8212; only</text>
  <text x="412" y="126" font-size="10" fill="#222222" font-family="'Courier New', monospace">SortedSetDocValuesFacetField(</text>
  <text x="412" y="139" font-size="10" fill="#222222" font-family="'Courier New', monospace">  "Category", "books")</text>
  <text x="412" y="156" font-size="10" fill="#2f5424" font-family="'Courier New', monospace">stored as SORTED_SET doc-values</text>

  <text x="400" y="182" font-size="10" fill="#999999" font-family="'Courier New', monospace">config.build(doc)   // no taxonomy writer</text>

  <rect x="400" y="192" width="320" height="44" fill="#ffffff" stroke="#2f5424" stroke-width="1.3"/>
  <text x="412" y="210" font-size="10.5" font-weight="bold" fill="#222222">Search: SortedSetDocValuesFacetCounts</text>
  <text x="412" y="227" font-size="9.5" fill="#666666">counts doc-values ordinals via ...ReaderState</text>

  <!-- converge -->
  <line x1="202" y1="236" x2="202" y2="286" stroke="#999999" stroke-width="1.4"/>
  <polygon points="198,282 206,282 202,290" fill="#999999"/>
  <line x1="560" y1="236" x2="560" y2="286" stroke="#999999" stroke-width="1.4"/>
  <polygon points="556,282 564,282 560,290" fill="#999999"/>

  <rect x="110" y="290" width="540" height="86" fill="#ffffff" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="380" y="310" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Identical FacetResult</text>
  <g font-family="'Courier New', monospace" font-size="11" fill="#222222">
    <text x="130" y="333">Category:  books 12    computers 8    fiction 5</text>
    <text x="130" y="353">Author:    Doug 9      Mike 4</text>
  </g>
  <text x="380" y="370" font-size="9.5" fill="#999999" text-anchor="middle">facets.getTopChildren(10, "Category")</text>

  <text x="380" y="400" font-size="10.5" fill="#444444" text-anchor="middle">Taxonomy: deep hierarchies and association facets efficiently &#8212; but a second Directory to keep in sync.</text>
  <text x="380" y="418" font-size="10.5" fill="#444444" text-anchor="middle">SortedSetDocValues: one index to operate &#8212; best for flat or shallow dimensions.</text>
  <text x="380" y="440" font-size="10" fill="#999999" text-anchor="middle">The same FacetsConfig must be used at index time and at search time in both models.</text>
</svg>
