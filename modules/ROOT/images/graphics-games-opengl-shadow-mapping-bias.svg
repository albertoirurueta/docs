<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Depth bias: acne, peter-panning and the balance between them</text>
<rect x="15" y="45" width="235" height="260" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="132" y="68" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">1  No bias: shadow acne</text>
<line x1="30" y1="260" x2="235" y2="130" stroke="#374151" stroke-width="2"/>
<polyline points="30,260 30,260 70,260 70,234 111,234 111,208 152,208 152,182 193,182 193,156 235,156" fill="none" stroke="#B45309" stroke-width="1.5"/>
<polygon points="30,260 70,260 70,247" fill="#B45309" opacity="0.5"/>
<polygon points="70,234 111,234 111,221" fill="#B45309" opacity="0.5"/>
<polygon points="111,208 152,208 152,195" fill="#B45309" opacity="0.5"/>
<polygon points="152,182 193,182 193,169" fill="#B45309" opacity="0.5"/>
<text x="132" y="285" font-size="10" fill="#374151" text-anchor="middle">each texel stores one depth, the slanted surface</text>
<text x="132" y="298" font-size="10" fill="#374151" text-anchor="middle">is half below it: striped self-shadowing</text>
<rect x="262" y="45" width="235" height="260" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="380" y="68" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">2  Bias too large: peter-panning</text>
<line x1="277" y1="260" x2="482" y2="260" stroke="#374151" stroke-width="2"/>
<rect x="300" y="190" width="40" height="70" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<rect x="340" y="258" width="60" height="4" fill="#9CA3AF"/>
<rect x="400" y="258" width="60" height="4" fill="#4B5563"/>
<text x="370" y="240" font-size="10" fill="#374151">gap</text>
<text x="380" y="285" font-size="10" fill="#374151" text-anchor="middle">the shadow starts away from the base,</text>
<text x="380" y="298" font-size="10" fill="#374151" text-anchor="middle">so the book seems to float</text>
<rect x="510" y="45" width="235" height="260" rx="10" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/>
<text x="627" y="68" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">3  Slope-scaled bias</text>
<line x1="525" y1="260" x2="730" y2="130" stroke="#374151" stroke-width="2"/>
<polyline points="525,252 565,252 565,226 606,226 606,200 647,200 647,174 688,174 688,148 730,148" fill="none" stroke="#047857" stroke-width="1.5"/>
<text x="627" y="285" font-size="10" fill="#374151" text-anchor="middle">the stored depth is pushed away by an amount</text>
<text x="627" y="298" font-size="10" fill="#374151" text-anchor="middle">that grows with the slope: no stripes, small gap</text>
<rect x="15" y="320" width="730" height="60" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="343" font-size="12" fill="#374151" text-anchor="middle">Tools: glPolygonOffset while rendering the depth map, a bias term in the shader, or moving the lookup along the normal.</text>
<text x="380" y="363" font-size="12" fill="#374151" text-anchor="middle">Tune with the shadow-map resolution and light angle: the right value is scene dependent, never a magic constant.</text>
</svg>
