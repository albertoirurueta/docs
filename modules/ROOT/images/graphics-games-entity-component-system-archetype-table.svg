<text x="412" y="76" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">GravitySystem</text>
<text x="412" y="96" text-anchor="start" font-size="11" fill="#374151">query: Position (write), Velocity (write), Falling</text>
<text x="412" y="114" text-anchor="start" font-size="12" fill="#047857" font-weight="bold">matches archetype A only</text>
<text x="412" y="132" text-anchor="start" font-size="11" fill="#4B5563">it never touches landed books or the basket</text>
<rect x="400" y="155" width="345" height="78" rx="10" fill="#F9FAFB" stroke="#047857" stroke-width="1.5"/>
<text x="412" y="176" text-anchor="start" font-size="13" fill="#1F2937" font-weight="bold">ScoreSystem</text>
<text x="412" y="196" text-anchor="start" font-size="11" fill="#374151">query: Position (read), Book</text>
<text x="412" y="214" text-anchor="start" font-size="12" fill="#047857" font-weight="bold">matches archetypes A and C</text>
<text x="380" y="410" text-anchor="middle" font-size="11" fill="#4B5563">A query is a filter over archetypes: every matching table is walked as dense arrays, one component column at a time</text>
<text x="380" y="430" text-anchor="middle" font-size="11" fill="#4B5563">Adding or removing a component changes the archetype, so it copies the entity row; engines defer it to a safe point</text>
<text x="380" y="450" text-anchor="middle" font-size="11" fill="#4B5563">Chunks of 16 KB in Unity Entities hold the rows of one archetype; the column layout is the same idea</text>
