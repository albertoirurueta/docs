<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img">
<title>C order versus Fortran order memory layout</title>
<desc>A 3 by 4 int32 array laid out in memory in C order with strides 16 and 4 and in Fortran order with strides 4 and 12.</desc>
