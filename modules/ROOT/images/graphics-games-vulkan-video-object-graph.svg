<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vid-obj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The objects of a Vulkan Video decode or encode path</text>
<rect x="30" y="50" width="200" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="71.3" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">VkVideoProfileInfoKHR</text>
<text x="130.0" y="86.3" text-anchor="middle" font-size="11" fill="#3730A3">codec, chroma, bit depth</text>
<rect x="280" y="50" width="200" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="63.9" text-anchor="middle" font-size="11" fill="#374151">Capabilities query</text>
<text x="380.0" y="78.8" text-anchor="middle" font-size="11" fill="#374151">vkGetPhysicalDevice</text>
<text x="380.0" y="93.8" text-anchor="middle" font-size="11" fill="#374151">VideoCapabilitiesKHR</text>
<rect x="530" y="50" width="200" height="50" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630.0" y="71.3" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Queue family</text>
<text x="630.0" y="86.3" text-anchor="middle" font-size="11" fill="#92400E">decode or encode operations</text>
<line x1="230" y1="75" x2="280" y2="75" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-obj)"/>
<rect x="30" y="150" width="200" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="130.0" y="168.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">VkVideoSessionKHR</text>
<text x="130.0" y="183.8" text-anchor="middle" font-size="11" fill="#3730A3">codec state, DPB slot state</text>
<text x="130.0" y="198.8" text-anchor="middle" font-size="11" fill="#3730A3">memory bound by app</text>
<rect x="280" y="150" width="200" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="168.8" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">VkVideoSessionParametersKHR</text>
<text x="380.0" y="183.8" text-anchor="middle" font-size="11" fill="#3730A3">SPS, PPS or sequence header</text>
<text x="380.0" y="198.8" text-anchor="middle" font-size="11" fill="#3730A3">data stored in the object</text>
<rect x="530" y="150" width="200" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="176.3" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Video buffers</text>
<text x="630.0" y="191.3" text-anchor="middle" font-size="11" fill="#065F46">bitstream (source or destination)</text>
<line x1="130" y1="100" x2="130" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-obj)"/>
<line x1="380" y1="100" x2="380" y2="150" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-vid-obj)"/>
<line x1="530" y1="75" x2="480" y2="75" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-obj)"/>
<rect x="30" y="250" width="200" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="130.0" y="268.9" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">DPB images</text>
<text x="130.0" y="283.9" text-anchor="middle" font-size="11" fill="#065F46">VkImage array layers</text>
<text x="130.0" y="298.9" text-anchor="middle" font-size="11" fill="#065F46">picture resources</text>
<rect x="280" y="250" width="200" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="268.9" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Command buffer</text>
<text x="380.0" y="283.9" text-anchor="middle" font-size="11" fill="#92400E">vkCmdBeginVideoCodingKHR</text>
<text x="380.0" y="298.9" text-anchor="middle" font-size="11" fill="#92400E">... decode or encode ... End</text>
<rect x="530" y="250" width="200" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630.0" y="268.9" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Output image</text>
<text x="630.0" y="283.9" text-anchor="middle" font-size="11" fill="#065F46">decoded frame or</text>
<text x="630.0" y="298.9" text-anchor="middle" font-size="11" fill="#065F46">reconstructed picture</text>
<line x1="130" y1="210" x2="130" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-obj)"/>
<line x1="380" y1="210" x2="380" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-obj)"/>
<line x1="630" y1="210" x2="470" y2="255" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-obj)"/>
<line x1="230" y1="280" x2="280" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-obj)"/>
<line x1="480" y1="280" x2="530" y2="280" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vid-obj)"/>
<text x="380" y="350" text-anchor="middle" font-size="12" fill="#374151">The video coding scope is opened with Begin, closed with End, and holds the bound session,</text>
<text x="380" y="370" text-anchor="middle" font-size="12" fill="#374151">its parameters and the DPB reference slots that the commands inside it use.</text>
<text x="380" y="395" text-anchor="middle" font-size="11" fill="#374151">Dashed arrow: parameters are created against a session and must be compatible with its profile.</text>
</svg>
