<svg viewBox="0 0 900 560" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">How a font reaches the PDF: three paths from the same Unicode string</text>

  <text x="110" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#333">You choose</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#333">iText writes into the file</text>
  <text x="790" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Result</text>

  <!-- lane 1: standard 14 -->
  <rect x="20" y="76" width="180" height="120" rx="6" fill="#fde8c8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="110" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4700">Standard 14 font</text>
  <text x="110" y="120" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">StandardFonts.HELVETICA</text>
  <text x="110" y="142" text-anchor="middle" font-size="12" fill="#333">1 byte per character</text>
  <text x="110" y="160" text-anchor="middle" font-size="12" fill="#333">WinAnsi (Windows-1252)</text>
  <text x="110" y="178" text-anchor="middle" font-size="12" fill="#333">metrics only, no glyphs</text>
  <line x1="200" y1="136" x2="236" y2="136" stroke="#555" stroke-width="1.6" marker-end="url(#fe-arrow)"/>
  <rect x="240" y="76" width="400" height="120" rx="6" fill="#ffffff" stroke="#b36b00" stroke-width="1.6"/>
  <text x="440" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4700">One dictionary, no font file</text>
  <text x="440" y="124" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">/Type /Font  /Subtype /Type1</text>
  <text x="440" y="144" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">/BaseFont /Helvetica</text>
  <text x="440" y="164" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">/Encoding /WinAnsiEncoding</text>
  <text x="440" y="184" text-anchor="middle" font-size="12" fill="#555">no /FontDescriptor, no /FontFile</text>
  <line x1="640" y1="136" x2="676" y2="136" stroke="#555" stroke-width="1.6" marker-end="url(#fe-arrow)"/>
  <rect x="680" y="76" width="200" height="120" rx="6" fill="#fde8c8" stroke="#b36b00" stroke-width="1.6"/>
  <text x="780" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4700">Not embedded</text>
  <text x="780" y="124" text-anchor="middle" font-size="12" fill="#333">viewer substitutes a font</text>
  <text x="780" y="142" text-anchor="middle" font-size="12" fill="#333">other characters are lost</text>
  <text x="780" y="160" text-anchor="middle" font-size="12" fill="#333">not allowed in PDF/A</text>
  <text x="780" y="178" text-anchor="middle" font-size="12" fill="#333">smallest file</text>

  <!-- lane 2: embedded subset -->
  <rect x="20" y="214" width="180" height="150" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.6"/>
  <text x="110" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa6">TrueType or OpenType</text>
  <text x="110" y="258" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">DejaVuSans.ttf</text>
  <text x="110" y="276" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">IDENTITY_H</text>
  <text x="110" y="298" text-anchor="middle" font-size="12" fill="#333">2 bytes per glyph id</text>
  <text x="110" y="316" text-anchor="middle" font-size="12" fill="#333">any Unicode character</text>
  <text x="110" y="334" text-anchor="middle" font-size="12" fill="#333">the font has a glyph for</text>
  <text x="110" y="352" text-anchor="middle" font-size="12" fill="#333">(subset by default)</text>
  <line x1="200" y1="289" x2="236" y2="289" stroke="#555" stroke-width="1.6" marker-end="url(#fe-arrow)"/>
  <rect x="240" y="214" width="400" height="150" rx="6" fill="#ffffff" stroke="#1f5fa6" stroke-width="1.6"/>
  <rect x="254" y="228" width="110" height="26" rx="4" fill="#e1f0ff" stroke="#1f5fa6"/>
  <text x="309" y="245" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">Type0 font</text>
  <rect x="384" y="228" width="110" height="26" rx="4" fill="#e1f0ff" stroke="#1f5fa6"/>
  <text x="439" y="245" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">CIDFontType2</text>
  <rect x="514" y="228" width="112" height="26" rx="4" fill="#e1f0ff" stroke="#1f5fa6"/>
  <text x="570" y="245" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">FontDescriptor</text>
  <line x1="364" y1="241" x2="382" y2="241" stroke="#555" stroke-width="1.4" marker-end="url(#fe-arrow)"/>
  <line x1="494" y1="241" x2="512" y2="241" stroke="#555" stroke-width="1.4" marker-end="url(#fe-arrow)"/>
  <rect x="514" y="276" width="112" height="26" rx="4" fill="#d9f2dc" stroke="#2f7d3a"/>
  <text x="570" y="293" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">FontFile2</text>
  <line x1="570" y1="254" x2="570" y2="274" stroke="#555" stroke-width="1.4" marker-end="url(#fe-arrow)"/>
  <rect x="254" y="276" width="110" height="26" rx="4" fill="#d9f2dc" stroke="#2f7d3a"/>
  <text x="309" y="293" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">ToUnicode</text>
  <line x1="309" y1="254" x2="309" y2="274" stroke="#555" stroke-width="1.4" marker-end="url(#fe-arrow)"/>
  <text x="440" y="326" text-anchor="middle" font-size="12" fill="#333">/BaseFont /ABCDEF+DejaVuSans: the six letters mark a subset</text>
  <text x="440" y="346" text-anchor="middle" font-size="12" fill="#555">FontFile2 holds only the glyphs the document used</text>
  <line x1="640" y1="289" x2="676" y2="289" stroke="#555" stroke-width="1.6" marker-end="url(#fe-arrow)"/>
  <rect x="680" y="214" width="200" height="150" rx="6" fill="#d9f2dc" stroke="#2f7d3a" stroke-width="1.6"/>
  <text x="780" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#1e5a27">Embedded subset</text>
  <text x="780" y="262" text-anchor="middle" font-size="12" fill="#333">looks the same everywhere</text>
  <text x="780" y="280" text-anchor="middle" font-size="12" fill="#333">text can be searched</text>
  <text x="780" y="298" text-anchor="middle" font-size="12" fill="#333">and copied (ToUnicode)</text>
  <text x="780" y="316" text-anchor="middle" font-size="12" fill="#333">required by PDF/A</text>
  <text x="780" y="334" text-anchor="middle" font-size="12" fill="#333">check the font licence</text>
  <text x="780" y="352" text-anchor="middle" font-size="12" fill="#333">allows embedding</text>

  <!-- lane 3: predefined CJK -->
  <rect x="20" y="382" width="180" height="150" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="110" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Predefined CJK font</text>
  <text x="110" y="426" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">STSong-Light</text>
  <text x="110" y="444" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">UniGB-UCS2-H</text>
  <text x="110" y="466" text-anchor="middle" font-size="12" fill="#333">font-asian artifact</text>
  <text x="110" y="484" text-anchor="middle" font-size="12" fill="#333">provides the CMaps</text>
  <text x="110" y="502" text-anchor="middle" font-size="12" fill="#333">(character code to CID)</text>
  <line x1="200" y1="457" x2="236" y2="457" stroke="#555" stroke-width="1.6" marker-end="url(#fe-arrow)"/>
  <rect x="240" y="382" width="400" height="150" rx="6" fill="#ffffff" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="440" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Type0 font with a named CMap</text>
  <text x="440" y="430" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">/Subtype /Type0</text>
  <text x="440" y="450" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">/BaseFont /STSong-Light-UniGB-UCS2-H</text>
  <text x="440" y="470" text-anchor="middle" font-size="12" font-family="Courier New, monospace" fill="#333">/Encoding /UniGB-UCS2-H</text>
  <text x="440" y="492" text-anchor="middle" font-size="12" fill="#555">CIDFontType0, Adobe-GB1 ordering, no font file</text>
  <text x="440" y="512" text-anchor="middle" font-size="12" fill="#555">the viewer draws it with an installed CJK font</text>
  <line x1="640" y1="457" x2="676" y2="457" stroke="#555" stroke-width="1.6" marker-end="url(#fe-arrow)"/>
  <rect x="680" y="382" width="200" height="150" rx="6" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.6"/>
  <text x="780" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#4a1d75">Not embedded</text>
  <text x="780" y="430" text-anchor="middle" font-size="12" fill="#333">small file</text>
  <text x="780" y="448" text-anchor="middle" font-size="12" fill="#333">needs a CJK font on</text>
  <text x="780" y="466" text-anchor="middle" font-size="12" fill="#333">the reader's machine</text>
  <text x="780" y="484" text-anchor="middle" font-size="12" fill="#333">not allowed in PDF/A</text>
  <text x="780" y="502" text-anchor="middle" font-size="12" fill="#333">prefer an embedded font</text>
</svg>
