<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-interaction-picking-controls-ray-through-pixel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A ray through the clicked pixel</text>
<polygon points="60,200 110,170 110,230" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="60" y="252" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">camera</text>
<rect x="230" y="110" width="12" height="180" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="236" y="98" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">near plane / screen</text>
<circle cx="236" cy="215" r="5" fill="#B45309" stroke="#92400E" stroke-width="1.5"/>
<text x="250" y="238" font-size="11" font-weight="normal" fill="#92400E" text-anchor="start">pointer</text>
<line x1="60" y1="200" x2="600" y2="70" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="60" y1="200" x2="600" y2="330" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="60" y1="200" x2="520" y2="226" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-interaction-picking-controls-ray-through-pixel)"/>
<line x1="520" y1="226" x2="700" y2="236" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5,4"/>
