<rect x="475" y="190" width="28" height="100" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/>
<rect x="510" y="160" width="28" height="130" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/>
<rect x="545" y="180" width="28" height="110" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/>
<rect x="580" y="165" width="28" height="125" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.3"/>
<rect x="430" y="290" width="190" height="10" fill="#E5E7EB" stroke="#4B5563"/>
<circle cx="510" cy="226" r="6" fill="#B45309" stroke="#92400E" stroke-width="1.5"/>
<text x="510" y="112" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">hit: distance, point,</text>
<text x="510" y="126" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">face, uv, object</text>
<line x1="510" y1="132" x2="510" y2="218" stroke="#B45309" stroke-width="1" stroke-dasharray="5,4"/>
<text x="380" y="330" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">raycaster.setFromCamera( pointer, camera ) builds the ray;</text>
<text x="380" y="348" font-size="12" font-weight="normal" fill="#1F2937" text-anchor="middle">intersectObjects( scene.children, true ) returns hits sorted nearest first.</text>
<text x="380" y="376" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Unprojecting NDC (x, y) at the near and far planes gives the two points that define the ray.</text>
