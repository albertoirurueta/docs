<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From a PNG to GPU memory: what the texture importer decides</text>
<rect x="20.0" y="46" width="163.5" height="74" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="101.75" y="72.2" text-anchor="middle" font-size="12" fill="#374151">Source file</text>
<text x="101.75" y="87.2" text-anchor="middle" font-size="12" fill="#374151">bookshelf-cover.png</text>
<text x="101.75" y="102.2" text-anchor="middle" font-size="12" fill="#374151">256 x 256, 8-bit sRGB</text>
<rect x="205.5" y="46" width="163.5" height="74" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="287.25" y="72.2" text-anchor="middle" font-size="12" fill="#3730A3">Importer settings</text>
<text x="287.25" y="87.2" text-anchor="middle" font-size="12" fill="#3730A3">Texture Type, sRGB,</text>
<text x="287.25" y="102.2" text-anchor="middle" font-size="12" fill="#3730A3">mipmaps, wrap, filter, aniso</text>
<rect x="391.0" y="46" width="163.5" height="74" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="472.75" y="72.2" text-anchor="middle" font-size="12" fill="#92400E">Platform override</text>
<text x="472.75" y="87.2" text-anchor="middle" font-size="12" fill="#92400E">Max Size, Format,</text>
<text x="472.75" y="102.2" text-anchor="middle" font-size="12" fill="#92400E">compression quality</text>
<rect x="576.5" y="46" width="163.5" height="74" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="658.25" y="72.2" text-anchor="middle" font-size="12" fill="#1F2937">GPU texture</text>
<text x="658.25" y="87.2" text-anchor="middle" font-size="12" fill="#1F2937">compressed blocks</text>
<text x="658.25" y="102.2" text-anchor="middle" font-size="12" fill="#1F2937">+ mip chain (about +33 %)</text>
<line x1="183.5" y1="83" x2="205.5" y2="83" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="369.0" y1="83" x2="391.0" y2="83" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="554.5" y1="83" x2="576.5" y2="83" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="380" y="148" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Typical GPU format by platform (RGBA, 1024 x 1024 texture, without mipmaps)</text>
<rect x="20.0" y="162" width="130" height="74" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.0" y="188.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Desktop</text>
<text x="85.0" y="203.2" text-anchor="middle" font-size="12" fill="#3730A3">BC7</text>
<text x="85.0" y="218.2" text-anchor="middle" font-size="12" fill="#3730A3">1 MB</text>
<rect x="167.5" y="162" width="130" height="74" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="232.5" y="188.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">iOS, Android</text>
<text x="232.5" y="203.2" text-anchor="middle" font-size="12" fill="#3730A3">ASTC 6x6</text>
<text x="232.5" y="218.2" text-anchor="middle" font-size="12" fill="#3730A3">0.45 MB</text>
<rect x="315.0" y="162" width="130" height="74" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="188.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Older Android</text>
<text x="380.0" y="203.2" text-anchor="middle" font-size="12" fill="#3730A3">ETC2</text>
<text x="380.0" y="218.2" text-anchor="middle" font-size="12" fill="#3730A3">1 MB</text>
<rect x="462.5" y="162" width="130" height="74" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="527.5" y="188.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Uncompressed</text>
<text x="527.5" y="203.2" text-anchor="middle" font-size="12" fill="#92400E">RGBA 32 bit</text>
<text x="527.5" y="218.2" text-anchor="middle" font-size="12" fill="#92400E">4 MB</text>
<rect x="610.0" y="162" width="130" height="74" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="675.0" y="188.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">HDR (sky)</text>
<text x="675.0" y="203.2" text-anchor="middle" font-size="12" fill="#374151">BC6H</text>
<text x="675.0" y="218.2" text-anchor="middle" font-size="12" fill="#374151">1 MB</text>
<rect x="20" y="252" width="350" height="150" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="195.0" y="288.9" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Importer checklist</text>
<text x="195.0" y="302.9" text-anchor="middle" font-size="11" fill="#374151">Colour textures: sRGB on.</text>
<text x="195.0" y="316.9" text-anchor="middle" font-size="11" fill="#374151">Normal maps: Normal map type.</text>
<text x="195.0" y="330.9" text-anchor="middle" font-size="11" fill="#374151">Masks and packed data: sRGB off.</text>
<text x="195.0" y="344.9" text-anchor="middle" font-size="11" fill="#374151">Generate Mipmap on for 3D objects.</text>
<text x="195.0" y="358.9" text-anchor="middle" font-size="11" fill="#374151">Aniso Level 2 to 8 for floors and shelves.</text>
<text x="195.0" y="372.9" text-anchor="middle" font-size="11" fill="#374151">Max Size no larger than needed.</text>
<rect x="390" y="252" width="350" height="150" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="288.9" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Memory rules of thumb</text>
<text x="565.0" y="302.9" text-anchor="middle" font-size="11" fill="#92400E">Mipmaps add about one third.</text>
<text x="565.0" y="316.9" text-anchor="middle" font-size="11" fill="#92400E">Read/Write doubles memory: keep off.</text>
<text x="565.0" y="330.9" text-anchor="middle" font-size="11" fill="#92400E">Crunch shrinks the file on disk, not</text>
<text x="565.0" y="344.9" text-anchor="middle" font-size="11" fill="#92400E">the GPU memory; compression takes long.</text>
<text x="565.0" y="358.9" text-anchor="middle" font-size="11" fill="#92400E">Use platform overrides, not one format.</text>
<text x="565.0" y="372.9" text-anchor="middle" font-size="11" fill="#92400E">PVRTC is gone (removed in Unity 6.4).</text>
</svg>
