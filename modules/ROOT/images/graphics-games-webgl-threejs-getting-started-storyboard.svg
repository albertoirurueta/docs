<svg viewBox="0 0 760 380" width="760" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-webgl-threejs-getting-started-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From empty page to a spinning book in five steps</text>
<rect x="14" y="50" width="136" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="30" cy="66" r="11" fill="#4F46E5"/><text x="30" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="96" y="70" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Install and open</text>
<rect x="32" y="86" width="100" height="62" rx="4" fill="#E5E7EB" stroke="#4B5563"/>
<text x="82" y="168" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">npm create vite,</text>
<text x="82" y="182" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">npm i three@0.187</text>
<text x="82" y="196" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="82" y="222" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">empty page</text>
<line x1="150" y1="125" x2="162" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-storyboard)"/>
<rect x="162" y="50" width="136" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="178" cy="66" r="11" fill="#4F46E5"/><text x="178" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="240" y="70" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">Renderer</text>
<rect x="180" y="86" width="100" height="62" rx="4" fill="#E5E7EB" stroke="#4B5563"/>
<text x="230" y="168" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">new WebGLRenderer</text>
<text x="230" y="182" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">append domElement</text>
<text x="230" y="196" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="230" y="222" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">grey canvas</text>
<line x1="298" y1="125" x2="310" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-storyboard)"/>
<rect x="310" y="50" width="136" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="66" r="11" fill="#4F46E5"/><text x="326" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="392" y="70" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Scene and camera</text>
<rect x="328" y="86" width="100" height="62" rx="4" fill="#E5E7EB" stroke="#4B5563"/>
<text x="378" y="168" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Scene, Perspective-</text>
<text x="378" y="182" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Camera at z = 3</text>
<text x="378" y="196" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="378" y="222" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">still empty</text>
<line x1="446" y1="125" x2="458" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-storyboard)"/>
<rect x="458" y="50" width="136" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="474" cy="66" r="11" fill="#4F46E5"/><text x="474" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="536" y="70" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle">A box mesh</text>
<rect x="476" y="86" width="100" height="62" rx="4" fill="#E5E7EB" stroke="#4B5563"/>
<rect x="506" y="98" width="40" height="38" rx="3" fill="#4F46E5" stroke="#3730A3"/>
<text x="526" y="168" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Box + Standard</text>
<text x="526" y="182" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">material + light</text>
<text x="526" y="196" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="526" y="222" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">lit dark box</text>
<line x1="594" y1="125" x2="606" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-storyboard)"/>
<rect x="606" y="50" width="136" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="622" cy="66" r="11" fill="#B45309"/><text x="622" y="70" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="688" y="70" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">Animation loop</text>
<rect x="624" y="86" width="100" height="62" rx="4" fill="#E5E7EB" stroke="#4B5563"/>
<rect x="654" y="98" width="40" height="38" rx="3" fill="#4F46E5" stroke="#3730A3"/>
<path d="M636 140 A30 12 0 0 0 712 140" fill="none" stroke="#B45309" stroke-width="1.5" marker-end="url(#ah-webgl-threejs-getting-started-storyboard)"/>
<text x="674" y="168" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">setAnimationLoop</text>
<text x="674" y="182" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">rotate + resize</text>
<text x="674" y="196" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle"></text>
<text x="674" y="222" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">book spins</text>
<rect x="14" y="250" width="732" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="289.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Each panel adds one object; the page stays runnable at every step.</text>
<text x="380.0" y="304.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Steps 1-2: tooling and renderer. Steps 3-4: the object model. Step 5: the loop that makes it move.</text>
<text x="380.0" y="319.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">In the Bookshelf track the box is replaced by the shelf from bookshelf.glb in the loading page.</text>
</svg>
