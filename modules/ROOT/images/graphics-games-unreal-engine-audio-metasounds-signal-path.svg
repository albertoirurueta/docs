<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The path of a sound through the Audio Mixer</text>
<rect x="14" y="60" width="140" height="190" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="84" y="84" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Sources</text>
<text x="84" y="112" text-anchor="middle" font-size="11" fill="#374151">Sound Wave</text>
<text x="84" y="132" text-anchor="middle" font-size="11" fill="#374151">Sound Cue (legacy)</text>
<text x="84" y="152" text-anchor="middle" font-size="11" fill="#374151">MetaSound Source</text>
<text x="84" y="172" text-anchor="middle" font-size="11" fill="#374151">Ambient Sound actor</text>
<text x="84" y="192" text-anchor="middle" font-size="11" fill="#374151">Audio Component</text>
<line x1="155" y1="155" x2="174" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="162" y="60" width="140" height="190" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="232" y="84" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Per-sound rules</text>
<text x="232" y="112" text-anchor="middle" font-size="11" fill="#374151">Attenuation: distance,</text>
<text x="232" y="132" text-anchor="middle" font-size="11" fill="#374151">occlusion, air</text>
<text x="232" y="152" text-anchor="middle" font-size="11" fill="#374151">absorption, reverb</text>
<text x="232" y="172" text-anchor="middle" font-size="11" fill="#374151">Concurrency: Max</text>
<text x="232" y="192" text-anchor="middle" font-size="11" fill="#374151">Count, Resolution Rule</text>
<line x1="303" y1="155" x2="322" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="310" y="60" width="140" height="190" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="84" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Grouping</text>
<text x="380" y="112" text-anchor="middle" font-size="11" fill="#374151">Sound Class volume</text>
<text x="380" y="132" text-anchor="middle" font-size="11" fill="#374151">groups (legacy)</text>
<text x="380" y="152" text-anchor="middle" font-size="11" fill="#374151">Audio Modulation</text>
<text x="380" y="172" text-anchor="middle" font-size="11" fill="#374151">parameter buses</text>
<text x="380" y="192" text-anchor="middle" font-size="11" fill="#374151">(replace Sound Mix)</text>
<line x1="451" y1="155" x2="470" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="458" y="60" width="140" height="190" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="528" y="84" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Submixes</text>
<text x="528" y="112" text-anchor="middle" font-size="11" fill="#374151">Effect chains</text>
<text x="528" y="132" text-anchor="middle" font-size="11" fill="#374151">Reverb and EQ</text>
<text x="528" y="152" text-anchor="middle" font-size="11" fill="#374151">Submix sends</text>
<text x="528" y="172" text-anchor="middle" font-size="11" fill="#374151">Master submix</text>
<text x="528" y="192" text-anchor="middle" font-size="11" fill="#374151">feeds the output</text>
<line x1="599" y1="155" x2="618" y2="155" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="606" y="60" width="140" height="190" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="676" y="84" text-anchor="middle" font-size="13" fill="#047857" font-weight="bold">Output</text>
<text x="676" y="112" text-anchor="middle" font-size="11" fill="#374151">Audio Mixer renders</text>
<text x="676" y="132" text-anchor="middle" font-size="11" fill="#374151">the final mix</text>
<text x="676" y="152" text-anchor="middle" font-size="11" fill="#374151">Windows: WASAPI by</text>
<text x="676" y="172" text-anchor="middle" font-size="11" fill="#374151">default in 5.8,</text>
<text x="676" y="192" text-anchor="middle" font-size="11" fill="#374151">XAudio2 is opt-in</text>
<rect x="14" y="276" width="732" height="52" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.2"/>
<text x="380" y="298" text-anchor="middle" font-size="12" fill="#374151">Audio Insights watches every stage in a live session: sounds, buses, submixes, signal flow and meters.</text>
<text x="380" y="316" text-anchor="middle" font-size="12" fill="#374151">MetaSounds render asynchronously to the Audio Mixer, like asynchronous sound decoding.</text>
</svg>
