<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Rc strong and weak counts in a parent/child tree</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">children are owned with Rc (strong), the back-pointer to the parent is a Weak, so the structure has no strong cycle</text>
  <defs>
    <marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="w" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker>
  </defs>
  <!-- variable on stack -->
  <rect x="30" y="110" width="110" height="40" rx="4" fill="#f4f4f4" stroke="#444444"/>
  <text x="85" y="135" font-size="13" text-anchor="middle" fill="#222222">let shelf</text>
  <!-- parent allocation -->
  <rect x="220" y="80" width="230" height="110" rx="6" fill="#e8f0f8" stroke="#1c4b73" stroke-width="1.5"/>
  <text x="335" y="102" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">RcBox: Shelf "A1"</text>
  <text x="235" y="126" font-size="12" fill="#222222">strong = 1   weak = 2</text>
  <text x="235" y="148" font-size="12" fill="#222222">children: RefCell&lt;Vec&lt;Rc&lt;Node&gt;&gt;&gt;</text>
  <text x="235" y="170" font-size="12" fill="#222222">parent: Weak (none)</text>
  <!-- children -->
  <rect x="560" y="70" width="240" height="96" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="680" y="92" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">RcBox: Book "Dune"</text>
  <text x="575" y="116" font-size="12" fill="#222222">strong = 1   weak = 0</text>
  <text x="575" y="140" font-size="12" fill="#222222">parent: RefCell&lt;Weak&lt;Node&gt;&gt;</text>
  <rect x="560" y="226" width="240" height="96" rx="6" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="680" y="248" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">RcBox: Book "Emma"</text>
  <text x="575" y="272" font-size="12" fill="#222222">strong = 1   weak = 0</text>
  <text x="575" y="296" font-size="12" fill="#222222">parent: RefCell&lt;Weak&lt;Node&gt;&gt;</text>
  <!-- strong arrows -->
  <line x1="140" y1="130" x2="216" y2="130" stroke="#1c4b73" stroke-width="2" marker-end="url(#s)"/>
  <path d="M450,110 C500,110 510,100 556,100" fill="none" stroke="#1c4b73" stroke-width="2" marker-end="url(#s)"/>
  <path d="M450,150 C510,150 500,262 556,262" fill="none" stroke="#1c4b73" stroke-width="2" marker-end="url(#s)"/>
  <!-- weak arrows -->
  <path d="M560,150 C520,190 470,200 400,192" fill="none" stroke="#a35a00" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#w)"/>
  <path d="M560,306 C470,320 380,280 360,194" fill="none" stroke="#a35a00" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#w)"/>
  <!-- legend -->
  <g font-size="12" fill="#333333">
    <line x1="40" y1="360" x2="90" y2="360" stroke="#1c4b73" stroke-width="2" marker-end="url(#s)"/>
    <text x="100" y="364">Rc: strong reference, keeps the value alive</text>
    <line x1="420" y1="360" x2="470" y2="360" stroke="#a35a00" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#w)"/>
    <text x="480" y="364">Weak: does not keep it alive; upgrade() returns Option&lt;Rc&gt;</text>
  </g>
  <text x="470" y="390" font-size="12" fill="#666666" text-anchor="middle">dropping `shelf` makes the parent's strong count 0: it is freed, its children follow, and the Weak back-pointers simply fail to upgrade</text>
</svg>
