<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 108" width="1080" height="108" role="img" aria-labelledby="sap-finance-guide-post-balanced-journal-entries-04-balanced-posted-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-finance-guide-post-balanced-journal-entries-04-balanced-posted-title">Terminal with the curl command that posts the balanced entry from http/balanced-entry.json to the entity JournalEntries and the answer HTTP 201; callout 7 marks the command and the status</title>
<g><rect x="0" y="0" width="1080" height="108" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="76" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ curl -s -o /dev/null -w &quot;HTTP %{http_code}\n&quot; --json @http/balanced-entry.json http://localhost:4004/odata/v4/ledger/JournalEntries</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">HTTP 201</text>
<rect x="5" y="46" width="1042" height="44" rx="6" fill="none" stroke="#ff6ec4" stroke-width="2.5" stroke-dasharray="6 3"/>
<g><circle cx="1047" cy="46" r="12" fill="#ff6ec4" stroke="#1e1b4b" stroke-width="1.5"/><text x="1047" y="51" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="14" font-weight="700" fill="#1e1b4b" text-anchor="middle">7</text></g></g>
</svg>
