<svg viewBox="0 0 900 440" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="sa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Stamping mode rewrites the file, append mode keeps the original bytes</text>

  <!-- Left panel: stamping mode -->
  <rect x="20" y="44" width="420" height="376" rx="8" fill="none" stroke="#1f5fa6" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="230" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5fa6">Stamping mode (default)</text>
  <text x="230" y="86" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">new PdfDocument(reader, writer)</text>

  <rect x="40" y="104" width="160" height="150" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="120" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Source file</text>
  <rect x="52" y="134" width="136" height="24" rx="3" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#333">objects 1 to 40</text>
  <rect x="52" y="164" width="136" height="24" rx="3" fill="#ffffff" stroke="#b36b00"/>
  <text x="120" y="180" text-anchor="middle" font-size="11" fill="#333">xref + trailer</text>
  <text x="120" y="212" text-anchor="middle" font-size="11" fill="#1f5fa6">read-only input</text>
  <text x="120" y="228" text-anchor="middle" font-size="11" fill="#1f5fa6">never modified</text>

  <line x1="200" y1="179" x2="280" y2="179" stroke="#555" stroke-width="1.5" marker-end="url(#sa-arrow)"/>
  <text x="240" y="170" text-anchor="middle" font-size="11" fill="#1a1a1a">edit, write</text>

  <rect x="280" y="104" width="140" height="150" rx="6" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.5"/>
  <text x="350" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#2b7a2b">New file</text>
  <rect x="292" y="134" width="116" height="24" rx="3" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="350" y="150" text-anchor="middle" font-size="11" fill="#333">objects renumbered</text>
  <rect x="292" y="164" width="116" height="24" rx="3" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="350" y="180" text-anchor="middle" font-size="11" fill="#333">new content added</text>
  <rect x="292" y="194" width="116" height="24" rx="3" fill="#ffffff" stroke="#b36b00"/>
  <text x="350" y="210" text-anchor="middle" font-size="11" fill="#333">one fresh xref</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#2b7a2b">one revision, compact</text>

  <text x="40" y="288" font-size="12" font-weight="700" fill="#1a1a1a">Effects</text>
  <text x="40" y="308" font-size="11" fill="#333">Unreferenced objects are dropped, the file shrinks</text>
  <text x="40" y="326" font-size="11" fill="#333">Object numbers and byte offsets change</text>
  <text x="40" y="344" font-size="11" fill="#333">Any existing digital signature is invalidated</text>
  <text x="40" y="362" font-size="11" fill="#333">Pages can be removed, moved and merged freely</text>
  <text x="40" y="380" font-size="11" fill="#333">Right choice for unsigned documents</text>
  <text x="40" y="398" font-size="11" fill="#333">Output goes to a different stream than the input</text>

  <!-- Right panel: append mode -->
  <rect x="460" y="44" width="420" height="376" rx="8" fill="none" stroke="#7b3fb5" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="670" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#4a1d75">Append mode</text>
  <text x="670" y="86" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">StampingProperties().useAppendMode()</text>

  <rect x="480" y="104" width="160" height="150" rx="6" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.5"/>
  <text x="560" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa6">Output, revision 1</text>
  <rect x="492" y="134" width="136" height="24" rx="3" fill="#ffffff" stroke="#1f5fa6"/>
  <text x="560" y="150" text-anchor="middle" font-size="11" fill="#333">objects 1 to 40</text>
  <rect x="492" y="164" width="136" height="24" rx="3" fill="#ffffff" stroke="#b36b00"/>
  <text x="560" y="180" text-anchor="middle" font-size="11" fill="#333">xref + trailer</text>
  <text x="560" y="212" text-anchor="middle" font-size="11" fill="#1f5fa6">copied byte for byte</text>
  <text x="560" y="228" text-anchor="middle" font-size="11" fill="#1f5fa6">(identical prefix)</text>

  <rect x="640" y="104" width="220" height="150" rx="6" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.5"/>
  <text x="750" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#2b7a2b">Revision 2, appended</text>
  <rect x="652" y="134" width="196" height="24" rx="3" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="750" y="150" text-anchor="middle" font-size="11" fill="#333">only modified objects</text>
  <rect x="652" y="164" width="196" height="24" rx="3" fill="#ffffff" stroke="#b36b00"/>
  <text x="750" y="180" text-anchor="middle" font-size="11" fill="#333">xref section for those objects</text>
  <rect x="652" y="194" width="196" height="24" rx="3" fill="#ffffff" stroke="#2b7a2b"/>
  <text x="750" y="210" text-anchor="middle" font-size="11" font-family="Courier New, monospace" fill="#333">trailer /Prev, startxref</text>
  <text x="750" y="240" text-anchor="middle" font-size="11" fill="#2b7a2b">a reader follows /Prev back</text>

  <text x="480" y="288" font-size="12" font-weight="700" fill="#1a1a1a">Effects</text>
  <text x="480" y="308" font-size="11" fill="#333">The signed ByteRange of earlier revisions is intact</text>
  <text x="480" y="326" font-size="11" fill="#333">Earlier signatures stay valid, if the change is allowed</text>
  <text x="480" y="344" font-size="11" fill="#333">The file grows by the changed objects each time</text>
  <text x="480" y="362" font-size="11" fill="#333">Changed objects must be marked with setModified()</text>
  <text x="480" y="380" font-size="11" fill="#333">Right choice for signed documents, forms, DSS</text>
  <text x="480" y="398" font-size="11" fill="#333">Same layout as the incremental update of the file format</text>

</svg>
