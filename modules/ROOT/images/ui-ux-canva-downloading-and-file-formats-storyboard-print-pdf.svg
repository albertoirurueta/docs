<text x="386" y="186" font-size="10" fill="#1F2937" text-anchor="middle">Colour profile: CMYK</text>
<text x="386" y="222" font-size="11" fill="#92400E" text-anchor="middle" font-weight="bold">Paid plans: CMYK</text>
