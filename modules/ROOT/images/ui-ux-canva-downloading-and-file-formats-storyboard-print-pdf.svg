<rect x="666" y="106" width="56" height="22" rx="11" fill="#B45309" stroke="#B45309" stroke-width="1.5"/>
<text x="694" y="121" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Download</text>
<rect x="650" y="148" width="88" height="100" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="658" y="156" width="72" height="70" rx="2" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="694" y="238" font-size="11" fill="#92400E" text-anchor="middle" font-weight="bold">flyer.pdf</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
