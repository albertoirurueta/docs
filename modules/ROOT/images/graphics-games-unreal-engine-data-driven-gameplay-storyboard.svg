<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Storyboard: import DT_Books from a spreadsheet</text>
<rect x="20" y="55" width="130" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="34" cy="69" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="34" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="85" y="100" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Write the CSV</text>
<rect x="40" y="118" width="90" height="62" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<line x1="48" y1="132" x2="122" y2="132" stroke="#E5E7EB" stroke-width="1.5"/>
<line x1="48" y1="148" x2="122" y2="148" stroke="#E5E7EB" stroke-width="1.5"/>
<line x1="48" y1="164" x2="122" y2="164" stroke="#E5E7EB" stroke-width="1.5"/>
<line x1="75" y1="120" x2="75" y2="178" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="85" y="205" text-anchor="middle" font-size="11" fill="#374151">Name column first,</text>
<text x="85" y="218" text-anchor="middle" font-size="11" fill="#374151">one column per</text>
<text x="85" y="231" text-anchor="middle" font-size="11" fill="#374151">FBookRow field</text>
<line x1="150" y1="150" x2="166" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="166" y="55" width="130" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="180" cy="69" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="180" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="231" y="100" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Import it</text>
<rect x="186" y="118" width="90" height="62" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="201" y="128" width="24" height="30" rx="2" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
<line x1="228" y1="143" x2="258" y2="143" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a3)"/>
<text x="231" y="205" text-anchor="middle" font-size="11" fill="#374151">Drag Books.csv into</text>
<text x="231" y="218" text-anchor="middle" font-size="11" fill="#374151">the Content Browser,</text>
<text x="231" y="231" text-anchor="middle" font-size="11" fill="#374151">choose DataTable</text>
<line x1="296" y1="150" x2="312" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="312" y="55" width="130" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="326" cy="69" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="326" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="377" y="100" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Pick the row struct</text>
<rect x="332" y="118" width="90" height="62" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="342" y="134" width="70" height="18" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1"/>
<rect x="342" y="158" width="30" height="14" rx="3" fill="#4F46E5" stroke="#4F46E5" stroke-width="1"/>
<text x="377" y="205" text-anchor="middle" font-size="11" fill="#374151">Row type:</text>
<text x="377" y="218" text-anchor="middle" font-size="11" fill="#374151">BookRow, then</text>
<text x="377" y="231" text-anchor="middle" font-size="11" fill="#374151">Apply</text>
<line x1="442" y1="150" x2="458" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="458" y="55" width="130" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="472" cy="69" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="472" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="523" y="100" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Open DT_Books</text>
<rect x="478" y="118" width="90" height="62" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<rect x="484" y="126" width="78" height="13" rx="2" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="484" y="143" width="78" height="13" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="484" y="160" width="78" height="13" rx="2" fill="#EEF2FF" stroke="#E5E7EB" stroke-width="1"/>
<text x="523" y="205" text-anchor="middle" font-size="11" fill="#374151">Rows listed by</text>
<text x="523" y="218" text-anchor="middle" font-size="11" fill="#374151">Name, edit cells</text>
<text x="523" y="231" text-anchor="middle" font-size="11" fill="#374151">or reimport the CSV</text>
<line x1="588" y1="150" x2="604" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="604" y="55" width="130" height="190" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="618" cy="69" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="618" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="669" y="100" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Look up a row</text>
<rect x="624" y="118" width="90" height="62" rx="4" fill="#F9FAFB" stroke="#4B5563" stroke-width="1"/>
<text x="669" y="144" text-anchor="middle" font-size="11" fill="#3730A3">FindRow</text>
<line x1="644" y1="152" x2="694" y2="152" stroke="#4F46E5" stroke-width="1.5"/>
<text x="669" y="205" text-anchor="middle" font-size="11" fill="#374151">FindRow or a</text>
<text x="669" y="218" text-anchor="middle" font-size="11" fill="#374151">DataTableRowHandle</text>
<text x="669" y="231" text-anchor="middle" font-size="11" fill="#374151">in BP_Book</text>
<text x="380" y="285" text-anchor="middle" font-size="12" fill="#374151">Each panel is one step of the numbered procedure on this page.</text>
</svg>
