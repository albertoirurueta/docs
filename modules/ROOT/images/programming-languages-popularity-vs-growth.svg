<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="popularity-vs-growth-t popularity-vs-growth-d">
<title id="popularity-vs-growth-t">Popularity vs 10-year growth</title>
<desc id="popularity-vs-growth-d">Current TIOBE rating (horizontal) against the change in TIOBE rating between June 2016 and October 2026 (vertical), in percentage points, one point per language, coloured by editorial group; 26 languages have both values and the others (no TIOBE history in June 2016) are left out. Labels that would overlap are omitted: hover a point for its name, or see the zoomed chart for the languages below 4%. TIOBE Index monthly series, retrieved 2026-10-26.</desc>
