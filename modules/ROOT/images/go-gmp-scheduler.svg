<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Go scheduler: goroutines (G) run on threads (M) that hold a processor (P)</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">GOMAXPROCS is the number of Ps; a thread needs a P to run Go code; idle Ps steal goroutines from busy ones</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c4b73"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b34700"/></marker>
  </defs>

  <!-- global queue -->
  <rect x="40" y="70" width="860" height="56" rx="6" fill="#f4f4f4" stroke="#888888"/>
  <text x="56" y="92" font-size="13" font-weight="bold" fill="#333333">Global run queue</text>
  <text x="56" y="112" font-size="11" fill="#555555">new and woken goroutines that did not fit a local queue; every P checks it now and then</text>
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="590" y="82" width="46" height="32" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="613" y="103">G11</text>
    <rect x="644" y="82" width="46" height="32" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="667" y="103">G12</text>
    <rect x="698" y="82" width="46" height="32" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="721" y="103">G13</text>
  </g>

  <!-- P boxes -->
  <g font-size="13" fill="#222222">
    <rect x="40" y="160" width="270" height="190" rx="8" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="56" y="182" font-weight="bold" fill="#2e7d32">P0 (processor)</text>
    <text x="56" y="206" font-size="12">local run queue (up to 256 Gs)</text>
    <rect x="56" y="214" width="46" height="30" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="68" y="234" font-size="12">G4</text>
    <rect x="108" y="214" width="46" height="30" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="120" y="234" font-size="12">G5</text>
    <rect x="160" y="214" width="46" height="30" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="172" y="234" font-size="12">G6</text>
    <text x="56" y="272" font-size="12">running G</text>
    <rect x="130" y="256" width="60" height="30" rx="4" fill="#fff3d6" stroke="#b34700" stroke-width="1.6"/><text x="147" y="276" font-size="12" font-weight="bold">G1</text>
    <text x="56" y="316" font-size="11" fill="#555555">runnext: a G this P just readied</text>
    <text x="56" y="334" font-size="11" fill="#555555">runs next, ahead of the queue</text>

    <rect x="335" y="160" width="270" height="190" rx="8" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="351" y="182" font-weight="bold" fill="#2e7d32">P1 (processor)</text>
    <text x="351" y="206" font-size="12">local run queue</text>
    <rect x="351" y="214" width="46" height="30" rx="4" fill="#e8f0f8" stroke="#1c4b73"/><text x="363" y="234" font-size="12">G7</text>
    <text x="351" y="272" font-size="12">running G</text>
    <rect x="425" y="256" width="60" height="30" rx="4" fill="#fff3d6" stroke="#b34700" stroke-width="1.6"/><text x="442" y="276" font-size="12" font-weight="bold">G2</text>
    <text x="351" y="316" font-size="11" fill="#555555">a P with an empty queue steals half</text>
    <text x="351" y="334" font-size="11" fill="#555555">of another P's queue</text>

    <rect x="630" y="160" width="270" height="190" rx="8" fill="#e9f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="646" y="182" font-weight="bold" fill="#2e7d32">P2 (processor)</text>
    <text x="646" y="206" font-size="12">local run queue (empty)</text>
    <text x="646" y="272" font-size="12">running G</text>
    <rect x="720" y="256" width="60" height="30" rx="4" fill="#fff3d6" stroke="#b34700" stroke-width="1.6"/><text x="737" y="276" font-size="12" font-weight="bold">G3</text>
    <text x="646" y="316" font-size="11" fill="#555555">idle Ps look in the global queue,</text>
    <text x="646" y="334" font-size="11" fill="#555555">the network poller, then other Ps</text>
  </g>

  <!-- work stealing arrow P2 -> P0 queue -->
  <path d="M 680 352 C 680 392 250 392 220 250" fill="none" stroke="#b34700" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#b)"/>
  <text x="320" y="383" font-size="12" fill="#b34700" text-anchor="middle">work stealing</text>

  <!-- global queue arrow -->
  <line x1="590" y1="98" x2="440" y2="98" stroke="#1c4b73" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="440" y1="98" x2="175" y2="98" stroke="#1c4b73" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Ms -->
  <g font-size="12" fill="#222222" text-anchor="middle">
    <rect x="95" y="436" width="160" height="38" rx="6" fill="#f3e8f8" stroke="#6a1b9a"/><text x="175" y="460">M0 (OS thread)</text>
    <rect x="390" y="436" width="160" height="38" rx="6" fill="#f3e8f8" stroke="#6a1b9a"/><text x="470" y="460">M1 (OS thread)</text>
    <rect x="685" y="436" width="160" height="38" rx="6" fill="#f3e8f8" stroke="#6a1b9a"/><text x="765" y="460">M2 (OS thread)</text>
  </g>
  <line x1="175" y1="436" x2="175" y2="352" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470" y1="436" x2="470" y2="352" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="765" y1="436" x2="765" y2="352" stroke="#6a1b9a" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- legend -->
  <g font-size="12" fill="#333333">
    <rect x="40" y="498" width="16" height="16" rx="3" fill="#e8f0f8" stroke="#1c4b73"/><text x="62" y="511">G: runnable goroutine</text>
    <rect x="215" y="498" width="16" height="16" rx="3" fill="#fff3d6" stroke="#b34700"/><text x="237" y="511">G: running</text>
    <rect x="335" y="498" width="16" height="16" rx="3" fill="#e9f5e9" stroke="#2e7d32"/><text x="357" y="511">P: GOMAXPROCS of them</text>
    <rect x="520" y="498" width="16" height="16" rx="3" fill="#f3e8f8" stroke="#6a1b9a"/><text x="542" y="511">M: OS thread (extra ones while blocked in system calls)</text>
  </g>
  <text x="40" y="540" font-size="11" fill="#666666">Goroutines blocked on a channel, mutex, timer or network read are not in any queue; they are made runnable again by whoever unblocks them.</text>
</svg>
