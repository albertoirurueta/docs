<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="500" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Authorization server example: components and trust boundaries</text>

  <defs>
    <marker id="authz-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
    <marker id="authz-arrow-ext" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a5a00"/>
    </marker>
    <marker id="authz-arrow-db" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f5424"/>
    </marker>
  </defs>

  <!-- trust boundaries -->
  <rect x="10" y="215" width="150" height="170" rx="8" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="85" y="234" font-size="11" fill="#666666" text-anchor="middle">Untrusted: browser</text>

  <rect x="200" y="55" width="560" height="420" rx="8" fill="none" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="212" y="73" font-size="11" fill="#1c4b73">Trusted: your deployment</text>

  <rect x="775" y="55" width="210" height="300" rx="8" fill="none" stroke="#8a5a00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="880" y="73" font-size="11" fill="#8a5a00" text-anchor="middle">External services</text>

  <!-- browser -->
  <rect x="25" y="265" width="120" height="70" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.6"/>
  <text x="85" y="294" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Browser (SPA)</text>
  <text x="85" y="311" font-size="9.5" fill="#666666" text-anchor="middle">holds no token</text>

  <!-- auth server -->
  <rect x="380" y="80" width="180" height="90" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="470" y="106" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">auth-server :9000</text>
  <text x="470" y="123" font-size="9.5" fill="#444444" text-anchor="middle">Spring Authorization Server</text>
  <text x="470" y="137" font-size="9.5" fill="#444444" text-anchor="middle">login, consent, tokens, JWKS</text>
  <text x="470" y="151" font-size="9.5" fill="#444444" text-anchor="middle">/api/** account and admin API</text>

  <!-- bff -->
  <rect x="250" y="260" width="130" height="80" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="315" y="289" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">bff :8080</text>
  <text x="315" y="306" font-size="9.5" fill="#444444" text-anchor="middle">oauth2Login client</text>
  <text x="315" y="320" font-size="9.5" fill="#444444" text-anchor="middle">Spring Session JDBC</text>

  <!-- resource server -->
  <rect x="580" y="290" width="140" height="70" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="650" y="317" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">resource-server :8081</text>
  <text x="650" y="334" font-size="9.5" fill="#444444" text-anchor="middle">JWT validation</text>
  <text x="650" y="348" font-size="9.5" fill="#444444" text-anchor="middle">documents API</text>

  <!-- service client -->
  <rect x="380" y="400" width="180" height="50" rx="6" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.8"/>
  <text x="470" y="422" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">service-client</text>
  <text x="470" y="438" font-size="9.5" fill="#444444" text-anchor="middle">no HTTP port: runs, calls, exits</text>

  <!-- database -->
  <rect x="215" y="400" width="150" height="50" rx="6" fill="#eef7ea" stroke="#2f5424" stroke-width="1.8"/>
  <text x="290" y="422" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">PostgreSQL 18</text>
  <text x="290" y="438" font-size="9.5" fill="#444444" text-anchor="middle">authserver and bff databases</text>

  <!-- external services -->
  <rect x="790" y="85" width="180" height="55" rx="6" fill="#fff4e0" stroke="#8a5a00" stroke-width="1.6"/>
  <text x="880" y="108" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">External IdPs</text>
  <text x="880" y="125" font-size="9.5" fill="#444444" text-anchor="middle">Google, Microsoft, Apple, GitHub</text>

  <rect x="790" y="175" width="180" height="55" rx="6" fill="#fff4e0" stroke="#8a5a00" stroke-width="1.6"/>
  <text x="880" y="198" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">Mail</text>
  <text x="880" y="215" font-size="9.5" fill="#444444" text-anchor="middle">SMTP relay, Mailpit in development</text>

  <rect x="790" y="270" width="180" height="55" rx="6" fill="#fff4e0" stroke="#8a5a00" stroke-width="1.6"/>
  <text x="880" y="293" font-size="12" font-weight="bold" fill="#222222" text-anchor="middle">SMS</text>
  <text x="880" y="310" font-size="9.5" fill="#444444" text-anchor="middle">log sender, Twilio or AWS SNS</text>

  <!-- flows -->
  <line x1="145" y1="300" x2="248" y2="300" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#authz-arrow)"/>
  <text x="197" y="290" font-size="9.5" fill="#1c4b73" text-anchor="middle">session cookie</text>

  <path d="M85,265 V110 H378" fill="none" stroke="#1c4b73" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#authz-arrow)"/>
  <text x="92" y="104" font-size="9.5" fill="#1c4b73">login, consent (redirects)</text>

  <line x1="350" y1="260" x2="410" y2="172" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#authz-arrow)"/>
  <text x="345" y="222" font-size="9.5" fill="#1c4b73" text-anchor="end">code + PKCE</text>

  <line x1="380" y1="320" x2="578" y2="320" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#authz-arrow)"/>
  <text x="525" y="313" font-size="9.5" fill="#1c4b73" text-anchor="middle">bearer token</text>

  <line x1="650" y1="290" x2="540" y2="172" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#authz-arrow)"/>
  <text x="612" y="232" font-size="9.5" fill="#1c4b73">JWKS</text>

  <line x1="470" y1="400" x2="470" y2="172" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#authz-arrow)"/>
  <text x="476" y="385" font-size="9.5" fill="#1c4b73">client_credentials</text>

  <line x1="560" y1="415" x2="648" y2="362" stroke="#1c4b73" stroke-width="1.8" marker-end="url(#authz-arrow)"/>
  <text x="600" y="432" font-size="9.5" fill="#1c4b73">bearer token</text>

  <path d="M380,140 H232 V398" fill="none" stroke="#2f5424" stroke-width="1.8" marker-end="url(#authz-arrow-db)"/>
  <line x1="315" y1="340" x2="315" y2="398" stroke="#2f5424" stroke-width="1.8" marker-end="url(#authz-arrow-db)"/>
  <text x="322" y="375" font-size="9.5" fill="#2f5424">sessions</text>

  <line x1="560" y1="105" x2="788" y2="105" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#authz-arrow-ext)"/>
  <text x="640" y="99" font-size="9.5" fill="#8a5a00">OIDC federation</text>
  <line x1="560" y1="130" x2="788" y2="200" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#authz-arrow-ext)"/>
  <text x="700" y="160" font-size="9.5" fill="#8a5a00">OTP e-mail</text>
  <line x1="560" y1="155" x2="788" y2="295" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#authz-arrow-ext)"/>
  <text x="700" y="232" font-size="9.5" fill="#8a5a00">OTP SMS</text>

  <text x="500" y="490" font-size="11" fill="#444444" text-anchor="middle">Tokens never leave the trusted boundary: the browser only holds the session cookie issued by the BFF.</text>
</svg>
