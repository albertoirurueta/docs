<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The bottom bar: notes, timing, pages, zoom and views</text>
  <rect x="30" y="46" width="700" height="150" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <rect x="300" y="60" width="160" height="90" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="312" y="72" width="80" height="8" rx="2" fill="#4F46E5"/><rect x="312" y="110" width="136" height="28" rx="3" fill="#E5E7EB"/>
  <rect x="30" y="160" width="700" height="36" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <g font-size="12" fill="#1F2937" text-anchor="middle">
    <rect x="42" y="166" width="56" height="24" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="70" y="182">Notes</text>
    <rect x="104" y="166" width="68" height="24" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="138" y="182">Duration</text>
    <rect x="178" y="166" width="56" height="24" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="206" y="182">Pages</text>
    <rect x="240" y="166" width="84" height="24" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="282" y="182">Go to page</text>
    <rect x="390" y="174" width="110" height="8" rx="4" fill="#D1D5DB"/><circle cx="450" cy="178" r="8" fill="#4F46E5"/>
    <rect x="510" y="166" width="46" height="24" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="533" y="182">100%</text>
    <rect x="562" y="166" width="40" height="24" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="582" y="182">Fit</text>
    <rect x="606" y="166" width="40" height="24" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="626" y="182">Fill</text>
    <rect x="654" y="166" width="30" height="24" rx="5" fill="#FFFFFF" stroke="#9CA3AF"/><text x="669" y="182">Grid</text>
    <rect x="690" y="166" width="30" height="24" rx="5" fill="#FFFFFF" stroke="#B45309"/><text x="705" y="182">Full</text>
  </g>
  <g fill="#4F46E5"><circle cx="70" cy="226" r="11"/><circle cx="138" cy="226" r="11"/><circle cx="206" cy="226" r="11"/><circle cx="282" cy="226" r="11"/><circle cx="445" cy="226" r="11"/><circle cx="582" cy="226" r="11"/><circle cx="669" cy="226" r="11"/></g>
  <circle cx="705" cy="226" r="11" fill="#B45309"/>
  <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle"><text x="70" y="230">1</text><text x="138" y="230">2</text><text x="206" y="230">3</text><text x="282" y="230">4</text><text x="445" y="230">5</text><text x="582" y="230">6</text><text x="669" y="230">7</text><text x="705" y="230">8</text></g>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M70,214 L70,194" marker-end="url(#ah)"/><path d="M138,214 L138,194" marker-end="url(#ah)"/><path d="M206,214 L206,194" marker-end="url(#ah)"/><path d="M282,214 L282,194" marker-end="url(#ah)"/><path d="M445,214 L445,186" marker-end="url(#ah)"/><path d="M582,214 L582,194" marker-end="url(#ah)"/><path d="M669,214 L669,194" marker-end="url(#ah)"/><path d="M705,214 L705,194" marker-end="url(#ah)"/></g>
  <g font-size="12" fill="#374151">
    <text x="30" y="262">1 Notes: presenter notes, shown in Presenter View</text>
    <text x="30" y="282">2 Duration: toggles the timeline panel on and off</text>
    <text x="30" y="302">3 Pages: shows or hides the page thumbnails</text>
    <text x="30" y="322">4 Go to page: type a page number (Option+Cmd+G or Alt+Ctrl+G)</text>
    <text x="400" y="262">5 Zoom slider and percent box</text>
    <text x="400" y="282">6 Fit: best fit; Fill: fit to browser page width</text>
    <text x="400" y="302">7 Grid view icon: all pages as tiles</text>
    <text x="400" y="322">8 Full screen: work or present without browser bars</text>
  </g>
  <text x="380" y="348" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor, not a screenshot of any product.</text>
</svg>
