<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-pld-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Choosing a GPU and creating the device, step by step</text>
<rect x="20" y="70" width="108" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74.0" y="117.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Enumerate</text>
<text x="74.0" y="133.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="74.0" y="149.2" text-anchor="middle" font-size="12" fill="#3730A3">vkEnumerate</text>
<text x="74.0" y="165.2" text-anchor="middle" font-size="12" fill="#3730A3">Physical</text>
<text x="74.0" y="181.2" text-anchor="middle" font-size="12" fill="#3730A3">Devices</text>
<circle cx="34" cy="70" r="11" fill="#4F46E5"/><text x="34" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<line x1="128" y1="145" x2="141" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-pld-sel)"/>
<rect x="141" y="70" width="108" height="150" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195.0" y="117.2" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Reject</text>
<text x="195.0" y="133.2" text-anchor="middle" font-size="12" fill="#92400E"></text>
<text x="195.0" y="149.2" text-anchor="middle" font-size="12" fill="#92400E">version &lt; 1.3</text>
<text x="195.0" y="165.2" text-anchor="middle" font-size="12" fill="#92400E">or missing</text>
<text x="195.0" y="181.2" text-anchor="middle" font-size="12" fill="#92400E">extension</text>
<circle cx="155" cy="70" r="11" fill="#B45309"/><text x="155" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<line x1="249" y1="145" x2="262" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-pld-sel)"/>
<rect x="262" y="70" width="108" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="316.0" y="117.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Query</text>
<text x="316.0" y="133.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="316.0" y="149.2" text-anchor="middle" font-size="12" fill="#3730A3">Features2</text>
<text x="316.0" y="165.2" text-anchor="middle" font-size="12" fill="#3730A3">chain and</text>
<text x="316.0" y="181.2" text-anchor="middle" font-size="12" fill="#3730A3">Properties2</text>
<circle cx="276" cy="70" r="11" fill="#4F46E5"/><text x="276" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<line x1="370" y1="145" x2="383" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-pld-sel)"/>
<rect x="383" y="70" width="108" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="437.0" y="125.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Find queues</text>
<text x="437.0" y="141.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="437.0" y="157.2" text-anchor="middle" font-size="12" fill="#3730A3">graphics and</text>
<text x="437.0" y="173.2" text-anchor="middle" font-size="12" fill="#3730A3">present family</text>
<circle cx="397" cy="70" r="11" fill="#4F46E5"/><text x="397" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<line x1="491" y1="145" x2="504" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-pld-sel)"/>
<rect x="504" y="70" width="108" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="558.0" y="125.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Score</text>
<text x="558.0" y="141.2" text-anchor="middle" font-size="12" fill="#3730A3"></text>
<text x="558.0" y="157.2" text-anchor="middle" font-size="12" fill="#3730A3">discrete first,</text>
<text x="558.0" y="173.2" text-anchor="middle" font-size="12" fill="#3730A3">VRAM size</text>
<circle cx="518" cy="70" r="11" fill="#4F46E5"/><text x="518" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<line x1="612" y1="145" x2="625" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-pld-sel)"/>
<rect x="625" y="70" width="108" height="150" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="679.0" y="109.2" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">Create</text>
<text x="679.0" y="125.2" text-anchor="middle" font-size="12" fill="#065F46"></text>
<text x="679.0" y="141.2" text-anchor="middle" font-size="12" fill="#065F46">vkCreateDevice</text>
<text x="679.0" y="157.2" text-anchor="middle" font-size="12" fill="#065F46">and</text>
<text x="679.0" y="173.2" text-anchor="middle" font-size="12" fill="#065F46">vkGetDevice</text>
<text x="679.0" y="189.2" text-anchor="middle" font-size="12" fill="#065F46">Queue2</text>
<circle cx="639" cy="70" r="11" fill="#4F46E5"/><text x="639" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
<text x="380" y="255" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">The Vulkan Bookshelf rejects any device that cannot do all of the following:</text>
<text x="380" y="278" text-anchor="middle" font-size="11" fill="#374151">Vulkan 1.3 core, VK_KHR_swapchain, dynamicRendering, synchronization2, timelineSemaphore,</text>
<text x="380" y="296" text-anchor="middle" font-size="11" fill="#374151">a graphics queue family that can also present to the window surface.</text>
<text x="380" y="326" text-anchor="middle" font-size="11" fill="#374151">Optional extras (Vulkan 1.4 features, ray query, mesh shaders) only add to the score.</text>
</svg>
