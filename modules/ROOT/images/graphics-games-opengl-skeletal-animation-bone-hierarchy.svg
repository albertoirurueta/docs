<svg viewBox="0 0 760 330" width="760" height="330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-graphics-games-opengl-skeletal-animation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">A skeleton drives a mesh: bone hierarchy of the Bookshelf cover</text>
<text x="190" y="56" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Bind pose (mesh space, top view)</text>
<text x="580" y="56" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Joint hierarchy (parent to child)</text>
<rect x="30" y="70" width="320" height="240" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="90" y="140" width="100" height="42" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<rect x="190" y="140" width="100" height="42" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="140" y="120" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">vertices weighted to Root</text>
<text x="240" y="214" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">vertices weighted to Hinge</text>
<circle cx="90" cy="161" r="9" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<circle cx="190" cy="161" r="9" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<circle cx="290" cy="161" r="9" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="90" y="240" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Root</text>
<text x="190" y="240" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Hinge</text>
<text x="290" y="240" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">CoverTip</text>
<line x1="90" y1="170" x2="90" y2="228" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="190" y1="170" x2="190" y2="228" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="290" y1="170" x2="290" y2="228" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5 4"/>
<text x="190" y="276" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Each bone has a bind-pose transform; its inverse is the inverse bind matrix</text>
<text x="190" y="294" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">that moves a vertex from mesh space into the bone's own space.</text>
<rect x="480" y="80" width="200" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="580.0" y="105.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Root (node 0)</text>
<rect x="480" y="160" width="200" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="580.0" y="185.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Hinge (node 1)</text>
<rect x="480" y="240" width="200" height="40" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="580.0" y="265.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">CoverTip (node 2)</text>
<line x1="580" y1="120" x2="580" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-skeletal-animation)"/>
<line x1="580" y1="200" x2="580" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-skeletal-animation)"/>
<text x="580" y="306" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">joints = [0, 1, 2]  (order defines the JOINTS_0 indices)</text>
</svg>
