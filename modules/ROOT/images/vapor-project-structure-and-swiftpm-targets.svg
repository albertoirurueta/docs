<svg viewBox="0 0 940 490" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="490" fill="#ffffff"/>
  <text x="470" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf: package, targets and products</text>
  <text x="470" y="46" font-size="12" fill="#666666" text-anchor="middle">arrows point from a target to what it depends on; BookshelfAPI imports nothing from Vapor</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
  </defs>

  <!-- the bookshelf package -->
  <rect x="20" y="60" width="610" height="390" rx="8" fill="#fbfbfb" stroke="#1c4b73" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="82" font-size="14" font-weight="bold" fill="#1c4b73">package bookshelf (Package.swift, swift-tools-version 6.3)</text>

  <g font-size="12">
    <!-- Run -->
    <rect x="50" y="110" width="170" height="52" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="135" y="130" text-anchor="middle" font-weight="bold" fill="#222222">Run</text>
    <text x="135" y="147" text-anchor="middle" fill="#444444">executableTarget, @main only</text>

    <!-- Tests -->
    <rect x="410" y="110" width="190" height="52" rx="5" fill="#eef6ea" stroke="#3d7a2a"/>
    <text x="505" y="130" text-anchor="middle" font-weight="bold" fill="#222222">BookshelfAppTests</text>
    <text x="505" y="147" text-anchor="middle" fill="#444444">testTarget, Swift Testing</text>

    <!-- BookshelfApp -->
    <rect x="215" y="230" width="200" height="70" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="315" y="252" text-anchor="middle" font-weight="bold" fill="#222222">BookshelfApp</text>
    <text x="315" y="269" text-anchor="middle" fill="#444444">target (library): configure(_:),</text>
    <text x="315" y="285" text-anchor="middle" fill="#444444">routes, controllers, services</text>

    <!-- BookshelfAPI -->
    <rect x="215" y="370" width="200" height="56" rx="5" fill="#e8f0f8" stroke="#1c4b73"/>
    <text x="315" y="392" text-anchor="middle" font-weight="bold" fill="#222222">BookshelfAPI</text>
    <text x="315" y="409" text-anchor="middle" fill="#444444">target (library): BookDTO, Codable</text>

    <!-- products -->
    <rect x="50" y="370" width="120" height="56" rx="5" fill="#fdf0e2" stroke="#b7410e"/>
    <text x="110" y="392" text-anchor="middle" font-weight="bold" fill="#222222">product Run</text>
    <text x="110" y="409" text-anchor="middle" fill="#444444">executable</text>

    <rect x="455" y="370" width="150" height="56" rx="5" fill="#fdf0e2" stroke="#b7410e"/>
    <text x="530" y="392" text-anchor="middle" font-weight="bold" fill="#222222">product BookshelfAPI</text>
    <text x="530" y="409" text-anchor="middle" fill="#444444">library</text>
  </g>

  <!-- external packages -->
  <rect x="680" y="110" width="240" height="130" rx="8" fill="#f6f1fa" stroke="#6b3fa0" stroke-width="1.5"/>
  <text x="700" y="132" font-size="14" font-weight="bold" fill="#6b3fa0">package vapor 4.122.2</text>
  <g font-size="12">
    <rect x="700" y="148" width="200" height="30" rx="4" fill="#ffffff" stroke="#6b3fa0"/>
    <text x="800" y="168" text-anchor="middle" fill="#222222">product Vapor</text>
    <rect x="700" y="192" width="200" height="30" rx="4" fill="#ffffff" stroke="#6b3fa0"/>
    <text x="800" y="212" text-anchor="middle" fill="#222222">product VaporTesting</text>
  </g>
  <rect x="680" y="270" width="240" height="90" rx="8" fill="#f6f1fa" stroke="#6b3fa0" stroke-width="1.5"/>
  <text x="700" y="292" font-size="14" font-weight="bold" fill="#6b3fa0">package swift-nio 2.101+</text>
  <g font-size="12">
    <rect x="700" y="306" width="200" height="30" rx="4" fill="#ffffff" stroke="#6b3fa0"/>
    <text x="800" y="326" text-anchor="middle" fill="#222222">products NIOCore, NIOPosix</text>
  </g>

  <!-- dependency arrows -->
  <g stroke="#444444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M135,162 L135,200 L250,200 L250,230"/>
    <path d="M505,162 L505,200 L380,200 L380,230"/>
    <path d="M315,300 L315,370"/>
    <path d="M110,370 L110,175" stroke-dasharray="4 3"/>
    <path d="M455,398 L417,398" stroke-dasharray="4 3"/>
  </g>
  <g stroke="#6b3fa0" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M415,255 L640,255 L640,163 L700,163"/>
    <path d="M600,150 L700,207"/>
    <path d="M135,110 L135,98 L662,98 L662,321 L700,321"/>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#444444">
    <line x1="60" y1="474" x2="90" y2="474" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="98" y="478">depends on</text>
    <line x1="180" y1="474" x2="210" y2="474" stroke="#444444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text x="218" y="478">product exposes the target</text>
    <line x1="370" y1="474" x2="400" y2="474" stroke="#6b3fa0" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="408" y="478">uses a product of another package</text>
  </g>
</svg>
