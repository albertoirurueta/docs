<svg viewBox="0 0 900 520" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">A regional GKE cluster and the services around it</text>

  <!-- Google-managed control plane -->
  <rect x="20" y="44" width="860" height="86" rx="10" fill="#e8f0fe" stroke="#1a5fb4" stroke-width="2"/>
  <text x="36" y="66" font-size="13" font-weight="700" fill="#123a72">Google-managed control plane (regional: replicas in three zones, patched and upgraded by Google)</text>
  <rect x="40" y="80" width="150" height="38" rx="6" fill="#ffffff" stroke="#1a5fb4"/>
  <text x="115" y="104" text-anchor="middle" font-size="12" fill="#123a72">Kubernetes API server</text>
  <rect x="205" y="80" width="150" height="38" rx="6" fill="#ffffff" stroke="#1a5fb4"/>
  <text x="280" y="104" text-anchor="middle" font-size="12" fill="#123a72">Scheduler, controllers</text>
  <rect x="370" y="80" width="150" height="38" rx="6" fill="#ffffff" stroke="#1a5fb4"/>
  <text x="445" y="104" text-anchor="middle" font-size="12" fill="#123a72">etcd state</text>
  <rect x="540" y="80" width="320" height="38" rx="6" fill="#fff8e6" stroke="#b06a00"/>
  <text x="700" y="104" text-anchor="middle" font-size="12" fill="#7a4800">DNS-based endpoint + authorized networks</text>

  <!-- VPC -->
  <rect x="20" y="150" width="610" height="350" rx="12" fill="#f5f7fa" stroke="#5c6b7a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="36" y="172" font-size="13" font-weight="700" fill="#3c4a58">Your VPC network, subnet with Pod and Service secondary ranges (VPC-native)</text>

  <!-- Autopilot -->
  <rect x="40" y="188" width="270" height="290" rx="10" fill="#eaf6ee" stroke="#1e7e45" stroke-width="2"/>
  <text x="175" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#14572f">Autopilot mode</text>
  <text x="175" y="228" text-anchor="middle" font-size="11" fill="#14572f">Google manages nodes; you bill per Pod request</text>
  <rect x="60" y="244" width="230" height="52" rx="6" fill="#ffffff" stroke="#1e7e45"/>
  <text x="175" y="266" text-anchor="middle" font-size="12" fill="#14572f">Pod catalog-api</text>
  <text x="175" y="284" text-anchor="middle" font-size="11" fill="#14572f">requests: 500m CPU, 1 GiB</text>
  <rect x="60" y="308" width="230" height="52" rx="6" fill="#ffffff" stroke="#1e7e45"/>
  <text x="175" y="330" text-anchor="middle" font-size="12" fill="#14572f">Pod orders-api</text>
  <text x="175" y="348" text-anchor="middle" font-size="11" fill="#14572f">nodes appear on demand</text>
  <rect x="60" y="372" width="230" height="90" rx="6" fill="#dff1e5" stroke="#1e7e45" stroke-dasharray="4,3"/>
  <text x="175" y="396" text-anchor="middle" font-size="12" fill="#14572f">Managed nodes (hidden)</text>
  <text x="175" y="414" text-anchor="middle" font-size="11" fill="#14572f">hardened image, Shielded, auto-repair,</text>
  <text x="175" y="430" text-anchor="middle" font-size="11" fill="#14572f">auto-upgrade, Workload Identity</text>
  <text x="175" y="446" text-anchor="middle" font-size="11" fill="#14572f">Federation on by default</text>

  <!-- Standard -->
  <rect x="330" y="188" width="280" height="290" rx="10" fill="#fff8e6" stroke="#b06a00" stroke-width="2"/>
  <text x="470" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4800">Standard mode</text>
  <text x="470" y="228" text-anchor="middle" font-size="11" fill="#7a4800">You design node pools; you bill per node</text>
  <rect x="350" y="244" width="240" height="100" rx="6" fill="#ffffff" stroke="#b06a00"/>
  <text x="470" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4800">Node pool: general (e2, 3 zones)</text>
  <rect x="362" y="276" width="64" height="54" rx="4" fill="#fdecc4" stroke="#b06a00"/>
  <text x="394" y="308" text-anchor="middle" font-size="11" fill="#7a4800">node a</text>
  <rect x="438" y="276" width="64" height="54" rx="4" fill="#fdecc4" stroke="#b06a00"/>
  <text x="470" y="308" text-anchor="middle" font-size="11" fill="#7a4800">node b</text>
  <rect x="514" y="276" width="64" height="54" rx="4" fill="#fdecc4" stroke="#b06a00"/>
  <text x="546" y="308" text-anchor="middle" font-size="11" fill="#7a4800">node c</text>
  <rect x="350" y="356" width="240" height="64" rx="6" fill="#ffffff" stroke="#b06a00"/>
  <text x="470" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4800">Node pool: spot (autoscaled)</text>
  <text x="470" y="398" text-anchor="middle" font-size="11" fill="#7a4800">taint + ComputeClass for batch work</text>
  <text x="470" y="446" text-anchor="middle" font-size="11" fill="#7a4800">You choose machine types, upgrade</text>
  <text x="470" y="462" text-anchor="middle" font-size="11" fill="#7a4800">strategy and node auto-provisioning</text>

  <!-- Surrounding services -->
  <rect x="660" y="150" width="220" height="350" rx="12" fill="#ffffff" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="770" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4a58">Around the cluster</text>
  <rect x="676" y="188" width="188" height="48" rx="6" fill="#f5f7fa" stroke="#5c6b7a"/>
  <text x="770" y="209" text-anchor="middle" font-size="12" fill="#3c4a58">Artifact Registry</text>
  <text x="770" y="226" text-anchor="middle" font-size="11" fill="#3c4a58">images (bookshelf repo)</text>
  <rect x="676" y="250" width="188" height="48" rx="6" fill="#f5f7fa" stroke="#5c6b7a"/>
  <text x="770" y="271" text-anchor="middle" font-size="12" fill="#3c4a58">Secret Manager</text>
  <text x="770" y="288" text-anchor="middle" font-size="11" fill="#3c4a58">via Workload Identity</text>
  <rect x="676" y="312" width="188" height="48" rx="6" fill="#f5f7fa" stroke="#5c6b7a"/>
  <text x="770" y="333" text-anchor="middle" font-size="12" fill="#3c4a58">Cloud Logging, Monitoring</text>
  <text x="770" y="350" text-anchor="middle" font-size="11" fill="#3c4a58">Managed Prometheus</text>
  <rect x="676" y="374" width="188" height="48" rx="6" fill="#f5f7fa" stroke="#5c6b7a"/>
  <text x="770" y="395" text-anchor="middle" font-size="12" fill="#3c4a58">Load balancer, Cloud NAT</text>
  <text x="770" y="412" text-anchor="middle" font-size="11" fill="#3c4a58">Gateway API, private egress</text>
  <rect x="676" y="436" width="188" height="48" rx="6" fill="#f5f7fa" stroke="#5c6b7a"/>
  <text x="770" y="457" text-anchor="middle" font-size="12" fill="#3c4a58">Fleet (optional)</text>
  <text x="770" y="474" text-anchor="middle" font-size="11" fill="#3c4a58">Config Sync, multi-cluster Gateway</text>
</svg>
