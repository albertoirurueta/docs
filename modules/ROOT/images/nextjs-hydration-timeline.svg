<svg viewBox="0 0 920 556" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The hydration timeline of a server-rendered Next.js page</title>
  <desc id="d">Three lanes show the server, the network and the browser main thread. The server renders a static shell and streams more chunks later. The browser paints the shell as soon as the first HTML arrives, but the page is not interactive: this gap is the hydration gap. JavaScript downloads in parallel, then React hydrates the root and shell, and afterwards each Suspense boundary, one after another. A click on a boundary moves that boundary to the front of the queue. Each hydrated part becomes interactive; a boundary whose HTML arrives later hydrates when its code and HTML are both present.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4f91"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="556" fill="#ffffff"/>
  <text x="460" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">From first byte to interactive: where hydration sits</text>
  <text x="460" y="47" font-size="12" fill="#555555" text-anchor="middle">Illustrative, not to scale. Time flows to the right. One server-rendered, streamed page with two Suspense boundaries.</text>
  <rect x="20" y="62" width="16" height="12" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.4"/>
  <text x="42" y="73" font-size="12" fill="#333333">server work</text>
  <rect x="135" y="62" width="16" height="12" fill="#eceff3" stroke="#555555" stroke-width="1.4"/>
  <text x="157" y="73" font-size="12" fill="#333333">HTML chunk</text>
  <rect x="250" y="62" width="16" height="12" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/>
  <text x="272" y="73" font-size="12" fill="#333333">JS download</text>
  <rect x="365" y="62" width="16" height="12" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.4"/>
  <text x="387" y="73" font-size="12" fill="#333333">hydration</text>
  <rect x="470" y="62" width="16" height="12" fill="#fbe9e9" stroke="#b00020" stroke-width="1.4"/>
  <text x="492" y="73" font-size="12" fill="#333333">not interactive</text>
  <polygon points="620,62 626,74 614,74" fill="#1d4f91"/><text x="632" y="73" font-size="12" fill="#333333">first paint</text>
  <text x="722" y="75" font-size="15" fill="#b00020">&#9733;</text><text x="740" y="73" font-size="12" fill="#333333">interactive</text>
  <line x1="20" y1="88" x2="900" y2="88" stroke="#d0d0d0" stroke-width="1"/>
  <text x="20" y="110" font-size="14" font-weight="bold" fill="#222222">Server</text>
  <text x="20" y="215" font-size="14" font-weight="bold" fill="#222222">Network</text>
  <text x="20" y="330" font-size="14" font-weight="bold" fill="#222222">Main thread</text>
  <text x="20" y="127" font-size="11" fill="#555555">renders and streams</text>
  <text x="20" y="232" font-size="11" fill="#555555">HTML, payload, JS</text>
  <text x="20" y="347" font-size="11" fill="#555555">browser, one thread</text>
  <line x1="20" y1="180" x2="900" y2="180" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="20" y1="285" x2="900" y2="285" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="170" y1="366" x2="890" y2="366" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="890" y="382" font-size="11" fill="#555555" text-anchor="end">time</text>
  <rect x="170" y="98" width="70" height="26" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.4"/><text x="205" y="115" font-size="11" fill="#222222" text-anchor="middle">render shell</text>
  <rect x="240" y="98" width="330" height="26" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.4" stroke-dasharray="5 3"/><text x="405" y="115" font-size="11" fill="#222222" text-anchor="middle">slow data for boundary B (streaming)</text>
  <rect x="570" y="98" width="70" height="26" fill="#fdf3e3" stroke="#9a5b00" stroke-width="1.4"/><text x="605" y="115" font-size="11" fill="#222222" text-anchor="middle">render B</text>
  <rect x="240" y="198" width="60" height="26" fill="#eceff3" stroke="#555555" stroke-width="1.4"/><text x="270" y="215" font-size="11" fill="#222222" text-anchor="middle">HTML #1</text>
  <rect x="300" y="198" width="30" height="26" fill="#eceff3" stroke="#555555" stroke-width="1.4"/><text x="315" y="215" font-size="10" fill="#222222" text-anchor="middle">RSC</text>
  <rect x="300" y="228" width="280" height="26" fill="#eef3fb" stroke="#1d4f91" stroke-width="1.4"/><text x="440" y="245" font-size="11" fill="#222222" text-anchor="middle">JavaScript chunks (parallel)</text>
  <rect x="640" y="198" width="60" height="26" fill="#eceff3" stroke="#555555" stroke-width="1.4"/><text x="670" y="215" font-size="11" fill="#222222" text-anchor="middle">HTML #2</text>
  <line x1="240" y1="124" x2="240" y2="198" stroke="#444444" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="640" y1="124" x2="640" y2="198" stroke="#444444" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="270" y="300" width="310" height="30" fill="#fbe9e9" stroke="#b00020" stroke-width="1.4"/><text x="425" y="320" font-size="11" fill="#222222" text-anchor="middle">looks ready, ignores clicks (hydration gap)</text>
  <polygon points="270,288 276,297 264,297" fill="#1d4f91"/><text x="282" y="296" font-size="11" fill="#1d3557">first paint (shell)</text>
  <rect x="580" y="300" width="60" height="30" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.4"/><text x="610" y="320" font-size="11" fill="#222222" text-anchor="middle">root + A</text>
  <text x="623" y="296" font-size="15" fill="#b00020">&#9733;</text><text x="600" y="346" font-size="11" fill="#1d3557" text-anchor="middle">A interactive</text>
  <rect x="700" y="300" width="60" height="30" fill="#e9f5ec" stroke="#1e6b36" stroke-width="1.4"/><text x="730" y="320" font-size="11" fill="#222222" text-anchor="middle">B</text>
  <text x="743" y="296" font-size="15" fill="#b00020">&#9733;</text>
  <polygon points="670,340 676,349 664,349" fill="#1d4f91"/><text x="682" y="348" font-size="11" fill="#1d3557">B painted (HTML #2)</text>
  <line x1="580" y1="254" x2="600" y2="298" stroke="#1d4f91" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrb)"/>
  <line x1="700" y1="224" x2="726" y2="298" stroke="#1d4f91" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrb)"/>
  <rect x="20" y="394" width="880" height="146" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/>
  <text x="32" y="415" font-size="12" font-weight="bold" fill="#222222">Reading the picture</text>
  <text x="32" y="435" font-size="12" fill="#222222">1. HTML #1 arrives: the shell is painted. It is a snapshot; the page does not react yet (red bar).</text>
  <text x="32" y="453" font-size="12" fill="#222222">2. The JavaScript arrives: React hydrates the root and the first boundary (A), which becomes interactive.</text>
  <text x="32" y="471" font-size="12" fill="#222222">3. HTML #2 arrives later (streamed): boundary B is painted. React hydrates it when its code is also present.</text>
  <text x="32" y="489" font-size="12" fill="#222222">4. A click on a pending boundary moves it ahead of the other pending boundaries. A click whose code has</text>
  <text x="32" y="507" font-size="12" fill="#222222">    not arrived yet cannot be handled. Fewer and smaller Client Components shorten every green and red bar.</text>
  <text x="32" y="528" font-size="12" fill="#555555">Later client-side navigations repeat none of this: the router fetches an RSC payload and React renders it into the same document.</text>
</svg>
