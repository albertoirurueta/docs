<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">One URP frame: the camera loop and the passes it queues</text>
<rect x="20" y="44" width="720" height="24" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="60.2" text-anchor="middle" font-size="12" fill="#374151">Camera loop: URP repeats these five steps for every camera (game, Scene view, reflection probes, previews)</text>
<rect x="20.0" y="80" width="131.2" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.6" y="102.7" text-anchor="middle" font-size="12" fill="#3730A3">1 Setup culling</text>
<text x="85.6" y="117.7" text-anchor="middle" font-size="12" fill="#3730A3">parameters</text>
<rect x="167.2" y="80" width="131.2" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="232.79999999999998" y="102.7" text-anchor="middle" font-size="12" fill="#3730A3">2 Culling</text>
<text x="232.79999999999998" y="117.7" text-anchor="middle" font-size="12" fill="#3730A3">(renderers, lights)</text>
<rect x="314.4" y="80" width="131.2" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="102.7" text-anchor="middle" font-size="12" fill="#3730A3">3 Build rendering</text>
<text x="380.0" y="117.7" text-anchor="middle" font-size="12" fill="#3730A3">data (asset + camera)</text>
<rect x="461.6" y="80" width="131.2" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="527.2" y="102.7" text-anchor="middle" font-size="12" fill="#3730A3">4 Setup renderer</text>
<text x="527.2" y="117.7" text-anchor="middle" font-size="12" fill="#3730A3">(queue the passes)</text>
<rect x="608.8" y="80" width="131.2" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="674.4" y="102.7" text-anchor="middle" font-size="12" fill="#3730A3">5 Execute renderer</text>
<text x="674.4" y="117.7" text-anchor="middle" font-size="12" fill="#3730A3">(run the passes)</text>
<line x1="151.2" y1="106" x2="167.2" y2="106" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="298.4" y1="106" x2="314.4" y2="106" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="445.59999999999997" y1="106" x2="461.6" y2="106" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="592.8" y1="106" x2="608.8" y2="106" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="150" width="720" height="24" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="166.2" text-anchor="middle" font-size="12" fill="#374151">Execute renderer: the queued passes of the Forward path, in order (the render graph merges and culls them)</text>
<rect x="20.0" y="186" width="131.2" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.6" y="205.7" text-anchor="middle" font-size="12" fill="#3730A3">Main light</text>
<text x="85.6" y="220.7" text-anchor="middle" font-size="12" fill="#3730A3">shadow map</text>
<rect x="167.2" y="186" width="131.2" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="232.79999999999998" y="205.7" text-anchor="middle" font-size="12" fill="#3730A3">Additional</text>
<text x="232.79999999999998" y="220.7" text-anchor="middle" font-size="12" fill="#3730A3">lights shadows</text>
<rect x="314.4" y="186" width="131.2" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="205.7" text-anchor="middle" font-size="12" fill="#3730A3">Depth (normals)</text>
<text x="380.0" y="220.7" text-anchor="middle" font-size="12" fill="#3730A3">prepass, optional</text>
<rect x="461.6" y="186" width="131.2" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="527.2" y="205.7" text-anchor="middle" font-size="12" fill="#3730A3">Draw opaque</text>
<text x="527.2" y="220.7" text-anchor="middle" font-size="12" fill="#3730A3">objects</text>
<rect x="608.8" y="186" width="131.2" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="674.4" y="213.2" text-anchor="middle" font-size="12" fill="#3730A3">Skybox</text>
<line x1="151.2" y1="209" x2="167.2" y2="209" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="298.4" y1="209" x2="314.4" y2="209" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="445.59999999999997" y1="209" x2="461.6" y2="209" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="592.8" y1="209" x2="608.8" y2="209" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20.0" y="262" width="168.0" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="104.0" y="281.7" text-anchor="middle" font-size="12" fill="#3730A3">Copy color and</text>
<text x="104.0" y="296.7" text-anchor="middle" font-size="12" fill="#3730A3">depth, if requested</text>
<rect x="204.0" y="262" width="168.0" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="288.0" y="281.7" text-anchor="middle" font-size="12" fill="#3730A3">Draw transparent</text>
<text x="288.0" y="296.7" text-anchor="middle" font-size="12" fill="#3730A3">objects</text>
<rect x="388.0" y="262" width="168.0" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="472.0" y="281.7" text-anchor="middle" font-size="12" fill="#3730A3">Post-processing</text>
<text x="472.0" y="296.7" text-anchor="middle" font-size="12" fill="#3730A3">(volumes, bloom, LUT)</text>
<rect x="572.0" y="262" width="168.0" height="46" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="656.0" y="281.7" text-anchor="middle" font-size="12" fill="#3730A3">Final blit to</text>
<text x="656.0" y="296.7" text-anchor="middle" font-size="12" fill="#3730A3">the back buffer</text>
<line x1="188.0" y1="285" x2="204.0" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="372.0" y1="285" x2="388.0" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="556.0" y1="285" x2="572.0" y2="285" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="674.4" y1="232" x2="104.0" y2="262" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="20" y="330" width="720" height="54" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="353.9" text-anchor="middle" font-size="11" fill="#92400E">Deferred path: Draw opaque becomes a GBuffer pass plus a Deferred lights pass; transparents stay forward.</text>
<text x="380.0" y="367.9" text-anchor="middle" font-size="11" fill="#92400E">Renderer Features add passes at injection points such as BeforeRenderingOpaques or AfterRenderingPostProcessing.</text>
<rect x="20" y="396" width="720" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="417.9" text-anchor="middle" font-size="11" fill="#374151">Everything above reads the URP asset (quality, shadows, HDR, render scale) and the Universal Renderer asset (rendering path, features).</text>
<text x="380.0" y="431.9" text-anchor="middle" font-size="11" fill="#374151">Both are scriptable objects you can swap per quality level.</text>
</svg>
