<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-android-prerot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Pre-rotation: render in the display orientation</text>
<rect x="30" y="56" width="330" height="300" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="195" y="80" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Without pre-rotation</text>
<rect x="60" y="100" width="110" height="150" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="115.0" y="156.7" text-anchor="middle" font-size="12" fill="#374151">Swapchain</text>
<text x="115.0" y="171.7" text-anchor="middle" font-size="12" fill="#374151">image</text>
<text x="115.0" y="186.7" text-anchor="middle" font-size="12" fill="#374151">identity</text>
<text x="115.0" y="201.7" text-anchor="middle" font-size="12" fill="#374151">portrait</text>
<line x1="172" y1="175" x2="222" y2="175" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-prerot)"/>
<rect x="224" y="110" width="110" height="130" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="279.0" y="157.8" text-anchor="middle" font-size="11" fill="#92400E">Compositor</text>
<text x="279.0" y="171.8" text-anchor="middle" font-size="11" fill="#92400E">rotates by 90</text>
<text x="279.0" y="185.8" text-anchor="middle" font-size="11" fill="#92400E">extra pass,</text>
<text x="279.0" y="199.8" text-anchor="middle" font-size="11" fill="#92400E">extra memory</text>
<text x="195" y="290" text-anchor="middle" font-size="11" fill="#374151">preTransform = IDENTITY, display is rotated</text>
<text x="195" y="308" text-anchor="middle" font-size="11" fill="#374151">Android must rotate every frame</text>
<text x="195" y="326" text-anchor="middle" font-size="11" fill="#374151">(DPU rotation only on some devices)</text>
<rect x="400" y="56" width="330" height="300" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="565" y="80" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">With pre-rotation</text>
<rect x="420" y="110" width="150" height="100" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="495.0" y="149.8" text-anchor="middle" font-size="11" fill="#3730A3">Swapchain image</text>
<text x="495.0" y="163.8" text-anchor="middle" font-size="11" fill="#3730A3">already rotated</text>
<text x="495.0" y="177.8" text-anchor="middle" font-size="11" fill="#3730A3">extent = identity size</text>
<line x1="572" y1="160" x2="620" y2="160" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-android-prerot)"/>
<rect x="622" y="120" width="90" height="80" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="667.0" y="149.8" text-anchor="middle" font-size="11" fill="#065F46">Display</text>
<text x="667.0" y="163.8" text-anchor="middle" font-size="11" fill="#065F46">no extra</text>
<text x="667.0" y="177.8" text-anchor="middle" font-size="11" fill="#065F46">rotation</text>
<text x="565" y="250" text-anchor="middle" font-size="11" fill="#374151">preTransform = currentTransform</text>
<text x="565" y="268" text-anchor="middle" font-size="11" fill="#374151">MVP gets a clip-space Z rotation</text>
<text x="565" y="286" text-anchor="middle" font-size="11" fill="#374151">viewport, scissor and dFdx, dFdy</text>
<text x="565" y="304" text-anchor="middle" font-size="11" fill="#374151">are remapped for 90 and 270 degrees</text>
<text x="565" y="336" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">The compositor pass disappears</text>
<text x="380" y="392" text-anchor="middle" font-size="11" fill="#374151">Measure first: the saving depends on the device and on the rotation path Android would otherwise take.</text>
</svg>
