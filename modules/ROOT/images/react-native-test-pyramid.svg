<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>
  <text x="380" y="26" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The mobile test pyramid</text>
  <text x="380" y="44" font-size="11" fill="#666666" text-anchor="middle">Many, fast checks at the base -- few, slow, high-confidence checks at the top</text>

  <defs>
    <marker id="tp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Tier 4 (bottom, widest): Static Analysis -->
  <polygon points="60,410 700,410 620,340 140,340" fill="#eef4fa" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="380" y="368" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">Static Analysis</text>
  <text x="380" y="386" font-size="10.5" fill="#333333" text-anchor="middle">ESLint 9 (flat config), tsc --noEmit</text>
  <text x="380" y="401" font-size="9.5" fill="#555555" text-anchor="middle">every keystroke, whole codebase -- fastest, most numerous checks</text>

  <!-- Tier 3: Unit -->
  <polygon points="140,340 620,340 545,270 215,270" fill="#eef7ee" stroke="#2d6a34" stroke-width="1.6"/>
  <text x="380" y="298" font-size="13" font-weight="bold" fill="#2d6a34" text-anchor="middle">Unit Tests</text>
  <text x="380" y="316" font-size="10.5" fill="#333333" text-anchor="middle">Jest (jest-expo / @react-native/jest-preset)</text>
  <text x="380" y="331" font-size="9.5" fill="#555555" text-anchor="middle">pure functions and reducers -- milliseconds, no rendering</text>

  <!-- Tier 2: Component -->
  <polygon points="215,270 545,270 470,200 290,200" fill="#fff7e6" stroke="#c98a1c" stroke-width="1.6"/>
  <text x="380" y="228" font-size="13" font-weight="bold" fill="#a35d00" text-anchor="middle">Component Tests</text>
  <text x="380" y="246" font-size="10.5" fill="#333333" text-anchor="middle">React Native Testing Library</text>
  <text x="380" y="261" font-size="9.5" fill="#555555" text-anchor="middle">render/screen, userEvent, waitFor -- in Node, no device</text>

  <!-- Tier 1 (top, narrowest): E2E -->
  <polygon points="290,200 470,200 380,120" fill="#fbecec" stroke="#a33" stroke-width="1.6"/>
  <text x="380" y="163" font-size="12.5" font-weight="bold" fill="#a33" text-anchor="middle">E2E</text>
  <text x="380" y="180" font-size="9.5" fill="#333333" text-anchor="middle">Detox, Maestro,</text>
  <text x="380" y="193" font-size="9.5" fill="#333333" text-anchor="middle">Appium</text>

  <text x="380" y="103" font-size="10" fill="#a33" text-anchor="middle">real simulator/device</text>
  <text x="380" y="88" font-size="9.5" fill="#666666" text-anchor="middle">few, slow, most convincing</text>

  <!-- Speed / count annotation arrow on the right -->
  <line x1="690" y1="405" x2="690" y2="130" stroke="#666666" stroke-width="1.4" marker-end="url(#tp-arrow)"/>
  <text x="712" y="410" font-size="10" fill="#666666" text-anchor="middle" transform="rotate(-90 712,410)">many, fast</text>
  <text x="712" y="150" font-size="10" fill="#666666" text-anchor="middle" transform="rotate(-90 712,150)">few, slow</text>

  <text x="380" y="445" font-size="10.5" fill="#666666" text-anchor="middle">Each tier is cheaper and faster to run than the one above it -- and should have more tests than it.</text>
</svg>
