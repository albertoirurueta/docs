<svg viewBox="0 0 760 340" width="760" height="340" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Two ways to connect: Code Connect UI and CLI</text>
<rect x="30" y="50" width="330" height="270" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
<text x="195" y="76" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Code Connect UI (inside Figma)</text>
<g font-size="12" fill="#374151">
<circle cx="52" cy="108" r="11" fill="#4F46E5"/><text x="52" y="112" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="72" y="112">Open the library in Dev Mode</text>
<circle cx="52" cy="148" r="11" fill="#4F46E5"/><text x="52" y="152" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="72" y="152">Connect components to code</text>
<circle cx="52" cy="188" r="11" fill="#4F46E5"/><text x="52" y="192" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="72" y="192">Enter file path and name (or browse GitHub)</text>
<circle cx="52" cy="228" r="11" fill="#4F46E5"/><text x="52" y="232" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="72" y="232">Add more frameworks (one to many)</text></g>
<text x="195" y="276" font-size="12" fill="#3730A3" text-anchor="middle">No code snippets in Inspect; any language</text>
<rect x="400" y="50" width="330" height="270" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="565" y="76" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">Code Connect CLI (in your repo)</text>
<g font-size="12" fill="#374151">
<circle cx="422" cy="108" r="11" fill="#B45309"/><text x="422" y="112" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="442" y="112">Install @figma/code-connect</text>
<circle cx="422" cy="148" r="11" fill="#B45309"/><text x="422" y="152" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="442" y="152">Add figma.config.json</text>
<circle cx="422" cy="188" r="11" fill="#B45309"/><text x="422" y="192" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="442" y="192">Write *.figma.ts template files</text>
<circle cx="422" cy="228" r="11" fill="#B45309"/><text x="422" y="232" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="442" y="232">Run figma connect publish</text></g>
<text x="565" y="276" font-size="12" fill="#92400E" text-anchor="middle">Real snippets in Dev Mode; edit in CLI only</text>
<g stroke="#4B5563" stroke-width="1.8" marker-end="url(#ah)"><line x1="362" y1="300" x2="398" y2="300"/></g>
<text x="380" y="316" font-size="11" fill="#4B5563" text-anchor="middle">combine</text>
</svg>
