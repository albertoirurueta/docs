<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor">
  <title id="t">The three extensibility options of SAP S/4HANA Cloud Public Edition: key user and developer extensibility run in the S/4HANA stack, side-by-side extensibility runs on SAP BTP, and all of them reach the standard through released objects</title>
  <desc id="d">Two columns sit inside the SAP S/4HANA Cloud stack, key user extensibility for key users with released BAdIs and CDS views, and developer extensibility for ABAP developers with released BAdIs, classes, interfaces, CDS views and behavior definitions. A third column on SAP BTP holds side-by-side extensibility for developers, which uses released BAPIs, IDocs, OData APIs, SOAP APIs and events. All three reach the SAP standard only through released objects, shown as a bar at the bottom.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <text x="20" y="28" text-anchor="start" font-size="13" font-weight="bold">Inside the SAP S/4HANA stack</text>
  <text x="700" y="28" text-anchor="start" font-size="13" font-weight="bold">On SAP BTP, next to the stack</text>
  <rect x="20" y="44" width="320" height="220" rx="10" fill="#ff6ec4" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="180" y="119" text-anchor="middle" font-size="15" font-weight="bold">Key user extensibility</text>
  <text x="180" y="139" text-anchor="middle" font-size="13">Persona: key users</text>
  <text x="180" y="159" text-anchor="middle" font-size="13">Low-code and no-code tools</text>
  <text x="180" y="179" text-anchor="middle" font-size="13">Custom fields, forms, analytics</text>
  <text x="180" y="199" text-anchor="middle" font-size="13">Released: BAdIs, CDS views</text>
  <rect x="360" y="44" width="320" height="220" rx="10" fill="#b76fe0" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="119" text-anchor="middle" font-size="15" font-weight="bold">Developer extensibility</text>
  <text x="520" y="139" text-anchor="middle" font-size="13">Persona: ABAP developers</text>
  <text x="520" y="159" text-anchor="middle" font-size="13">ABAP for Cloud Development</text>
  <text x="520" y="179" text-anchor="middle" font-size="13">Custom apps and extensions</text>
  <text x="520" y="199" text-anchor="middle" font-size="13">Released: BAdIs, classes, CDS views</text>
  <rect x="700" y="44" width="320" height="220" rx="10" fill="#4ade80" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="860" y="119" text-anchor="middle" font-size="15" font-weight="bold">Side-by-side extensibility</text>
  <text x="860" y="139" text-anchor="middle" font-size="13">Persona: developers</text>
  <text x="860" y="159" text-anchor="middle" font-size="13">ABAP, Java or Node.js</text>
  <text x="860" y="179" text-anchor="middle" font-size="13">Loosely coupled apps</text>
  <text x="860" y="199" text-anchor="middle" font-size="13">Released: OData APIs, events, BAPIs</text>
  <line x1="180" y1="330" x2="180" y2="264" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="520" y1="330" x2="520" y2="264" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="860" y1="330" x2="860" y2="264" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="330" width="1000" height="70" rx="10" fill="#7873f5" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/>
  <text x="520" y="360" text-anchor="middle" font-size="15" font-weight="bold">Released objects, extension points and APIs of the SAP standard</text>
  <text x="520" y="380" text-anchor="middle" font-size="13">The core itself stays unmodified, so upgrades do not touch the extensions</text>
</svg>
