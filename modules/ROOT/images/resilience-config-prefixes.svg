<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">One YAML shape, seven prefixes, seven registries</text>
  <defs>
    <marker id="cp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c4b73"/>
    </marker>
  </defs>
  <rect x="20" y="48" width="250" height="504" rx="8" fill="#f4f4f4" stroke="#1c4b73" stroke-width="1.6"/>
  <text x="145" y="72" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Under every prefix</text>
  <text x="36" y="100" font-size="11.5" font-weight="bold" fill="#222222">tags:</text>
  <text x="36" y="114" font-size="10" fill="#666666">registry-wide Micrometer tags</text>
  <text x="36" y="140" font-size="11.5" font-weight="bold" fill="#222222">metrics.enabled / metrics.legacy.enabled</text>
  <text x="36" y="154" font-size="10" fill="#666666">meter binding switches (not on timer)</text>
  <text x="36" y="180" font-size="11.5" font-weight="bold" fill="#222222">&lt;module&gt;AspectOrder</text>
  <text x="36" y="194" font-size="10" fill="#666666">aspect position (not all)</text>
  <text x="36" y="220" font-size="11.5" font-weight="bold" fill="#222222">configs:</text>
  <text x="52" y="244" font-size="11.5" font-weight="bold" fill="#222222">default:</text>
  <text x="52" y="258" font-size="10" fill="#666666">applies to every instance</text>
  <text x="52" y="284" font-size="11.5" font-weight="bold" fill="#222222">&lt;name&gt;:</text>
  <text x="52" y="298" font-size="10" fill="#666666">a shared, named configuration</text>
  <text x="36" y="324" font-size="11.5" font-weight="bold" fill="#222222">instances:</text>
  <text x="52" y="348" font-size="11.5" font-weight="bold" fill="#222222">&lt;name&gt;:</text>
  <text x="52" y="362" font-size="10" fill="#666666">one per remote backend</text>
  <text x="68" y="388" font-size="11.5" font-weight="bold" fill="#222222">baseConfig: &lt;config name&gt;</text>
  <text x="68" y="402" font-size="10" fill="#666666">start from a named config</text>
  <text x="68" y="428" font-size="11.5" font-weight="bold" fill="#222222">&lt;property&gt;: &lt;value&gt;</text>
  <text x="68" y="442" font-size="10" fill="#666666">wins over the base config</text>
  <text x="36" y="476" font-size="10" fill="#444444">Unknown keys are ignored without a warning,</text>
  <text x="36" y="490" font-size="10" fill="#444444">so a typo silently falls back to a default.</text>
  <text x="395" y="66" font-size="11" font-weight="bold" fill="#444444" text-anchor="middle">prefix</text>
  <text x="560" y="66" font-size="11" font-weight="bold" fill="#444444" text-anchor="middle">registry bean</text>
  <text x="740" y="66" font-size="11" font-weight="bold" fill="#444444" text-anchor="middle">aspect order key and customizer</text>
  <text x="845" y="66" font-size="11" font-weight="bold" fill="#444444" text-anchor="middle"> </text>
  <rect x="300" y="78" width="580" height="62" rx="6" fill="#ffffff" stroke="#999999"/>
  <text x="310" y="100" font-size="11" font-weight="bold" fill="#222222">resilience4j.circuitbreaker</text>
  <text x="310" y="120" font-size="10" fill="#666666">configs / instances / tags</text>
  <line x1="488" y1="109" x2="514" y2="109" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#cp-arrow)"/>
  <text x="522" y="100" font-size="11" font-weight="bold" fill="#222222">CircuitBreakerRegistry</text>
  <text x="522" y="120" font-size="10" fill="#666666">bean built at startup</text>
  <text x="696" y="100" font-size="10.5" fill="#222222">circuitBreakerAspectOrder</text>
  <text x="696" y="120" font-size="10" fill="#666666">CircuitBreakerConfigCustomizer</text>
  <rect x="300" y="144" width="580" height="62" rx="6" fill="#ffffff" stroke="#999999"/>
  <text x="310" y="166" font-size="11" font-weight="bold" fill="#222222">resilience4j.retry</text>
  <text x="310" y="186" font-size="10" fill="#666666">configs / instances / tags</text>
  <line x1="488" y1="175" x2="514" y2="175" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#cp-arrow)"/>
  <text x="522" y="166" font-size="11" font-weight="bold" fill="#222222">RetryRegistry</text>
  <text x="522" y="186" font-size="10" fill="#666666">bean built at startup</text>
  <text x="696" y="166" font-size="10.5" fill="#222222">retryAspectOrder</text>
  <text x="696" y="186" font-size="10" fill="#666666">RetryConfigCustomizer</text>
  <rect x="300" y="210" width="580" height="62" rx="6" fill="#ffffff" stroke="#999999"/>
  <text x="310" y="232" font-size="11" font-weight="bold" fill="#222222">resilience4j.ratelimiter</text>
  <text x="310" y="252" font-size="10" fill="#666666">configs / instances / tags</text>
  <line x1="488" y1="241" x2="514" y2="241" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#cp-arrow)"/>
  <text x="522" y="232" font-size="11" font-weight="bold" fill="#222222">RateLimiterRegistry</text>
  <text x="522" y="252" font-size="10" fill="#666666">bean built at startup</text>
  <text x="696" y="232" font-size="10.5" fill="#222222">rateLimiterAspectOrder</text>
  <text x="696" y="252" font-size="10" fill="#666666">RateLimiterConfigCustomizer</text>
  <rect x="300" y="276" width="580" height="62" rx="6" fill="#ffffff" stroke="#999999"/>
  <text x="310" y="298" font-size="11" font-weight="bold" fill="#222222">resilience4j.bulkhead</text>
  <text x="310" y="318" font-size="10" fill="#666666">configs / instances / tags</text>
  <line x1="488" y1="307" x2="514" y2="307" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#cp-arrow)"/>
  <text x="522" y="298" font-size="11" font-weight="bold" fill="#222222">BulkheadRegistry</text>
  <text x="522" y="318" font-size="10" fill="#666666">bean built at startup</text>
  <text x="696" y="298" font-size="10.5" fill="#222222">bulkheadAspectOrder</text>
  <text x="696" y="318" font-size="10" fill="#666666">BulkheadConfigCustomizer</text>
  <rect x="300" y="342" width="580" height="62" rx="6" fill="#ffffff" stroke="#999999"/>
  <text x="310" y="364" font-size="11" font-weight="bold" fill="#222222">resilience4j.thread-pool-bulkhead</text>
  <text x="310" y="384" font-size="10" fill="#666666">configs / instances / tags</text>
  <line x1="488" y1="373" x2="514" y2="373" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#cp-arrow)"/>
  <text x="522" y="364" font-size="11" font-weight="bold" fill="#222222">ThreadPoolBulkheadRegistry</text>
  <text x="522" y="384" font-size="10" fill="#666666">bean built at startup</text>
  <text x="696" y="364" font-size="10.5" fill="#222222">(none: shares the bulkhead aspect)</text>
  <text x="696" y="384" font-size="10" fill="#666666">ThreadPoolBulkheadConfigCustomizer</text>
  <rect x="300" y="408" width="580" height="62" rx="6" fill="#ffffff" stroke="#999999"/>
  <text x="310" y="430" font-size="11" font-weight="bold" fill="#222222">resilience4j.timelimiter</text>
  <text x="310" y="450" font-size="10" fill="#666666">configs / instances / tags</text>
  <line x1="488" y1="439" x2="514" y2="439" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#cp-arrow)"/>
  <text x="522" y="430" font-size="11" font-weight="bold" fill="#222222">TimeLimiterRegistry</text>
  <text x="522" y="450" font-size="10" fill="#666666">bean built at startup</text>
  <text x="696" y="430" font-size="10.5" fill="#222222">timeLimiterAspectOrder</text>
  <text x="696" y="450" font-size="10" fill="#666666">TimeLimiterConfigCustomizer</text>
  <rect x="300" y="474" width="580" height="62" rx="6" fill="#ffffff" stroke="#999999"/>
  <text x="310" y="496" font-size="11" font-weight="bold" fill="#222222">resilience4j.micrometer.timer</text>
  <text x="310" y="516" font-size="10" fill="#666666">configs / instances / tags</text>
  <line x1="488" y1="505" x2="514" y2="505" stroke="#1c4b73" stroke-width="1.6" marker-end="url(#cp-arrow)"/>
  <text x="522" y="496" font-size="11" font-weight="bold" fill="#222222">TimerRegistry</text>
  <text x="522" y="516" font-size="10" fill="#666666">bean built at startup</text>
  <text x="696" y="496" font-size="10.5" fill="#222222">timerAspectOrder</text>
  <text x="696" y="516" font-size="10" fill="#666666">TimerConfigCustomizer</text>
  <text x="590" y="562" font-size="10.5" fill="#444444" text-anchor="middle">Also: resilience4j.scheduled.executor.* creates the ContextAwareScheduledThreadPoolExecutor bean when corePoolSize is set.</text>
</svg>
