<title id="stackoverflow-questions-enterprise-t">Stack Overflow questions per year (enterprise and other stacks)</title>
<desc id="stackoverflow-questions-enterprise-d">Questions asked each year on Stack Overflow with the tag of AEM, Umbraco, Wagtail, Ghost, 2018 to 2025. Every tag falls steeply from 2023, mirroring the decline of the whole site, so the trend says little about the popularity of a CMS. The partial year 2026 is omitted.</desc>
