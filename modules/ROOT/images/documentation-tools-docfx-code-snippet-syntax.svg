<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a DocFX code snippet link</title>
  <desc id="d">A snippet link is split into the language, the bracket text, the file path and the query. A tagged region of the source file becomes the code block in the page, and the marker lines are dropped.</desc>
  <rect x="0" y="0" width="760" height="360" rx="12" fill="#1f2a37"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#f3f4f6">
    <text x="24" y="34" font-size="16" font-weight="bold">Snippet link in a Markdown article</text>
    <g font-family="Consolas, Menlo, monospace" font-size="15">
      <rect x="24" y="52" width="76" height="34" rx="4" fill="#1d4ed8"/>
      <text x="32" y="75">[!code-</text>
      <rect x="100" y="52" width="62" height="34" rx="4" fill="#0f766e"/>
      <text x="106" y="75">csharp</text>
      <rect x="162" y="52" width="32" height="34" rx="4" fill="#7c3aed"/>
      <text x="168" y="75">[]</text>
      <rect x="194" y="52" width="196" height="34" rx="4" fill="#b45309"/>
      <text x="200" y="75">(../snippets/Usage.cs</text>
      <rect x="390" y="52" width="108" height="34" rx="4" fill="#be185d"/>
      <text x="396" y="75">#Convert10km</text>
      <rect x="498" y="52" width="40" height="34" rx="4" fill="#1d4ed8"/>
      <text x="506" y="75">)]</text>
    </g>
    <g font-size="13">
      <text x="100" y="112">language</text>
      <text x="162" y="130">bracket text</text>
      <text x="224" y="112">path, relative to the article</text>
      <text x="410" y="130">query or tag name</text>
    </g>
    <g stroke="#9ca3af" stroke-width="1.5" fill="none">
      <path d="M131 90 V100"/><path d="M178 90 V118"/><path d="M290 90 V100"/><path d="M444 90 V118"/>
    </g>

    <text x="24" y="170" font-size="16" font-weight="bold">Usage.cs (source file)</text>
    <rect x="24" y="182" width="330" height="150" rx="6" fill="#111827" stroke="#4b5563"/>
    <g font-family="Consolas, Menlo, monospace" font-size="13">
      <text x="36" y="204" fill="#9ca3af">using PocketUnits;</text>
      <rect x="30" y="214" width="318" height="20" fill="#7f1d1d"/>
      <text x="36" y="229" fill="#fecaca">#region Convert10km</text>
      <rect x="30" y="236" width="318" height="40" fill="#14532d"/>
      <text x="36" y="251" fill="#bbf7d0">double miles = Converter.Convert(...);</text>
      <text x="36" y="269" fill="#bbf7d0">Console.WriteLine(miles...);</text>
      <rect x="30" y="278" width="318" height="20" fill="#7f1d1d"/>
      <text x="36" y="293" fill="#fecaca">#endregion</text>
      <text x="36" y="316" fill="#9ca3af">// other code stays out</text>
    </g>

    <path d="M360 257 H416" stroke="#9ca3af" stroke-width="2" fill="none"/>
    <path d="M416 257 l-9 -5 v10 z" fill="#9ca3af"/>
    <text x="364" y="245" font-size="12">extract</text>

    <text x="430" y="170" font-size="16" font-weight="bold">Rendered code block</text>
    <rect x="430" y="182" width="306" height="150" rx="6" fill="#111827" stroke="#4b5563"/>
    <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#bbf7d0">
      <text x="442" y="212">double miles = Converter.Convert(...);</text>
      <text x="442" y="232">Console.WriteLine(miles...);</text>
    </g>
    <g font-size="13" fill="#f3f4f6">
      <text x="442" y="268">Red lines: marker lines, dropped.</text>
      <text x="442" y="288">Green lines: the region body.</text>
      <text x="442" y="308">Common indentation is removed.</text>
    </g>
  </g>
</svg>
