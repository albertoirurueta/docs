<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-opengl-es-on-android-bookshelf-storyboard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Bookshelf GL on Android: from manifest to a rotating book</text>
<rect x="20" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="66" r="11" fill="#4F46E5"/>
<text x="36" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="101" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Declare ES 3.0 in the manifest</text>
<rect x="206" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="222" cy="66" r="11" fill="#4F46E5"/>
<text x="222" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="287" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Create the GLSurfaceView</text>
<rect x="392" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="408" cy="66" r="11" fill="#4F46E5"/>
<text x="408" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="473" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Draw the textured book quad</text>
<rect x="578" y="50" width="162" height="190" rx="10" fill="#F9FAFB" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="594" cy="66" r="11" fill="#4F46E5"/>
<text x="594" y="70.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="659" y="264" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Add a projection and rotate</text>
<text x="30" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">&lt;uses-feature</text>
<text x="30" y="116" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  android:glEsVersion=</text>
<text x="30" y="132" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  "0x00030000"</text>
<text x="30" y="148" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  android:required=</text>
<text x="30" y="164" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  "true" /&gt;</text>
<text x="216" y="100" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">val v = GLSurfaceView(</text>
<text x="216" y="116" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  this)</text>
<text x="216" y="132" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">v.setEGLContext</text>
<text x="216" y="148" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">  ClientVersion(3)</text>
<text x="216" y="164" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">v.setRenderer(r)</text>
<text x="216" y="180" font-size="10" font-weight="normal" fill="#374151" text-anchor="start" font-family="Menlo, Consolas, monospace">setContentView(v)</text>
<rect x="408" y="92" width="130" height="132" rx="6" fill="#111827" stroke="#4B5563" stroke-width="1"/>
<rect x="438" y="110" width="70" height="100" rx="2" fill="#B45309" stroke="#92400E" stroke-width="1"/>
<rect x="438" y="110" width="70" height="100" rx="2" fill="#B45309" stroke="#92400E" stroke-width="1"/>
