<text x="478" y="148" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle">Title</text>
<rect x="594" y="92" width="130" height="132" rx="6" fill="#111827" stroke="#4B5563" stroke-width="1"/>
<polygon points="623,120 683,108 693,196 633,210" fill="#B45309" stroke="#92400E" stroke-width="1.2"/>
<polygon points="683,108 708,118 716,184 693,196" fill="#7C2D12" stroke="#92400E" stroke-width="1.2"/>
<polygon points="623,120 683,108 708,118 648,130" fill="#FDE68A" stroke="#92400E" stroke-width="1.2"/>
<text x="380" y="290" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Each panel adds one step; the steps map to the Kotlin code later on this page.</text>
