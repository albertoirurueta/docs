<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-graphics-games-opengl-skeletal-animation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Per-frame skinning data flow, CPU to vertex shader</text>
<rect x="20" y="60" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="85.0" y="84.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">1 Clock</text>
<text x="85.0" y="100.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">time t</text>
<text x="85.0" y="116.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(seconds)</text>
<line x1="150" y1="95" x2="160" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-skeletal-animation)"/>
<rect x="160" y="60" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="225.0" y="84.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">2 Sample</text>
<text x="225.0" y="100.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">keyframes to</text>
<text x="225.0" y="116.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">local T, R, S</text>
<line x1="290" y1="95" x2="300" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-skeletal-animation)"/>
<rect x="300" y="60" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="365.0" y="84.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">3 Hierarchy</text>
<text x="365.0" y="100.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">local to global</text>
<text x="365.0" y="116.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">parent first</text>
<line x1="430" y1="95" x2="440" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-skeletal-animation)"/>
<rect x="440" y="60" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="505.0" y="84.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">4 Multiply</text>
<text x="505.0" y="100.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">global x inverse</text>
<text x="505.0" y="116.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">bind matrix</text>
<line x1="570" y1="95" x2="580" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-skeletal-animation)"/>
<rect x="580" y="60" width="130" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="645.0" y="84.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">5 Upload</text>
<text x="645.0" y="100.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">joint matrices</text>
<text x="645.0" y="116.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">to UBO</text>
<text x="380" y="160" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">GPU, once per vertex</text>
<rect x="40" y="180" width="200" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="140.0" y="204.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Vertex attributes</text>
<text x="140.0" y="219.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">POSITION, NORMAL, TEXCOORD_0</text>
<text x="140.0" y="234.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">JOINTS_0 (uvec4), WEIGHTS_0 (vec4)</text>
<rect x="280" y="180" width="200" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="204.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Vertex shader</text>
<text x="380.0" y="219.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">skin = w.x*J[j.x] + w.y*J[j.y]</text>
<text x="380.0" y="234.5" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">+ w.z*J[j.z] + w.w*J[j.w]</text>
<rect x="520" y="180" width="200" height="70" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="620.0" y="204.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Outputs</text>
<text x="620.0" y="219.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">gl_Position = P V skin pos</text>
<text x="620.0" y="234.5" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">normal = mat3(skin) n</text>
<line x1="240" y1="215" x2="280" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-skeletal-animation)"/>
<line x1="480" y1="215" x2="520" y2="215" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-graphics-games-opengl-skeletal-animation)"/>
<line x1="645" y1="130" x2="380" y2="180" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-graphics-games-opengl-skeletal-animation)"/>
<text x="655" y="150" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="start">UBO, binding 1</text>
<text x="380" y="290" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Steps 1 to 4 run on the CPU once per animated character per frame;</text>
<text x="380" y="310" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">step 5 is one buffer update; the blend runs in parallel in the vertex shader.</text>
<text x="380" y="340" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">Blend weights of a vertex sum to 1; unused influences carry weight 0.</text>
</svg>
