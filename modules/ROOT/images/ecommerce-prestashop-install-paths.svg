<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="currentColor">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <title id="t">Three ways to install PrestaShop and what must be done afterwards</title>
  <desc id="d">The web installer, the command-line installer and the Docker image all end in the same installer code, which creates the database and the shop. Afterwards the administrator checks that the admin folder was renamed and the install folder removed, enables HTTPS, switches to production mode and adds the web server rules.</desc>

  <rect x="20" y="16" width="860" height="44" rx="10" fill="#7f8c8d" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <text x="450" y="43" text-anchor="middle" font-weight="bold">Prerequisites: web server, PHP 8.1 to 8.5 with the required extensions, MySQL or MariaDB, an empty database</text>

  <rect x="20" y="92" width="270" height="92" rx="12" fill="#3498db" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="155" y="118" text-anchor="middle" font-weight="bold">A. Web installer</text>
  <text x="155" y="140" text-anchor="middle">upload the release zip, open</text>
  <text x="155" y="160" text-anchor="middle">/install in a browser (7 steps)</text>

  <rect x="20" y="198" width="270" height="92" rx="12" fill="#2ecc71" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="155" y="224" text-anchor="middle" font-weight="bold">B. Command line</text>
  <text x="155" y="246" text-anchor="middle">php install/index_cli.php</text>
  <text x="155" y="266" text-anchor="middle">with --domain, --db_*, --email ...</text>

  <rect x="20" y="304" width="270" height="92" rx="12" fill="#e67e22" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
  <text x="155" y="330" text-anchor="middle" font-weight="bold">C. Official Docker image</text>
  <text x="155" y="352" text-anchor="middle">PS_INSTALL_AUTO=1 and the DB_*,</text>
  <text x="155" y="372" text-anchor="middle">PS_DOMAIN and ADMIN_* variables</text>

  <rect x="350" y="170" width="200" height="140" rx="14" fill="#7f8c8d" fill-opacity="0.18" stroke="currentColor" stroke-width="2"/>
  <text x="450" y="200" text-anchor="middle" font-weight="bold" font-size="15">Installer code</text>
  <text x="450" y="224" text-anchor="middle">database and default data</text>
  <text x="450" y="244" text-anchor="middle">languages, theme, modules</text>
  <text x="450" y="264" text-anchor="middle">fixtures (demo catalogue)</text>
  <text x="450" y="290" text-anchor="middle" font-size="12" opacity="0.85">writes app/config/parameters.php</text>

  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <path d="M290 138 L320 138 L320 225 L348 225" marker-end="url(#ar)"/>
    <path d="M290 244 L348 244" marker-end="url(#ar)"/>
    <path d="M290 350 L320 350 L320 263 L348 263" marker-end="url(#ar)"/>
    <path d="M550 240 L588 240" marker-end="url(#ar)"/>
  </g>

  <rect x="590" y="92" width="290" height="304" rx="12" fill="#9b59b6" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
  <text x="735" y="118" text-anchor="middle" font-weight="bold">After the install</text>
  <text x="604" y="148" font-size="12.5">1. admin folder gets a random name</text>
  <text x="604" y="172" font-size="12.5">2. install/ folder removed (automatic in 9.2)</text>
  <text x="604" y="196" font-size="12.5">3. HTTPS, then Enable SSL in the back office</text>
  <text x="604" y="220" font-size="12.5">4. production mode (_PS_MODE_DEV_ off)</text>
  <text x="604" y="244" font-size="12.5">5. web server rules (.htaccess or Nginx)</text>
  <text x="604" y="268" font-size="12.5">6. backups, cron, mail, modules updated</text>
  <text x="604" y="300" font-size="12" opacity="0.85">Moving servers or changing the domain:</text>
  <text x="604" y="318" font-size="12" opacity="0.85">shop_url row, PS_SHOP_DOMAIN keys,</text>
  <text x="604" y="336" font-size="12" opacity="0.85">parameters.php, regenerate .htaccess,</text>
  <text x="604" y="354" font-size="12" opacity="0.85">clear the cache</text>

  <rect x="20" y="420" width="860" height="36" rx="8" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5" stroke-width="1"/>
  <text x="450" y="443" text-anchor="middle" font-size="13">PrestaShop Flashlight and docker compose are variations of path C; Nginx with PHP-FPM changes only the web server</text>
</svg>
