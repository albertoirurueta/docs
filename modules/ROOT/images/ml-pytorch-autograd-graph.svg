<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="t d">
  <title id="t">Autograd graph for a small loss</title>
  <desc id="d">Leaf tensors x, w and b feed a multiply and add node, giving non-leaf z, then a square node giving the scalar loss. Backward flows from loss to the leaves, which accumulate gradients in their grad fields.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="718" height="258" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Forward builds the graph, backward walks it</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" text-anchor="middle" fill="#0F172A" stroke-width="2">
    <rect x="30" y="60" width="110" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="85" y="85" stroke="none">w (leaf)</text>
    <rect x="30" y="120" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8"/><text x="85" y="145" stroke="none">x (data)</text>
    <rect x="30" y="180" width="110" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E"/><text x="85" y="205" stroke="none">b (leaf)</text>
    <rect x="230" y="120" width="130" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/><text x="295" y="145" stroke="none">z = w*x + b</text>
    <rect x="440" y="120" width="110" height="40" rx="6" fill="#DBEAFE" stroke="#1D4ED8"/><text x="495" y="145" stroke="none">z**2</text>
    <rect x="610" y="120" width="90" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="655" y="145" stroke="none">loss</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M140 80 L228 130"/><path d="M140 140 L228 140"/><path d="M140 200 L228 150"/>
    <path d="M360 140 L438 140"/><path d="M550 140 L608 140"/>
  </g>
  <text x="295" y="115" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">grad_fn=AddBackward0</text>
  <text x="495" y="115" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">grad_fn=PowBackward0</text>
  <path d="M655 175 L100 240" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
  <text x="380" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B45309">loss.backward(): gradients accumulate into w.grad and b.grad</text>
</svg>
