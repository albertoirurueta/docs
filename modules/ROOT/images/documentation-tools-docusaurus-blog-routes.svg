<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">From blog files to blog routes</title>
  <desc id="d">Posts, authors.yml and tags.yml in the blog folder feed the blog plugin, which generates the list, post, tag, author and archive pages and the RSS, Atom and JSON feeds.</desc>
  <rect x="0" y="0" width="760" height="360" rx="14" fill="#1f2a37"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#f3f4f6">
    <text x="30" y="34" font-size="16" font-weight="bold">blog folder</text>
    <rect x="30" y="50" width="200" height="56" rx="8" fill="#3b82a0" stroke="#9ad0e6"/>
    <text x="130" y="74" text-anchor="middle">2026-10-01-pocket-units-1-0/</text>
    <text x="130" y="94" text-anchor="middle">index.md (post)</text>
    <rect x="30" y="122" width="200" height="56" rx="8" fill="#3b82a0" stroke="#9ad0e6"/>
    <text x="130" y="146" text-anchor="middle">2026-10-15-converting-</text>
    <text x="130" y="166" text-anchor="middle">lengths.mdx (post)</text>
    <rect x="30" y="194" width="200" height="40" rx="8" fill="#7a6a2f" stroke="#e6d58a"/>
    <text x="130" y="219" text-anchor="middle">authors.yml</text>
    <rect x="30" y="250" width="200" height="40" rx="8" fill="#7a6a2f" stroke="#e6d58a"/>
    <text x="130" y="275" text-anchor="middle">tags.yml</text>

    <rect x="290" y="100" width="170" height="110" rx="10" fill="#5b4b9a" stroke="#c4b8f0"/>
    <text x="375" y="140" text-anchor="middle" font-weight="bold">blog plugin</text>
    <text x="375" y="162" text-anchor="middle">plugin-content-blog</text>
    <text x="375" y="184" text-anchor="middle">(part of the classic preset)</text>

    <text x="520" y="34" font-size="16" font-weight="bold">generated output</text>
    <rect x="520" y="50" width="210" height="40" rx="8" fill="#3f7d4e" stroke="#a6dbb2"/>
    <text x="625" y="75" text-anchor="middle">/blog (paginated list)</text>
    <rect x="520" y="100" width="210" height="40" rx="8" fill="#3f7d4e" stroke="#a6dbb2"/>
    <text x="625" y="125" text-anchor="middle">/blog/pocket-units-1-0 (post)</text>
    <rect x="520" y="150" width="210" height="40" rx="8" fill="#3f7d4e" stroke="#a6dbb2"/>
    <text x="625" y="175" text-anchor="middle">/blog/tags and /blog/archive</text>
    <rect x="520" y="200" width="210" height="40" rx="8" fill="#3f7d4e" stroke="#a6dbb2"/>
    <text x="625" y="225" text-anchor="middle">/blog/authors (page: true)</text>
    <rect x="520" y="250" width="210" height="40" rx="8" fill="#9a5b3b" stroke="#f0c0a0"/>
    <text x="625" y="275" text-anchor="middle">rss.xml, atom.xml, feed.json</text>
    <text x="625" y="312" text-anchor="middle" font-size="12">feeds exist only after docusaurus build</text>

    <g stroke="#e5e7eb" stroke-width="2" fill="none">
      <path d="M230 78 L290 140"/><path d="M230 150 L290 155"/><path d="M230 214 L290 175"/><path d="M230 270 L290 190"/>
      <path d="M460 130 L520 70"/><path d="M460 140 L520 120"/><path d="M460 160 L520 170"/><path d="M460 175 L520 220"/><path d="M460 190 L520 270"/>
    </g>
  </g>
</svg>
