<g font-size="12" fill="#374151" text-anchor="middle"><text x="230" y="112">While hovering</text><text x="490" y="112">Mouse down</text><text x="490" y="168">Mouse leave</text><text x="230" y="242">While hovering</text><text x="490" y="242">Mouse down</text><text x="490" y="298">Mouse leave</text></g>
