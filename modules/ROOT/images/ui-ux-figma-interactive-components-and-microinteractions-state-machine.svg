<svg viewBox="0 0 720 340" width="720" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="720" height="340" fill="#FFFFFF"/>
<text x="360" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Variant connections of the Add to shelf button</text>
<g stroke-width="2" stroke="#4F46E5" fill="#EEF2FF"><rect x="30" y="100" width="140" height="60" rx="12"/><rect x="290" y="100" width="140" height="60" rx="12"/><rect x="550" y="100" width="140" height="60" rx="12"/></g>
<g stroke-width="2" stroke="#047857" fill="#D1FAE5"><rect x="30" y="230" width="140" height="60" rx="12"/><rect x="290" y="230" width="140" height="60" rx="12"/><rect x="550" y="230" width="140" height="60" rx="12"/></g>
<g font-size="13" font-weight="bold" text-anchor="middle" fill="#1F2937"><text x="100" y="135">Default</text><text x="360" y="135">Hover</text><text x="620" y="135">Pressed</text><text x="100" y="265">Default</text><text x="360" y="265">Hover</text><text x="620" y="265">Pressed</text></g>
<g font-size="12" fill="#3730A3" text-anchor="start"><text x="30" y="90" font-weight="bold">status = unsaved</text></g><g font-size="12" fill="#065F46"><text x="30" y="220" font-weight="bold">status = saved</text></g>
<g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M172,120 L288,120" marker-end="url(#ah)"/><path d="M432,120 L548,120" marker-end="url(#ah)"/><path d="M548,150 L432,150" marker-end="url(#ah)" stroke-dasharray="4 3"/><path d="M172,250 L288,250" marker-end="url(#ah)"/><path d="M432,250 L548,250" marker-end="url(#ah)"/><path d="M548,280 L432,280" marker-end="url(#ah)" stroke-dasharray="4 3"/>
