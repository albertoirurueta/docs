<svg viewBox="0 0 760 620" width="760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Same feature, two stacks: the TrailMate trail list with a favorite toggle</text>

  <!-- Column headers -->
  <rect x="30" y="46" width="330" height="34" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="195" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a3a6b">Views, Fragments, Activities</text>
  <rect x="400" y="46" width="330" height="34" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="565" y="68" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d4c22">Jetpack Compose</text>

  <!-- Views column stack -->
  <rect x="30" y="94" width="330" height="42" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="195" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">MainActivity : AppCompatActivity</text>

  <rect x="30" y="150" width="330" height="42" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="195" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">TrailListFragment</text>

  <rect x="30" y="206" width="330" height="52" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="195" y="227" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">RecyclerView + TrailAdapter</text>
  <text x="195" y="245" text-anchor="middle" font-size="11" fill="#3c4043">ListAdapter&lt;Trail, TrailViewHolder&gt;, DiffUtil</text>

  <rect x="30" y="272" width="330" height="52" rx="8" fill="#ffffff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="195" y="293" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">ItemTrailBinding (XML + ViewBinding)</text>
  <text x="195" y="311" text-anchor="middle" font-size="11" fill="#3c4043">imperative bind(trail) mutates views in place</text>

  <rect x="30" y="338" width="330" height="42" rx="8" fill="#fff3e0" stroke="#f29900" stroke-width="1.5"/>
  <text x="195" y="363" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">Click listener calls viewModel.onToggleFavorite(id)</text>

  <path d="M 195 380 L 195 406" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrowMid1)"/>

  <rect x="30" y="410" width="330" height="42" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
  <text x="195" y="435" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">notifyItemChanged(position) redraws one row</text>

  <!-- Compose column stack -->
  <rect x="400" y="94" width="330" height="42" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="565" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">MainActivity : ComponentActivity</text>

  <rect x="400" y="150" width="330" height="42" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="565" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">TrailListScreen(uiState)</text>

  <rect x="400" y="206" width="330" height="52" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="565" y="227" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">LazyColumn { items(trails, key = Trail::id) }</text>
  <text x="565" y="245" text-anchor="middle" font-size="11" fill="#3c4043">TrailCard composable per item</text>

  <rect x="400" y="272" width="330" height="52" rx="8" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="565" y="293" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">TrailCard(trail, onToggleFavorite)</text>
  <text x="565" y="311" text-anchor="middle" font-size="11" fill="#3c4043">declares what a row looks like, given state</text>

  <rect x="400" y="338" width="330" height="42" rx="8" fill="#fff3e0" stroke="#f29900" stroke-width="1.5"/>
  <text x="565" y="363" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">IconButton onClick calls onToggleFavorite(id)</text>

  <path d="M 565 380 L 565 406" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrowMid2)"/>

  <rect x="400" y="410" width="330" height="42" rx="8" fill="#f3e8fd" stroke="#8430ce" stroke-width="1.5"/>
  <text x="565" y="435" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">New TrailListUiState recomposes only that TrailCard</text>

  <!-- Shared bottom: ViewModel -->
  <path d="M 195 452 L 195 480 L 380 480" fill="none" stroke="#5f6368" stroke-width="2"/>
  <path d="M 565 452 L 565 480 L 380 480" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrowShared)"/>
  <rect x="230" y="486" width="300" height="52" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="380" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a6b">TrailListViewModel (shared)</text>
  <text x="380" y="526" text-anchor="middle" font-size="11" fill="#3c4043">StateFlow&lt;TrailListUiState&gt;, onToggleFavorite()</text>

  <path d="M 380 538 L 380 560" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrowShared)"/>
  <rect x="230" y="564" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="380" y="589" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1a1a">TrailRepository.toggleFavorite(id) -&gt; Room -&gt; Flow</text>

  <defs>
    <marker id="arrowMid1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowMid2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowShared" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5f6368"/>
    </marker>
  </defs>
</svg>
