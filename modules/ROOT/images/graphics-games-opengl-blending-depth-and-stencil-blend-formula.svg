<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4F46E5"/></marker><marker id="ah2-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Blending: how source and destination colours combine</text>
<rect x="30" y="60" width="150" height="100" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<rect x="46" y="76" width="118" height="40" rx="6" fill="#EF4444" opacity="0.5" stroke="#4B5563"/>
<text x="105" y="136" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">source (fragment)</text>
<text x="105" y="152" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle">Cs = (1, 0, 0)  As = 0.5</text>
<rect x="230" y="60" width="150" height="100" rx="10" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<rect x="246" y="76" width="118" height="40" rx="6" fill="#2563EB" stroke="#4B5563"/>
<text x="305" y="136" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">destination (framebuffer)</text>
<text x="305" y="152" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle">Cd = (0, 0, 1)</text>
<rect x="430" y="60" width="150" height="100" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<rect x="446" y="76" width="118" height="40" rx="6" fill="#7F1D9F" stroke="#4B5563"/>
<text x="505" y="136" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">result</text>
<text x="505" y="152" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="middle">(0.5, 0, 0.5)</text>
<text x="205" y="116" font-size="26" font-weight="bold" fill="#1F2937" text-anchor="middle">+</text>
<text x="405" y="116" font-size="26" font-weight="bold" fill="#1F2937" text-anchor="middle">=</text>
<rect x="30" y="190" width="700" height="76" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="216" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">result = Cs * Fs + Cd * Fd    (equation GL_FUNC_ADD, the default)</text>
<text x="380" y="240" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Straight alpha: glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA)   Fs = As, Fd = 1 - As</text>
<text x="380" y="258" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Premultiplied alpha: glBlendFunc(GL_ONE, GL_ONE_MINUS_SRC_ALPHA)   colours already multiplied by alpha</text>
<rect x="30" y="286" width="700" height="50" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380" y="308" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Other equations: GL_FUNC_SUBTRACT, GL_FUNC_REVERSE_SUBTRACT, GL_MIN, GL_MAX (factors ignored for MIN and MAX)</text>
<text x="380" y="326" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Additive light and particles: glBlendFunc(GL_SRC_ALPHA, GL_ONE)</text>
</svg>
