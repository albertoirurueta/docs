<text x="95.0" y="86.2" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Window toolkit</text>
<text x="95.0" y="102.2" text-anchor="middle" font-size="12" fill="#374151">GLFW or SDL3</text>
<rect x="20" y="150" width="150" height="150" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="95.0" y="191.3" text-anchor="middle" font-size="11" fill="#374151">Native window</text>
<text x="95.0" y="206.3" text-anchor="middle" font-size="11" fill="#374151">Win32 HWND</text>
<text x="95.0" y="221.3" text-anchor="middle" font-size="11" fill="#374151">Wayland wl_surface</text>
<text x="95.0" y="236.3" text-anchor="middle" font-size="11" fill="#374151">Xcb or Xlib window</text>
<text x="95.0" y="251.3" text-anchor="middle" font-size="11" fill="#374151">ANativeWindow</text>
<text x="95.0" y="266.4" text-anchor="middle" font-size="11" fill="#374151">CAMetalLayer</text>
<line x1="95" y1="120" x2="95" y2="148" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-chain)"/>
<rect x="205" y="60" width="180" height="240" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="295.0" y="138.8" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Platform call</text>
<text x="295.0" y="153.8" text-anchor="middle" font-size="11" fill="#92400E">vkCreateWin32SurfaceKHR</text>
<text x="295.0" y="168.8" text-anchor="middle" font-size="11" fill="#92400E">vkCreateWaylandSurfaceKHR</text>
<text x="295.0" y="183.8" text-anchor="middle" font-size="11" fill="#92400E">vkCreateXcbSurfaceKHR</text>
<text x="295.0" y="198.8" text-anchor="middle" font-size="11" fill="#92400E">vkCreateAndroidSurfaceKHR</text>
<text x="295.0" y="213.8" text-anchor="middle" font-size="11" fill="#92400E">vkCreateMetalSurfaceEXT</text>
<text x="295.0" y="228.8" text-anchor="middle" font-size="11" fill="#92400E">(or the toolkit helper)</text>
<line x1="170" y1="225" x2="203" y2="225" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-chain)"/>
