<text x="490.0" y="107.2" text-anchor="middle" font-size="12" fill="#3730A3">VK_KHR_surface</text>
<line x1="385" y1="95" x2="413" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-chain)"/>
<rect x="415" y="160" width="150" height="140" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="490.0" y="203.8" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Queries</text>
<text x="490.0" y="218.8" text-anchor="middle" font-size="11" fill="#374151">SurfaceSupportKHR</text>
<text x="490.0" y="233.8" text-anchor="middle" font-size="11" fill="#374151">SurfaceCapabilitiesKHR</text>
<text x="490.0" y="248.8" text-anchor="middle" font-size="11" fill="#374151">SurfaceFormatsKHR</text>
<text x="490.0" y="263.9" text-anchor="middle" font-size="11" fill="#374151">SurfacePresentModesKHR</text>
<line x1="490" y1="130" x2="490" y2="158" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-chain)"/>
<rect x="600" y="60" width="140" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="670.0" y="91.2" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">VkSwapchainKHR</text>
<text x="670.0" y="107.2" text-anchor="middle" font-size="12" fill="#3730A3">device extension</text>
<line x1="565" y1="95" x2="598" y2="95" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-chain)"/>
<line x1="565" y1="230" x2="670" y2="132" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-wsi-chain)"/>
<rect x="600" y="160" width="140" height="140" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="670.0" y="203.8" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">VkImage x N</text>
<text x="670.0" y="218.8" text-anchor="middle" font-size="11" fill="#065F46">owned by the</text>
<text x="670.0" y="233.8" text-anchor="middle" font-size="11" fill="#065F46">swapchain</text>
<text x="670.0" y="248.8" text-anchor="middle" font-size="11" fill="#065F46">+ VkImageView</text>
<text x="670.0" y="263.9" text-anchor="middle" font-size="11" fill="#065F46">per image</text>
<line x1="670" y1="130" x2="670" y2="158" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-wsi-chain)"/>
<text x="380" y="340" text-anchor="middle" font-size="12" fill="#374151">Surface queries decide the swapchain parameters; the swapchain creates the images you render into.</text>
</svg>
