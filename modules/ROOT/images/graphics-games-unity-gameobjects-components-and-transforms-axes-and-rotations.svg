<svg viewBox="0 0 760 430" width="760" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-go-axes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="430" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Unity axes, Euler angles and quaternions</text>
<rect x="20" y="44" width="230" height="370" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="135" y="66" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">Left-handed axes</text>
<line x1="135" y1="260" x2="210" y2="260" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#ah-go-axes)"/>
<text x="215" y="276" text-anchor="start" font-size="11" fill="#B91C1C">X right</text>
<line x1="135" y1="260" x2="135" y2="140" stroke="#047857" stroke-width="2.5" marker-end="url(#ah-go-axes)"/>
<text x="135" y="132" text-anchor="middle" font-size="11" fill="#047857">Y up</text>
<line x1="135" y1="260" x2="190" y2="210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-go-axes)"/>
<text x="195" y="204" text-anchor="start" font-size="11" fill="#2563EB">Z forward (away)</text>
<text x="135" y="330" text-anchor="middle" font-size="11" fill="#374151">1 unit = 1 metre</text>
<text x="135" y="346" text-anchor="middle" font-size="11" fill="#374151">Rotating X towards Y</text>
<text x="135" y="362" text-anchor="middle" font-size="11" fill="#374151">is counter-clockwise looking</text>
<text x="135" y="378" text-anchor="middle" font-size="11" fill="#374151">along +Z</text>
<rect x="265" y="44" width="230" height="370" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380" y="66" text-anchor="middle" font-size="13" fill="#3730A3" font-weight="bold">Euler angles</text>
<text x="380" y="100" text-anchor="middle" font-size="12" fill="#1F2937">Three angles in degrees:</text>
<text x="380" y="118" text-anchor="middle" font-size="12" fill="#1F2937">Rotation (X, Y, Z)</text>
<rect x="290" y="150" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="380" y="169" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">1  Z (roll)</text>
<text x="380" y="185" text-anchor="middle" font-size="11" fill="#374151">applied first</text>
<line x1="380" y1="194" x2="380" y2="206" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-go-axes)"/>
<rect x="290" y="206" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="380" y="225" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">2  X (pitch)</text>
<text x="380" y="241" text-anchor="middle" font-size="11" fill="#374151">applied second</text>
<line x1="380" y1="250" x2="380" y2="262" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-go-axes)"/>
<rect x="290" y="262" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="380" y="281" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">3  Y (yaw)</text>
<text x="380" y="297" text-anchor="middle" font-size="11" fill="#374151">applied last</text>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="#374151">Fine for the Inspector</text>
<text x="380" y="346" text-anchor="middle" font-size="11" fill="#374151">and for small tweaks.</text>
<text x="380" y="362" text-anchor="middle" font-size="11" fill="#374151">Do not accumulate them</text>
<text x="380" y="378" text-anchor="middle" font-size="11" fill="#374151">in scripts.</text>
<rect x="510" y="44" width="230" height="370" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="625" y="66" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Gimbal lock and quaternions</text>
<rect x="540" y="92" width="170" height="76" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
<text x="625" y="114" text-anchor="middle" font-size="11" fill="#92400E">Pitch = 90 degrees:</text>
<text x="625" y="130" text-anchor="middle" font-size="11" fill="#92400E">yaw and roll turn</text>
<text x="625" y="146" text-anchor="middle" font-size="11" fill="#92400E">about the same axis</text>
<rect x="540" y="184" width="170" height="76" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
<text x="625" y="206" text-anchor="middle" font-size="11" fill="#065F46">Quaternion (x, y, z, w)</text>
<text x="625" y="222" text-anchor="middle" font-size="11" fill="#065F46">stored by Transform;</text>
<text x="625" y="238" text-anchor="middle" font-size="11" fill="#065F46">no gimbal lock</text>
<text x="625" y="290" text-anchor="middle" font-size="11" fill="#374151">Build with Quaternion.Euler,</text>
<text x="625" y="307" text-anchor="middle" font-size="11" fill="#374151">AngleAxis or LookRotation.</text>
<text x="625" y="324" text-anchor="middle" font-size="11" fill="#374151">Combine with q1 * q2:</text>
<text x="625" y="341" text-anchor="middle" font-size="11" fill="#374151">the right operand is</text>
<text x="625" y="358" text-anchor="middle" font-size="11" fill="#374151">applied first.</text>
<text x="625" y="375" text-anchor="middle" font-size="11" fill="#374151">Do not edit x, y, z, w</text>
<text x="625" y="392" text-anchor="middle" font-size="11" fill="#374151">by hand.</text>
</svg>
