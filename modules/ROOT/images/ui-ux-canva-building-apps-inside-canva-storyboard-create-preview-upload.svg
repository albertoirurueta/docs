<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4B5563"/></marker></defs>
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: create, preview and upload Bookshelf Covers</text>
  <g stroke="#4F46E5" stroke-width="1.5" fill="#FFFFFF"><rect x="12" y="50" width="140" height="250" rx="10"/><rect x="164" y="50" width="140" height="250" rx="10"/><rect x="316" y="50" width="140" height="250" rx="10"/><rect x="468" y="50" width="140" height="250" rx="10"/><rect x="620" y="50" width="128" height="250" rx="10"/></g>
  <g stroke="#4B5563" stroke-width="1.5" fill="none"><path d="M153,175 L163,175" marker-end="url(#ah)"/><path d="M305,175 L315,175" marker-end="url(#ah)"/><path d="M457,175 L467,175" marker-end="url(#ah)"/><path d="M609,175 L619,175" marker-end="url(#ah)"/></g>
  <!-- 1 terminal login/create -->
  <rect x="24" y="96" width="116" height="110" rx="6" fill="#1F2937"/>
  <g font-size="11" fill="#FFFFFF" font-family="Menlo, Consolas, monospace"><text x="30" y="116">canva login</text><text x="30" y="136">canva apps create</text><text x="30" y="152" fill="#FDE68A">"Bookshelf Covers"</text><text x="30" y="172">--template=</text><text x="30" y="188">hello_world</text></g>
  <circle cx="30" cy="68" r="11" fill="#4F46E5"/><text x="30" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="82" y="322" font-size="12" fill="#374151" text-anchor="middle">Log in, then create</text><text x="82" y="338" font-size="12" fill="#374151" text-anchor="middle">the app from a template</text>
  <!-- 2 start -->
  <rect x="176" y="96" width="116" height="80" rx="6" fill="#1F2937"/>
  <g font-size="11" fill="#FFFFFF" font-family="Menlo, Consolas, monospace"><text x="182" y="116">canva apps start</text><text x="182" y="138" fill="#A7F3D0">Dev server ready</text><text x="182" y="156" fill="#A7F3D0">localhost:8080</text></g>
  <rect x="176" y="190" width="116" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="234" y="207" font-size="11" fill="#92400E" text-anchor="middle">Enable the Design</text><text x="234" y="221" font-size="11" fill="#92400E" text-anchor="middle">Editor intent</text>
  <circle cx="182" cy="68" r="11" fill="#4F46E5"/><text x="182" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="234" y="322" font-size="12" fill="#374151" text-anchor="middle">Start the dev server and</text><text x="234" y="338" font-size="12" fill="#374151" text-anchor="middle">enable the intent</text>
  <!-- 3 preview in editor -->
  <rect x="326" y="96" width="120" height="130" rx="6" fill="#F9FAFB" stroke="#9CA3AF"/>
  <rect x="326" y="96" width="46" height="130" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="332" y="106" width="34" height="14" rx="3" fill="#4F46E5"/><rect x="332" y="126" width="34" height="8" rx="2" fill="#FFFFFF" stroke="#9CA3AF"/><rect x="332" y="140" width="34" height="8" rx="2" fill="#FFFFFF" stroke="#9CA3AF"/>
  <rect x="384" y="112" width="52" height="64" fill="#FFFFFF" stroke="#6B7280"/><rect x="394" y="130" width="12" height="38" fill="#EEF2FF" stroke="#4F46E5"/>
  <text x="386" y="206" font-size="11" fill="#374151">Open preview URL</text>
  <circle cx="334" cy="68" r="11" fill="#4F46E5"/><text x="334" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="386" y="322" font-size="12" fill="#374151" text-anchor="middle">Preview the app in the</text><text x="386" y="338" font-size="12" fill="#374151" text-anchor="middle">editor and click a cover</text>
  <!-- 4 build -->
  <rect x="480" y="96" width="116" height="80" rx="6" fill="#1F2937"/>
  <g font-size="11" fill="#FFFFFF" font-family="Menlo, Consolas, monospace"><text x="486" y="116">canva apps doctor</text><text x="486" y="136">canva apps build</text><text x="486" y="156" fill="#A7F3D0">dist/app.js</text></g>
  <rect x="480" y="190" width="116" height="40" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/><text x="538" y="207" font-size="11" fill="#374151" text-anchor="middle">Bundle checked and</text><text x="538" y="221" font-size="11" fill="#374151" text-anchor="middle">built for upload</text>
  <circle cx="486" cy="68" r="11" fill="#4F46E5"/><text x="486" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="538" y="322" font-size="12" fill="#374151" text-anchor="middle">Run doctor, then build</text><text x="538" y="338" font-size="12" fill="#374151" text-anchor="middle">the production bundle</text>
  <!-- 5 upload -->
  <rect x="630" y="96" width="108" height="80" rx="6" fill="#1F2937"/>
  <g font-size="11" fill="#FFFFFF" font-family="Menlo, Consolas, monospace"><text x="636" y="116">canva apps</text><text x="636" y="132">upload</text><text x="636" y="154" fill="#A7F3D0">Uploaded</text></g>
  <rect x="630" y="190" width="108" height="40" rx="6" fill="#FEF3C7" stroke="#B45309"/><text x="684" y="207" font-size="11" fill="#92400E" text-anchor="middle">Bundle in Developer</text><text x="684" y="221" font-size="11" fill="#92400E" text-anchor="middle">Portal, not yet public</text>
  <circle cx="638" cy="68" r="11" fill="#B45309"/><text x="638" y="72" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="684" y="322" font-size="12" fill="#374151" text-anchor="middle">Upload the bundle;</text><text x="684" y="338" font-size="12" fill="#374151" text-anchor="middle">submit when ready</text>
  <text x="380" y="382" font-size="11" fill="#6B7280" text-anchor="middle">Schematic of a generic editor and app, not a screenshot of any product.</text>
</svg>
