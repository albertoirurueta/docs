<svg viewBox="0 0 760 456" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="456" fill="#ffffff"/>

  <text x="380" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Inside a bool query: which clauses score, which only filter</text>
  <text x="380" y="48" font-size="12" fill="#666666" text-anchor="middle">must / should run in query context and add to _score &#8226; filter / must_not run in filter context, cached and unscored</text>

  <line x1="380" y1="62" x2="380" y2="352" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT: query context, scored -->
  <text x="200" y="82" font-size="14" font-weight="bold" fill="#2f5424" text-anchor="middle">Query context &#8212; scored</text>

  <rect x="36" y="96" width="328" height="72" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="52" y="118" font-size="12.5" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">must</text>
  <text x="52" y="139" font-size="11" fill="#222222">every clause must match (AND);</text>
  <text x="52" y="157" font-size="11" fill="#222222">each match adds to _score.</text>

  <rect x="36" y="180" width="328" height="90" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="52" y="202" font-size="12.5" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">should</text>
  <text x="52" y="223" font-size="11" fill="#222222">optional; each match adds to _score.</text>
  <text x="52" y="241" font-size="11" fill="#222222">minimum_should_match sets how many</text>
  <text x="52" y="259" font-size="11" fill="#222222">must match (0 if must/filter present, else 1).</text>

  <rect x="36" y="286" width="328" height="46" fill="#ffffff" stroke="#2f5424" stroke-width="1.2"/>
  <text x="200" y="314" font-size="11.5" fill="#2f5424" text-anchor="middle" font-family="'Courier New', monospace">_score = &#931; (must + matched should)</text>

  <!-- RIGHT: filter context, unscored -->
  <text x="560" y="82" font-size="14" font-weight="bold" fill="#1c4b73" text-anchor="middle">Filter context &#8212; unscored, cacheable</text>

  <rect x="396" y="96" width="328" height="72" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="412" y="118" font-size="12.5" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">filter</text>
  <text x="412" y="139" font-size="11" fill="#222222">must match, but scores nothing;</text>
  <text x="412" y="157" font-size="11" fill="#222222">the matching set is reused via the cache.</text>

  <rect x="396" y="180" width="328" height="90" fill="#f4f4f4" stroke="#999999" stroke-width="1.2"/>
  <text x="412" y="202" font-size="12.5" font-weight="bold" fill="#222222" font-family="'Courier New', monospace">must_not</text>
  <text x="412" y="223" font-size="11" fill="#222222">must NOT match; also filter context,</text>
  <text x="412" y="241" font-size="11" fill="#222222">so unscored and cacheable.</text>

  <rect x="396" y="286" width="328" height="46" fill="#ffffff" stroke="#1c4b73" stroke-width="1.2"/>
  <text x="560" y="314" font-size="11.5" fill="#1c4b73" text-anchor="middle" font-family="'Courier New', monospace">contributes 0 to _score &#8226; cached bitset</text>

  <!-- bottom strip -->
  <rect x="36" y="360" width="688" height="80" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
  <text x="52" y="384" font-size="12.5" font-weight="bold" fill="#222222">Rule of thumb</text>
  <text x="52" y="406" font-size="11.5" fill="#222222">Put a clause in must / should only when its match quality should move the ranking.</text>
  <text x="52" y="426" font-size="11.5" fill="#222222">Everything else &#8212; exact terms, ranges, dates, geo &#8212; goes in filter / must_not: faster and cached.</text>
</svg>
