<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="t d">
  <title id="t">Physical and logical devices</title>
  <desc id="d">One physical GPU is split into two logical GPUs with memory limits by set_logical_device_configuration; ops are placed on a logical device by name such as GPU:0 or GPU:1.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="718" height="258" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Physical devices become logical devices</text>
  <rect x="30" y="70" width="190" height="110" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="125" y="100" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#0F172A">PhysicalDevice</text>
  <text x="125" y="122" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">/physical_device:GPU:0</text>
  <text x="125" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">one real GPU</text>
  <line x1="222" y1="110" x2="320" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="222" y1="140" x2="320" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="324" y="60" width="190" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="419" y="86" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">LogicalDevice GPU:0</text>
  <text x="419" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">memory_limit=2048 MB</text>
  <rect x="324" y="140" width="190" height="60" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="419" y="166" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#0F172A">LogicalDevice GPU:1</text>
  <text x="419" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">memory_limit=2048 MB</text>
  <line x1="516" y1="90" x2="580" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="516" y1="170" x2="580" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="584" y="68" width="110" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="639" y="94" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#0F172A">tf.device GPU:0</text>
  <rect x="584" y="148" width="110" height="44" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="639" y="174" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#0F172A">tf.device GPU:1</text>
  <text x="360" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Configure before the runtime initializes; splitting must happen before any op runs.</text>
</svg>
