<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-apis-vs-engines-layers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From hardware to game: the layers between your code and the pixels</text>
<rect x="70" y="52" width="400" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270.0" y="77.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Your game</text>
<text x="270.0" y="92.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Bookshelf: rules, levels, content</text>
<text x="490" y="86" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">You write: rules, scenes, assets</text>
<rect x="70" y="120" width="400" height="58" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270.0" y="145.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Engine or framework</text>
<text x="270.0" y="160.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Unity, Unreal, three.js, RealityKit</text>
<text x="490" y="154" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Adds: editor, assets, physics, audio</text>
<rect x="70" y="188" width="400" height="58" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="270.0" y="213.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Graphics API</text>
<text x="270.0" y="228.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">OpenGL, Vulkan, Metal, WebGPU, D3D12</text>
<text x="490" y="222" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Defines: objects, commands, shaders</text>
<rect x="70" y="256" width="400" height="58" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="270.0" y="281.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Driver and operating system</text>
<text x="270.0" y="296.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Vendor driver, window system, swap chain</text>
<text x="490" y="290" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Compiles shaders, schedules work</text>
<rect x="70" y="324" width="400" height="58" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="270.0" y="349.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Hardware</text>
<text x="270.0" y="364.7" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">GPU, CPU, memory, display</text>
<text x="490" y="358" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Executes: SIMT cores, rasterisers</text>
<line x1="40" y1="370" x2="40" y2="60" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-apis-vs-engines-layers)"/>
<text x="30" y="215" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="middle" transform="rotate(-90 30 215)">more productivity, less control</text>
</svg>
