<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 255" width="1080" height="255" role="img" aria-labelledby="sap-abap-guide-write-abap-unit-tests-06-result-title" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace">
<title id="sap-abap-guide-write-abap-unit-tests-06-result-title">Terminal showing the result of the guide: npm test lists the greeter test and the four claim tests, and echo $? prints 0</title>
<g><rect x="0" y="0" width="1080" height="255" fill="#181818" stroke="#2b2b2b" stroke-width="1"/><rect x="0" y="0" width="1080" height="32" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
<text x="540" y="21" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9d9d9d" text-anchor="middle">Terminal</text>
<rect x="0" y="32" width="1080" height="223" fill="#181818"/>
<text x="16" y="62" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ npm test</text>
<text x="16" y="83" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#cccccc">Output files: 936 written</text>
<text x="16" y="104" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">ZCL_GREETER: running ltcl_greeter-&gt;greets_by_name</text>
<text x="16" y="125" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">ZUT_CLAIM_LIMIT: running ltcl_limit-&gt;small_amount_is_accepted</text>
<text x="16" y="146" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">ZUT_CLAIM_LIMIT: running ltcl_limit-&gt;large_amount_is_rejected</text>
<text x="16" y="167" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">ZUT_CLAIM_LIMIT: running ltcl_limit-&gt;amount_at_limit_is_accepted</text>
<text x="16" y="188" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">ZUT_CLAIM_LIMIT: running ltcl_limit-&gt;status_text_follows_limit</text>
<text x="16" y="209" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#9d9d9d">$ echo $?</text>
<text x="16" y="230" font-family="Menlo, Monaco, Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0dbc79">0</text></g>
</svg>
