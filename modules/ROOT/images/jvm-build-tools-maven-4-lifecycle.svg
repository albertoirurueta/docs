<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">The Maven 4 default lifecycle as a tree of phases (4.0.0-rc-7)</text>
<text x="480" y="48" font-size="12" fill="#666666" text-anchor="middle">Every box also has a before: and an after: hook. Inner boxes are children of the outer one; arrows read as "runs after".</text>
<rect x="16" y="66" width="928" height="556" rx="6" fill="#fafafa" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="28" y="86" font-size="13" font-weight="bold" fill="#222222">all</text><text x="52" y="86" font-size="11" fill="#666666">once per project; wraps the each phase and the all phases of the subprojects (before:all ... after:all)</text>
<rect x="30" y="96" width="900" height="516" rx="6" fill="#f3f7fc" stroke="#2f6db5" stroke-width="1.3"/>
<text x="42" y="116" font-size="13" font-weight="bold" fill="#222222">each</text><text x="82" y="116" font-size="11" fill="#666666">wraps the phases of one project (before:each ... after:each); not accepted on the command line in rc-7</text>
<rect x="44" y="130" width="170" height="104" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="56" y="150" font-size="12" font-weight="bold" fill="#222222">validate</text>
<rect x="60" y="164" width="138" height="52" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="129.0" y="194.0" font-size="12" fill="#222222" text-anchor="middle">initialize</text>
<rect x="230" y="130" width="686" height="104" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="242" y="150" font-size="12" font-weight="bold" fill="#222222">build</text><text x="296" y="150" font-size="11" fill="#666666">runs after validate</text>
<rect x="244" y="162" width="120" height="56" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="304" y="186" font-size="12" fill="#222222" text-anchor="middle">sources</text>
<rect x="378" y="162" width="120" height="56" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="438" y="186" font-size="12" fill="#222222" text-anchor="middle">resources</text>
<rect x="512" y="162" width="120" height="56" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="572" y="186" font-size="12" fill="#222222" text-anchor="middle">compile</text>
<rect x="646" y="162" width="120" height="56" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="706" y="186" font-size="12" fill="#222222" text-anchor="middle">ready</text>
<rect x="780" y="162" width="120" height="56" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="840" y="186" font-size="12" fill="#222222" text-anchor="middle">package</text>
<text x="438" y="206" font-size="10" fill="#14502e" text-anchor="middle">resources:resources</text>
<text x="572" y="206" font-size="10" fill="#14502e" text-anchor="middle">compiler:compile</text>
<text x="840" y="206" font-size="10" fill="#14502e" text-anchor="middle">jar:jar</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs>
<line x1="364" y1="178" x2="378" y2="178" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 438 162 L 438 154 L 706 154 L 706 160" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="632" y1="190" x2="646" y2="190" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="766" y1="190" x2="780" y2="190" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="44" y="250" width="704" height="222" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="56" y="270" font-size="12" font-weight="bold" fill="#222222">verify</text><text x="106" y="270" font-size="11" fill="#666666">runs after validate (not after package)</text>
<rect x="58" y="282" width="484" height="176" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="70" y="302" font-size="12" font-weight="bold" fill="#222222">unit-test</text>
<rect x="72" y="318" width="108" height="56" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="126" y="342" font-size="12" fill="#222222" text-anchor="middle">test-sources</text>
<rect x="190" y="318" width="108" height="56" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="244" y="342" font-size="12" fill="#222222" text-anchor="middle">test-resources</text>
<text x="244" y="362" font-size="9" fill="#14502e" text-anchor="middle">resources:testResources</text>
<rect x="308" y="318" width="108" height="56" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="362" y="342" font-size="12" fill="#222222" text-anchor="middle">test-compile</text>
<text x="362" y="362" font-size="9" fill="#14502e" text-anchor="middle">compiler:testCompile</text>
<rect x="426" y="318" width="108" height="56" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="480" y="342" font-size="12" fill="#222222" text-anchor="middle">test</text>
<text x="480" y="362" font-size="9" fill="#14502e" text-anchor="middle">surefire:test</text>
<path d="M 126 374 L 126 388 L 362 388 L 362 376" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="416" y1="346" x2="426" y2="346" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M 244 318 L 244 308 L 480 308 L 480 316" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="72" y="412" font-size="10" fill="#666666">test-compile runs after test-sources and ready; test after test-compile and test-resources.</text>
<text x="72" y="428" font-size="10" fill="#666666">Concurrent builder: compile waits for the ready phase of its compile-scope dependencies,</text>
<text x="72" y="444" font-size="10" fill="#666666">and test-compile and test for the ready phase of their test-scope dependencies.</text>
<rect x="560" y="282" width="172" height="176" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/>
<text x="646" y="352" font-size="12" fill="#222222" text-anchor="middle">integration-test</text><text x="646" y="372" font-size="10" fill="#666666" text-anchor="middle">no goal in the jar</text><text x="646" y="385" font-size="10" fill="#666666" text-anchor="middle">packaging</text>
<rect x="766" y="250" width="150" height="100" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="841" y="294" font-size="12" fill="#222222" text-anchor="middle">install</text><text x="841" y="314" font-size="10" fill="#14502e" text-anchor="middle">install:install</text><text x="841" y="334" font-size="10" fill="#666666" text-anchor="middle">runs after package</text>
<rect x="766" y="362" width="150" height="100" rx="6" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/>
<text x="841" y="406" font-size="12" fill="#222222" text-anchor="middle">deploy</text><text x="841" y="426" font-size="10" fill="#14502e" text-anchor="middle">deploy:deploy</text><text x="841" y="446" font-size="10" fill="#666666" text-anchor="middle">runs after package</text>
<path d="M 840 218 L 840 238 L 841 238 L 841 248" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="44" y="486" width="14" height="14" rx="3" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.3"/><text x="64" y="498" font-size="11" fill="#222222">phase with a default goal in the jar packaging</text>
<rect x="330" y="486" width="14" height="14" rx="3" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.3"/><text x="350" y="498" font-size="11" fill="#222222">phase without a goal</text>
<text x="44" y="528" font-size="12" font-weight="bold" fill="#222222">Two builders read this tree</text>
<text x="44" y="548" font-size="11.5" fill="#222222">Default builders: the tree is flattened to the Maven 3 order, so "mvn verify" runs every phase of validate through verify, and "mvn install" runs verify first.</text>
<text x="44" y="566" font-size="11.5" fill="#222222">Concurrent builder (-b concurrent): a requested phase runs only the phases it depends on, so "mvn package" and "mvn install" skip the tests,</text>
<text x="44" y="584" font-size="11.5" fill="#222222">"mvn verify" builds no jar, and a project can start as soon as its dependencies reach ready.</text>
<text x="44" y="606" font-size="11" fill="#666666">Source: lifecycle tree printed by the Maven 4.0.0-rc-7 lifecycles reference; behaviour of both builders observed by running the examples on this page.</text>
</svg>
