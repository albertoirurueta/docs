<text x="34" y="333" font-size="12" fill="#92400E">Events come from the origin www.figma.com, so the listener checks event.origin. Messages are sent with that</text>
<text x="34" y="350" font-size="12" fill="#92400E">same target origin. The client-id parameter and a registered embed origin are required.</text>
