<line x1="580" y1="88" x2="580" y2="300" stroke="#E5E7EB" stroke-width="2"/>
<line x1="580" y1="120" x2="162" y2="120" stroke="#4B5563" stroke-width="2" marker-end="url(#ah)"/>
<text x="370" y="112" text-anchor="middle" font-size="12" fill="#374151">INITIAL_LOAD</text>
