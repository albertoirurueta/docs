<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Telemetry collection pipelines: Bookshelf sends metrics, logs and traces through Grafana Alloy to Prometheus or Mimir, Loki and Tempo for Grafana, or through the EDOT Collector to Elasticsearch data streams for Kibana</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker></defs>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<text x="480" y="26" font-size="16" font-weight="bold" fill="#222222" text-anchor="middle">Where the Bookshelf telemetry goes in each lab profile</text>
<text x="480" y="44" font-size="10.5" fill="#555555" text-anchor="middle">instrument, collect, buffer and route, store, then query from the UI</text>
<text x="105" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Instrument</text>
<text x="330" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Collect and route</text>
<text x="600" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Store</text>
<text x="850" y="76" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Visualize and alert</text>
<rect x="15" y="150" width="180" height="300" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="105" y="176" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Bookshelf</text>
<text x="105" y="193" font-size="10" fill="#555555" text-anchor="middle">Spring Boot 4.1</text>
<text x="105" y="240" font-size="10.5" fill="#222222" text-anchor="middle">Micrometer metrics</text>
<text x="105" y="256" font-size="10" fill="#555555" text-anchor="middle">/actuator/prometheus</text>
<text x="105" y="300" font-size="10.5" fill="#222222" text-anchor="middle">OpenTelemetry traces</text>
<text x="105" y="316" font-size="10" fill="#555555" text-anchor="middle">OTLP, spans</text>
<text x="105" y="360" font-size="10.5" fill="#222222" text-anchor="middle">JSON logs</text>
<text x="105" y="376" font-size="10" fill="#555555" text-anchor="middle">stdout or OTLP logs</text>
<text x="105" y="420" font-size="10.5" fill="#222222" text-anchor="middle">PostgreSQL pool metrics</text>
<rect x="225" y="95" width="720" height="215" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="240" y="113" font-size="11" font-weight="bold" fill="#5d4200">Profile grafana</text>
<rect x="245" y="160" width="170" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="330.0" y="193.0" font-size="12.5" font-weight="bold" fill="#0d3c75" text-anchor="middle">Grafana Alloy</text>
<text x="330.0" y="209.0" font-size="10" fill="#0d3c75" text-anchor="middle">scrape, OTLP receiver, batch</text>
<rect x="500" y="120" width="190" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="595.0" y="144.0" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Prometheus or Mimir</text>
<text x="595.0" y="160.0" font-size="10" fill="#1b5e20" text-anchor="middle">metrics, remote write</text>
<rect x="500" y="184" width="190" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="595.0" y="208.0" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Loki</text>
<text x="595.0" y="224.0" font-size="10" fill="#1b5e20" text-anchor="middle">logs, label index</text>
<rect x="500" y="248" width="190" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="595.0" y="272.0" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Tempo</text>
<text x="595.0" y="288.0" font-size="10" fill="#1b5e20" text-anchor="middle">traces, OTLP</text>
<rect x="770" y="160" width="160" height="70" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
<text x="850.0" y="193.0" font-size="12.5" font-weight="bold" fill="#2e1a63" text-anchor="middle">Grafana 13.3</text>
<text x="850.0" y="209.0" font-size="10" fill="#2e1a63" text-anchor="middle">dashboards, alert rules</text>
<line x1="415" y1="185" x2="500" y2="146" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="457" y="152" font-size="10" fill="#37474f" text-anchor="middle">remote write</text>
<line x1="415" y1="195" x2="500" y2="210" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="457" y="208" font-size="10" fill="#37474f" text-anchor="middle">logs push</text>
<line x1="415" y1="210" x2="500" y2="274" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="455" y="252" font-size="10" fill="#37474f" text-anchor="middle">OTLP</text>
<line x1="690" y1="146" x2="770" y2="195" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="690" y1="210" x2="770" y2="195" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="690" y1="274" x2="770" y2="195" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="225" y="330" width="720" height="215" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="240" y="348" font-size="11" font-weight="bold" fill="#1b5e20">Profile kibana</text>
<rect x="245" y="395" width="170" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="330.0" y="428.0" font-size="12.5" font-weight="bold" fill="#0d3c75" text-anchor="middle">EDOT Collector</text>
<text x="330.0" y="444.0" font-size="10" fill="#0d3c75" text-anchor="middle">OTLP receiver, processors</text>
<rect x="500" y="360" width="190" height="52" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="595.0" y="384.0" font-size="12.5" font-weight="bold" fill="#5d4200" text-anchor="middle">Elasticsearch 9.5.6</text>
<text x="595.0" y="400.0" font-size="10" fill="#5d4200" text-anchor="middle">metrics-*, logs-*</text>
<rect x="500" y="424" width="190" height="52" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="595.0" y="448.0" font-size="12.5" font-weight="bold" fill="#5d4200" text-anchor="middle">Elasticsearch 9.5.6</text>
<text x="595.0" y="464.0" font-size="10" fill="#5d4200" text-anchor="middle">traces-*, TSDS and LogsDB</text>
<rect x="770" y="395" width="160" height="70" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
<text x="850.0" y="428.0" font-size="12.5" font-weight="bold" fill="#2e1a63" text-anchor="middle">Kibana 9.5.6</text>
<text x="850.0" y="444.0" font-size="10" fill="#2e1a63" text-anchor="middle">Lens, rules, dashboards</text>
<line x1="415" y1="425" x2="500" y2="386" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="440" y="381" font-size="10" fill="#37474f" text-anchor="middle">elasticsearch exporter</text>
<line x1="415" y1="440" x2="500" y2="450" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="690" y1="386" x2="770" y2="430" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="690" y1="450" x2="770" y2="430" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="195" y1="215" x2="245" y2="195" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="220" y="196" font-size="10" fill="#37474f" text-anchor="middle">OTLP</text>
<line x1="195" y1="300" x2="245" y2="215" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="195" y1="330" x2="245" y2="425" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="215" y="380" font-size="10" fill="#37474f" text-anchor="middle">OTLP</text>
<line x1="195" y1="380" x2="245" y2="440" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="480" y="575" font-size="10.5" fill="#555555" text-anchor="middle">Collectors batch and retry before exporting; an extra buffer tier (Kafka, Redis or a Logstash persistent queue) is optional.</text>
</svg>
