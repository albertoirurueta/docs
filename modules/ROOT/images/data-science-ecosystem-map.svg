<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Dataframe and query engines around Apache Arrow</title>
  <desc id="d">Four engines (pandas, Polars, DuckDB and NumPy arrays) exchange data through the Apache Arrow columnar format and read Parquet files. Narwhals and Ibis sit above the engines as compatibility layers, and machine learning libraries consume the results below.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="418" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#0F172A">Engines around Apache Arrow</text>

  <rect x="60" y="56" width="280" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="200" y="81" font-size="15" text-anchor="middle" fill="#0F172A">Narwhals (one API over dataframes)</text>
  <rect x="380" y="56" width="280" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="520" y="81" font-size="15" text-anchor="middle" fill="#0F172A">Ibis (one API over SQL backends)</text>

  <rect x="30" y="130" width="150" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="105" y="157" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">pandas</text>
  <text x="105" y="177" font-size="12" text-anchor="middle" fill="#475569">eager, in memory</text>
  <rect x="200" y="130" width="150" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="275" y="157" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">Polars</text>
  <text x="275" y="177" font-size="12" text-anchor="middle" fill="#475569">eager or lazy, streaming</text>
  <rect x="370" y="130" width="150" height="64" rx="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
  <text x="445" y="157" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">DuckDB</text>
  <text x="445" y="177" font-size="12" text-anchor="middle" fill="#475569">SQL, in process</text>
  <rect x="540" y="130" width="150" height="64" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="615" y="157" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">NumPy</text>
  <text x="615" y="177" font-size="12" text-anchor="middle" fill="#475569">n-dimensional arrays</text>

  <rect x="30" y="230" width="660" height="52" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="360" y="254" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">Apache Arrow columnar memory format</text>
  <text x="360" y="272" font-size="12" text-anchor="middle" fill="#475569">zero-copy or low-copy exchange between engines and languages</text>

  <rect x="30" y="316" width="200" height="40" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="130" y="341" font-size="15" text-anchor="middle" fill="#0F172A">Parquet, CSV, databases</text>
  <rect x="260" y="316" width="430" height="40" rx="6" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
  <text x="475" y="341" font-size="15" text-anchor="middle" fill="#0F172A">scikit-learn, XGBoost, LightGBM, PyTorch, Keras</text>

  <path d="M200 96 V130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M200 96 L105 130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M520 96 V130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M520 96 L445 130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M105 194 V228" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M275 194 V228" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M445 194 V228" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M615 194 V228" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M130 316 V284" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M475 284 V314" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="24" y="396" font-size="12" fill="#475569">Original drawing. Arrows show typical data flow, not a complete list of integrations.</text>
</svg>
