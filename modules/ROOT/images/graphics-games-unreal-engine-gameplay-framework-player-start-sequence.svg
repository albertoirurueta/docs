<svg viewBox="0 0 760 420" width="760" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">From map load to a possessed pawn</text>
<circle cx="36" cy="78" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<rect x="60" y="56" width="520" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="70" y="82" text-anchor="start" font-size="12" fill="#3730A3">The map loads. The world creates the GameMode (InitGame) and the GameState.</text>
<rect x="595" y="56" width="145" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="667" y="82" text-anchor="middle" font-size="12" fill="#047857">server</text>
<line x1="36" y1="89" x2="36" y2="123" stroke="#4B5563" stroke-width="1.2" marker-end="url(#c2)"/>
<circle cx="36" cy="134" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<rect x="60" y="112" width="520" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="70" y="138" text-anchor="start" font-size="12" fill="#3730A3">A player connects. PreLogin, then Login spawns that player's PlayerController.</text>
<rect x="595" y="112" width="145" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="667" y="138" text-anchor="middle" font-size="12" fill="#047857">server</text>
<line x1="36" y1="145" x2="36" y2="179" stroke="#4B5563" stroke-width="1.2" marker-end="url(#c2)"/>
<circle cx="36" cy="190" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<rect x="60" y="168" width="520" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="70" y="194" text-anchor="start" font-size="12" fill="#3730A3">The controller creates the player's PlayerState, which replicates to every client.</text>
<rect x="595" y="168" width="145" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="667" y="194" text-anchor="middle" font-size="12" fill="#047857">server</text>
<line x1="36" y1="201" x2="36" y2="235" stroke="#4B5563" stroke-width="1.2" marker-end="url(#c2)"/>
<circle cx="36" cy="246" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<rect x="60" y="224" width="520" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="70" y="250" text-anchor="start" font-size="12" fill="#3730A3">PostLogin runs: first safe point to call replicated functions on it.</text>
<rect x="595" y="224" width="145" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="667" y="250" text-anchor="middle" font-size="12" fill="#047857">server</text>
<line x1="36" y1="257" x2="36" y2="291" stroke="#4B5563" stroke-width="1.2" marker-end="url(#c2)"/>
<circle cx="36" cy="302" r="11" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="36" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<rect x="60" y="280" width="520" height="44" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="70" y="306" text-anchor="start" font-size="12" fill="#3730A3">HandleStartingNewPlayer calls RestartPlayer, which spawns a pawn at a PlayerStart.</text>
<rect x="595" y="280" width="145" height="44" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="667" y="306" text-anchor="middle" font-size="12" fill="#047857">server</text>
<line x1="36" y1="313" x2="36" y2="347" stroke="#4B5563" stroke-width="1.2" marker-end="url(#c2)"/>
<circle cx="36" cy="358" r="11" fill="#B45309" stroke="none" stroke-width="1"/>
<text x="36" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
<rect x="60" y="336" width="520" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="70" y="362" text-anchor="start" font-size="12" fill="#92400E">The controller possesses the pawn. Input and the camera now follow it.</text>
<rect x="595" y="336" width="145" height="44" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="667" y="362" text-anchor="middle" font-size="12" fill="#1F2937">server + owning client</text>
<text x="380" y="404" text-anchor="middle" font-size="11" fill="#374151">Every step in the first five runs on the server; clients receive the results through replication.</text>
</svg>
