<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>

  <text x="360" y="28" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Neo4j Raft cluster: primary group plus a load-balanced secondary tier</text>

  <!-- Raft group box -->
  <rect x="40" y="46" width="330" height="230" fill="#fbfaf5" stroke="#c9a227" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="56" y="64" font-size="12" font-weight="bold" fill="#8a6d00">Raft consensus group (primaries)</text>

  <!-- Leader -->
  <rect x="60" y="80" width="140" height="66" fill="#eaf2fb" stroke="#1c4b73" stroke-width="1.4"/>
  <text x="130" y="105" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">primary (leader)</text>
  <text x="130" y="121" font-size="10" fill="#444444" text-anchor="middle">accepts all writes</text>
  <text x="130" y="135" font-size="10" fill="#444444" text-anchor="middle">Raft log leader</text>

  <!-- Follower 1 -->
  <rect x="230" y="80" width="120" height="66" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="290" y="105" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">primary</text>
  <text x="290" y="121" font-size="10" fill="#444444" text-anchor="middle">follower</text>
  <text x="290" y="135" font-size="10" fill="#444444" text-anchor="middle">can be elected</text>

  <!-- Follower 2 -->
  <rect x="145" y="186" width="120" height="66" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="205" y="211" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">primary</text>
  <text x="205" y="227" font-size="10" fill="#444444" text-anchor="middle">follower</text>
  <text x="205" y="241" font-size="10" fill="#444444" text-anchor="middle">can be elected</text>

  <!-- Raft log arrows: leader -> follower 1 -->
  <g stroke="#c9a227" stroke-width="1.6" fill="#c9a227">
    <line x1="200" y1="105" x2="228" y2="105"/>
    <polygon points="228,100 228,110 238,105"/>
  </g>
  <!-- Raft log arrows: leader -> follower 2 -->
  <g stroke="#c9a227" stroke-width="1.6" fill="#c9a227">
    <line x1="150" y1="146" x2="185" y2="184"/>
    <polygon points="177,180 190,182 183,192"/>
  </g>
  <text x="330" y="170" font-size="10" fill="#8a6d00" text-anchor="middle">Raft log</text>
  <text x="205" y="270" font-size="10" fill="#8a6d00" text-anchor="middle">majority vote elects a new leader on failure</text>

  <!-- Secondary tier -->
  <rect x="420" y="46" width="260" height="230" fill="#f6fbf6" stroke="#2f5424" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="436" y="64" font-size="12" font-weight="bold" fill="#2f5424">Secondary tier (read replicas)</text>

  <rect x="440" y="86" width="220" height="60" fill="#eef6ec" stroke="#2f5424" stroke-width="1.2"/>
  <text x="550" y="110" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">secondary A</text>
  <text x="550" y="126" font-size="10" fill="#444444" text-anchor="middle">async catch-up from primaries</text>

  <rect x="440" y="156" width="220" height="60" fill="#eef6ec" stroke="#2f5424" stroke-width="1.2"/>
  <text x="550" y="180" font-size="13" font-weight="bold" fill="#2f5424" text-anchor="middle">secondary B</text>
  <text x="550" y="196" font-size="10" fill="#444444" text-anchor="middle">async catch-up from primaries</text>

  <text x="550" y="240" font-size="10" fill="#3d6b34" text-anchor="middle">scales read throughput; not part of Raft voting</text>

  <!-- arrow: raft group -> secondary tier (replication) -->
  <g stroke="#666666" stroke-width="1.4" fill="#666666">
    <line x1="350" y1="105" x2="438" y2="110"/>
    <polygon points="430,105 430,115 440,110"/>
  </g>
  <text x="394" y="95" font-size="9.5" fill="#555555" text-anchor="middle">replication</text>

  <!-- Load balancer -->
  <rect x="290" y="320" width="150" height="50" fill="#fdf1e6" stroke="#b5651d" stroke-width="1.4"/>
  <text x="365" y="342" font-size="13" font-weight="bold" fill="#b5651d" text-anchor="middle">load balancer</text>
  <text x="365" y="358" font-size="10" fill="#555555" text-anchor="middle">routes reads by policy</text>

  <!-- Clients -->
  <rect x="290" y="400" width="150" height="46" fill="#f4f4f4" stroke="#666666" stroke-width="1.2"/>
  <text x="365" y="422" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">client application</text>
  <text x="365" y="437" font-size="10" fill="#555555" text-anchor="middle">bolt+routing://</text>

  <!-- client -> load balancer -->
  <g stroke="#666666" stroke-width="1.4" fill="#666666">
    <line x1="365" y1="400" x2="365" y2="372"/>
    <polygon points="359,372 371,372 365,362"/>
  </g>

  <!-- load balancer -> secondary tier (reads) -->
  <g stroke="#b5651d" stroke-width="1.4" fill="#b5651d">
    <line x1="440" y1="330" x2="548" y2="218"/>
    <polygon points="540,216 552,220 543,228"/>
  </g>
  <text x="510" y="285" font-size="9.5" fill="#8a5117" text-anchor="middle">reads</text>

  <!-- load balancer -> leader (writes) -->
  <g stroke="#1c4b73" stroke-width="1.4" fill="#1c4b73">
    <line x1="290" y1="335" x2="140" y2="150"/>
    <polygon points="136,158 138,146 148,153"/>
  </g>
  <text x="190" y="285" font-size="9.5" fill="#1c4b73" text-anchor="middle">writes</text>

  <text x="360" y="452" font-size="11.5" fill="#444444" text-anchor="middle">Primaries replicate via Raft and elect a leader; secondaries fan out reads behind the load balancer.</text>
</svg>
