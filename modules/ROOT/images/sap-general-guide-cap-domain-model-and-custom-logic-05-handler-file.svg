<title id="sap-general-guide-cap-domain-model-and-custom-logic-05-handler-file-title">Visual Studio Code with the file srv/claims-service.js open: the class ClaimsService attaches the function validateClaim as a before handler for CREATE and UPDATE of Claims, and validateClaim checks the title, the items and each item amount and sums the total in cents; callout 9 marks the file in the explorer</title>
