<svg viewBox="0 0 760 440" width="760" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">From UDK to Unreal Engine 5.8, and where each book stops</text>
<rect x="24" y="44" width="416" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="36" y="73" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">UDK 2011</text>
<text x="160" y="65" font-size="11" fill="#374151" text-anchor="start">Unreal Engine 3 toolkit:</text>
<text x="160" y="81" font-size="11" fill="#374151" text-anchor="start">UnrealScript, Kismet (COR)</text>
<rect x="74" y="98" width="416" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="86" y="127" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">UE 4.4 to 4.7</text>
<text x="210" y="119" font-size="11" fill="#374151" text-anchor="start">C++ and Blueprints,</text>
<text x="210" y="135" font-size="11" fill="#374151" text-anchor="start">Matinee, Cascade (MIS)</text>
<rect x="124" y="152" width="416" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="136" y="181" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">UE 4.7 to 4.11</text>
<text x="260" y="173" font-size="11" fill="#374151" text-anchor="start">Learning path and examples</text>
<text x="260" y="189" font-size="11" fill="#374151" text-anchor="start">with PhysX (ATZ, CAR)</text>
<rect x="174" y="206" width="416" height="48" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="186" y="235" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">UE 4.20 to 4.22</text>
<text x="310" y="227" font-size="11" fill="#374151" text-anchor="start">Blueprints with the</text>
<text x="310" y="243" font-size="11" fill="#374151" text-anchor="start">Oculus-era VR template (BPV)</text>
<rect x="224" y="260" width="416" height="48" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="236" y="289" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">UE 5.0 (2022)</text>
<text x="360" y="281" font-size="11" fill="#374151" text-anchor="start">Nanite, Lumen, Chaos,</text>
<text x="360" y="297" font-size="11" fill="#374151" text-anchor="start">World Partition (LIR)</text>
<rect x="274" y="314" width="416" height="48" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="286" y="343" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">UE 5.7 (2025)</text>
<text x="410" y="335" font-size="11" fill="#374151" text-anchor="start">PCG and Substrate</text>
<text x="410" y="351" font-size="11" fill="#374151" text-anchor="start">production-ready</text>
<rect x="324" y="368" width="416" height="48" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="336" y="397" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">UE 5.8 (2026)</text>
<text x="460" y="389" font-size="11" fill="#374151" text-anchor="start">MegaLights production-ready,</text>
<text x="460" y="405" font-size="11" fill="#374151" text-anchor="start">mobile deferred by default</text>
<text x="24" y="430" font-size="11" fill="#374151" text-anchor="start">Each box starts further right because each release builds on the ones before it.</text>
</svg>
