<svg viewBox="0 0 760 360" width="760" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vpe-pnext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="360" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" fill="#1F2937" font-weight="bold">A feature chain: Features2 linked through pNext</text>
<rect x="20" y="70" width="170" height="125" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="105.0" y="88" text-anchor="middle" font-size="10" fill="#3730A3"></text>
<text x="105.0" y="102" text-anchor="middle" font-size="10" fill="#3730A3">sType = FEATURES_2</text>
<text x="105.0" y="116" text-anchor="middle" font-size="10" fill="#3730A3">pNext -&gt;</text>
<text x="105.0" y="130" text-anchor="middle" font-size="10" fill="#3730A3">features (1.0 set)</text>
<text x="105" y="88" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Features2</text>
<line x1="192" y1="150" x2="203" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-pnext)"/>
<rect x="205" y="70" width="170" height="125" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="290.0" y="88" text-anchor="middle" font-size="10" fill="#374151"></text>
<text x="290.0" y="102" text-anchor="middle" font-size="10" fill="#374151">sType = VULKAN_1_2_FEATURES</text>
<text x="290.0" y="116" text-anchor="middle" font-size="10" fill="#374151">pNext -&gt;</text>
<text x="290.0" y="130" text-anchor="middle" font-size="10" fill="#374151">timelineSemaphore = true</text>
<text x="290" y="88" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Vulkan12Features</text>
<line x1="377" y1="150" x2="388" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-pnext)"/>
<rect x="390" y="70" width="170" height="125" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="475.0" y="88" text-anchor="middle" font-size="10" fill="#374151"></text>
<text x="475.0" y="102" text-anchor="middle" font-size="10" fill="#374151">sType = VULKAN_1_3_FEATURES</text>
<text x="475.0" y="116" text-anchor="middle" font-size="10" fill="#374151">pNext -&gt;</text>
<text x="475.0" y="130" text-anchor="middle" font-size="10" fill="#374151">dynamicRendering = true</text>
<text x="475" y="88" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Vulkan13Features</text>
<line x1="562" y1="150" x2="573" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vpe-pnext)"/>
<rect x="575" y="70" width="170" height="125" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="1.5"/>
<text x="660.0" y="88" text-anchor="middle" font-size="10" fill="#374151"></text>
<text x="660.0" y="102" text-anchor="middle" font-size="10" fill="#374151">sType = VULKAN_1_4_FEATURES</text>
<text x="660.0" y="116" text-anchor="middle" font-size="10" fill="#374151">pNext = null</text>
<text x="660.0" y="130" text-anchor="middle" font-size="10" fill="#374151">pushDescriptor = true</text>
<text x="660" y="88" text-anchor="middle" font-size="11" fill="#3730A3" font-weight="bold">Vulkan14Features</text>
<text x="380" y="225" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="bold">The same chain is used twice</text>
<rect x="20" y="240" width="350" height="95" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="258" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">Query</text>
<text x="195.0" y="276" text-anchor="middle" font-size="11" fill="#065F46">1. vkGetPhysicalDeviceFeatures2(chain): the driver fills</text>
<text x="195.0" y="291" text-anchor="middle" font-size="11" fill="#065F46">every struct with what the GPU supports.</text>
<text x="195.0" y="306" text-anchor="middle" font-size="11" fill="#065F46">2. Check the booleans you need.</text>
<rect x="390" y="240" width="350" height="95" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="565.0" y="258" text-anchor="middle" font-size="13" fill="#92400E" font-weight="bold">Enable</text>
<text x="565.0" y="276" text-anchor="middle" font-size="11" fill="#92400E">3. Set the booleans you want to true.</text>
<text x="565.0" y="291" text-anchor="middle" font-size="11" fill="#92400E">4. VkDeviceCreateInfo.pNext = &amp;features2: the device is</text>
<text x="565.0" y="306" text-anchor="middle" font-size="11" fill="#92400E">created with exactly those features enabled.</text>
</svg>
