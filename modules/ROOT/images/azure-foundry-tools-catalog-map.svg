<svg viewBox="0 0 820 520" width="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="520" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Foundry Tools catalog by modality (formerly Azure AI services / Cognitive Services)</text>

  <!-- Center: Foundry resource -->
  <rect x="300" y="226" width="220" height="68" rx="10" fill="#0d47a1"/>
  <text x="410" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Foundry resource</text>
  <text x="410" y="270" text-anchor="middle" font-size="11" fill="#e3f2fd">kind AIServices</text>
  <text x="410" y="285" text-anchor="middle" font-size="10" fill="#bbdefb">one endpoint family, Entra ID or keys</text>

  <!-- Speech -->
  <rect x="20" y="50" width="250" height="140" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="34" y="72" font-size="13" font-weight="700" fill="#0d47a1">Speech (audio)</text>
  <text x="34" y="90" font-size="10" fill="#546e7a">was: Speech Services</text>
  <text x="34" y="110" font-size="11" fill="#263238">speech to text, text to speech</text>
  <text x="34" y="127" font-size="11" fill="#263238">speech translation, Live Interpreter</text>
  <text x="34" y="144" font-size="11" fill="#263238">pronunciation assessment</text>
  <text x="34" y="161" font-size="11" fill="#263238">Voice Live (voice agents)</text>
  <rect x="34" y="168" width="54" height="16" rx="8" fill="#2e7d32"/>
  <text x="61" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">GA</text>
  <rect x="94" y="168" width="110" height="16" rx="8" fill="#f9a825"/>
  <text x="149" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3e2723">LLM speech preview</text>

  <!-- Language and translation -->
  <rect x="285" y="50" width="250" height="140" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.4"/>
  <text x="299" y="72" font-size="13" font-weight="700" fill="#4a148c">Language and translation</text>
  <text x="299" y="90" font-size="10" fill="#546e7a">was: Text Analytics, Translator Text</text>
  <text x="299" y="110" font-size="11" fill="#263238">Translator: text (NMT or LLM), documents</text>
  <text x="299" y="127" font-size="11" fill="#263238">Language core: PII, NER, detection, health</text>
  <text x="299" y="144" font-size="11" fill="#263238">Language legacy: sentiment, CLU, CQA</text>
  <text x="299" y="161" font-size="11" fill="#263238">Immersive Reader</text>
  <rect x="299" y="168" width="54" height="16" rx="8" fill="#2e7d32"/>
  <text x="326" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">GA</text>
  <rect x="359" y="168" width="150" height="16" rx="8" fill="#ef6c00"/>
  <text x="434" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">legacy ends 2029-03-31</text>

  <!-- Vision -->
  <rect x="550" y="50" width="250" height="140" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4"/>
  <text x="564" y="72" font-size="13" font-weight="700" fill="#e65100">Vision (images)</text>
  <text x="564" y="90" font-size="10" fill="#546e7a">was: Computer Vision, Face API</text>
  <text x="564" y="110" font-size="11" fill="#263238">Image Analysis 4.0: captions, tags, OCR</text>
  <text x="564" y="127" font-size="11" fill="#263238">multimodal embeddings</text>
  <text x="564" y="144" font-size="11" fill="#263238">Face: detect, verify, liveness</text>
  <text x="564" y="161" font-size="11" fill="#263238">(Face is Limited Access)</text>
  <rect x="564" y="168" width="170" height="16" rx="8" fill="#c62828"/>
  <text x="649" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">Image Analysis retires 2028-09-25</text>

  <!-- Documents -->
  <rect x="20" y="330" width="250" height="140" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="34" y="352" font-size="13" font-weight="700" fill="#1b5e20">Documents and multimodal</text>
  <text x="34" y="370" font-size="10" fill="#546e7a">was: Form Recognizer</text>
  <text x="34" y="390" font-size="11" fill="#263238">Document Intelligence: read, layout,</text>
  <text x="34" y="407" font-size="11" fill="#263238">prebuilt and custom models</text>
  <text x="34" y="424" font-size="11" fill="#263238">Content Understanding: analyzers for</text>
  <text x="34" y="441" font-size="11" fill="#263238">documents, images, audio, video</text>
  <rect x="34" y="448" width="54" height="16" rx="8" fill="#2e7d32"/>
  <text x="61" y="460" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">GA</text>
  <rect x="94" y="448" width="120" height="16" rx="8" fill="#f9a825"/>
  <text x="154" y="460" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3e2723">agentic mode preview</text>

  <!-- Safety -->
  <rect x="285" y="330" width="250" height="140" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.4"/>
  <text x="299" y="352" font-size="13" font-weight="700" fill="#b71c1c">Safety</text>
  <text x="299" y="370" font-size="10" fill="#546e7a">was: Content Moderator (retires 2027-03-15)</text>
  <text x="299" y="390" font-size="11" fill="#263238">Content Safety: text and image harm</text>
  <text x="299" y="407" font-size="11" fill="#263238">Prompt Shields, protected material</text>
  <text x="299" y="424" font-size="11" fill="#263238">groundedness, custom categories</text>
  <text x="299" y="441" font-size="11" fill="#263238">behind Foundry guardrails</text>
  <rect x="299" y="448" width="54" height="16" rx="8" fill="#2e7d32"/>
  <text x="326" y="460" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">GA</text>
  <rect x="359" y="448" width="120" height="16" rx="8" fill="#f9a825"/>
  <text x="419" y="460" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3e2723">some features preview</text>

  <!-- Search -->
  <rect x="550" y="330" width="250" height="140" rx="8" fill="#e0f7fa" stroke="#00838f" stroke-width="1.4"/>
  <text x="564" y="352" font-size="13" font-weight="700" fill="#006064">Search</text>
  <text x="564" y="370" font-size="10" fill="#546e7a">was: Azure Cognitive Search (separate resource)</text>
  <text x="564" y="390" font-size="11" fill="#263238">Azure AI Search: hybrid, vector,</text>
  <text x="564" y="407" font-size="11" fill="#263238">semantic ranker</text>
  <text x="564" y="424" font-size="11" fill="#263238">skillsets call Foundry Tools</text>
  <text x="564" y="441" font-size="11" fill="#263238">agentic retrieval, Foundry IQ</text>
  <rect x="564" y="448" width="54" height="16" rx="8" fill="#2e7d32"/>
  <text x="591" y="460" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">GA</text>

  <!-- connectors -->
  <g stroke="#90a4ae" stroke-width="1.4">
    <line x1="145" y1="190" x2="330" y2="226"/>
    <line x1="410" y1="190" x2="410" y2="226"/>
    <line x1="675" y1="190" x2="490" y2="226"/>
    <line x1="145" y1="330" x2="330" y2="294"/>
    <line x1="410" y1="330" x2="410" y2="294"/>
  </g>
  <line x1="675" y1="330" x2="520" y2="280" stroke="#90a4ae" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="600" y="300" font-size="9.5" fill="#546e7a">attached for skills</text>

  <text x="410" y="500" text-anchor="middle" font-size="10.5" fill="#455a64">Azure OpenAI and other Foundry Models share the resource but are not Foundry Tools</text>
</svg>
