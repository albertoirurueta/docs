<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Which framework classes exist where</text>
<rect x="200" y="46" width="175" height="30" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="287" y="66" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">Server</text>
<rect x="385" y="46" width="175" height="30" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="472" y="66" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">Owning client</text>
<rect x="570" y="46" width="175" height="30" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="657" y="66" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold">Other clients</text>
<rect x="20" y="86" width="170" height="38" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105" y="110" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">AGameModeBase</text>
<rect x="200" y="86" width="175" height="38" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="287" y="110" text-anchor="middle" font-size="12" fill="#047857">Yes, one</text>
<rect x="385" y="86" width="175" height="38" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="472" y="110" text-anchor="middle" font-size="12" fill="#374151">No</text>
<rect x="570" y="86" width="175" height="38" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="657" y="110" text-anchor="middle" font-size="12" fill="#374151">No</text>
<rect x="20" y="132" width="170" height="38" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105" y="156" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">AGameStateBase</text>
<rect x="200" y="132" width="175" height="38" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="287" y="156" text-anchor="middle" font-size="12" fill="#047857">Yes, authoritative</text>
<rect x="385" y="132" width="175" height="38" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="472" y="156" text-anchor="middle" font-size="12" fill="#3730A3">Yes, replicated</text>
<rect x="570" y="132" width="175" height="38" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="657" y="156" text-anchor="middle" font-size="12" fill="#3730A3">Yes, replicated</text>
<rect x="20" y="178" width="170" height="38" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105" y="202" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">APlayerState</text>
<rect x="200" y="178" width="175" height="38" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="287" y="202" text-anchor="middle" font-size="12" fill="#047857">Yes, one per player</text>
<rect x="385" y="178" width="175" height="38" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="472" y="202" text-anchor="middle" font-size="12" fill="#3730A3">Yes, replicated</text>
<rect x="570" y="178" width="175" height="38" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="657" y="202" text-anchor="middle" font-size="12" fill="#3730A3">Yes, replicated</text>
<rect x="20" y="224" width="170" height="38" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105" y="248" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">APlayerController</text>
<rect x="200" y="224" width="175" height="38" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="287" y="248" text-anchor="middle" font-size="12" fill="#047857">Yes, one per player</text>
<rect x="385" y="224" width="175" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="472" y="248" text-anchor="middle" font-size="12" fill="#92400E">Yes, its own only</text>
<rect x="570" y="224" width="175" height="38" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="657" y="248" text-anchor="middle" font-size="12" fill="#374151">No</text>
<rect x="20" y="270" width="170" height="38" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105" y="294" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">APawn, ACharacter</text>
<rect x="200" y="270" width="175" height="38" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="287" y="294" text-anchor="middle" font-size="12" fill="#047857">Yes, authority</text>
<rect x="385" y="270" width="175" height="38" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="472" y="294" text-anchor="middle" font-size="12" fill="#3730A3">Yes, autonomous proxy</text>
<rect x="570" y="270" width="175" height="38" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
<text x="657" y="294" text-anchor="middle" font-size="12" fill="#3730A3">Yes, simulated proxy</text>
<rect x="20" y="316" width="170" height="38" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105" y="340" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">AHUD</text>
<rect x="200" y="316" width="175" height="38" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="287" y="340" text-anchor="middle" font-size="12" fill="#374151">No on a dedicated server</text>
<rect x="385" y="316" width="175" height="38" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1.2"/>
<text x="472" y="340" text-anchor="middle" font-size="12" fill="#047857">Yes, one per player</text>
<rect x="570" y="316" width="175" height="38" rx="6" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.2"/>
<text x="657" y="340" text-anchor="middle" font-size="12" fill="#374151">No</text>
<rect x="20" y="362" width="170" height="38" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="105" y="386" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">UGameInstance</text>
<rect x="200" y="362" width="175" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="287" y="386" text-anchor="middle" font-size="12" fill="#92400E">Yes, its own copy</text>
<rect x="385" y="362" width="175" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="472" y="386" text-anchor="middle" font-size="12" fill="#92400E">Yes, its own copy</text>
<rect x="570" y="362" width="175" height="38" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
<text x="657" y="386" text-anchor="middle" font-size="12" fill="#92400E">Yes, its own copy</text>
<text x="380" y="424" text-anchor="middle" font-size="11" fill="#374151">Replicated copies are read-only mirrors of the server's object; the GameInstance is never replicated.</text>
<text x="380" y="442" text-anchor="middle" font-size="11" fill="#374151">A listen server is both the server and a client, so it has the owning-client column too.</text>
</svg>
