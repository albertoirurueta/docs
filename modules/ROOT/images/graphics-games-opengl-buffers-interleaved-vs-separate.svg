<text x="570" y="196" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">PPP | NNN | UUU (three bindings)</text>
<rect x="20" y="230" width="350" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="195.0" y="276.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Good: one cache line fetches all attributes</text>
<text x="195.0" y="290.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">of a vertex; one binding; best for static meshes</text>
<rect x="390" y="230" width="350" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="565.0" y="269.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Good: update one attribute (e.g. positions for</text>
<text x="565.0" y="283.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">skinning) without touching the others; depth-only</text>
<text x="565.0" y="297.9" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">passes can bind positions alone</text>
