<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Interleaved versus separate attribute buffers</text>
<text x="190" y="56" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Interleaved (one buffer)</text>
<text x="570" y="56" font-size="14" font-weight="bold" fill="#3730A3" text-anchor="middle">Separate (one buffer per attribute)</text>
