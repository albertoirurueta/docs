<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="ecosystem-registry-growth-t ecosystem-registry-growth-d">
<title id="ecosystem-registry-growth-t">Registry growth over the years: LuaRocks</title>
<desc id="ecosystem-registry-growth-d">Cumulative number of modules in LuaRocks, one sample per year (last sample of each year, luarocks.org/stats, retrieved 2026-10-26). This is the only registry with a real yearly series in the data: for npm, PyPI, Maven Central, NuGet, crates.io, Packagist, RubyGems, CRAN, pub.dev, Hex, Hackage, CPAN, Julia General only a 2026 snapshot (or no value) could be read, because historical counts were unreachable, so no growth line is drawn for them and none is estimated.</desc>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#59636e;--s0:#0072B2;--s1:#D55E00;--s2:#009E73;--s3:#CC79A7;--s4:#E69F00;--s5:#56B4E9;--s6:#7A6A00;--s7:#000000;}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--grid:#30363d;--axis:#9198a1;--s0:#56B4E9;--s1:#E69F00;--s2:#44C9A0;--s3:#E8A0CB;--s4:#F0E442;--s5:#7FB8F0;--s6:#D9C84A;--s7:#FFFFFF;}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:12px}
.title{font-size:16px;font-weight:600}.muted{fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1;fill:none}.axis{stroke:var(--axis);stroke-width:1;fill:none}
.na{fill:var(--muted);font-style:italic}
</style>
<style>.l0{stroke:var(--s0);stroke-width:2;fill:none;stroke-linejoin:round}.m0{fill:var(--s0);stroke:var(--s0)}.f0{fill:var(--s0)}.a0{fill:var(--s0);fill-opacity:.12;stroke:var(--s0);stroke-width:2;}</style>
<rect width="800" height="480" fill="var(--bg)"/>
<text class="title" x="400" y="24" text-anchor="middle">Registry growth over the years: LuaRocks</text>
