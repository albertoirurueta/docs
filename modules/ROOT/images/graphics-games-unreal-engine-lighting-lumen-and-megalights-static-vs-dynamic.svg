<svg viewBox="0 0 760 410" width="760" height="410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="410" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Baked lighting compared with dynamic Lumen and MegaLights</text>
<rect x="25" y="48" width="185" height="32" rx="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="117.5" y="68.2" text-anchor="middle" font-size="12" fill="#FFFFFF">Question</text>
<rect x="215" y="48" width="255" height="32" rx="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="342.5" y="68.2" text-anchor="middle" font-size="12" fill="#FFFFFF">Baked (Static, Lightmass)</text>
<rect x="475" y="48" width="260" height="32" rx="4" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<text x="605.0" y="68.2" text-anchor="middle" font-size="12" fill="#FFFFFF">Dynamic (Lumen, MegaLights)</text>
<rect x="25" y="88" width="185" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="117.5" y="114.2" text-anchor="middle" font-size="12" fill="#3730A3">Build step</text>
<rect x="215" y="88" width="255" height="44" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="342.5" y="113.8" text-anchor="middle" font-size="11" fill="#92400E">Lightmass bake for each change</text>
<rect x="475" y="88" width="260" height="44" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="605.0" y="113.8" text-anchor="middle" font-size="11" fill="#065F46">None, lighting updates live</text>
<rect x="25" y="140" width="185" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="117.5" y="166.2" text-anchor="middle" font-size="12" fill="#3730A3">Move a light at runtime</text>
<rect x="215" y="140" width="255" height="44" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="342.5" y="165.8" text-anchor="middle" font-size="11" fill="#92400E">Static lights cannot move</text>
<rect x="475" y="140" width="260" height="44" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="605.0" y="165.8" text-anchor="middle" font-size="11" fill="#065F46">Movable lights, GI follows</text>
<rect x="25" y="192" width="185" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="117.5" y="218.2" text-anchor="middle" font-size="12" fill="#3730A3">Runtime GPU cost</text>
<rect x="215" y="192" width="255" height="44" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="342.5" y="217.8" text-anchor="middle" font-size="11" fill="#92400E">Low: texture lookups</text>
<rect x="475" y="192" width="260" height="44" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="605.0" y="217.8" text-anchor="middle" font-size="11" fill="#065F46">Higher: tracing and denoise</text>
<rect x="25" y="244" width="185" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="117.5" y="270.2" text-anchor="middle" font-size="12" fill="#3730A3">Memory</text>
<rect x="215" y="244" width="255" height="44" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="342.5" y="269.9" text-anchor="middle" font-size="11" fill="#92400E">Lightmaps on disk and in memory</text>
<rect x="475" y="244" width="260" height="44" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="605.0" y="269.9" text-anchor="middle" font-size="11" fill="#065F46">Surface cache, shadow pages</text>
<rect x="25" y="296" width="185" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="117.5" y="322.2" text-anchor="middle" font-size="12" fill="#3730A3">Hardware</text>
<rect x="215" y="296" width="255" height="44" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="342.5" y="321.9" text-anchor="middle" font-size="11" fill="#92400E">Runs on any target</text>
<rect x="475" y="296" width="260" height="44" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="605.0" y="321.9" text-anchor="middle" font-size="11" fill="#065F46">SM6, RX 6000, Arc A, RTX 2000+</text>
<rect x="25" y="348" width="185" height="44" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="117.5" y="374.2" text-anchor="middle" font-size="12" fill="#3730A3">Typical use in 5.8</text>
<rect x="215" y="348" width="255" height="44" rx="4" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="342.5" y="373.9" text-anchor="middle" font-size="11" fill="#92400E">Mobile forward, low-end targets</text>
<rect x="475" y="348" width="260" height="44" rx="4" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="605.0" y="373.9" text-anchor="middle" font-size="11" fill="#065F46">Desktop, console, current handhelds</text>
<text x="380" y="405" text-anchor="middle" font-size="11" fill="#374151">Lumen does not use Static lights; baked lighting is a separate path.</text>
</svg>
