<svg viewBox="0 0 760 340" width="760" height="340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-vdu-story" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="340" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Turning validation on and reading the first message</text>
<rect x="20" y="60" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="36" cy="76" r="11" fill="#4F46E5"/>
<text x="36" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
<text x="96.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Install SDK</text>
<text x="88.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">LunarG SDK or</text>
<text x="88.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">the layer package</text>
<text x="88.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">from your distro</text>
<line x1="156" y1="145" x2="171" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vdu-story)"/>
<rect x="171" y="60" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="187" cy="76" r="11" fill="#4F46E5"/>
<text x="187" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
<text x="247.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Configure</text>
<text x="239.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">vkconfig preset</text>
<text x="239.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">or layer settings</text>
<text x="239.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">in the instance</text>
<line x1="307" y1="145" x2="322" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vdu-story)"/>
<rect x="322" y="60" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="338" cy="76" r="11" fill="#4F46E5"/>
<text x="338" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
<text x="398.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Run</text>
<text x="390.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">debug build only</text>
<text x="390.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">same code path</text>
<text x="390.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">as release</text>
<line x1="458" y1="145" x2="473" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vdu-story)"/>
<rect x="473" y="60" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="489" cy="76" r="11" fill="#B45309"/>
<text x="489" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
<text x="549.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Read</text>
<text x="541.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">severity, VUID</text>
<text x="541.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">object names</text>
<text x="541.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">call stack</text>
<line x1="609" y1="145" x2="624" y2="145" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-vdu-story)"/>
<rect x="624" y="60" width="136" height="170" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="640" cy="76" r="11" fill="#4F46E5"/>
<text x="640" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
<text x="700.0" y="82" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Fix</text>
<text x="692.0" y="130" text-anchor="middle" font-size="11" fill="#3730A3">use the spec link</text>
<text x="692.0" y="152" text-anchor="middle" font-size="11" fill="#3730A3">in the message</text>
<text x="692.0" y="174" text-anchor="middle" font-size="11" fill="#3730A3">re-run clean</text>
<text x="380" y="265" text-anchor="middle" font-size="12" fill="#374151">Zero messages is the goal: treat every warning as a bug to explain or silence on purpose</text>
<text x="380" y="290" text-anchor="middle" font-size="11" fill="#6B7280">Keep validation out of shipped builds</text>
</svg>
