<svg viewBox="0 0 900 520" width="900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" fill="#1a1a1a" font-weight="700" >Test certificate chain used by the examples and how a validator uses it</text>
  <rect x="40" y="60" width="360" height="120" rx="8" fill="#e1f0ff" stroke="#1f5fa6" stroke-width="1.8"/>
  <text x="220" y="84" text-anchor="middle" font-size="13" fill="#1f5fa6" font-weight="700" >Trust anchor: self-signed root CA</text>
  <text x="220" y="104" text-anchor="middle" font-size="12" fill="#1a1a1a" font-family="Courier New, monospace">CN=Bookshelf Billing Test Root CA</text>
  <text x="220" y="124" text-anchor="middle" font-size="11.5" fill="#333" >issuer = subject, signed with its own key</text>
  <text x="220" y="142" text-anchor="middle" font-size="11.5" fill="#333" >basicConstraints CA:TRUE, keyUsage keyCertSign cRLSign</text>
  <text x="220" y="162" text-anchor="middle" font-size="10.5" fill="#1f5fa6" font-family="Courier New, monospace">keystore billing-test-ca.p12, alias billing-test-ca</text>
  <rect x="40" y="260" width="360" height="120" rx="8" fill="#e3f6e3" stroke="#2b7a2b" stroke-width="1.8"/>
  <text x="220" y="284" text-anchor="middle" font-size="13" fill="#2b7a2b" font-weight="700" >End-entity: signer certificate</text>
  <text x="220" y="304" text-anchor="middle" font-size="12" fill="#1a1a1a" font-family="Courier New, monospace">CN=Bookshelf Billing Test Signer</text>
  <text x="220" y="324" text-anchor="middle" font-size="11.5" fill="#333" >issuer = Root CA, signed with the CA private key</text>
  <text x="220" y="342" text-anchor="middle" font-size="11.5" fill="#333" >CA:FALSE, digitalSignature nonRepudiation, EKU emailProtection</text>
  <text x="220" y="362" text-anchor="middle" font-size="10.5" fill="#2b7a2b" font-family="Courier New, monospace">keystore billing-signer.p12, alias billing-signer</text>
  <line x1="220" y1="260" x2="220" y2="182" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="232" y="225" text-anchor="start" font-size="11.5" fill="#555" >issued by (certification path)</text>
  <rect x="40" y="420" width="360" height="60" rx="8" fill="#fff1d6" stroke="#b36b00" stroke-width="1.4"/>
  <text x="220" y="444" text-anchor="middle" font-size="12.5" fill="#7a4800" font-weight="700" >Private key of the signer</text>
  <text x="220" y="464" text-anchor="middle" font-size="11.5" fill="#333" >never leaves the PKCS#12 file or HSM, signs the CMS attributes</text>
  <line x1="220" y1="420" x2="220" y2="382" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="500" y="60" width="360" height="150" rx="8" fill="#f3e8fd" stroke="#7b3fb5" stroke-width="1.8"/>
  <text x="680" y="84" text-anchor="middle" font-size="13" fill="#4a1d75" font-weight="700" >Inside the signed PDF (/Contents CMS)</text>
  <text x="680" y="106" text-anchor="middle" font-size="11.5" fill="#333" >certificates: signer certificate and Root CA</text>
  <text x="680" y="124" text-anchor="middle" font-size="11.5" fill="#333" >(the root is optional: validators ignore it)</text>
  <text x="680" y="148" text-anchor="middle" font-size="11.5" fill="#333" >SignerInfo: sid = issuer + serial number</text>
  <text x="680" y="166" text-anchor="middle" font-size="11.5" fill="#333" >digestAlgorithm SHA-256, signature algorithm</text>
  <text x="680" y="184" text-anchor="middle" font-size="11.5" fill="#333" >signed attributes: messageDigest, signingCertificateV2</text>
  <line x1="400" y1="320" x2="500" y2="150" stroke="#555" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <rect x="500" y="250" width="360" height="230" rx="8" fill="#fff1d6" stroke="#b36b00" stroke-width="1.8"/>
  <text x="680" y="274" text-anchor="middle" font-size="13" fill="#7a4800" font-weight="700" >What a validator does</text>
  <text x="520" y="300" text-anchor="start" font-size="11.5" fill="#333" >1. Take the signer certificate named by the sid</text>
  <text x="520" y="320" text-anchor="start" font-size="11.5" fill="#333" >2. Build a path to a configured trust anchor</text>
  <text x="520" y="340" text-anchor="start" font-size="11.5" fill="#333" >    (billing-test-ca.pem, never a public root)</text>
  <text x="520" y="360" text-anchor="start" font-size="11.5" fill="#333" >3. Check every signature in the path (RFC 5280)</text>
  <text x="520" y="380" text-anchor="start" font-size="11.5" fill="#333" >4. Check validity dates at the signing time</text>
  <text x="520" y="400" text-anchor="start" font-size="11.5" fill="#333" >5. Check basicConstraints, keyUsage and EKU</text>
  <text x="520" y="420" text-anchor="start" font-size="11.5" fill="#333" >6. Check revocation: OCSP or CRL (see PAdES B-LT)</text>
  <text x="520" y="440" text-anchor="start" font-size="11.5" fill="#333" >7. Verify the CMS signature with the public key</text>
  <text x="520" y="460" text-anchor="start" font-size="11.5" fill="#333" >8. Recompute the ByteRange digest and compare</text>
</svg>
