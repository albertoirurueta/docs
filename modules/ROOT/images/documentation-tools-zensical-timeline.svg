<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="zt-title zt-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="zt-title">Timeline of MkDocs, Material for MkDocs and Zensical</title>
  <desc id="zt-desc">Three lanes. MkDocs: first PyPI release in 2014, 1.6.1 in August 2024, no stable release since. Material for MkDocs: first release 2016, 9.7.0 in November 2025, critical fixes until 2027-05-05. Zensical: first PyPI upload November 2024, public announcement 2025-11-05, 0.0.72 in October 2026, 0.1.0 planned 2026-11-05.</desc>
  <rect x="0" y="0" width="920" height="400" rx="14" fill="#1e293b"/>
  <!-- year axis: x = 60 + (year-2014)*60 -->
  <line x1="60" y1="50" x2="880" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <g font-size="13" fill="#e2e8f0" text-anchor="middle">
    <text x="60" y="36">2014</text><text x="180" y="36">2016</text><text x="300" y="36">2018</text><text x="420" y="36">2020</text>
    <text x="540" y="36">2022</text><text x="660" y="36">2024</text><text x="780" y="36">2026</text><text x="870" y="36">2027</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="60" y1="44" x2="60" y2="56"/><line x1="180" y1="44" x2="180" y2="56"/><line x1="300" y1="44" x2="300" y2="56"/><line x1="420" y1="44" x2="420" y2="56"/>
    <line x1="540" y1="44" x2="540" y2="56"/><line x1="660" y1="44" x2="660" y2="56"/><line x1="780" y1="44" x2="780" y2="56"/><line x1="870" y1="44" x2="870" y2="56"/>
  </g>

  <!-- lane MkDocs -->
  <text x="30" y="96" font-size="15" font-weight="bold" fill="#93c5fd">MkDocs</text>
  <rect x="60" y="106" width="620" height="22" rx="6" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="370" y="122" text-anchor="middle" font-size="12.5" fill="#ffffff">active releases, last stable 1.6.1 (2024-08-30)</text>
  <rect x="680" y="106" width="200" height="22" rx="6" fill="#475569" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="780" y="122" text-anchor="middle" font-size="12.5" fill="#f8fafc">no stable release since</text>
  <circle cx="60" cy="117" r="6" fill="#facc15"/>
  <text x="66" y="150" font-size="12" fill="#e2e8f0">2014-01: first PyPI release</text>

  <!-- lane Material -->
  <text x="30" y="196" font-size="15" font-weight="bold" fill="#5eead4">Material for MkDocs</text>
  <rect x="180" y="206" width="560" height="22" rx="6" fill="#0f766e" stroke="#5eead4"/>
  <text x="460" y="222" text-anchor="middle" font-size="12.5" fill="#ffffff">feature development, 0.1.0 (2016) to 9.7.0 (2025-11)</text>
  <rect x="740" y="206" width="130" height="22" rx="6" fill="#92400e" stroke="#fbbf24"/>
  <text x="805" y="222" text-anchor="middle" font-size="12.5" fill="#ffffff">critical fixes only</text>
  <circle cx="180" cy="217" r="6" fill="#facc15"/>
  <text x="186" y="250" font-size="12" fill="#e2e8f0">2016-02: first release</text>
  <line x1="870" y1="198" x2="870" y2="236" stroke="#fbbf24" stroke-width="2"/>
  <text x="870" y="252" text-anchor="end" font-size="12" fill="#fde68a">2027-05-05: end of fixes</text>

  <!-- lane Zensical -->
  <text x="30" y="296" font-size="15" font-weight="bold" fill="#c4b5fd">Zensical</text>
  <rect x="660" y="306" width="120" height="22" rx="6" fill="#6d28d9" stroke="#c4b5fd"/>
  <text x="720" y="322" text-anchor="middle" font-size="12.5" fill="#ffffff">0.0.x alpha</text>
  <rect x="780" y="306" width="100" height="22" rx="6" fill="#4c1d95" stroke="#c4b5fd" stroke-dasharray="5 4"/>
  <text x="830" y="322" text-anchor="middle" font-size="12.5" fill="#ffffff">0.1.0 line</text>
  <circle cx="660" cy="317" r="6" fill="#facc15"/>
  <text x="654" y="350" text-anchor="end" font-size="12" fill="#e2e8f0">2024-11: first PyPI upload (0.0.0)</text>
  <text x="680" y="350" font-size="12" fill="#e2e8f0">2025-11-05: public announcement</text>
  <text x="880" y="372" text-anchor="end" font-size="12" fill="#e2e8f0">2026-10: 0.0.72 on PyPI; 2026-11-05: 0.1.0 planned</text>
</svg>
