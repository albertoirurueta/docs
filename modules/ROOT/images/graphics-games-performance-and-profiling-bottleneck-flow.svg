<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="pbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Finding the bottleneck: measure, then change one thing</text>
<rect x="270" y="46" width="220" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="65.0" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Start</text>
<text x="380.0" y="82.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">frame time above budget</text>
<rect x="270" y="116" width="220" height="52" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="130.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Measure both</text>
<text x="380.0" y="147.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">CPU frame time vs GPU frame time</text>
<text x="380.0" y="163.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(timers, not frames per second)</text>
<line x1="380" y1="92" x2="380" y2="114" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbf)"/>
<rect x="60" y="206" width="250" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="185.0" y="236.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">CPU-bound</text>
<text x="185.0" y="253.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">too many draw calls or state changes</text>
<text x="185.0" y="269.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">slow game logic, physics, culling</text>
<text x="185.0" y="285.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">driver or render-thread stalls</text>
<rect x="450" y="206" width="250" height="100" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="575.0" y="236.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">GPU-bound</text>
<text x="575.0" y="253.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">vertex work</text>
<text x="575.0" y="269.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">fragment work and overdraw</text>
<text x="575.0" y="285.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">memory bandwidth, texture misses</text>
<line x1="330" y1="168" x2="190" y2="204" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbf)"/>
<line x1="430" y1="168" x2="570" y2="204" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbf)"/>
<rect x="60" y="340" width="250" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="185.0" y="370.0" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Reduce CPU cost</text>
<text x="185.0" y="387.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">batch, instance, merge meshes</text>
<text x="185.0" y="403.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">cull and LOD, move work to jobs</text>
<text x="185.0" y="419.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">record commands on several threads</text>
<rect x="450" y="340" width="250" height="100" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="575.0" y="370.0" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Reduce GPU cost</text>
<text x="575.0" y="387.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">lower resolution helps: pixel-bound</text>
<text x="575.0" y="403.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">fewer triangles help: vertex-bound</text>
<text x="575.0" y="419.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">smaller formats, mipmaps, compression</text>
<line x1="190" y1="306" x2="190" y2="338" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbf)"/>
<line x1="570" y1="306" x2="570" y2="338" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbf)"/>
<path d="M60,390 C 20,390 20,142 268,142" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pbf)"/>
<text x="380" y="390" font-size="12" font-weight="bold" fill="#4B5563" text-anchor="middle">measure again</text>
<line x1="310" y1="390" x2="450" y2="390" stroke="#4B5563" stroke-width="1.5" marker-end="url(#pbf)" stroke-dasharray="5 4"/>
</svg>
