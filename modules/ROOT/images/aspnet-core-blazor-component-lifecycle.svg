<svg viewBox="0 0 760 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="720" fill="#ffffff"/>

  <text x="380" y="30" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Blazor component lifecycle</text>

  <!-- SetParametersAsync -->
  <rect x="230" y="55" width="300" height="55" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="380" y="78" font-size="13" font-weight="bold" fill="#1c4b73" text-anchor="middle">SetParametersAsync</text>
  <text x="380" y="96" font-size="10.5" fill="#1c4b73" text-anchor="middle">receives incoming [Parameter] values</text>

  <line x1="380" y1="110" x2="380" y2="130" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- first render only box -->
  <rect x="150" y="132" width="460" height="110" rx="8" fill="#f3f7fb" stroke="#9db8d0" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="380" y="150" font-size="11" font-weight="bold" fill="#1c4b73" text-anchor="middle">first render only</text>

  <rect x="180" y="160" width="400" height="35" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="380" y="182" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">OnInitialized / OnInitializedAsync</text>

  <line x1="380" y1="195" x2="380" y2="210" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OnParametersSet -->
  <rect x="180" y="255" width="400" height="45" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="380" y="273" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">OnParametersSet / OnParametersSetAsync</text>
  <text x="380" y="290" font-size="10" fill="#2f5424" text-anchor="middle">re-runs on every subsequent parameter update</text>

  <line x1="380" y1="242" x2="380" y2="255" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="300" x2="380" y2="320" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ShouldRender diamond -->
  <polygon points="380,325 460,365 380,405 300,365" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="380" y="361" font-size="11.5" font-weight="bold" fill="#8a3d10" text-anchor="middle">ShouldRender()</text>
  <text x="380" y="377" font-size="10" fill="#8a3d10" text-anchor="middle">true?</text>

  <line x1="380" y1="405" x2="380" y2="430" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="398" y="420" font-size="10" fill="#666666">yes</text>

  <!-- Render tree -->
  <rect x="230" y="432" width="300" height="45" rx="6" fill="#dce9f7" stroke="#2f6fa8" stroke-width="2"/>
  <text x="380" y="451" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">Render (build render tree,</text>
  <text x="380" y="467" font-size="12.5" font-weight="bold" fill="#1c4b73" text-anchor="middle">diff, patch the DOM)</text>

  <!-- no branch back to parameters set loop -->
  <line x1="300" y1="365" x2="120" y2="365" stroke="#666666" stroke-width="1.5"/>
  <line x1="120" y1="365" x2="120" y2="277" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="358" font-size="10" fill="#666666">no (skip render)</text>

  <line x1="380" y1="477" x2="380" y2="497" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OnAfterRender -->
  <rect x="180" y="499" width="400" height="45" rx="6" fill="#dbe9d5" stroke="#4a7a3a" stroke-width="2"/>
  <text x="380" y="518" font-size="12.5" font-weight="bold" fill="#2f5424" text-anchor="middle">OnAfterRender / OnAfterRenderAsync</text>
  <text x="380" y="535" font-size="10" fill="#2f5424" text-anchor="middle">firstRender flag; safe place for JS interop</text>

  <!-- loop back for parameter updates / StateHasChanged -->
  <line x1="580" y1="521" x2="660" y2="521" stroke="#666666" stroke-width="1.5"/>
  <line x1="660" y1="521" x2="660" y2="277" stroke="#666666" stroke-width="1.5"/>
  <line x1="660" y1="277" x2="580" y2="277" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="400" font-size="10" fill="#666666" text-anchor="middle" transform="rotate(90 700 400)">new parameters / StateHasChanged()</text>

  <line x1="380" y1="544" x2="380" y2="564" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dispose -->
  <rect x="230" y="566" width="300" height="55" rx="6" fill="#f7e6cf" stroke="#c25a1d" stroke-width="2"/>
  <text x="380" y="589" font-size="13" font-weight="bold" fill="#8a3d10" text-anchor="middle">IDisposable / IAsyncDisposable</text>
  <text x="380" y="607" font-size="10.5" fill="#8a3d10" text-anchor="middle">runs when the component is removed from the tree</text>

  <text x="380" y="655" font-size="12.5" fill="#444444" text-anchor="middle">A parent that re-renders re-invokes SetParametersAsync on its children,</text>
  <text x="380" y="675" font-size="12.5" fill="#444444" text-anchor="middle">so OnParametersSet runs again while OnInitialized never does.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666"/>
    </marker>
  </defs>
</svg>
