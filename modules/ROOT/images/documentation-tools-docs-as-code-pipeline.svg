<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">The docs-as-code pipeline</title>
  <desc id="d">Documentation sources kept in Git are turned into a static site by one of four generators and published to a static host. The input formats of each generator are listed.</desc>
  <rect width="760" height="380" rx="12" fill="#1f2937"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e5e7eb"/></marker></defs>
  <text x="20" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">1. Sources in Git</text>
  <text x="250" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">2. Generator</text>
  <text x="520" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">3. Static site</text>
  <text x="640" y="28" font-size="13" font-weight="bold" fill="#e5e7eb">4. Hosting</text>

  <rect x="20" y="44" width="190" height="64" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="32" y="66" font-size="13" font-weight="bold" fill="#f9fafb">AsciiDoc pages</text>
  <text x="32" y="86" font-size="12" fill="#d1d5db">.adoc, nav files, antora.yml</text>
  <rect x="20" y="124" width="190" height="64" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="32" y="146" font-size="13" font-weight="bold" fill="#f9fafb">Markdown and MDX</text>
  <text x="32" y="166" font-size="12" fill="#d1d5db">.md, .mdx, sidebars.ts</text>
  <rect x="20" y="204" width="190" height="64" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="32" y="226" font-size="13" font-weight="bold" fill="#f9fafb">Markdown</text>
  <text x="32" y="246" font-size="12" fill="#d1d5db">.md, zensical.toml or mkdocs.yml</text>
  <rect x="20" y="284" width="190" height="64" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="32" y="306" font-size="13" font-weight="bold" fill="#f9fafb">Markdown, YAML, C# code</text>
  <text x="32" y="326" font-size="12" fill="#d1d5db">.md, toc.yml, docfx.json, XML docs</text>

  <rect x="250" y="44" width="200" height="64" rx="8" fill="#065f46" stroke="#34d399"/>
  <text x="262" y="72" font-size="14" font-weight="bold" fill="#ffffff">Antora</text>
  <text x="262" y="92" font-size="12" fill="#d1fae5">many repositories and versions</text>
  <rect x="250" y="124" width="200" height="64" rx="8" fill="#1e40af" stroke="#60a5fa"/>
  <text x="262" y="152" font-size="14" font-weight="bold" fill="#ffffff">Docusaurus</text>
  <text x="262" y="172" font-size="12" fill="#dbeafe">React, plugins, blog, i18n</text>
  <rect x="250" y="204" width="200" height="64" rx="8" fill="#5b21b6" stroke="#a78bfa"/>
  <text x="262" y="232" font-size="14" font-weight="bold" fill="#ffffff">Zensical</text>
  <text x="262" y="252" font-size="12" fill="#ede9fe">Rust core, Material look</text>
  <rect x="250" y="284" width="200" height="64" rx="8" fill="#9a3412" stroke="#fb923c"/>
  <text x="262" y="312" font-size="14" font-weight="bold" fill="#ffffff">DocFX</text>
  <text x="262" y="332" font-size="12" fill="#ffedd5">.NET API reference</text>

  <path d="M210,76 H248" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M210,156 H248" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M210,236 H248" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M210,316 H248" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="500" y="110" width="100" height="150" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="512" y="140" font-size="13" font-weight="bold" fill="#f9fafb">HTML</text>
  <text x="512" y="162" font-size="12" fill="#d1d5db">CSS, JS</text>
  <text x="512" y="182" font-size="12" fill="#d1d5db">images</text>
  <text x="512" y="202" font-size="12" fill="#d1d5db">search index</text>
  <text x="512" y="222" font-size="12" fill="#d1d5db">sitemap</text>
  <path d="M450,76 C480,76 480,150 498,170" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M450,156 H498" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M450,236 H474 V200 H498" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M450,316 C480,316 480,240 498,226" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="640" y="110" width="100" height="150" rx="8" fill="#374151" stroke="#9ca3af"/>
  <text x="652" y="140" font-size="13" font-weight="bold" fill="#f9fafb">Static host</text>
  <text x="652" y="162" font-size="12" fill="#d1d5db">GitHub Pages</text>
  <text x="652" y="182" font-size="12" fill="#d1d5db">GitLab Pages</text>
  <text x="652" y="202" font-size="12" fill="#d1d5db">Netlify</text>
  <text x="652" y="222" font-size="12" fill="#d1d5db">any web server</text>
  <path d="M600,185 H638" stroke="#e5e7eb" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text x="500" y="300" font-size="12" fill="#d1d5db">A CI job builds on every push</text>
  <text x="500" y="318" font-size="12" fill="#d1d5db">and deploys the output folder.</text>
</svg>
