<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-sc-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Offline pipelines: compile on the workstation, look up on the target</text>
<rect x="20" y="60" width="200" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="102.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Build time inputs</text>
<text x="120.0" y="118.0" text-anchor="middle" font-size="12" fill="#3730A3">SPIR-V shaders</text>
<text x="120.0" y="134.0" text-anchor="middle" font-size="12" fill="#3730A3">pipeline state as JSON</text>
<rect x="280" y="60" width="200" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="102.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Offline compiler</text>
<text x="380.0" y="118.0" text-anchor="middle" font-size="12" fill="#92400E">vendor pipeline cache</text>
<text x="380.0" y="134.0" text-anchor="middle" font-size="12" fill="#92400E">compiler (offline)</text>
<rect x="540" y="60" width="200" height="110" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="102.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Pipeline cache data</text>
<text x="640.0" y="118.0" text-anchor="middle" font-size="12" fill="#065F46">one binary blob</text>
<text x="640.0" y="134.0" text-anchor="middle" font-size="12" fill="#065F46">indexed by pipeline UUID</text>
<line x1="220" y1="115" x2="278" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-sc-flow)"/>
<line x1="480" y1="115" x2="538" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-sc-flow)"/>
<text x="380" y="205" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Shipped inside the certified software image</text>
<line x1="20" y1="215" x2="740" y2="215" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="20" y="240" width="200" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="120.0" y="282.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Init phase</text>
<text x="120.0" y="298.0" text-anchor="middle" font-size="12" fill="#3730A3">vkCreateDevice with</text>
<text x="120.0" y="314.0" text-anchor="middle" font-size="12" fill="#3730A3">reservation limits</text>
<rect x="280" y="240" width="200" height="110" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="380.0" y="282.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Create pipelines</text>
<text x="380.0" y="298.0" text-anchor="middle" font-size="12" fill="#3730A3">vkCreateGraphicsPipelines</text>
<text x="380.0" y="314.0" text-anchor="middle" font-size="12" fill="#3730A3">VkPipelineOfflineCreateInfo</text>
<rect x="540" y="240" width="200" height="110" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="640.0" y="282.0" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Run phase</text>
<text x="640.0" y="298.0" text-anchor="middle" font-size="12" fill="#065F46">record, submit, present</text>
<text x="640.0" y="314.0" text-anchor="middle" font-size="12" fill="#065F46">no compiler, no allocation</text>
<line x1="220" y1="295" x2="278" y2="295" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-sc-flow)"/>
<line x1="480" y1="295" x2="538" y2="295" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-sc-flow)"/>
<line x1="640" y1="172" x2="640" y2="238" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-vk-sc-flow)"/>
<text x="380" y="380" text-anchor="middle" font-size="11" fill="#374151">No match in the cache returns VK_ERROR_NO_PIPELINE_MATCH instead of compiling.</text>
</svg>
