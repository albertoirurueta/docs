<svg viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4B5563"/></marker></defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Anatomy of manifest.json</text>
<rect x="20" y="50" width="330" height="260" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
<g font-size="13" fill="#1F2937" font-family="Menlo, Consolas, monospace">
<text x="34" y="76">{</text>
<text x="48" y="100">"name": "Bookshelf Contrast Audit",</text>
<text x="48" y="124">"id": "(assigned by Figma)",</text>
<text x="48" y="148">"api": "1.0.0",</text>
<text x="48" y="172">"main": "code.js",</text>
<text x="48" y="196">"ui": "ui.html",</text>
<text x="48" y="220">"editorType": ["figma"],</text>
<text x="48" y="244">"documentAccess": "dynamic-page",</text>
<text x="48" y="268">"networkAccess": { "allowedDomains": ["none"] }</text>
<text x="34" y="292">}</text></g>
<g fill="#4F46E5"><circle cx="372" cy="95" r="11"/><circle cx="372" cy="167" r="11"/><circle cx="372" cy="215" r="11"/><circle cx="372" cy="239" r="11"/><circle cx="372" cy="263" r="11"/></g>
<g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><text x="372" y="99">1</text><text x="372" y="171">2</text><text x="372" y="219">3</text><text x="372" y="243">4</text><text x="372" y="267">5</text></g>
<g stroke="#4B5563" stroke-width="1" stroke-dasharray="4 3"><line x1="350" y1="95" x2="360" y2="95"/><line x1="350" y1="167" x2="360" y2="167"/><line x1="350" y1="215" x2="360" y2="215"/><line x1="350" y1="239" x2="360" y2="239"/><line x1="350" y1="263" x2="360" y2="263"/></g>
<g font-size="13" fill="#374151">
<text x="394" y="92" font-weight="bold">Identity</text><text x="394" y="108">name and id; Figma assigns the id</text>
<text x="394" y="164" font-weight="bold">Entry points</text><text x="394" y="180">main is the sandbox code, ui the iframe HTML</text>
<text x="394" y="212" font-weight="bold">Where it runs</text><text x="394" y="228" fill="#4B5563">editorType: Design, FigJam, Dev Mode, Slides, Buzz</text>
<text x="394" y="252" font-weight="bold">Page loading</text><text x="394" y="268" fill="#4B5563">dynamic-page for new plugins</text>
<text x="394" y="292" font-weight="bold">Network</text><text x="394" y="308" fill="#4B5563">list only the domains the plugin needs</text></g>
</svg>
