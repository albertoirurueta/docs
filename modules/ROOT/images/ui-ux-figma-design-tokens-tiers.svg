<svg viewBox="0 0 740 360" width="740" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="740" height="360" fill="#FFFFFF"/>
<text x="370" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Three token tiers for Bookshelf</text>
<polygon points="260,56 380,56 440,126 200,126" fill="#FEF3C7" stroke="#B45309" stroke-width="2" transform="translate(-10,0)"/>
<polygon points="180,136 450,136 510,206 120,206" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" transform="translate(-10,0)"/>
<polygon points="100,216 530,216 590,300 40,300" fill="#F3F4F6" stroke="#4B5563" stroke-width="2" transform="translate(-10,0)"/>
<g text-anchor="middle" font-size="13" fill="#374151">
<text x="315" y="86" font-weight="bold" fill="#92400E">Component</text><text x="315" y="106">button/background</text>
<text x="315" y="166" font-weight="bold" fill="#3730A3">Semantic</text><text x="315" y="186">color/action/primary</text>
<text x="315" y="248" font-weight="bold">Primitive</text><text x="315" y="268">color/indigo/600 = #000000 (placeholder)</text></g>
<g stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"><line x1="640" y1="270" x2="640" y2="86"/></g>
<text x="650" y="150" font-size="12" fill="#374151">aliases point</text><text x="650" y="166" font-size="12" fill="#374151">upwards in use,</text><text x="650" y="182" font-size="12" fill="#374151">downwards in</text><text x="650" y="198" font-size="12" fill="#374151">definition</text>
<text x="370" y="338" font-size="12" fill="#374151" text-anchor="middle">Modes (light, dark) usually switch the semantic tier; primitives stay fixed.</text>
</svg>
