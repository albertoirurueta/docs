<svg viewBox="0 0 760 400" width="760" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-vk-tess-stages" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Geometry-processing stages: classic path and the mesh path</text>
<rect x="20" y="70" width="108" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="74" y="96" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Vertex</text>
<text x="74" y="114" text-anchor="middle" font-size="11" fill="#3730A3">shader</text>
<line x1="128" y1="100" x2="144" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tess-stages)"/>
<rect x="144" y="70" width="108" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="198" y="96" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Tess. ctrl.</text>
<text x="198" y="114" text-anchor="middle" font-size="11" fill="#3730A3">shader</text>
<line x1="252" y1="100" x2="268" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tess-stages)"/>
<rect x="268" y="70" width="108" height="60" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="322" y="96" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Tessellator</text>
<text x="322" y="114" text-anchor="middle" font-size="11" fill="#374151">fixed function</text>
<line x1="376" y1="100" x2="392" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tess-stages)"/>
<rect x="392" y="70" width="108" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="446" y="96" text-anchor="middle" font-size="12" fill="#3730A3" font-weight="bold">Tess. eval.</text>
<text x="446" y="114" text-anchor="middle" font-size="11" fill="#3730A3">shader</text>
<line x1="500" y1="100" x2="516" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tess-stages)"/>
<rect x="516" y="70" width="108" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="570" y="96" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Geometry</text>
<text x="570" y="114" text-anchor="middle" font-size="11" fill="#92400E">shader</text>
<line x1="624" y1="100" x2="640" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tess-stages)"/>
<rect x="640" y="70" width="108" height="60" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="694" y="96" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Rasterizer</text>
<text x="694" y="114" text-anchor="middle" font-size="11" fill="#374151">fixed function</text>
<text x="380" y="160" text-anchor="middle" font-size="11" fill="#374151">Optional stages: tessellation and geometry (features tessellationShader, geometryShader).</text>
<rect x="20" y="215" width="108" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="74" y="241" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">Task</text>
<text x="74" y="259" text-anchor="middle" font-size="11" fill="#065F46">optional shader</text>
<rect x="144" y="215" width="108" height="60" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="198" y="241" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">Mesh</text>
<text x="198" y="259" text-anchor="middle" font-size="11" fill="#065F46">shader</text>
<rect x="268" y="215" width="108" height="60" rx="8" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="322" y="241" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Rasterizer</text>
<text x="322" y="259" text-anchor="middle" font-size="11" fill="#374151">fixed function</text>
<line x1="128" y1="245" x2="144" y2="245" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tess-stages)"/>
<line x1="252" y1="245" x2="268" y2="245" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-vk-tess-stages)"/>
<text x="190" y="200" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">Mesh path (VK_EXT_mesh_shader)</text>
<rect x="420" y="205" width="320" height="100" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="580" y="230" text-anchor="middle" font-size="12" fill="#92400E" font-weight="bold">Why geometry shaders are avoided</text>
<text x="580" y="250" text-anchor="middle" font-size="11" fill="#92400E">Variable output per invocation forces the GPU</text>
<text x="580" y="266" text-anchor="middle" font-size="11" fill="#92400E">to buffer results; tile-based GPUs pay extra</text>
<text x="580" y="282" text-anchor="middle" font-size="11" fill="#92400E">for it. Prefer instancing, compute or mesh shaders.</text>
<text x="380" y="345" text-anchor="middle" font-size="12" fill="#374151">A pipeline uses either the vertex path (left, top) or the mesh path, never both.</text>
<text x="380" y="365" text-anchor="middle" font-size="12" fill="#374151">Both paths feed the same rasterizer and fragment stage.</text>
</svg>
