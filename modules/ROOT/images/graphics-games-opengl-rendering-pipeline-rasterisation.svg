<text x="160" y="300" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Pixels whose sample point is inside become fragments</text>
<rect x="330" y="60" width="190" height="70" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="425.0" y="84.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Barycentric weights</text>
<text x="425.0" y="99.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">l0 + l1 + l2 = 1</text>
<text x="425.0" y="114.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">interpolate a varying</text>
<rect x="540" y="60" width="190" height="70" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="635.0" y="84.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Perspective correct</text>
<text x="635.0" y="99.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">divide by w, then</text>
<text x="635.0" y="114.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">interpolate</text>
<rect x="330" y="160" width="400" height="60" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="530.0" y="194.2" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">out = l0*v0 + l1*v1 + l2*v2  (per-fragment value)</text>
<rect x="330" y="240" width="190" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="425.0" y="264.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">flat qualifier:</text>
<text x="425.0" y="278.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">provoking vertex only</text>
<rect x="540" y="240" width="190" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="635.0" y="264.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">noperspective:</text>
<text x="635.0" y="278.9" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">screen-space linear</text>
