<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>Reference architecture of a production RAG service</title>
  <desc>Two planes share the stores. The ingestion plane reads sources, parses, redacts, chunks, embeds and writes to the stores, driven by batch jobs and change events. The query plane receives a request at the API gateway, which authenticates the caller; a stateless orchestrator applies input guardrails, loads the conversation, fans out to vector, keyword and graph retrievers in parallel with the caller's ACL filter, gathers and reranks the candidates, calls the generator model, runs output guardrails and citation checks, and streams the answer. Caches, the conversation store, observability and evaluation sit alongside.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="640" fill="#f8fafc"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">DocsAssistant: reference architecture of a production RAG service</text>

  <!-- ingestion plane -->
  <rect x="20" y="50" width="920" height="150" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="36" y="74" font-size="15" font-weight="bold" fill="#14532d">Ingestion plane (batch jobs + change events, scaled on CPU and GPU workers)</text>
  <g font-size="12" fill="#14532d" text-anchor="middle">
    <rect x="36" y="92" width="120" height="86" rx="8" fill="#ffffff" stroke="#15803d"/>
    <text x="96" y="120" font-weight="bold">Sources</text><text x="96" y="138">Git, PDFs, wiki</text><text x="96" y="156">CDC via Kafka</text>
    <rect x="182" y="92" width="120" height="86" rx="8" fill="#ffffff" stroke="#15803d"/>
    <text x="242" y="120" font-weight="bold">Parse</text><text x="242" y="138">parser ladder</text><text x="242" y="156">OCR, tables, VLM</text>
    <rect x="328" y="92" width="120" height="86" rx="8" fill="#ffffff" stroke="#15803d"/>
    <text x="388" y="120" font-weight="bold">Redact + tag</text><text x="388" y="138">PII, ACL groups</text><text x="388" y="156">content hash</text>
    <rect x="474" y="92" width="120" height="86" rx="8" fill="#ffffff" stroke="#15803d"/>
    <text x="534" y="120" font-weight="bold">Chunk</text><text x="534" y="138">structure-aware</text><text x="534" y="156">parent / child</text>
    <rect x="620" y="92" width="120" height="86" rx="8" fill="#ffffff" stroke="#15803d"/>
    <text x="680" y="120" font-weight="bold">Embed</text><text x="680" y="138">GPU or API</text><text x="680" y="156">batched</text>
    <rect x="766" y="92" width="158" height="86" rx="8" fill="#ffffff" stroke="#15803d"/>
    <text x="845" y="120" font-weight="bold">Index writer</text><text x="845" y="138">upsert, delete by hash</text><text x="845" y="156">graph MERGE</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#a)">
    <line x1="156" y1="135" x2="180" y2="135"/><line x1="302" y1="135" x2="326" y2="135"/>
    <line x1="448" y1="135" x2="472" y2="135"/><line x1="594" y1="135" x2="618" y2="135"/>
    <line x1="740" y1="135" x2="764" y2="135"/>
  </g>

  <!-- stores -->
  <rect x="20" y="216" width="920" height="84" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="36" y="238" font-size="15" font-weight="bold" fill="#78350f">Stores</text>
  <g font-size="12" fill="#78350f" text-anchor="middle">
    <rect x="110" y="228" width="190" height="60" rx="8" fill="#ffffff" stroke="#b45309"/>
    <text x="205" y="253" font-weight="bold">PostgreSQL + pgvector</text><text x="205" y="272">chunks, vectors, full-text</text>
    <rect x="320" y="228" width="150" height="60" rx="8" fill="#ffffff" stroke="#b45309"/>
    <text x="395" y="253" font-weight="bold">Neo4j</text><text x="395" y="272">components, concepts</text>
    <rect x="490" y="228" width="170" height="60" rx="8" fill="#ffffff" stroke="#b45309"/>
    <text x="575" y="253" font-weight="bold">Conversation store</text><text x="575" y="272">checkpoints, memory</text>
    <rect x="680" y="228" width="120" height="60" rx="8" fill="#ffffff" stroke="#b45309"/>
    <text x="740" y="253" font-weight="bold">Redis</text><text x="740" y="272">cache tiers</text>
    <rect x="820" y="228" width="104" height="60" rx="8" fill="#ffffff" stroke="#b45309"/>
    <text x="872" y="253" font-weight="bold">Object store</text><text x="872" y="272">originals</text>
  </g>

  <!-- query plane -->
  <rect x="20" y="316" width="920" height="232" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="36" y="340" font-size="15" font-weight="bold" fill="#1e3a8a">Query plane (stateless, scaled on request rate; model calls on a separate GPU or API tier)</text>
  <g font-size="12" fill="#1e3a8a" text-anchor="middle">
    <rect x="36" y="360" width="118" height="74" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="95" y="384" font-weight="bold">API gateway</text><text x="95" y="402">OAuth2 / JWT</text><text x="95" y="420">rate limits</text>
    <rect x="180" y="360" width="130" height="74" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="245" y="384" font-weight="bold">Input guardrails</text><text x="245" y="402">injection, topic</text><text x="245" y="420">condense query</text>
    <rect x="336" y="352" width="170" height="182" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-dasharray="5 3"/>
    <text x="421" y="372" font-weight="bold">Fan-out with ACL filter</text>
    <rect x="352" y="382" width="138" height="38" rx="6" fill="#ffffff" stroke="#1d4ed8"/><text x="421" y="406">vector search</text>
    <rect x="352" y="428" width="138" height="38" rx="6" fill="#ffffff" stroke="#1d4ed8"/><text x="421" y="452">keyword (BM25)</text>
    <rect x="352" y="474" width="138" height="38" rx="6" fill="#ffffff" stroke="#1d4ed8"/><text x="421" y="498">graph / SQL route</text>
    <rect x="532" y="360" width="120" height="74" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="592" y="384" font-weight="bold">Gather + rerank</text><text x="592" y="402">dedupe, RRF</text><text x="592" y="420">cross-encoder</text>
    <rect x="678" y="360" width="112" height="74" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="734" y="384" font-weight="bold">Generator</text><text x="734" y="402">LLM, streaming</text><text x="734" y="420">prompt cache</text>
    <rect x="812" y="360" width="112" height="74" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="868" y="384" font-weight="bold">Output checks</text><text x="868" y="402">citations</text><text x="868" y="420">faithfulness</text>
    <rect x="532" y="460" width="392" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="728" y="482" font-weight="bold">Orchestrator (stateless): budget, timeouts, fallbacks</text>
    <text x="728" y="500">state lives in the stores, so any replica serves any turn</text>
  </g>
  <g stroke="#334155" stroke-width="1.6" marker-end="url(#a)" fill="none">
    <line x1="154" y1="397" x2="178" y2="397"/><line x1="310" y1="397" x2="334" y2="397"/>
    <line x1="506" y1="397" x2="530" y2="397"/><line x1="652" y1="397" x2="676" y2="397"/>
    <line x1="790" y1="397" x2="810" y2="397"/>
    <line x1="421" y1="352" x2="421" y2="302"/>
  </g>

  <!-- cross-cutting -->
  <rect x="20" y="564" width="920" height="60" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <g font-size="13" fill="#4c1d95">
    <text x="36" y="588" font-weight="bold">Cross-cutting</text>
    <text x="36" y="610">OpenTelemetry traces and metrics (TTFT, P95, tokens, cost) | online evaluation sampling | audit log | secrets manager | clients: web widget, MCP hosts, agents</text>
  </g>
</svg>
