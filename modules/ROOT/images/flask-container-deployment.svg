<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" color="#808080">
  <title>Bookshelf on Kubernetes</title>
  <desc>An Ingress sends requests to a Service, which balances them across three web Pods running Gunicorn; a migration Job and a Celery worker Deployment use the same image, and the configuration comes from a ConfigMap and a Secret.</desc>
  <defs>
    <marker id="fcd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="currentColor" text-anchor="middle">One image, three workloads</text>
  <text x="360" y="44" font-size="12" fill="currentColor" text-anchor="middle" opacity="0.8">the web Deployment, the migration Job and the worker differ only in command and credentials</text>

  <rect x="10" y="64" width="700" height="366" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="24" y="84" font-size="12" fill="currentColor" opacity="0.8">namespace bookshelf</text>

  <rect x="24" y="150" width="96" height="52" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="72" y="172" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Ingress</text>
  <text x="72" y="189" font-size="11" fill="currentColor" text-anchor="middle">TLS, host, path</text>

  <rect x="150" y="150" width="96" height="52" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="198" y="172" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Service</text>
  <text x="198" y="189" font-size="11" fill="currentColor" text-anchor="middle">ClusterIP :80</text>

  <rect x="290" y="96" width="400" height="168" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="304" y="116" font-size="13" font-weight="bold" fill="currentColor">Deployment bookshelf-web (3 replicas, HPA)</text>
  <rect x="304" y="128" width="116" height="122" rx="5" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/>
  <rect x="436" y="128" width="116" height="122" rx="5" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/>
  <rect x="568" y="128" width="108" height="122" rx="5" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"/>
  <g font-size="11" fill="currentColor" text-anchor="middle">
    <text x="362" y="148" font-weight="bold">Pod</text>
    <text x="362" y="168">Gunicorn master</text>
    <text x="362" y="184">2 workers x 4 threads</text>
    <text x="362" y="204">/healthz /readyz</text>
    <text x="362" y="224">emptyDir /tmp</text>
    <text x="494" y="148" font-weight="bold">Pod</text>
    <text x="494" y="168">Gunicorn master</text>
    <text x="494" y="184">2 workers x 4 threads</text>
    <text x="494" y="204">/healthz /readyz</text>
    <text x="494" y="224">emptyDir /tmp</text>
    <text x="622" y="148" font-weight="bold">Pod</text>
    <text x="622" y="168">Gunicorn master</text>
    <text x="622" y="184">2 workers x 4 threads</text>
    <text x="622" y="204">/healthz /readyz</text>
    <text x="622" y="224">emptyDir /tmp</text>
  </g>

  <line x1="120" y1="176" x2="148" y2="176" stroke="currentColor" stroke-width="1.5" marker-end="url(#fcd-arrow)"/>
  <line x1="246" y1="176" x2="286" y2="176" stroke="currentColor" stroke-width="1.5" marker-end="url(#fcd-arrow)"/>
  <text x="72" y="140" font-size="11" fill="currentColor" text-anchor="middle">from the internet</text>

  <rect x="24" y="300" width="150" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="99" y="322" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">ConfigMap</text>
  <text x="99" y="340" font-size="11" fill="currentColor" text-anchor="middle">proxy hops, workers</text>
  <rect x="24" y="368" width="150" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="99" y="388" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Secret</text>
  <text x="99" y="404" font-size="11" fill="currentColor" text-anchor="middle">secret key, DB URL</text>

  <rect x="220" y="300" width="150" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="295" y="322" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Job migrate</text>
  <text x="295" y="340" font-size="11" fill="currentColor" text-anchor="middle">flask db upgrade, once</text>
  <rect x="220" y="368" width="150" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="295" y="388" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Deployment worker</text>
  <text x="295" y="404" font-size="11" fill="currentColor" text-anchor="middle">celery worker</text>

  <rect x="470" y="300" width="130" height="56" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="535" y="322" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">PostgreSQL</text>
  <text x="535" y="340" font-size="11" fill="currentColor" text-anchor="middle">managed or StatefulSet</text>
  <rect x="470" y="368" width="130" height="46" rx="6" fill="#808080" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
  <text x="535" y="388" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">Redis</text>
  <text x="535" y="404" font-size="11" fill="currentColor" text-anchor="middle">broker and cache</text>

  <line x1="370" y1="328" x2="468" y2="328" stroke="currentColor" stroke-width="1.5" marker-end="url(#fcd-arrow)"/>
  <line x1="370" y1="391" x2="468" y2="391" stroke="currentColor" stroke-width="1.5" marker-end="url(#fcd-arrow)"/>
  <line x1="552" y1="264" x2="535" y2="298" stroke="currentColor" stroke-width="1.5" marker-end="url(#fcd-arrow)"/>
  <line x1="176" y1="328" x2="218" y2="328" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fcd-arrow)"/>
  <line x1="176" y1="391" x2="218" y2="391" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fcd-arrow)"/>
  <text x="657" y="388" font-size="11" fill="currentColor" text-anchor="middle">dashed: environment for</text>
  <text x="657" y="404" font-size="11" fill="currentColor" text-anchor="middle">web, Job and worker</text>
</svg>
