<svg viewBox="0 0 760 470" width="760" height="470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="oxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">OpenXR: application, loader, API layers and runtime</text>
<rect x="20" y="60" width="150" height="90" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="95.0" y="85.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">Application</text>
<text x="95.0" y="102.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">engine or app</text>
<text x="95.0" y="118.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">calls xr* functions</text>
<text x="95.0" y="134.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">for every device</text>
<rect x="200" y="60" width="130" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="265.0" y="85.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Loader</text>
<text x="265.0" y="102.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">openxr_loader</text>
<text x="265.0" y="118.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">single entry point</text>
<text x="265.0" y="134.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">finds the runtime</text>
<rect x="360" y="60" width="150" height="90" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="435.0" y="85.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">API layers</text>
<text x="435.0" y="102.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">optional: validation,</text>
<text x="435.0" y="118.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">logging, extra checks</text>
<text x="435.0" y="134.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(enabled by name)</text>
<rect x="540" y="60" width="200" height="90" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="640.0" y="85.0" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Runtime</text>
<text x="640.0" y="102.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">implements the API for</text>
<text x="640.0" y="118.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">one vendor or device</text>
<text x="640.0" y="134.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">(one active at a time)</text>
<line x1="170" y1="105" x2="198" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#oxa)"/>
<line x1="330" y1="105" x2="358" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#oxa)"/>
<line x1="510" y1="105" x2="538" y2="105" stroke="#4B5563" stroke-width="1.5" marker-end="url(#oxa)"/>
<text x="350" y="172" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">calls flow left to right through the loader, then any enabled layers, then the active runtime</text>
<rect x="540" y="196" width="90" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="585.0" y="214.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Meta Quest</text>
<text x="585.0" y="229.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">SteamVR</text>
<rect x="650" y="196" width="90" height="44" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="695.0" y="214.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Monado</text>
<text x="695.0" y="229.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Android XR</text>
<text x="640" y="262" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="middle">examples of runtimes</text>
<line x1="640" y1="150" x2="640" y2="190" stroke="#9CA3AF" stroke-width="1.2"/>
<rect x="540" y="290" width="200" height="52" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="640.0" y="304.0" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Device</text>
<text x="640.0" y="321.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">display, tracking, input,</text>
<text x="640.0" y="337.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">compositor</text>
<line x1="640" y1="270" x2="640" y2="290" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="380" y="372" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Application objects, created in this order</text>
<rect x="20" y="386" width="120" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80.0" y="412.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">XrInstance</text>
<text x="80.0" y="428.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">loads the runtime</text>
<rect x="170" y="386" width="120" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="230.0" y="412.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">XrSystemId</text>
<text x="230.0" y="428.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">picks the headset</text>
<line x1="140" y1="416" x2="168" y2="416" stroke="#4B5563" stroke-width="1.5" marker-end="url(#oxa)"/>
<rect x="320" y="386" width="120" height="60" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="380.0" y="412.0" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">XrSession</text>
<text x="380.0" y="428.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">drives frames</text>
<line x1="290" y1="416" x2="318" y2="416" stroke="#4B5563" stroke-width="1.5" marker-end="url(#oxa)"/>
<rect x="470" y="386" width="120" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="530.0" y="412.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">XrSpace</text>
<text x="530.0" y="428.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">poses per frame</text>
<line x1="440" y1="416" x2="468" y2="416" stroke="#4B5563" stroke-width="1.5" marker-end="url(#oxa)"/>
<rect x="620" y="386" width="120" height="60" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="680.0" y="412.0" font-size="13" font-weight="bold" fill="#3730A3" text-anchor="middle">XrSwapchain</text>
<text x="680.0" y="428.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">render targets</text>
<line x1="590" y1="416" x2="618" y2="416" stroke="#4B5563" stroke-width="1.5" marker-end="url(#oxa)"/>
</svg>
