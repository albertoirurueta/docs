<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
  <defs>
    <marker id="dcarrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="270" y="10" width="160" height="40" rx="6" fill="#eeeeee" stroke="#888" stroke-width="2"/>
  <text x="350" y="35" text-anchor="middle" font-size="12" fill="#333">What do you need?</text>

  <!-- branches -->
  <g font-size="11">
    <line x1="350" y1="50" x2="90" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#dcarrow)"/>
    <text x="150" y="75" text-anchor="middle" fill="#555">need keyed lookup</text>

    <line x1="350" y1="50" x2="350" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#dcarrow)"/>
    <text x="350" y="75" text-anchor="middle" fill="#555">sequence, resizable</text>

    <line x1="350" y1="50" x2="610" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#dcarrow)"/>
    <text x="560" y="75" text-anchor="middle" fill="#555">fixed size, known at compile time</text>
  </g>

  <!-- keyed lookup subtree -->
  <rect x="10" y="95" width="160" height="34" rx="5" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="90" y="116" text-anchor="middle" font-size="11" fill="#1c4b73">need ordering too?</text>
  <line x1="60" y1="129" x2="30" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#dcarrow)"/>
  <text x="20" y="150" font-size="10" fill="#555">yes</text>
  <rect x="0" y="170" width="90" height="34" rx="5" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="45" y="191" text-anchor="middle" font-size="10" fill="#2a6636">map / set</text>

  <line x1="120" y1="129" x2="140" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#dcarrow)"/>
  <text x="150" y="150" font-size="10" fill="#555">no, want O(1) avg</text>
  <rect x="95" y="170" width="150" height="34" rx="5" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="170" y="191" text-anchor="middle" font-size="10" fill="#2a6636">unordered_map / _set</text>

  <line x1="90" y1="204" x2="90" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#dcarrow)"/>
  <text x="180" y="228" font-size="10" fill="#555">sorted keys, read-heavy, cache matters</text>
  <rect x="10" y="245" width="160" height="34" rx="5" fill="#f6d9a4" stroke="#8a5a10" stroke-width="2"/>
  <text x="90" y="266" text-anchor="middle" font-size="10" fill="#6b4207">flat_map / flat_set (C++23)</text>

  <!-- sequence subtree -->
  <rect x="270" y="95" width="160" height="34" rx="5" fill="#cfe4fb" stroke="#2f6fa8" stroke-width="2"/>
  <text x="350" y="116" text-anchor="middle" font-size="11" fill="#1c4b73">where does insert/erase happen?</text>

  <line x1="300" y1="129" x2="270" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#dcarrow)"/>
  <text x="255" y="150" font-size="10" fill="#555">random access needed</text>
  <rect x="230" y="170" width="90" height="34" rx="5" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="275" y="191" text-anchor="middle" font-size="10" fill="#2a6636">vector</text>

  <line x1="360" y1="129" x2="400" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#dcarrow)"/>
  <text x="415" y="150" font-size="10" fill="#555">both ends only</text>
  <rect x="330" y="170" width="90" height="34" rx="5" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="375" y="191" text-anchor="middle" font-size="10" fill="#2a6636">deque</text>

  <line x1="420" y1="129" x2="480" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#dcarrow)"/>
  <text x="500" y="150" font-size="10" fill="#555">middle, frequently</text>
  <rect x="430" y="170" width="90" height="34" rx="5" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="475" y="191" text-anchor="middle" font-size="10" fill="#2a6636">list</text>

  <!-- fixed size -->
  <rect x="560" y="95" width="120" height="34" rx="5" fill="#d3ead6" stroke="#3f8f4f" stroke-width="2"/>
  <text x="620" y="116" text-anchor="middle" font-size="11" fill="#2a6636">array&lt;T, N&gt;</text>

  <text x="350" y="320" text-anchor="middle" font-size="12" fill="#333">Default to vector when unsure -- it is contiguous, cache-friendly, and covers most</text>
  <text x="350" y="338" text-anchor="middle" font-size="12" fill="#333">use cases; reach for a specialized container only once a real requirement demands it.</text>
</svg>
