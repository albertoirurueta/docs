<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">WooCommerce security incidents and advisories from 2021 to 2026</title>
  <desc id="d">A timeline with six entries. July 2021: an SQL injection in the WooCommerce Blocks package (CVE-2021-32789, CVSS 7.5) and in WooCommerce 3.3.0 to 3.3.6 (CVE-2021-32790, CVSS 4.9), patched in more than 90 releases and pushed to stores by a forced update from 14 to 23 July. April 2023: CVE-2023-28121, an authentication bypass in the WooPayments plugin, CVSS 9.8. June 2024: CVE-2024-37297, cross-site scripting introduced in 8.8 through the order attribution script, CVSS 5.4, fixed in 8.8.5 and 8.9.3. December 2025: CVE-2025-15033, guest order data readable by logged-in customers in 8.1 to 10.4.2, CVSS 6.5, fixed in 10.4.3 and point releases back to 8.1.3. March 2026: CVE-2026-3589, unauthenticated cross-site request forgery through the Store API batch endpoint in 5.4.0 to 10.5.2, CVSS 7.5, fixed in 10.5.3 on 2 March. October 2026: WooCommerce 11.2.0 is a release that includes security fixes.</desc>
  <rect x="0" y="0" width="1000" height="560" rx="14" fill="#2b3a4a"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f5f8"/>
    </marker>
  </defs>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#f2f5f8">Six entries from the WooCommerce security record, 2021 to 2026</text>
  <line x1="30" y1="150" x2="970" y2="150" stroke="#f2f5f8" stroke-width="3" marker-end="url(#a)"/>
  <g fill="#f2f5f8" font-size="12.5">
    <circle cx="90" cy="150" r="9" fill="#f4b860"/>
    <circle cx="240" cy="150" r="9" fill="#f4b860"/>
    <circle cx="390" cy="150" r="9" fill="#4d7c5a"/>
    <circle cx="540" cy="150" r="9" fill="#4d7c5a"/>
    <circle cx="690" cy="150" r="9" fill="#4d7c5a"/>
    <circle cx="840" cy="150" r="9" fill="#3f6e9a"/>
    <text x="90" y="124" text-anchor="middle" font-weight="bold">Jul 2021</text>
    <text x="240" y="124" text-anchor="middle" font-weight="bold">Apr 2023</text>
    <text x="390" y="124" text-anchor="middle" font-weight="bold">Jun 2024</text>
    <text x="540" y="124" text-anchor="middle" font-weight="bold">Dec 2025</text>
    <text x="690" y="124" text-anchor="middle" font-weight="bold">Mar 2026</text>
    <text x="840" y="124" text-anchor="middle" font-weight="bold">Oct 2026</text>

    <rect x="20" y="180" width="140" height="290" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="30" y="202" font-weight="bold">SQL injection</text>
    <text x="30" y="222">CVE-2021-32789</text>
    <text x="30" y="238">Blocks 2.5.0+,</text>
    <text x="30" y="254">CVSS 7.5, no login</text>
    <text x="30" y="278">CVE-2021-32790</text>
    <text x="30" y="294">core 3.3.0-3.3.6,</text>
    <text x="30" y="310">CVSS 4.9, needs</text>
    <text x="30" y="326">admin or API key</text>
    <text x="30" y="350">90+ patched</text>
    <text x="30" y="366">releases; forced</text>
    <text x="30" y="382">update from</text>
    <text x="30" y="398">2021-07-14 until</text>
    <text x="30" y="414">5.5.2 on 07-23</text>
    <text x="30" y="438" fill="#f4b860">Reported through</text>
    <text x="30" y="454" fill="#f4b860">HackerOne</text>

    <rect x="170" y="180" width="140" height="290" rx="10" fill="#7a5c3a" stroke="#f2f5f8"/>
    <text x="180" y="202" font-weight="bold">WooPayments</text>
    <text x="180" y="222">CVE-2023-28121</text>
    <text x="180" y="238">authentication</text>
    <text x="180" y="254">bypass: requests</text>
    <text x="180" y="270">sent as an</text>
    <text x="180" y="286">administrator</text>
    <text x="180" y="310">CVSS 9.8,</text>
    <text x="180" y="326">no login needed</text>
    <text x="180" y="350">Versions 5.6.1</text>
    <text x="180" y="366">and lower</text>
    <text x="180" y="390">NVD publication</text>
    <text x="180" y="406">2023-04-12</text>
    <text x="180" y="438" fill="#f4b860">A payment plugin,</text>
    <text x="180" y="454" fill="#f4b860">not core</text>

    <rect x="320" y="180" width="140" height="290" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="330" y="202" font-weight="bold">Reflected XSS</text>
    <text x="330" y="222">CVE-2024-37297</text>
    <text x="330" y="238">introduced in 8.8:</text>
    <text x="330" y="254">a crafted link and</text>
    <text x="330" y="270">the order</text>
    <text x="330" y="286">attribution script</text>
    <text x="330" y="310">CVSS 5.4</text>
    <text x="330" y="334">Fixed in 8.8.5</text>
    <text x="330" y="350">and 8.9.3</text>
    <text x="330" y="374">Workaround:</text>
    <text x="330" y="390">switch off Order</text>
    <text x="330" y="406">Attribution</text>
    <text x="330" y="438" fill="#f4b860">NVD 2024-06-12</text>

    <rect x="470" y="180" width="140" height="290" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="480" y="202" font-weight="bold">Guest order data</text>
    <text x="480" y="222">CVE-2025-15033</text>
    <text x="480" y="238">logged-in</text>
    <text x="480" y="254">customers could</text>
    <text x="480" y="270">read guest orders</text>
    <text x="480" y="286">in 8.1 to 10.4.2</text>
    <text x="480" y="310">CVSS 6.5</text>
    <text x="480" y="334">Fixed in 10.4.3 and</text>
    <text x="480" y="350">point releases back</text>
    <text x="480" y="366">to 8.1.3</text>
    <text x="480" y="438" fill="#f4b860">Patched below the</text>
    <text x="480" y="454" fill="#f4b860">CVSS 9 threshold</text>

    <rect x="620" y="180" width="140" height="290" rx="10" fill="#4d7c5a" stroke="#f2f5f8"/>
    <text x="630" y="202" font-weight="bold">Batch endpoint</text>
    <text x="630" y="222">CVE-2026-3589</text>
    <text x="630" y="238">Store API batch</text>
    <text x="630" y="254">path handling lets</text>
    <text x="630" y="270">a request ride a</text>
    <text x="630" y="286">logged-in admin</text>
    <text x="630" y="302">(CSRF), 5.4.0 to</text>
    <text x="630" y="318">10.5.2</text>
    <text x="630" y="342">CVSS 7.5</text>
    <text x="630" y="366">Fixed in 10.5.3</text>
    <text x="630" y="382">on 2026-03-02</text>
    <text x="630" y="438" fill="#f4b860">NVD 2026-03-06</text>

    <rect x="770" y="180" width="140" height="290" rx="10" fill="#3f6e9a" stroke="#f2f5f8"/>
    <text x="780" y="202" font-weight="bold">WooCommerce 11.2</text>
    <text x="780" y="222">2026-10-07: the</text>
    <text x="780" y="238">release notes say</text>
    <text x="780" y="254">to update all stores</text>
    <text x="780" y="270">because it carries</text>
    <text x="780" y="286">security fixes</text>
    <text x="780" y="310">11.2.1 followed on</text>
    <text x="780" y="326">2026-10-09 with</text>
    <text x="780" y="342">checkout fixes</text>
    <text x="780" y="438" fill="#f4b860">Backport floor now</text>
    <text x="780" y="454" fill="#f4b860">9.2</text>
  </g>
  <g fill="#f2f5f8" font-size="12.5">
    <text x="20" y="500">Amber: the 2021 forced-update incident and the separate WooPayments plugin. Green: core issues fixed in ordinary point releases.</text>
    <text x="20" y="520">CVSS scores are the NVD base scores; the 2021 post called the Blocks flaw critical while NVD scores it 7.5 (High).</text>
    <text x="20" y="540">Sources: NVD, the WooCommerce posts of 2021-07-15 and 2026-10-07, and the changelog. Checked 2026-10-27.</text>
  </g>
</svg>
