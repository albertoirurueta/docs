<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4B5563"/></marker></defs>
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Storyboard: select the Add to shelf button without the mouse</text>
  <rect x="20" y="50" width="160" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="40" y="90" width="120" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="55" y="160" width="90" height="20" rx="10" fill="#4F46E5"/>
  <text x="100" y="212" font-size="12" fill="#374151" text-anchor="middle">Nothing selected</text>
  <circle cx="34" cy="64" r="11" fill="#4F46E5"/><text x="34" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="210" y="50" width="160" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="230" y="90" width="120" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="245" y="160" width="90" height="20" rx="10" fill="#4F46E5"/>
  <circle cx="300" cy="125" r="5" fill="#B45309"/>
  <text x="290" y="212" font-size="12" fill="#374151" text-anchor="middle">Keyboard box selection</text>
  <text x="290" y="230" font-size="12" fill="#374151" text-anchor="middle">tool active, arrows move</text>
  <circle cx="224" cy="64" r="11" fill="#4F46E5"/><text x="224" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="400" y="50" width="160" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="420" y="90" width="120" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="435" y="160" width="90" height="20" rx="10" fill="#4F46E5"/>
  <circle cx="480" cy="170" r="5" fill="#B45309"/>
  <text x="480" y="212" font-size="12" fill="#374151" text-anchor="middle">Return selects the</text>
  <text x="480" y="230" font-size="12" fill="#374151" text-anchor="middle">object under the cursor</text>
  <circle cx="414" cy="64" r="11" fill="#4F46E5"/><text x="414" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="590" y="50" width="150" height="200" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="610" y="90" width="110" height="100" rx="6" fill="#EEF2FF" stroke="#4F46E5"/>
  <rect x="623" y="160" width="84" height="20" rx="10" fill="#4F46E5" stroke="#B45309" stroke-width="3"/>
  <text x="665" y="212" font-size="12" fill="#374151" text-anchor="middle">Selected: Tab moves</text>
  <text x="665" y="230" font-size="12" fill="#374151" text-anchor="middle">between child layers</text>
  <circle cx="604" cy="64" r="11" fill="#B45309"/><text x="604" y="68" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <path d="M182,150 L208,150" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M372,150 L398,150" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M562,150 L588,150" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <text x="380" y="282" font-size="12" fill="#374151" text-anchor="middle">F6 (macOS) or Ctrl F6 (Windows) moves focus to the toolbar; Esc closes the selection tool.</text>
</svg>
