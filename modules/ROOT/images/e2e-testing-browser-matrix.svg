<svg viewBox="0 0 960 510" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Browser support matrix: which engines and browsers Playwright, Cypress and Selenium can drive, from Chromium and Chrome through Edge, Firefox, WebKit and Safari to emulated and real mobile devices</title>
<desc>Rows are browsers and devices grouped by engine. Columns are Playwright, Cypress and Selenium. A cell is marked supported, partial or experimental, or not supported, with a short note such as the channel option, the driver or the caveat.</desc>
<rect width="960" height="510" fill="#ffffff"/>
<text x="480" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">What each tool can drive</text>
<text x="20" y="62" font-size="12" font-weight="bold" fill="#222">Browser or device</text>
<text x="255" y="62" font-size="12" font-weight="bold" fill="#222">Engine</text>
<text x="355" y="62" font-size="12" font-weight="bold" fill="#222">Playwright 1.64</text>
<text x="550" y="62" font-size="12" font-weight="bold" fill="#222">Cypress 16.2</text>
<text x="745" y="62" font-size="12" font-weight="bold" fill="#222">Selenium 4.51</text>
<line x1="20" y1="70" x2="940" y2="70" stroke="#37474f" stroke-width="1.5"/>
<rect x="20" y="78" width="920" height="44" fill="#f5f7f8"/>
<text x="26" y="104" font-size="12" fill="#222">Chromium (open-source build)</text>
<text x="255" y="104" font-size="12" fill="#444">Chromium</text>
<rect x="354" y="84" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="362" y="97" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="362" y="109" font-size="10" fill="#333">bundled build, headless shell</text>
<rect x="549" y="84" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="557" y="97" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="557" y="109" font-size="10" fill="#333">chromium, if installed</text>
<rect x="744" y="84" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="752" y="97" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="752" y="109" font-size="10" fill="#333">chromedriver</text>
<text x="26" y="148" font-size="12" fill="#222">Google Chrome (stable, beta, dev)</text>
<text x="255" y="148" font-size="12" fill="#444">Chromium</text>
<rect x="354" y="128" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="362" y="141" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="362" y="153" font-size="10" fill="#333">channel: chrome</text>
<rect x="549" y="128" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="557" y="141" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="557" y="153" font-size="10" fill="#333">chrome, chrome:beta</text>
<rect x="744" y="128" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="752" y="141" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="752" y="153" font-size="10" fill="#333">chromedriver</text>
<rect x="20" y="166" width="920" height="44" fill="#f5f7f8"/>
<text x="26" y="192" font-size="12" fill="#222">Microsoft Edge</text>
<text x="255" y="192" font-size="12" fill="#444">Chromium</text>
<rect x="354" y="172" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="362" y="185" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="362" y="197" font-size="10" fill="#333">channel: msedge</text>
<rect x="549" y="172" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="557" y="185" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="557" y="197" font-size="10" fill="#333">edge</text>
<rect x="744" y="172" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="752" y="185" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="752" y="197" font-size="10" fill="#333">msedgedriver</text>
<text x="26" y="236" font-size="12" fill="#222">Firefox</text>
<text x="255" y="236" font-size="12" fill="#444">Gecko</text>
<rect x="354" y="216" width="180" height="32" rx="5" fill="#fff8e1" stroke="#b26a00" stroke-width="1.2"/>
<text x="362" y="229" font-size="11" font-weight="bold" fill="#b26a00">Partial</text>
<text x="362" y="241" font-size="10" fill="#333">patched build, not release</text>
<rect x="549" y="216" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="557" y="229" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="557" y="241" font-size="10" fill="#333">release, 140 or later</text>
<rect x="744" y="216" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="752" y="229" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="752" y="241" font-size="10" fill="#333">geckodriver</text>
<rect x="20" y="254" width="920" height="44" fill="#f5f7f8"/>
<text x="26" y="280" font-size="12" fill="#222">WebKit engine (Linux, Windows, macOS)</text>
<text x="255" y="280" font-size="12" fill="#444">WebKit</text>
<rect x="354" y="260" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="362" y="273" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="362" y="285" font-size="10" fill="#333">bundled build</text>
<rect x="549" y="260" width="180" height="32" rx="5" fill="#fff8e1" stroke="#b26a00" stroke-width="1.2"/>
<text x="557" y="273" font-size="11" font-weight="bold" fill="#b26a00">Partial</text>
<text x="557" y="285" font-size="10" fill="#333">experimental</text>
<rect x="744" y="260" width="180" height="32" rx="5" fill="#fff8e1" stroke="#b26a00" stroke-width="1.2"/>
<text x="752" y="273" font-size="11" font-weight="bold" fill="#b26a00">Partial</text>
<text x="752" y="285" font-size="10" fill="#333">WebKitGTK, WPE drivers</text>
<text x="26" y="324" font-size="12" fill="#222">Safari (branded, macOS)</text>
<text x="255" y="324" font-size="12" fill="#444">WebKit</text>
<rect x="354" y="304" width="180" height="32" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1.2"/>
<text x="362" y="317" font-size="11" font-weight="bold" fill="#546e7a">No</text>
<text x="362" y="329" font-size="10" fill="#333">not supported</text>
<rect x="549" y="304" width="180" height="32" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1.2"/>
<text x="557" y="317" font-size="11" font-weight="bold" fill="#546e7a">No</text>
<text x="557" y="329" font-size="10" fill="#333">not supported</text>
<rect x="744" y="304" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="752" y="317" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="752" y="329" font-size="10" fill="#333">safaridriver</text>
<rect x="20" y="342" width="920" height="44" fill="#f5f7f8"/>
<text x="26" y="368" font-size="12" fill="#222">Mobile viewport emulation</text>
<text x="255" y="368" font-size="12" fill="#444">any engine</text>
<rect x="354" y="348" width="180" height="32" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
<text x="362" y="361" font-size="11" font-weight="bold" fill="#2e7d32">Yes</text>
<text x="362" y="373" font-size="10" fill="#333">devices registry</text>
<rect x="549" y="348" width="180" height="32" rx="5" fill="#fff8e1" stroke="#b26a00" stroke-width="1.2"/>
<text x="557" y="361" font-size="11" font-weight="bold" fill="#b26a00">Partial</text>
<text x="557" y="373" font-size="10" fill="#333">viewport only</text>
<rect x="744" y="348" width="180" height="32" rx="5" fill="#fff8e1" stroke="#b26a00" stroke-width="1.2"/>
<text x="752" y="361" font-size="11" font-weight="bold" fill="#b26a00">Partial</text>
<text x="752" y="373" font-size="10" fill="#333">Chromium option only</text>
<text x="26" y="412" font-size="12" fill="#222">Real Android and iOS devices</text>
<text x="255" y="412" font-size="12" fill="#444">device</text>
<rect x="354" y="392" width="180" height="32" rx="5" fill="#fff8e1" stroke="#b26a00" stroke-width="1.2"/>
<text x="362" y="405" font-size="11" font-weight="bold" fill="#b26a00">Partial</text>
<text x="362" y="417" font-size="10" fill="#333">experimental Android</text>
<rect x="549" y="392" width="180" height="32" rx="5" fill="#eceff1" stroke="#546e7a" stroke-width="1.2"/>
<text x="557" y="405" font-size="11" font-weight="bold" fill="#546e7a">No</text>
<text x="557" y="417" font-size="10" fill="#333">not supported</text>
<rect x="744" y="392" width="180" height="32" rx="5" fill="#fff8e1" stroke="#b26a00" stroke-width="1.2"/>
<text x="752" y="405" font-size="11" font-weight="bold" fill="#b26a00">Partial</text>
<text x="752" y="417" font-size="10" fill="#333">through Appium</text>
<line x1="20" y1="434" x2="940" y2="434" stroke="#37474f" stroke-width="1.5"/>
<text x="20" y="456" font-size="11" fill="#333">Yes: documented and supported. Partial: experimental, restricted to one engine, or needs another project. No: not supported.</text>
<text x="20" y="474" font-size="11" fill="#333">Electron is omitted: it is deprecated as a Cypress test browser and is not a browser your users run.</text>
</svg>
