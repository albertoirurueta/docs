<svg viewBox="0 0 760 320" width="760" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah-metal-swiftui-shaders-and-realitykit-interop-low-level-texture" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="760" height="320" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">LowLevelTexture: a compute kernel feeds a RealityKit material</text>
<rect x="20" y="70" width="120" height="64" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="80.0" y="98.8" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">LowLevelTexture</text>
<text x="80.0" y="112.8" font-size="11" font-weight="normal" fill="#3730A3" text-anchor="middle">init(descriptor:)</text>
<rect x="160" y="70" width="120" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="220.0" y="98.8" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">MTLCommandBuffer</text>
<text x="220.0" y="112.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">compute encoder</text>
<rect x="300" y="70" width="120" height="64" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="360.0" y="98.8" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">replace(using:)</text>
<text x="360.0" y="112.8" font-size="11" font-weight="normal" fill="#92400E" text-anchor="middle">returns MTLTexture</text>
<rect x="440" y="70" width="130" height="64" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="505.0" y="98.8" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">kernel writes</text>
<text x="505.0" y="112.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">texture2d write</text>
<rect x="590" y="70" width="150" height="64" rx="8" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="665.0" y="98.8" font-size="11" font-weight="bold" fill="#065F46" text-anchor="middle">TextureResource</text>
<text x="665.0" y="112.8" font-size="11" font-weight="normal" fill="#065F46" text-anchor="middle">UnlitMaterial(texture:)</text>
<line x1="142" y1="102" x2="158" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-swiftui-shaders-and-realitykit-interop-low-level-texture)"/>
<line x1="282" y1="102" x2="298" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-swiftui-shaders-and-realitykit-interop-low-level-texture)"/>
<line x1="422" y1="102" x2="438" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-swiftui-shaders-and-realitykit-interop-low-level-texture)"/>
<line x1="572" y1="102" x2="588" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah-metal-swiftui-shaders-and-realitykit-interop-low-level-texture)"/>
<text x="380" y="175" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">RealityKit applies the new contents when the command buffer completes.</text>
<rect x="20" y="205" width="720" height="50" rx="8" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="380.0" y="226.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">The texture is created once. Each update asks for a writable MTLTexture on a new command buffer,</text>
<text x="380.0" y="240.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">dispatches a kernel, and commits; no CPU copy of the pixels is needed.</text>
<text x="380" y="285" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Descriptor fields mirror MTLTextureDescriptor: size, pixel format, usage and swizzle.</text>
</svg>
