<svg viewBox="0 0 760 424" width="760" height="424" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect width="760" height="424" fill="#FFFFFF"/>
<text x="380.0" y="28" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">The layers between your Unreal project and the GPU</text>
<rect x="40" y="46" width="460" height="50" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="270" y="67" font-size="13" fill="#92400E" text-anchor="middle" font-weight="bold">Your project</text>
<text x="270" y="84" font-size="11" fill="#374151" text-anchor="middle">C++ modules, Blueprints, levels, materials and other assets</text>
<line x1="270" y1="96" x2="270" y2="106" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="106" width="460" height="50" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270" y="127" font-size="13" fill="#3730A3" text-anchor="middle" font-weight="bold">Gameplay framework and systems</text>
<text x="270" y="144" font-size="11" fill="#374151" text-anchor="middle">Actors, Character, Enhanced Input, UMG, StateTree, GAS, Mass</text>
<line x1="270" y1="156" x2="270" y2="166" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="166" width="460" height="50" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270" y="187" font-size="13" fill="#3730A3" text-anchor="middle" font-weight="bold">Engine runtime</text>
<text x="270" y="204" font-size="11" fill="#374151" text-anchor="middle">UObject, Chaos, Niagara, animation, audio, replication</text>
<line x1="270" y1="216" x2="270" y2="226" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="226" width="460" height="50" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270" y="247" font-size="13" fill="#3730A3" text-anchor="middle" font-weight="bold">Renderer</text>
<text x="270" y="264" font-size="11" fill="#374151" text-anchor="middle">Nanite, Lumen, MegaLights, Virtual Shadow Maps, mobile renderer</text>
<line x1="270" y1="276" x2="270" y2="286" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="286" width="460" height="50" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="270" y="307" font-size="13" fill="#3730A3" text-anchor="middle" font-weight="bold">RHI and graphics API</text>
<text x="270" y="324" font-size="11" fill="#374151" text-anchor="middle">Direct3D 12, Vulkan, Metal, OpenGL ES</text>
<line x1="270" y1="336" x2="270" y2="346" stroke="#4B5563" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="346" width="460" height="50" rx="10" fill="#E5E7EB" stroke="#4B5563" stroke-width="1.5"/>
<text x="270" y="367" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="bold">GPU</text>
<text x="270" y="384" font-size="11" fill="#374151" text-anchor="middle">the driver and the hardware of the device</text>
<rect x="530" y="46" width="200" height="110" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
<text x="630" y="68" font-size="12" fill="#92400E" text-anchor="middle" font-weight="bold">You write this</text>
<text x="630" y="88" font-size="11" fill="#374151" text-anchor="middle">Gameplay in C++ or Blueprints,</text>
<text x="630" y="104" font-size="11" fill="#374151" text-anchor="middle">plus the content.</text>
<text x="630" y="120" font-size="11" fill="#374151" text-anchor="middle">The Bookshelf lives here.</text>
<rect x="530" y="166" width="200" height="110" rx="10" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/>
<text x="630" y="188" font-size="12" fill="#047857" text-anchor="middle" font-weight="bold">Epic provides this</text>
<text x="630" y="208" font-size="11" fill="#374151" text-anchor="middle">The whole engine, as a binary</text>
<text x="630" y="224" font-size="11" fill="#374151" text-anchor="middle">install or as source code</text>
<text x="630" y="240" font-size="11" fill="#374151" text-anchor="middle">on GitHub.</text>
<rect x="530" y="286" width="200" height="110" rx="10" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
<text x="630" y="308" font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">The RHI hides the API</text>
<text x="630" y="328" font-size="11" fill="#374151" text-anchor="middle">One renderer, one API per</text>
<text x="630" y="344" font-size="11" fill="#374151" text-anchor="middle">platform. Other sub-sections</text>
<text x="630" y="360" font-size="11" fill="#374151" text-anchor="middle">teach these APIs directly.</text>
</svg>
