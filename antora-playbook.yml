site:
  title: Irurueta Docs
  url: https://www.irurueta.com
  robots: allow
  start_page: ROOT::index.adoc
  keys:
    google_analytics: 'G-RDDFMQ8ENP'
content:
  sources:
    - url: .
      branches: HEAD
    - url: https://github.com/albertoirurueta/hermes.git
      branches:
        # Support version 1.3.0+
        - release_1.{3..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-units.git
      branches:
        # Support version 1.4.0+
        - release_1.{4..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-statistics.git
      branches:
        # Support version 1.4.0+
        - release_1.{4..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-sorting.git
      branches:
        # Support version 1.4.0+
        - release_1.{4..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-algebra.git
      branches:
        # Support version 1.4.0+
        - release_1.{4..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-numerical.git
      branches:
        # Support version 1.6.0+
        - release_1.{6..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-geometry.git
      branches:
        # Support version 1.6.0+
        - release_1.{6..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-geometry-io.git
      branches:
        # Support version 1.6.0+
        - release_1.{6..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-ar.git
      branches:
        # Support version 1.6.0+
        - release_1.{6..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-navigation.git
      branches:
        # Support version 1.8.0+
        - release_1.{8..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-navigation-indoor.git
      branches:
        # Support version 1.6.0+
        - release-1.{6..99}*
        - release_1.{6..99}*
        - release-{2..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-navigation-inertial.git
      branches:
        # Support version 1.10.0+
        - release_1.{10..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-navigation-inertial-extra.git
      branches:
        # Support version 1.10.0+
        - release_1.{8..99}*
        - release_{2..99}*
      start_path: docs
    - url: https://github.com/albertoirurueta/ai-catalog.git
      branches:
        - main
      start_path: docs
    - url: https://github.com/albertoirurueta/irurueta-auth-server.git
      branches:
        # Tracks main until version 1.0.0 is released. Issue #336 then switches this to
        # release_1.{0..99}* and release_{2..99}*.
        - main
      start_path: docs
ui:
  bundle:
    url: ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ui.yml
      contents: |
        static_files:
        - .nojekyll
        - ads.txt
    # WP2: nav-tree.hbs override that renders the top-level navigation groups expanded by default (see CLAUDE.md)
    - path: partials/nav-tree.hbs
      contents: ./ui-overrides/partials/nav-tree.hbs
    - path: .nojekyll
    - path: ads.txt
      contents: |
        google.com, pub-4328417528441783, DIRECT, f08c47fec0942fa0
antora:
  extensions:
    #- require: "@antora/lunr-extension"
    - require: '@antora/collector-extension'
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true
asciidoc:
  attributes:
    mathjax-tex-tags: ams
    mathjax-tex-packages: ams boldsymbol
    experimental: ''
  extensions:
    - '@djencks/asciidoctor-mathjax'
